<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Aufbau digitaler Systeme</title>
  <desc id="desc">Eine Webseite mit Kopfbereich, Menü, Inhalt, Fußzeile, Impressum und Datenschutz.</desc>
  <rect width="960" height="520" fill="#f6f8fb"/>
  <rect x="70" y="48" width="820" height="424" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="3"/>
  <rect x="104" y="88" width="752" height="72" rx="12" fill="#0c5f66"/>
  <text x="132" y="134" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Kopfbereich: Name, Logo, Suche</text>
  <rect x="104" y="184" width="170" height="204" rx="12" fill="#eef4f5" stroke="#d8e1e8"/>
  <text x="132" y="224" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="800" fill="#083f45">Menü</text>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#101828">
    <rect x="128" y="244" width="120" height="32" rx="8" fill="#ffffff"/>
    <text x="144" y="267">Start</text>
    <rect x="128" y="292" width="120" height="32" rx="8" fill="#ffffff"/>
    <text x="144" y="315">Themen</text>
    <rect x="128" y="340" width="120" height="32" rx="8" fill="#ffffff"/>
