  </g>
  <rect x="308" y="184" width="548" height="204" rx="12" fill="#ffffff" stroke="#d8e1e8"/>
  <text x="338" y="226" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="800" fill="#083f45">Inhaltsbereich</text>
  <rect x="338" y="250" width="430" height="18" rx="9" fill="#d8e1e8"/>
  <rect x="338" y="286" width="462" height="18" rx="9" fill="#d8e1e8"/>
  <rect x="338" y="322" width="330" height="18" rx="9" fill="#d8e1e8"/>
  <circle cx="800" cy="286" r="36" fill="#fff7ed" stroke="#d9841f" stroke-width="5"/>
  <text x="800" y="295" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="800" fill="#a35b09">?</text>
