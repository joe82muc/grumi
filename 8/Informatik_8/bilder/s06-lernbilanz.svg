<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Lernbilanz</title>
  <desc id="desc">Drei Lernbereiche mit Haken: Rechnernetze, Informationssysteme und Datenschutz.</desc>
  <rect width="960" height="520" fill="#f6f8fb"/>
  <rect x="64" y="50" width="832" height="420" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="3"/>
  <text x="96" y="104" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="800" fill="#083f45">Lernbilanz: Das kann ich jetzt</text>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <g>
      <rect x="110" y="152" width="220" height="238" rx="18" fill="#eef4f5" stroke="#0c5f66" stroke-width="4"/>
      <circle cx="220" cy="218" r="38" fill="#0c5f66"/>
      <path d="M200 218 L214 234 L242 202" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="220" y="291" text-anchor="middle" font-size="25" font-weight="800" fill="#083f45">Rechnernetze</text>
      <text x="220" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#607084">Client, Server,</text>
      <text x="220" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#607084">Peer-to-Peer</text>
    </g>
    <g>
      <rect x="370" y="152" width="220" height="238" rx="18" fill="#fff7ed" stroke="#d9841f" stroke-width="4"/>
      <circle cx="480" cy="218" r="38" fill="#d9841f"/>
      <path d="M460 218 L474 234 L502 202" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="480" y="291" text-anchor="middle" font-size="24" font-weight="800" fill="#8a4a08">Informations-</text>
      <text x="480" y="321" text-anchor="middle" font-size="24" font-weight="800" fill="#8a4a08">systeme</text>
      <text x="480" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#607084">Nutzen, Aufbau,</text>
      <text x="480" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#607084">Impressum</text>
    </g>
    <g>
      <rect x="630" y="152" width="220" height="238" rx="18" fill="#fee2e2" stroke="#b23a48" stroke-width="4"/>
      <circle cx="740" cy="218" r="38" fill="#b23a48"/>
      <path d="M720 218 L734 234 L762 202" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="740" y="291" text-anchor="middle" font-size="25" font-weight="800" fill="#7f1d1d">Datenschutz</text>
      <text x="740" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#607084">Cookies, Daten-</text>
      <text x="740" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#607084">spuren, Schutz</text>
    </g>
  </g>
  <text x="480" y="438" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="800" fill="#083f45">Zu jedem Begriff: erklären, Beispiel nennen, sicher anwenden.</text>
</svg>
