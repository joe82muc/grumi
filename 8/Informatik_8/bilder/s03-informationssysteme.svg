<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Digitale Informationssysteme</title>
  <desc id="desc">Ein Tablet zeigt Beispiele für digitale Informationssysteme und den Datenfluss im Hintergrund.</desc>
  <rect width="960" height="520" fill="#eef4f5"/>
  <rect x="64" y="52" width="832" height="416" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="3"/>
  <text x="96" y="105" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="800" fill="#083f45">Digitale Informationssysteme</text>
  <rect x="112" y="144" width="316" height="256" rx="32" fill="#101828"/>
  <rect x="136" y="168" width="268" height="188" rx="14" fill="#f6f8fb"/>
  <circle cx="270" cy="378" r="10" fill="#eef4f5"/>
  <g font-family="Source Sans 3, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g>
      <rect x="158" y="190" width="88" height="58" rx="10" fill="#d1fae5"/>
      <text x="202" y="225" font-size="17" fill="#0c5f66">Lernen</text>
    </g>
    <g>
      <rect x="294" y="190" width="88" height="58" rx="10" fill="#fff7ed"/>
      <text x="338" y="225" font-size="17" fill="#a35b09">Fahrplan</text>
    </g>
    <g>
      <rect x="158" y="274" width="88" height="58" rx="10" fill="#dbeafe"/>
      <text x="202" y="309" font-size="17" fill="#1f5f88">Wetter</text>
    </g>
    <g>
      <rect x="294" y="274" width="88" height="58" rx="10" fill="#fee2e2"/>
      <text x="338" y="309" font-size="17" fill="#b23a48">Shop</text>
    </g>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="800" fill="#101828">
    <rect x="520" y="150" width="282" height="58" rx="12" fill="#eef4f5" stroke="#d8e1e8"/>
    <text x="544" y="187">1. Daten eingeben</text>
    <rect x="520" y="232" width="282" height="58" rx="12" fill="#eef4f5" stroke="#d8e1e8"/>
    <text x="544" y="269">2. Daten verarbeiten</text>
    <rect x="520" y="314" width="282" height="58" rx="12" fill="#eef4f5" stroke="#d8e1e8"/>
    <text x="544" y="351">3. Information anzeigen</text>
  </g>
  <path d="M428 262 H498" stroke="#d9841f" stroke-width="8" stroke-linecap="round"/>
  <path d="M492 244 L520 262 L492 280 Z" fill="#d9841f"/>
  <text x="666" y="425" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="21" font-weight="700" fill="#607084">Apps und Webseiten ordnen Informationen für eine Aufgabe.</text>
