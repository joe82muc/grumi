<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Peer-to-Peer und Client-Server</title>
  <desc id="desc">Zwei Netzmodelle werden verglichen: Peer-to-Peer und Client-Server.</desc>
  <rect width="960" height="520" fill="#f6f8fb"/>
  <rect x="42" y="42" width="406" height="436" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="3"/>
  <rect x="512" y="42" width="406" height="436" rx="24" fill="#ffffff" stroke="#d8e1e8" stroke-width="3"/>
  <text x="245" y="92" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="800" fill="#083f45">Peer-to-Peer</text>
  <text x="715" y="92" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="800" fill="#083f45">Client-Server</text>
  <g stroke="#1f5f88" stroke-width="5" opacity=".8">
    <path d="M245 172 L132 250 L176 380 L314 380 L358 250 Z" fill="none"/>
    <path d="M132 250 L314 380 M358 250 L176 380 M245 172 L314 380 M245 172 L176 380"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g fill="#ffffff" stroke="#0c5f66" stroke-width="5">
      <circle cx="245" cy="172" r="35"/><circle cx="132" cy="250" r="35"/><circle cx="358" cy="250" r="35"/><circle cx="176" cy="380" r="35"/><circle cx="314" cy="380" r="35"/>
    </g>
    <text x="245" y="181" font-size="20" fill="#0c5f66">Peer</text>
    <text x="132" y="259" font-size="20" fill="#0c5f66">Peer</text>
    <text x="358" y="259" font-size="20" fill="#0c5f66">Peer</text>
    <text x="176" y="389" font-size="20" fill="#0c5f66">Peer</text>
    <text x="314" y="389" font-size="20" fill="#0c5f66">Peer</text>
  </g>
  <g stroke="#d9841f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#d9841f"/></marker></defs>
    <path d="M636 184 L716 256"/>
    <path d="M796 184 L716 256"/>
    <path d="M616 354 L716 278"/>
    <path d="M816 354 L716 278"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="666" y="218" width="100" height="86" rx="12" fill="#0c5f66"/>
    <line x1="690" y1="243" x2="742" y2="243" stroke="#d1fae5" stroke-width="6"/>
    <line x1="690" y1="270" x2="742" y2="270" stroke="#d1fae5" stroke-width="6"/>
    <text x="716" y="334" font-size="22" fill="#0c5f66">Server</text>
    <g fill="#ffffff" stroke="#1f5f88" stroke-width="5">
      <rect x="590" y="138" width="92" height="64" rx="10"/>
      <rect x="750" y="138" width="92" height="64" rx="10"/>
      <rect x="570" y="322" width="92" height="64" rx="10"/>
      <rect x="770" y="322" width="92" height="64" rx="10"/>
    </g>
    <text x="636" y="126" font-size="20" fill="#1f5f88">Client</text>
    <text x="796" y="126" font-size="20" fill="#1f5f88">Client</text>
    <text x="616" y="418" font-size="20" fill="#1f5f88">Client</text>
    <text x="816" y="418" font-size="20" fill="#1f5f88">Client</text>
  </g>
  <text x="245" y="454" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#607084">Geräte tauschen direkt Daten aus.</text>
  <text x="715" y="454" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#607084">Clients fragen an, der Server antwortet.</text>
</svg>
