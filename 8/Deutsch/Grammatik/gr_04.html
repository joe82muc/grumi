  <script>
  Grammatik.seite({
    nr: 4,
    titel: "Satzreihe, Satzgefüge, Schachtelsatz",
    lead: "Je besser du Sätze verbinden kannst, desto genauer kannst du Zusammenhänge ausdrücken. Hier unterscheidest du Satzarten und Nebensätze – und lernst, wann ein Satz zu verschachtelt wird.",
    ziele: ["Du unterscheidest Satzreihe und Satzgefüge.", "Du bestimmst die Art eines Nebensatzes.", "Du erkennst Schachtelsätze und löst sie auf."],
    merk: [
      { t: "Satzreihe und Satzgefüge", html: `
        <p><b>Satzreihe</b> = Hauptsatz + Hauptsatz (und, aber, denn, oder …):</p>
        <div class="bsp">Ich rief an, aber niemand meldete sich.</div>
        <p><b>Satzgefüge</b> = Hauptsatz + Nebensatz (Verb am Ende):</p>
        <div class="bsp">Ich rief an, weil ich Hilfe brauchte.</div>` },
      { t: "Drei Arten von Nebensätzen", html: `
        <ul><li><b>Konjunktionalsatz</b> – beginnt mit einer Konjunktion: <i>weil es regnet, dass du kommst, wenn ich Zeit habe</i></li>
        <li><b>Relativsatz</b> – beginnt mit einem Relativpronomen: <i>der neben mir sitzt, das ich gelesen habe</i></li>
        <li><b>Indirekter Fragesatz</b> – beginnt mit ob oder einem Fragewort: <i>ob er kommt, wer das war, wie spät es ist</i></li></ul>` },
      { t: "Plus: Der Schachtelsatz", html: `
        <p>Ein Nebensatz kann von einem anderen Nebensatz abhängen. Dann steckt ein Satz im anderen:</p>
        <div class="bsp"><span class="hl-b">Ich glaube</span>, <span class="hl-v">dass der Film</span>, <span class="hl-o">den wir sehen wollen</span>, <span class="hl-v">ausverkauft ist</span>.</div>
        <p>Hauptsatz → Nebensatz 1. Grades (lila) → Nebensatz 2. Grades (orange).</p>
        <p class="merksatz">Zu viele Schachteln machen einen Text schwer lesbar – teile lange Sätze lieber auf.</p>` }
    ],
    fallen: [
      "Nach „denn“ steht das Verb an zweiter Stelle – es leitet keinen Nebensatz ein.",
      "Ein eingeschobener Nebensatz braucht zwei Kommas: Der Hund**,** der bellt**,** gehört uns.",
      "„ob“ leitet einen Nebensatz ein: Ich weiß nicht, ob er kommt."
    ],
    basis: [
      { typ: "wahl", t: "Satzreihe oder Satzgefüge?", tipp: "Steht in einem Teilsatz das Verb am Ende? Dann ist es ein Nebensatz.",
        items: [
          { s: "Wir wollten grillen, doch es fing an zu regnen.", o: ["Satzreihe", "Satzgefüge"], a: 0 },
          { s: "Wir grillten trotzdem, obwohl es regnete.", o: ["Satzreihe", "Satzgefüge"], a: 1 },
          { s: "Ich weiß nicht, wer gewonnen hat.", o: ["Satzreihe", "Satzgefüge"], a: 1 },
          { s: "Elif liest gern, ihr Bruder spielt lieber Fußball.", o: ["Satzreihe", "Satzgefüge"], a: 0 },
          { s: "Das ist der Weg, der zum See führt.", o: ["Satzreihe", "Satzgefüge"], a: 1 }
        ] },
      { typ: "markieren", t: "Markiere Hauptsätze blau und Nebensätze lila.", stifte: [["b", "Hauptsatz"], ["v", "Nebensatz"]],
        tipp: "Ein Hauptsatz kann durch einen eingeschobenen Nebensatz in zwei Teile geteilt sein.",
        items: ["[b:Ich bleibe zu Hause], [v:weil ich erkältet bin].", "[v:Als der Regen aufhörte], [b:gingen wir los].",
                "[b:Der Hund], [v:der im Garten bellt], [b:gehört Frau Kaya]."] },
      { typ: "zuordnen", t: "Welche Art von Nebensatz ist das?", tipp: "Konjunktion, Relativpronomen oder ob/Fragewort am Anfang?",
        gruppen: ["Konjunktionalsatz", "Relativsatz", "indirekter Fragesatz"],
        karten: [["weil es regnet", 0], ["dass du kommst", 0], ["wenn ich Zeit habe", 0], ["der neben mir sitzt", 1], ["das ich gelesen habe", 1],
                 ["die uns hilft", 1], ["ob er kommt", 2], ["wer das war", 2], ["wie spät es ist", 2]] },
      { typ: "luecke", t: "Wähle das Einleitewort, das passt.", tipp: "Grund, Zeit, Gegensatz, Bedingung – oder eine Frage?",
        items: ["{{Obwohl|Weil|Damit}} der Film lang war, war er nie langweilig.", "Sag mir bitte, {{ob|dass|weil}} du am Samstag Zeit hast.",
                "{{Sobald|Obwohl|Damit}} die Glocke läutet, ist Pause.", "Das ist das Fahrrad, {{das|dass|was}} ich mir wünsche."] },
      { typ: "umformen", t: "Verbinde die Sätze zu einem Satzgefüge.", tipp: "Das Wort in Klammern leitet den Nebensatz ein. Das Verb rutscht ans Ende.",
        items: [
          { s: "Ich lese ein Buch. Es ist sehr spannend. (das)", l: ["Ich lese ein Buch, das sehr spannend ist."] },
          { s: "Ich hoffe es. Du kommst zu meiner Party. (dass)", l: ["Ich hoffe, dass du zu meiner Party kommst."] },
          { s: "Er weiß es nicht. Wann fährt der Zug? (wann)", l: ["Er weiß nicht, wann der Zug fährt."] }
        ] },
      { typ: "komma", t: "Setze die Kommas.", tipp: "Jeder Nebensatz wird abgetrennt – ein eingeschobener vorn und hinten.",
        items: ["Ich weiß nicht, ob er kommt.", "Das Buch, das ich lese, ist spannend.", "Obwohl es kalt war, gingen wir baden.", "Wir fragen uns, wer gewonnen hat."] }
    ],
    plus: [
      { typ: "markieren", t: "Schachtelsätze: Markiere Hauptsatz, Nebensatz 1. und 2. Grades.", stifte: [["b", "Hauptsatz"], ["v", "Nebensatz 1. Grades"], ["o", "Nebensatz 2. Grades"]],
        tipp: "Der Nebensatz 2. Grades hängt von einem anderen Nebensatz ab – er steckt oft mittendrin.",
        items: ["[b:Ich glaube], [v:dass der Film], [o:den wir sehen wollen], [v:ausverkauft ist].",
                "[b:Lena erzählt], [v:dass ihr Bruder], [o:der in Berlin wohnt], [v:bald heiratet].",
                "[b:Mia fragt], [v:ob das Buch], [o:das auf dem Tisch liegt], [v:ihr gehört]."] },
      { typ: "wahl", t: "Wie viele Nebensätze hat der Satz?",
        items: [
          { s: "Ich weiß, dass du kommst.", o: ["1", "2", "3"], a: 0 },
          { s: "Als wir ankamen, merkten wir, dass das Tor zu war.", o: ["1", "2", "3"], a: 1 },
          { s: "Er sagt, dass das Buch, das er liest, spannend ist, weil es gut geschrieben ist.", o: ["1", "2", "3"], a: 2 }
        ] },
      { typ: "frei", t: "Löse den Schachtelsatz in mehrere kürzere Sätze auf.", quali: true,
        items: [
          { f: "„Der Mann, der den Hund, der gestern weggelaufen war, gefunden hat, bekommt eine Belohnung.“", zeilen: 3,
            kriterien: ["mindestens zwei kürzere Sätze", "Inhalt bleibt gleich: Der Hund war weggelaufen, ein Mann hat ihn gefunden, der Mann bekommt eine Belohnung"],
            muster: "hund.*\\..*\\S.*\\.",
            bsp: "Gestern war ein Hund weggelaufen. Ein Mann hat ihn gefunden. Dafür bekommt er eine Belohnung." }
        ] }
    ]
  });
