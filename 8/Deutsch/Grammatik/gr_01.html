  Grammatik.seite({
    nr: 1,
    titel: "Wortarten und Modalverben",
    lead: "Die Wortarten kennst du – jetzt bestimmst du sie sicher, auch die kniffligen. Dazu kommen die Modalverben: können, dürfen, müssen … Sie verändern, was ein Satz bedeutet.",

    merk: [
      { t: "Die Wortarten", html: `
        <table><tr><th>Wortart</th><th>Aufgabe im Text</th><th>Beispiele</th></tr>
        <tr><td><b>Nomen</b></td><td>benennt Dinge, Lebewesen, Gedanken</td><td>Zukunft, Erlebnis</td></tr>
        <tr><td><b>Verb</b></td><td>sagt, was geschieht</td><td>erklären, er schweigt</td></tr>
        <tr><td><b>Adjektiv</b></td><td>beschreibt Eigenschaften</td><td>ehrlich, dunkel</td></tr>
        <tr><td><b>Artikel / Pronomen</b></td><td>begleiten oder ersetzen Nomen</td><td>der, ein, sie, dieser</td></tr>
        <tr><td><b>Adverb</b></td><td>sagt wann, wo, wie, warum</td><td>oft, dort, hoffentlich</td></tr>
        <tr><td><b>Präposition</b></td><td>zeigt Verhältnisse</td><td>neben, ohne, trotz</td></tr>
        <tr><td><b>Konjunktion</b></td><td>verbindet Wörter und Sätze</td><td>und, obwohl, sondern</td></tr>
        <tr><td><b>Interjektion</b></td><td>drückt Gefühle aus</td><td>au, oh, hurra</td></tr></table>` },
      { t: "Modalverben", html: `
        <table><tr><th>Modalverb</th><th>Bedeutung</th><th>Beispiel</th></tr>
        <tr><td><b>können</b></td><td>Fähigkeit, Möglichkeit</td><td>Ich kann schwimmen.</td></tr>
        <tr><td><b>dürfen</b></td><td>Erlaubnis</td><td>Du darfst länger aufbleiben.</td></tr>
        <tr><td><b>müssen</b></td><td>Notwendigkeit</td><td>Wir müssen um acht da sein.</td></tr>
        <tr><td><b>sollen</b></td><td>Auftrag, Aufforderung</td><td>Du sollst Mama anrufen.</td></tr>
        <tr><td><b>wollen</b></td><td>fester Wille</td><td>Ich will Tierärztin werden.</td></tr>
        <tr><td><b>mögen / möchten</b></td><td>Wunsch</td><td>Ich möchte ein Eis.</td></tr></table>
        <p>Das Modalverb steht an zweiter Stelle, das Vollverb im Infinitiv am Ende.</p>` },
      { t: "Plus: Weitere Modalformen", html: `
        <ul><li><b>Konjunktiv II</b> für Ratschläge: <i>Du solltest mehr schlafen.</i></li>
        <li><b>sein/haben + zu</b> für Notwendigkeit: <i>Die Aufgabe ist bis morgen zu erledigen.</i> (= muss erledigt werden)</li>
        <li><b>Modalwörter</b> für Vermutungen: <i>vielleicht, bestimmt, wahrscheinlich</i></li></ul>` }
    ],
    fallen: [
      "„während“ und „seit“ können Präposition oder Konjunktion sein – schau, ob ein Nomen oder ein ganzer Nebensatz folgt.",

      { typ: "wahl", t: "Bestimme die Wortart des unterstrichenen Wortes.", quali: true, tipp: "Erst fragen: veränderbar oder nicht?",
        items: [
          { s: "__Hoffentlich__ regnet es morgen nicht.", o: ["Nomen", "Adjektiv", "Adverb", "Präposition", "Konjunktion", "Interjektion"], a: 2 },
          { s: "__Au__, das tut weh!", o: ["Nomen", "Adjektiv", "Adverb", "Präposition", "Konjunktion", "Interjektion"], a: 5 },
          { s: "Wir gehen __trotz__ des Regens raus.", o: ["Nomen", "Adjektiv", "Adverb", "Präposition", "Konjunktion", "Interjektion"], a: 3 },
          { s: "Er kommt nicht heute, __sondern__ morgen.", o: ["Nomen", "Adjektiv", "Adverb", "Präposition", "Konjunktion", "Interjektion"], a: 4 },
          { s: "Das __Schwimmen__ macht mir Spaß.", o: ["Nomen", "Adjektiv", "Adverb", "Präposition", "Konjunktion", "Interjektion"], a: 0 },
          { s: "Die Aufgabe ist ziemlich __leicht__.", o: ["Nomen", "Adjektiv", "Adverb", "Präposition", "Konjunktion", "Interjektion"], a: 1 }
        ] },
      { typ: "wahl", t: "Was drückt das Modalverb aus?", tipp: "Schau in die Tabelle im Merkkasten.",
        items: [
          { s: "Ich __kann__ gut schwimmen.", o: ["Fähigkeit", "Erlaubnis", "Notwendigkeit", "Auftrag", "Wille", "Wunsch"], a: 0 },
          { s: "Du __darfst__ heute länger aufbleiben.", o: ["Fähigkeit", "Erlaubnis", "Notwendigkeit", "Auftrag", "Wille", "Wunsch"], a: 1 },
          { s: "Wir __müssen__ um acht Uhr in der Schule sein.", o: ["Fähigkeit", "Erlaubnis", "Notwendigkeit", "Auftrag", "Wille", "Wunsch"], a: 2 },
          { s: "Du __sollst__ deine Mutter zurückrufen.", o: ["Fähigkeit", "Erlaubnis", "Notwendigkeit", "Auftrag", "Wille", "Wunsch"], a: 3 },
          { s: "Ich __will__ unbedingt Tierärztin werden.", o: ["Fähigkeit", "Erlaubnis", "Notwendigkeit", "Auftrag", "Wille", "Wunsch"], a: 4 },
          { s: "Ich __möchte__ bitte ein Glas Wasser.", o: ["Fähigkeit", "Erlaubnis", "Notwendigkeit", "Auftrag", "Wille", "Wunsch"], a: 5 }
        ] },
      { typ: "luecke", t: "Wähle das Modalverb, das zur Bedeutung in Klammern passt.",
        items: ["Mein kleiner Bruder {{kann|darf|muss}} schon lesen. (Fähigkeit)", "Im Kino {{darf|kann|soll}} man nicht telefonieren. (Verbot)",
                "Vor der Probe {{muss|darf|möchte}} ich noch lernen. (Notwendigkeit)", "Ich {{möchte|muss|darf}} später ins Ausland gehen. (Wunsch)"] },
      { typ: "umformen", t: "Sag es kürzer mit einem Modalverb.", tipp: "Es ist nötig → müssen · Es ist erlaubt → dürfen · Ich habe den Wunsch → möchten/wollen",
        items: [
          { s: "Es ist nötig, dass ich lerne.", l: ["Ich muss lernen."] },
          { s: "Es ist erlaubt, hier zu parken.", l: ["Man darf hier parken.", "Hier darf man parken."] },
          { s: "Ich habe den Wunsch, Pilot zu werden.", l: ["Ich möchte Pilot werden.", "Ich will Pilot werden."] }
        ] }
    ],
    plus: [
      { typ: "wahl", t: "Welche Modalform liegt vor?", tipp: "Ratschlag (solltest), Notwendigkeit (ist … zu) oder Vermutung (vielleicht, dürfte)?",
        items: [
          { s: "Du solltest mehr schlafen.", o: ["Ratschlag", "Notwendigkeit", "Vermutung"], a: 0 },
          { s: "Die Aufgabe ist bis morgen zu erledigen.", o: ["Ratschlag", "Notwendigkeit", "Vermutung"], a: 1 },
          { s: "Vielleicht kommt Ben später.", o: ["Ratschlag", "Notwendigkeit", "Vermutung"], a: 2 },
          { s: "Er dürfte schon zu Hause sein.", o: ["Ratschlag", "Notwendigkeit", "Vermutung"], a: 2 }
        ] },
      { typ: "umformen", t: "Ersetze „sein/haben + zu“ durch ein Modalverb.", tipp: "„ist … zu tun“ = muss getan werden · „hat … zu tun“ = muss tun",
        items: [
          { s: "Die Formulare sind bis Freitag abzugeben.", l: ["Die Formulare müssen bis Freitag abgegeben werden."] },
          { s: "Du hast pünktlich zu sein.", l: ["Du musst pünktlich sein."] }
        ] },
      { typ: "frei", t: "Schreibe eine Schulregel mit einem Modalverb.",
        items: [
          { f: "Zum Beispiel für die Pause oder den Computerraum.", kriterien: ["enthält ein Modalverb (dürfen, müssen, sollen, können …)", "ist eine sinnvolle Regel"],

            bsp: "Im Computerraum dürfen wir nichts essen und trinken." }
        ] }
    ]
  });
