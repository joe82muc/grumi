<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b23a48">
  <title>Indirekte Rede | Deutsch 8 Grammatik</title>
  <meta name="description" content="Deutsch 8 Grammatik: Äußerungen anderer in der indirekten Rede wiedergeben – Aussagen, Fragen und Aufforderungen. Mit Basis- und Plus-Aufgaben.">
  <link rel="stylesheet" href="../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../css/grammatik.css">
</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script src="themen.js"></script>
  <script>
  Grammatik.seite({
    nr: 3,
    titel: "Indirekte Rede",
    lead: "Im Bericht, in der Zeitung, in der Inhaltsangabe: Was andere gesagt haben, gibst du in der indirekten Rede wieder. So bleibt klar, dass es ihre Worte sind – nicht deine.",
    ziele: ["Du wandelst Aussagen in indirekte Rede um.", "Du gibst Fragen und Aufforderungen wieder.", "Du verwendest abwechslungsreiche Redeverben."],
    merk: [
      { t: "In vier Schritten", html: `
        <ol><li>Redeverb + Komma statt Doppelpunkt und Anführungszeichen</li>
        <li>Pronomen anpassen: ich → er/sie, wir → sie, mein → sein/ihr</li>
        <li>Verb in den Konjunktiv I (Ersatz: Konjunktiv II)</li>
        <li>Zeit- und Ortsangaben anpassen, wenn nötig</li></ol>
        <div class="bsp">Ben sagt: „Ich habe meinen Ausweis vergessen.“ → Ben sagt, er <b>habe</b> seinen Ausweis vergessen.</div>` },
      { t: "Fragen und Aufforderungen", html: `
        <div class="bsp"><b>Ja/Nein-Frage → ob:</b> „Kommst du mit?“ → Sie fragt, <b>ob</b> er mitkomme.</div>
        <div class="bsp"><b>W-Frage → Fragewort bleibt:</b> „Wo ist der Bus?“ → Er fragt, <b>wo</b> der Bus sei.</div>
        <div class="bsp"><b>Aufforderung → sollen:</b> „Räum auf!“ → Sie sagt, er <b>solle</b> aufräumen.</div>` },
      { t: "Redeverben für Abwechslung", html: `
        <p>Nicht immer „sagen“: <b>erklären, behaupten, betonen, berichten, meinen, fragen, antworten, versprechen, vermuten</b></p>
        <div class="bsp">Die Bürgermeisterin <b>betont</b>, die Schule werde rechtzeitig fertig.</div>` },
      { t: "Plus: Zeit und Ort anpassen", html: `
        <table><tr><th>direkte Rede</th><th>indirekte Rede (Bericht)</th></tr>
        <tr><td>heute</td><td>an diesem Tag</td></tr><tr><td>morgen</td><td>am nächsten Tag</td></tr>
        <tr><td>gestern</td><td>am Vortag</td></tr><tr><td>hier</td><td>dort</td></tr></table>` }
    ],
    fallen: [
      "In der indirekten Rede gibt es keine Anführungszeichen und keinen Doppelpunkt.",
      "Klingt der Konjunktiv I wie die normale Form (sie haben), nimm den Konjunktiv II (sie hätten).",
      "Bei Fragen kein Fragezeichen am Ende: Sie fragt, ob er mitkomme**.**"
    ],
    basis: [
      { typ: "wahl", t: "Direkte oder indirekte Rede?",
        items: [
          { s: "Die Ärztin sagt, ich solle viel trinken.", o: ["direkte Rede", "indirekte Rede"], a: 1 },
          { s: "„Trink viel Wasser“, sagt die Ärztin.", o: ["direkte Rede", "indirekte Rede"], a: 0 },
          { s: "Der Trainer erklärt, das Training beginne um vier.", o: ["direkte Rede", "indirekte Rede"], a: 1 },
          { s: "Mia fragt: „Kommst du mit?“", o: ["direkte Rede", "indirekte Rede"], a: 0 }
        ] },
      { typ: "luecke", t: "Setze das Verb im Konjunktiv I ein.", tipp: "Stamm + e – bei „sein“: sei.",
        items: ["Der Schulleiter sagt, die Turnhalle [[bleibe]] geschlossen. (bleiben)", "Mehmet erzählt, er [[habe]] im Lotto gewonnen. (haben)",
                "Die Polizei meldet, die Straße [[sei]] wieder frei. (sein)", "Lea verspricht, sie [[helfe]] mir morgen. (helfen)"] },
      { typ: "luecke", t: "Passe die Pronomen an.", tipp: "Wer spricht – und über wen?",
        items: ["Paul sagt: „Ich vermisse meinen Hund.“ → Paul sagt, {{er|ich|sie}} vermisse {{seinen|meinen|ihren}} Hund.",
                "Die Zwillinge sagen: „Wir haben unsere Jacken vergessen.“ → Die Zwillinge sagen, {{sie|wir|ihr}} hätten {{ihre|unsere|seine}} Jacken vergessen."] },
      { typ: "umformen", t: "Gib die Aussagen in der indirekten Rede wieder.", tipp: "Komma, Pronomen anpassen, Konjunktiv I.",
        items: [
          { s: "Nina sagt: „Ich bin heute müde.“", l: ["Nina sagt, sie sei heute müde.", "Nina sagt, dass sie heute müde sei."] },
          { s: "Der Hausmeister erklärt: „Die Heizung funktioniert wieder.“", l: ["Der Hausmeister erklärt, die Heizung funktioniere wieder.", "Der Hausmeister erklärt, dass die Heizung wieder funktioniere."] },
          { s: "Tarek behauptet: „Ich kann zehn Kilometer laufen.“", l: ["Tarek behauptet, er könne zehn Kilometer laufen.", "Tarek behauptet, dass er zehn Kilometer laufen könne."] }
        ] },
      { typ: "umformen", t: "Gib die Fragen in der indirekten Rede wieder.", tipp: "Ja/Nein-Frage → ob · W-Frage → Fragewort bleibt",
        items: [
          { s: "Lina fragt Tim: „Hast du Zeit?“", l: ["Lina fragt Tim, ob er Zeit habe."] },
          { s: "Der Lehrer fragt: „Wer hat das Fenster geöffnet?“", l: ["Der Lehrer fragt, wer das Fenster geöffnet habe."] }
        ] },
      { typ: "wahl", t: "Welches Redeverb passt am besten?", tipp: "Was tut die Person beim Sprechen?",
        items: [
          { s: "Der Kapitän ___ , das Schiff sei sicher. (er sagt es mit großem Nachdruck)", o: ["betont", "fragt", "vermutet"], a: 0 },
          { s: "Die Schülerin ___ , ob die Probe verschoben werde.", o: ["fragt", "behauptet", "verspricht"], a: 0 },
          { s: "Opa ___ , er komme morgen ganz sicher. (er gibt sein Wort)", o: ["verspricht", "fragt", "bezweifelt"], a: 0 },
          { s: "Die Forscherin ___ , der Komet sei schon einmal vorbeigeflogen. (sie ist nicht sicher)", o: ["vermutet", "befiehlt", "verspricht"], a: 0 }
        ], mischen: true }
    ],
    plus: [
      { typ: "luecke", t: "Zeit- und Ortsangaben im Bericht anpassen.", tipp: "Schau in den Plus-Merkkasten.",
        items: ["„Ich komme morgen.“ → Sie sagte, sie komme {{am nächsten Tag|morgen|gestern}}.", "„Hier ist es schön.“ → Er meinte, {{dort|hier|da hinten}} sei es schön.",
                "„Heute regnet es.“ → Sie berichtete, an {{diesem Tag|heute|morgen}} regne es."] },
      { typ: "umformen", t: "Gib die Aufforderungen in der indirekten Rede wieder.", tipp: "Aufforderung → sollen (höflich: mögen)",
        items: [
          { s: "Die Trainerin ruft Mia zu: „Lauf schneller!“", l: ["Die Trainerin ruft Mia zu, sie solle schneller laufen."] },
          { s: "Papa sagt zu mir: „Mach bitte das Licht aus!“", l: ["Papa sagt zu mir, ich solle bitte das Licht ausmachen.", "Papa sagt zu mir, ich solle das Licht ausmachen.", "Papa sagt mir, ich solle bitte das Licht ausmachen."] }
        ] },
      { typ: "umformen", t: "Schreibe die Durchsage als kurzen Bericht in der indirekten Rede.", quali: true, tipp: "Mehrere Sätze, mehrere Verben im Konjunktiv – und „morgen“ wird im Bericht „am nächsten Tag“.",
        items: [
          { s: "Die Schulleiterin sagt: „Morgen fällt der Unterricht aus. Die Heizung ist kaputt. Wir informieren euch per Mail.“", zeilen: 4,
            l: ["Die Schulleiterin sagt, am nächsten Tag falle der Unterricht aus. Die Heizung sei kaputt. Sie würden die Schüler per Mail informieren.",
                "Die Schulleiterin sagt, morgen falle der Unterricht aus, die Heizung sei kaputt und man informiere die Schüler per Mail."] }
        ] }
    ]
  });
  </script>
</body>
</html>
