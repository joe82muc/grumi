  Grammatik.seite({
    nr: 6,
    titel: "Attribute und Attributsätze",
    lead: "„Das Fahrrad“ – welches? „Das rote Fahrrad meines Bruders“! Attribute beschreiben ein Nomen genauer. Mit ihnen werden deine Texte anschaulich und genau.",
    ziele: ["Du erkennst Attribute als Teil eines Satzglieds.", "Du bestimmst die Art eines Attributs.", "Du bildest Attributsätze."],
    merk: [
      { t: "Was ist ein Attribut?", html: `
        <p>Ein Attribut beschreibt ein <b>Nomen</b> genauer. Es ist kein eigenes Satzglied, sondern ein <b>Teil</b> davon: Beim Umstellen bleibt es beim Nomen.</p>
        <div class="bsp"><span class="hl">Das rote Fahrrad meines Bruders</span> steht im Keller.</div>
        <div class="bsp">Im Keller steht <span class="hl">das rote Fahrrad meines Bruders</span>.</div>` },
      { t: "Arten von Attributen", html: `
        <table><tr><th>Art</th><th>Beispiel</th></tr>
        <tr><td><b>Adjektivattribut</b></td><td>das <u>rote</u> Fahrrad</td></tr>
        <tr><td><b>Genitivattribut</b></td><td>das Fahrrad <u>meines Bruders</u></td></tr>
        <tr><td><b>präpositionales Attribut</b></td><td>das Haus <u>am See</u></td></tr>
        <tr><td><b>Apposition</b> (Beisatz)</td><td>Herr Kaya, <u>unser Hausmeister</u>, …</td></tr>
        <tr><td><b>Attributsatz</b> (Relativsatz)</td><td>das Buch, <u>das ich gerade lese</u></td></tr></table>` },
      { t: "Attribut oder Satzglied?", html: `
        <div class="bsp">Das Haus <b>am See</b> ist alt. → Welches Haus? → <b>Attribut</b></div>
        <div class="bsp">Wir wohnen <b>am See</b>. → Wo wohnen wir? → <b>Satzglied</b> (Adverbiale des Ortes)</div>
        <p class="merksatz">Frag: Beschreibt es ein Nomen (Welcher? Was für ein?) – oder hängt es am Verb?</p>` }
    ],
    fallen: [
      "Die Apposition wird mit Kommas abgetrennt – vorn und hinten: Leo**,** mein bester Freund**,** wohnt nebenan.",
      "Das Genitivattribut steht im Genitiv: das Rad **meines** Vaters – nicht „von meinem Vater“ in geschriebenen Texten.",
      "Ein Attributsatz (Relativsatz) bezieht sich auf ein Nomen und wird mit Komma abgetrennt."
    ],
    basis: [
      { typ: "markieren", t: "Markiere alle Attribute.", tipp: "Welche Wörter beschreiben ein Nomen genauer? Artikel bleiben unmarkiert.",
        items: ["Das [rote] Fahrrad [meines Bruders] steht im Keller.", "Wir wohnen in einem Haus [am See].",
                "Der [kleine] Hund [unserer Nachbarn] bellt laut.", "Ich trinke einen [heißen] Tee [mit Honig]."] },
      { typ: "wahl", t: "Welche Art von Attribut ist markiert?", tipp: "Adjektiv? Genitiv? Präposition? Beisatz? Relativsatz?",
        items: [
          { s: "das Fahrrad **meines Bruders**", o: ["Adjektivattribut", "Genitivattribut", "präpositionales Attribut", "Apposition", "Attributsatz"], a: 1 },
          { s: "die **spannende** Geschichte", o: ["Adjektivattribut", "Genitivattribut", "präpositionales Attribut", "Apposition", "Attributsatz"], a: 0 },
          { s: "das Haus **am See**", o: ["Adjektivattribut", "Genitivattribut", "präpositionales Attribut", "Apposition", "Attributsatz"], a: 2 },
          { s: "Herr Kaya, **unser Hausmeister**, hat Geburtstag.", o: ["Adjektivattribut", "Genitivattribut", "präpositionales Attribut", "Apposition", "Attributsatz"], a: 3 },
          { s: "das Buch, **das ich gerade lese**", o: ["Adjektivattribut", "Genitivattribut", "präpositionales Attribut", "Apposition", "Attributsatz"], a: 4 }
        ] },
      { typ: "zuordnen", t: "Sortiere nach der Art des Attributs.",
        gruppen: ["Adjektivattribut", "Genitivattribut", "präpositionales Attribut"],
        karten: [["der schnelle Zug", 0], ["ein kalter Winter", 0], ["das Auto meiner Tante", 1], ["die Farbe des Himmels", 1], ["der Platz am Fenster", 2], ["die Tasse aus Glas", 2]] },
      { typ: "luecke", t: "Setze das Genitivattribut richtig ein.", tipp: "Wessen? → meines Vaters, des Himmels, meiner Schwester",
        items: ["Das ist das Fahrrad {{meines Vaters|meinem Vater|mein Vater}}.", "Die Farbe {{des Himmels|dem Himmel|der Himmel}} ist tiefblau.",
                "Der Rucksack {{meiner Schwester|meine Schwester|meinem Schwester}} ist neu."] },
      { typ: "komma", t: "Apposition: Setze die Kommas.", tipp: "Der Beisatz wird abgetrennt – steht er am Ende, nur vorn.",
        items: ["Frau Berg, unsere Klassenlehrerin, ist heute krank.", "Wir besuchen Nürnberg, eine Stadt in Franken.", "Leo, mein bester Freund, wohnt nebenan."] },
      { typ: "umformen", t: "Mach aus dem Relativsatz ein Adjektivattribut.", tipp: "Das Adjektiv wandert vor das Nomen.",
        items: [
          { s: "Das Auto, das rot ist, gehört uns.", l: ["Das rote Auto gehört uns."] },
          { s: "Der Hund, der klein ist, bellt laut.", l: ["Der kleine Hund bellt laut."] }
        ] }
    ],
    plus: [
      { typ: "umformen", t: "Mach aus dem Attribut einen Attributsatz.", tipp: "Ein Relativsatz mit der, die oder das.",
        items: [
          { s: "Das Haus am See gehört meinen Großeltern.", l: ["Das Haus, das am See steht, gehört meinen Großeltern.", "Das Haus, das am See liegt, gehört meinen Großeltern."] },
          { s: "Der lachende Junge ist mein Cousin.", l: ["Der Junge, der lacht, ist mein Cousin."] }
        ] },
      { typ: "wahl", t: "Attribut oder eigenes Satzglied?", tipp: "Beschreibt es ein Nomen genauer? Dann ist es ein Attribut.",
        items: [
          { s: "Das Haus **am See** ist alt.", o: ["Attribut (Teil eines Satzglieds)", "eigenes Satzglied"], a: 0 },
          { s: "Wir wohnen **am See**.", o: ["Attribut (Teil eines Satzglieds)", "eigenes Satzglied"], a: 1 },
          { s: "Der Ball **meines Bruders** ist kaputt.", o: ["Attribut (Teil eines Satzglieds)", "eigenes Satzglied"], a: 0 },
          { s: "**Am Abend** lesen wir gemeinsam.", o: ["Attribut (Teil eines Satzglieds)", "eigenes Satzglied"], a: 1 }
        ] },
      { typ: "frei", t: "Beschreibe einen Gegenstand mit mehreren Attributen.",
        items: [
          { f: "Ein Satz über deinen Lieblingsgegenstand – mit mindestens zwei verschiedenen Attributen.", kriterien: ["mindestens zwei verschiedene Arten von Attributen (Adjektiv, Genitiv, mit Präposition oder Relativsatz)", "ein vollständiger Satz"],
            muster: "(\\b(des|meines|meiner|deines|deiner|seines|seiner|ihres|ihrer|unseres|unserer)\\b|\\b(mit|aus|von|am|im)\\b|,\\s*(der|die|das)\\b)",
            bsp: "Ich mag die alte blaue Jacke meines Opas, die immer nach Holz riecht." }
        ] }
    ]
  });
  </script>
