        <div class="bsp">Ich lerne, <b>um</b> die Probe <b>zu</b> bestehen.</div>

          [["Vor Aufregung", "G"], ["vergisst", "P"], ["Mia", "S"], ["ihren Text", "AO"]]
        ] }
    ],
    plus: [
      { typ: "umformen", t: "Mach aus der Finaladverbiale einen Finalsatz.", tipp: "zum Lernen → um zu lernen / damit ich lerne",

      { typ: "komma", t: "Setze die Kommas.", tipp: "Vor „um … zu“ und „damit“ steht ein Komma.",
