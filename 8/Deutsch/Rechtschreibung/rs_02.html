  <script>
  Grammatik.seite({
    nr: 2,
    titel: "Getrennt oder zusammen?",
    lead: "„Die Probe ist mir schwergefallen“ – aber „Er ist beim Klettern schwer gefallen“. Gleiche Wörter, andere Bedeutung, andere Schreibung. Zwei Proben helfen dir.",
    ziele: ["Du wendest Betonungs- und Bedeutungsprobe an.", "Du schreibst zusammengesetzte Adjektive zusammen.", "Du kennst wichtige feste Ausdrücke."],
    merk: [
      { t: "Betonungsprobe (Wiederholung)", html: `
        <p>Eine Hauptbetonung → zusammen: <i><b>vor</b>lesen, <b>weg</b>werfen</i>. Zwei Betonungen → getrennt: <i><b>Rad</b> <b>fah</b>ren, <b>lau</b>t <b>la</b>chen</i>.</p>` },
      { t: "Bedeutungsprobe", html: `
        <p>Entsteht eine <b>neue, übertragene</b> Bedeutung, schreibst du zusammen:</p>
        <div class="bsp">Die Probe ist mir <b>schwergefallen</b>. (= war schwierig für mich)</div>
        <div class="bsp">Er ist beim Klettern <b>schwer gefallen</b>. (= wörtlich: heftig gestürzt)</div>
        <div class="bsp"><b>krankschreiben, freisprechen, schwarzfahren</b> – immer übertragen</div>` },
      { t: "Zusammengesetzte Adjektive", html: `
        <p>Zusammen: <b>hellblau, dunkelrot, lauwarm, eiskalt, grasgrün, superschnell</b></p>` },
      { t: "Feste Ausdrücke", html: `
        <ul><li>getrennt: <b>zu Fuß, zu Ende, nach Hause, zu viel</b></li>
        <li>zusammen: <b>zurzeit</b> (= jetzt) – aber <b>zur Zeit</b> der Römer · <b>stattdessen</b> · <b>irgendein</b></li></ul>` }
    ],
    fallen: [
      "**zurzeit** (= im Moment) schreibst du zusammen, **zur Zeit** + Genitiv getrennt: zur Zeit der Ritter.",
      "**zu Fuß** und **zu Ende** immer getrennt.",
      "Farben aus zwei Teilen zusammen: hellblau, dunkelgrün."
    ],
    basis: [
      { typ: "wahl", t: "Getrennt oder zusammen?", mischen: true, tipp: "Betonungsprobe und Bedeutungsprobe.",
        items: [
          { s: "Mathe ist mir heute ___ .", o: ["schwergefallen", "schwer gefallen"], a: 0 },
          { s: "Wir gehen heute ___ zur Schule.", o: ["zu Fuß", "zufuß"], a: 0 },
          { s: "Das Wasser im See ist ___ .", o: ["eiskalt", "eis kalt"], a: 0 },
          { s: "___ habe ich keine Zeit.", o: ["Zurzeit", "Zur Zeit"], a: 0 },
          { s: "Der Film ist gleich ___ .", o: ["zu Ende", "zuende"], a: 0 }
        ] },
      { typ: "luecke", t: "Wähle die passende Schreibweise.", tipp: "Neue Bedeutung → zusammen. Wörtlich → getrennt.",
        items: ["Der Arzt hat mich drei Tage {{krankgeschrieben|krank geschrieben}}.", "Er ist beim Skifahren {{schwer gefallen|schwergefallen}} und hat sich das Bein gebrochen.",
                "{{Zur Zeit|Zurzeit}} der Ritter gab es keine Autos.", "Ich habe keine Lust auf Pizza, {{stattdessen|statt dessen}} esse ich Nudeln."] },
      { typ: "zuordnen", t: "Getrennt oder zusammen?", tipp: "Farben und feste Ausdrücke aus dem Merkkasten.",
        gruppen: ["getrennt", "zusammen"],
        karten: [["zu Fuß", 0], ["zu Ende", 0], ["nach Hause", 0], ["Rad fahren", 0], ["hellblau", 1], ["lauwarm", 1], ["zurzeit (= jetzt)", 1], ["irgendein", 1]] },
      { typ: "luecke", t: "Zusammengesetzte Adjektive: Wähle richtig.",
        items: ["Sie trägt ein {{dunkelrotes|dunkel rotes|Dunkelrotes}} Kleid.", "Der Tee ist nur noch {{lauwarm|lau warm}}.", "Das Gras ist {{grasgrün|gras grün}}."] },
      { typ: "wahl", t: "Betonungsprobe: Eine oder zwei Betonungen?",
        items: [
          { s: "vorlesen", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 0 },
          { s: "laut lachen", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 1 },
          { s: "wegwerfen", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 0 }
        ] }
    ],
    plus: [
      { typ: "wahl", t: "Bedeutungsprobe: Welche Schreibweise passt?", tipp: "Neue Bedeutung → zusammen.",
        items: [
          { s: "Das Gericht wird den Angeklagten ___ . (= für unschuldig erklären)", o: ["freisprechen", "frei sprechen"], a: 0 },
          { s: "Beim Vortrag sollst du ___ . (= ohne Zettel)", o: ["frei sprechen", "freisprechen"], a: 0 },
          { s: "Im Bus ohne Fahrschein? Wer ___ , zahlt Strafe.", o: ["schwarzfährt", "schwarz fährt"], a: 0 }
        ] },
      { typ: "umformen", t: "Verbessere die Fehler.", genau: true, tipp: "Drei Stellen sind falsch getrennt oder zusammengeschrieben.",
        items: [{ s: "Zur Zeit gehe ich zufuß zur Schule, weil mein Rad hell blau angestrichen wird.", l: ["Zurzeit gehe ich zu Fuß zur Schule, weil mein Rad hellblau angestrichen wird."] }] }
    ]
  });
