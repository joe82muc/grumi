  Grammatik.seite({

    lead: "Ein Hauptsatz kann allein stehen, ein Nebensatz nicht. Am Einleitewort und am Verb am Ende erkennst du jeden Nebensatz.",

    merk: [
      { t: "Der Hauptsatz", html: `
        <p>Er kann <b>allein stehen</b>. Im Aussagesatz steht das gebeugte Verb an <b>zweiter Stelle</b>.</p>
        <div class="bsp">Tarek <span class="hl-r">spielt</span> Basketball.</div>
        <div class="bsp">Nach der Schule <span class="hl-r">spielt</span> Tarek Basketball.</div>` },
      { t: "Der Nebensatz", html: `
        <p>Er kann <b>nicht allein stehen</b>. Du erkennst ihn an zwei Dingen:</p>
        <ol><li>Er beginnt mit einem <b>Einleitewort</b>: weil, dass, ob, wenn, als, obwohl, nachdem, damit … oder einem Relativpronomen (der, die, das) oder Fragewort (wie, wo, warum).</li>
        <li>Das gebeugte Verb steht <b>am Ende</b>.</li></ol>
        <div class="bsp">…, <span class="hl-v">weil er gern im Team <b>spielt</b></span>.</div>
        <p class="merksatz">Zwischen Haupt- und Nebensatz steht immer ein Komma.</p>` },
      { t: "Wo der Nebensatz stehen kann", html: `
        <div class="bsp"><b>danach:</b> Wir bleiben drinnen, <span class="hl-v">weil es stürmt</span>.</div>
        <div class="bsp"><b>davor:</b> <span class="hl-v">Weil es stürmt</span>, bleiben wir drinnen.</div>
        <div class="bsp"><b>eingeschoben:</b> Der Ausflug, <span class="hl-v">den wir geplant hatten</span>, fällt aus.</div>
        <p>Steht der Nebensatz vorn, beginnt der Hauptsatz direkt mit dem Verb.</p>` },
      { t: "Der Relativsatz", html: `
        <p>Ein Relativsatz beschreibt ein <b>Nomen</b> genauer. Er beginnt mit einem Relativpronomen (der, die, das, dem, den, deren …), das sich auf dieses Nomen bezieht.</p>
        <div class="bsp">Das Handy, <span class="hl-v">das auf dem Tisch liegt</span>, gehört Leni.</div>
        <div class="bsp">Die Frau, <span class="hl-v">der ich geholfen habe</span>, wohnt nebenan.</div>` }
    ],
    fallen: [
      "**denn** leitet keinen Nebensatz ein: „…, denn er ist krank.“ – das Verb steht an zweiter Stelle. Bei **weil** steht es am Ende: „…, weil er krank ist.“",
      "Das Einleitewort gehört zum Nebensatz. Unterstreichst du einen Nebensatz, gehört es dazu – das Komma nicht.",
      "Ein eingeschobener Nebensatz hat zwei Kommas: eins davor und eins danach.",
      "„das“ als Relativpronomen (das Rad, **das** …) und „dass“ als Konjunktion (ich hoffe, **dass** …) nicht verwechseln."
    ],
    basis: [
      { typ: "wahl", t: "Hauptsatz oder Nebensatz?", tipp: "Kann der Teil allein stehen? Wo steht das gebeugte Verb?",

          { s: "dass du morgen mitkommst", o: ["Hauptsatz", "Nebensatz"], a: 1 },
          { s: "Morgen schreiben wir eine Probe.", o: ["Hauptsatz", "Nebensatz"], a: 0 },
          { s: "die neben mir wohnt", o: ["Hauptsatz", "Nebensatz"], a: 1, e: "Relativsatz: „die“ bezieht sich auf eine Person, das Verb steht am Ende." },
          { s: "obwohl sie müde war", o: ["Hauptsatz", "Nebensatz"], a: 1 }
        ] },
      { typ: "markieren", t: "Markiere die Nebensätze – mit Einleitewort, ohne Komma.", quali: true, tipp: "Such das Einleitewort und markiere bis zum gebeugten Verb am Ende.",
        items: ["[Als wir am Bahnhof ankamen], war der Zug schon weg.",
                "Ich weiß nicht, [ob das Training heute stattfindet].",
                "Der Hund, [der im Garten bellt], gehört unseren Nachbarn.",
                "Wir bleiben drinnen, [weil es draußen stürmt]."] },
      { typ: "zuordnen", t: "Welche Wörter leiten einen Nebensatz ein?", tipp: "Setz das Wort vor „… es regnet“: Rutscht das Verb ans Ende („weil es regnet“), leitet es einen Nebensatz ein.",
        gruppen: ["leitet einen Nebensatz ein", "verbindet Hauptsätze"],
        karten: [["weil", 0], ["obwohl", 0], ["dass", 0], ["nachdem", 0], ["wenn", 0], ["ob", 0],

      { typ: "luecke", t: "Wähle das Einleitewort, das passt.", tipp: "Grund → weil · Gegengrund → obwohl · Zweck → damit · Frage → ob · Zeit → als/nachdem · Folge → sodass/dass",
        items: ["Ich bleibe heute zu Hause, {{weil|obwohl|damit}} ich Fieber habe.",
                "{{Obwohl|Weil|Damit}} es regnet, gehen wir spazieren.",
                "Ich spare mein Taschengeld, {{damit|obwohl|ob}} ich mir ein Rad kaufen kann.",
                "Weißt du, {{ob|dass|weil}} der Bus heute fährt?",
                "{{Nachdem|Bevor|Obwohl}} wir gegessen hatten, spülten wir ab.",
                "Sie lachte so laut, {{dass|ob|weil}} sich alle umdrehten."] },
      { typ: "wahl", t: "Weißt du es noch?", mischen: true, tipp: "Schau in den Merkkasten „Der Nebensatz“.",
        items: [
          { f: "Woran erkennst du einen Nebensatz?", o: ["Das gebeugte Verb steht am Ende.", "Er ist immer kürzer als der Hauptsatz.", "Er steht immer am Satzanfang."], a: 0 },
          { f: "Was steht zwischen Haupt- und Nebensatz?", o: ["ein Komma", "ein Punkt", "nichts"], a: 0 },
          { f: "Welches Wort leitet KEINEN Nebensatz ein?", o: ["denn", "weil", "obwohl"], a: 0 },
          { f: "Wie heißt ein Nebensatz, der ein Nomen genauer beschreibt?", o: ["Relativsatz", "Hauptsatz", "Fragesatz"], a: 0 }
        ] },
      { typ: "bauen", t: "Baue den Nebensatz.", tipp: "Das Einleitewort steht vorn, das gebeugte Verb ganz am Ende.",
        items: [
          { f: "Wir kommen zu spät, …", teile: ["weil", "der Bus", "heute", "Verspätung", "hat"], l: ["weil heute der Bus Verspätung hat"] },
          { f: "Ich freue mich, …", teile: ["dass", "wir", "morgen", "frei", "haben"] },
          { f: "Das ist die Jacke, …", teile: ["die", "ich", "im Bus", "vergessen", "habe"] }
        ] }
    ],
    plus: [
      { typ: "markieren", t: "Markiere alle Nebensätze – auch eingeschobene und mehrere in einem Satz.", quali: true,
        tipp: "Ein Satz kann zwei Nebensätze haben. Auch „wie“, „warum“ und „als“ können Nebensätze einleiten.",
        items: ["[Nachdem die Probe vorbei war], gingen alle erleichtert in die Pause.",
                "Sie fragte, [warum der Ausflug abgesagt wurde].",
                "Das Fahrrad, [das Ben gestern gekauft hat], ist schon kaputt, [obwohl er vorsichtig war].",
                "Er tat so, [als hätte er nichts gehört]."] },
      { typ: "wahl", t: "Was drückt der Nebensatz aus?", tipp: "wenn/falls → Bedingung · damit → Zweck · obwohl → Gegengrund · als/nachdem → Zeit · weil/da → Grund",
        items: [
          { s: "**Wenn du Zeit hast**, hilf mir bitte beim Aufbauen.", o: ["Grund", "Zeit", "Bedingung", "Zweck", "Gegengrund"], a: 2, e: "Bedingung (Konditionalsatz)." },
          { s: "Ich lerne jeden Tag, **damit ich die Prüfung schaffe**.", o: ["Grund", "Zeit", "Bedingung", "Zweck", "Gegengrund"], a: 3, e: "Zweck (Finalsatz)." },
          { s: "**Obwohl er erkältet war**, ging er zum Training.", o: ["Grund", "Zeit", "Bedingung", "Zweck", "Gegengrund"], a: 4, e: "Gegengrund (Konzessivsatz)." },
          { s: "**Als das Licht ausging**, schrien alle.", o: ["Grund", "Zeit", "Bedingung", "Zweck", "Gegengrund"], a: 1, e: "Zeit (Temporalsatz)." },
          { s: "**Weil die Halle gesperrt ist**, fällt Sport aus.", o: ["Grund", "Zeit", "Bedingung", "Zweck", "Gegengrund"], a: 0, e: "Grund (Kausalsatz)." }
        ] },
      { typ: "umformen", t: "Mach aus dem zweiten Hauptsatz einen Relativsatz.", tipp: "Das Relativpronomen richtet sich nach dem Nomen (der/die/das) und nach seiner Rolle im Relativsatz (dem, den, der …).",
        items: [
          { s: "Ich habe einen Freund. Er wohnt in Hamburg.", l: ["Ich habe einen Freund, der in Hamburg wohnt."] },
          { s: "Das ist die Lehrerin. Ihr habe ich das Heft gegeben.", l: ["Das ist die Lehrerin, der ich das Heft gegeben habe."] },
          { s: "Wir besuchen das Museum. Es wurde letztes Jahr eröffnet.", l: ["Wir besuchen das Museum, das letztes Jahr eröffnet wurde."] }
        ] },
      { typ: "luecke", t: "„weil“ oder „denn“? Achte auf die Stellung des Verbs.", tipp: "weil → Verb am Ende (Nebensatz). denn → Verb an zweiter Stelle (Hauptsatz).",
        items: ["Wir bleiben drinnen, {{denn|weil}} es regnet stark.",
                "Wir bleiben drinnen, {{weil|denn}} es stark regnet.",
                "Leni ist müde, {{weil|denn}} sie lange gelernt hat.",
                "Ben kommt nicht mit, {{denn|weil}} er hat keine Zeit."] }
    ]
  });
  </script>
