  <title>Wortarten | Deutsch 9 Grammatik</title>
  <meta name="description" content="Deutsch 9 Grammatik, Thema 1: Wortarten sicher bestimmen – Nomen, Verb, Adjektiv, Pronomen, Adverb, Präposition, Konjunktion, Artikel. Mit Basis- und Plus-Aufgaben.">
  <meta name="theme-color" content="#b23a48">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script>
  Grammatik.seite({
    nr: 1,
    titel: "Wortarten",
    lead: "Jedes Wort gehört zu einer Wortart. Wer sie sicher bestimmen kann, versteht Sätze besser – und holt im Quali leichte Punkte.",
    ziele: ["Du unterscheidest veränderbare und unveränderbare Wortarten.", "Du bestimmst Wortarten im Satz mit Proben.", "Du erkennst die Arten von Pronomen."],
    merk: [
      { t: "Veränderbare Wortarten", html: `
        <table><tr><th>Wortart</th><th>Erkennungszeichen</th><th>Beispiele</th></tr>
        <tr><td><b>Nomen</b></td><td>großgeschrieben, Artikel davor möglich</td><td>die Werkstatt, das Glück</td></tr>
        <tr><td><b>Verb</b></td><td>lässt sich konjugieren (ich, du, er …)</td><td>arbeiten, er arbeitet</td></tr>
        <tr><td><b>Adjektiv</b></td><td>lässt sich steigern, beschreibt Eigenschaften</td><td>leise – leiser – am leisesten</td></tr>
        <tr><td><b>Artikel</b></td><td>Begleiter des Nomens</td><td>der, die, das, ein, eine</td></tr>
        <tr><td><b>Pronomen</b></td><td>steht für ein Nomen oder begleitet es</td><td>sie, unser, dieser, der</td></tr></table>` },
      { t: "Unveränderbare Wortarten", html: `
        <p>Diese Wörter ändern ihre Form nie:</p>
        <ul><li><b>Adverb</b> – sagt, wann, wo, wie oder warum: <i>gestern, dort, gern, deshalb</i></li>
        <li><b>Präposition</b> – steht vor einem Nomen und bestimmt den Fall: <i>mit, für, wegen, unter</i></li>
        <li><b>Konjunktion</b> – verbindet Wörter oder Sätze: <i>und, aber, weil, dass, obwohl</i></li></ul>
        <div class="bsp"><span class="hl-o">Gestern</span> fuhr Aylin <span class="hl-v">mit</span> dem Rad, <span class="hl-g">weil</span> der Bus ausfiel.</div>
        <p class="merksatz">„ins“ = in + das, „am“ = an + dem: Präposition und Artikel sind verschmolzen.</p>` },
      { t: "Pronomen genauer", html: `
        <ul><li><b>Personalpronomen:</b> ich, du, er, sie, es, wir, ihr, sie (auch mir, dich, ihm …)</li>
        <li><b>Possessivpronomen:</b> mein, dein, sein, ihr, unser, euer – zeigt, wem etwas gehört</li>
        <li><b>Demonstrativpronomen:</b> dieser, jener, derselbe – zeigt auf etwas</li>
        <li><b>Relativpronomen:</b> der, die, das, welcher – leitet einen Relativsatz ein</li>
        <li><b>Reflexivpronomen:</b> mich, dich, sich – bezieht sich auf das Subjekt</li>
        <li><b>Indefinitpronomen:</b> jemand, niemand, man, alle, etwas</li></ul>` },
      { t: "Proben, die dir helfen", html: `
        <ul><li><b>Artikelprobe:</b> Passt ein Artikel davor? Dann ist es ein Nomen – auch bei <i>das Warten, beim Lesen</i>.</li>
        <li><b>Konjugationsprobe:</b> ich gehe, du gehst … → Verb</li>
        <li><b>Steigerungsprobe:</b> laut – lauter → Adjektiv</li>
        <li><b>Stellprobe für Adjektive:</b> passt das Wort zwischen Artikel und Nomen? <i>das <span class="hl">spannende</span> Spiel</i> → Adjektiv. <i>das gestern Spiel</i> geht nicht → <i>gestern</i> ist ein Adverb.</li></ul>` }
    ],
    fallen: [
      "„das“ (Artikel oder Pronomen) und „dass“ (Konjunktion) verwechseln. Lässt sich „dieses“ oder „welches“ einsetzen, schreibst du „das“.",
      "Nominalisierte Verben und Adjektive übersehen: **beim Laufen**, **das Beste** sind Nomen.",
      "„sein“, „ihr“, „unser“ vor einem Nomen sind keine Artikel, sondern Possessivpronomen.",
      "Ein Wort kann je nach Satz eine andere Wortart sein: **seit** Montag (Präposition) – **seit** er da ist (Konjunktion)."
    ],
    basis: [
      { typ: "zuordnen", t: "Sortiere die Wörter nach ihrer Wortart.", tipp: "Mach die Proben: Artikel davor? Konjugierbar? Steigerbar?",
        gruppen: ["Nomen", "Verb", "Adjektiv", "Pronomen", "Präposition", "Konjunktion"],
        karten: [["Turnier", 0], ["Schiedsrichterin", 0], ["pfeifen", 1], ["gewinnt", 1], ["müde", 2], ["spannend", 2],
                 ["wir", 3], ["euer", 3], ["unter", 4], ["wegen", 4], ["obwohl", 5], ["oder", 5]] },
      { typ: "markieren", t: "Markiere alle Nomen – auch die nominalisierten.", tipp: "Artikelprobe: Vor „Warten“ kannst du „das“ setzen. „beim“ = bei + dem.",
        items: ["Beim [Warten] auf den [Bus] erzählte [Aylin] von ihrem [Praktikum] in der [Werkstatt].",
                "Die [Chefin] lobte ihre [Geduld] und ihre saubere [Arbeit].",
                "Am [Ende] der [Woche] bekam sie ein kleines [Zeugnis]."] },
      { typ: "wahl", t: "Bestimme die Wortart des unterstrichenen Wortes.", quali: true, tipp: "Frag dich: Lässt sich das Wort verändern? Wenn nicht: Sagt es wann/wo/wie (Adverb), steht es vor einem Nomen (Präposition) oder verbindet es (Konjunktion)?",
        items: [
          { s: "Der Hausmeister öffnet __morgen__ die Turnhalle.", o: ["Adverb", "Adjektiv", "Präposition", "Nomen"], a: 0, e: "„morgen“ sagt, wann – und es lässt sich nicht verändern: Adverb." },
          { s: "Lena wartet, __weil__ der Zug Verspätung hat.", o: ["Präposition", "Konjunktion", "Adverb", "Pronomen"], a: 1, e: "„weil“ verbindet zwei Sätze: Konjunktion." },
          { s: "Wir treffen uns __nach__ der Schule.", o: ["Konjunktion", "Adverb", "Präposition", "Artikel"], a: 2, e: "„nach“ steht vor „der Schule“ und verlangt den Dativ: Präposition." },
          { s: "Das ist __ihr__ neues Fahrrad.", o: ["Artikel", "Pronomen", "Adjektiv", "Adverb"], a: 1, e: "„ihr“ zeigt, wem das Rad gehört: Possessivpronomen." },
          { s: "Die Aufgabe war ziemlich __schwierig__.", o: ["Adverb", "Verb", "Adjektiv", "Nomen"], a: 2, e: "schwierig – schwieriger: steigerbar, also Adjektiv." },
          { s: "__Das__ Training beginnt um vier.", o: ["Artikel", "Konjunktion", "Pronomen", "Präposition"], a: 0, e: "„Das“ begleitet hier das Nomen „Training“: Artikel." }
        ] },
      { typ: "luecke", t: "Wähle das passende Pronomen.", tipp: "Lies den ganzen Satz. Wer ist gemeint – und welcher Fall wird gebraucht?",
        items: ["Mila hat ihr Ladekabel vergessen. Kannst du {{ihr|ihm|sie}} deins leihen?",
                "Die Jungs haben {{ihre|seine|unsere}} Trikots in der Halle liegen lassen.",
                "Das ist der Trainer, {{der|den|dem}} uns immer anfeuert.",
                "Hat {{jemand|etwas|nichts}} meinen Schlüssel gesehen?",
                "Ich habe {{mich|mir|sich}} über die Nachricht gefreut."] },
      { typ: "markieren", t: "Markiere die Verben rot und die Adjektive grün.", stifte: [["r", "Verb"], ["g", "Adjektiv"]],
        tipp: "Verben kannst du konjugieren (ich lohne, es lohnt …). Adjektive stehen hier zwischen Artikel und Nomen oder nach „sein“.",
        items: ["Die [g:neue] Trainerin [r:erklärt] eine [g:schwierige] Übung.",
                "Nach dem Spiel [r:haben] wir [g:kalte] Füße und [r:frieren].",
                "Der [g:lange] Weg zum See [r:lohnt] sich, denn das Wasser [r:ist] [g:klar]."] },
      { typ: "wahl", t: "Proben und Erkennungszeichen", mischen: true, tipp: "Schau in den Merkkasten „Proben, die dir helfen“.",
        items: [
          { f: "Mit welcher Probe erkennst du ein Nomen sicher?", o: ["Artikelprobe", "Steigerungsprobe", "Konjugationsprobe"], a: 0 },
          { f: "Woraus besteht „ins“?", o: ["Präposition + Artikel", "Konjunktion + Pronomen", "Adverb + Artikel"], a: 0 },
          { f: "Welche Wortart lässt sich steigern?", o: ["Adjektiv", "Präposition", "Konjunktion"], a: 0 },
          { f: "Welches Wort ist eine Konjunktion?", o: ["obwohl", "trotz", "dort"], a: 0, e: "„trotz“ ist eine Präposition (trotz des Regens), „dort“ ein Adverb." }
        ] }
    ],
    plus: [
      { typ: "luecke", t: "Finde im Text je ein passendes Beispiel und schreibe es in die Lücke.", quali: true,
        info: "„Gestern ist unsere Klasse mit dem Zug nach Nürnberg gefahren. Dort haben wir ein Museum besucht. Es war spannend, aber ziemlich anstrengend.“",
        tipp: "Es gibt mehrere richtige Lösungen. Schreib das Wort genau so, wie es im Text steht.",
        items: ["Nomen: [[Klasse|Zug|Nürnberg|Museum]]",
                "Verb: [[ist|gefahren|haben|besucht|war]]",
                "Adjektiv: [[spannend|anstrengend]]",
                "Personalpronomen: [[wir|es]]",
                "Adverb: [[gestern|dort|ziemlich]]",
                "Präposition: [[mit|nach]]",
                "Konjunktion: [[aber]]"] },
      { typ: "wahl", t: "Welche Art von Pronomen ist unterstrichen?", tipp: "Steht es für ein Nomen, zeigt es Besitz, leitet es einen Nebensatz ein oder bezieht es sich auf das Subjekt?",
        items: [
          { s: "Ich habe __mich__ über das Geschenk gefreut.", o: ["Personalpronomen", "Reflexivpronomen", "Relativpronomen"], a: 1 },
          { s: "Der Film, __den__ wir gesehen haben, war zu lang.", o: ["Artikel", "Demonstrativpronomen", "Relativpronomen"], a: 2, e: "„den“ leitet den Relativsatz ein und bezieht sich auf „der Film“." },
          { s: "__Dieses__ Buch kenne ich schon.", o: ["Demonstrativpronomen", "Possessivpronomen", "Indefinitpronomen"], a: 0 },
          { s: "Habt ihr __eure__ Jacken dabei?", o: ["Personalpronomen", "Possessivpronomen", "Reflexivpronomen"], a: 1 },
          { s: "__Jemand__ hat die Tür offen gelassen.", o: ["Indefinitpronomen", "Personalpronomen", "Demonstrativpronomen"], a: 0 },
          { s: "Kommt __ihr__ heute mit ins Kino?", o: ["Possessivpronomen", "Personalpronomen", "Reflexivpronomen"], a: 1, e: "Hier steht „ihr“ für Personen (die angesprochene Gruppe): Personalpronomen." }
        ] },
      { typ: "markieren", t: "Markiere alle Wörter, die hier als Nomen gebraucht werden.", tipp: "Auch Namen sind Nomen. Achte auf Verben und Adjektive mit Begleiter: „zum Lernen“, „das Beste“.",
        items: ["Beim [Joggen] hört [Mats] gern [Musik].",
                "Das [Beste] am [Ausflug] war das gemeinsame [Grillen].",
                "Zum [Lernen] braucht man vor allem [Ruhe] und etwas [Geduld]."] },
      { typ: "wahl", t: "Bestimme die Wortart – hier wird es kniffliger.", quali: true, tipp: "Denk an die Proben – und daran, dass nominalisierte Verben Nomen sind.",
        items: [
          { s: "Er kam __trotz__ des Regens pünktlich.", o: ["Präposition", "Konjunktion", "Adverb", "Adjektiv"], a: 0 },
          { s: "Sie lachte, __obwohl__ ihr gar nicht danach war.", o: ["Präposition", "Konjunktion", "Adverb", "Pronomen"], a: 1 },
          { s: "Das __Laufen__ fällt mir heute schwer.", o: ["Verb", "Nomen", "Adjektiv", "Adverb"], a: 1, e: "Mit Artikel „das“ ist „Laufen“ nominalisiert: Nomen." },
          { s: "Wir haben __deshalb__ das Treffen abgesagt.", o: ["Konjunktion", "Adverb", "Präposition", "Pronomen"], a: 1, e: "„deshalb“ gibt einen Grund an und ist unveränderbar – ein Adverb." },
          { s: "__Seine__ Idee hat alle überzeugt.", o: ["Artikel", "Pronomen", "Adjektiv", "Nomen"], a: 1 },
          { s: "Sie wohnt __seit__ zwei Jahren in Unterhaching.", o: ["Konjunktion", "Präposition", "Adverb", "Verb"], a: 1, e: "„seit zwei Jahren“: Hier steht „seit“ vor einer Zeitangabe mit Nomen – Präposition." }
        ] }
    ]
  });
  </script>
