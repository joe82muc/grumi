  <script>
  Grammatik.seite({
    nr: 5,
    titel: "Aktiv und Passiv",

      { t: "Passiv – was passiert?", html: `
        <p>Gebildet mit <b>werden + Partizip II</b>. Der Handelnde kann mit <b>von</b> genannt werden – oder fehlt ganz.</p>
        <div class="bsp">Die Turnhalle <span class="hl-r">wird</span> (vom Hausmeister) <span class="hl-r">abgeschlossen</span>.</div>
        <p>Typisch, wenn der Handelnde unwichtig oder unbekannt ist: <i>Mein Fahrrad wurde gestohlen.</i></p>` },
      { t: "Das Passiv in allen Zeitformen", html: `
        <table><tr><th>Zeitform</th><th>Passiv</th></tr>
        <tr><td>Präsens</td><td>Die Brücke <b>wird</b> gebaut.</td></tr>
        <tr><td>Präteritum</td><td>Die Brücke <b>wurde</b> gebaut.</td></tr>
        <tr><td>Perfekt</td><td>Die Brücke <b>ist</b> gebaut <b>worden</b>.</td></tr>
        <tr><td>Plusquamperfekt</td><td>Die Brücke <b>war</b> gebaut <b>worden</b>.</td></tr>
        <tr><td>Futur I</td><td>Die Brücke <b>wird</b> gebaut <b>werden</b>.</td></tr></table>` },
      { t: "So formst du um", html: `
        <ol><li>Das <b>Akkusativobjekt</b> wird zum neuen Subjekt.</li>
        <li>Das alte Subjekt wird zu <b>von + Dativ</b> – oder fällt weg.</li>
        <li>Das Verb wird zu <b>werden + Partizip II</b>, in <b>derselben Zeitform</b>.</li></ol>
        <div class="bsp">Die Schüler schmückten die Aula. → <b>Die Aula wurde von den Schülern geschmückt.</b></div>` },
      { t: "Plus: Vorgang oder Zustand?", html: `
        <p><b>Vorgangspassiv</b> (werden): etwas geschieht gerade – <i>Die Tür wird geschlossen.</i></p>

    ],
    fallen: [
      "Im Passiv Perfekt heißt es **worden**, nicht „geworden“: Das Haus ist gebaut **worden**.",
      "„werden“ allein ist noch kein Passiv: Er **wird** Koch (Vollverb) · Er **wird** kommen (Futur) · Er **wird** gefragt (Passiv).",
      "Die Zeitform muss beim Umformen gleich bleiben: Präteritum Aktiv → Präteritum Passiv."
    ],
    basis: [
      { typ: "wahl", t: "Aktiv oder Passiv?", tipp: "Passiv braucht werden + Partizip II (gekauft, geschrieben …).",

          { s: "Mein Bruder wird Koch.", o: ["Aktiv", "Passiv"], a: 0, e: "Hier ist „wird“ ein Vollverb – es fehlt das Partizip II." }

      { typ: "wahl", t: "In welcher Zeitform steht das Passiv?", tipp: "wird → Präsens · wurde → Präteritum · ist … worden → Perfekt · war … worden → Plusquamperfekt · wird … werden → Futur I",

          { s: "Die Straße wird gesperrt.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 0 },

          { s: "Die Straße ist gesperrt worden.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 2 },
          { s: "Die Straße war gesperrt worden.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 3 },
          { s: "Die Straße wird gesperrt werden.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 4 }
        ] },
      { typ: "luecke", t: "Setze das Passiv ein. Verb und Zeitform stehen in Klammern.", tipp: "Partizip II: aufstellen → aufgestellt, verschicken → verschickt.",
        items: ["Die Tische [[werden]] von der Klasse [[aufgestellt]]. (aufstellen · Präsens)",
                "Der Brief [[wurde]] gestern [[verschickt]]. (verschicken · Präteritum)",
                "Das Rad [[ist]] repariert [[worden]]. (reparieren · Perfekt)",
                "Die Pizza [[wurde]] von Tarek [[bestellt]]. (bestellen · Präteritum)"] },
      { typ: "umformen", t: "Forme ins Passiv um. Die Zeitform bleibt gleich.", quali: true, tipp: "Akkusativobjekt nach vorn, „von“ für den Handelnden, werden + Partizip II.",
        items: [
          { s: "Der Hausmeister öffnet die Tür.", l: ["Die Tür wird vom Hausmeister geöffnet.", "Die Tür wird von dem Hausmeister geöffnet.", "Die Tür wird geöffnet."] },
          { s: "Die Schüler schmückten die Aula.", l: ["Die Aula wurde von den Schülern geschmückt.", "Die Aula wurde geschmückt."] },
          { s: "Die Polizei hat den Dieb gefasst.", l: ["Der Dieb ist von der Polizei gefasst worden.", "Der Dieb ist gefasst worden."] }
        ] },
      { typ: "umformen", t: "Forme ins Aktiv um.", tipp: "Wer handelt? Der wird zum Subjekt. Die Zeitform bleibt gleich.",
        items: [
          { s: "Das Auto wird von meiner Mutter gewaschen.", l: ["Meine Mutter wäscht das Auto."] },
          { s: "Die Fenster wurden vom Maler gestrichen.", l: ["Der Maler strich die Fenster."] }
        ] },
      { typ: "markieren", t: "Markiere alle Teile des Prädikats in den Passivsätzen.", tipp: "Zum Prädikat gehören die Form von werden/sein, das Partizip II und „worden“.",
        items: ["Die Turnhalle [wird] morgen [renoviert].",
                "Das Spiel [ist] wegen des Regens [abgesagt] [worden].",
                "Die Gewinner [wurden] auf der Bühne [geehrt]."] }
    ],
    plus: [
      { typ: "umformen", t: "Bilde aus den Wörtern einen Satz im Passiv Präteritum. Füge nötige Wörter hinzu.", quali: true,
        tipp: "Muster: Das … wurde … von … + Partizip II.",
        items: [
          { s: "Fahrrad – reparieren – am Montag – Werkstatt", l: ["Das Fahrrad wurde am Montag von der Werkstatt repariert.", "Das Fahrrad wurde am Montag in der Werkstatt repariert.", "Am Montag wurde das Fahrrad von der Werkstatt repariert.", "Am Montag wurde das Fahrrad in der Werkstatt repariert."] },
          { s: "Konzertkarten – verkaufen – in einer Stunde – Veranstalter", l: ["Die Konzertkarten wurden in einer Stunde vom Veranstalter verkauft.", "Die Konzertkarten wurden in einer Stunde von dem Veranstalter verkauft.", "In einer Stunde wurden die Konzertkarten vom Veranstalter verkauft."] }
        ] },
      { typ: "umformen", t: "Forme ins Passiv um – in der angegebenen Zeitform.", tipp: "Futur I: wird … werden · Plusquamperfekt: war … worden · Perfekt: ist … worden",
        items: [
          { s: "Die Stadt baut eine neue Brücke.", f: "Passiv Futur I", l: ["Eine neue Brücke wird von der Stadt gebaut werden.", "Eine neue Brücke wird gebaut werden."] },
          { s: "Der Trainer hatte das Spiel analysiert.", f: "Passiv, gleiche Zeitform", l: ["Das Spiel war vom Trainer analysiert worden.", "Das Spiel war von dem Trainer analysiert worden.", "Das Spiel war analysiert worden."] },
          { s: "Man hat die Straße gesperrt.", f: "Passiv, gleiche Zeitform", l: ["Die Straße ist gesperrt worden."] }
        ] },
      { typ: "wahl", t: "Vorgangspassiv oder Zustandspassiv?", tipp: "werden → Vorgang (es passiert gerade) · sein → Zustand (das Ergebnis)",
        items: [
          { s: "Die Tür wird geschlossen.", o: ["Vorgangspassiv", "Zustandspassiv"], a: 0 },
          { s: "Die Tür ist geschlossen.", o: ["Vorgangspassiv", "Zustandspassiv"], a: 1 },
          { s: "Das Geschäft ist seit Montag geöffnet.", o: ["Vorgangspassiv", "Zustandspassiv"], a: 1 },
          { s: "Das Geschäft wird um neun Uhr geöffnet.", o: ["Vorgangspassiv", "Zustandspassiv"], a: 0 }
        ] },
      { typ: "frei", t: "Schreibe selbst einen Satz für einen Zeitungsbericht – im Passiv Präteritum.",
        items: [
          { f: "Thema: ein Unfall an einer Kreuzung (z. B. verletzen, sperren, ins Krankenhaus bringen).",
            kriterien: ["Passiv: wurde/wurden + Partizip II", "Zeitform Präteritum", "passt zu einem Unfallbericht"],
            muster: "\\b(wurde|wurden)\\b.*\\b(ge\\w+(t|en)|\\w+iert|ver\\w+(t|en)|be\\w+(t|en)|er\\w+(t|en)|ent\\w+(t|en)|\\w+ge\\w+(t|en))\\b",
            bsp: "Bei dem Unfall wurde ein Radfahrer leicht verletzt." }
        ] }
    ]
  });
