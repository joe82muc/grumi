  <script>
  Grammatik.seite({
    nr: 7,
    titel: "Zeitformen",
    lead: "Mit der Zeitform zeigst du, wann etwas passiert. Im Quali sollst du Zeitformen bestimmen und Sätze in andere Zeitformen setzen.",
    ziele: ["Du bestimmst die sechs Zeitformen sicher.", "Du bildest Präteritum und Perfekt auch bei unregelmäßigen Verben.", "Du nutzt das Plusquamperfekt für Vorzeitiges."],
    merk: [
      { t: "Die sechs Zeitformen", html: `
        <table><tr><th>Zeitform</th><th>regelmäßig (spielen)</th><th>unregelmäßig (gehen)</th></tr>
        <tr><td><b>Präsens</b></td><td>ich spiele</td><td>ich gehe</td></tr>
        <tr><td><b>Präteritum</b></td><td>ich spielte</td><td>ich ging</td></tr>
        <tr><td><b>Perfekt</b></td><td>ich habe gespielt</td><td>ich bin gegangen</td></tr>
        <tr><td><b>Plusquamperfekt</b></td><td>ich hatte gespielt</td><td>ich war gegangen</td></tr>
        <tr><td><b>Futur I</b></td><td>ich werde spielen</td><td>ich werde gehen</td></tr>
        <tr><td><b>Futur II</b></td><td>ich werde gespielt haben</td><td>ich werde gegangen sein</td></tr></table>` },
      { t: "Wann welche Zeitform?", html: `
        <ul><li><b>Präsens:</b> jetzt, immer wieder, Inhaltsangabe</li>
        <li><b>Präteritum:</b> schriftlich erzählen, Bericht, Zeitung</li>
        <li><b>Perfekt:</b> mündlich von Vergangenem erzählen</li>
        <li><b>Plusquamperfekt:</b> was <i>vor</i> etwas anderem Vergangenem geschah</li>
        <li><b>Futur I:</b> Zukunft oder Vermutung (<i>Er wird krank sein.</i>)</li>
        <li><b>Futur II:</b> in der Zukunft abgeschlossen</li></ul>` },
      { t: "Perfekt: haben oder sein?", html: `
        <p><b>sein</b> bei Bewegung von A nach B und bei Veränderung: <i>gehen, fahren, laufen, aufstehen, einschlafen, wachsen</i> – außerdem bei <i>sein</i> und <i>bleiben</i>.</p>
        <p><b>haben</b> bei fast allen anderen Verben: <i>lesen, kaufen, schlafen, essen</i>.</p>
        <div class="bsp">Ich <b>bin</b> nach Hause gelaufen. · Ich <b>habe</b> lange geschlafen.</div>` },
      { t: "Vorher – nachher", html: `
        <p>Nach <b>nachdem</b> steht die Handlung, die zuerst passiert ist:</p>
        <div class="bsp"><span class="hl-v">Nachdem wir gegessen <b>hatten</b></span> (Plusquamperfekt), <b>spielten</b> wir Karten (Präteritum).</div>
        <div class="bsp"><span class="hl-v">Nachdem wir gegessen <b>haben</b></span> (Perfekt), <b>spielen</b> wir Karten (Präsens).</div>` }
    ],
    fallen: [
      "„Mir **wurde** übel.“ ist Präteritum von „werden“ – kein Passiv, denn es fehlt das Partizip II.",
      "Futur I (werden + **Infinitiv**: wird spielen) nicht mit dem Passiv (werden + **Partizip II**: wird gespielt) verwechseln.",
      "Bleib in einem Text bei einer Zeitform: Bericht im Präteritum, Inhaltsangabe im Präsens."
    ],
    basis: [
      { typ: "wahl", t: "Bestimme die Zeitform.", quali: true, tipp: "Achte auf die Hilfsverben: haben/sein (Perfekt), hatte/war (Plusquamperfekt), werden + Infinitiv (Futur).",
        items: [
          { s: "Wir fuhren mit dem Rad zum See.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 1 },
          { s: "Lena hat ihr Zimmer aufgeräumt.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 2 },
          { s: "Ich werde dich morgen anrufen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 4 },
          { s: "Nachdem es __geregnet hatte__, war die Luft frisch.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 3 },
          { s: "Mir wird schwindlig.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 0, e: "„wird“ ist hier Vollverb im Präsens (schwindlig werden)." },
          { s: "Bis Freitag wird er das Buch gelesen haben.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 5 }
        ] },
      { typ: "luecke", t: "Setze das Verb ins Präteritum.", tipp: "Viele wichtige Verben sind unregelmäßig: gehen – ging, schreiben – schrieb.",
        items: ["Gestern [[ging]] Ben früh ins Bett. (gehen)",
                "Die Klasse [[schrieb]] eine Probe. (schreiben)",
                "Der Hund [[lief]] über die Straße. (laufen)",
                "Wir [[brachten]] Kuchen mit. (bringen)",
                "Sie [[saß]] in der ersten Reihe. (sitzen)",
                "Plötzlich [[fiel]] der Strom aus. (ausfallen)"] },
      { typ: "zuordnen", t: "Perfekt mit „haben“ oder mit „sein“?", tipp: "Bewegung von A nach B oder Veränderung → sein. Sonst meistens haben.",
        gruppen: ["Perfekt mit „sein“", "Perfekt mit „haben“"],
        karten: [["gehen", 0], ["fahren", 0], ["aufstehen", 0], ["einschlafen", 0], ["wachsen", 0], ["bleiben", 0],
                 ["lesen", 1], ["essen", 1], ["kaufen", 1], ["spielen", 1], ["schlafen", 1], ["lernen", 1]] },
      { typ: "luecke", t: "Setze das Verb ins Perfekt.", tipp: "Hilfsverb (haben/sein) + Partizip II am Satzende.",
        items: ["Mila [[ist]] nach Hause [[gelaufen]]. (laufen)",
                "Wir [[haben]] den Film schon [[gesehen]]. (sehen)",
                "Der Zug [[ist]] pünktlich [[angekommen]]. (ankommen)",
                "Ich [[habe]] dir eine Nachricht [[geschrieben]]. (schreiben)"] },
      { typ: "umformen", t: "Setze den Satz in die angegebene Zeitform.", quali: true, tipp: "Perfekt: haben/sein + Partizip II · Plusquamperfekt: hatte/war + Partizip II · Futur I: werden + Infinitiv",
        items: [
          { f: "ins Präteritum", s: "Ich spiele Fußball.", l: ["Ich spielte Fußball."] },
          { f: "ins Perfekt", s: "Wir fahren nach Italien.", l: ["Wir sind nach Italien gefahren."] },
          { f: "ins Futur I", s: "Die Sonne scheint.", l: ["Die Sonne wird scheinen."] },
          { f: "ins Plusquamperfekt", s: "Er kauft ein Ticket.", l: ["Er hatte ein Ticket gekauft."] }
        ] },
      { typ: "wahl", t: "Welche Zeitform passt?",
        items: [
          { f: "Einen Zeitungsbericht schreibt man meist im …", o: ["Präsens", "Präteritum", "Futur I"], a: 1 },
          { f: "Wenn du mündlich vom Wochenende erzählst, sagst du meist …", o: ["Perfekt", "Plusquamperfekt", "Futur II"], a: 0 },
          { f: "Eine Inhaltsangabe schreibst du im …", o: ["Präteritum", "Präsens", "Perfekt"], a: 1 },
          { f: "Was vor einem anderen vergangenen Ereignis geschah, steht im …", o: ["Perfekt", "Präteritum", "Plusquamperfekt"], a: 2 }
        ] }
    ],
    plus: [
      { typ: "wahl", t: "Vorsicht, Falle: Bestimme die Zeitform.", tipp: "Frag dich: Welche Form hat das gebeugte Verb? Ist „werden“ Vollverb, Passiv-Hilfsverb oder Futur-Hilfsverb?",
        items: [
          { s: "Mir wurde ganz schlecht vor Aufregung.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 1, e: "„wurde“ ist Präteritum von „werden“." },
          { s: "Das Haus wird gerade gestrichen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 0, e: "Passiv im Präsens: wird + Partizip II." },
          { s: "Er wird wohl krank sein.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 4, e: "werden + Infinitiv: Futur I, hier als Vermutung." },
          { s: "Sie war schon gegangen, als ich kam.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 3, e: "„war … gegangen“ = Plusquamperfekt." }
        ] },
      { typ: "umformen", t: "Setze den Satz in drei weitere Zeitformen.", quali: true, tipp: "abpfeifen – pfiff ab – hat abgepfiffen",
        items: [
          { f: "Präsens", s: "Der Schiedsrichter pfiff das Spiel ab.", l: ["Der Schiedsrichter pfeift das Spiel ab."] },
          { f: "Perfekt", s: "Der Schiedsrichter pfiff das Spiel ab.", l: ["Der Schiedsrichter hat das Spiel abgepfiffen."] },
          { f: "Futur I", s: "Der Schiedsrichter pfiff das Spiel ab.", l: ["Der Schiedsrichter wird das Spiel abpfeifen."] }
        ] },
      { typ: "luecke", t: "Vorher – nachher: Wähle die passenden Verbformen.", tipp: "Im nachdem-Satz steht Plusquamperfekt, wenn der Hauptsatz im Präteritum steht.",
        items: ["Nachdem wir den Tisch {{gedeckt hatten|deckten|haben gedeckt}}, {{kamen|waren gekommen|kommen}} die Gäste.",
                "Nachdem Ben die Probe {{geschrieben hatte|schrieb|schreibt}}, {{fühlte|hatte gefühlt|fühlt}} er sich erleichtert.",
                "Nachdem sie {{angekommen waren|ankamen|angekommen sind}}, {{riefen|hatten gerufen|rufen}} sie zu Hause an."] },
      { typ: "frei", t: "Schreibe selbst einen Satz mit „nachdem“.",
        items: [
          { f: "Erzähle von einem Ausflug: Nebensatz im Plusquamperfekt, Hauptsatz im Präteritum.",
            kriterien: ["Nebensatz mit „nachdem“ im Plusquamperfekt (hatte/war + Partizip II)", "Hauptsatz im Präteritum"],
            muster: "nachdem.+\\b(hatte|hatten|hattest|hattet|war|waren|warst|wart)\\b\\s*,",
            bsp: "Nachdem wir den Berg bestiegen hatten, machten wir eine lange Pause." }
        ] }
    ]
  });
  </script>
