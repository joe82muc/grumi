  <title>Satzglieder | Deutsch 9 Grammatik</title>
  <meta name="description" content="Deutsch 9 Grammatik, Thema 2: Satzglieder mit der Umstellprobe finden – Subjekt, Prädikat, Objekte und adverbiale Bestimmungen. Mit Basis- und Plus-Aufgaben.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script>
  Grammatik.seite({
    nr: 2,
    titel: "Satzglieder",
    lead: "Ein Satz besteht aus Bausteinen, den Satzgliedern. Mit der Umstellprobe findest du sie – und mit der richtigen Frage bestimmst du sie.",
    ziele: ["Du findest Satzglieder mit der Umstellprobe.", "Du bestimmst Subjekt, Prädikat und Objekte.", "Du erkennst adverbiale Bestimmungen."],
    merk: [
      { t: "Die Umstellprobe", html: `
        <p>Was beim Umstellen zusammenbleibt, ist <b>ein</b> Satzglied. Das gebeugte Verb bleibt im Aussagesatz immer an zweiter Stelle.</p>
        <div class="bsp">Lea | schenkt | ihrem Bruder | am Freitag | ein Buch.</div>
        <div class="bsp">Am Freitag | schenkt | Lea | ihrem Bruder | ein Buch.</div>
        <div class="bsp">Ein Buch | schenkt | Lea | am Freitag | ihrem Bruder.</div>
        <p class="merksatz">Fünf Bausteine bleiben zusammen → fünf Satzglieder.</p>` },
      { t: "Subjekt und Prädikat", html: `
        <p>Das <b>Prädikat</b> ist das Verb – manchmal zweiteilig, dann bildet es eine Klammer:</p>
        <div class="bsp">Ben <span class="hl-r">hat</span> den Zug <span class="hl-r">verpasst</span>. · Mila <span class="hl-r">ruft</span> ihre Oma <span class="hl-r">an</span>.</div>
        <p>Das <b>Subjekt</b> findest du mit <b>Wer oder was?</b> + Prädikat. Es steht im Nominativ und passt zum Verb:</p>
        <div class="bsp"><span class="hl-b">Die Kinder</span> spielen. → <i>Wer spielt?</i> Die Kinder.</div>` },
      { t: "Objekte", html: `
        <table><tr><th>Satzglied</th><th>Frage</th><th>Beispiel</th></tr>
        <tr><td><b>Akkusativobjekt</b></td><td>Wen oder was?</td><td>Tarek kauft <span class="hl-g">ein Ticket</span>.</td></tr>
        <tr><td><b>Dativobjekt</b></td><td>Wem?</td><td>Sie hilft <span class="hl-v">ihrem Opa</span>.</td></tr>
        <tr><td><b>Präpositionalobjekt</b></td><td>Worauf? Über wen? Woran? …</td><td>Wir warten <span class="hl-o">auf den Bus</span>.</td></tr>
        <tr><td><b>Genitivobjekt</b> (selten)</td><td>Wessen?</td><td>Sie gedachten <span class="hl">der Opfer</span>.</td></tr></table>
        <p class="merksatz">Stell die Frage immer mit dem Prädikat: Wem hilft sie? – Ihrem Opa.</p>` },
      { t: "Adverbiale Bestimmungen", html: `
        <ul><li><span class="hl-o"><b>Zeit</b></span> – Wann? Wie lange? Seit wann? → <i>am Morgen, seit Montag</i></li>
        <li><span class="hl-g"><b>Ort</b></span> – Wo? Wohin? Woher? → <i>im Park, nach Hause</i></li>
        <li><span class="hl-v"><b>Art und Weise</b></span> – Wie? Womit? → <i>leise, mit dem Rad</i></li>
        <li><span class="hl-b"><b>Grund</b></span> – Warum? Weshalb? → <i>wegen des Regens</i></li></ul>
        <div class="bsp"><span class="hl-o">Nach der Schule</span> fährt Aylin <span class="hl-v">mit dem Rad</span> <span class="hl-g">zum Training</span>.</div>` }
    ],
    fallen: [
      "Ein Satzglied kann aus mehreren Wörtern bestehen: **der neue Hausmeister der Schule** ist ein Satzglied.",
      "Zweiteilige Prädikate: Markiere beide Teile – **hat** … **gekauft**, **ruft** … **an**.",
      "Akkusativ oder Dativ? Frag mit dem Prädikat: Wen sieht sie? – Wem hilft sie?",
      "Präpositionalobjekt oder Adverbiale? Sie wartet **auf dem Parkplatz** (Wo? → Adverbiale) – sie wartet **auf ihre Freundin** (Auf wen? → Objekt)."
    ],
    basis: [
      { typ: "markieren", t: "Markiere das Subjekt blau und das Prädikat rot.", stifte: [["b", "Subjekt"], ["r", "Prädikat"]],
        tipp: "Erst das Verb suchen (bei zwei Teilen beide markieren), dann fragen: Wer oder was …?",
        items: ["[b:Der neue Hausmeister] [r:repariert] heute die Tür.",
                "Am Wochenende [r:hat] [b:meine Schwester] ihren Führerschein [r:bestanden].",
                "[b:Die Schülerinnen und Schüler der 9b] [r:planen] ein Sommerfest.",
                "Morgen [r:ruft] [b:Emre] beim Ausbildungsbetrieb [r:an]."] },
      { typ: "wahl", t: "Welches Satzglied ist unterstrichen?", quali: true, tipp: "Frag mit dem Prädikat: Wer? Wen? Wem? Wann? Wo? Wie? Warum?",
        items: [
          { s: "Der Trainer gibt __den Spielern__ letzte Tipps.", o: ["Subjekt", "Akkusativobjekt", "Dativobjekt", "Adverbiale"], a: 2, e: "Wem gibt er Tipps? – Den Spielern: Dativobjekt." },
          { s: "Der Trainer gibt den Spielern __letzte Tipps__.", o: ["Subjekt", "Akkusativobjekt", "Dativobjekt", "Adverbiale"], a: 1, e: "Wen oder was gibt er? – Letzte Tipps: Akkusativobjekt." },
          { s: "__Nach dem Spiel__ feiern alle zusammen.", o: ["Subjekt", "Prädikat", "Akkusativobjekt", "Adverbiale"], a: 3, e: "Wann feiern alle? – Adverbiale der Zeit." },
          { s: "__Die Zuschauer__ jubeln laut.", o: ["Subjekt", "Prädikat", "Dativobjekt", "Adverbiale"], a: 0 },
          { s: "Ich __habe__ den Bus __verpasst__.", o: ["Subjekt", "Prädikat", "Akkusativobjekt", "Adverbiale"], a: 1, e: "„habe … verpasst“ ist ein zweiteiliges Prädikat." }
        ] },
      { typ: "bauen", t: "Umstellprobe: Stelle die Satzglieder neu zusammen.", tipp: "Das gebeugte Verb steht an zweiter Stelle – egal, womit du beginnst.",
        items: [
          { f: "Beginne mit dem Subjekt.", teile: ["Die Klasse 9a", "verkauft", "beim Schulfest", "Waffeln"], l: ["Die Klasse 9a verkauft Waffeln beim Schulfest"] },
          { f: "Beginne mit der Zeitangabe.", teile: ["Seit drei Wochen", "trainiert", "Tarek", "für den Stadtlauf"] },
          { f: "Beginne mit dem Akkusativobjekt.", teile: ["Den Schlüssel", "hat", "der Hausmeister", "gestern", "gefunden"], l: ["Den Schlüssel hat gestern der Hausmeister gefunden"] }
        ] },
      { typ: "wahl", t: "Wie viele Satzglieder hat der Satz? Mach die Umstellprobe im Kopf.", quali: true, tipp: "Zähle die Bausteine, die beim Umstellen zusammenbleiben. Das Prädikat zählt als ein Satzglied.",
        items: [
          { s: "Meine Oma backt jeden Sonntag einen Kuchen.", o: ["3", "4", "5", "6"], a: 1, e: "Meine Oma | backt | jeden Sonntag | einen Kuchen" },
          { s: "Der Busfahrer wartete wegen des Regens geduldig auf die Kinder.", o: ["3", "4", "5", "6"], a: 2, e: "Der Busfahrer | wartete | wegen des Regens | geduldig | auf die Kinder" },
          { s: "Die Schülersprecherin überreicht dem Direktor die Liste.", o: ["3", "4", "5", "6"], a: 1, e: "Die Schülersprecherin | überreicht | dem Direktor | die Liste" },
          { s: "Im Sommer fahren wir mit dem Zug an die Ostsee.", o: ["3", "4", "5", "6"], a: 2, e: "Im Sommer | fahren | wir | mit dem Zug | an die Ostsee" }
        ] },
      { typ: "wahl", t: "Mit welcher Frage findest du das unterstrichene Satzglied?", tipp: "Setz die Frage zusammen mit dem Prädikat: „Wem hilft Sophia?“",
        items: [
          { s: "Sophia hilft __ihrem Opa__ im Garten.", o: ["Wer oder was?", "Wen oder was?", "Wem?", "Wo?"], a: 2 },
          { s: "Sophia hilft ihrem Opa __im Garten__.", o: ["Wem?", "Wo?", "Wann?", "Wie?"], a: 1 },
          { s: "__Wegen der Hitze__ fällt der Sport aus.", o: ["Wann?", "Wie?", "Warum?", "Wo?"], a: 2 },
          { s: "Die Band spielt __sehr laut__.", o: ["Wie?", "Wen oder was?", "Wo?", "Warum?"], a: 0 },
          { s: "__Der Schulbus__ hat Verspätung.", o: ["Wer oder was?", "Wen oder was?", "Wem?", "Wessen?"], a: 0 }
        ] },
      { typ: "markieren", t: "Markiere die adverbialen Bestimmungen in der passenden Farbe.",
        stifte: [["o", "Zeit"], ["g", "Ort"], ["v", "Art und Weise"], ["b", "Grund"]],
        tipp: "Frag: Wann? Wo/Wohin? Wie? Warum? – und markiere das ganze Satzglied.",
        items: ["[o:Am Montag] fährt die Klasse [g:nach München].",
                "[b:Wegen des Streiks] fiel der Unterricht [o:am Dienstag] aus.",
                "Die Kinder warteten [v:ungeduldig] [g:vor der Turnhalle].",
                "[o:Seit Stunden] sitzt Ben [v:konzentriert] [g:am Schreibtisch]."] }
    ],
    plus: [
      { typ: "markieren", t: "Bestimme alle Satzglieder: Markiere jedes in seiner Farbe.", quali: true,
        stifte: [["b", "Subjekt"], ["r", "Prädikat"], ["g", "Akkusativobjekt"], ["v", "Dativobjekt"], ["o", "Adverbiale"]],
        tipp: "Jedes Wort gehört zu einem Satzglied. Beginne mit dem Prädikat, dann das Subjekt, dann die Objekte.",
        items: ["[b:Die Lehrerin] [r:erklärt] [v:den Schülern] [g:die Aufgabe].",
                "[o:Gestern] [r:hat] [b:der Nachbar] [v:uns] [g:seine Leiter] [r:geliehen].",
                "[o:Wegen des Regens] [r:bringt] [b:Papa] [v:mir] [g:einen Schirm]."] },
      { typ: "wahl", t: "Präpositionalobjekt oder adverbiale Bestimmung?", tipp: "Fragt man mit „Wo? Wann? Wie?“, ist es eine Adverbiale. Fragt man „Auf wen? Worüber? Woran?“, ist es ein Präpositionalobjekt.",
        items: [
          { s: "Sie wartet __auf ihre Freundin__.", o: ["Präpositionalobjekt", "Adverbiale"], a: 0, e: "Auf wen wartet sie? → Präpositionalobjekt." },
          { s: "Sie wartet __auf dem Parkplatz__.", o: ["Präpositionalobjekt", "Adverbiale"], a: 1, e: "Wo wartet sie? → Adverbiale des Ortes." },
          { s: "Wir sprechen __über die Klassenfahrt__.", o: ["Präpositionalobjekt", "Adverbiale"], a: 0 },
          { s: "Er fährt __mit dem Fahrrad__ zur Schule.", o: ["Präpositionalobjekt", "Adverbiale"], a: 1, e: "Wie fährt er? → Adverbiale der Art und Weise." },
          { s: "Ich freue mich __auf die Ferien__.", o: ["Präpositionalobjekt", "Adverbiale"], a: 0 }
        ] },
      { typ: "frei", t: "Ergänze den Satz um das verlangte Satzglied und schreibe ihn ganz auf.", quali: true,
        items: [
          { f: "„Die Klasse besucht das Museum.“ → Ergänze eine adverbiale Bestimmung der Zeit.",
            kriterien: ["Der Satz enthält eine Zeitangabe (Wann? Wie lange?).", "Der Ausgangssatz bleibt erhalten."],
            muster: "(morgen|heute|gestern|übermorgen|\\bam\\b|\\bim\\b|\\bum\\b|nächst|letzt|\\bnach\\b|\\bvor\\b|seit|während|uhr|tag|woche|monat|jahr|sommer|winter|frühling|herbst)",
            bsp: "Am Donnerstag besucht die Klasse das Museum." },
          { f: "„Der Hausmeister zeigt den neuen Raum.“ → Ergänze ein Dativobjekt (Wem?).",
            kriterien: ["Der Satz enthält ein Dativobjekt (Wem zeigt er den Raum?).", "Der Ausgangssatz bleibt erhalten."],
            muster: "zeigt\\s+(heute\\s+|morgen\\s+|gleich\\s+)?(dem|der|den|ihm|ihr|ihnen|uns|euch|mir|dir|meinem|meiner|meinen|seinem|seiner|seinen|ihrem|ihrer|ihren|unserem|unserer|unseren|einem|einer|allen)\\b(?! neuen raum)",
            bsp: "Der Hausmeister zeigt den Eltern den neuen Raum." }
        ] },
      { typ: "bauen", t: "Umstellprobe mit zweiteiligem Prädikat", tipp: "„hat“ bleibt an zweiter Stelle, „geschenkt“ steht am Ende.",
        items: [
          { f: "Beginne mit dem Dativobjekt.", teile: ["Ihrem Bruder", "hat", "Mila", "zum Geburtstag", "ein Skateboard", "geschenkt"], l: ["Ihrem Bruder hat Mila ein Skateboard zum Geburtstag geschenkt"] },
          { f: "Beginne mit dem Akkusativobjekt.", teile: ["Ein Skateboard", "hat", "Mila", "ihrem Bruder", "zum Geburtstag", "geschenkt"], l: ["Ein Skateboard hat Mila zum Geburtstag ihrem Bruder geschenkt"] }
        ] }
    ]
  });
  </script>
