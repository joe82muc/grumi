<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="robots" content="noindex, nofollow">
  <title>Windrad AR | GRUMI Testlabor</title>
  <link rel="stylesheet" href="style.css?v=20261009-1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main class="lab">
    <header class="topbar">
      <div class="brand"><i data-lucide="wind" aria-hidden="true"></i><div><span class="eyebrow">GRUMI TESTLABOR</span><h1>Windrad</h1></div></div>
      <div class="modes" role="group" aria-label="Ansicht">
        <button id="mode-3d" class="mode selected" aria-pressed="true" type="button"><i data-lucide="box"></i><span>3D</span></button>
        <button id="mode-ar" class="mode" aria-pressed="false" type="button"><i data-lucide="scan-line"></i><span>AR</span></button>
      </div>
      <button class="icon-button marker-button" id="marker-open" type="button" title="AR-Marker" aria-label="AR-Marker"><i data-lucide="qr-code"></i></button>
    </header>
    <div class="workspace">
      <section class="stage" id="stage" aria-label="Animiertes dreidimensionales Windrad">
        <video id="camera" autoplay muted playsinline hidden></video>
        <canvas id="scene" aria-label="Windrad mit rotierenden Rotorblaettern"></canvas>
        <div class="scene-status" role="status"><span class="status-dot" id="status-dot"></span><span id="status">Modell wird geladen</span></div>
        <div class="scene-tools">
          <button class="icon-button" id="reset-view" type="button" title="Ansicht zuruecksetzen" aria-label="Ansicht zuruecksetzen"><i data-lucide="rotate-ccw"></i></button>
          <button class="icon-button" id="camera-flip" type="button" title="Kamera wechseln" aria-label="Kamera wechseln" hidden><i data-lucide="switch-camera"></i></button>
          <button class="icon-button" id="snapshot" type="button" title="Bild herunterladen" aria-label="Bild herunterladen"><i data-lucide="camera"></i></button>
          <button class="icon-button" id="fullscreen" type="button" title="Vollbild" aria-label="Vollbild"><i data-lucide="maximize"></i></button>
        </div>
        <div class="part-label" id="label-rotor" hidden>Rotor</div>
        <div class="part-label" id="label-generator" hidden>Generator</div>
        <div class="part-label" id="label-tower" hidden>Turm</div>
        <div class="loading" id="loading"><span class="spinner"></span></div>
        <div class="error-view" id="fatal" hidden><i data-lucide="triangle-alert"></i><p id="fatal-text"></p><button type="button" id="reload">Erneut laden</button></div>
        <noscript><p class="error-view">JavaScript ist fuer diese Animation erforderlich.</p></noscript>
      </section>
      <aside class="controls" aria-label="Windrad-Einstellungen">
        <div class="control-heading"><h2>Wind &amp; Bewegung</h2><button class="icon-button accent" id="pause" type="button" title="Animation pausieren" aria-label="Animation pausieren" aria-pressed="false" disabled><i data-lucide="pause"></i></button></div>
        <div class="wind-control"><label for="wind">Windgeschwindigkeit</label><output id="wind-output" for="wind">8 m/s</output><input id="wind" type="range" min="0" max="16" step="1" value="8"><div class="range-ends"><span>0</span><span>16 m/s</span></div></div>
        <div class="readings"><div><span>Rotor</span><strong><output id="rpm">14</output> <small>U/min</small></strong></div><div><span>Betrieb</span><strong id="operation">Dreht sich</strong></div></div>
        <div class="switches"><label><input id="inside" type="checkbox"><span>Innenansicht</span></label><label><input id="labels" type="checkbox"><span>Bauteile</span></label></div>
        <div class="ar-size" id="ar-size"><label for="scale">AR-Modellgr&ouml;&szlig;e <output id="scale-output">100 %</output></label><input id="scale" type="range" min="50" max="150" step="10" value="100" disabled></div>
        <div class="control-footer"><span>Animiertes Unterrichtsmodell</span><a href="marker.html" target="_blank" rel="noopener"><i data-lucide="printer"></i><span>AR-Marker</span></a></div>
      </aside>
    </div>
    <p class="toast" id="toast" role="alert" hidden></p>
  </main>
  <dialog id="marker-dialog" aria-labelledby="marker-title">
    <div class="dialog-heading"><h2 id="marker-title">AR-Marker</h2><button class="icon-button" id="marker-close" type="button" aria-label="Schliessen" title="Schliessen"><i data-lucide="x"></i></button></div>
    <img src="assets/hiro.png" width="400" height="400" alt="Schwarz-weisser Hiro-Marker fuer die AR-Erkennung">
    <div class="dialog-actions"><a class="command" href="marker.html" target="_blank" rel="noopener"><i data-lucide="printer"></i>Drucken</a><a class="command secondary" href="assets/hiro.png" download="windrad-ar-marker.png"><i data-lucide="download"></i>Bild</a></div>
  </dialog>
  <script src="../../Kalender/vendor/lucide.min.js"></script>
  <script type="module" src="app.js?v=20261009-3"></script>
</body>
</html>
