<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Wo finde ich die Kanaele in GIMP?</title>
  <desc id="desc">Nachzeichnung der GIMP-Oberflaeche im dunklen Design mit hervorgehobenem Reiter Kanaele rechts unten.</desc>
  <rect width="920" height="560" fill="#fbfdfd"/>
  <text x="40" y="44" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0c5f66">Wo finde ich die Kanäle?</text>
  <text x="40" y="72" font-family="Arial, sans-serif" font-size="17" fill="#41585a">Rechts unten, direkt neben dem Reiter &#187;Ebenen&#171;.</text>

  <!-- Programmfenster -->
  <rect x="40" y="90" width="840" height="400" rx="6" fill="#454545" stroke="#2b2b2b" stroke-width="2"/>

  <!-- Titelleiste -->
  <rect x="40" y="90" width="840" height="22" rx="6" fill="#3a3a3a"/>
  <rect x="40" y="104" width="840" height="8" fill="#3a3a3a"/>
  <text x="54" y="106" font-family="Arial, sans-serif" font-size="12" fill="#d8d8d8">GNU Image Manipulation Program</text>

  <!-- Menueleiste -->
  <rect x="40" y="112" width="840" height="20" fill="#454545"/>
  <text x="54" y="126" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">Datei   Bearbeiten   Auswahl   Ansicht   Bild   Ebene   Farben   Werkzeuge   Filter   Fenster   Hilfe</text>

  <!-- Werkzeugkasten links -->
  <rect x="44" y="136" width="128" height="350" fill="#3f3f3f"/>
  <g fill="#c9c9c9">
    <rect x="54" y="146" width="18" height="18" rx="3"/><rect x="80" y="146" width="18" height="18" rx="3"/>
    <rect x="106" y="146" width="18" height="18" rx="3"/><rect x="132" y="146" width="18" height="18" rx="3"/>
    <rect x="54" y="170" width="18" height="18" rx="3"/><rect x="80" y="170" width="18" height="18" rx="3"/>
    <rect x="106" y="170" width="18" height="18" rx="3"/><rect x="132" y="170" width="18" height="18" rx="3"/>
    <rect x="54" y="194" width="18" height="18" rx="3"/><rect x="80" y="194" width="18" height="18" rx="3"/>
  </g>
  <!-- Vorder-/Hintergrundfarbe -->
  <rect x="58" y="226" width="26" height="26" fill="#000000" stroke="#8a8a8a"/>
  <rect x="74" y="242" width="26" height="26" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="54" y="296" font-family="Arial, sans-serif" font-size="11" fill="#bdbdbd">Pinsel</text>
  <g fill="#575757">
    <rect x="54" y="306" width="110" height="14" rx="2"/>
    <rect x="54" y="326" width="110" height="14" rx="2"/>
    <rect x="54" y="346" width="110" height="14" rx="2"/>
    <rect x="54" y="366" width="110" height="14" rx="2"/>
  </g>
  <text x="58" y="317" font-family="Arial, sans-serif" font-size="10" fill="#d0d0d0">Modus      Normal</text>
  <text x="58" y="337" font-family="Arial, sans-serif" font-size="10" fill="#d0d0d0">Deckkraft   100,0</text>
  <text x="58" y="357" font-family="Arial, sans-serif" font-size="10" fill="#d0d0d0">Größe        51,00</text>
  <text x="58" y="377" font-family="Arial, sans-serif" font-size="10" fill="#d0d0d0">Härte        50,0</text>

  <!-- Bildfenster Mitte -->
  <rect x="178" y="136" width="480" height="350" fill="#5a5a5a"/>
  <text x="352" y="316" font-family="Arial, sans-serif" font-size="14" fill="#8f8f8f">Hier liegt dein Bild</text>

  <!-- Rechte Spalte oben: Pinselauswahl -->
  <rect x="664" y="136" width="212" height="150" fill="#3f3f3f"/>
  <g fill="#6d6d6d">
    <rect x="672" y="142" width="18" height="16" rx="2"/><rect x="694" y="142" width="18" height="16" rx="2"/>
    <rect x="716" y="142" width="18" height="16" rx="2"/><rect x="738" y="142" width="18" height="16" rx="2"/>
  </g>
  <rect x="672" y="166" width="196" height="14" rx="2" fill="#575757"/>
  <text x="676" y="177" font-family="Arial, sans-serif" font-size="10" fill="#d0d0d0">Filter</text>
  <g fill="#8a8a8a">
    <rect x="672" y="188" width="24" height="22" rx="2"/><rect x="700" y="188" width="24" height="22" rx="2"/>
    <rect x="728" y="188" width="24" height="22" rx="2"/><rect x="756" y="188" width="24" height="22" rx="2"/>
    <rect x="784" y="188" width="24" height="22" rx="2"/><rect x="812" y="188" width="24" height="22" rx="2"/>
    <rect x="672" y="214" width="24" height="22" rx="2"/><rect x="700" y="214" width="24" height="22" rx="2"/>
    <rect x="728" y="214" width="24" height="22" rx="2"/><rect x="756" y="214" width="24" height="22" rx="2"/>
    <rect x="784" y="214" width="24" height="22" rx="2"/><rect x="812" y="214" width="24" height="22" rx="2"/>
    <rect x="672" y="240" width="24" height="22" rx="2"/><rect x="700" y="240" width="24" height="22" rx="2"/>
    <rect x="728" y="240" width="24" height="22" rx="2"/><rect x="756" y="240" width="24" height="22" rx="2"/>
  </g>

  <!-- Rechte Spalte unten: HIER die Reiter -->
  <rect x="664" y="292" width="212" height="194" fill="#3f3f3f"/>

  <!-- Reiterzeile, hervorgehoben -->
  <rect x="660" y="296" width="220" height="34" fill="#2b2b2b"/>
  <rect x="670" y="302" width="42" height="24" rx="3" fill="#5a5a5a"/>
  <text x="678" y="318" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Ebenen</text>
  <rect x="718" y="302" width="42" height="24" rx="3" fill="#eaf6f6" stroke="#7fd1c4" stroke-width="2"/>
  <text x="724" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0c5f66">Kanäle</text>
  <rect x="766" y="302" width="42" height="24" rx="3" fill="#4a4a4a"/>
  <text x="772" y="318" font-family="Arial, sans-serif" font-size="11" fill="#c9c9c9">Pfade</text>

  <!-- Kanalliste -->
  <rect x="672" y="340" width="196" height="26" rx="3" fill="#4a4a4a"/>
  <rect x="678" y="345" width="16" height="16" rx="2" fill="#d94b4b"/>
  <text x="702" y="357" font-family="Arial, sans-serif" font-size="11" fill="#e8e8e8">Rot</text>

  <rect x="672" y="370" width="196" height="26" rx="3" fill="#4a4a4a"/>
  <rect x="678" y="375" width="16" height="16" rx="2" fill="#4caf72"/>
  <text x="702" y="387" font-family="Arial, sans-serif" font-size="11" fill="#e8e8e8">Grün</text>

  <rect x="672" y="400" width="196" height="26" rx="3" fill="#0c5f66" stroke="#7fd1c4" stroke-width="2"/>
  <rect x="678" y="405" width="16" height="16" rx="2" fill="#3d7fd9"/>
  <text x="702" y="417" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Blau</text>

  <text x="672" y="448" font-family="Arial, sans-serif" font-size="10" fill="#a8a8a8">Diesen Eintrag mit gedrückter</text>
  <text x="672" y="464" font-family="Arial, sans-serif" font-size="10" fill="#a8a8a8">Maustaste ins Bild ziehen.</text>

  <!-- Markierungsring um die Reiter -->
  <rect x="654" y="288" width="232" height="46" rx="8" fill="none" stroke="#e0a63c" stroke-width="3"/>
  <!-- Zeiger dorthin -->
  <path d="M 560 520 L 700 344" stroke="#e0a63c" stroke-width="3" fill="none"/>
  <path d="M 700 344 l 2 17 l -14 -9 z" fill="#e0a63c"/>
  <rect x="180" y="502" width="380" height="36" rx="8" fill="#fdf3e0" stroke="#e0a63c" stroke-width="2"/>
  <text x="196" y="526" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#8a5a00">Hier klicken: der Reiter &#187;Kanäle&#171;</text>

  <text x="40" y="546" font-family="Arial, sans-serif" font-size="13" fill="#6c8486">Siehst du den Reiter nicht? Dann: Fenster &#8250; Andockbare Dialoge &#8250; Kanäle</text>
</svg>
