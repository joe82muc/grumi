<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Aus Grau wird Schwarz und Weiss</title>
  <desc id="desc">Invertieren, Belichtung und Kurven machen aus dem Graubild eine klare Schablone.</desc>
  <rect width="920" height="520" fill="#fbfdfd"/>
  <text x="46" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5f66">Schritt 2: Schablone bauen</text>
  <text x="46" y="82" font-family="Arial, sans-serif" font-size="18" fill="#41585a">Ziel: Motiv komplett weiss, Hintergrund komplett schwarz.</text>

  <!-- Stufe 1 -->
  <g>
    <rect x="46" y="112" width="182" height="134" rx="8" fill="#e8e8e8" stroke="#0c5f66" stroke-width="3"/>
    <rect x="49" y="206" width="176" height="37" fill="#3a3a3a"/>
    <path d="M 137 146 l 30 56 h -60 z" fill="#111111"/>
    <path d="M 137 168 l 38 45 h -76 z" fill="#111111"/>
    <text x="46" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">1. Blaukanal</text>
    <text x="46" y="292" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Motiv dunkel,</text>
    <text x="46" y="312" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Himmel hell.</text>
  </g>

  <path d="M 240 180 L 282 180" stroke="#0c5f66" stroke-width="4" fill="none"/>
  <path d="M 282 180 l -12 -8 v 16 z" fill="#0c5f66"/>

  <!-- Stufe 2 -->
  <g>
    <rect x="294" y="112" width="182" height="134" rx="8" fill="#2a2a2a" stroke="#0c5f66" stroke-width="3"/>
    <rect x="297" y="206" width="176" height="37" fill="#c9c9c9"/>
    <path d="M 385 146 l 30 56 h -60 z" fill="#f2f2f2"/>
    <path d="M 385 168 l 38 45 h -76 z" fill="#f2f2f2"/>
    <text x="294" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">2. Invertieren</text>
    <text x="294" y="292" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Farben umdrehen:</text>
    <text x="294" y="312" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Motiv wird hell.</text>
  </g>

  <path d="M 488 180 L 530 180" stroke="#0c5f66" stroke-width="4" fill="none"/>
  <path d="M 530 180 l -12 -8 v 16 z" fill="#0c5f66"/>

  <!-- Stufe 3 -->
  <g>
    <rect x="542" y="112" width="182" height="134" rx="8" fill="#000000" stroke="#0c5f66" stroke-width="3"/>
    <rect x="545" y="206" width="176" height="37" fill="#8a8a8a"/>
    <path d="M 633 146 l 30 56 h -60 z" fill="#ffffff"/>
    <path d="M 633 168 l 38 45 h -76 z" fill="#ffffff"/>
    <text x="542" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">3. Belichtung</text>
    <text x="542" y="292" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Schwarzwert hoch:</text>
    <text x="542" y="312" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Himmel wird schwarz.</text>
  </g>

  <path d="M 736 180 L 778 180" stroke="#0c5f66" stroke-width="4" fill="none"/>
  <path d="M 778 180 l -12 -8 v 16 z" fill="#0c5f66"/>

  <!-- Stufe 4 -->
  <g>
    <rect x="738" y="112" width="146" height="134" rx="8" fill="#000000" stroke="#0c5f66" stroke-width="3"/>
    <path d="M 811 150 l 28 54 h -56 z" fill="#ffffff"/>
    <path d="M 811 172 l 36 44 h -72 z" fill="#ffffff"/>
    <rect x="806" y="210" width="9" height="18" fill="#ffffff"/>
    <text x="738" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">4. Kurven</text>
    <text x="738" y="292" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Reste der Wiese</text>
    <text x="738" y="312" font-family="Arial, sans-serif" font-size="15" fill="#41585a">verschwinden.</text>
  </g>

  <!-- Warnkasten -->
  <rect x="46" y="348" width="838" height="106" rx="10" fill="#fdf3e0" stroke="#e0a63c" stroke-width="3"/>
  <text x="70" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a5a00">Vorsicht beim Belichtungsregler</text>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="16" fill="#6b4c12">Drehst du zu weit auf, wird auch die Wiese weiss - dann wird sie spaeter mit ausgeschnitten.</text>
  <text x="70" y="434" font-family="Arial, sans-serif" font-size="16" fill="#6b4c12">Nur so weit gehen, dass zwischen Motiv und Wiese noch ein Unterschied zu sehen ist.</text>

  <text x="46" y="490" font-family="Arial, sans-serif" font-size="15" fill="#6c8486">GRUMI Lernplattform &#183; Informatik 7</text>
</svg>
