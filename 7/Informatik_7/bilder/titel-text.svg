<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Ein Dokument mit Überschrift, Textzeilen und einem eingefügten Bild">
  <title>Text schreiben und gestalten</title>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#bg4)"/>

  <!-- Blatt hinten -->
  <rect x="268" y="34" width="250" height="200" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2" opacity="0.6" transform="rotate(-5 393 134)"/>

  <!-- Blatt vorne -->
  <rect x="290" y="26" width="260" height="212" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Ueberschrift: zentriert und fett -->
  <rect x="352" y="54" width="136" height="14" rx="7" fill="#0c5f66"/>

  <!-- markierte Zeile -->
  <rect x="314" y="86" width="150" height="14" rx="4" fill="#cfe3e6"/>
  <rect x="318" y="90" width="142" height="6" rx="3" fill="#0c5f66" opacity="0.55"/>

  <!-- normale Zeilen -->
  <g fill="#c7d5db">
    <rect x="314" y="112" width="212" height="6" rx="3"/>
    <rect x="314" y="128" width="196" height="6" rx="3"/>
    <rect x="314" y="144" width="204" height="6" rx="3"/>
  </g>

  <!-- eingefuegtes Bild im Dokument -->
  <rect x="314" y="164" width="96" height="58" rx="6" fill="#eef4f5" stroke="#d8e1e8" stroke-width="2"/>
  <circle cx="338" cy="184" r="8" fill="#f4d9a6"/>
  <path d="M320 216 l22 -24 l18 18 l14 -12 l20 18 Z" fill="#0c5f66" opacity="0.65"/>

  <!-- Zeilen neben dem Bild -->
  <g fill="#c7d5db">
    <rect x="422" y="168" width="104" height="6" rx="3"/>
    <rect x="422" y="184" width="96" height="6" rx="3"/>
    <rect x="422" y="200" width="104" height="6" rx="3"/>
    <rect x="422" y="216" width="70" height="6" rx="3"/>
  </g>

  <!-- Werkzeugleiste links -->
  <rect x="152" y="80" width="96" height="112" rx="12" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <text x="176" y="116" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0c5f66">F</text>
  <text x="212" y="116" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#607084">K</text>
  <g stroke="#607084" stroke-width="4" stroke-linecap="round">
    <line x1="172" y1="142" x2="228" y2="142"/>
    <line x1="180" y1="156" x2="220" y2="156"/>
    <line x1="172" y1="170" x2="228" y2="170"/>
  </g>

  <!-- Stift -->
  <g transform="rotate(38 622 150)">
    <rect x="608" y="72" width="26" height="128" rx="5" fill="#a35b09" opacity="0.85"/>
    <rect x="608" y="72" width="26" height="22" rx="5" fill="#eef4f5"/>
    <path d="M608 200 l13 26 l13 -26 Z" fill="#101828"/>
  </g>
</svg>
