<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Symbolleiste mit den Knöpfen Fett, Schriftgröße und Zentrieren. Darunter eine fertige Überschrift, die groß, fett und zentriert ist.">
  <title>Fett, Schriftgr&#246;&#223;e und Zentrieren anklicken</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #ffffff; font-weight: 600; }
    .txt { font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; fill: #101828; }
    .ruf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #0c5f66; font-weight: 700; }
    .merk { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #14532d; font-weight: 600; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Programmfenster -->
  <rect x="24" y="20" width="712" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v26 H24 Z" fill="#eef4f5"/>
  <circle cx="46" cy="43" r="5" fill="#c7d5db"/>
  <text class="lbl-grau" x="62" y="48">mein_text.docx</text>

  <!-- Symbolleiste, gross dargestellt -->
  <rect x="40" y="76" width="680" height="54" rx="8" fill="#fbfdfd" stroke="#d8e1e8" stroke-width="1.5"/>

  <!-- Fett: hervorgehoben -->
  <rect x="56" y="86" width="36" height="34" rx="6" fill="#eef4f5" stroke="#0c5f66" stroke-width="2"/>
  <text x="66" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0c5f66">F</text>

  <text x="110" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-style="italic" fill="#8b97a4">K</text>
  <text x="146" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="19" text-decoration="underline" fill="#8b97a4">U</text>

  <rect x="182" y="88" width="2" height="30" fill="#d8e1e8"/>

  <!-- Schriftgroesse: hervorgehoben -->
  <rect x="198" y="86" width="84" height="34" rx="6" fill="#eef4f5" stroke="#0c5f66" stroke-width="2"/>
  <text class="lbl" x="212" y="109" font-weight="700" fill="#0c5f66">20</text>
  <path d="M262 100 l7 8 l7 -8" stroke="#0c5f66" stroke-width="2" fill="none"/>

  <rect x="296" y="88" width="2" height="30" fill="#d8e1e8"/>

  <!-- Ausrichtung: linksbuendig, zentriert (hervorgehoben), rechtsbuendig -->
  <g stroke="#8b97a4" stroke-width="2">
    <path d="M316 95 h26 M316 103 h18 M316 111 h26"/>
  </g>
  <rect x="356" y="86" width="40" height="34" rx="6" fill="#eef4f5" stroke="#0c5f66" stroke-width="2"/>
  <g stroke="#0c5f66" stroke-width="2">
    <path d="M364 95 h24 M368 103 h16 M364 111 h24"/>
  </g>
  <g stroke="#8b97a4" stroke-width="2">
    <path d="M412 95 h26 M420 103 h18 M412 111 h26"/>
  </g>

  <!-- Blatt mit Ergebnis -->
  <rect x="150" y="152" width="460" height="172" rx="4" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/>

  <!-- Ueberschrift: gross, fett, zentriert -->
  <text x="380" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="23" font-weight="800" fill="#101828">Mein Ausflug an die Isar</text>

  <!-- Flie&#223;text -->
  <text class="txt" x="180" y="236">Am Samstag waren wir mit der Klasse an der</text>
  <text class="txt" x="180" y="262">Isar. Das Wetter war <tspan font-weight="800">sch&#246;n</tspan>. Wir haben Steine</text>
  <text class="txt" x="180" y="288">ins Wasser geworfen.</text>

  <!-- Beschriftungen -->
  <path d="M74 140 L74 86" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <text class="ruf" x="44" y="156">fett</text>

  <path d="M240 140 L240 120" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <text class="ruf" x="196" y="156">Schriftgr&#246;&#223;e</text>

  <path d="M376 140 L376 120" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <text class="ruf" x="340" y="156">zentriert</text>

  <path d="M628 190 L618 190" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="618" cy="190" r="3" fill="#0c5f66"/>
  <text class="ruf" x="636" y="186">gro&#223;, fett</text>
  <text class="ruf" x="636" y="204">und zentriert</text>

  <path d="M628 258 L536 258" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="536" cy="258" r="3" fill="#0c5f66"/>
  <text class="ruf" x="636" y="254">wichtiges</text>
  <text class="ruf" x="636" y="272">Wort fett</text>

  <!-- Merksatz -->
  <rect x="24" y="366" width="712" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="merk" x="44" y="395">Merke: Weniger ist mehr &#8211; h&#246;chstens zwei Schriftarten in einem Dokument.</text>
</svg>
