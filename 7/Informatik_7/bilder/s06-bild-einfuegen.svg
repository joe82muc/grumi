<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Das Menü Einfügen ist geöffnet, der Eintrag Bilder ist hervorgehoben. Daneben ein Bild im Text mit Ziehpunkten an den Ecken.">
  <title>&#220;ber Einf&#252;gen und Bilder holst du ein Bild in den Text</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 600; }
    .txt { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .ruf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #0c5f66; font-weight: 700; }
    .merk { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #14532d; font-weight: 600; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Programmfenster -->
  <rect x="24" y="20" width="712" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v26 H24 Z" fill="#eef4f5"/>
  <circle cx="46" cy="43" r="5" fill="#c7d5db"/>
  <text class="lbl-grau" x="62" y="48">mein_text.docx</text>

  <!-- Menueleiste -->
  <rect x="40" y="70" width="680" height="30" rx="6" fill="#fbfdfd" stroke="#d8e1e8" stroke-width="1"/>
  <text class="lbl-grau" x="58" y="90">Datei</text>
  <text class="lbl-grau" x="108" y="90">Start</text>
  <!-- Einfuegen: aktiv -->
  <rect x="152" y="73" width="86" height="24" rx="5" fill="#0c5f66"/>
  <text class="lbl-weiss" x="163" y="90">Einf&#252;gen</text>
  <text class="lbl-grau" x="256" y="90">Layout</text>

  <!-- aufgeklapptes Menue -->
  <rect x="152" y="102" width="212" height="132" rx="8" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.5"/>
  <text class="lbl" x="172" y="126">Tabelle</text>
  <!-- Bilder: hervorgehoben -->
  <rect x="158" y="136" width="200" height="28" rx="5" fill="#eef4f5" stroke="#0c5f66" stroke-width="1.5"/>
  <rect x="170" y="143" width="16" height="14" rx="2" fill="#0c5f66"/>
  <circle cx="175" cy="148" r="1.8" fill="#ffffff"/>
  <path d="M170 157 l6 -6 l4 4 l3 -3 l3 5 Z" fill="#ffffff"/>
  <text class="lbl" x="196" y="155" font-weight="700">Bilder</text>
  <text class="lbl" x="172" y="186">Formen</text>
  <text class="lbl" x="172" y="214">Kopfzeile</text>

  <!-- Blatt mit eingefuegtem Bild -->
  <rect x="396" y="112" width="300" height="212" rx="4" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/>
  <text class="txt" x="416" y="140">Mein Ausflug</text>

  <!-- eingefuegtes Bild -->
  <rect x="440" y="156" width="150" height="104" rx="3" fill="#eef4f5" stroke="#0c5f66" stroke-width="2"/>
  <!-- kleine Landschaft im Bild -->
  <circle cx="472" cy="182" r="10" fill="#facc15"/>
  <path d="M440 240 l38 -44 l30 34 l22 -22 l60 32 Z" fill="#86efac"/>
  <rect x="440" y="240" width="150" height="20" fill="#7dd3fc"/>

  <!-- Ziehpunkte an den Ecken -->
  <g fill="#ffffff" stroke="#0c5f66" stroke-width="2">
    <circle cx="440" cy="156" r="4.5"/>
    <circle cx="590" cy="156" r="4.5"/>
    <circle cx="440" cy="260" r="4.5"/>
    <circle cx="590" cy="260" r="4.5"/>
  </g>

  <text class="txt" x="416" y="290">Foto: eigene Aufnahme</text>

  <!-- Beschriftungen -->
  <path d="M374 150 L364 150" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="364" cy="150" r="3" fill="#0c5f66"/>
  <text class="ruf" x="382" y="146">1. Einf&#252;gen,</text>
  <text class="ruf" x="382" y="164">dann Bilder</text>

  <path d="M612 262 L598 262" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="598" cy="262" r="3" fill="#0c5f66"/>
  <text class="ruf" x="620" y="258">2. an den Ecken</text>
  <text class="ruf" x="620" y="276">ziehen</text>

  <path d="M612 292 L520 292" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="520" cy="292" r="3" fill="#0c5f66"/>
  <text class="ruf" x="620" y="296">3. Quelle angeben</text>

  <!-- Merksatz -->
  <rect x="24" y="366" width="712" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="merk" x="44" y="395">Merke: An den Ecken ziehen, damit das Bild nicht verzerrt. Quelle nicht vergessen.</text>
</svg>
