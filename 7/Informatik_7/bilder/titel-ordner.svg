<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Ein geöffneter Ordner mit mehreren Dateien darin">
  <title>Ordner und Dateien</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="mappe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14808a"/>
      <stop offset="1" stop-color="#0c5f66"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#bg2)"/>

  <!-- Dateien, die aus dem Ordner ragen -->
  <g>
    <rect x="300" y="42" width="86" height="112" rx="7" fill="#ffffff" stroke="#d8e1e8" stroke-width="2" transform="rotate(-8 343 98)"/>
    <rect x="314" y="66" width="52" height="5" rx="2.5" fill="#c7d5db" transform="rotate(-8 343 98)"/>
    <rect x="314" y="80" width="58" height="5" rx="2.5" fill="#c7d5db" transform="rotate(-8 343 98)"/>
    <rect x="314" y="94" width="40" height="5" rx="2.5" fill="#c7d5db" transform="rotate(-8 343 98)"/>
  </g>
  <g>
    <rect x="404" y="34" width="86" height="112" rx="7" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
    <rect x="418" y="58" width="58" height="5" rx="2.5" fill="#0c5f66"/>
    <rect x="418" y="72" width="52" height="5" rx="2.5" fill="#c7d5db"/>
    <rect x="418" y="86" width="58" height="5" rx="2.5" fill="#c7d5db"/>
    <rect x="418" y="100" width="36" height="5" rx="2.5" fill="#c7d5db"/>
  </g>
  <g>
    <rect x="508" y="42" width="86" height="112" rx="7" fill="#ffffff" stroke="#d8e1e8" stroke-width="2" transform="rotate(8 551 98)"/>
    <rect x="522" y="66" width="52" height="5" rx="2.5" fill="#c7d5db" transform="rotate(8 551 98)"/>
    <rect x="522" y="80" width="58" height="5" rx="2.5" fill="#c7d5db" transform="rotate(8 551 98)"/>
    <rect x="522" y="94" width="44" height="5" rx="2.5" fill="#c7d5db" transform="rotate(8 551 98)"/>
  </g>

  <!-- Ordner hinten -->
  <path d="M232 118 h108 l22 24 h206 a14 14 0 0 1 14 14 v76 a14 14 0 0 1 -14 14 H232 a14 14 0 0 1 -14 -14 V132 a14 14 0 0 1 14 -14 Z" fill="#0a4e54"/>
  <!-- Ordner vorne -->
  <path d="M222 156 h340 a14 14 0 0 1 13.6 17.4 l-14 66 A14 14 0 0 1 548 250 H222 a14 14 0 0 1 -14 -14 v-66 a14 14 0 0 1 14 -14 Z" fill="url(#mappe)"/>

  <!-- Beschriftung auf dem Ordner -->
  <rect x="252" y="196" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
  <rect x="252" y="214" width="76" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>

  <!-- kleiner Ordner als Unterordner -->
  <path d="M628 176 h44 l9 10 h56 a8 8 0 0 1 8 8 v42 a8 8 0 0 1 -8 8 h-109 a8 8 0 0 1 -8 -8 v-52 a8 8 0 0 1 8 -8 Z" fill="#a35b09" opacity="0.75"/>
</svg>
