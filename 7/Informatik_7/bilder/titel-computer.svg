<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Ein Computer mit Bildschirm, Tastatur und Maus auf einem Tisch">
  <title>Arbeitsplatz am Computer</title>
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="schirm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c5f66"/>
      <stop offset="1" stop-color="#14808a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#himmel)"/>

  <!-- Tischkante -->
  <rect x="0" y="212" width="800" height="6" rx="3" fill="#d8e1e8"/>

  <!-- Monitor -->
  <rect x="250" y="38" width="300" height="200" rx="14" fill="#101828"/>
  <rect x="262" y="50" width="276" height="150" rx="7" fill="url(#schirm)"/>

  <!-- Inhalt auf dem Bildschirm: ein Fenster mit Zeilen -->
  <rect x="284" y="70" width="232" height="112" rx="6" fill="#ffffff" opacity="0.95"/>
  <rect x="284" y="70" width="232" height="18" rx="6" fill="#d8e1e8"/>
  <circle cx="296" cy="79" r="3.5" fill="#dc2626"/>
  <circle cx="308" cy="79" r="3.5" fill="#f4d9a6"/>
  <circle cx="320" cy="79" r="3.5" fill="#16a34a"/>
  <rect x="296" y="100" width="150" height="8" rx="4" fill="#0c5f66"/>
  <rect x="296" y="118" width="196" height="6" rx="3" fill="#c7d5db"/>
  <rect x="296" y="132" width="180" height="6" rx="3" fill="#c7d5db"/>
  <rect x="296" y="146" width="120" height="6" rx="3" fill="#c7d5db"/>
  <rect x="296" y="160" width="160" height="6" rx="3" fill="#c7d5db"/>

  <!-- Monitorfuss -->
  <rect x="376" y="238" width="48" height="8" rx="4" fill="#101828"/>
  <rect x="392" y="206" width="16" height="34" fill="#1e2b3a"/>

  <!-- Tastatur -->
  <rect x="180" y="222" width="180" height="30" rx="7" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <g fill="#e8eef1">
    <rect x="192" y="230" width="18" height="6" rx="2"/>
    <rect x="216" y="230" width="18" height="6" rx="2"/>
    <rect x="240" y="230" width="18" height="6" rx="2"/>
    <rect x="264" y="230" width="18" height="6" rx="2"/>
    <rect x="288" y="230" width="18" height="6" rx="2"/>
    <rect x="312" y="230" width="34" height="6" rx="2"/>
    <rect x="192" y="240" width="26" height="6" rx="2"/>
    <rect x="224" y="240" width="90" height="6" rx="2"/>
    <rect x="320" y="240" width="26" height="6" rx="2"/>
  </g>

  <!-- Maus -->
  <rect x="440" y="224" width="30" height="42" rx="15" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <line x1="455" y1="230" x2="455" y2="240" stroke="#c7d5db" stroke-width="2" stroke-linecap="round"/>

  <!-- Pflanze als Deko -->
  <rect x="620" y="186" width="42" height="34" rx="6" fill="#a35b09" opacity="0.85"/>
  <path d="M641 186 C 641 158, 626 148, 618 140 C 634 142, 644 156, 641 172 Z" fill="#0c5f66" opacity="0.8"/>
  <path d="M641 186 C 641 160, 656 150, 666 142 C 652 146, 642 158, 644 174 Z" fill="#14808a" opacity="0.8"/>

  <!-- Kaffeebecher -->
  <rect x="150" y="190" width="30" height="30" rx="5" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <path d="M180 198 h8 a7 7 0 0 1 0 14 h-8" fill="none" stroke="#d8e1e8" stroke-width="2"/>
</svg>
