<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Pixel und Aufloesung</title>
  <desc id="desc">Vergleich von groben und feinen Pixeln sowie einer kleinen Pixelgrafik.</desc>
  <rect width="920" height="520" fill="#fbfdfd"/>
  <text x="46" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5f66">Pixel und Aufl&#246;sung</text>
  <g transform="translate(58 98)">
    <rect width="230" height="230" rx="14" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
    <g transform="translate(24 24)">
      <rect width="60" height="60" fill="#176a70"/>
      <rect x="60" width="60" height="60" fill="#2f8c89"/>
      <rect x="120" width="60" height="60" fill="#f1c453"/>
      <rect y="60" width="60" height="60" fill="#d96a55"/>
      <rect x="60" y="60" width="60" height="60" fill="#176a70"/>
      <rect x="120" y="60" width="60" height="60" fill="#2f8c89"/>
      <rect y="120" width="60" height="60" fill="#f1c453"/>
      <rect x="60" y="120" width="60" height="60" fill="#d96a55"/>
      <rect x="120" y="120" width="60" height="60" fill="#176a70"/>
      <path d="M0 60h180M0 120h180M60 0v180M120 0v180" stroke="#ffffff" stroke-width="2" opacity=".75"/>
    </g>
    <text x="0" y="285" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Niedrige Aufl&#246;sung</text>
    <text x="0" y="316" font-family="Arial, sans-serif" font-size="18" fill="#607084">wenige, grobe Pixel</text>
  </g>
  <g transform="translate(346 98)">
    <rect width="230" height="230" rx="14" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
    <g transform="translate(24 24)">
      <defs>
        <pattern id="fineGrid" width="18" height="18" patternUnits="userSpaceOnUse">
          <rect width="18" height="18" fill="#e8f3f2"/>
          <path d="M18 0H0v18" fill="none" stroke="#ffffff" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="180" height="180" fill="url(#fineGrid)"/>
      <circle cx="90" cy="90" r="66" fill="#0c5f66" opacity=".85"/>
      <circle cx="114" cy="73" r="24" fill="#f8c958"/>
      <rect x="42" y="122" width="94" height="26" rx="13" fill="#ffffff" opacity=".78"/>
    </g>
    <text x="0" y="285" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Hohe Aufl&#246;sung</text>
    <text x="0" y="316" font-family="Arial, sans-serif" font-size="18" fill="#607084">mehr Details im Bild</text>
  </g>
  <g transform="translate(640 98)">
    <rect width="230" height="230" rx="14" fill="#ffffff" stroke="#d8e1e8" stroke-width="4"/>
    <g transform="translate(43 43)">
      <rect width="144" height="144" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
      <g fill="#f0132f">
        <rect x="18" y="18" width="18" height="18"/><rect x="36" y="18" width="18" height="18"/><rect x="90" y="18" width="18" height="18"/><rect x="108" y="18" width="18" height="18"/>
        <rect x="0" y="36" width="18" height="18"/><rect x="18" y="36" width="18" height="18"/><rect x="36" y="36" width="18" height="18"/><rect x="54" y="36" width="18" height="18"/><rect x="72" y="36" width="18" height="18"/><rect x="90" y="36" width="18" height="18"/><rect x="108" y="36" width="18" height="18"/><rect x="126" y="36" width="18" height="18"/>
        <rect x="0" y="54" width="18" height="18"/><rect x="18" y="54" width="18" height="18"/><rect x="36" y="54" width="18" height="18"/><rect x="54" y="54" width="18" height="18"/><rect x="72" y="54" width="18" height="18"/><rect x="90" y="54" width="18" height="18"/><rect x="108" y="54" width="18" height="18"/><rect x="126" y="54" width="18" height="18"/>
        <rect x="18" y="72" width="18" height="18"/><rect x="36" y="72" width="18" height="18"/><rect x="54" y="72" width="18" height="18"/><rect x="72" y="72" width="18" height="18"/><rect x="90" y="72" width="18" height="18"/><rect x="108" y="72" width="18" height="18"/>
        <rect x="36" y="90" width="18" height="18"/><rect x="54" y="90" width="18" height="18"/><rect x="72" y="90" width="18" height="18"/><rect x="90" y="90" width="18" height="18"/>
        <rect x="54" y="108" width="18" height="18"/><rect x="72" y="108" width="18" height="18"/>
      </g>
      <path d="M0 18h144M0 36h144M0 54h144M0 72h144M0 90h144M0 108h144M0 126h144M18 0v144M36 0v144M54 0v144M72 0v144M90 0v144M108 0v144M126 0v144" stroke="#d8e1e8" stroke-width="1"/>
    </g>
    <text x="0" y="285" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">8 x 8 Pixel</text>
    <text x="0" y="316" font-family="Arial, sans-serif" font-size="18" fill="#607084">Rastergrafik als Muster</text>
  </g>
  <text x="58" y="465" font-family="Arial, sans-serif" font-size="20" fill="#101828">Merksatz: Mehr Pixel k&#246;nnen ein Bild genauer machen, brauchen aber meist auch mehr Speicherplatz.</text>
</svg>
