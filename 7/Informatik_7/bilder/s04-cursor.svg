<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Schreibprogramm mit einem kurzen Text. Der blinkende Cursor steht hinter dem letzten Wort. Leerzeichen und Absatz sind beschriftet.">
  <title>Der Cursor zeigt, wo du schreibst</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #ffffff; font-weight: 600; }
    .txt { font-family: "Segoe UI", system-ui, sans-serif; font-size: 17px; fill: #101828; }
    .ruf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #0c5f66; font-weight: 700; }
    .merk { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #14532d; font-weight: 600; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Programmfenster -->
  <rect x="24" y="20" width="712" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v26 H24 Z" fill="#eef4f5"/>
  <circle cx="46" cy="43" r="5" fill="#c7d5db"/>
  <text class="lbl-grau" x="62" y="48">mein_erster_test.docx</text>
  <g fill="#8b97a4">
    <rect x="660" y="41" width="12" height="2"/>
    <rect x="686" y="36" width="12" height="12" fill="none" stroke="#8b97a4" stroke-width="2"/>
    <path d="M712 37 l12 12 M724 37 l-12 12" stroke="#8b97a4" stroke-width="2"/>
  </g>

  <!-- Symbolleiste -->
  <rect x="40" y="70" width="680" height="34" rx="6" fill="#fbfdfd" stroke="#d8e1e8" stroke-width="1"/>
  <text class="lbl" x="58" y="92" font-weight="700">F</text>
  <text class="lbl" x="86" y="92" font-style="italic">K</text>
  <text class="lbl" x="112" y="92" text-decoration="underline">U</text>
  <rect x="140" y="78" width="2" height="18" fill="#d8e1e8"/>
  <rect x="158" y="79" width="70" height="16" rx="4" fill="#ffffff" stroke="#d8e1e8" stroke-width="1"/>
  <text class="lbl-grau" x="166" y="92">12</text>

  <!-- Schreibflaeche -->
  <rect x="70" y="124" width="620" height="200" rx="4" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>

  <!-- Textzeile 1 -->
  <text class="txt" x="96" y="164">Lena Schmidt</text>

  <!-- Textzeile 2 mit Cursor dahinter -->
  <text class="txt" x="96" y="200">18. September</text>
  <!-- blinkender Cursor -->
  <rect x="216" y="184" width="2.5" height="22" fill="#101828">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Markierung Leerzeichen zwischen den Woertern -->
  <rect x="146" y="148" width="9" height="20" fill="#eef4f5" stroke="#0c5f66" stroke-dasharray="3 2" stroke-width="1.5"/>

  <!-- Absatzmarke -->
  <text class="lbl-grau" x="232" y="200">&#182;</text>

  <!-- Beschriftung Cursor -->
  <path d="M300 195 L262 195" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="262" cy="195" r="3" fill="#0c5f66"/>
  <text class="ruf" x="308" y="200">Cursor: hier erscheint der n&#228;chste Buchstabe</text>

  <!-- Beschriftung Leerzeichen -->
  <path d="M300 152 L162 156" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="162" cy="156" r="3" fill="#0c5f66"/>
  <text class="ruf" x="308" y="157">genau ein Leerzeichen zwischen zwei W&#246;rtern</text>

  <!-- Beschriftung Absatz -->
  <path d="M300 238 L240 208" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="240" cy="208" r="3" fill="#0c5f66"/>
  <text class="ruf" x="308" y="243">Enter beginnt einen neuen Absatz</text>

  <!-- Merksatz -->
  <rect x="24" y="366" width="712" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="merk" x="44" y="395">Merke: Speichere mit Strg + S immer wieder zwischendurch &#8211; nicht erst am Ende.</text>
</svg>
