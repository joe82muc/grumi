<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Helligkeit, Kontrast und Filter</title>
  <desc id="desc">Vier Bildvarianten zeigen dunkler, heller, mehr Kontrast und Filter.</desc>
  <rect width="920" height="520" fill="#fbfdfd"/>
  <text x="46" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5f66">Helligkeit, Kontrast und Filter</text>
  <defs>
    <g id="chalk">
      <rect width="250" height="150" rx="8" fill="#2d765a"/>
      <path d="M0 30h250M0 62h250M0 94h250M0 126h250" stroke="#ffffff" stroke-width="2" opacity=".28"/>
      <circle cx="33" cy="42" r="18" fill="#f8c958"/>
      <circle cx="33" cy="42" r="11" fill="#ffffff" opacity=".8"/>
      <text x="78" y="78" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" opacity=".86">Foto</text>
      <path d="M170 94c22-10 46-10 64 0" fill="none" stroke="#ffffff" stroke-width="4" opacity=".52"/>
    </g>
    <filter id="dark">
      <feComponentTransfer>
        <feFuncR type="linear" slope=".55"/>
        <feFuncG type="linear" slope=".55"/>
        <feFuncB type="linear" slope=".55"/>
      </feComponentTransfer>
    </filter>
    <filter id="bright">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.25" intercept=".16"/>
        <feFuncG type="linear" slope="1.25" intercept=".16"/>
        <feFuncB type="linear" slope="1.25" intercept=".16"/>
      </feComponentTransfer>
    </filter>
    <filter id="contrast">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.65" intercept="-.18"/>
        <feFuncG type="linear" slope="1.65" intercept="-.18"/>
        <feFuncB type="linear" slope="1.65" intercept="-.18"/>
      </feComponentTransfer>
    </filter>
    <filter id="filterFx">
      <feColorMatrix type="matrix" values=".55 .55 .15 0 0 .20 .75 .15 0 0 .18 .35 .75 0 0 0 0 0 1 0"/>
    </filter>
  </defs>
  <g transform="translate(72 112)">
    <use href="#chalk"/>
    <text x="0" y="197" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Original</text>
  </g>
  <g transform="translate(598 112)">
    <use href="#chalk" filter="url(#contrast)"/>
    <text x="0" y="197" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Mehr Kontrast</text>
  </g>
  <g transform="translate(72 335)">
    <use href="#chalk" filter="url(#dark)"/>
    <text x="0" y="176" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Dunkler</text>
  </g>
  <g transform="translate(334 335)">
    <use href="#chalk" filter="url(#bright)"/>
    <text x="0" y="176" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Heller</text>
  </g>
  <g transform="translate(598 335)">
    <use href="#chalk" filter="url(#filterFx)"/>
    <text x="0" y="176" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Filter</text>
  </g>
</svg>
