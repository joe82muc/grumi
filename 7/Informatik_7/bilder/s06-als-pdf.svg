<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Dialog Speichern unter: die Liste Dateityp ist aufgeklappt, PDF ist ausgewählt. Rechts die Seitenansicht des fertigen Blattes.">
  <title>Beim Speichern als Dateityp PDF ausw&#228;hlen</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #ffffff; font-weight: 600; }
    .kopf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; fill: #101828; font-weight: 700; }
    .ruf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #0c5f66; font-weight: 700; }
    .merk { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #14532d; font-weight: 600; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Dialogfenster links -->
  <rect x="24" y="20" width="440" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <path d="M24 30 a10 10 0 0 1 10 -10 h420 a10 10 0 0 1 10 10 v30 H24 Z" fill="#eef4f5"/>
  <text class="kopf" x="46" y="50">Speichern unter</text>

  <!-- Dateiname -->
  <text class="lbl" x="44" y="100">Dateiname:</text>
  <rect x="44" y="108" width="376" height="28" rx="5" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.5"/>
  <text class="lbl" x="56" y="127">mein_ausflug</text>

  <!-- Dateityp, aufgeklappt -->
  <text class="lbl" x="44" y="164">Dateityp:</text>
  <rect x="44" y="172" width="376" height="28" rx="5" fill="#ffffff" stroke="#0c5f66" stroke-width="2"/>
  <text class="lbl" x="56" y="191" font-weight="700">PDF (*.pdf)</text>
  <path d="M396 182 l7 8 l7 -8" stroke="#0c5f66" stroke-width="2" fill="none"/>

  <!-- Auswahlliste -->
  <rect x="44" y="200" width="376" height="86" rx="6" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.5"/>
  <rect x="48" y="204" width="368" height="26" rx="4" fill="#eef4f5" stroke="#0c5f66" stroke-width="1.5"/>
  <text class="lbl" x="60" y="222" font-weight="700">PDF (*.pdf)</text>
  <text class="lbl-grau" x="60" y="250">Word-Dokument (*.docx)</text>
  <text class="lbl-grau" x="60" y="276">Nur Text (*.txt)</text>

  <!-- Knopf -->
  <rect x="318" y="300" width="102" height="30" rx="6" fill="#0c5f66"/>
  <text class="lbl-weiss" x="340" y="320">Speichern</text>

  <!-- Seitenansicht rechts -->
  <rect x="496" y="20" width="240" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <path d="M496 30 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v30 H496 Z" fill="#eef4f5"/>
  <text class="kopf" x="516" y="50">Seitenansicht</text>

  <!-- Blatt -->
  <rect x="528" y="76" width="176" height="248" rx="3" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.5"/>
  <text x="616" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="800" fill="#101828">Mein Ausflug</text>
  <rect x="556" y="124" width="120" height="74" rx="2" fill="#eef4f5" stroke="#d8e1e8" stroke-width="1"/>
  <circle cx="580" cy="144" r="7" fill="#facc15"/>
  <path d="M556 186 l28 -32 l22 24 l16 -16 l54 24 Z" fill="#86efac"/>
  <rect x="556" y="186" width="120" height="12" fill="#7dd3fc"/>
  <g fill="#c7d5db">
    <rect x="556" y="212" width="120" height="5" rx="2"/>
    <rect x="556" y="224" width="120" height="5" rx="2"/>
    <rect x="556" y="236" width="86" height="5" rx="2"/>
    <rect x="556" y="256" width="104" height="5" rx="2"/>
    <rect x="556" y="268" width="120" height="5" rx="2"/>
  </g>

  <!-- Beschriftungen -->
  <circle cx="32" cy="186" r="11" fill="#0c5f66"/>
  <text class="lbl-weiss" x="28" y="191">1</text>
  <circle cx="32" cy="315" r="11" fill="#0c5f66"/>
  <text class="lbl-weiss" x="28" y="320">2</text>

  <path d="M472 190 L438 190" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <text class="ruf" x="472" y="380">Vorher pr&#252;fen: Passt alles auf die Seite?</text>

  <!-- Merksatz -->
  <rect x="24" y="366" width="440" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="merk" x="44" y="388">Merke: In einem PDF verrutscht</text>
  <text class="merk" x="44" y="406">nichts mehr.</text>
</svg>
