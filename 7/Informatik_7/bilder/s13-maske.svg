<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Auswahl und Ebenenmaske</title>
  <desc id="desc">Aus der weissen Schablone wird eine Auswahl, daraus eine Ebenenmaske auf dem Originalbild.</desc>
  <rect width="920" height="520" fill="#fbfdfd"/>
  <text x="46" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5f66">Schritt 3: Maske statt Radiergummi</text>
  <text x="46" y="82" font-family="Arial, sans-serif" font-size="18" fill="#41585a">Die Maske loescht nichts - sie blendet nur aus. Du kannst alles zurueckholen.</text>

  <!-- Schablone -->
  <g>
    <rect x="46" y="114" width="176" height="130" rx="8" fill="#000000" stroke="#0c5f66" stroke-width="3"/>
    <path d="M 134 148 l 28 54 h -56 z" fill="#ffffff"/>
    <path d="M 134 170 l 36 44 h -72 z" fill="#ffffff"/>
    <rect x="129" y="208" width="9" height="18" fill="#ffffff"/>
    <text x="46" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">Schablone</text>
    <text x="46" y="290" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Rechtsklick auf die Ebene</text>
    <text x="46" y="310" font-family="Arial, sans-serif" font-size="15" fill="#41585a">&#187;Auswahl aus Alphakanal&#171;</text>
  </g>

  <path d="M 234 180 L 276 180" stroke="#0c5f66" stroke-width="4" fill="none"/>
  <path d="M 276 180 l -12 -8 v 16 z" fill="#0c5f66"/>

  <!-- Auswahl -->
  <g>
    <rect x="288" y="114" width="176" height="130" rx="8" fill="#f4f8f8" stroke="#0c5f66" stroke-width="3"/>
    <path d="M 376 148 l 28 54 h -56 z" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="7 5"/>
    <path d="M 376 170 l 36 44 h -72 z" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="288" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">Auswahl</text>
    <text x="288" y="290" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Die laufende Linie zeigt,</text>
    <text x="288" y="310" font-family="Arial, sans-serif" font-size="15" fill="#41585a">was ausgewaehlt ist.</text>
  </g>

  <path d="M 476 180 L 518 180" stroke="#0c5f66" stroke-width="4" fill="none"/>
  <path d="M 518 180 l -12 -8 v 16 z" fill="#0c5f66"/>

  <!-- Ebenenstapel -->
  <g>
    <rect x="530" y="114" width="176" height="130" rx="8" fill="#2f3738" stroke="#0c5f66" stroke-width="3"/>
    <text x="546" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Ebenen</text>
    <rect x="546" y="152" width="144" height="38" rx="5" fill="#465052"/>
    <rect x="554" y="158" width="26" height="26" rx="3" fill="#8fc7e8"/>
    <rect x="586" y="158" width="26" height="26" rx="3" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <text x="622" y="177" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Original</text>
    <text x="554" y="212" font-family="Arial, sans-serif" font-size="13" fill="#9fd6d2">Bild + Maske</text>
    <text x="554" y="232" font-family="Arial, sans-serif" font-size="13" fill="#9fd6d2">nebeneinander</text>
    <text x="530" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">Maske hinzufuegen</text>
    <text x="530" y="290" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Ebene &#8250; Maske &#8250;</text>
    <text x="530" y="310" font-family="Arial, sans-serif" font-size="15" fill="#41585a">&#187;Aus Auswahl&#171;</text>
  </g>

  <path d="M 718 180 L 760 180" stroke="#0c5f66" stroke-width="4" fill="none"/>
  <path d="M 760 180 l -12 -8 v 16 z" fill="#0c5f66"/>

  <!-- Ergebnis mit Schachbrett -->
  <g>
    <rect x="762" y="114" width="122" height="130" rx="8" fill="#ffffff" stroke="#0c5f66" stroke-width="3"/>
    <g fill="#d8dedd">
      <rect x="765" y="117" width="15" height="15"/><rect x="795" y="117" width="15" height="15"/><rect x="825" y="117" width="15" height="15"/><rect x="855" y="117" width="15" height="15"/>
      <rect x="780" y="132" width="15" height="15"/><rect x="810" y="132" width="15" height="15"/><rect x="840" y="132" width="15" height="15"/><rect x="870" y="132" width="11" height="15"/>
      <rect x="765" y="147" width="15" height="15"/><rect x="795" y="147" width="15" height="15"/><rect x="825" y="147" width="15" height="15"/><rect x="855" y="147" width="15" height="15"/>
      <rect x="780" y="162" width="15" height="15"/><rect x="810" y="162" width="15" height="15"/><rect x="840" y="162" width="15" height="15"/><rect x="870" y="162" width="11" height="15"/>
      <rect x="765" y="177" width="15" height="15"/><rect x="795" y="177" width="15" height="15"/><rect x="825" y="177" width="15" height="15"/><rect x="855" y="177" width="15" height="15"/>
      <rect x="780" y="192" width="15" height="15"/><rect x="810" y="192" width="15" height="15"/><rect x="840" y="192" width="15" height="15"/><rect x="870" y="192" width="11" height="15"/>
      <rect x="765" y="207" width="15" height="15"/><rect x="795" y="207" width="15" height="15"/><rect x="825" y="207" width="15" height="15"/><rect x="855" y="207" width="15" height="15"/>
      <rect x="780" y="222" width="15" height="15"/><rect x="810" y="222" width="15" height="15"/><rect x="840" y="222" width="15" height="15"/><rect x="870" y="222" width="11" height="15"/>
    </g>
    <path d="M 823 150 l 26 50 h -52 z" fill="#2f6b3e"/>
    <path d="M 823 170 l 33 42 h -66 z" fill="#2f6b3e"/>
    <rect x="818" y="206" width="9" height="17" fill="#6b4a33"/>
    <text x="762" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c5f66">Fertig</text>
    <text x="762" y="290" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Das Schachbrett</text>
    <text x="762" y="310" font-family="Arial, sans-serif" font-size="15" fill="#41585a">heisst: durchsichtig.</text>
  </g>

  <!-- Tippkasten -->
  <rect x="46" y="348" width="838" height="106" rx="10" fill="#eaf6f6" stroke="#7fd1c4" stroke-width="3"/>
  <text x="70" y="382" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0c5f66">Nachbessern mit dem Pinsel</text>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="16" fill="#41585a">Klicke die Maske an (das schwarz-weisse Feld). Male mit WEISS, um etwas zurueckzuholen.</text>
  <text x="70" y="434" font-family="Arial, sans-serif" font-size="16" fill="#41585a">Male mit SCHWARZ, um etwas auszublenden. Du kannst beliebig oft wechseln.</text>

  <text x="46" y="490" font-family="Arial, sans-serif" font-size="15" fill="#6c8486">GRUMI Lernplattform &#183; Informatik 7</text>
</svg>
