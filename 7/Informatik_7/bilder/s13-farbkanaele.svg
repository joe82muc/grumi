<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Farbkanaele in GIMP</title>
  <desc id="desc">Der Reiter Kanaele neben den Ebenen. Der Blaukanal zeigt den staerksten Unterschied zwischen Baum und Himmel.</desc>
  <rect width="920" height="520" fill="#fbfdfd"/>
  <text x="46" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5f66">Schritt 1: Der Blaukanal</text>
  <text x="46" y="82" font-family="Arial, sans-serif" font-size="18" fill="#41585a">Jedes Farbbild besteht aus drei Kanaelen. Einer trennt Motiv und Himmel am besten.</text>

  <!-- Dialogfenster -->
  <rect x="46" y="106" width="300" height="330" rx="12" fill="#2f3738" stroke="#0c5f66" stroke-width="4"/>
  <!-- Reiter -->
  <rect x="62" y="122" width="126" height="34" rx="7" fill="#465052"/>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="17" fill="#cfe3e4">Ebenen</text>
  <rect x="196" y="122" width="126" height="34" rx="7" fill="#eaf6f6"/>
  <text x="222" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0c5f66">Kanaele</text>

  <!-- Kanalzeilen -->
  <g font-family="Arial, sans-serif" font-size="17" fill="#ffffff">
    <rect x="62" y="176" width="260" height="56" rx="8" fill="#465052"/>
    <rect x="76" y="188" width="32" height="32" rx="4" fill="#d94b4b"/>
    <text x="122" y="210">Rot</text>

    <rect x="62" y="242" width="260" height="56" rx="8" fill="#465052"/>
    <rect x="76" y="254" width="32" height="32" rx="4" fill="#4caf72"/>
    <text x="122" y="276">Gruen</text>

    <rect x="62" y="308" width="260" height="56" rx="8" fill="#0c5f66" stroke="#7fd1c4" stroke-width="3"/>
    <rect x="76" y="320" width="32" height="32" rx="4" fill="#3d7fd9"/>
    <text x="122" y="342" font-weight="700">Blau</text>
  </g>
  <text x="76" y="396" font-family="Arial, sans-serif" font-size="16" fill="#9fd6d2">Diesen Kanal anklicken</text>
  <text x="76" y="418" font-family="Arial, sans-serif" font-size="16" fill="#9fd6d2">und ins Bild ziehen.</text>

  <!-- Pfeil -->
  <path d="M 366 270 L 428 270" stroke="#0c5f66" stroke-width="5" fill="none"/>
  <path d="M 428 270 l -14 -9 v 18 z" fill="#0c5f66"/>

  <!-- Vorher: Farbbild -->
  <g>
    <rect x="452" y="140" width="200" height="146" rx="8" fill="#8fc7e8" stroke="#0c5f66" stroke-width="3"/>
    <rect x="455" y="238" width="194" height="45" fill="#79bb63"/>
    <path d="M 552 176 l 34 62 h -68 z" fill="#2f6b3e"/>
    <path d="M 552 200 l 42 50 h -84 z" fill="#2f6b3e"/>
    <rect x="547" y="244" width="10" height="20" fill="#6b4a33"/>
    <text x="452" y="308" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0c5f66">Farbbild</text>
    <text x="452" y="330" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Gruen und Blau liegen</text>
    <text x="452" y="350" font-family="Arial, sans-serif" font-size="15" fill="#41585a">farblich nah beieinander.</text>
  </g>

  <!-- Nachher: Blaukanal -->
  <g>
    <rect x="684" y="140" width="200" height="146" rx="8" fill="#e8e8e8" stroke="#0c5f66" stroke-width="3"/>
    <rect x="687" y="238" width="194" height="45" fill="#3a3a3a"/>
    <path d="M 784 176 l 34 62 h -68 z" fill="#111111"/>
    <path d="M 784 200 l 42 50 h -84 z" fill="#111111"/>
    <rect x="779" y="244" width="10" height="20" fill="#111111"/>
    <text x="684" y="308" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0c5f66">Blaukanal</text>
    <text x="684" y="330" font-family="Arial, sans-serif" font-size="15" fill="#41585a">Jetzt ist der Unterschied</text>
    <text x="684" y="350" font-family="Arial, sans-serif" font-size="15" fill="#41585a">deutlich: hell gegen dunkel.</text>
  </g>

  <!-- Merksatz -->
  <rect x="452" y="382" width="432" height="72" rx="10" fill="#eaf6f6" stroke="#7fd1c4" stroke-width="3"/>
  <text x="472" y="412" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0c5f66">Wichtig</text>
  <text x="472" y="436" font-family="Arial, sans-serif" font-size="16" fill="#41585a">Danach den Blaukanal wieder ausschalten!</text>

  <text x="46" y="478" font-family="Arial, sans-serif" font-size="15" fill="#6c8486">GRUMI Lernplattform &#183; Informatik 7</text>
</svg>
