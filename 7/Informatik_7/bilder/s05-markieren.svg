<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Ein Satz im Dokument ist mit der Maus blau hinterlegt. Daneben steht: nur was markiert ist, wird ver&#228;ndert.">
  <title>Erst markieren: der Text wird blau hinterlegt</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8b97a4; }
    .txt { font-family: "Segoe UI", system-ui, sans-serif; font-size: 17px; fill: #101828; }
    .txt-hell { font-family: "Segoe UI", system-ui, sans-serif; font-size: 17px; fill: #101828; }
    .ruf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #0c5f66; font-weight: 700; }
    .merk { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #14532d; font-weight: 600; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Programmfenster -->
  <rect x="24" y="20" width="712" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v26 H24 Z" fill="#eef4f5"/>
  <circle cx="46" cy="43" r="5" fill="#c7d5db"/>
  <text class="lbl-grau" x="62" y="48">mein_text.docx</text>

  <!-- Symbolleiste -->
  <rect x="40" y="70" width="680" height="34" rx="6" fill="#fbfdfd" stroke="#d8e1e8" stroke-width="1"/>
  <text class="lbl" x="58" y="92" font-weight="700">F</text>
  <text class="lbl" x="86" y="92" font-style="italic">K</text>
  <text class="lbl" x="112" y="92" text-decoration="underline">U</text>
  <rect x="140" y="78" width="2" height="18" fill="#d8e1e8"/>
  <rect x="158" y="79" width="70" height="16" rx="4" fill="#ffffff" stroke="#d8e1e8" stroke-width="1"/>
  <text class="lbl-grau" x="166" y="92">12</text>

  <!-- Schreibflaeche -->
  <rect x="70" y="124" width="620" height="200" rx="4" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>

  <!-- Zeile 1: markiert (blau hinterlegt) -->
  <rect x="94" y="146" width="268" height="24" fill="#accef7"/>
  <text class="txt" x="96" y="164">Mein Ausflug an die Isar</text>

  <!-- Zeile 2 und 3: nicht markiert -->
  <text class="txt-hell" x="96" y="204">Am Samstag waren wir mit der Klasse</text>
  <text class="txt-hell" x="96" y="234">an der Isar. Das Wetter war sch&#246;n.</text>

  <!-- Mauszeiger am Ende der Markierung -->
  <path d="M360 158 l0 22 l6 -6 l5 10 l5 -3 l-5 -9 l8 0 Z" fill="#101828" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Beschriftung Markierung -->
  <path d="M470 158 L372 158" stroke="#0c5f66" stroke-width="2" fill="none"/>
  <circle cx="372" cy="158" r="3" fill="#0c5f66"/>
  <text class="ruf" x="478" y="150">markiert:</text>
  <text class="ruf" x="478" y="169">blau hinterlegt</text>

  <!-- Beschriftung nicht markiert -->
  <path d="M470 218 L400 210" stroke="#8b97a4" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <circle cx="400" cy="210" r="3" fill="#8b97a4"/>
  <text class="lbl-grau" x="478" y="215">nicht markiert &#8211;</text>
  <text class="lbl-grau" x="478" y="234">bleibt unver&#228;ndert</text>

  <!-- Merksatz -->
  <rect x="24" y="366" width="712" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="merk" x="44" y="395">Merke: Erst markieren, dann &#228;ndern. Nur was blau hinterlegt ist, wird ver&#228;ndert.</text>
</svg>
