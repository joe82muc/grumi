<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Zuschneiden und Proportionen</title>
  <desc id="desc">Vergleich von Original, Zuschnitt, proportionaler Verkleinerung und verzerrtem Bild.</desc>
  <rect width="920" height="520" fill="#fbfdfd"/>
  <text x="46" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5f66">Zuschneiden und Proportionen</text>
  <defs>
    <g id="photo">
      <rect width="230" height="150" rx="8" fill="#eaf6f6" stroke="#d8e1e8" stroke-width="3"/>
      <rect y="92" width="230" height="58" rx="0" fill="#4f8b5b"/>
      <path d="M0 104c48-22 83-17 119 2 42 23 78 25 111 7v37H0z" fill="#2f6f46"/>
      <circle cx="48" cy="44" r="18" fill="#f8c958"/>
      <path d="M32 93l54-54 42 44 28-28 48 38z" fill="#0c5f66" opacity=".78"/>
    </g>
  </defs>
  <g transform="translate(68 112)">
    <use href="#photo"/>
    <rect x="50" y="22" width="126" height="92" fill="none" stroke="#f07c45" stroke-width="6" stroke-dasharray="10 7"/>
    <text x="0" y="198" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">Originalfoto</text>
    <text x="0" y="228" font-family="Arial, sans-serif" font-size="17" fill="#607084">Rahmen zeigt den Ausschnitt</text>
  </g>
  <path d="M310 188h86" stroke="#f07c45" stroke-width="8" stroke-linecap="round"/>
  <path d="M382 171l26 17-26 17z" fill="#f07c45"/>
  <g transform="translate(418 118)">
    <svg width="170" height="124" viewBox="50 22 126 92">
      <use href="#photo"/>
    </svg>
    <rect width="170" height="124" fill="none" stroke="#0c5f66" stroke-width="4"/>
    <text x="0" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">zugeschnitten</text>
    <text x="0" y="222" font-family="Arial, sans-serif" font-size="17" fill="#607084">nur der wichtige Teil</text>
  </g>
  <g transform="translate(94 360)">
    <use href="#photo" transform="scale(.58)"/>
    <text x="150" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101828">proportional</text>
    <text x="150" y="86" font-family="Arial, sans-serif" font-size="17" fill="#607084">Breite und H&#246;he passen zusammen</text>
  </g>
  <g transform="translate(572 348)">
    <use href="#photo" transform="scale(1 .48)"/>
    <text x="0" y="102" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101828">verzerrt</text>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="17" fill="#607084">nur die H&#246;he wurde ge&#228;ndert</text>
  </g>
  <path d="M598 184h80" stroke="#f07c45" stroke-width="8" stroke-linecap="round"/>
  <path d="M665 167l26 17-26 17z" fill="#f07c45"/>
  <g transform="translate(700 120)">
    <use href="#photo" transform="scale(.58)"/>
    <text x="0" y="142" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#101828">kleiner, aber richtig</text>
  </g>
</svg>
