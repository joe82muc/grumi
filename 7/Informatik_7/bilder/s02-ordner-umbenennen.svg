<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Explorer-Fenster: Ein neuer Ordner ist markiert, im Menü ist Umbenennen ausgewählt, der Name Informatik7 wird eingetippt">
  <title>Schritt 2: Ordner umbenennen</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 600; }
    .pfad { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; fill: #4a5763; }
    .name { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #101828; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Explorer-Fenster -->
  <rect x="24" y="20" width="712" height="386" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v26 H24 Z" fill="#eef4f5"/>
  <circle cx="46" cy="43" r="5" fill="#c7d5db"/>
  <rect x="62" y="36" width="120" height="14" rx="4" fill="#d8e1e8"/>
  <g fill="#8b97a4">
    <rect x="660" y="41" width="12" height="2"/>
    <rect x="686" y="36" width="12" height="12" fill="none" stroke="#8b97a4" stroke-width="2"/>
    <path d="M712 37 l12 12 M724 37 l-12 12" stroke="#8b97a4" stroke-width="2"/>
  </g>

  <!-- Adressleiste -->
  <rect x="40" y="70" width="680" height="30" rx="6" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <text class="pfad" x="56" y="90">Dieser PC  ›  Dokumente</text>

  <!-- Seitenleiste -->
  <rect x="40" y="114" width="150" height="276" rx="6" fill="#fbfdfd"/>
  <g class="pfad" fill="#4a5763">
    <text x="56" y="140">Schnellzugriff</text>
    <text x="56" y="168">Dieser PC</text>
    <text x="56" y="196">Dokumente</text>
    <text x="56" y="224">Bilder</text>
  </g>

  <rect x="202" y="114" width="518" height="276" rx="6" fill="#ffffff"/>

  <!-- Der neue Ordner, markiert -->
  <rect x="222" y="134" width="150" height="120" rx="8" fill="#eef4f5" stroke="#0c5f66" stroke-width="2"/>
  <path d="M252 166 h30 l7 9 h32 a7 7 0 0 1 7 7 v28 a7 7 0 0 1 -7 7 h-69 a7 7 0 0 1 -7 -7 v-37 a7 7 0 0 1 7 -7 Z" fill="#14808a"/>
  <!-- Namensfeld beim Tippen -->
  <rect x="234" y="222" width="126" height="22" rx="3" fill="#ffffff" stroke="#0c5f66" stroke-width="2"/>
  <text class="name" x="242" y="238">Informatik7</text>
  <rect x="322" y="226" width="2" height="14" fill="#101828"/>

  <!-- Kontextmenue mit Umbenennen -->
  <rect x="400" y="140" width="220" height="196" rx="8" fill="#ffffff" stroke="#c7d5db" stroke-width="2"/>
  <text class="lbl" x="420" y="170">Öffnen</text>
  <line x1="412" y1="184" x2="608" y2="184" stroke="#e8eef1" stroke-width="2"/>
  <text class="lbl" x="420" y="210">Kopieren</text>
  <text class="lbl" x="420" y="240">Einfügen</text>
  <line x1="412" y1="254" x2="608" y2="254" stroke="#e8eef1" stroke-width="2"/>
  <!-- "Umbenennen" hervorgehoben -->
  <rect x="406" y="262" width="208" height="32" rx="6" fill="#0c5f66"/>
  <text class="lbl-weiss" x="420" y="284">Umbenennen</text>
  <text class="lbl-grau" x="420" y="320">Löschen</text>

  <!-- Mauszeiger auf Umbenennen -->
  <g transform="translate(540 280)">
    <path d="M0 0 L0 20 L5 15 L9 23 L12 21 L8 14 L15 14 Z" fill="#101828" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Schrittnummern -->
  <g>
    <circle cx="238" cy="150" r="15" fill="#a35b09"/>
    <text class="lbl-weiss" x="233" y="156">1</text>
  </g>
  <g>
    <circle cx="424" cy="278" r="15" fill="#a35b09"/>
    <text class="lbl-weiss" x="419" y="284">2</text>
  </g>
  <g>
    <circle cx="238" cy="233" r="15" fill="#a35b09"/>
    <text class="lbl-weiss" x="233" y="239">3</text>
  </g>

  <!-- Hinweis Enter -->
  <g transform="translate(400 356)">
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#eef4f5" stroke="#c7d5db" stroke-width="2"/>
    <text class="lbl" x="14" y="20" font-size="14">dann <tspan font-weight="700" fill="#0c5f66">Enter</tspan> drücken</text>
  </g>
</svg>
