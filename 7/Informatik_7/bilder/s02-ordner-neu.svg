<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Explorer-Fenster: Rechtsklick öffnet ein Menü, darin ist Neu und Ordner ausgewählt">
  <title>Schritt 1: Rechtsklick, Neu, Ordner</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 600; }
    .pfad { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; fill: #4a5763; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Explorer-Fenster -->
  <rect x="24" y="20" width="712" height="386" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v26 H24 Z" fill="#eef4f5"/>
  <circle cx="46" cy="43" r="5" fill="#c7d5db"/>
  <rect x="62" y="36" width="120" height="14" rx="4" fill="#d8e1e8"/>
  <g fill="#8b97a4">
    <rect x="660" y="41" width="12" height="2"/>
    <rect x="686" y="36" width="12" height="12" fill="none" stroke="#8b97a4" stroke-width="2"/>
    <path d="M712 37 l12 12 M724 37 l-12 12" stroke="#8b97a4" stroke-width="2"/>
  </g>

  <!-- Adressleiste -->
  <rect x="40" y="70" width="680" height="30" rx="6" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <text class="pfad" x="56" y="90">Dieser PC  ›  Dokumente</text>

  <!-- Seitenleiste -->
  <rect x="40" y="114" width="150" height="276" rx="6" fill="#fbfdfd"/>
  <g class="pfad" fill="#4a5763">
    <text x="56" y="140">Schnellzugriff</text>
    <text x="56" y="168">Dieser PC</text>
    <text x="56" y="196">Dokumente</text>
    <text x="56" y="224">Bilder</text>
  </g>

  <!-- Dateibereich (leer, deshalb Rechtsklick moeglich) -->
  <rect x="202" y="114" width="518" height="276" rx="6" fill="#ffffff"/>

  <!-- Mauszeiger -->
  <g transform="translate(250 150)">
    <path d="M0 0 L0 20 L5 15 L9 23 L12 21 L8 14 L15 14 Z" fill="#101828" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- Hinweis: rechte Maustaste -->
  <g transform="translate(206 176)">
    <rect x="0" y="0" width="118" height="26" rx="13" fill="#a35b09"/>
    <text class="lbl-weiss" x="12" y="18" font-size="13">rechte Maustaste</text>
  </g>

  <!-- Kontextmenue -->
  <rect x="284" y="148" width="210" height="150" rx="8" fill="#ffffff" stroke="#c7d5db" stroke-width="2"/>
  <text class="lbl" x="304" y="176">Ansicht</text>
  <text class="lbl" x="304" y="206">Sortieren nach</text>
  <text class="lbl" x="304" y="236">Aktualisieren</text>
  <line x1="296" y1="250" x2="482" y2="250" stroke="#e8eef1" stroke-width="2"/>
  <!-- "Neu" hervorgehoben -->
  <rect x="290" y="258" width="198" height="32" rx="6" fill="#eef4f5"/>
  <text class="lbl" x="304" y="280" font-weight="700" fill="#0c5f66">Neu</text>
  <path d="M466 268 l8 6 l-8 6" fill="none" stroke="#0c5f66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Untermenue -->
  <rect x="496" y="244" width="200" height="118" rx="8" fill="#ffffff" stroke="#c7d5db" stroke-width="2"/>
  <!-- "Ordner" hervorgehoben -->
  <rect x="502" y="252" width="188" height="32" rx="6" fill="#0c5f66"/>
  <path d="M516 262 h12 l3 4 h14 a3 3 0 0 1 3 3 v12 a3 3 0 0 1 -3 3 h-29 a3 3 0 0 1 -3 -3 v-16 a3 3 0 0 1 3 -3 Z" fill="#ffffff"/>
  <text class="lbl-weiss" x="556" y="274">Ordner</text>
  <text class="lbl" x="516" y="310">Verknüpfung</text>
  <text class="lbl-grau" x="516" y="340">Textdokument</text>

  <!-- Schrittnummern -->
  <g>
    <circle cx="258" cy="196" r="15" fill="#a35b09"/>
    <text class="lbl-weiss" x="253" y="202">1</text>
  </g>
  <g>
    <circle cx="308" cy="274" r="15" fill="#a35b09"/>
    <text class="lbl-weiss" x="303" y="280">2</text>
  </g>
  <g>
    <circle cx="520" cy="268" r="15" fill="#a35b09"/>
    <text class="lbl-weiss" x="515" y="274">3</text>
  </g>
</svg>
