<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Ein geschlossenes Schloss und ein Eingabefeld mit verdeckten Passwortzeichen">
  <title>Sicheres Passwort</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="schloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14808a"/>
      <stop offset="1" stop-color="#0c5f66"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#bg3)"/>

  <!-- Schutzschild im Hintergrund -->
  <path d="M250 42 L346 68 V140 c0 44 -40 70 -96 88 c-56 -18 -96 -44 -96 -88 V68 Z" fill="#0c5f66" opacity="0.08"/>

  <!-- Schloss -->
  <path d="M212 118 v-22 a38 38 0 0 1 76 0 v22" fill="none" stroke="#0c5f66" stroke-width="16" stroke-linecap="round"/>
  <rect x="186" y="116" width="128" height="98" rx="16" fill="url(#schloss)"/>
  <circle cx="250" cy="156" r="14" fill="#ffffff"/>
  <rect x="244" y="163" width="12" height="26" rx="6" fill="#ffffff"/>

  <!-- Eingabefeld -->
  <rect x="392" y="96" width="330" height="62" rx="12" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <g fill="#0c5f66">
    <circle cx="428" cy="127" r="7"/>
    <circle cx="452" cy="127" r="7"/>
    <circle cx="476" cy="127" r="7"/>
    <circle cx="500" cy="127" r="7"/>
    <circle cx="524" cy="127" r="7"/>
    <circle cx="548" cy="127" r="7"/>
    <circle cx="572" cy="127" r="7"/>
    <circle cx="596" cy="127" r="7"/>
  </g>
  <!-- blinkender Cursor -->
  <rect x="616" y="112" width="3" height="30" rx="1.5" fill="#0c5f66" opacity="0.6"/>

  <!-- Staerkeanzeige: drei Balken, alle gruen -->
  <rect x="392" y="176" width="100" height="10" rx="5" fill="#16a34a"/>
  <rect x="500" y="176" width="100" height="10" rx="5" fill="#16a34a"/>
  <rect x="608" y="176" width="100" height="10" rx="5" fill="#16a34a"/>
  <text x="392" y="212" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#16a34a">sicher</text>

  <!-- Schluessel als Deko -->
  <g opacity="0.8">
    <circle cx="686" cy="52" r="17" fill="none" stroke="#a35b09" stroke-width="7"/>
    <path d="M686 69 v36" stroke="#a35b09" stroke-width="7" stroke-linecap="round"/>
    <path d="M686 92 h16" stroke="#a35b09" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
