<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Dialogfenster Speichern unter: links der Ordner Informatik7, unten das Feld Dateiname mit mein_erster_test und der Knopf Speichern.">
  <title>Speichern unter: Ordner und Dateiname w&#228;hlen</title>
  <style>
    .lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #101828; }
    .lbl-grau { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8b97a4; }
    .lbl-weiss { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 600; }
    .kopf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; fill: #101828; font-weight: 700; }
    .ruf { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #0c5f66; font-weight: 700; }
    .merk { font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; fill: #14532d; font-weight: 600; }
  </style>

  <rect width="760" height="430" fill="#f7f9fa"/>

  <!-- Dialogfenster -->
  <rect x="24" y="20" width="712" height="330" rx="10" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>

  <!-- Titelleiste -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v30 H24 Z" fill="#eef4f5"/>
  <text class="kopf" x="46" y="50">Speichern unter</text>
  <path d="M700 37 l12 12 M712 37 l-12 12" stroke="#8b97a4" stroke-width="2"/>

  <!-- Adressleiste -->
  <rect x="40" y="76" width="680" height="30" rx="6" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <text class="lbl-grau" x="56" y="96">Dieser PC  &#8250;  Dokumente  &#8250;  Informatik7</text>

  <!-- Seitenleiste -->
  <rect x="40" y="120" width="170" height="150" rx="6" fill="#fbfdfd"/>
  <text class="lbl-grau" x="56" y="144">Schnellzugriff</text>
  <text class="lbl" x="56" y="172">Dieser PC</text>
  <text class="lbl" x="56" y="198">Dokumente</text>
  <!-- markierter Ordner -->
  <rect x="46" y="208" width="158" height="26" rx="5" fill="#eef4f5" stroke="#0c5f66" stroke-width="1.5"/>
  <path d="M58 220 h7 l2 -3 h9 v10 h-18 Z" fill="#0c5f66"/>
  <text class="lbl" x="84" y="226" font-weight="700">Informatik7</text>

  <!-- Dateiliste -->
  <rect x="224" y="120" width="496" height="150" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
  <text class="lbl-grau" x="240" y="144">Dieser Ordner ist noch leer.</text>

  <!-- Feld Dateiname -->
  <text class="lbl" x="40" y="300">Dateiname:</text>
  <rect x="130" y="284" width="380" height="28" rx="5" fill="#ffffff" stroke="#0c5f66" stroke-width="2"/>
  <text class="lbl" x="142" y="303">mein_erster_test</text>

  <!-- Knopf Speichern -->
  <rect x="530" y="284" width="100" height="28" rx="6" fill="#0c5f66"/>
  <text class="lbl-weiss" x="551" y="303">Speichern</text>

  <!-- Knopf Abbrechen -->
  <rect x="640" y="284" width="82" height="28" rx="6" fill="#ffffff" stroke="#d8e1e8" stroke-width="1.5"/>
  <text class="lbl-grau" x="653" y="303">Abbrechen</text>

  <!-- Beschriftung 1: Ordner -->
  <circle cx="30" cy="221" r="11" fill="#0c5f66"/>
  <text class="lbl-weiss" x="26" y="226">1</text>
  <text class="ruf" x="224" y="200">1. den eigenen Ordner Informatik7 ausw&#228;hlen</text>

  <!-- Beschriftung 2: Dateiname -->
  <circle cx="119" cy="298" r="11" fill="#0c5f66"/>
  <text class="lbl-weiss" x="115" y="303">2</text>

  <!-- Beschriftung 3: Speichern -->
  <circle cx="519" cy="298" r="11" fill="#0c5f66"/>
  <text class="lbl-weiss" x="515" y="303">3</text>

  <text class="ruf" x="130" y="336">2. einen guten Dateinamen eintippen</text>
  <text class="ruf" x="470" y="336">3. auf Speichern klicken</text>

  <!-- Merksatz -->
  <rect x="24" y="366" width="712" height="46" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text class="merk" x="44" y="395">Merke: Ein guter Dateiname sagt dir sp&#228;ter, was drinsteht.</text>
</svg>
