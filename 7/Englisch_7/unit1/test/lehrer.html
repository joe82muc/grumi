<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Vokabeltest verwalten &ndash; Lehrkraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101a2e; --muted:#5d6b84; --line:#dce4f0;
    --dark:#1f2937; --dark-2:#111827; --accent:#1d6fe0; --accent-soft:#e8f0fd;
    --ok:#15803d; --ok-bg:#e9f8ee; --ok-line:#8fd6a8;
    --bad:#c2340f; --bad-bg:#fdeeeb; --bad-line:#f3b5a6;
    --shadow:0 10px 28px rgba(16,26,46,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Source Sans 3",system-ui,"Segoe UI",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#f5f7fa,#eceff5);min-height:100vh;padding:1rem;
  }
  .wrap{max-width:1040px;margin:0 auto}
  .head{
    background:linear-gradient(125deg,var(--dark),var(--dark-2));color:#fff;
    border-radius:18px;padding:1.2rem 1.3rem;box-shadow:var(--shadow);
  }
  .head h1{font-size:clamp(1.3rem,4.4vw,1.8rem);font-weight:800}
  .head p{opacity:.85;margin-top:.3rem;font-size:.93rem}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:1.1rem;box-shadow:var(--shadow);margin-top:1rem;
  }
  h2{font-size:1.05rem;font-weight:800;margin-bottom:.15rem}
  .sub{color:var(--muted);font-size:.88rem;margin-bottom:.9rem}

  label{display:block;font-size:.76rem;font-weight:800;letter-spacing:.04em;
        text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
  input[type=password],input[type=text],select{
    width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:10px;
    font-size:1rem;font-family:inherit;font-weight:600;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

  .btn{
    padding:.7rem 1.3rem;border:none;border-radius:999px;background:var(--dark);color:#fff;
    font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .btn:hover:not(:disabled){background:var(--dark-2)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:.4rem .85rem;font-size:.82rem}
  .btn-ghost{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
  .btn-ghost:hover:not(:disabled){background:#f3f5f9}
  .btn-ok{background:var(--ok)} .btn-ok:hover:not(:disabled){background:#116631}
  .btn-bad{background:var(--bad)} .btn-bad:hover:not(:disabled){background:#a32b0c}
  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}

  .note{border-left:4px solid var(--line);background:#f7f9fc;padding:.7rem .9rem;
        border-radius:8px;font-size:.9rem;margin-top:.8rem;font-weight:600}
  .note.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
  .note.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}

  /* Testkarten */
  .test-card{
    border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;margin-bottom:.7rem;
    display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
  }
  .test-card.open{border-color:var(--ok-line);background:var(--ok-bg)}
  .test-card h3{font-size:.98rem;font-weight:800}
  .test-card .meta{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:.15rem}
  .state{font-size:.78rem;font-weight:800;border-radius:99px;padding:.22rem .7rem}
  .state.on{background:var(--ok);color:#fff}
  .state.off{background:#e4e8ef;color:var(--muted)}

  /* Ergebnisse */
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.5rem}
  th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;
     color:var(--muted);border-bottom:2px solid var(--line);padding:.45rem .4rem}
  td{padding:.5rem .4rem;border-bottom:1px solid #eef2f8}
  tr:hover td{background:#fafbfe}
  .grade{font-weight:900;border-radius:7px;padding:.12rem .5rem;display:inline-block;min-width:1.7rem;text-align:center}
  .g1,.g2{background:var(--ok-bg);color:var(--ok)}
  .g3,.g4{background:#fff6e3;color:#8a5a00}
  .g5,.g6{background:var(--bad-bg);color:var(--bad)}
  .stats{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0}
  .stat{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;text-align:center;min-width:72px}
  .stat b{display:block;font-size:1.3rem;font-weight:800}
  .stat span{font-size:.72rem;color:var(--muted);font-weight:700}
  details{margin-top:.3rem}
  summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:700}
  .detail-list{font-size:.85rem;margin-top:.4rem;padding-left:.2rem}
  .detail-list div{padding:.2rem 0;border-bottom:1px solid #f2f5fa}
  .hidden{display:none}
  @media(max-width:640px){ table{font-size:.82rem} th,td{padding:.35rem .25rem} }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Vokabeltest verwalten</h1>
    <p>Tests freischalten, Ergebnisse ansehen und exportieren</p>
  </div>

  <!-- Login -->
  <section class="panel" id="view-login">
    <h2>Anmeldung Lehrkraft</h2>
    <p class="sub">Bitte das Lehrer-Passwort eingeben.</p>
    <label for="pw">Passwort</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div id="login-msg"></div>
    <div class="btn-row"><button class="btn" id="btn-login">Anmelden</button></div>
  </section>

  <!-- Verwaltung -->
  <section class="panel hidden" id="view-admin">
    <h2>Tests freischalten</h2>
    <p class="sub">Ein Test ist f&uuml;r die Klasse nur sichtbar, solange er freigeschaltet ist.</p>
    <div id="test-list"></div>
    <div id="admin-msg"></div>
  </section>

  <!-- Ergebnisse -->
  <section class="panel hidden" id="view-results">
    <h2>Ergebnisse</h2>
    <p class="sub">Auswertung nach Notenschl&uuml;ssel M-Zug (50&nbsp;% = Note 4).</p>

    <div style="display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <label for="res-test">Test</label>
        <select id="res-test"><option value="">Alle Tests</option></select>
      </div>
      <button class="btn btn-ghost" id="btn-refresh">Aktualisieren</button>
      <button class="btn btn-ghost" id="btn-csv">Als CSV laden</button>
    </div>

    <div class="stats" id="stats"></div>
    <div id="results-box"></div>
  </section>

</div>

<script>
const API_BASE = (location.hostname.includes('github.io') || location.protocol === 'file:')
  ? 'https://englisch-9.onrender.com' : '';
const $ = id => document.getElementById(id);
let PW = '';
let TESTS = [];

function msg(where, text, kind){
  const el = $(where);
  if(!text){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="note ' + (kind || '') + '">' + text + '</div>';
}

/* ---------- Login ---------- */
$('btn-login').addEventListener('click', doLogin);
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

async function doLogin(){
  const pw = $('pw').value;
  if(!pw){ msg('login-msg','Bitte Passwort eingeben.','bad'); return; }
  $('btn-login').disabled = true;
  try{
    // Passwort gegen die Ergebnis-Route pruefen
    const res = await fetch(API_BASE + '/api/vokabeltest/results', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    if(res.status === 401){
      msg('login-msg','Passwort ist falsch.','bad');
      $('btn-login').disabled = false;
      return;
    }
    if(res.status === 404){
      msg('login-msg','Der Server laeuft, kennt den Vokabeltest aber noch nicht. '
        + 'Das Update wurde noch nicht ausgeliefert: In Render beim Dienst '
        + '<strong>englisch-9</strong> auf "Manual Deploy" &rarr; "Deploy latest commit" klicken.','bad');
      $('btn-login').disabled = false;
      return;
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    PW = pw;
    $('view-login').classList.add('hidden');
    $('view-admin').classList.remove('hidden');
    $('view-results').classList.remove('hidden');
    await loadTests();
    await loadResults();
  }catch(e){
    msg('login-msg','Keine Verbindung zum Server. Beim kostenlosen Render-Plan schlaeft der '
      + 'Dienst nach Pausen ein &ndash; bitte in etwa 30 Sekunden noch einmal versuchen.','bad');
    $('btn-login').disabled = false;
  }
}

/* ---------- Testliste ---------- */
async function loadTests(){
  const res = await fetch(API_BASE + '/api/vokabeltest/list');
  const data = await res.json();
  TESTS = data.tests || [];

  const box = $('test-list');
  box.innerHTML = '';
  TESTS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'test-card' + (t.unlocked ? ' open' : '');

    const left = document.createElement('div');
    const h = document.createElement('h3'); h.textContent = t.title;
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = t.unit + ' · ' + t.itemCount + ' Wörter';
    left.append(h, m);

    const right = document.createElement('div');
    right.style.display = 'flex'; right.style.gap = '.6rem'; right.style.alignItems = 'center';
    const state = document.createElement('span');
    state.className = 'state ' + (t.unlocked ? 'on' : 'off');
    state.textContent = t.unlocked ? 'Freigeschaltet' : 'Gesperrt';
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm ' + (t.unlocked ? 'btn-bad' : 'btn-ok');
    btn.textContent = t.unlocked ? 'Sperren' : 'Freischalten';
    btn.addEventListener('click', () => toggleTest(t.id, !t.unlocked, btn));
    right.append(state, btn);

    card.append(left, right);
    box.appendChild(card);
  });

  const sel = $('res-test');
  sel.innerHTML = '<option value="">Alle Tests</option>';
  TESTS.forEach(t => {
    const o = document.createElement('option');
    o.value = t.id; o.textContent = t.title;
    sel.appendChild(o);
  });
}

async function toggleTest(testId, open, btn){
  btn.disabled = true;
  try{
    const res = await fetch(API_BASE + '/api/vokabeltest/unlock', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PW, testId, open })
    });
    const data = await res.json();
    if(!data.ok){ msg('admin-msg','Das hat nicht geklappt.','bad'); btn.disabled = false; return; }
    msg('admin-msg', open ? 'Test ist jetzt freigeschaltet.' : 'Test ist jetzt gesperrt.', 'ok');
    await loadTests();
  }catch(e){
    msg('admin-msg','Keine Verbindung zum Server.','bad');
    btn.disabled = false;
  }
}

/* ---------- Ergebnisse ---------- */
$('btn-refresh').addEventListener('click', loadResults);
$('res-test').addEventListener('change', loadResults);

async function loadResults(){
  const testId = $('res-test').value;
  const box = $('results-box');
  box.innerHTML = '<p class="sub">Wird geladen …</p>';
  try{
    const res = await fetch(API_BASE + '/api/vokabeltest/results', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PW, testId })
    });
    const data = await res.json();
    if(!data.ok){ box.innerHTML = '<div class="note bad">Fehler beim Laden.</div>'; return; }
    renderStats(data);
    renderTable(data.submissions);
  }catch(e){
    box.innerHTML = '<div class="note bad">Keine Verbindung zum Server.</div>';
  }
}

function renderStats(data){
  const s = $('stats');
  s.innerHTML = '';
  const add = (val, lab) => {
    const d = document.createElement('div'); d.className = 'stat';
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = val;
    d.querySelector('span').textContent = lab;
    s.appendChild(d);
  };
  add(data.count, 'Abgaben');
  add(data.averageGrade == null ? '–' : data.averageGrade.toFixed(2), 'Schnitt');
  (data.distribution || []).forEach(d => add(d.count, 'Note ' + d.grade));
}

function renderTable(rows){
  const box = $('results-box');
  box.innerHTML = '';
  if(!rows.length){
    box.innerHTML = '<div class="note">Noch keine Abgaben.</div>';
    return;
  }

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr>' +
    '<th>Klasse</th><th>Name</th><th>Datum</th><th>Punkte</th><th>%</th><th>Note</th><th></th>' +
    '</tr></thead>';
  const tb = document.createElement('tbody');

  rows.forEach(r => {
    const tr = document.createElement('tr');

    const tdC = document.createElement('td'); tdC.textContent = r.className;
    const tdN = document.createElement('td');
    tdN.innerHTML = '<strong></strong>';
    tdN.querySelector('strong').textContent = r.lastName + ', ' + r.firstName;

    // Detailansicht der einzelnen Antworten
    const det = document.createElement('details');
    const sum = document.createElement('summary'); sum.textContent = 'Antworten ansehen';
    const dl = document.createElement('div'); dl.className = 'detail-list';
    (r.details || []).forEach(d => {
      const line = document.createElement('div');
      const ok = d.correct ? '✓' : '✗';
      line.textContent = ok + ' ' + d.nr + '. ' + d.prompt + '  →  '
        + (d.given || '(leer)')
        + (d.correct ? (d.typo ? '  [Tippfehler]' : '') : '   richtig: ' + d.expected);
      line.style.color = d.correct ? '#15803d' : '#c2340f';
      dl.appendChild(line);
    });
    det.append(sum, dl);
    tdN.appendChild(det);

    const tdD = document.createElement('td'); tdD.textContent = r.testDate;
    const tdP = document.createElement('td'); tdP.textContent = r.score + '/' + r.total;
    const tdPc = document.createElement('td'); tdPc.textContent = r.percent + ' %';
    const tdG = document.createElement('td');
    tdG.innerHTML = '<span class="grade g' + r.grade + '"></span>';
    tdG.querySelector('span').textContent = r.grade;

    const tdX = document.createElement('td');
    const del = document.createElement('button');
    del.className = 'btn btn-sm btn-ghost';
    del.textContent = 'Löschen';
    del.title = 'Abgabe löschen, damit neu geschrieben werden kann';
    del.addEventListener('click', () => deleteSubmission(r));
    tdX.appendChild(del);

    tr.append(tdC, tdN, tdD, tdP, tdPc, tdG, tdX);
    tb.appendChild(tr);
  });

  table.appendChild(tb);
  box.appendChild(table);
}

async function deleteSubmission(r){
  if(!confirm('Abgabe von ' + r.firstName + ' ' + r.lastName + ' wirklich löschen?\n\n'
    + 'Danach kann der Test erneut geschrieben werden. Das lässt sich nicht rückgängig machen.')) return;
  try{
    const res = await fetch(API_BASE + '/api/vokabeltest/delete-submission', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PW, submissionId: r.id })
    });
    const data = await res.json();
    if(!data.ok){ alert('Löschen hat nicht geklappt.'); return; }
    loadResults();
  }catch(e){ alert('Keine Verbindung zum Server.'); }
}

/* ---------- CSV ---------- */
$('btn-csv').addEventListener('click', async () => {
  const testId = $('res-test').value;
  try{
    const res = await fetch(API_BASE + '/api/vokabeltest/export', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PW, testId })
    });
    if(!res.ok){ alert('Export hat nicht geklappt.'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vokabeltest_' + (testId || 'alle') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }catch(e){ alert('Keine Verbindung zum Server.'); }
});
</script>
</body>
</html>
