          { f: "The sea is 200 metres from Ezra's house. Ezra lives …", o: ["on the coast", "in the mountains", "far from the sea"], a: 0 },

          { f: "London is … of the United Kingdom.", o: ["the capital", "a village", "a farm"], a: 0 }

      { typ: "paare", t: "Finde die Gegenteile.", tipp: "Gegenteil = das Wort, das das Umgekehrte sagt: hot – cold.",

      { typ: "luecke", t: "Ergänze das passende Wort.", tipp: ["Die Wörter stehen oben im Merkwissen.", "Lies den ganzen Satz – der zweite Teil hilft dir."],

      { typ: "bauen", t: "Baue die Sätze.", tipp: "Achte auf das Satzzeichen am Ende.",

                { teile: ["My favourite place", "is the cinema", "because", "I love films."] }, { teile: ["There isn't", "much", "to do", "for teenagers."] }] },
      { typ: "wahl", t: "Welche Antwort passt? Wähle.", mischen: true, tipp: "Lies die Frage genau. Die Antwort muss dazu passen und richtig gebildet sein.",
        items: [
          { f: "Where do you live?", o: ["I live in a village near the mountains.", "I am living a village.", "I live at a village."], a: 0 },
          { f: "How many people live in your town?", o: ["About 20,000 people live there.", "There live 20,000 people.", "It has 20,000 people live."], a: 0 },

          { f: "Is there much to do in your village?", o: ["No, there isn't much to do.", "No, there aren't much to do.", "No, it isn't much do."], a: 0 }
        ] },
      { typ: "frei", t: "Schreibe selbst: Wo wohnst du? Und was ist dein Lieblingsort?", tipp: ["Wohnort: I live in … It's in the … of … / near …", "Lieblingsort: My favourite place is … because …"],
        items: [{ f: "Wo du wohnst", kriterien: ["ein vollständiger englischer Satz", "Ortsart oder Name und Lage (in the north of, near …)"], muster: "\\bi\\s+live\\s+(in|on|near)\\b", bsp: "I live in a small town in the south of Germany." },
                { f: "Dein Lieblingsort", kriterien: ["ein vollständiger englischer Satz", "My favourite place is … because …"], muster: "\\bfavourite\\s+place\\b.*\\bbecause\\b", bsp: "My favourite place is the park because I can play football there." }] }
    ],
    plus: [
      { typ: "luecke", t: "Ayesha schreibt einen Kurzvortrag über ihre Stadt. Ergänze die Lücken.", tipp: ["Die Wendungen stehen im Merkwissen.", "Lies zuerst den ganzen Text."],
