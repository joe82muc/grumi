  <title>Extra: he, she, it – das s muss mit | Englisch 7</title>
  <meta name="description" content="Englisch 7, Unit 1: Kleine Extra-Übungen zum simple present – bei he, she, it kommt ein s ans Verb; verneinen mit don't und doesn't.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(1, "x");
  Grammatik.seite({
    nr: 2, lsNr: 2, modul: "e7-u1-x2", kurz: "X2",
    titel: "Extra: he, she, it – das s muss mit",
    lead: "„I **play** football. – Ned **plays** football.“ – Hier übst du in kleinen Schritten: Bei he, she, it muss das s mit.",
    ziele: ["Du erkennst, wann das Verb ein s bekommt.", "Du schreibst die Form mit s.", "Du verneinst mit don't und doesn't."],
    merk: [
      { t: "Merke: he, she, it – das s muss mit", html: `
        <p>I play · you play · we play · they play</p>
        <p><b>he</b> play<b>s</b> · <b>she</b> play<b>s</b> · <b>it</b> play<b>s</b></p>
        <p>Achtung: go → go<b>es</b> · watch → watch<b>es</b> · have → <b>has</b></p>
        <div class="bsp">Tilly <b>lives</b> in a village. Her cat <b>sleeps</b> all day.</div>` },
      { t: "Verneinen", html: `
        <p>I, you, we, they → <b>don't</b> + Grundform</p>
        <p>he, she, it → <b>doesn't</b> + Grundform – das s steckt schon in doesn't!</p>
        <div class="bsp">Barney <b>doesn't like</b> Maths. (nicht: doesn't likes)</div>` }
    ],
    basis: [
      { typ: "wahl", davor: "Schritt 1 · Mit s oder ohne s?", t: "Wähle die richtige Form.", mischen: true,
        tipp: "he, she, it oder ein Name → mit s. I, you, we, they → ohne s.",
        items: [
          { s: "Tilly ___ to school by bike.", o: ["goes", "go"], a: 0, e: "Tilly = she → goes." },
          { s: "I ___ breakfast at seven.", o: ["have", "has"], a: 0, e: "I → ohne s: have." },
          { s: "My brother ___ computer games.", o: ["plays", "play"], a: 0, e: "my brother = he → plays." },
          { s: "We ___ in a small town.", o: ["live", "lives"], a: 0, e: "we → ohne s: live." },
          { s: "The dog ___ in the garden.", o: ["sleeps", "sleep"], a: 0, e: "the dog = it → sleeps." }
        ] },
      { typ: "zuordnen", davor: "Schritt 2 · Wer bekommt das s?", t: "Sortiere: Bekommt das Verb ein s?",
        tipp: "Ersetze den Namen durch he, she, it oder they. Dann siehst du es.",
        gruppen: ["mit s (he, she, it)", "ohne s (I, you, we, they)"],
        karten: [["Ned", 0], ["my sister", 0], ["the cat", 0], ["our teacher", 0], ["it", 0], ["I", 1], ["you", 1], ["my parents", 1], ["Hattie and I", 1], ["they", 1]] },
      { typ: "paare", davor: "Schritt 3 · Die Form mit s", t: "Verbinde die Grundform mit der Form für he, she, it.",
        tipp: "Meistens kommt nur ein -s dazu. Nach o, sh, ch → -es. have → has.",
        paare: [["play", "plays"], ["live", "lives"], ["go", "goes"], ["watch", "watches"], ["have", "has"], ["do", "does"]] },
      { typ: "luecke", davor: "Schritt 4 · Das Verb steht neben der Lücke", t: "Schreibe das Verb mit s.",
        tipp: ["Alle Sätze sprechen über he, she oder it.", "go → goes · watch → watches · have → has"],
        items: ["Barney [[lives]] (live) in a small village.", "He [[walks]] (walk) to school every day.", "His sister [[watches]] (watch) TV after school.",
                "Hattie [[goes]] (go) to the dance club.", "Ned [[has]] (have) a new bike."] },
      { typ: "luecke", davor: "Schritt 5 · Verneinen", t: "Verneine mit doesn't oder don't. Das Verb steht neben der Lücke.",
        info: "Beispiel: Tilly doesn't like (not like) cold weather. – he, she, it → doesn't · I, you, we, they → don't",
        tipp: ["he, she, it → doesn't. I, you, we, they → don't.", "Nach doesn't kommt die Grundform – ohne s."],
        items: ["Ned [[doesn't eat|does not eat]] (not eat) fish.", "I [[don't get up|do not get up]] (not get up) early on Sundays.",
                "Our cat [[doesn't like|does not like]] (not like) water.", "My friends [[don't live|do not live]] (not live) near me."] },
      { typ: "bauen", davor: "Schritt 6 · Ein Satz selbst", t: "Baue die Sätze. Denk an das s.",
        info: "Beispiel: Hattie – plays – the guitar. → Hattie plays the guitar.",
        tipp: "Person – Verb (mit s oder mit doesn't) – Rest. Der Punkt steht am letzten Baustein.",
        items: [{ teile: ["My", "brother", "walks", "to school."] }, { teile: ["Tilly", "doesn't", "like", "Maths."] }] }
    ],
    plus: [
      { typ: "luecke", t: "Noch mehr üben: Ned erzählt von seiner Schwester. Setze die Verben ein.",
        tipp: ["Wer ist die Person? he, she, it → s.", "Verneint: doesn't + Grundform."],
        items: ["My sister Tilly [[loves]] animals. (love)", "She [[feeds]] our rabbits every morning. (feed)", "She [[doesn't like|does not like]] spiders. (not like)",
                "Our rabbits [[eat]] carrots and grass. (eat)", "And me? I [[help]] her at the weekend. (help)"] },
      { typ: "frei", t: "Schreibe einen Satz über eine Person aus deiner Familie: Was macht sie gern oder oft?", tipp: "Fang so an: My mum … / My brother … – und denk an das s.",
        items: [{ f: "Dein Satz", kriterien: ["ein vollständiger englischer Satz", "Form für he oder she mit s, z. B. My dad plays …"],
                  muster: "\\b(my\\s+(mum|dad|mother|father|sister|brother|grandma|grandad|grandpa|granny|cousin|aunt|uncle)|he|she)\\s+(\\w+s|has)\\b", bsp: "My sister plays the piano." }] }
    ]
  });
  </script>
