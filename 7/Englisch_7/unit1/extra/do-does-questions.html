  <title>Extra: Fragen mit do und does | Englisch 7</title>
  <meta name="description" content="Englisch 7, Unit 1: Kleine Extra-Übungen zu Fragen im simple present – Do oder Does, Kurzantworten und Fragen mit Fragewort.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../../css/grammatik.css">
  <link rel="stylesheet" href="../../../../css/englisch-baukasten.css">

</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(1, "x");
  Grammatik.seite({
    nr: 3, lsNr: 3, modul: "e7-u1-x3", kurz: "X3",
    titel: "Extra: Fragen mit do und does",
    lead: "„**Do** you walk to school? – Yes, I do. **Does** Ned walk to school? – No, he doesn't.“ – Hier übst du Fragen mit do und does in kleinen Schritten.",
    ziele: ["Du wählst Do oder Does – passend zur Person.", "Du findest die richtige Kurzantwort.", "Du baust Fragen mit und ohne Fragewort."],
    merk: [
      { t: "Do oder Does?", html: `
        <p><b>Do</b> I / you / we / they …? · <b>Does</b> he / she / it …?</p>
        <p>Nach Do und Does steht die <b>Grundform</b> – ohne s: Does Ned <b>play</b> …? (nicht: Does Ned plays …?)</p>
        <div class="bsp"><b>Does</b> Hattie like Art? – Yes, she <b>does</b>. / No, she <b>doesn't</b>.</div>` },
      { t: "Fragen mit Fragewort", html: `
        <p>Das Fragewort steht vorn: <b>What</b> (was), <b>Where</b> (wo), <b>When</b> (wann), <b>What time</b> (um wie viel Uhr) + do/does + Person + Grundform</p>
        <div class="bsp"><b>Where do</b> you live? · <b>When does</b> the film start?</div>` }
    ],
    basis: [
      { typ: "luecke", davor: "Schritt 1 · Do oder Does?", t: "Wähle Do oder Does.",
        tipp: "he, she, it oder ein Name → Does. I, you, we, they → Do.",
        items: ["{{Does|Do}} Ned like football?", "{{Do|Does}} you go to the chess club?", "{{Does|Do}} your sister walk to school?", "{{Do|Does}} Tilly and Barney live in a village?", "{{Does|Do}} the bus stop here?"] },
      { typ: "zuordnen", davor: "Schritt 2 · Das Hilfsverb gehört zur Person", t: "Sortiere: Fragst du mit Do oder mit Does?",
        tipp: "Eine Person oder ein Ding (he, she, it) → Does. you und mehrere Personen → Do.",
        gruppen: ["Do …?", "Does …?"],
        karten: [["you", 0], ["we", 0], ["they", 0], ["your parents", 0], ["he", 1], ["she", 1], ["Barney", 1], ["your dog", 1]] },
      { typ: "paare", davor: "Schritt 3 · Deutsch und Englisch", t: "Verbinde die deutsche Frage mit der englischen.",
        tipp: "Schau auf die Person: du, ihr, sie (mehrere) → Do. er, sie (eine), es → Does.",
        paare: [["Magst du Sport?", "Do you like sport?"], ["Mag er Sport?", "Does he like sport?"], ["Mag sie Sport?", "Does she like sport?"],
                ["Mögen sie Sport? (mehrere)", "Do they like sport?"], ["Spielt Ned Fußball?", "Does Ned play football?"]] },
      { typ: "wahl", davor: "Schritt 4 · Kurzantworten", t: "Wähle die richtige Kurzantwort.", mischen: true,
        tipp: "Die Antwort nimmt das Hilfsverb der Frage: Do → do/don't, Does → does/doesn't.",
        items: [
          { s: "Do you like Music?", o: ["Yes, I do.", "Yes, I does."], a: 0, e: "you → I do." },
          { s: "Does Hattie play the guitar?", o: ["No, she doesn't.", "No, she don't."], a: 0, e: "she → doesn't." },
          { s: "Does your brother get up early?", o: ["Yes, he does.", "Yes, he do."], a: 0, e: "he → does." },
          { s: "Do your friends walk to school?", o: ["No, they don't.", "No, they doesn't."], a: 0, e: "they → don't." }
        ] },
      { typ: "luecke", davor: "Schritt 5 · Die Antwort steht hinter der Frage", t: "Ergänze die Frage mit der Grundform. Die Antwort hilft dir.",
        info: "Beispiel: Do you like (like) PE? – Yes, I do. – Do/Does und die Person stehen schon da. Du schreibst nur die Grundform.",
        tipp: ["Nach Do und Does: Grundform – ohne s!", "Schau auf die Antwort: Sie passt zur Frage."],
        items: ["Does Tilly [[have]] a pet? – Yes, she does. (have)", "Do you [[walk]] to school? – No, I don't. I go by bus. (walk)",
                "Does Ned [[play]] in the school band? – Yes, he does. (play)", "Do your parents [[work]] in town? – Yes, they do. (work)"] },
      { typ: "bauen", davor: "Schritt 6 · Fragen bauen", t: "Baue die Fragen. Die Antwort steht dabei.",
        info: "Beispiel: Does – Barney – like – Art? → Does Barney like Art? – Yes, he does.",
        tipp: "Do/Does – Person – Grundform – Rest. Mit Fragewort: das Fragewort zuerst. Das Fragezeichen steht am letzten Baustein.",
        items: [{ f: "Antwort: Yes, she does.", teile: ["Does", "Hattie", "like", "dancing?"] }, { f: "Antwort: No, I don't.", teile: ["Do", "you", "get up", "early?"] },
                { f: "Antwort: At quarter to nine.", teile: ["When", "does", "school", "start?"] }] },
      { typ: "luecke", davor: "Schritt 7 · Jetzt du", t: "Jetzt du: Schreibe do oder does. Die Antwort steht hinter der Frage.",
        tipp: ["Fragewort + do/does + Person + Grundform.", "you, they → do · he, she, it → does"],
        items: ["Where [[do]] you live? – In a small town.", "What time [[does]] Ned get up? – At seven o'clock.", "What [[does]] Hattie have for lunch? – A sandwich."] }
    ],
    plus: [
      { typ: "luecke", t: "Noch mehr üben: Ein Interview. Schreibe Do, Does oder die Kurzantwort.",
        tipp: ["he, she, it → Does / does / doesn't · I, you, we, they → Do / do / don't", "Die Kurzantwort nimmt das Hilfsverb der Frage."],
        items: ["[[Do]] you like your new school? – Yes, I [[do]].", "[[Does]] your sister go to the same school? – No, she [[doesn't|does not]].",
                "What time [[do]] your lessons start? – At ten to eight.", "[[Does]] your best friend play an instrument? – Yes, he [[does]]. He plays the drums."] },
      { typ: "frei", t: "Schreibe eine Frage an eine Freundin oder einen Freund – mit Do you …? oder Does your …?", tipp: "Zum Beispiel: Do you like football? / Does your brother play the guitar?",
        items: [{ f: "Deine Frage", kriterien: ["eine vollständige englische Frage", "Do you … oder Does your … mit der Grundform"],
                  muster: "^\\s*(do|does)\\s+\\w+.*\\?\\s*$", bsp: "Do you like football?" }] }
    ]
  });
  </script>
</body>
</html>
