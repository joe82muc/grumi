  <title>Extra: simple past Schritt für Schritt | Englisch 7</title>
  <meta name="description" content="Englisch 7, Unit 1: Kleine Extra-Übungen zum simple past – fertige Formen einsetzen, was und were, verneinen mit didn't, wasn't und weren't.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(1, "x");
  Grammatik.seite({
    nr: 1, lsNr: 1, modul: "e7-u1-x1", kurz: "X1",
    titel: "Extra: simple past Schritt für Schritt",
    lead: "„Yesterday Ned **played** football. He **didn't go** to the cinema.“ – Hier übst du das simple past in kleinen Schritten.",
    ziele: ["Du erkennst die Formen im simple past.", "Du setzt fertige Formen und was oder were ein.", "Du verneinst mit didn't, wasn't und weren't."],
    merk: [
      { t: "Merke: simple past", html: `
        <p>Für Vergangenes – Signalwörter: <b>yesterday</b> (gestern), <b>last week</b> (letzte Woche), <b>two days ago</b> (vor zwei Tagen).</p>
        <p>regelmäßig: Grundform + <b>-ed</b>: play → play<b>ed</b>, watch → watch<b>ed</b></p>
        <p>unregelmäßig: eine eigene Form: go → <b>went</b>, see → <b>saw</b>, have → <b>had</b></p>
        <div class="bsp">Last Sunday Hattie <b>visited</b> her grandma. They <b>had</b> cake.</div>` },
      { t: "Verneinen und was/were", html: `
        <p><b>didn't</b> + Grundform: Ned <b>didn't play</b>. (nicht: didn't played)</p>
        <p>I, he, she, it → <b>was</b> / <b>wasn't</b> · you, we, they → <b>were</b> / <b>weren't</b></p>
        <div class="bsp">The film <b>wasn't</b> long. · My friends <b>weren't</b> there.</div>` }
    ],
    basis: [
      { typ: "wahl", davor: "Schritt 1 · Gestern oder jeden Tag?", t: "Welche Form passt? Achte auf yesterday, last … und ago.", mischen: true,
        tipp: "yesterday, last …, … ago → simple past: -ed oder eine eigene Form.",
        items: [
          { s: "Yesterday Tilly ___ her aunt.", o: ["visited", "visits"], a: 0, e: "yesterday → simple past: visited." },
          { s: "Last summer we ___ to the seaside.", o: ["went", "go"], a: 0, e: "go → went (eigene Form)." },
          { s: "Two days ago Barney ___ a funny film.", o: ["saw", "sees"], a: 0, e: "see → saw (eigene Form)." },
          { s: "Last night I ___ my homework.", o: ["did", "do"], a: 0, e: "do → did (eigene Form)." },
          { s: "Yesterday Ned ___ football in the park.", o: ["played", "plays"], a: 0, e: "play → played." }
        ] },
      { typ: "paare", davor: "Schritt 2 · Grundform und simple past", t: "Verbinde die Grundform mit der Form im simple past.",
        tipp: "Diese Verben sind unregelmäßig. Sprich sie laut: go – went, see – saw.",
        paare: [["go", "went"], ["see", "saw"], ["have", "had"], ["eat", "ate"], ["get", "got"], ["come", "came"]] },
      { typ: "zuordnen", davor: "Schritt 3 · was oder were?", t: "Sortiere: Was passt – was oder were?",
        tipp: "Eine Person oder ein Ding (I, he, she, it) → was. you und mehrere Personen → were.",
        gruppen: ["was", "were"],
        karten: [["I", 0], ["he", 0], ["she", 0], ["it", 0], ["Hattie", 0], ["you", 1], ["we", 1], ["they", 1], ["Barney and Ned", 1]] },
      { typ: "luecke", davor: "Schritt 4 · Mit Wortkasten", t: "Hatties Ausflug: Setze die Wörter aus dem Kasten ein.",
        info: "Wortkasten: went ✓ · took · was · saw · had · swam – Beispiel: Last Saturday Hattie went to the seaside with her family.",
        tipp: ["Alle Wörter im Kasten stehen schon im simple past. Du musst sie nur einsetzen.", "Jedes Wort passt genau einmal. went ist schon eingesetzt."],
        items: ["They [[took]] the train at nine o'clock.", "The weather [[was]] sunny and warm.", "On the beach Hattie [[saw]] a lot of boats.", "At lunchtime they [[had]] a picnic.", "In the afternoon Hattie [[swam]] in the sea."] },
      { typ: "luecke", davor: "Schritt 5 · Verneinen", t: "Was war nicht so? Schreibe die verneinte Form.",
        info: "Hilfe: didn't + Grundform · wasn't · weren't – Beispiel: Ned didn't play football. (not play)",
        tipp: ["Bei Verben: didn't + Grundform – ohne -ed!", "Bei be: I, he, she, it → wasn't · we, you, they → weren't"],
        items: ["Barney [[didn't watch|did not watch]] TV yesterday. (not watch)", "It [[wasn't|was not]] cold on the beach. (not be)", "We [[weren't|were not]] at home on Sunday. (not be)",
                "Tilly [[didn't feed|did not feed]] the cat this morning. (not feed)", "Hattie and Ned [[didn't go|did not go]] to school on Saturday. (not go)"] },
      { typ: "bauen", davor: "Schritt 6 · Satzgerüst", t: "Baue die verneinten Sätze.",
        info: "Beispiel: Ned – didn't – play – football. → Ned didn't play football. So geht es: Person + didn't + Grundform + Rest.",
        tipp: "Person – didn't oder wasn't – Rest. Das Satzzeichen steht am letzten Baustein.",
        items: [{ teile: ["Tilly", "didn't", "tidy", "her room."] }, { teile: ["We", "didn't", "see", "the castle."] }, { teile: ["Barney", "wasn't", "at school", "yesterday."] }] },
      { typ: "luecke", davor: "Schritt 7 · Jetzt du", t: "Jetzt du: Schreibe die Form im simple past.",
        tipp: ["Regelmäßig: Grundform + -ed.", "Bei not: didn't + Grundform."],
        items: ["Last week Ned [[visited]] his cousins on their farm. (visit)", "Hattie [[didn't buy|did not buy]] a new bike. (not buy)"] }
    ],
    plus: [
      { typ: "luecke", t: "Noch mehr üben: Eine Nachricht von Tilly. Setze die Verben ins simple past.",
        tipp: ["be → was/were · have → had · help → helped", "not: didn't + Grundform"],
        items: ["Hi Hattie! Yesterday I [[was]] at the farm with my dad. (be)", "We [[helped]] with the cows. (help)", "The goats [[were]] very funny. (be)",
                "I [[didn't take|did not take]] any photos, sorry! (not take)", "In the evening we [[had]] pizza. (have)"] },
      { typ: "frei", t: "Schreibe zwei Sätze: Was hast du letztes Wochenende gemacht – und was nicht?", tipp: "Fang so an: Last weekend I … / I didn't …",
        items: [{ f: "Deine zwei Sätze", kriterien: ["zwei vollständige englische Sätze", "ein Satz im simple past (z. B. went, played)", "ein Satz mit didn't + Grundform"],
                  muster: "\\bdid(n['’]?t|\\s+not)\\s+[a-z]+", bsp: "Last weekend I visited my grandma. I didn't play football." }] }
    ]
  });
  </script>
