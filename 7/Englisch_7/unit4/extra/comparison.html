  <title>Extra: Steigern Schritt für Schritt | Englisch 7</title>
  <meta name="description" content="Englisch 7, Unit 4: Kleine Extra-Übungen zum Steigern von Adjektiven mit -er/-est und more/most in leichten Schritten.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../../css/grammatik.css">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(4, "x");
  Grammatik.seite({
    nr: 1, lsNr: 1, modul: "e7-u4-x1", kurz: "X1",
    titel: "Extra: Steigern Schritt für Schritt",
    lead: "„This phone is **cheaper** than that phone. – This game is **more exciting** than that game.“ – Hier übst du das Steigern in kleinen Schritten.",
    ziele: ["Du entscheidest: kurzes oder langes Adjektiv?", "Du wählst -er oder more.", "Du bildest einfache Vergleichssätze."],
    merk: [
      { t: "Merke: kurz oder lang?", html: `
        <p><b>kurz</b> (eine Silbe) → <b>-er</b> / <b>-est</b>: cheap<b>er</b>, the cheap<b>est</b></p>
        <p><b>lang</b> (zwei Silben oder mehr) → <b>more</b> / <b>the most</b>: <b>more</b> popular, <b>the most</b> popular</p>
        <p>Achtung: Wörter auf <b>-y</b> wie easy, happy bekommen <b>-er</b> / <b>-est</b>: easier, the easiest.</p>
        <div class="bsp">Klatsche das Wort in Silben: use-ful = 2 Silben, ex-pen-sive = 3 Silben → lang.</div>` },
      { t: "Mit weniger", html: `
        <p><b>less … than</b> = weniger als · <b>the least</b> = am wenigsten</p>
        <div class="bsp">A bike is <b>less expensive than</b> a car.</div>` }
    ],
    basis: [
      { typ: "zuordnen", davor: "Schritt 1 · Kurz oder lang?", t: "Sortiere die Adjektive.", tipp: "Eine Silbe → kurz. Zwei Silben oder mehr → lang. Klatsche mit.",
        gruppen: ["kurz", "lang"],
        karten: [["old", 0], ["fast", 0], ["cheap", 0], ["small", 0], ["expensive", 1], ["popular", 1], ["interesting", 1], ["dangerous", 1]] },
      { typ: "wahl", davor: "Schritt 2 · -er oder more?", t: "Welche Form ist richtig?", mischen: true, tipp: "Kurz → -er · lang → more",
        items: [
          { s: "A train is ___ than a bike.", o: ["faster", "more fast"], a: 0, e: "fast ist kurz: faster." },
          { s: "A hotel is ___ than a tent.", o: ["more expensive", "expensiver"], a: 0, e: "expensive ist lang: more expensive." },
          { s: "My phone is ___ than your phone.", o: ["older", "more old"], a: 0, e: "old ist kurz: older." },
          { s: "This app is ___ than that app.", o: ["more popular", "popularer"], a: 0, e: "popular ist lang: more popular." },
          { s: "Tea is ___ than juice here.", o: ["cheaper", "more cheap"], a: 0, e: "cheap ist kurz: cheaper." }
        ] },
      { typ: "luecke", t: "Wähle die richtige Form: the -est oder the most?", tipp: "Kurz → the …-est · lang → the most …",
        items: ["This is {{the oldest|the most old}} castle in Wales.", "This is {{the most dangerous|the dangerousest}} road.", "She is {{the fastest|the most fast}} girl in our class.", "That is {{the most interesting|the interestingest}} book."] },
      { typ: "luecke", t: "Setze das Wort aus dem Kasten ein.", tipp: "mehr → more/most · weniger → less/least. Mit than: more oder less. Mit the: most oder least.",
        info: "Wortkasten: more · most · less · least",
        items: ["I love this game. It is [[more]] exciting than that game.", "Everybody in our class has this app. It is the [[most]] popular app.", "A bike is [[less]] expensive than a car.", "Nobody in our class likes golf. For us, it is the [[least]] exciting sport."] },
      { typ: "bauen", t: "Ein Satzgerüst mit Beispiel: Baue den Satz.", tipp: "Beispiel: A hotel – is – more expensive – than – a tent.",
        info: "Beispiel: A hotel is more expensive than a tent. Jetzt du: Ding + is + more + Adjektiv + than + Ding.",
        items: [{ teile: ["A", "plane", "is", "more", "expensive", "than", "a", "bus."] }, { teile: ["This", "app", "is", "more", "popular", "than", "that", "app."] }, { teile: ["A", "train", "is", "faster", "than", "a", "bus."] }] },
      { typ: "luecke", t: "Jetzt du: Schreibe die ganze Form.", tipp: "Kurz: -er · lang: more … Vergiss than nicht.",
        items: ["A phone is [[cheaper]] than a tablet. (cheap)", "Skiing is [[more dangerous]] than walking. (dangerous)"] }
    ],
    plus: [
      { typ: "luecke", t: "Noch mehr üben: Setze die Form ein.", tipp: "Kurz: -er/-est · lang: more/most",
        items: ["My bag is [[older]] than your bag. (old)", "This film is [[more interesting]] than the book. (interesting)", "The Mississippi is one of [[the longest]] rivers in the USA. (long)"] },
      { typ: "frei", t: "Schreibe einen Satz: Vergleiche zwei Dinge.", tipp: "Fang so an: A phone is … / Football is …",
        items: [{ f: "Dein Vergleich", kriterien: ["ein vollständiger englischer Satz", "Steigerung mit -er oder more und than"],
                  muster: "\\b(\\w+er|more\\s+\\w+|less\\s+\\w+)\\s+than\\b", bsp: "Football is more popular than golf." }] }
    ]
  });
  </script>
