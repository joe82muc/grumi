  <script>
  E7Seite(4, "x");
  Grammatik.seite({
    nr: 5, lsNr: 5, modul: "e7-u4-x5", kurz: "X5",
    titel: "Extra: British und American English",
    lead: "„In Britain you eat **chips**. In the USA you eat **fries**.“ – Hier übst du Wörter und Schreibweisen aus beiden Ländern.",
    ziele: ["Du ordnest britische und amerikanische Wörter zu.", "Du kennst typische Schreibweisen.", "Du erkennst, zu welchem Land ein Satz passt."],
    merk: [
      { t: "Merke: Bilder – britisch und amerikanisch", breit: true, html: E7Seite.bilder([["fries","chips (BE) · fries (AE)","Pommes frites"],
          ["crisps","crisps (BE) · chips (AE)","Kartoffelchips"],
          ["flat","flat (BE) · apartment (AE)","Wohnung"],
          ["queue","queue (BE) · line (AE)","Schlange (zum Anstehen)"],
          ["autumn","autumn (BE) · fall (AE)","Herbst"],
          ["sweets","sweets (BE) · candy (AE)","Süßigkeiten"],
          ["lift","lift (BE) · elevator (AE)","Aufzug"],
          ["trousers","trousers (BE) · pants (AE)","Hose"],
          ["cinema","cinema (BE) · movie theater (AE)","Kino"]]) },
      { t: "Merke: gleiche Sache, anderes Wort", html: `
        <p><b>BE</b> (Britain) · <b>AE</b> (USA)</p>
        <p>chips = <b>fries</b> · crisps = <b>chips</b> · flat = <b>apartment</b> · rubbish = <b>garbage</b></p>
        <div class="bsp">Vorsicht: <b>chips</b> sind in Britain Pommes, in den USA Kartoffelchips!</div>` },
      { t: "Merke: Schreibweisen", html: `
        <p>BE <b>-our</b> → AE <b>-or</b>: colo<b>ur</b> → colo<b>r</b>, favo<b>ur</b>ite → favo<b>r</b>ite</p>
        <p>BE <b>-re</b> → AE <b>-er</b>: cent<b>re</b> → cent<b>er</b></p>
        <div class="bsp">My favourite colour is blue. (BE) · My favorite color is blue. (AE)</div>` }
    ],
    basis: [
      { typ: "paare", davor: "Schritt 1 · Bilder und amerikanische Wörter", t: "Wie sagt man das in den USA? Verbinde Bild und amerikanisches Wort.", tipp: "Vorsicht: Pommes heißen in den USA fries – chips sind dort Kartoffelchips.",
        paare: [["img:wb/fries.jpg", "fries"], ["img:wb/crisps.jpg", "chips"], ["img:wb/sweets.jpg", "candy"], ["img:wb/lift.jpg", "elevator"], ["img:wb/trousers.jpg", "pants"], ["img:wb/cinema.jpg", "movie theater"]] },
      { typ: "paare", davor: "Schritt 2 · BE und AE", t: "Verbinde das britische Wort mit dem amerikanischen Wort.", tipp: "Beide Wörter bedeuten dasselbe. Links steht BE, rechts AE.",
        paare: [["flat", "apartment"], ["rubbish", "garbage"], ["film", "movie"], ["queue", "line"], ["autumn", "fall"], ["holiday", "vacation"]] },
      { typ: "wahl", davor: "Schritt 3 · Pommes und Chips", t: "Wähle das richtige Wort.", mischen: true, tipp: "chips und crisps: Das ist leicht zu verwechseln. Lies die Merkbox.",
        items: [
          { s: "BE: chips · AE: ___", o: ["fries", "crisps"], a: 0, e: "Pommes: BE chips, AE fries." },
          { s: "BE: crisps · AE: ___", o: ["chips", "fries"], a: 0, e: "Kartoffelchips: BE crisps, AE chips." },
          { s: "A girl from the USA says fries. In Britain you say ___.", o: ["chips", "crisps"], a: 0, e: "fries heißt in Britain chips." },
          { s: "A boy from London says crisps. In the USA you say ___.", o: ["chips", "fries"], a: 0, e: "crisps heißt in den USA chips." }
        ] },
      { typ: "zuordnen", davor: "Schritt 4 · Schreibweisen", t: "Welche Schreibweise gehört zu welchem Land?", tipp: "BE hat -our und -re. AE hat -or und -er.",
        gruppen: ["British English", "American English"],
        karten: [["colour", 0], ["centre", 0], ["favourite", 0], ["color", 1], ["center", 1], ["favorite", 1]] },
      { typ: "luecke", t: "Wähle die richtige Schreibweise.", tipp: "Denk an das Land im Satz.",
        items: ["In the USA you write {{color|colour}}.", "In Britain you write {{centre|center}}.", "In the USA you write {{favorite|favourite}}."] },
      { typ: "wahl", davor: "Schritt 5 · Welches Land?", t: "Zu welchem Land passt der Satz eher?", mischen: true, tipp: "Achte auf das Wort, das nur in einem Land üblich ist.",
        items: [
          { s: "We stood in a queue for an hour.", o: ["Britain", "USA"], a: 0, e: "queue ist britisch, AE: line." },
          { s: "Let's watch a movie tonight.", o: ["USA", "Britain"], a: 0, e: "movie ist typisch amerikanisch, BE: film." },
          { s: "We live in a flat near the park.", o: ["Britain", "USA"], a: 0, e: "flat ist britisch, AE: apartment." },
          { s: "Fall is my favorite season.", o: ["USA", "Britain"], a: 0, e: "fall und favorite sind amerikanisch." }
        ] },
      { typ: "luecke", t: "Setze das Wort aus dem Kasten ein.", tipp: "Welches Land spricht? Dann wähle das passende Wort.",
        info: "Wortkasten: holiday · vacation · rubbish · garbage",
        items: ["A girl from London says: “Put the [[rubbish]] in the bin.”", "A boy from Texas says: “Take out the [[garbage]].”", "In London we go on [[holiday]] in summer.", "In Texas they go on [[vacation]] in summer."] },
      { typ: "bauen", t: "Ein Satzgerüst mit Beispiel: Baue den Satz.", tipp: "Beispiel: In the USA – they say – movie.",
        info: "Beispiel: In the USA they say movie. Jetzt du: In + Land + Subjekt + say + Wort.",
        items: [{ teile: ["In", "the", "USA", "they", "say", "apartment."] }, { teile: ["In", "Britain", "we", "say", "film."] }] }
    ],
    plus: [
      { typ: "luecke", t: "Noch mehr üben: Schreibe die amerikanische Form.", tipp: "BE -our → AE -or · BE -re → AE -er",
        items: ["BE: colour – AE: [[color]]", "BE: centre – AE: [[center]]", "BE: favourite – AE: [[favorite]]"] },
      { typ: "frei", t: "Schreibe einen Satz über ein Wortpaar.", tipp: "Fang so an: In Britain we say … , in the USA they say …",
        items: [{ f: "Dein Satz", kriterien: ["ein vollständiger englischer Satz", "ein britisches und ein amerikanisches Wort"],
                  muster: "\\b(Britain|the UK|England|BE)\\b.*\\b(USA|America|AE)\\b", bsp: "In Britain we say film, in the USA they say movie." }] }
    ]
  });
  </script>
