        <p>Kannst du zählen (one, two, three)? → <b>many</b> + Plural: many bags, many friends</p>

        <p><b>too many</b> / <b>too much</b> = zu viele / zu viel (ein Problem)</p>
        <p><b>so many</b> / <b>so much</b> = so viele / so viel</p>

          { s: "We haven't got ___ time.", o: ["much", "many"], a: 0, e: "time ist nicht zählbar: much." },

          { s: "I've got ___ bags. I can't carry them all!", o: ["too many", "too much"], a: 0, e: "bags kann man zählen: too many." },
