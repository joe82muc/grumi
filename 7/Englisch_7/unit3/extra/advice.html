  <script>
  E7Seite(3, "x");
  Grammatik.seite({
    nr: 4, lsNr: 4, modul: "e7-u3-x4", kurz: "X4",
    titel: "Extra: Ratschläge geben",
    lead: "„You **should** talk to your teacher.“ – Hier übst du Gefühle und kleine Ratschläge in leichten Schritten.",
    ziele: ["Du kennst Wörter für Gefühle.", "Du wählst einen passenden Ratschlag.", "Du baust Ratschläge mit You should, Why don't you und Try to."],
    merk: [
      { t: "Merke: Bilder zu den Gefühlen", breit: true, html: E7Seite.bilder([["happy","happy","glücklich"],
          ["sad","sad","traurig"],
          ["angry","angry","wütend"],
          ["nervous","nervous","aufgeregt, nervös"],
          ["lonely","lonely","einsam"],
          ["tired","tired","müde"],
          ["proud","proud","stolz"],
          ["shy","shy","schüchtern"]]) },
      { t: "Merke: So gibst du einen Rat", html: `
        <p>Du hast drei einfache Satzanfänge. Danach kommt das Verb <b>ohne -s</b>.</p>
        <table>
          <tr><th>Satzanfang</th><th>Rat</th></tr>
          <tr><td><span class="rot"><b>You should</b></span> (Du solltest)</td><td rowspan="3">talk to your teacher.<br>ask a friend.<br>go to bed early.</td></tr>
          <tr><td><span class="rot"><b>Why don't you</b></span> … ? (Warum nicht …?)</td></tr>
          <tr><td><span class="rot"><b>Try to</b></span> … (Versuche …)</td></tr>
        </table>
        <div class="bsp">You should <b>talk</b> to your teacher.<br>Why don't you <b>talk</b> to your teacher?<br>Try to <b>talk</b> to your teacher.</div>` },
      { t: "Merke: Gefühle", html: `
        <p>Mit <b>I am …</b> oder <b>She feels …</b> sagst du, wie du dich fühlst.</p>
        <div class="bsp"><span class="blau"><i>sad</i></span> (traurig) · <span class="blau"><i>angry</i></span> (wütend) · <span class="blau"><i>worried</i></span> (besorgt) · <span class="blau"><i>lonely</i></span> (einsam) · <span class="blau"><i>nervous</i></span> (aufgeregt) · <span class="blau"><i>tired</i></span> (müde)</div>` }
    ],
    basis: [
      { typ: "paare", davor: "Schritt 1 · Bilder und Gefühle", t: "Wie fühlen sie sich? Verbinde Bild und Gefühl.", tipp: "Schau auf das Gesicht und auf die Haltung.",
        paare: [["img:wb/happy.jpg", "happy"], ["img:wb/sad.jpg", "sad"], ["img:wb/angry.jpg", "angry"], ["img:wb/nervous.jpg", "nervous"], ["img:wb/lonely.jpg", "lonely"], ["img:wb/tired.jpg", "tired"]] },
      { typ: "paare", davor: "Schritt 2 · Gefühle", t: "Welches Gefühl passt zu welchem deutschen Wort?",
        tipp: "Fang mit den Wörtern an, die du sicher weißt.",
        paare: [["sad", "traurig"], ["angry", "wütend"], ["worried", "besorgt"], ["lonely", "einsam"], ["nervous", "aufgeregt"], ["tired", "müde"], ["fed up", "die Nase voll haben"]] },
      { typ: "zuordnen", davor: "Schritt 3 · Rat oder Gefühl?", t: "Ist der Satz ein Rat oder sagt er ein Gefühl?",
        tipp: "Ein Rat beginnt mit You should, Why don't you oder Try to.",
        gruppen: ["💡 Rat", "😞 Gefühl"],
        karten: [["You should ask a friend.", 0], ["Why don't you call her?", 0], ["Try to sleep more.", 0], ["I am tired.", 1], ["She feels lonely.", 1], ["My brother is angry.", 1]] },
      { typ: "wahl", davor: "Schritt 4 · Der passende Rat", t: "Welcher Rat passt zum Problem?", mischen: true,
        tipp: "Denke daran, was dem Freund wirklich hilft.",
        items: [
          { s: "„I have a headache.“", o: ["Why don't you drink some water?", "Why don't you run ten miles?"], a: 0, e: "Wasser trinken kann bei Kopfschmerzen helfen." },
          { s: "„I feel lonely at my new school.“", o: ["Try to talk to the other kids.", "Try to stay alone."], a: 0, e: "Mit anderen zu reden hilft gegen Einsamkeit." },
          { s: "„I am nervous about the test.“", o: ["You should learn a little every day.", "You should never learn."], a: 0, e: "Jeden Tag ein bisschen lernen macht sicherer." },
          { s: "„My friend is angry with me.“", o: ["Why don't you say sorry?", "Why don't you shout at her?"], a: 0, e: "Sich zu entschuldigen ist ein guter Rat." }
        ] },
      { typ: "bauen", davor: "Schritt 5 · Ratschläge bauen", t: "Baue einen Rat aus den Teilen der Tabelle.",
        tipp: "Satzanfang – Verb – Rest. Nach You should, Why don't you und Try to steht das Verb ohne -s.",
        info: "Beispiel: You should – talk to – your teacher. → You should talk to your teacher.",
        items: [{ teile: ["You should", "go to", "bed early."] }, { teile: ["Why don't you", "ask", "a friend?"] }, { teile: ["Try to", "sleep", "more."] }] },
      { typ: "luecke", davor: "Schritt 6 · Wörter ergänzen", t: "Setze das passende Wort aus dem Kasten ein.",
        tipp: "should = du solltest · shouldn't = du solltest nicht · Why = warum · Try = versuche",
        info: "Wortkasten: should · shouldn't · Why · Try",
        items: [
          "You are tired. You [[should]] go to bed early.",
          "You have a bad tooth. You [[shouldn't]] eat sweets.",
          "[[Why]] don't you ask your teacher for help?",
          "[[Try]] to be kind to the new girl."
        ] },
      { typ: "luecke", davor: "Schritt 7 · Jetzt du", t: "Ergänze das Gefühl. Der erste Buchstabe hilft dir.",
        tipp: "Was fühlt die Person? Der Buchstabe und die deutsche Hilfe zeigen dir das Wort.",
        info: "Beispiel: Mia has no friends here. She feels lonely.",
        items: [
          "Aylin has no friends in the new class. She feels [[lonely]]. (l… = einsam)",
          "Omar's football team lost. He is [[sad]]. (s… = traurig)",
          "Elif has a big test tomorrow. She is [[nervous]]. (n… = aufgeregt)",
          "Luca's brother broke his phone. Luca is [[angry]]. (a… = wütend)"
        ] }
    ],
    plus: [
      { typ: "frei", t: "Dein Freund ist traurig, weil er keinen Partner für das Projekt hat. Schreibe einen Rat.",
        tipp: "Fang so an: You should … / Why don't you … ? / Try to …",
        items: [{ f: "Dein Rat", kriterien: ["ein vollständiger englischer Satz", "mit You should, Why don't you oder Try to"],
                  muster: "\\b(you should|why don't you|why don’t you|try to)\\b", bsp: "Why don't you ask Ida to work with you?" }] },
      { typ: "umformen", t: "Schreibe den Rat mit „Why don't you …?“.",
        tipp: "You should talk … → Why don't you talk … ? Vergiss das Fragezeichen nicht.",
        items: [{ s: "You should talk to your teacher.", l: ["Why don't you talk to your teacher?"] }, { s: "You should go to bed early.", l: ["Why don't you go to bed early?"] }] }
    ]
  });
  </script>
