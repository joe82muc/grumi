  <script>
  E7Seite(3, "w");
  Grammatik.seite({
    nr: 2, lsNr: 2, modul: "e7-u3-w2", kurz: "WB2",
    titel: "Giving advice",
    lead: "Ein Freund hat ein Problem – was sagst du? Hier lernst du Ratschläge, Reaktionen, Gefühle und tröstende Worte, zum Beispiel „**Why don't you ask your teacher?**“",
    ziele: ["Du gibst einen Ratschlag auf Englisch.", "Du reagierst auf einen Ratschlag.", "Du sagst, wie du dich fühlst, und tröstest andere."],
    merk: [
      { t: "Bildwörter: Feelings", breit: true, html: E7Seite.bilder([["happy","happy","glücklich"],
          ["sad","sad","traurig"],
          ["angry","angry","wütend"],
          ["nervous","nervous","nervös"],
          ["lonely","lonely","einsam"],
          ["proud","proud","stolz"],
          ["tired","tired","müde"],
          ["shy","shy","schüchtern"],
          ["stressed","stressed","gestresst"]]) },
      { t: "Giving advice", html: `<ul class="wb-liste">
        <li><b>You should …</b><span>Du solltest …</span></li><li><b>You shouldn't …</b><span>Du solltest nicht …</span></li><li><b>Why don't you …?</b><span>Warum nicht …? Wie wäre es, wenn du …?</span></li>
        <li><b>How about …ing?</b><span>Wie wäre es mit …?</span></li><li><b>Try to …</b><span>Versuch zu …</span></li><li><b>It's a good idea to …</b><span>Es ist eine gute Idee, zu …</span></li>
        <li><b>You could …</b><span>Du könntest …</span></li><li><b>My advice is to …</b><span>Ich rate dir, zu …</span></li><li><b>Don't forget to …</b><span>Vergiss nicht, zu …</span></li></ul>` },
      { t: "Problems", html: `<ul class="wb-liste">
        <li><b>problem</b><span>Problem</span></li><li><b>worry</b><span>sich Sorgen machen</span></li><li><b>mistake</b><span>Fehler</span></li>
        <li><b>bad mark</b><span>schlechte Note</span></li><li><b>fail a test</b><span>bei einem Test durchfallen</span></li><li><b>get into trouble</b><span>Ärger bekommen</span></li>
        <li><b>get enough sleep</b><span>genug Schlaf bekommen</span></li><li><b>argument</b><span>Streit</span></li></ul>` },
      { t: "Reacting to advice", html: `<ul class="wb-liste">
        <li><b>Good idea!</b><span>Gute Idee!</span></li><li><b>That's a great idea.</b><span>Das ist eine tolle Idee.</span></li><li><b>Thanks, that helps.</b><span>Danke, das hilft.</span></li>
        <li><b>I'll try that.</b><span>Das probiere ich aus.</span></li><li><b>I'm not sure about that.</b><span>Da bin ich nicht sicher.</span></li><li><b>That won't work.</b><span>Das funktioniert nicht.</span></li>
        <li><b>I don't think so.</b><span>Das glaube ich nicht.</span></li><li><b>I've already tried that.</b><span>Das habe ich schon versucht.</span></li></ul>` },
      { t: "Feelings", html: `<ul class="wb-liste">
        <li><b>nervous</b><span>nervös</span></li><li><b>worried</b><span>besorgt</span></li><li><b>lonely</b><span>einsam</span></li>
        <li><b>upset</b><span>aufgebracht, traurig</span></li><li><b>embarrassed</b><span>verlegen</span></li><li><b>jealous</b><span>eifersüchtig, neidisch</span></li>
        <li><b>stressed</b><span>gestresst</span></li><li><b>disappointed</b><span>enttäuscht</span></li><li><b>confused</b><span>verwirrt</span></li>
        <li><b>proud</b><span>stolz</span></li><li><b>shy</b><span>schüchtern</span></li><li><b>homesick</b><span>voller Heimweh</span></li></ul>` },
      { t: "Comforting someone", html: `<ul class="wb-liste">
        <li><b>Don't worry.</b><span>Mach dir keine Sorgen.</span></li><li><b>Cheer up!</b><span>Kopf hoch!</span></li><li><b>It's not your fault.</b><span>Das ist nicht deine Schuld.</span></li>
        <li><b>I'm sorry to hear that.</b><span>Das tut mir leid.</span></li><li><b>Everything will be fine.</b><span>Alles wird gut.</span></li><li><b>I'm here for you.</b><span>Ich bin für dich da.</span></li>
        <li><b>Take your time.</b><span>Lass dir Zeit.</span></li><li><b>You're not alone.</b><span>Du bist nicht allein.</span></li></ul>` },
      { t: "Einen Rat richtig bilden", html: `
        <div class="bsp"><b>You should</b> talk to your teacher. · <b>You shouldn't</b> worry so much. · <b>Why don't you</b> ask Mia? · <b>You could</b> join a club.</div>
        <p>Nach <b>should</b>, <b>shouldn't</b>, <b>could</b> und <b>Why don't you</b> steht das Verb in der Grundform, ohne „to“.</p>
        <div class="bsp"><b>How about</b> writing a message? · <b>Try to</b> stay calm. · <b>It's a good idea to</b> make a plan.</div>
        <p>Nach <b>How about</b> kommt das Verb mit <b>-ing</b>. Nach <b>Try to</b> und <b>It's a good idea to</b> steht <b>to</b> mit der Grundform. Alle Wörter übst du im <a href="../vokabular/wordbank-giving-advice.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "Nach **should** steht **kein to**: You should **go** to bed. Nicht: ~~You should to go to bed.~~",
      "Nach **How about** steht das Verb mit **-ing**: How about **writing** a message? Nicht: ~~How about write a message?~~",
      "**worried** = besorgt (du), **worry** = sich Sorgen machen: Don't **worry**! Nicht: ~~Don't worried.~~"
    ],
    basis: [
      { typ: "paare", t: "Wie fühlen sie sich? Verbinde Bild und Gefühl.", tipp: "Schau auf das Gesicht und auf die Haltung.",
        paare: [["img:wb/happy.jpg", "happy"], ["img:wb/sad.jpg", "sad"], ["img:wb/angry.jpg", "angry"], ["img:wb/nervous.jpg", "nervous"], ["img:wb/lonely.jpg", "lonely"], ["img:wb/proud.jpg", "proud"], ["img:wb/tired.jpg", "tired"], ["img:wb/shy.jpg", "shy"]] },
      { typ: "paare", t: "Verbinde das Gefühl mit der deutschen Bedeutung.", tipp: "Schau oben bei „Feelings“ nach, wenn du unsicher bist.",
        paare: [["nervous", "nervös"], ["lonely", "einsam"], ["jealous", "eifersüchtig"], ["embarrassed", "verlegen"], ["disappointed", "enttäuscht"], ["proud", "stolz"], ["confused", "verwirrt"], ["shy", "schüchtern"]] },
      { typ: "wahl", t: "Wie fühlt sich die Person? Wähle das passende Gefühl.", mischen: true, tipp: "Stell dir die Situation vor: Was würdest du fühlen?",
        items: [
          { f: "Lotta has to speak in front of the whole school tomorrow. She feels …", o: ["nervous", "proud", "jealous"], a: 0 },
          { f: "Nobody sits with Carla at lunch on her first day. She feels …", o: ["lonely", "confused", "proud"], a: 0 },
          { f: "Luca hoped to win the final, but his team lost. He feels …", o: ["shy", "disappointed", "jealous"], a: 1 },
          { f: "Jonas falls over in front of the whole class. He feels …", o: ["embarrassed", "proud", "lonely"], a: 0 },
          { f: "Sofia gets the best mark in the class. She feels …", o: ["upset", "proud", "worried"], a: 1 }
        ] },
      { typ: "zuordnen", t: "Ratschlag oder Reaktion? Sortiere die Sätze.", gruppen: ["Ratschlag geben", "Auf einen Ratschlag reagieren"], tipp: "Ein Ratschlag sagt, was jemand tun soll. Eine Reaktion antwortet darauf.",
        karten: [["You should talk to your teacher.", 0], ["Why don't you ask a friend?", 0], ["How about writing a list?", 0], ["Try to go to bed earlier.", 0], ["Thanks, that helps.", 1], ["I've already tried that.", 1], ["That's a great idea.", 1], ["I'm not sure about that.", 1]] },
      { typ: "luecke", t: "Ergänze das passende Wort.", tipp: "Die Wörter stehen oben im Merkwissen „Problems“ und „Comforting someone“.",
        items: ["I have a [[problem]]. I got a bad mark in my test.", "Don't [[worry]]. Everybody makes [[mistakes]].", "Cheer [[up]]! Tomorrow will be better.", "It's not your [[fault]]. Nobody told you.", "I'm sorry to [[hear]] that."] },
      { typ: "luecke", t: "Welche Form ist richtig? Wähle.", tipp: "Nach should und Why don't you: Grundform. Nach How about: -ing. Nach It's a good idea: to.",
        items: ["You should {{go|to go|going}} to bed earlier.", "Why don't you {{ask|to ask|asking}} your teacher?", "How about {{writing|write|to write}} him a message?", "It's a good idea {{to make|make|making}} a plan.", "You shouldn't {{worry|to worry|worrying}} too much."] },
      { typ: "bauen", t: "Baue die Ratschläge.", tipp: "Achte auf das Satzzeichen am Ende.",
        items: [{ teile: ["You should", "talk to", "your", "teacher."] }, { teile: ["Why don't you", "ask", "Mia", "for help?"] },
                { teile: ["It's a good idea", "to go", "to bed", "early."] }, { teile: ["How about", "joining", "the school", "choir?"] }] },
      { typ: "markieren", t: "Markiere in jedem Text den Ratschlag.", stiftName: "Ratschlag", tipp: "Der Ratschlag beginnt mit einer Wendung wie You should, Why don't you oder Try to.",
        items: ["I'm so nervous about the test. [You should read your notes once more.] Then you'll feel better.", "Omar is lonely. Mia says: [Why don't you join the football team?] You can make new friends there.",
                "I can't sleep. [Try to put your phone away an hour before bed.] It really helps."] },
      { typ: "wahl", t: "Welcher Rat passt zum Problem? Wähle.", mischen: true, tipp: "Lies das Problem und frag dich: Was würde wirklich helfen?",
        items: [
          { f: "I have a headache and I feel tired.", o: ["You should drink some water and rest.", "You should run ten kilometres.", "You should watch a scary film."], a: 0 },
          { f: "I had an argument with my best friend.", o: ["Why don't you talk to her and say sorry?", "Why don't you ignore her for a month?", "Why don't you tell everybody her secret?"], a: 0 },
          { f: "I'm too shy to speak in class.", o: ["Try to say one small thing each lesson.", "Try to sleep in class.", "Try to stay away from school."], a: 0 },
          { f: "I forgot my homework again and my teacher is angry.", o: ["It's a good idea to write your homework in a notebook.", "It's a good idea to forget it every day.", "It's a good idea to lie to your teacher."], a: 0 }
        ] },
      { typ: "frei", t: "Ein Freund sagt: „I'm nervous before the test.“ Gib ihm einen Rat und tröste ihn.", tipp: ["Rat: You should … / Why don't you …? / Try to …", "Trost: Don't worry. / Everything will be fine. / I'm here for you."],
        items: [{ f: "Dein Ratschlag", kriterien: ["ein vollständiger englischer Satz", "You should / Why don't you / Try to / How about + passendes Verb"], muster: "\\b(you\\s+should|you\\s+could|why\\s+don't\\s+you|try\\s+to|how\\s+about|it's\\s+a\\s+good\\s+idea)\\b", bsp: "You should read your notes again, and then you should go to bed early." },
                { f: "Dein tröstender Satz", kriterien: ["ein vollständiger englischer Satz", "eine Wendung zum Trösten"], muster: "\\b(don't\\s+worry|cheer\\s+up|everything\\s+will|i'm\\s+here|you're\\s+not\\s+alone|take\\s+your\\s+time|not\\s+your\\s+fault)\\b", bsp: "Don't worry, everything will be fine." }] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Chat: Ergänze die Lücken.", tipp: ["Die Wendungen stehen im Merkwissen.", "Lies zuerst den ganzen Chat."],
        items: ["Omar: I'm so [[worried|nervous|stressed]] about the maths test on Friday.", "Mia: Don't [[worry]]! Why don't you [[study|learn|practise|practice|revise]] with me after school?",
                "Omar: That's a [[great|good]] idea, thanks. But I always [[get|have]] bad marks in maths.", "Mia: It's [[not]] your fault. You should [[ask]] the teacher to explain it again.",
                "Omar: Good idea! I'll [[try]] that."] },
      { typ: "zuordnen", t: "Positive oder negative Reaktion? Sortiere.", gruppen: ["positiv", "negativ"], tipp: "Positiv: Du nimmst den Rat an. Negativ: Du lehnst ihn ab oder zweifelst.",
        karten: [["Good idea!", 0], ["I'll try that.", 0], ["Thanks, that helps.", 0], ["That's a great idea.", 0], ["That won't work.", 1], ["I don't think so.", 1], ["I'm not sure about that.", 1], ["I've already tried that.", 1]] },
      { typ: "frei", t: "Eine Freundin ist neu an der Schule und fühlt sich einsam. Schreibe ihr zwei bis drei Sätze.", tipp: ["Sage, wie du dich fühlen würdest, oder tröste sie: I'm sorry to hear that. / You're not alone.", "Gib einen oder zwei Ratschläge: Why don't you …? / You could … / How about …ing?"],
        items: [{ f: "Deine kleine Nachricht", kriterien: ["mindestens zwei vollständige englische Sätze", "mindestens ein Ratschlag", "ein tröstender Satz oder ein Gefühl"],
                  muster: "\\b(you\\s+should|you\\s+could|why\\s+don't\\s+you|try\\s+to|how\\s+about)\\b", bsp: "I'm sorry to hear that. Why don't you ask Lotta to eat lunch with you? You could also join a club." }] }
    ]
  });
  </script>
