  <script>
  E7Seite(3, "w");
  Grammatik.seite({
    nr: 3, lsNr: 3, modul: "e7-u3-w3", kurz: "WB3",
    titel: "Picture description",
    lead: "Was siehst du auf dem Bild – und wo? Hier lernst du Bildteile, Präpositionen und Wendungen zum Beschreiben und Vermuten, zum Beispiel „**In the foreground a girl is feeding the ducks.**“",
    ziele: ["Du sagst, wo etwas im Bild ist.", "Du beschreibst mit There is/There are und I can see …, was die Leute tun.", "Du sagst mit Maybe … und I think …, was vielleicht los ist."],
    merk: [
      { t: "Bildwörter: Prepositions of place", breit: true, html: E7Seite.bilder([["in","in","in"],
          ["on","on","auf"],
          ["under","under","unter"],
          ["behind","behind","hinter"],
          ["in-front-of","in front of","vor"],
          ["next-to","next to","neben"],
          ["between","between","zwischen"],
          ["above","above","über"]]) },
      { t: "Bildwörter: Things in a picture", breit: true, html: E7Seite.bilder([["umbrella","umbrella","Regenschirm"],
          ["bench","bench","Bank"],
          ["fence","fence","Zaun"],
          ["path","path","Pfad, Fußweg"],
          ["stall","stall","Marktstand"]]) },
      { t: "Where in the picture?", html: `<ul class="wb-liste">
        <li><b>in the foreground</b><span>im Vordergrund</span></li><li><b>in the background</b><span>im Hintergrund</span></li><li><b>in the middle</b><span>in der Mitte</span></li>
        <li><b>in the centre</b><span>im Zentrum</span></li><li><b>on the left</b><span>links</span></li><li><b>on the right</b><span>rechts</span></li>
        <li><b>at the top</b><span>oben</span></li><li><b>at the bottom</b><span>unten</span></li><li><b>in the top left corner</b><span>in der linken oberen Ecke</span></li></ul>` },
      { t: "Prepositions of place", html: `<ul class="wb-liste">
        <li><b>next to</b><span>neben</span></li><li><b>beside</b><span>neben, an der Seite von</span></li><li><b>between</b><span>zwischen</span></li>
        <li><b>behind</b><span>hinter</span></li><li><b>in front of</b><span>vor</span></li><li><b>opposite</b><span>gegenüber</span></li>
        <li><b>under</b><span>unter</span></li><li><b>above</b><span>über, oberhalb von</span></li><li><b>on top of</b><span>oben auf</span></li>
        <li><b>near</b><span>nahe bei</span></li><li><b>inside</b><span>drinnen, im Inneren von</span></li><li><b>outside</b><span>draußen</span></li></ul>` },
      { t: "Describing", html: `<ul class="wb-liste">
        <li><b>There is …</b><span>Da ist … (eine Sache)</span></li><li><b>There are …</b><span>Da sind … (mehrere Sachen)</span></li><li><b>I can see …</b><span>Ich kann … sehen.</span></li>
        <li><b>The picture shows …</b><span>Das Bild zeigt …</span></li><li><b>This photo was taken …</b><span>Dieses Foto wurde … aufgenommen.</span></li><li><b>The man is …ing</b><span>Der Mann …t gerade …</span></li>
        <li><b>She is wearing …</b><span>Sie trägt …</span></li><li><b>He is holding …</b><span>Er hält … in der Hand.</span></li><li><b>They are talking to each other.</b><span>Sie sprechen miteinander.</span></li></ul>` },
      { t: "Guessing", html: `<ul class="wb-liste">
        <li><b>Maybe …</b><span>Vielleicht …</span></li><li><b>Perhaps …</b><span>Vielleicht …</span></li><li><b>I think …</b><span>Ich glaube, …</span></li>
        <li><b>I guess …</b><span>Ich schätze, …</span></li><li><b>It looks like …</b><span>Es sieht aus wie …</span></li><li><b>It looks as if …</b><span>Es sieht so aus, als ob …</span></li>
        <li><b>He seems to be …</b><span>Er scheint … zu sein.</span></li><li><b>They might be …</b><span>Sie könnten … sein.</span></li></ul>` },
      { t: "Things in a picture", html: `<ul class="wb-liste">
        <li><b>crowd</b><span>Menschenmenge</span></li><li><b>stall</b><span>Marktstand</span></li><li><b>bench</b><span>Bank</span></li>
        <li><b>fence</b><span>Zaun</span></li><li><b>sign</b><span>Schild</span></li><li><b>building</b><span>Gebäude</span></li>
        <li><b>path</b><span>Pfad, Fußweg</span></li><li><b>umbrella</b><span>Regenschirm</span></li></ul>` },
      { t: "Ein Bild Schritt für Schritt beschreiben", html: `
        <div class="bsp"><b>The picture shows</b> a park. <b>In the foreground</b> there is a boy. <b>On the left</b> there are two benches. <b>In the background</b> you can see a café.</div>
        <p>Erst sagst du, was das Bild zeigt. Dann gehst du von vorn nach hinten oder von links nach rechts vor.</p>
        <div class="bsp">The boy <b>is riding</b> a bike. · Two girls <b>are sitting</b> <b>next to</b> the pond. · <b>Maybe</b> they <b>are</b> friends.</div>
        <p>Was die Leute gerade tun, sagst du mit <b>is/are + Verb mit -ing</b>. Bei einer Sache steht <b>There is</b>, bei mehreren <b>There are</b>. Alle Wörter übst du im <a href="../vokabular/wordbank-picture-description.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**There is** bei einer Sache, **There are** bei mehreren: There **are** three bikes. Nicht: ~~There is three bikes.~~",
      "Was gerade passiert, braucht **is/are + -ing**: The man **is carrying** a box. Nicht: ~~The man carry a box.~~",
      "Im Vordergrund heißt **in** the foreground, links heißt **on** the left. Nicht: ~~on the foreground~~, ~~in the left~~."
    ],
    basis: [
      { typ: "paare", t: "Wo ist die Katze? Verbinde Bild und Wort.", tipp: "Schau, wo die Katze im Verhältnis zur Kiste oder zum Tisch ist.",
        paare: [["img:wb/in.jpg", "in"], ["img:wb/on.jpg", "on"], ["img:wb/under.jpg", "under"], ["img:wb/behind.jpg", "behind"], ["img:wb/in-front-of.jpg", "in front of"], ["img:wb/next-to.jpg", "next to"], ["img:wb/between.jpg", "between"], ["img:wb/above.jpg", "above"]] },
      { typ: "paare", t: "Was ist auf dem Bild? Verbinde Bild und Wort.", tipp: "Fang mit den Wörtern an, die du sicher weißt.",
        paare: [["img:wb/umbrella.jpg", "umbrella"], ["img:wb/bench.jpg", "bench"], ["img:wb/fence.jpg", "fence"], ["img:wb/path.jpg", "path"], ["img:wb/stall.jpg", "stall"]] },
      { typ: "paare", t: "Verbinde die Präposition mit der deutschen Bedeutung.", tipp: "Schau oben bei „Prepositions of place“ nach.",
        paare: [["next to", "neben"], ["between", "zwischen"], ["behind", "hinter"], ["in front of", "vor"], ["opposite", "gegenüber"], ["under", "unter"], ["above", "über (oberhalb)"], ["on top of", "oben auf"]] },
      { typ: "wahl", t: "Das Bild zeigt es so. Welcher englische Satz passt?", mischen: true, tipp: "Denk an das Bild: Wo ist die Sache im Verhältnis zur anderen?",
        items: [
          { f: "Der Hund liegt unter dem Tisch.", o: ["The dog is under the table.", "The dog is above the table.", "The dog is behind the table."], a: 0 },
          { f: "Der Ball liegt zwischen den zwei Kisten.", o: ["The ball is next to the boxes.", "The ball is between the two boxes.", "The ball is opposite the boxes."], a: 1 },
          { f: "Das Café ist auf der anderen Straßenseite, genau gegenüber der Schule.", o: ["The café is opposite the school.", "The café is inside the school.", "The café is on top of the school."], a: 0 },
          { f: "Ein Vogel fliegt hoch über den Dächern.", o: ["A bird is under the roofs.", "A bird is above the roofs.", "A bird is between the roofs."], a: 1 },
          { f: "Das Mädchen steht direkt vor dem Laden.", o: ["The girl is behind the shop.", "The girl is in front of the shop.", "The girl is near the shop."], a: 1 }
        ] },
      { typ: "zuordnen", t: "Wo im Bild oder Präposition? Sortiere.", gruppen: ["Ort im Bild", "Präposition"], tipp: "„In the foreground“ sagt, wo im ganzen Bild. „Next to“ sagt, wo etwas im Verhältnis zu etwas anderem ist.",
        karten: [["in the foreground", 0], ["in the background", 0], ["on the left", 0], ["in the middle", 0], ["at the top", 0], ["next to", 1], ["between", 1], ["opposite", 1], ["behind", 1], ["above", 1]] },
      { typ: "luecke", t: "Ergänze das passende Wort.", tipp: "Die Wörter stehen oben im Merkwissen „Describing“.",
        items: ["There [[is]] a dog in the park.", "There [[are]] two children on the bench.", "I can [[see]] a man with an umbrella.", "The picture [[shows]] a busy street.", "In the [[background]], far away, you can see some mountains."] },
      { typ: "luecke", t: "Was machen die Leute gerade? Wähle die richtige Form.", tipp: "Was in diesem Moment auf dem Bild passiert, braucht is/are + Verb mit -ing.",
        items: ["Look at the picture! The boy {{is eating|eats|is eat}} an ice cream.", "Two girls {{are talking|is talking|talks}} to each other.", "In the picture she {{is wearing|wears|are wearing}} a red hat.", "The children {{are playing|plays|is playing}} with a ball.", "The man {{is holding|hold|holding}} a map."] },
      { typ: "bauen", t: "Baue die Sätze.", tipp: "Achte auf das Satzzeichen am Ende.",
        items: [{ teile: ["In the foreground", "a girl", "is feeding", "the ducks."], l: ["A girl is feeding the ducks in the foreground."] }, { teile: ["The bench", "is", "between", "two trees."] },
                { teile: ["There are", "three bikes", "in front of", "the shop."] }, { teile: ["A man", "is sitting", "next to", "the fountain."], l: ["Next to the fountain a man is sitting."] }] },
      { typ: "markieren", t: "Markiere in jedem Satz alle Präpositionen des Ortes.", stiftName: "Präposition", tipp: "Die Wörter stehen oben bei „Prepositions of place“.",
        items: ["The cat is [under] the table.", "The bike is [next to] the wall and the dog is [behind] it.", "A child is hiding [behind] the tree [in front of] the house."] },
      { typ: "wahl", t: "Du bist nicht sicher, was auf dem Bild los ist. Welcher Satz passt?", mischen: true, tipp: "Wenn du nur vermutest, brauchst du Wörter wie maybe, perhaps, I think, might.",
        items: [
          { f: "Zwei Jungen sehen gleich aus. Du vermutest, dass sie Brüder sind.", o: ["Maybe they are brothers.", "They are brothers for sure.", "They are definitely brothers."], a: 0 },
          { f: "Viele Leute stehen mit Tüten an einem Platz. Du vermutest einen Markttag.", o: ["It is a market day.", "It looks like a market day.", "I know it is a market day."], a: 1 },
          { f: "Die Frau lacht. Du glaubst, dass sie froh ist.", o: ["I think she is happy.", "She is happy because I say so.", "She was happy yesterday."], a: 0 },
          { f: "Der Himmel ist dunkel. Du schätzt, dass es bald regnet.", o: ["It rains.", "It looks as if it is going to rain.", "It rained."], a: 1 }
        ] },
      { typ: "frei", t: "Beschreibe etwas in deinem Klassenzimmer und rate etwas. Schreibe zwei Sätze.", tipp: ["Satz 1: There is/There are … + eine Präposition (next to, behind, between …)", "Satz 2: Maybe … / I think … / It looks like …"],
        items: [{ f: "Dein Satz mit There is/are und einer Präposition", kriterien: ["ein vollständiger englischer Satz", "There is/There are + Präposition des Ortes"], muster: "\\bthere\\s+(is|are)\\b.*\\b(next to|beside|between|behind|in front of|opposite|under|above|near|on top of)\\b", bsp: "There is a plant next to the window." },
                { f: "Dein Satz mit Maybe, Perhaps oder I think", kriterien: ["ein vollständiger englischer Satz", "eine Vermutung"], muster: "\\b(maybe|perhaps|i\\s+think|i\\s+guess|it\\s+looks\\s+like|might)\\b", bsp: "I think my classmates are happy because it is Friday." }] }
    ],
    plus: [
      { typ: "luecke", t: "Eine Bildbeschreibung: Ergänze die Wörter aus dem Kasten.", info: "Wörter: shows · foreground · opposite · Maybe · think", tipp: ["Jedes Wort aus dem Kasten passt genau einmal.", "Lies zuerst alle Sätze."],
        items: ["The picture [[shows]] a park in autumn.", "The boy is very big in the picture, so he is in the [[foreground]].", "The café is on the other side of the path, [[opposite]] the pond.",
                "[[Maybe|Perhaps]] it is Sunday because there are many families.", "I [[think]] the people are happy because they are smiling."] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true, tipp: "Achte auf There is/There are, auf -ing und auf die Präposition.",
        items: [
          { f: "Welcher Satz ist richtig?", o: ["There are two dogs next to the bench.", "There is two dogs next to the bench.", "There are two dogs next of the bench."], a: 0, e: "Zwei Hunde sind mehrere: There are. Und es heißt next to." },
          { f: "Welcher Satz ist richtig?", o: ["The girl is wearing a hat.", "The girl is wear a hat.", "The girl wearing a hat."], a: 0, e: "is + wearing: is/are + Verb mit -ing." },
          { f: "Welcher Satz ist richtig?", o: ["In the background there is a church.", "On the background there is a church.", "At the background there is a church."], a: 0, e: "Es heißt in the background (und in the foreground)." },
          { f: "Welcher Satz ist richtig?", o: ["The man is sitting between two women.", "The man is sitting between of two women.", "The man sitting between two women."], a: 0, e: "Nach between steht kein of, und vor sitting braucht es is." }
        ] },
      { typ: "frei", t: "Beschreibe ein Bild, das du im Kopf hast (zum Beispiel einen Spielplatz oder den Schulhof). Schreibe drei bis vier Sätze.", tipp: ["Beginne mit The picture shows … oder I can see …", "Sage, wo etwas ist: in the foreground, on the left, next to …", "Sage, was die Leute tun, und rate mit Maybe …"],
        items: [{ f: "Deine Bildbeschreibung", kriterien: ["mindestens drei vollständige englische Sätze", "There is/are oder I can see oder The picture shows", "mindestens eine Angabe, wo etwas im Bild ist"],
                  muster: "\\b(there\\s+is|there\\s+are|i\\s+can\\s+see|the\\s+picture\\s+shows)\\b", bsp: "The picture shows a school yard. In the foreground there are two boys who are playing football. On the left, a girl is sitting on a bench. Maybe she is waiting for her friend." }] }
    ]
  });
  </script>
