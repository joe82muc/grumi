  <title>Wordbank: Have you ever …? | Englisch 7</title>

  <script>
  E7Seite(2, "w");
  Grammatik.seite({
    nr: 3, lsNr: 3, modul: "e7-u2-w3", kurz: "WB3",
    titel: "Have you ever …?",
    lead: "Was hast du schon erlebt? Hier lernst du die 3. Formen wichtiger Verben, Fragen mit **ever**, Kurzantworten und Nachfragen – zum Beispiel „**Have you ever ridden a horse?**“",
    ziele: ["Du kennst die 3. Formen wichtiger Verben.", "Du fragst nach Erlebnissen und antwortest kurz.", "Du fragst nach: When was that? What was it like?"],
    merk: [
      { t: "Bildwörter: Have you ever …?", breit: true, html: E7Seite.bilder([["ridden-horse","ridden a horse","auf einem Pferd geritten"],
          ["flown-plane","flown in a plane","geflogen"],
          ["swum-sea","swum in the sea","im Meer geschwommen"],
          ["climbed-mountain","climbed a mountain","einen Berg bestiegen"],
          ["camped-tent","camped in a tent","im Zelt gezeltet"],
          ["seen-whale","seen a whale","einen Wal gesehen"],
          ["sung-stage","sung on a stage","auf einer Bühne gesungen"],
          ["won-medal","won a medal","eine Medaille gewonnen"],
          ["visited-castle","visited a castle","eine Burg besucht"]]) },
      { t: "Irregular 3rd forms (1)", html: `<ul class="wb-liste">
        <li><b>be – was/were – been</b><span>sein</span></li><li><b>go – went – gone</b><span>gehen, fahren</span></li><li><b>see – saw – seen</b><span>sehen</span></li>
        <li><b>eat – ate – eaten</b><span>essen</span></li><li><b>ride – rode – ridden</b><span>reiten, fahren</span></li><li><b>swim – swam – swum</b><span>schwimmen</span></li>
        <li><b>fly – flew – flown</b><span>fliegen</span></li></ul>` },
      { t: "Irregular 3rd forms (2)", html: `<ul class="wb-liste">
        <li><b>meet – met – met</b><span>treffen, kennenlernen</span></li><li><b>win – won – won</b><span>gewinnen</span></li><li><b>break – broke – broken</b><span>brechen, kaputt machen</span></li>
        <li><b>sing – sang – sung</b><span>singen</span></li><li><b>speak – spoke – spoken</b><span>sprechen</span></li><li><b>write – wrote – written</b><span>schreiben</span></li>
        <li><b>lose – lost – lost</b><span>verlieren</span></li></ul>` },
      { t: "Regular 3rd forms (-ed)", html: `<ul class="wb-liste">
        <li><b>climb – climbed</b><span>klettern, besteigen</span></li><li><b>try – tried</b><span>versuchen, ausprobieren</span></li><li><b>visit – visited</b><span>besuchen</span></li>
        <li><b>stay – stayed</b><span>bleiben, übernachten</span></li><li><b>camp – camped</b><span>zelten</span></li><li><b>travel – travelled</b><span>reisen</span></li></ul>
        <p>Bei <b>try</b> wird das y zu <b>-ied</b>; britisch schreibt man <b>travelled</b> mit zwei l.</p>` },
      { t: "Ever, never and co.", html: `<ul class="wb-liste">
        <li><b>ever</b><span>je, jemals, schon einmal</span></li><li><b>never</b><span>nie, niemals</span></li><li><b>once</b><span>einmal</span></li><li><b>twice</b><span>zweimal</span></li>
        <li><b>three times</b><span>dreimal</span></li><li><b>before</b><span>vorher, schon einmal</span></li><li><b>so far</b><span>bis jetzt</span></li><li><b>just</b><span>gerade eben</span></li></ul>` },
      { t: "Questions and short answers", html: `
        <div class="bsp"><b>Have</b> you <b>ever been</b> to Scotland? – Yes, I <b>have</b>. · <b>Have</b> you <b>ever flown</b>? – No, I <b>haven't</b>. · Have you ridden a horse? – No, <b>never</b>. · <b>Has</b> she <b>ever seen</b> a whale? – Yes, she <b>has</b>. · <b>Has</b> he <b>met</b> a film star? – No, he <b>hasn't</b>.</div>
        <p>Nach <b>have/has</b> steht die <b>3. Form</b>. <b>ever</b> steht in Fragen, <b>never</b> in Aussagen.</p>` },
      { t: "Asking for more", html: `
        <div class="bsp"><b>When was that?</b> · <b>Where was that?</b> · <b>What was it like?</b> · <b>Who did you go with?</b> · <b>How long did you stay?</b> · <b>What happened?</b> · It was <b>fantastic</b>!</div>
        <p>Bei der Nachfrage sprichst du über einen bestimmten Zeitpunkt – dann nimmst du das <b>simple past</b> (was, did, stayed). Die ganze Wortliste übst du im <a href="../vokabular/wordbank-have-you-ever.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**been** oder **gone**? Mia has **been** to Wales = sie war dort und ist zurück. Mia has **gone** to Wales = sie ist hingefahren und noch dort.",
      "**ever** in der Frage, **never** in der Aussage: Have you **ever** swum? – I have **never** swum. Nicht: ~~I haven't never swum.~~",
      "Bei der Nachfrage mit einer Zeit nimmst du das simple past: **When was that?** Nicht: ~~When have you been there?~~"
    ],
    basis: [
      { typ: "paare", t: "Was hast du schon erlebt? Verbinde Bild und Satzteil.", tipp: "Nach have/has steht die 3. Form: ridden, flown, swum …",
        paare: [["img:wb/ridden-horse.jpg", "ridden a horse"], ["img:wb/flown-plane.jpg", "flown in a plane"], ["img:wb/swum-sea.jpg", "swum in the sea"], ["img:wb/climbed-mountain.jpg", "climbed a mountain"], ["img:wb/camped-tent.jpg", "camped in a tent"], ["img:wb/seen-whale.jpg", "seen a whale"], ["img:wb/won-medal.jpg", "won a medal"], ["img:wb/visited-castle.jpg", "visited a castle"]] },
      { typ: "paare", t: "Verbinde die Grundform mit der 3. Form.", tipp: "Schau bei „Irregular 3rd forms“ nach, wenn du unsicher bist.",
        paare: [["to eat", "eaten"], ["to ride", "ridden"], ["to swim", "swum"], ["to fly", "flown"], ["to break", "broken"], ["to write", "written"], ["to speak", "spoken"], ["to sing", "sung"]] },
      { typ: "luecke", t: "Setze die 3. Form ein.", tipp: "Nach have/has steht die 3. Form. Das Verb in Klammern ist die Grundform.",
        items: ["Have you ever [[ridden]] a horse? (ride)", "Omar has [[flown]] to Spain twice. (fly)", "I have never [[swum]] in the sea. (swim)", "Lotta has [[written]] a letter to her penfriend. (write)",
                "We have [[won]] three matches this year. (win)", "Jonas has [[broken]] his arm. (break)"] },
      { typ: "luecke", t: "Setze die regelmäßige 3. Form ein.", tipp: "Regelmäßig: Grundform + -ed. Bei try wird das y zu -ied.",
        items: ["We have [[climbed]] a small hill. (climb)", "Have you ever [[tried]] sushi? (try)", "Elif has [[travelled|traveled]] to Munich by train. (travel)", "My family has [[camped]] near a lake. (camp)"] },
      { typ: "wahl", t: "been oder gone? Wähle.", tipp: "been = war dort und ist zurück. gone = ist hingefahren und noch dort.",
        items: [
          { f: "Mia isn't here. She has … to the shop.", o: ["been", "gone"], a: 1 },
          { f: "Hello again! I have just … to the shop.", o: ["gone", "been"], a: 1 },
          { f: "Have you ever … to Scotland?", o: ["been", "gone"], a: 0 },
          { f: "Where is Dad? He has … to work. He will be back at six.", o: ["been", "gone"], a: 1 }
        ] },
      { typ: "markieren", t: "Markiere in jedem Satz alle 3. Formen.", stiftName: "3. Form", tipp: "Die 3. Form steht nach have oder has.",
        items: ["Omar has [seen] a castle and [eaten] haggis.", "Ida has [ridden] a horse and [climbed] a hill.", "We have [met] a famous singer and [sung] a song with her."] },
      { typ: "bauen", t: "Baue die Sätze.", tipp: "Have/Has + Person + ever + 3. Form.",
        items: [{ teile: ["Have you ever", "been", "to", "Wales?"] }, { teile: ["She has", "never", "flown", "in a plane."] },
                { teile: ["Has", "your brother", "ever", "met", "a film star?"] }, { teile: ["Lotta has", "swum", "in the sea", "twice."], l: ["Lotta has swum twice in the sea."] }] },
      { typ: "wahl", t: "Welche Kurzantwort passt?", mischen: true, tipp: "Die Kurzantwort wiederholt have oder has.",
        items: [
          { s: "Has Omar ever climbed a mountain?", o: ["Yes, he has.", "Yes, he is.", "Yes, he did."], a: 0 },
          { s: "Have you ever met a famous person?", o: ["No, I don't.", "No, I haven't.", "No, I didn't."], a: 1 },
          { s: "Have they ever been to Scotland?", o: ["Yes, they are.", "Yes, they did.", "Yes, they have."], a: 2 },
          { s: "Has your sister ever won a prize?", o: ["No, she hasn't.", "No, she isn't.", "No, she hasn't never."], a: 0 }
        ] },
      { typ: "paare", t: "Welche Antwort passt zur Nachfrage? Verbinde.", tipp: "When = wann, Where = wo, Who = wer, How long = wie lange.",
        paare: [["When was that?", "Last summer."], ["Where was that?", "In Wales."], ["What was it like?", "It was fantastic!"], ["Who did you go with?", "With my cousins."], ["How long did you stay?", "For two nights."]] },
      { typ: "frei", t: "Frage und antworte.", tipp: ["Frage: Have you ever + 3. Form …?", "Antwort: Yes, I have. / No, I haven't. / No, never."],
        items: [{ f: "Deine Frage an einen Mitschüler", kriterien: ["eine vollständige englische Frage", "Have you ever + 3. Form"], muster: "\\bhave\\s+you\\s+ever\\s+[a-z]+", bsp: "Have you ever been to London?" },
                { f: "Deine Antwort auf: Have you ever ridden a camel?", kriterien: ["eine Kurzantwort mit have/haven't oder never"], muster: "\\b(yes,?\\s+i\\s+have|no,?\\s+i\\s+haven't|no,?\\s+never|no,?\\s+i\\s+have\\s+not)\\b", bsp: "No, I haven't." }] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Gespräch über Erlebnisse: Ergänze die Lücken.", tipp: ["Zuerst present perfect, bei der Nachfrage simple past.", "Lies den ganzen Dialog, bevor du schreibst."],
        items: ["Lotta: Have you ever [[been]] to Scotland?", "Omar: Yes, I [[have]]. My aunt lives there.", "Lotta: Really? [[When]] was that?", "Omar: Two years ago. We [[stayed]] in a small town for a week.",
                "Lotta: What was it [[like]]?", "Omar: It was [[fantastic|great|amazing|wonderful]]! I have [[never]] seen such beautiful mountains.", "Lotta: I have [[never]] been to Scotland. I'd like to go there!"] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true, tipp: "Mit einer genauen Zeitangabe (last summer, two years ago) nimmst du das simple past.",
        items: [
          { f: "Welcher Satz ist richtig?", o: ["I have ridden a horse in Wales last summer.", "I rode a horse in Wales last summer.", "I have rode a horse in Wales last summer."], a: 1, e: "Mit last summer steht das simple past." },
          { f: "Welcher Satz ist richtig?", o: ["Have you ever been to Wales?", "Did you ever be to Wales?", "Are you ever been to Wales?"], a: 0, e: "Have + you + ever + 3. Form." },
          { f: "Welcher Satz ist richtig?", o: ["We have never flown in a plane.", "We have never fly in a plane.", "We have flown never in a plane."], a: 0, e: "never steht zwischen have und der 3. Form." },
          { f: "Welche Nachfrage ist richtig?", o: ["When have you been there?", "When were you there?", "When you were there?"], a: 1, e: "Nachfrage mit Zeit: simple past." }
        ] },
      { typ: "frei", t: "Schreibe ein kleines Gespräch mit drei Zeilen.", tipp: ["Zeile 1: Have you ever …?", "Zeile 2: eine Kurzantwort", "Zeile 3: eine Nachfrage (When …? Where …? What was it like?)"],
        items: [{ f: "Dein Gespräch (A fragt, B antwortet, A fragt nach)", kriterien: ["eine Frage mit Have you ever + 3. Form", "eine Kurzantwort", "eine Nachfrage im simple past"],
                  muster: "have\\s+you\\s+ever\\s+[a-z]+[\\s\\S]*(yes,?\\s+i\\s+have|no,?\\s+i\\s+haven't|no,?\\s+never)[\\s\\S]*\\b(when|where|what|who|how long)\\b",
                  bsp: "A: Have you ever been to London? B: Yes, I have. A: When was that?" }] }
    ]
  });
  </script>
