  <title>Extra: going to Schritt für Schritt | Englisch 7</title>
  <meta name="description" content="Englisch 7, Unit 2: Kleine Extra-Übungen zum going to-future in leichten Schritten.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../../css/grammatik.css">
  <link rel="stylesheet" href="../../../../css/englisch-baukasten.css">

</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(2, "x");
  Grammatik.seite({
    nr: 1, lsNr: 1, modul: "e7-u2-x1", kurz: "X1",
    titel: "Extra: going to Schritt für Schritt",
    lead: "„We**'re going to hike** tomorrow.“ – Hier übst du das going to-future in kleinen Schritten.",
    ziele: ["Du wählst am, is oder are.", "Du setzt die Satzteile richtig zusammen.", "Du schreibst einen eigenen Plan."],
    merk: [
      { t: "Merke", html: `
        <p><b>am / is / are + going to + Grundform</b> – so sagst du, was du <b>vorhast</b>.</p>
        <div class="bsp"><b>I am</b> going to swim. · <b>She is</b> going to swim. · <b>We are</b> going to swim.</div>
        <p>I → <b>am</b> · he, she, it → <b>is</b> · you, we, they → <b>are</b></p>
        <p>Signalwörter: <span class="blau"><i>tomorrow, next week, soon</i></span></p>` }
    ],
    basis: [
      { typ: "wahl", davor: "Schritt 1 · am, is oder are?", t: "Welches Wort fehlt?", mischen: true, tipp: "I → am · he, she, it → is · you, we, they → are",
        items: [
          { s: "I ___ going to visit a castle.", o: ["am", "are"], a: 0, e: "I → am." },
          { s: "Mia ___ going to paddle a kayak.", o: ["is", "are"], a: 0, e: "Mia = she → is." },
          { s: "We ___ going to take the ferry.", o: ["are", "is"], a: 0, e: "we → are." },
          { s: "My brother ___ going to climb a hill.", o: ["is", "am"], a: 0, e: "my brother = he → is." },
          { s: "They ___ going to hike tomorrow.", o: ["are", "am"], a: 0, e: "they → are." }
        ] },
      { typ: "paare", davor: "Schritt 2 · Satzteile zuordnen", t: "Welcher Satzanfang passt zu welchem Ende?", tipp: "Lies beide Teile laut. Welches Ende ergibt einen Sinn?",
        paare: [["Tomorrow we're going to", "take the ferry."], ["Next weekend I'm going to", "go kayaking."], ["This evening she's going to", "pack her bag."], ["Soon they're going to", "visit a castle."]] },
      { typ: "luecke", t: "Setze die Form von going to ein.", tipp: "I → am going to · he, she, it → is going to · you, we, they → are going to",
        info: "Wortkasten: am going to · is going to · are going to (2×)",
        items: ["I [[am going to|'m going to]] hike in Wales tomorrow.", "Omar [[is going to|'s going to]] swim in the sea.", "We [[are going to|'re going to]] visit Scotland next summer.", "My parents [[are going to|'re going to]] take a boat to the island."] },
      { typ: "luecke", t: "Mit Anfangsbuchstaben: Ergänze das fehlende Verb.", tipp: "Nach going to steht das Verb in der Grundform (ohne -s).",
        info: "Beispiel: I'm going to h… (hike) → I'm going to hike.",
        items: ["We are going to [[visit]] a castle. (v…)", "She is going to [[take]] the ferry. (t…)", "I am going to [[pack]] my bag. (p…)"] },
      { typ: "bauen", t: "Ein Satzgerüst mit Beispiel: Baue den Satz.", tipp: "Beispiel: Paula – is – going to – hike – tomorrow. → Paula is going to hike tomorrow.",
        info: "Beispiel: Paula is going to hike tomorrow. Jetzt du: Person + am/is/are + going to + Verb.",
        items: [{ teile: ["Noah", "is", "going to", "paddle", "next week."] }, { teile: ["We", "are", "going to", "swim", "tomorrow."] }, { teile: ["I", "am", "going to", "visit", "my cousin."] }] },
      { typ: "luecke", t: "Jetzt du: Schreibe die ganze Form.", tipp: "am/is/are + going to + Verb. Kurzformen sind auch richtig.",
        items: ["Next summer we [[are going to visit|'re going to visit]] Scotland. (visit)", "Aylin [[is going to climb|'s going to climb]] a hill tomorrow. (climb)"] }
    ],
    plus: [
      { typ: "frei", t: "Schreibe einen Satz über deine Pläne.", tipp: "Fang so an: Tomorrow I'm going to …",
        items: [{ f: "Was hast du morgen vor?", kriterien: ["ein vollständiger englischer Satz", "am/is/are + going to + Grundform"],
                  muster: "\\b(am|['’]m|is|['’]s|are|['’]re)\\s+(not\\s+)?going to\\s+[a-z]+", bsp: "Tomorrow I'm going to play football with my friends." }] },
      { typ: "umformen", t: "Mache aus dem Satz eine Verneinung.", tipp: "not steht nach am, is oder are.",
        items: [{ s: "She is going to swim.", l: ["She isn't going to swim.", "She is not going to swim.", "She's not going to swim."] },
                { s: "We are going to hike.", l: ["We aren't going to hike.", "We are not going to hike.", "We're not going to hike."] }] }
    ]
  });
  </script>
</body>
</html>
