  <script>
  E7Seite(2, "x");
  Grammatik.seite({
    nr: 4, lsNr: 4, modul: "e7-u2-x4", kurz: "X4",
    titel: "Extra: Signalwörter erkennen",
    lead: "„I have **never** been to Wales.“ – Hier übst du in kleinen Schritten, an welchem Wort du die Zeitform erkennst.",
    ziele: ["Du findest das Signalwort im Satz.", "Du sortierst Signalwörter in zwei Gruppen.", "Du wählst die passende Form."],
    merk: [
      { t: "Zwei Gruppen", html: `
        <p><b>Present perfect</b> (ohne genaue Zeit): <span class="blau">ever, never, already, yet, just, before</span></p>
        <p><b>Simple past</b> (genaue Zeit): <span class="blau">yesterday, last week, two days ago, in 2024, on Sunday</span></p>
        <div class="bsp">I <b>have</b> <span class="blau">never</span> <b>been</b> there. – I <b>went</b> there <span class="blau">yesterday</span>.</div>` }
    ],
    basis: [
      { typ: "markieren", t: "Markiere das Signalwort.", info: "Beispiel: We went to the park [yesterday]. – Das Signalwort ist yesterday.", stiftName: "Signalwort", tipp: "Suche das Wort, das etwas über die Zeit sagt.",
        items: ["We went to the park [yesterday].", "I have [never] seen a seal.", "She visited her aunt [last week].", "Has he finished [yet]?", "They have [already] eaten."] },
      { typ: "zuordnen", t: "Sortiere die Signalwörter.", tipp: "Sagt das Wort genau, wann? Dann simple past.",
        gruppen: ["present perfect", "simple past"],
        karten: [["never", 0], ["ever", 0], ["yet", 0], ["already", 0], ["yesterday", 1], ["last week", 1], ["two days ago", 1], ["in 2024", 1]] },
      { typ: "luecke", t: "Wähle die richtige Form. Das Signalwort ist hervorgehoben.", info: "Beispiel: **Yesterday** I (played / have played) football. → played (yesterday = genaue Zeit)", tipp: "yesterday, last week, ago → simple past · ever, never, already, yet → present perfect",
        items: ["We {{went|have been}} to the lake **last summer**.", "I {{have never eaten|ate never}} snails – **never**!", "She {{saw|has seen}} a film **yesterday**.", "Have you {{ever|yesterday}} been to Scotland?", "They {{visited|have visited}} us **two days ago**."] },
      { typ: "wahl", t: "Welcher Satz passt? Achte auf das Signalwort.", mischen: true, tipp: "Eine genaue Zeit steht da? Dann ist es simple past.",
        items: [
          { s: "Mia ___ her room yesterday.", o: ["cleaned", "has cleaned"], a: 0, e: "yesterday → simple past: cleaned." },
          { s: "I ___ never been to Wales.", o: ["have", "did"], a: 0, e: "never → present perfect: have never been." },
          { s: "Has Omar finished his homework ___?", o: ["yet", "last week"], a: 0, e: "In der Frage passt yet (schon)." }
        ] },
      { typ: "luecke", t: "Schreibe die Form in die Lücke.", tipp: ["Genaue Zeit → simple past", "Ohne genaue Zeit → present perfect: have/has + 3. Form"],
        items: ["Last Sunday we [[went]] to the sea. (go)", "I [[have never seen|'ve never seen]] a whale. (never / see)"] }
    ],
    plus: [
      { typ: "luecke", t: "Noch mehr üben: Wähle das Signalwort.", tipp: "Ein Signalwort für die genaue Zeit oder eines für die Zeit bis jetzt?",
        items: ["Have you {{ever|yesterday|ago}} tried Welsh cakes?", "We visited the castle {{two days ago|ever|never}}.", "I have {{already|last week|in 2024}} packed my bag."] },
      { typ: "frei", t: "Schreibe einen Satz mit yesterday oder last week.", tipp: "Zum Beispiel: Yesterday I played football.",
