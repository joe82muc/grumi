<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(2, "x");
  Grammatik.seite({
    nr: 5, lsNr: 5, modul: "e7-u2-x5", kurz: "X5",
    titel: "Extra: Adjektive und Gegenteile",
    lead: "„Surfing is **exciting**, but it can be **dangerous**.“ – Hier übst du Adjektive und ihre Gegenteile in kleinen Schritten.",
    ziele: ["Du wählst das passende Adjektiv.", "Du kennst Gegenteile wie easy – difficult.", "Du schreibst einen eigenen Satz mit einem Adjektiv."],
    merk: [
      { t: "Merke: Bilder zu den Adjektiven", breit: true, html: E7Seite.bilder([["fast","fast","schnell"],
          ["slow","slow","langsam"],
          ["strong","strong","stark"],
          ["tired","tired","müde"],
          ["hot","hot","heiß"],
          ["cold","cold","kalt"],
          ["exciting","exciting","spannend, aufregend"],
          ["tall","tall","groß (hoch gewachsen)"],
          ["wet","wet","nass"]]) },
      { t: "Merke: Gegenteile", html: `
        <p>Viele Adjektive haben ein <b>Gegenteil</b>. Wenn du beide Wörter lernst, merkst du dir mehr.</p>
        <div class="bsp"><span class="blau"><i>easy</i></span> (leicht) ↔ <span class="blau"><i>difficult</i></span> (schwierig)<br>
          <span class="blau"><i>safe</i></span> (ungefährlich) ↔ <span class="blau"><i>dangerous</i></span> (gefährlich)<br>
          <span class="blau"><i>boring</i></span> (langweilig) ↔ <span class="blau"><i>exciting</i></span> (spannend)</div>` },
      { t: "Merke: Adjektiv im Satz", html: `
        <p>Das Adjektiv steht nach <b>is / are</b> oder vor dem Nomen. Es verändert sich nicht.</p>
        <div class="bsp">The lake <b>is</b> big. · The boats <b>are</b> fast. · two <b>fast</b> boats</div>` }
    ],
    basis: [
      { typ: "paare", davor: "Schritt 1 · Bilder und Wörter", t: "Welches Adjektiv passt zum Bild? Verbinde Bild und Wort.", tipp: "Schau genau hin. Fang mit den Bildern an, die du sicher kennst.",
        paare: [["img:wb/fast.jpg", "fast"], ["img:wb/slow.jpg", "slow"], ["img:wb/strong.jpg", "strong"], ["img:wb/tired.jpg", "tired"], ["img:wb/hot.jpg", "hot"], ["img:wb/cold.jpg", "cold"], ["img:wb/exciting.jpg", "exciting"], ["img:wb/wet.jpg", "wet"]] },
      { typ: "wahl", davor: "Schritt 2 · Welches Adjektiv passt?", t: "Wähle das passende Adjektiv.", mischen: true,
        tipp: "Lies den Satz und überlege: Was passt zum Sinn?",
        items: [
          { s: "A game with no action is ___ .", o: ["boring", "exciting"], a: 0, e: "boring = langweilig. Ohne Action ist ein Spiel langweilig." },
          { s: "Wear a life jacket on the boat. Then it is ___ .", o: ["safe", "dangerous"], a: 0, e: "safe = ungefährlich. Mit Schwimmweste ist es sicher." },
          { s: "I can't do this task. It is too ___ .", o: ["difficult", "easy"], a: 0, e: "difficult = schwierig." },
          { s: "A big storm on the sea is ___ .", o: ["dangerous", "safe"], a: 0, e: "dangerous = gefährlich." },
          { s: "Everybody can do this. It is very ___ .", o: ["easy", "difficult"], a: 0, e: "easy = leicht." }
        ] },
      { typ: "paare", davor: "Schritt 3 · Englisch und Deutsch", t: "Welches englische Wort passt zu welchem deutschen?",
        tipp: "Fang mit den Wörtern an, die du sicher weißt.",
        paare: [["exciting", "spannend"], ["boring", "langweilig"], ["tired", "müde"], ["strong", "stark"], ["careful", "vorsichtig"], ["fit", "fit, sportlich"]] },
      { typ: "luecke", davor: "Schritt 4 · Gegenteile", t: "Schreibe das Gegenteil. Der Anfangsbuchstabe hilft dir.",
        tipp: "Denk an die Merkkästen oben.",
        info: "Beispiel: big ↔ s… (small) → big ↔ small.",
        items: ["easy ↔ [[difficult]] (d…)", "boring ↔ [[exciting]] (e…)", "safe ↔ [[dangerous]] (d…)", "fast ↔ [[slow]] (s…)"] },
      { typ: "luecke", t: "Ein Werbetext für ein Wassersportzentrum: Setze das passende Wort aus dem Kasten ein.",
        tipp: "Lies jeden Satz ganz. Jedes Wort aus dem Kasten passt genau einmal.",
        info: "Wortkasten: exciting · safe · easy · careful · fit",
        items: [
          "Our trips are never boring – they are very [[exciting]].",
          "You always wear a life jacket, so it is [[safe]].",
          "You can learn it in one hour. Kayaking is [[easy]].",
          "Please be [[careful]] near the big waves.",
          "Swimming every day makes you [[fit]]."
        ] },
      { typ: "bauen", t: "Ein Satzgerüst mit Beispiel: Baue den Satz.",
        tipp: "Beispiel: My – bike – is – fast. → My bike is fast.",
        info: "Beispiel: My bike is fast. Jetzt du: Das Adjektiv steht ganz hinten.",
        items: [{ teile: ["Surfing", "is", "very", "exciting."] }, { teile: ["The", "test", "was", "not", "easy."] }, { teile: ["My", "grandad", "is", "strong", "and", "fit."] }] },
      { typ: "luecke", t: "Jetzt du: Schreibe das fehlende Adjektiv.",
        tipp: "Der Anfangsbuchstabe hilft dir. Beide Wörter hast du schon geübt.",
        info: "Beispiel: Mein Hund ist nicht langsam. → My dog is f… (fast).",
        items: ["Nach dem Sport bin ich müde. – After sport I am [[tired]]. (t…)", "Dieser Film ist sehr spannend. – This film is very [[exciting]]. (e…)"] }
    ],
    plus: [
      { typ: "frei", t: "Schreibe einen Satz über eine Freizeitaktivität. Nimm ein Adjektiv.",
        tipp: "Fang so an: Swimming is … / Football is …",
        items: [{ f: "Wie findest du eine Aktivität (z. B. Klettern, Schwimmen, Fußball)?", kriterien: ["ein vollständiger englischer Satz", "mit einem Adjektiv (z. B. exciting, boring, easy, dangerous)"],
                  muster: "\\b(is|are|was)\\s+(very\\s+|quite\\s+|not\\s+)?(exciting|boring|easy|difficult|safe|dangerous|fun|great|interesting|tiring|fast)", bsp: "Swimming is very exciting." }] },
      { typ: "umformen", t: "Mache aus dem Satz einen Satz mit dem Gegenteil.",
        tipp: "Ersetze das Adjektiv durch sein Gegenteil. Oder: not + Adjektiv.",
        items: [{ s: "The game is easy. (Gegenteil: difficult)", l: ["The game is difficult.", "The game is not easy.", "The game isn't easy."] },
                { s: "The trip is boring. (Gegenteil: exciting)", l: ["The trip is exciting.", "The trip is not boring.", "The trip isn't boring."] }] }
    ]
  });
  </script>
