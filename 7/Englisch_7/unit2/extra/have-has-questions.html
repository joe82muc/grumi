  <title>Extra: Fragen mit Have/Has | Englisch 7</title>

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E7Seite(2, "x");
  Grammatik.seite({
    nr: 3, lsNr: 3, modul: "e7-u2-x3", kurz: "X3",
    titel: "Extra: Fragen mit Have/Has",
    lead: "„**Have** you cleaned your room?“ – Hier übst du in kleinen Schritten, wie eine Frage mit Have oder Has beginnt.",
    ziele: ["Du wählst Have oder Has.", "Du ordnest Fragen und Kurzantworten zu.", "Du baust eine Frage mit der 3. Form."],
    merk: [
      { t: "Have oder Has?", html: `
        <p><b>Have</b> bei I, you, we, they · <b>Has</b> bei he, she, it.</p>
        <div class="bsp"><b>Have</b> you eaten? – <b>Has</b> she eaten?</div>
        <p>Danach kommt die Person und die <b>3. Form</b>: Has she <b>finished</b>? Antwort: Yes, she <b>has</b>. / No, she <b>hasn't</b>.</p>` }
    ],
    basis: [
      { typ: "luecke", t: "Have oder Has? Wähle.", tipp: "he, she, it → Has · alle anderen → Have",
        items: ["{{Have|Has}} you eaten breakfast?", "{{Has|Have}} he called his friend?", "{{Has|Have}} your mum cooked dinner?", "{{Have|Has}} they cleaned the kitchen?", "{{Has|Have}} it stopped raining?"] },
      { typ: "wahl", t: "Wähle die Kurzantwort.", mischen: true, tipp: "Die Antwort passt zur Person: I → have · she → has.",
        items: [{ s: "Have you tidied your room?", o: ["Yes, I have.", "Yes, I has."], a: 0, e: "Zu I gehört have." },
                { s: "Has Mia washed the car?", o: ["No, she hasn't.", "No, she haven't."], a: 0, e: "Zu she gehört hasn't." },
                { s: "Have they finished?", o: ["Yes, they have.", "Yes, they has."], a: 0, e: "Zu they gehört have." }] },
      { typ: "paare", t: "Welche Antwort passt zu welcher Frage?", tipp: "Have you …? → Yes, I have. · Has he …? → Yes, he has.",
        paare: [["Have you finished your book?", "Yes, I have."], ["Has Omar done the shopping?", "No, he hasn't."], ["Have your friends arrived?", "Yes, they have."], ["Has your sister cleaned her room?", "No, she hasn't."]] },
      { typ: "bauen", t: "Baue die Frage. Das erste Wort ist Have oder Has.", info: "Beispiel: Have – you – eaten – lunch? → Have you eaten lunch?", tipp: "Have/Has – Person – 3. Form – Rest.",
        items: [{ teile: ["Have", "you", "done", "your homework?"] }, { teile: ["Has", "he", "tidied", "his room?"] }, { teile: ["Have", "they", "seen", "the film?"] }] },
      { typ: "luecke", t: "Setze die 3. Form ein.", info: "Wortkasten: eaten · done · been · seen", tipp: "eat → eaten · do → done · be → been · see → seen",
        items: ["Have you [[been]] to Wales?", "Has she [[done]] her homework?", "Have they [[eaten]] lunch?", "Has he [[seen]] the new film?"] },
      { typ: "luecke", t: "Schreibe die ganze Frage. Die Wörter in Klammern helfen dir.", tipp: ["Have oder Has? Schau auf die Person.", "Die 3. Form: clean → cleaned · finish → finished"],
        items: ["[[Has]] your sister [[cleaned]] her room? (clean)", "[[Have]] you [[finished]] your homework? (finish)"] }
    ],
    plus: [
      { typ: "bauen", t: "Noch eine Frage mit Fragewort. Baue sie.", tipp: "Fragewort – have/has – Person – 3. Form.",
        items: [{ teile: ["What", "have", "you", "done?"] }, { teile: ["Where", "has", "she", "been?"] }] },
      { typ: "frei", t: "Schreibe eine eigene Frage mit Have you …?", tipp: "Zum Beispiel: Have you finished your homework?",
        items: [{ f: "Eine Frage mit Have you …", kriterien: ["eine vollständige englische Frage", "Have you + 3. Form"],
                  muster: "\\bhave\\s+you\\s+(ever\\s+)?[a-z]+", bsp: "Have you eaten lunch?" }] }
    ]
  });
  </script>
