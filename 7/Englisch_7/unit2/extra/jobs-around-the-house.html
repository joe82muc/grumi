          { s: "They ___ the bathroom on Sundays.", o: ["clean", "cleans"], a: 0, e: "they → ohne -s: clean." }

      { typ: "paare", davor: "Schritt 4 · Englisch und Deutsch", t: "Welche Hausarbeit passt zu welcher deutschen?",

        items: [

          "My brother takes out the rubbish on 0 days out of 7. He [[never]] takes it out."

      { typ: "bauen", t: "Ein Satzgerüst mit Beispiel: Baue den Satz.",
        tipp: "Beispiel: Mia – always – feeds – the dog. → Mia always feeds the dog. Das Häufigkeitswort steht vor dem Verb.",

        items: [{ teile: ["Noah", "always", "tidies", "his room."] }, { teile: ["My dad", "never", "cleans", "the bathroom."] }, { teile: ["We", "always", "do", "the washing-up."] }] },

                { s: "I never do the washing-up.", l: ["She never does the washing-up."] }] }
