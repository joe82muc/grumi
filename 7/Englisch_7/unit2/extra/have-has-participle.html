  <script>
  E7Seite(2, "x");
  Grammatik.seite({
    nr: 2, lsNr: 2, modul: "e7-u2-x2", kurz: "X2",
    titel: "Extra: have/has + 3. Form",
    lead: "„I**'ve packed** my bag.“ – Hier übst du have/has und die 3. Form in kleinen Schritten.",

      { t: "Merke", html: `

        <p><b>he, she, it → has</b> · alle anderen → <b>have</b></p>
        <div class="bsp">I <b>have</b> seen it. · She <b>has</b> seen it. · They <b>have</b> seen it.</div>

        <table><tr><th>Grundform</th><th>3. Form</th></tr>

    basis: [
      { typ: "wahl", davor: "Schritt 1 · have oder has einkreisen", t: "have oder has?", mischen: true, tipp: "Merke: he, she, it → has",

          { s: "My brother ___ made a sandwich.", o: ["has", "have"], a: 0, e: "my brother = he → has." },
          { s: "I ___ seen a castle.", o: ["have", "has"], a: 0, e: "I → have." },
          { s: "They ___ been to Wales.", o: ["have", "has"], a: 0, e: "they → have." }

      { typ: "paare", davor: "Schritt 2 · Grundform und 3. Form", t: "Verbinde die Grundform mit der 3. Form.", tipp: "Schau in die Verbliste oben.",

                  muster: "\\b(have|['’]ve|has|['’]s)\\s+\\w+", bsp: "I have eaten my breakfast." }] }
