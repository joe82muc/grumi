  <script>
  E7Seite(2, "g");
  Grammatik.seite({
    nr: 3, lsNr: 3, modul: "e7-u2-g7", kurz: "G7",
    titel: "Present perfect: Fragen und Kurzantworten",
    foerder: { href: "../extra/have-has-questions.html", text: "Extra: Fragen mit Have/Has" },
    lead: "„**Have** you ever **been** to Scotland?“ – Mit dem present perfect fragst du, was jemand **schon einmal erlebt** oder **schon erledigt** hat.",
    ziele: ["Du stellst Ja/Nein-Fragen mit Have oder Has und gibst Kurzantworten.", "Du bildest Fragen mit Fragewort wie What have you …? oder Where has he …?", "Du fragst in einem Interview nach Erlebnissen und erledigten Aufgaben."],
    bild: { src: "g/g7-dog-sandwich.jpg", alt: "Picknick am Strand in Wales: Ein Junge schaut erschrocken auf seinen leeren Teller, ein Mädchen lacht und zeigt auf einen braunen Hund, der sich das Maul leckt. Hinten steht eine Burg auf einem grünen Hügel.",
      satz: "**Has** the dog **eaten** my sandwich? – Yes, it **has**!",
      de: "Hat der Hund mein Sandwich gefressen? – Ja, hat er! – Die Frage beginnt mit **Has**, die Kurzantwort wiederholt nur **has**." },
    merk: [
      { t: "Ja/Nein-Fragen", html: `
        <p>Die Frage beginnt mit <b>Have</b> oder <b>Has</b>. Dann kommen die Person und die <b>3. Form</b> des Verbs.</p>
        <div class="bsp"><b>Have</b> you ever <b>visited</b> Wales?</div>
        <div class="bsp"><b>Has</b> she <b>finished</b> her homework yet?</div>
        <p><b>Have</b> bei I, you, we, they · <b>Has</b> bei he, she, it</p>` },
      { t: "Kurzantworten", html: `
        <p>In der Kurzantwort wiederholst du nur <b>have</b> oder <b>has</b> – kein Verb danach.</p>
        <table><tr><th>Frage</th><th>Ja</th><th>Nein</th></tr>
        <tr><td>Have you cleaned your room?</td><td>Yes, I <b>have</b>.</td><td>No, I <b>haven't</b>.</td></tr>
        <tr><td>Has she cleaned her room?</td><td>Yes, she <b>has</b>.</td><td>No, she <b>hasn't</b>.</td></tr>
        <tr><td>Have they cleaned their rooms?</td><td>Yes, they <b>have</b>.</td><td>No, they <b>haven't</b>.</td></tr></table>` },
      { t: "Fragen mit Fragewort", html: `
        <p>Das Fragewort steht <b>ganz vorn</b>. Danach geht es weiter wie bei der Ja/Nein-Frage.</p>
        <div class="bsp"><b>What have</b> you <b>done</b> today?</div>
        <div class="bsp"><b>Where has</b> he <b>been</b>?</div>
        <div class="bsp"><b>Who has</b> she <b>met</b> in Wales?</div>` },
      { t: "Signalwörter", html: `
        <p><b>ever</b> (jemals) steht in der Frage direkt nach der Person: Have you <b>ever</b> …?</p>
        <p><b>yet</b> (schon / bis jetzt) steht am Ende der Frage: Has he cleaned the kitchen <b>yet</b>?</p>
        <p>In der Antwort passen <b>already</b> (schon) und <b>never</b> (nie): Yes, I've <b>already</b> done it. · No, I've <b>never</b> been there.</p>` }
    ],
    fallen: [
      "In der Frage steht **kein** do: **Have** you seen it? Nicht: ~~Do you have seen it?~~",
      "Nach have/has steht die 3. Form, nicht die Grundform: Has he **eaten**? Nicht: ~~Has he eat?~~",
      "Die Kurzantwort braucht have/has, nicht do: Yes, I **have**. Nicht: ~~Yes, I do.~~"
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Present perfect: Fragen",
        html: `<p>Frage: <span class="rot">Have / Has</span> + Person + 3. Form</p>
          <p><span class="rot">Have</span> you <span class="blau">ever</span> been to Wales?<br><span class="rot">Has</span> she cleaned her room <span class="blau">yet</span>?</p>
          <p>Kurzantwort: Yes, I <span class="rot">have</span>. / No, she <span class="rot">hasn't</span>.</p>` },

      { typ: "luecke", davor: "Teil 1 · Have oder Has?", t: "Have oder Has? Wähle das richtige Wort.", tipp: "I, you, we, they → Have · he, she, it → Has",
        items: ["{{Have|Has}} you ever been to Scotland?", "{{Has|Have}} your sister packed her bag?", "{{Have|Has}} we met your cousin before?",
                "{{Has|Have}} the bus arrived yet?", "{{Have|Has}} your parents booked the hotel?"] },
      { typ: "wahl", t: "Welche Kurzantwort passt zur Frage?", mischen: true, tipp: "Die Antwort wiederholt have oder has – nicht do.",
        items: [
          { s: "Have you ever been to the sea?", o: ["Yes, I have.", "Yes, I do.", "Yes, I has."], a: 0, e: "Kurzantwort mit have: Yes, I have." },
          { s: "Has Omar done his homework yet?", o: ["No, he hasn't.", "No, he doesn't.", "No, he haven't."], a: 0, e: "Zu he gehört hasn't." },
          { s: "Have your friends arrived yet?", o: ["Yes, they have.", "Yes, they has.", "Yes, they did."], a: 0, e: "Zu they gehört have." },
          { s: "Has it ever snowed in May?", o: ["No, it hasn't.", "No, it haven't.", "No, it isn't."], a: 0, e: "Zu it gehört hasn't." }
        ] },
      { typ: "markieren", t: "Markiere in jeder Frage Have/Has und die 3. Form.", stiftName: "present perfect", tipp: "Have oder Has steht vorn, die 3. Form kommt nach der Person.",
        items: ["[Have you seen] my new bike?", "[Has she called] her grandma?", "[Have they eaten] lunch yet?"] },

      { typ: "luecke", davor: "Teil 2 · Fragen und Antworten bilden", t: "Schreibe die Frage: Have/Has und die 3. Form.", tipp: ["Have oder Has? Schau auf die Person.", "Die 3. Form: visit → visited · be → been · eat → eaten · do → done"],
        items: ["[[Have]] you ever [[visited]] Wales? (visit)", "[[Has]] your brother [[been]] to Scotland? (be)", "[[Have]] they [[eaten]] lunch yet? (eat)", "[[Has]] Paula [[done]] her homework? (do)"] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "Have/Has – Person – 3. Form – Rest. Das Fragewort steht ganz vorn.",
        items: [{ teile: ["Have", "you", "ever", "tried", "haggis?"] }, { teile: ["Has", "Mia", "tidied", "her room", "yet?"] },
                { teile: ["What", "have", "you", "done", "today?"] }, { teile: ["Where", "has", "he", "been?"] }] },
      { typ: "luecke", t: "Schreibe die Kurzantwort.", tipp: "Nur have/has – ohne Verb. Kurzformen wie haven't sind erlaubt.",
        items: ["Have you cleaned your room? – Yes, I [[have]].", "Has your brother tidied up? – No, he [[hasn't|has not]].", "Have the kids eaten yet? – No, they [[haven't|have not]].", "Has Elif been to Wales? – Yes, she [[has]]."] },
      { typ: "umformen", t: "Mach aus der Aussage eine Frage mit dem Wort in Klammern.", tipp: "Have/Has vor die Person. Die 3. Form bleibt.",
        items: [
          { s: "You have been to Skye. (ever)", l: ["Have you ever been to Skye?"] },
          { s: "Noah has finished his book. (yet)", l: ["Has Noah finished his book yet?"] },
          { s: "They have seen the castle. (ever)", l: ["Have they ever seen the castle?"] }
        ] },
      { typ: "paare", t: "Welche Antwort passt zu welcher Frage?", tipp: "Achte auf das Fragewort: What → Sache, Where → Ort, Who → Person.",
        paare: [["What have you done today?", "I've washed the car."], ["Where has he been?", "He's been to Wales."], ["Who has she met?", "She's met her cousins."], ["Why have you stayed at home?", "Because I'm ill."]] },

      { typ: "luecke", davor: "Teil 3 · Interview und Verabredung", t: "ever, yet, already oder never? Wähle das passende Wort.", tipp: "ever und yet stehen in Fragen. Antworten passen zu already und never.",
        items: ["Have you {{ever|yet|before}} tried Scottish shortbread?", "Has Mia finished her homework {{yet|ever|never}}?", "No, I've {{never|ever|yet}} been to Wales.", "Yes, I've {{already|ever|yet}} packed my bag."] },
      { typ: "luecke", t: "Ein Interview über die Freizeit: Setze die Wörter ein.", tipp: "Frage: Have/Has + Person + 3. Form. Antwort: have/has.",
        items: ["A: [[Have]] you ever [[played]] chess? (play)", "B: Yes, I [[have]]. I play it every Friday.", "A: [[Has]] your sister ever [[tried]] it? (try)", "B: No, she [[hasn't|has not]]. She prefers football."] },
      { typ: "frei", t: "Stell einem Mitschüler eine Frage mit Have you ever …?", tipp: "Zum Beispiel: Have you ever … (be / see / eat / try …)?",
        items: [{ f: "Frage nach einem Erlebnis", kriterien: ["eine vollständige englische Frage", "Have you ever + 3. Form"],
                  muster: "\\bhave\\s+you\\s+ever\\s+[a-z]+", bsp: "Have you ever been to Scotland?" }] }
    ],
    plus: [
      { typ: "luecke", t: "Eine Nachricht vor der Verabredung: Setze die Formen ein.", tipp: "Achte auf Have und Has – und auf die 3. Form.",
        items: ["Hi Yusuf! [[Have]] you [[finished]] your jobs at home yet? (finish)", "Not yet. I [[haven't|have not]] [[washed]] up. (wash)", "[[Has]] your mum [[cooked]] dinner already? (cook)", "Yes, she [[has]]. We can meet at six."] },
      { typ: "wahl", t: "Welche Frage ist richtig?", mischen: true, tipp: "Kein do, und nach have/has die 3. Form.",
        items: [
          { f: "Du willst wissen, ob dein Freund schon einmal in Wales war.", o: ["Have you ever been to Wales?", "Do you ever been to Wales?", "Has you ever been to Wales?"], a: 0, e: "Have + you + ever + been." },
          { f: "Du fragst, ob Ida schon gefrühstückt hat.", o: ["Has Ida had breakfast yet?", "Have Ida had breakfast yet?", "Does Ida had breakfast yet?"], a: 0, e: "Zu Ida (she) gehört Has." },
          { f: "Du fragst, was Luca gesehen hat.", o: ["What has Luca seen?", "What Luca has seen?", "What does Luca seen?"], a: 0, e: "Fragewort – has – Person – 3. Form." }
        ] },
      { typ: "umformen", t: "Stelle eine Frage mit dem Fragewort in Klammern.", tipp: "Fragewort + have/has + Person + 3. Form.",
        items: [
          { s: "You have bought something. (What)", l: ["What have you bought?"] },
          { s: "Carla has been somewhere. (Where)", l: ["Where has Carla been?"] },
          { s: "Your cousins have met someone. (Who)", l: ["Who have your cousins met?"] }
        ] },
      { typ: "frei", t: "Schreibe eine Frage und eine Kurzantwort über deinen Partner.", tipp: ["Frage mit Has he/she …?", "Dann die Kurzantwort: Yes, he/she has. / No, he/she hasn't."],
        items: [{ f: "Frage mit Has he/she … + Kurzantwort", kriterien: ["eine Frage mit Has he/she + 3. Form", "eine passende Kurzantwort mit has/hasn't"],
                  muster: "\\bhas\\s+(he|she|[a-z]+)\\s+(ever\\s+)?[a-z]+.*\\b(has|hasn['’]t)\\b", bsp: "Has she ever been to Wales? Yes, she has." }] }
    ]
  });
  </script>
