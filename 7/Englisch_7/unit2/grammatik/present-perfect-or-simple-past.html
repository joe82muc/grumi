  <script>
  E7Seite(2, "g");
  Grammatik.seite({
    nr: 4, lsNr: 4, modul: "e7-u2-gpp", kurz: "PP/SP",
    titel: "Present perfect oder simple past?",
    foerder: { href: "../extra/signal-words.html", text: "Extra: Signalwörter erkennen" },
    lead: "„I **have been** to Skye. I **went** there last summer.“ – Mal present perfect, mal simple past: Die **Zeitangabe** verrät dir, welche Form passt.",
    ziele: ["Du erkennst an Signalwörtern, ob present perfect oder simple past passt.", "Du wählst und bildest beide Zeitformen in Sätzen und Dialogen.", "Du erzählst von Ausflügen und Erlebnissen und sagst, wann sie waren."],
    bild: { src: "g/gpp-skye-photos.jpg", alt: "Ein Mädchen sitzt mit einem Freund auf dem Sofa und zeigt ihm ein Fotoalbum mit Urlaubsbildern von der Insel Skye: Felsnadeln auf einem grünen Hang, Schafe, ein weißes Haus am Meer und das Mädchen selbst in gelber Jacke.",
      satz: "I **have been** to Skye. I **went** there **last summer**.",
      de: "Ich war schon einmal auf Skye. Ich bin letzten Sommer hingefahren. – Ohne Zeitangabe present perfect, mit **last summer** simple past." },
    merk: [
      { t: "Wann? → simple past", html: `
        <p>Du sagst <b>genau, wann</b> etwas war? Dann brauchst du das <b>simple past</b>.</p>
        <div class="bsp">We <b>visited</b> the lake <span class="blau">last summer</span>.</div>
        <div class="bsp">I <b>was</b> in Wales <span class="blau">two days ago</span>.</div>
        <p>Signalwörter: <i>yesterday (gestern), last week / last summer (letzte Woche / letzten Sommer), two days ago (vor zwei Tagen), in 2024, on Sunday (am Sonntag), when I was …</i></p>` },
      { t: "Ohne genaue Zeit → present perfect", html: `
        <p>Du sagst <b>nicht, wann</b>, oder es geht um die Zeit <b>bis jetzt</b>? Dann brauchst du das <b>present perfect</b>.</p>
        <div class="bsp">I <b>have been</b> to Wales <span class="blau">before</span>.</div>
        <div class="bsp"><b>Have</b> you <span class="blau">ever</span> <b>seen</b> a seal?</div>
        <p>Signalwörter: <i>ever (jemals), never (nie), already (schon), yet (schon / noch), just (gerade eben), before (schon einmal)</i></p>` },
      { t: "Merke", html: `
        <p><b>Steht eine Zeitangabe für die Vergangenheit da, nie present perfect!</b></p>
        <div class="bsp">Nicht: <s>I have been to Skye last year.</s> Sondern: I <b>went</b> to Skye last year.</div>
        <p>Das simple past kennst du aus Unit 1: Regelmäßige Verben bekommen <b>-ed</b> (visit → visited), unregelmäßige haben eine eigene Form (go → went, see → saw).</p>` }
    ],
    fallen: [
      "Mit **yesterday, last week, ago** oder **in 2024** steht das simple past: I **saw** it yesterday. Nicht: ~~I have seen it yesterday.~~",
      "Bei **ever, never, already, yet** steht das present perfect: Have you **ever** been there? Nicht: ~~Did you ever be there?~~",
      "Die Frage „Have you ever …?“ beantwortest du kurz mit have. Danach erzählst du im simple past: Yes, I **have**. I **went** there in 2024."
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Present perfect oder simple past?",
        html: `<p>Genaue Zeit (<span class="blau">yesterday, last week, ago</span>) → <span class="rot">simple past</span>: I went there <span class="blau">last year</span>.</p>
          <p>Keine genaue Zeit (<span class="blau">ever, never, already, yet</span>) → <span class="rot">present perfect</span>: I have <span class="blau">never</span> been there.</p>` },

      { typ: "zuordnen", davor: "Teil 1 · Signalwörter erkennen", t: "Welches Signalwort gehört zu welcher Zeitform? Sortiere.", tipp: "Sagt das Wort, wann es war? Dann simple past. Sagt es nur „schon / nie / jemals“? Dann present perfect.",
        gruppen: ["present perfect", "simple past"],
        karten: [["ever", 0], ["never", 0], ["already", 0], ["yet", 0], ["just", 0], ["before", 0],
                 ["yesterday", 1], ["last week", 1], ["two days ago", 1], ["in 2024", 1], ["on Sunday", 1], ["last summer", 1]] },
      { typ: "markieren", t: "Markiere in jedem Satz das Signalwort.", stiftName: "Signalwort", tipp: "Suche das Wort oder die Wörter, die etwas über die Zeit sagen.",
        items: ["We went to the beach [last Sunday].", "Have you [ever] seen a seal?", "My brother has [already] packed his bag.", "I visited my cousins [two days ago]."] },
      { typ: "luecke", t: "Welche Form passt? Achte auf das Signalwort.", tipp: "Zeitangabe für die Vergangenheit → simple past · ever, never, already, yet → present perfect",
        items: ["We {{went|have been}} to Loch Lomond last summer.", "I {{have never eaten|ate never}} haggis.", "She {{saw|has seen}} a deer yesterday.",
                "{{Have|Did}} you ever climbed a mountain?", "They {{visited|have visited}} Anglesey two years ago.", "Omar has {{already|yesterday}} done his homework."] },

      { typ: "luecke", davor: "Teil 2 · Beide Formen bilden", t: "Schreibe die richtige Form.", tipp: ["Zeitangabe da? → simple past. Sonst present perfect.", "go → went, been · see → saw, seen · eat → ate, eaten · do → did, done"],
        items: ["Last weekend we [[went]] to the lake. (go)", "I [[have never seen|'ve never seen]] a whale. (never / see)", "Aylin [[visited]] her aunt in 2024. (visit)",
                "[[Have]] you ever [[eaten]] Welsh cakes? (eat)", "My dad [[has already cooked|'s already cooked]] dinner. (already / cook)"] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Mit Zeitangabe: simple past. Mit ever, never, yet: present perfect.",
        items: [{ teile: ["We", "visited", "Skye", "last summer."] }, { teile: ["Have", "you", "ever", "been", "to Wales?"] },
                { teile: ["She", "has", "never", "seen", "a castle."] }, { teile: ["I", "met", "him", "two days ago."] }] },
      { typ: "umformen", t: "Schreibe den Satz mit der Zeitangabe in Klammern neu.", tipp: "Mit einer Zeitangabe für die Vergangenheit brauchst du das simple past.",
        items: [
          { s: "We have been to the beach. (last Sunday)", l: ["We went to the beach last Sunday.", "Last Sunday we went to the beach.", "We were at the beach last Sunday.", "Last Sunday we were at the beach."] },
          { s: "She has seen a seal. (yesterday)", l: ["She saw a seal yesterday.", "Yesterday she saw a seal."] },
          { s: "I have visited my cousins. (two days ago)", l: ["I visited my cousins two days ago.", "Two days ago I visited my cousins."] }
        ] },
      { typ: "wahl", t: "Welche Antwort passt zur Frage?", mischen: true, tipp: "Erst kurz mit have antworten, dann im simple past sagen, wann.",
        items: [
          { s: "Have you ever been to Wales?", o: ["Yes, I have. I went there last summer.", "Yes, I have. I have gone there last summer.", "Yes, I went. I have been there last summer."], a: 0, e: "Kurzantwort mit have, dann simple past mit last summer." },
          { s: "Has she ever tried Scottish food?", o: ["Yes, she has. She tried it in 2024.", "Yes, she has. She has tried it in 2024.", "Yes, she did. She tried it in 2024."], a: 0, e: "Kurzantwort mit has, dann simple past mit in 2024." }
        ] },

      { typ: "luecke", davor: "Teil 3 · Ausflüge und Erlebnisse", t: "Ein Dialog über einen Ausflug: Setze die Verben ein.", tipp: "Frage mit ever → present perfect. Wenn eine Zeit dabeisteht → simple past.",
        items: ["A: [[Have]] you ever [[been]] to Skye? (be)", "B: Yes, I [[have]]. I [[went]] there last summer. (go)", "A: [[Did]] you [[like]] it? (like)", "B: Yes! We [[climbed]] a hill and [[saw]] a seal. (climb / see)"] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { f: "Du sagst, dass du letztes Jahr in Wales warst.", o: ["I was in Wales last year.", "I have been in Wales last year.", "I am in Wales last year."], a: 0, e: "last year ist eine genaue Zeit → simple past." },
          { f: "Du sagst, dass du noch nie in Schottland warst.", o: ["I have never been to Scotland.", "I never was to Scotland yesterday.", "I didn't never be to Scotland."], a: 0, e: "never → present perfect: have never been." },
          { f: "Du fragst, ob jemand schon einmal gewandert ist.", o: ["Have you ever been hiking?", "Did you ever been hiking?", "Do you ever been hiking?"], a: 0, e: "Frage mit ever → Have you ever + 3. Form." }
        ] },
      { typ: "frei", t: "Beantworte: Have you ever been to a lake or the sea? Sag dann, wann du dort warst.", tipp: ["Zuerst: Yes, I have. / No, I haven't.", "Dann ein Satz im simple past mit einer Zeitangabe, z. B. last summer."],
        items: [{ f: "Kurzantwort + ein Satz mit Zeitangabe", kriterien: ["Kurzantwort mit have/haven't", "ein Satz im simple past", "eine Zeitangabe wie last summer, two years ago oder in 2024"],
                  muster: "\\b(last|ago|yesterday|in 20\\d\\d|on (monday|tuesday|wednesday|thursday|friday|saturday|sunday)|when i was)\\b", bsp: "Yes, I have. I went to the lake last summer." }] }
    ],
    plus: [
      { typ: "luecke", t: "Eine Nachricht an eine Freundin: Setze die richtige Zeitform ein.", tipp: "Achte bei jeder Lücke auf das Signalwort.",
        items: ["Hi Carla! Our trip to Wales was great. We [[went]] there two weeks ago. (go)", "I [[have never seen|'ve never seen]] a bigger beach! (never / see)", "On Saturday we [[swam]] in the sea. (swim)",
                "[[Have]] you ever [[been]] to Wales? (be)", "Mia [[has already visited|'s already visited]] it – she went with her school in 2023. (already / visit)"] },
      { typ: "wahl", t: "Welcher Satz hat keinen Fehler?", mischen: true, tipp: "Prüfe Signalwort und Zeitform.",
        items: [
          { f: "Finde den richtigen Satz.", o: ["Did you see Noah last night?", "Have you seen Noah last night?", "Did you seen Noah last night?"], a: 0, e: "last night → simple past, und nach did die Grundform." },
          { f: "Finde den richtigen Satz.", o: ["He has never tried snowboarding.", "He never has tried snowboarding yesterday.", "He has never tried snowboarding yesterday."], a: 0, e: "Ohne genaue Zeit: has never tried." }
        ] },
      { typ: "umformen", t: "Mach aus der Aussage eine Frage mit Have you ever …? oder Did you …?", tipp: "Mit Zeitangabe: Did. Mit ever: Have you ever + 3. Form.",
        items: [
          { s: "You have seen a castle. (ever)", l: ["Have you ever seen a castle?"] },
          { s: "You visited Wales last year. (Did)", l: ["Did you visit Wales last year?"] },
          { s: "You have climbed a mountain. (ever)", l: ["Have you ever climbed a mountain?"] }
        ] },
      { typ: "frei", t: "Schreibe zwei Sätze über einen Ausflug: einen mit never oder already, einen mit einer Zeitangabe.", tipp: ["Satz 1: present perfect mit never oder already.", "Satz 2: simple past mit last …, … ago oder in …"],
        items: [{ f: "Zwei Sätze zu einem Ausflug", kriterien: ["ein Satz mit have/has + never oder already + 3. Form", "ein Satz im simple past mit Zeitangabe"],
                  muster: "\\b(have|has|['’]ve|['’]s)\\s+(never|already)\\s+[a-z]+.*\\b(last|ago|yesterday|in 20\\d\\d|on (monday|tuesday|wednesday|thursday|friday|saturday|sunday))\\b", bsp: "I have never been to Ireland. We went to the coast last weekend." }] }
    ]
  });
  </script>
