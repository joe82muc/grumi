  <script>
  E8MSeite(4, "g");
  Grammatik.seite({
    nr: 1, modul: "e8-m-u4-g11", kurz: "G11",
    titel: "Das Passiv",
    lead: "„English **is spoken** in Canada.“ – Wer es spricht, ist nicht wichtig. Im Passiv steht im Mittelpunkt, **was getan wird**.",
    ziele: ["Du erkennst, ob ein Satz im Aktiv oder im Passiv steht.", "Du bildest das Passiv im simple present und im simple past.", "Du sagst mit by, wer etwas getan hat."],
    bild: { src: "g/g11-maple-syrup.jpg", alt: "Ein verschneiter Ahornwald in Kanada. An den Baumstämmen hängen Metalleimer, in denen der Saft gesammelt wird. Im Hintergrund steht eine Holzhütte mit dampfendem Schornstein. Zwei Menschen in warmen Jacken tragen volle Eimer zur Hütte; vorn auf einem Tisch stehen eine Flasche Sirup und ein Stapel Pfannkuchen.",
      satz: "Maple syrup **is made** from sap. The sap **is collected** in buckets.",
      de: "Ahornsirup wird aus Saft gemacht. Der Saft wird in Eimern gesammelt. – Wichtig ist, **was** passiert, nicht, wer es tut." },
    merk: [
      { t: "Aktiv oder Passiv?", html: `
        <div class="bsp"><b>Aktiv:</b> Wer tut etwas? – <i>Many people <b>speak</b> French in Quebec.</i></div>
        <div class="bsp"><b>Passiv:</b> Was wird getan? – <i>French <b>is spoken</b> in Quebec.</i></div>
        <p>Im Passiv ist unwichtig oder unbekannt, <b>wer</b> etwas tut. Deshalb steht das, was getan wird, an erster Stelle.</p>` },
      { t: "Jetzt: am / is / are + 3. Form", html: `
        <div class="bsp">This app <b>is used</b> every day. <i>– … wird benutzt.</i></div>
        <div class="bsp">Many photos <b>are shared</b> online. <i>– … werden geteilt.</i></div>
        <p>Einzahl → <b>is</b> (ich: <b>am</b>) · Mehrzahl → <b>are</b></p>` },
      { t: "Früher: was / were + 3. Form", html: `
        <div class="bsp">The school <b>was built</b> in 1990. <i>– … wurde gebaut.</i></div>
        <div class="bsp">The photos <b>were taken</b> in Toronto. <i>– … wurden gemacht.</i></div>
        <div class="bsp">I <b>was born</b> in Munich. <i>– Ich wurde geboren.</i></div>
        <p>Einzahl → <b>was</b> · Mehrzahl → <b>were</b></p>` },
      { t: "Die 3. Form und by", html: `
        <p>Regelmäßige Verben: <b>-ed</b>. Unregelmäßige musst du lernen – alle findest du im Bereich „Unregelmäßige Verben“:</p>
        <table><tr><th>Grundform</th><th>3. Form</th><th>Grundform</th><th>3. Form</th></tr>
        <tr><td>make</td><td><b>made</b></td><td>speak</td><td><b>spoken</b></td></tr>
        <tr><td>build</td><td><b>built</b></td><td>write</td><td><b>written</b></td></tr>
        <tr><td>take</td><td><b>taken</b></td><td>sell</td><td><b>sold</b></td></tr>
        <tr><td>send</td><td><b>sent</b></td><td>give</td><td><b>given</b></td></tr>
        <tr><td>see</td><td><b>seen</b></td><td>find</td><td><b>found</b></td></tr></table>
        <p>Willst du doch sagen, wer es getan hat, hängst du es mit <b>by</b> an: <i>The video was made <b>by</b> a student.</i></p>` }
    ],
    fallen: [
      "Deutsch: „wird gemacht“ – Englisch: **is made**. Nicht mit will: ~~will made~~.",
      "Du brauchst immer die **3. Form**: was **written**. Nicht: ~~was wrote~~.",
      "Einzahl oder Mehrzahl? The letter **was** sent. The letters **were** sent. Nicht: ~~The photos was taken~~."
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Das Passiv",
        html: `<p><span class="rot">am / is / are / was / were + 3. Form</span> – wichtig ist, <u>was</u> getan wird.</p>
          <p>English <span class="rot">is spoken</span> in Canada.<br>The photos <span class="rot">were taken</span> in Toronto.</p>
          <p>Wer es tut: <span class="blau">by</span> – The video was made <span class="blau">by</span> a student.</p>
          <p>Merke: make – made, build – built, speak – spoken</p>` },

      { typ: "wahl", davor: "Teil 1 · Aktiv oder Passiv? Die 3. Form", t: "Aktiv oder Passiv?", tipp: "Passiv: eine Form von be (am, is, are, was, were) + 3. Form.",
        items: [
          { s: "Ice hockey is played all over Canada.", o: ["Passiv", "Aktiv"], a: 0 },
          { s: "My uncle works in a bank in Toronto.", o: ["Passiv", "Aktiv"], a: 1 },
          { s: "The tickets were sold in two hours.", o: ["Passiv", "Aktiv"], a: 0 },
          { s: "A girl from Vancouver won the competition.", o: ["Passiv", "Aktiv"], a: 1 },
          { s: "These laptops are made in Asia.", o: ["Aktiv", "Passiv"], a: 1 }
        ] },
      { typ: "markieren", t: "Markiere in jedem Satz die Passivform (be + 3. Form).", stiftName: "Passiv", tipp: "Zwei Wörter gehören zusammen: is/are/was/were + 3. Form.",
        items: ["The letter [was written] by my aunt.", "Pancakes [are eaten] with syrup.", "My bike [was stolen] last week.", "Hockey sticks [are sold] in this shop.", "The windows [were cleaned] yesterday."] },
      { typ: "paare", t: "Welche 3. Form gehört zu welcher Grundform?", tipp: "Die Tabelle „Die 3. Form und by“ oben hilft dir.",
        paare: [["make", "made"], ["build", "built"], ["write", "written"], ["speak", "spoken"], ["sell", "sold"], ["take", "taken"], ["send", "sent"], ["give", "given"]] },

      { typ: "luecke", davor: "Teil 2 · simple present und simple past", t: "is / are oder was / were? Achte auf das Signalwort.", tipp: "Every winter, every day → present (is/are). Yesterday, last year, in 1990 → past (was/were). Einzahl → is/was · Mehrzahl → are/were.",
        items: ["Every winter, many hockey games {{are|were}} played here.", "Last year, the new rink {{was|is}} opened by the mayor.", "In 1990, our school {{was|is}} built.",
                "These tutorials {{are|were}} watched every day.", "Yesterday, my phone {{was|is}} found in the park.", "The letters {{were|are}} sent last Monday."] },
      { typ: "zuordnen", t: "Gegenwart oder Vergangenheit? Sortiere die Passivformen.", tipp: "is / are → simple present · was / were → simple past",
        gruppen: ["simple present", "simple past"],
        karten: [["is made", 0], ["are sold", 0], ["is used", 0], ["are written", 0], ["was built", 1], ["were taken", 1], ["was found", 1], ["were sent", 1]] },
      { typ: "luecke", t: "Passiv im simple present: Schreibe die ganze Form.", tipp: "am/is/are + 3. Form. Bei Mehrzahl: are.",
        items: ["Ice hockey [[is played]] in many schools. (play)", "Maple syrup [[is sold|'s sold]] in small bottles. (sell)", "Many tutorials [[are uploaded]] every day. (upload)",
                "This app [[is used]] by young people. (use)", "The shop [[is cleaned|'s cleaned]] every evening. (clean)"] },
      { typ: "luecke", t: "Passiv im simple past: Schreibe die ganze Form.", tipp: "was/were + 3. Form. Bei Mehrzahl: were.",
        items: ["My parcel [[was sent]] last Monday. (send)", "The pictures [[were drawn]] by my sister last week. (draw)", "I [[was born]] in Munich in 2012. (be born)",
                "The cake [[was baked]] by my grandma yesterday. (bake)", "The tickets [[were bought]] online last week. (buy)"] },

      { typ: "bauen", davor: "Teil 3 · mit by und ganze Sätze", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Dinge zuerst, dann die Passivform, dann by und wer es getan hat.",
        items: [{ teile: ["This video", "was made", "by", "a student."] }, { teile: ["Tablets", "are used", "in", "many classrooms."] },
                { teile: ["The photos", "were taken", "in Toronto", "last winter."], l: ["The photos were taken last winter in Toronto."] }] },
      { typ: "luecke", t: "by oder nicht? Fülle die Lücke mit by.", tipp: "by + die Person, die etwas getan hat.",
        items: ["The song was written [[by]] a famous singer.", "These shoes were made [[by]] hand.", "The poster was designed [[by]] our class.", "Pizza is loved [[by]] children all over the world."] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { f: "Der Film wurde 2019 gedreht.", o: ["The film was made in 2019.", "The film is made in 2019.", "The film was make in 2019."], a: 0, e: "2019 ist vorbei → was; dazu die 3. Form made." },
          { f: "Die Briefe wurden gestern geschickt.", o: ["The letters were sent yesterday.", "The letters was sent yesterday.", "The letters were send yesterday."], a: 0, e: "Mehrzahl → were; dazu die 3. Form sent." },
          { f: "Dieser Brief wurde von meiner Tante geschrieben.", o: ["This letter was written by my aunt.", "This letter was wrote by my aunt.", "This letter is written from my aunt."], a: 0, e: "was + 3. Form (written); die Person steht nach by." }
        ] },
      { typ: "luecke", t: "Setze die 3. Form des Verbs ein.", tipp: "Viele sind unregelmäßig: sell → sold, write → written, break → broken …",
        items: ["Hockey sticks are [[sold]] in this shop. (sell)", "The letter was [[written]] by my aunt. (write)", "Two songs were [[sung]] by the choir. (sing)",
                "The window was [[broken]] by a ball. (break)", "Maple pancakes are [[eaten]] for breakfast. (eat)"] }
    ],
    plus: [
      { typ: "wahl", t: "Aktiv oder Passiv? Wähle die passende Form.", mischen: true, tipp: "Sucht der Satz einen, der etwas tut? → Aktiv. Wird etwas gemacht? → Passiv.",
        items: [
          { s: "Every year, thousands of pupils ___ this museum.", o: ["visit", "are visited"], a: 0, e: "Die Pupils tun etwas → Aktiv." },
          { s: "The museum ___ by the mayor in 1950.", o: ["was opened", "opened"], a: 0, e: "„by the mayor“ sagt, wer es getan hat – das Museum wurde eröffnet → Passiv." },
          { s: "My cousin ___ in Vancouver.", o: ["lives", "is lived"], a: 0, e: "live kann man nicht ins Passiv setzen – hier Aktiv." },
          { s: "The tickets ___ at the door.", o: ["are sold", "sell"], a: 0, e: "Die Tickets werden verkauft → Passiv." },
          { s: "Our teacher ___ a new video yesterday.", o: ["made", "was made"], a: 0, e: "Der Lehrer hat etwas getan → Aktiv." }
        ] },
      { typ: "luecke", t: "Eine Nachricht aus Quebec: Setze die Passivformen ein.", tipp: "Achte auf yesterday (past) und Einzahl / Mehrzahl.",
        items: ["Hi Omar! We are in Quebec now. French [[is spoken|'s spoken]] everywhere here. (speak)", "Yesterday we visited a sugar house. Maple syrup [[is made|'s made]] there every spring from sap. (make)",
                "The first photos [[were taken]] in the forest yesterday. (take)", "A bottle of syrup [[was given]] to every pupil. (give)", "Many photos [[were sent]] to my mum last night. (send)"] },
      { typ: "umformen", t: "Setze den Satz ins Passiv.", tipp: "Das Objekt kommt nach vorn. Zeit beibehalten: is/are oder was/were + 3. Form.",
        items: [
          { s: "Students use tablets in our school.", l: ["Tablets are used in our school.", "Tablets are used in our school by students."] },
          { s: "Someone stole my bike yesterday.", l: ["My bike was stolen yesterday.", "My bike was stolen yesterday by someone."] },
          { s: "Hannah wrote this story.", l: ["This story was written by Hannah."] },
          { s: "They sell maple syrup in this shop.", l: ["Maple syrup is sold in this shop.", "Maple syrup is sold in this shop by them."] }
        ] },
      { typ: "frei", t: "Schreibe einen Passivsatz über etwas, das in deiner Schule oder Stadt gemacht wird oder wurde.", tipp: "Zum Beispiel: Our school was built in … / Pizza is sold in …",
        items: [{ f: "Dein eigener Passivsatz:", kriterien: ["ein vollständiger englischer Satz", "Passiv: is/are oder was/were + 3. Form des Verbs"],
                  muster: "\\b(is|are|was|were)\\s+(not\\s+)?[a-z]+(ed|en|t|ne|ld|nd|ght|wn|de|ke|ve|ce|ge|pt|ew|un|lt|ft)\\b", bsp: "Our school was built in 1990." }] }
    ]
  });
  </script>
