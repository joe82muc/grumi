  <script>
  E8MSeite(4, "g");
  Grammatik.seite({
    nr: 2, modul: "e8-m-u4-g12", kurz: "G12",
    titel: "Relativsätze mit who, which, that",
    lead: "„A vet is someone **who** helps sick animals.“ – Mit einem Relativsatz erklärst du genauer, wen oder was du meinst.",
    ziele: ["Du benutzt who für Personen und which für Dinge und Tiere.", "Du weißt, dass that für beides geht.", "Du verbindest zwei Sätze zu einem."],
    bild: { src: "g/g12-vet.jpg", alt: "Eine Tierärztin im grünen Kittel untersucht auf dem Behandlungstisch einen freundlichen Hund mit verbundener Pfote. Ein Mädchen hält den Hund und sieht erleichtert aus. Durch die offene Tür sieht man im Wartezimmer einen Jungen mit einer Katze im Transportkorb.",
      satz: "A vet is someone **who** helps sick animals.",
      de: "Eine Tierärztin ist jemand, der kranken Tieren hilft. – Für eine Person nimmst du **who**." },
    merk: [
      { t: "who, which, that", html: `
        <table><tr><th>Wort</th><th>für</th><th>Beispiel</th></tr>
        <tr><td><b>who</b></td><td>Personen</td><td>the girl <b>who</b> lives next door</td></tr>
        <tr><td><b>which</b></td><td>Dinge und Tiere</td><td>a video <b>which</b> shows you how to do something</td></tr>
        <tr><td><b>that</b></td><td>beides</td><td>the girl <b>that</b> … · the video <b>that</b> …</td></tr></table>` },
      { t: "Wozu?", html: `
        <p>Der Relativsatz sagt, <b>welche</b> Person oder Sache gemeint ist. Er steht <b>direkt hinter</b> dem Wort, das er beschreibt:</p>
        <div class="bsp">A tutorial is a video <b>which shows you how to do something</b>.</div>
        <div class="bsp">An intern is someone <b>who learns a job for a short time</b>.</div>` },
      { t: "Zwei Sätze verbinden", html: `
        <div class="bsp">This is the girl. <u>She</u> won the race.<br>→ This is the girl <b>who</b> won the race.</div>
        <div class="bsp">I use an app. <u>It</u> helps me with vocabulary.<br>→ I use an app <b>which</b> helps me with vocabulary.</div>
        <p>Das Pronomen (she, it, they …) fällt weg – an seine Stelle tritt who, which oder that. Auch in Fragen: <i>Is this the app <b>which</b> helps you?</i></p>` },
      { t: "Kein Komma!", html: `
        <p>Im Deutschen steht vor dem Relativsatz ein Komma, im Englischen hier <b>nicht</b>:</p>
        <div class="bsp">Das ist der Lehrer<b>,</b> der Sport unterrichtet.<br>That's the teacher who teaches PE.</div>` }
    ],
    fallen: [
      "**who** nur für Personen. Für Dinge und Tiere: **which** oder **that**. Nicht: ~~the app who …~~",
      "Das Pronomen nicht doppelt: the girl who lives here. Nicht: ~~the girl who she lives here~~.",
      "Kein Komma vor who, which, that in diesen Sätzen. Nicht: ~~the girl, who won~~."
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Relativsätze mit who, which, that",
        html: `<p><span class="rot">who</span> = Personen, <span class="rot">which</span> = Dinge und Tiere, <span class="rot">that</span> = beides.</p>
          <p>A vet is someone <span class="rot">who</span> helps sick animals.<br>A tutorial is a video <span class="rot">which</span> shows you how to do something.</p>
          <p>Merke: <span class="blau">Kein Komma</span> vor who, which, that (in diesen Sätzen)!</p>` },

      { typ: "zuordnen", davor: "Teil 1 · who oder which?", t: "who oder which? Ordne die Wörter zu.", tipp: "Personen → who · Dinge und Tiere → which",
        gruppen: ["… who …", "… which …"],
        karten: [["a vet", 0], ["a nurse", 0], ["a hockey player", 0], ["a pupil", 0], ["a baker", 0], ["a tutorial", 1], ["an app", 1], ["a hockey stick", 1], ["a maple tree", 1], ["a moose", 1]] },
      { typ: "luecke", t: "who oder which? Wähle aus.", tipp: "Person → who · Ding oder Tier → which",
        items: ["A pilot is someone {{who|which}} flies planes.", "A moose is an animal {{which|who}} lives in the forests of Canada.", "A hockey stick is something {{which|who}} players need.",
                "I know a girl {{who|which}} speaks four languages.", "Maple syrup is a sweet liquid {{which|who}} comes from trees.", "We have a neighbour {{who|which}} plays in a band."] },
      { typ: "paare", t: "Was gehört zusammen? Baue die Erklärungen.",
        paare: [["A teacher is someone", "who works in a school."], ["A dentist is a person", "who looks after your teeth."], ["A bike is a vehicle", "which has two wheels."],
                ["A password is a secret word", "which protects your account."], ["A baker is someone", "who makes bread and cakes."], ["An app is a program", "which runs on your phone."]] },

      { typ: "markieren", davor: "Teil 2 · Relativsätze erkennen und bauen", t: "Markiere den ganzen Relativsatz.", stiftName: "Relativsatz", tipp: "Er beginnt mit who, which oder that und beschreibt das Wort davor.",
        items: ["The woman [who works at the vet's] is very kind.", "I like videos [which make me laugh].", "The boy [that sits behind me] plays ice hockey.", "This is the shop [which sells cheap games]."] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Der Relativsatz steht direkt hinter dem Nomen, das er beschreibt.",
        items: [{ teile: ["I", "have", "a friend", "who", "plays ice hockey."] }, { teile: ["This is", "the app", "which", "helps me", "with maths."] },
                { teile: ["She", "is", "the vet", "who", "helped my dog."] }] },
      { typ: "luecke", t: "Schreibe das richtige Wort in die Lücke.", tipp: "Bei Personen who oder that, bei Dingen which oder that. Alles, was passt, ist richtig.",
        items: ["A cook is a person [[who|that]] works in a kitchen.", "A tutorial is a video [[which|that]] shows you how to do something.", "An oven is a machine [[which|that]] bakes bread.",
                "A lifeguard is someone [[who|that]] watches the swimmers.", "Ice hockey is a game [[which|that]] is played on ice."] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { f: "Welcher Satz ist richtig?", o: ["The dog that barks all night belongs to our neighbour.", "The dog who barks all night belongs to our neighbour.", "The dog who it barks all night belongs to our neighbour."], a: 0, e: "Ein Hund ist ein Tier → which oder that. Das Pronomen it fällt weg." },
          { f: "Welcher Satz ist richtig?", o: ["She's the girl who helped me.", "She's the girl which helped me.", "She's the girl who she helped me."], a: 0, e: "Personen → who. Das Pronomen she fällt weg." },
          { f: "Welcher Satz ist richtig?", o: ["I need a phone which takes good photos.", "I need a phone who takes good photos.", "I need a phone, which takes good photos."], a: 0, e: "Ein Handy ist eine Sache → which; und es steht kein Komma davor." }
        ] },

      { typ: "wahl", davor: "Teil 3 · Komma, Sätze verbinden, Fragen", t: "Mit oder ohne Komma?", mischen: true, tipp: "Im Englischen steht vor who, which, that hier kein Komma.",
        items: [
          { f: "Das ist die Tierärztin, die meinen Hund behandelt hat.", o: ["This is the vet who treated my dog.", "This is the vet, who treated my dog."], a: 0, e: "Kein Komma vor who." },
          { f: "Ich suche einen Film, der lustig ist.", o: ["I'm looking for a film which is funny.", "I'm looking for a film, which is funny."], a: 0, e: "Kein Komma vor which." },
          { f: "Kennst du den Jungen, der gewonnen hat?", o: ["Do you know the boy who won?", "Do you know the boy, who won?"], a: 0, e: "Kein Komma vor who." }
        ] },
      { typ: "umformen", t: "Verbinde die beiden Sätze mit who, which oder that.", tipp: "she, he, it, they fällt weg.",
        items: [
          { s: "I know a boy. He plays in an ice hockey team.", l: ["I know a boy who plays in an ice hockey team.", "I know a boy that plays in an ice hockey team."] },
          { s: "This is a tutorial. It explains the new app.", l: ["This is a tutorial which explains the new app.", "This is a tutorial that explains the new app."] },
          { s: "We met a girl. She comes from Vancouver.", l: ["We met a girl who comes from Vancouver.", "We met a girl that comes from Vancouver."] }
        ] },
      { typ: "luecke", t: "Fragen mit Relativsatz: who oder which?", tipp: "Person → who · Ding → which.",
        items: ["Is this the app {{which|who}} helps you?", "Is she the girl {{who|which}} won the race?", "Do you know a person {{who|which}} speaks Inuktitut?", "Is that the tutorial {{which|who}} helped you?"] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "Zuerst die Frage, dann das Nomen, dann der Relativsatz.",
        items: [{ teile: ["Is", "this", "the video", "which", "made you laugh?"] }, { teile: ["Do", "you", "know", "someone", "who", "speaks French?"] },
                { teile: ["Is", "that", "the girl", "who", "won the race?"] }] },
      { typ: "wahl", t: "Welche Erklärung passt?", mischen: true,
        items: [
          { f: "What is a farmer?", o: ["Someone who grows food.", "Someone who bakes bread.", "Someone who flies planes."], a: 0, e: "Ein Bauer baut Lebensmittel an." },
          { f: "What is a reporter?", o: ["Someone who writes news stories.", "Someone who sells shoes.", "Someone who builds houses."], a: 0, e: "Ein Reporter schreibt Berichte." },
          { f: "What is a map?", o: ["A drawing which shows where places are.", "A tool which cuts paper.", "A bag which you wear on your head."], a: 0, e: "Eine Karte zeigt, wo Orte liegen." }
        ] }
    ],
    plus: [
      { typ: "wahl", t: "Ein Satz ist falsch. Welcher?", mischen: true, tipp: "Achte auf: who für Dinge? ein Komma? ein doppeltes Pronomen?",
        items: [
          { f: "Welcher Satz ist falsch?", o: ["I have a cousin who lives in Toronto.", "I have a cousin, who lives in Toronto.", "I have a cousin that lives in Toronto."], a: 1, e: "Im Englischen steht hier kein Komma vor who." },
          { f: "Welcher Satz ist falsch?", o: ["It's a game which makes me happy.", "It's a game that makes me happy.", "It's a game who makes me happy."], a: 2, e: "game ist eine Sache → which oder that, nicht who." },
          { f: "Welcher Satz ist falsch?", o: ["She's the nurse who looked after me.", "She's the nurse who she looked after me.", "She's the nurse that looked after me."], a: 1, e: "Das Pronomen she fällt weg – es steht schon who." }
        ] },
      { typ: "luecke", t: "Eine Nachricht über ein Praktikum: Schreibe who, which oder that.", tipp: "Person → who oder that · Ding → which oder that.",
        items: ["Hi Aylin! I'm looking for an internship. I want a job [[which|that]] is not boring.", "Last week I met a woman [[who|that]] works as a vet.",
                "She has a clinic [[which|that]] is next to the river.", "I also need a CV [[which|that]] looks good.", "Do you know someone [[who|that]] can help me?"] },
      { typ: "umformen", t: "Verbinde die Sätze. Der Relativsatz kommt in die Mitte.", tipp: "Der Relativsatz steht direkt hinter „The …“.",
        items: [
          { s: "The girl is my cousin. She won the race.", l: ["The girl who won the race is my cousin.", "The girl that won the race is my cousin."] },
          { s: "The video was funny. It showed a dancing dog.", l: ["The video which showed a dancing dog was funny.", "The video that showed a dancing dog was funny."] }
        ] },
      { typ: "frei", t: "Erkläre das Wort mit einem Relativsatz.", tipp: "A … is someone who … / A … is something which …",
        items: [
          { f: "What is a cook?", kriterien: ["ein vollständiger englischer Satz", "Relativsatz mit who oder that", "die Erklärung passt zum Beruf"], muster: "\\bcook\\b.*\\b(who|that)\\b.*\\b(food|meal|meals|kitchen|restaurant|dinner|lunch|breakfast|dish|dishes|cook|cooks|cooking|prepare|prepares|makes|make|work|works)", bsp: "A cook is someone who makes food in a kitchen." },
          { f: "What is a tutorial?", kriterien: ["ein vollständiger englischer Satz", "Relativsatz mit which oder that", "die Erklärung passt"], muster: "\\btutorial\\b.*\\b(which|that)\\b.*\\b(video|show|shows|learn|explain|explains|help|helps|teach|teaches|how|tells|lesson|instructions)", bsp: "A tutorial is a video which shows you how to do something." }
        ] },
      { typ: "frei", t: "Schreibe über dich: ein Satz mit who, which oder that.", tipp: "Zum Beispiel: I have a friend who … / I like films which …",
        items: [{ f: "Dein Satz mit Relativsatz:", kriterien: ["ein vollständiger englischer Satz", "Relativsatz mit who, which oder that", "kein Komma davor"], muster: "\\b(who|which|that)\\b", bsp: "I have a friend who plays ice hockey." }] }
    ]
  });
  </script>
