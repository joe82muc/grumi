  <script>
  E8MSeite("v");
  Grammatik.seite({
    nr: 1, modul: "e8-m-v1", kurz: "V2",
    titel: "Verben einsetzen: simple past",
    lead: "„Yesterday I **went** to the lake and **swam** for an hour.“ – Wenn etwas vorbei ist, brauchst du die 2. Form des Verbs. Bei unregelmäßigen Verben musst du sie lernen.",
    ziele: ["Du kennst die 2. Form (simple past) der wichtigen unregelmäßigen Verben.", "Du setzt sie in Sätzen richtig ein.", "Du weißt: Nach didn't und Did steht die Grundform."],
    bild: { src: "g/v1-saturday.jpg", alt: "Eine Bildgeschichte in vier Feldern: Ein Mädchen in einem roten T-Shirt fährt mit dem Fahrrad zu einem See, schwimmt im See, sitzt auf dem Steg und isst ein Eis und schläft abends müde auf dem Sofa ein.",
      satz: "Yesterday Nora **rode** her bike to the lake. She **swam**, **ate** an ice cream and later she **fell** asleep on the sofa.",
      de: "Gestern ist Nora mit dem Rad zum See gefahren. Sie ist geschwommen, hat ein Eis gegessen und ist später auf dem Sofa eingeschlafen. Alles ist vorbei – deshalb die 2. Form." },
    merk: [
      { t: "Die 2. Form: Was ist das?", html: `
        <p>Das <b>simple past</b> erzählt von etwas, das <b>vorbei</b> ist: <i>yesterday, last week, in 2023, two days ago.</i></p>
        <p>Regelmäßige Verben bekommen <b>-ed</b>: <i>play → played</i>. Unregelmäßige Verben ändern sich – die Formen musst du lernen:</p>
        <table><tr><th>Grundform</th><th>2. Form</th><th>Grundform</th><th>2. Form</th></tr>
        <tr><td>go</td><td><b>went</b></td><td>come</td><td><b>came</b></td></tr>
        <tr><td>see</td><td><b>saw</b></td><td>write</td><td><b>wrote</b></td></tr>
        <tr><td>eat</td><td><b>ate</b></td><td>have</td><td><b>had</b></td></tr>
        <tr><td>buy</td><td><b>bought</b></td><td>take</td><td><b>took</b></td></tr>
        <tr><td>make</td><td><b>made</b></td><td>be</td><td><b>was / were</b></td></tr></table>
        <p>Alle 66 Verben findest du im Bereich „Unregelmäßige Verben“: im <b>Verben-Trainer</b> und in der <b>Verbenliste zum Abfragen</b>.</p>` },
      { t: "Verneinung und Frage: die Grundform", html: `
        <p>Mit <b>didn't</b> (verneint) und <b>Did</b> (Frage) zeigt schon das Hilfsverb: Es ist vorbei. Deshalb steht das Verb danach in der <b>Grundform</b>.</p>
        <div class="bsp">Aussage: I <b>went</b> to the party. &nbsp;→&nbsp; Verneinung: I <b>didn't go</b> to the party.</div>
        <div class="bsp">Frage: <b>Did</b> you <b>go</b> to the party? – Yes, I did. / No, I didn't.</div>
        <p>Nur <b>eine</b> Stelle zeigt die Vergangenheit – entweder didn't/Did <b>oder</b> die 2. Form.</p>` },
      { t: "Lerntipp: Verben in Familien lernen", html: `
        <p>Viele Verben sehen ähnlich aus. Lerne sie als Gruppe, dann geht es schneller:</p>
        <ul class="wb-liste">
        <li><b>-ought / -aught</b><span>buy → bought, bring → brought, think → thought, catch → caught, teach → taught</span></li>
        <li><b>i → a</b><span>sing → sang, ring → rang, swim → swam, drink → drank, begin → began</span></li>
        <li><b>o in der Mitte</b><span>drive → drove, ride → rode, write → wrote, speak → spoke, choose → chose</span></li>
        <li><b>bleibt gleich</b><span>put → put, cost → cost, hit → hit, hurt → hurt, read → read</span></li>
        <li><b>-t am Ende</b><span>build → built, send → sent, spend → spent, keep → kept, sleep → slept</span></li></ul>` }
    ],
    fallen: [
      "Die 2. Form gibt es nur einmal: Nicht: ~~I goed~~ home. Sondern: I **went** home.",
      "Nach **didn't** steht die Grundform: Nicht: ~~I didn't went~~ to school. Sondern: I didn't **go** to school.",
      "Auch in der Frage bleibt die Grundform: Nicht: ~~Did you saw~~ him? Sondern: Did you **see** him?"
    ],
    basis: [
      { typ: "paare", davor: "Teil 1 · Formen erkennen", t: "Welche 2. Form gehört zu welcher Grundform?", tipp: "Die Tabelle „Die 2. Form: Was ist das?“ oben hilft dir.",
        paare: [["go", "went"], ["see", "saw"], ["eat", "ate"], ["buy", "bought"], ["take", "took"], ["make", "made"], ["give", "gave"], ["write", "wrote"]] },
      { typ: "paare", t: "Noch einmal: Verbinde Grundform und 2. Form.", tipp: "Denke an die Familien: think → thought, teach → taught, swim → swam, drive → drove.",
        paare: [["come", "came"], ["sing", "sang"], ["swim", "swam"], ["drive", "drove"], ["speak", "spoke"], ["think", "thought"], ["teach", "taught"], ["win", "won"]] },
      { typ: "zuordnen", t: "Ordne die Verben nach der Form der 2. Form.", tipp: "Überlege: Wie heißt die 2. Form? Ändert sich ein Selbstlaut (i → a)? Endet sie auf -ought oder -aught? Oder bleibt alles gleich?",
        gruppen: ["2. Form = Grundform", "2. Form mit -ought / -aught", "2. Form mit a"],
        karten: [["put", 0], ["cost", 0], ["hit", 0], ["hurt", 0], ["buy", 1], ["bring", 1], ["catch", 1], ["teach", 1], ["sing", 2], ["swim", 2], ["drink", 2], ["begin", 2]] },
      { typ: "wahl", t: "Welche Form passt in den Satz?", mischen: true, tipp: "Es ist vorbei (yesterday, last week) – du brauchst die 2. Form. Die Wörter „goed“ oder „buyed“ gibt es nicht.",
        items: [
          { s: "Mia ___ to school by bike yesterday.", o: ["went", "goed", "gone"], a: 0, e: "go → went. „goed“ gibt es nicht, „gone“ ist die 3. Form." },
          { s: "Last week I ___ a new phone.", o: ["bought", "buyed", "buy"], a: 0, e: "buy → bought." },
          { s: "We ___ a great film on Saturday.", o: ["saw", "seen", "seed"], a: 0, e: "see → saw. „seen“ ist die 3. Form." },
          { s: "He ___ his homework after lunch yesterday.", o: ["did", "done", "doed"], a: 0, e: "do → did. „done“ ist die 3. Form." }
        ] },

      { typ: "luecke", davor: "Teil 2 · Einsetzen Satz für Satz", t: "Verben mit -ought / -aught: Setze die 2. Form ein.", tipp: "buy → bought, bring → brought, think → thought, catch → caught, teach → taught, fight → fought.",
        items: ["Mia [[bought]] a new pencil case yesterday. (buy)", "Omar [[brought]] his football to school this morning. (bring)", "We [[thought]] the film was too long. (think)",
                "The goalkeeper [[caught]] the ball. (catch)", "Our teacher [[taught]] us a new song last Friday. (teach)", "The two dogs [[fought]] over a bone yesterday. (fight)"] },
      { typ: "luecke", t: "Verben mit a: Setze die 2. Form ein.", tipp: "i → a: sing → sang, ring → rang, swim → swam, drink → drank, begin → began, sit → sat. Und run → ran.",
        items: ["The choir [[sang]] three songs at the party. (sing)", "The school bell [[rang]] at eight o'clock this morning. (ring)", "Noah [[swam]] 200 metres in the pool last Saturday. (swim)",
                "We [[drank]] orange juice at the picnic yesterday. (drink)", "The lesson [[began]] at half past eight this morning. (begin)", "Yusuf [[ran]] home in the rain yesterday. (run)", "Elif [[sat]] next to me on the bus this morning. (sit)"] },
      { typ: "luecke", t: "Verben mit o: Setze die 2. Form ein.", tipp: "drive → drove, ride → rode, write → wrote, speak → spoke, wake up → woke up, choose → chose. Bei wake up schreibst du beide Wörter.",
        items: ["My uncle [[drove]] us to the lake last Sunday. (drive)", "Dana [[rode]] her scooter to school yesterday. (ride)", "Hannah [[wrote]] a postcard from Rome last week. (write)",
                "The guide [[spoke]] very slowly on our tour yesterday. (speak)", "I [[woke up]] late on Saturday. (wake up)", "Leo [[chose]] a pizza with cheese yesterday. (choose)"] },
      { typ: "luecke", t: "Weitere Verben: Setze die 2. Form ein.", tipp: "fly → flew, throw → threw, shake → shook, wear → wore, fall → fell, know → knew, eat → ate, win → won.",
        items: ["We [[flew]] to Rome in April. (fly)", "Carla [[threw]] the ball over the fence yesterday. (throw)", "Ben [[shook]] the bottle before he opened it. (shake)",
                "Aylin [[wore]] her new jacket yesterday. (wear)", "The vase [[fell]] off the shelf last night. (fall)", "At the concert last week Yusuf [[knew]] every word of the song. (know)",
                "Dana [[ate]] two slices of pizza at lunch yesterday. (eat)", "Hannah [[won]] first prize in the quiz last week. (win)"] },
      { typ: "luecke", t: "Die 2. Form sieht aus wie die Grundform. Setze sie ein.", tipp: "put, cost, hit, hurt, read: Die 2. Form schreibt man genau gleich. (Bei read spricht man sie anders: [red].)",
        items: ["Nora [[put]] her books into her bag this morning. (put)", "The new phone [[cost]] 300 euros last month. (cost)", "Yesterday Milan [[hit]] the ball into the net. (hit)",
                "Luca fell off the wall and [[hurt]] his arm. (hurt)", "Last night I [[read]] two chapters of my book. (read)"] },
      { typ: "luecke", t: "Verben mit -t oder -d: Setze die 2. Form ein.", tipp: "build → built, send → sent, spend → spent, lose → lost, keep → kept, sleep → slept, feel → felt, leave → left.",
        items: ["They [[built]] a snowman in the garden last winter. (build)", "Sofia [[sent]] a message to her cousin yesterday. (send)", "We [[spent]] last weekend at my grandma's. (spend)",
                "Our team [[lost]] the final 2–1 last Sunday. (lose)", "When she was little, Elif [[kept]] the old photos in a box. (keep)", "The baby [[slept]] for three hours yesterday. (sleep)",
                "Jonas [[felt]] ill after the long trip yesterday. (feel)", "The train [[left]] two minutes early this morning. (leave)"] },
      { typ: "luecke", t: "Noch mehr Verben mit -t oder -d: Setze die 2. Form ein.", tipp: "meet → met, feed → fed, hold → held, stand → stood, sell → sold, tell → told, pay → paid.",
        items: ["We [[met]] Emre at the station yesterday. (meet)", "Lena [[fed]] the ducks in the park yesterday. (feed)", "Aylin [[held]] the door for her granny this morning. (hold)",
                "The old man [[stood]] at the bus stop for ages yesterday. (stand)", "Milan [[sold]] his old bike online last week. (sell)", "Our teacher [[told]] us to be quiet this morning. (tell)",
                "Dad [[paid]] for the pizza yesterday. (pay)"] },
      { typ: "luecke", t: "Und weitere wichtige Verben: Setze die 2. Form ein.", tipp: "say → said, hear → heard, understand → understood, mean → meant, deal with → dealt with, swing → swung, forget → forgot, become → became.",
        items: ["„Thank you,“ she [[said]] and smiled. (say)", "We [[heard]] thunder last night. (hear)", "Nobody [[understood]] the question in the test yesterday. (understand)",
                "Sorry, I [[meant]] Tuesday, not Monday. (mean)", "Our class [[dealt]] with the topic of recycling last week. (deal with)", "The children [[swung]] on the swings for an hour yesterday. (swing)",
                "Carla [[forgot]] her umbrella this morning. (forget)", "The weather [[became]] colder yesterday evening. (become)"] },
      { typ: "luecke", t: "Häufige Verben (1): Setze die 2. Form ein.", tipp: "go → went, come → came, see → saw, do → did, have → had, find → found.",
        items: ["Last summer we [[went]] to Austria. (go)", "Nora [[came]] home late yesterday. (come)", "Yesterday we [[saw]] an elephant at the zoo. (see)",
                "Leo [[did]] his homework at the kitchen table yesterday. (do)", "We [[had]] pasta for dinner last night. (have)", "Ben [[found]] a wallet on the pavement yesterday. (find)"] },
      { typ: "luecke", t: "Häufige Verben (2): Setze die 2. Form ein.", tipp: "make → made, take → took, give → gave, get → got. Bei be: I / he / she / it → was, we / you / they → were.",
        items: ["Mum [[made]] a big salad for lunch yesterday. (make)", "Aylin [[took]] a lot of photos at the party last Saturday. (take)", "My friends [[gave]] me a game for my birthday last week. (give)",
                "Omar [[got]] a good mark in the English test yesterday. (get)", "I [[was]] very tired after school yesterday. (be)", "My parents [[were]] in Berlin last weekend. (be)"] },

      { typ: "luecke", davor: "Teil 3 · Verneinung und Frage", t: "didn't oder Did: Wähle die richtige Form.", tipp: "Nach didn't und Did steht die Grundform – nie die 2. Form.",
        items: ["I didn't {{go|went}} to school on Sunday.", "Did you {{see|saw}} the match?", "She didn't {{buy|bought}} anything.",
                "Did Omar {{eat|ate}} the last piece?", "We didn't {{have|had}} much time.", "They didn't {{come|came}} to the party."] },
      { typ: "luecke", t: "Schreibe das Verb in der richtigen Form: nach didn't und Did kommt die Grundform.", tipp: "Das Verb in Klammern steht in der Grundform. Schreibe es genau so.",
        items: ["Mia didn't [[take]] her umbrella. (take)", "Did you [[write]] to him? (write)", "He didn't [[say]] a word. (say)",
                "Did they [[win]] the match? (win)", "We didn't [[sleep]] well. (sleep)", "Did Lena [[sing]] in the show? (sing)"] },
      { typ: "bauen", t: "Baue die Sätze und Fragen.", tipp: "Nach didn't / did kommt die Grundform. Das Fragewort steht ganz vorn.",
        items: [{ teile: ["I", "didn't", "go", "to", "the", "party."] }, { teile: ["She", "didn't", "see", "the", "film."] }, { teile: ["Did", "you", "buy", "a", "ticket?"] },
                { teile: ["What", "did", "he", "say?"] }, { teile: ["Where", "did", "they", "go", "yesterday?"] }, { teile: ["We", "didn't", "have", "any", "time."] }] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Samstag am See: Setze die 2. Form ein.", tipp: "Die Geschichte ist vorbei – du brauchst überall die 2. Form. Schau dir das Bild oben an.",
        items: ["On Saturday morning Nora [[woke up]] early. (wake up)", "She [[rode]] her bike to the lake. (ride)", "The water was cold, but she [[swam]] for half an hour. (swim)",
                "Then she [[sat]] on the pier and [[ate]] an ice cream. (sit, eat)", "In the afternoon she [[came]] home. (come)",
                "In the evening Nora [[fell]] asleep on the sofa. (fall)"] },
      { typ: "luecke", t: "Der verpasste Bus: Setze die 2. Form ein.", tipp: "Alles ist passiert – setze immer die 2. Form ein. Bei get: got, bei see: saw.",
        items: ["On Monday Jonas [[slept]] too long. (sleep)", "He [[got]] dressed in two minutes. (get)", "He [[took]] his bag and [[ran]] to the bus stop. (take, run)",
                "But he only [[saw]] the back of the bus. (see)", "He [[felt]] angry and [[sent]] a message to his teacher. (feel, send)",
                "In the end his dad [[drove]] him to school. (drive)"] },
      { typ: "luecke", t: "Regelmäßig oder unregelmäßig? Setze beide Verben in die 2. Form.", tipp: "Regelmäßige Verben bekommen -ed (watch → watched). Unregelmäßige musst du kennen (go → went).",
        items: ["Last night we [[watched]] a film and then we [[went]] to bed. (watch, go)", "Yesterday Mia [[cooked]] pasta and Ben [[made]] a salad. (cook, make)",
                "Yesterday I [[played]] football and then I [[ate]] two bananas. (play, eat)", "Last night Aylin [[called]] me and [[told]] me the news. (call, tell)"] },
      { typ: "wahl", t: "Finde den Fehler: Welcher Satz ist richtig?", mischen: true, tipp: "Es gibt nur eine Stelle für die Vergangenheit: die 2. Form – oder didn't / Did mit der Grundform.",
        items: [
          { f: "Nora ist gestern ins Kino gegangen.", o: ["Nora went to the cinema yesterday.", "Nora goed to the cinema yesterday.", "Nora gone to the cinema yesterday."], a: 0, e: "go → went. „goed“ gibt es nicht." },
          { f: "Er hat das Schild nicht gesehen.", o: ["He didn't see the sign.", "He didn't saw the sign.", "He not saw the sign."], a: 0, e: "Nach didn't steht die Grundform: see." },
          { f: "Wir haben Eis gekauft.", o: ["We bought ice cream.", "We buyed ice cream.", "We did bought ice cream."], a: 0, e: "buy → bought, ganz ohne did." },
          { f: "Hast du die E-Mail geschrieben?", o: ["Did you write the email?", "Did you wrote the email?", "You did wrote the email?"], a: 0, e: "Frage mit Did + Grundform: write." }
        ] },
      { typ: "frei", t: "Schreibe über gestern oder über das letzte Wochenende: zwei Sätze mit der 2. Form.", tipp: "Nimm Verben aus der Liste. Denke an die 2. Form, zum Beispiel: went, saw, ate, bought, met, took, had, made, gave.",
        items: [
          { f: "Schreibe einen Satz mit **go**, **see**, **eat** oder **buy**.", kriterien: ["2. Form eines der Verben (went, saw, ate, bought)", "Satz über etwas Vergangenes, z. B. mit yesterday"], muster: "\\b(went|saw|ate|bought)\\b", bsp: "Yesterday I went to the park with my friends." },
          { f: "Schreibe einen Satz mit **meet**, **take**, **have**, **make** oder **give**.", kriterien: ["2. Form eines der Verben (met, took, had, made, gave)", "Satz über etwas Vergangenes, z. B. mit last weekend"], muster: "\\b(met|took|had|made|gave)\\b", bsp: "Last weekend we had a barbecue." }
        ] }
    ]
  });
  </script>
