  <title>V3 · Verben einsetzen: 3. Form | Englisch 8M</title>
  <meta name="description" content="Englisch 8M, unregelmäßige Verben: die 3. Form (past participle) im present perfect und im Passiv einsetzen – Formen erkennen, Satz für Satz einsetzen, alle drei Formen üben.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>

  <script>
  E8MSeite("v");
  Grammatik.seite({
    nr: 2, modul: "e8-m-v2", kurz: "V3",
    titel: "Verben einsetzen: 3. Form",
    lead: "„Someone **has eaten** the cake!“ – Die 3. Form (past participle) brauchst du nach have / has im present perfect und nach is / was im Passiv.",
    ziele: ["Du kennst die 3. Form der wichtigen unregelmäßigen Verben.", "Du setzt sie im present perfect (have / has + 3. Form) richtig ein.", "Du setzt sie im Passiv (is / was + 3. Form) richtig ein."],
    bild: { src: "g/v2-cake.jpg", alt: "Eine Küche: Auf dem Tisch steht ein Kuchenteller mit nur noch Krümeln und einem kleinen Stück. Unter dem Tisch sitzt ein Hund mit Sahne an der Schnauze und schaut unschuldig. Im Hintergrund stehen zwei überraschte Geschwister am Kühlschrank, das Mädchen zeigt auf den Teller.",
      satz: "Someone **has eaten** the cake! – The children **have found** only crumbs on the plate.",
      de: "Jemand hat den Kuchen gegessen! – Die Kinder haben nur noch Krümel auf dem Teller gefunden. Man sieht das Ergebnis jetzt – deshalb present perfect mit der 3. Form." },
    merk: [
      { t: "Die 3. Form: Was ist das?", html: `
        <p>Die 3. Form heißt auch <b>past participle</b>. Regelmäßige Verben bekommen <b>-ed</b> (<i>played</i>). Bei unregelmäßigen Verben musst du sie lernen:</p>
        <table><tr><th>Grundform</th><th>2. Form</th><th>3. Form</th></tr>
        <tr><td>go</td><td>went</td><td><b>gone</b></td></tr>
        <tr><td>see</td><td>saw</td><td><b>seen</b></td></tr>
        <tr><td>eat</td><td>ate</td><td><b>eaten</b></td></tr>
        <tr><td>write</td><td>wrote</td><td><b>written</b></td></tr>
        <tr><td>take</td><td>took</td><td><b>taken</b></td></tr>
        <tr><td>do</td><td>did</td><td><b>done</b></td></tr>
        <tr><td>buy</td><td>bought</td><td><b>bought</b></td></tr>
        <tr><td>make</td><td>made</td><td><b>made</b></td></tr>
        <tr><td>be</td><td>was / were</td><td><b>been</b></td></tr>
        <tr><td>get</td><td>got</td><td><b>got</b> (USA: gotten)</td></tr></table>
        <p>Alle 66 Verben findest du im Bereich „Unregelmäßige Verben“: im <b>Verben-Trainer</b> und in der <b>Verbenliste zum Abfragen</b>.</p>` },
      { t: "Wann brauchst du die 3. Form?", html: `
        <div class="bsp"><b>Present perfect:</b> have / has + 3. Form<br><i>I have never <b>seen</b> a whale. – She has already <b>eaten</b>.</i></div>
        <div class="bsp"><b>Passiv:</b> is / are / was / were + 3. Form<br><i>English is <b>spoken</b> in many countries. – The school was <b>built</b> in 1965.</i></div>
        <p>Signalwörter im present perfect: <b>already</b> (schon), <b>just</b> (gerade eben), <b>never</b> (noch nie), <b>ever</b> (jemals), <b>not … yet</b> (noch nicht).</p>
        <p>Vorsicht: Bei <i>yesterday</i> oder <i>last week</i> brauchst du die <b>2.</b> Form: I <b>saw</b> him yesterday.</p>` },
      { t: "Lerntipp: Verben in Familien lernen", html: `
        <p>Wenn du die drei Formen als Gruppe lernst, merkst du sie dir leichter:</p>
        <ul class="wb-liste">
        <li><b>2. = 3. Form</b><span>buy → bought → bought, find → found → found, make → made → made, tell → told → told</span></li>
        <li><b>3. Form auf -n</b><span>eat → eaten, take → taken, give → given, write → written, speak → spoken</span></li>
        <li><b>i – a – u</b><span>sing → sang → sung, swim → swam → swum, drink → drank → drunk, begin → began → begun</span></li>
        <li><b>alle drei gleich</b><span>put – put – put, cost – cost – cost, hit – hit – hit, hurt – hurt – hurt</span></li>
        <li><b>1. = 3. Form</b><span>come → came → come, run → ran → run, become → became → become</span></li></ul>` }
    ],
    fallen: [
      "Die 3. Form ist nicht die Grundform und nicht die 2. Form: Nicht: ~~I have went~~ home. Sondern: I have **gone** home.",
      "Nicht: ~~He has ate~~ the cake. Sondern: He has **eaten** the cake. (ate = 2. Form, eaten = 3. Form)",
      "Das Wort ~~goed~~ gibt es nicht. Auch ~~buyed~~ oder ~~writed~~ sind falsch – lerne die richtige Form."
    ],
    basis: [
      { typ: "paare", davor: "Teil 1 · Formen erkennen", t: "Welche 3. Form gehört zu welcher Grundform?", tipp: "Die Tabelle „Die 3. Form: Was ist das?“ oben hilft dir. Viele 3. Formen enden auf -n.",
        paare: [["go", "gone"], ["see", "seen"], ["eat", "eaten"], ["write", "written"], ["take", "taken"], ["give", "given"], ["do", "done"], ["know", "known"]] },
      { typ: "paare", t: "Noch einmal: Verbinde Grundform und 3. Form.", tipp: "Denke an die Familien: sing – sung, swim – swum, drive – driven, speak – spoken.",
        paare: [["be", "been"], ["buy", "bought"], ["drive", "driven"], ["speak", "spoken"], ["swim", "swum"], ["win", "won"], ["sing", "sung"], ["choose", "chosen"]] },
      { typ: "zuordnen", t: "Ist die 3. Form gleich der 2. Form oder anders?", tipp: "Sprich die drei Formen leise: buy – bought – bought (gleich), go – went – gone (anders).",
        gruppen: ["3. Form = 2. Form", "3. Form ist anders"],
        karten: [["buy", 0], ["find", 0], ["make", 0], ["tell", 0], ["meet", 0], ["sell", 0], ["go", 1], ["see", 1], ["eat", 1], ["write", 1], ["take", 1], ["give", 1]] },
      { typ: "wahl", t: "Welche Form passt in den Satz?", mischen: true, tipp: "Nach have / has brauchst du die 3. Form. „goed“, „writed“ und „eated“ gibt es nicht.",
        items: [
          { s: "She has ___ to Rome.", o: ["gone", "went", "goed"], a: 0, e: "go – went – gone: nach has die 3. Form." },
          { s: "Have you ever ___ sushi?", o: ["eaten", "ate", "eated"], a: 0, e: "eat – ate – eaten." },
          { s: "He has ___ a letter to his gran.", o: ["written", "wrote", "writed"], a: 0, e: "write – wrote – written." },
          { s: "We have ___ a new sofa.", o: ["bought", "buyed", "buy"], a: 0, e: "buy – bought – bought." }
        ] },

      { typ: "luecke", davor: "Teil 2 · Present perfect", t: "have / has steht schon da. Setze die 3. Form ein (1).", tipp: "have / has + 3. Form. go – went – gone, see – saw – seen, eat – ate – eaten, do – did – done, have – had – had, be – was/were – been.",
        items: ["Nora has already [[gone]] to bed. (go)", "I have never [[seen]] a whale. (see)", "We have just [[eaten]] lunch. (eat)", "Have you [[done]] your homework yet? (do)",
                "My cousin has [[had]] a cold for three days. (have)", "Have you ever [[been]] to Hamburg? (be)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (2).", tipp: "Bei diesen Verben ist die 3. Form gleich der 2. Form: bought, brought, thought, caught, taught, fought, built, found.",
        items: ["Mia has just [[bought]] a new bag. (buy)", "Have you [[brought]] your swimming things? (bring)", "I have never [[thought]] about that. (think)",
                "The police have [[caught]] the thief. (catch)", "Mr Berger has [[taught]] at our school for ten years. (teach)", "My two cats have never [[fought]]. (fight)",
                "Dad has already [[built]] a new shelf. (build)", "Has Dana [[found]] her glasses yet? (find)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (3): i – a – u.", tipp: "begin – began – begun, drink – drank – drunk, sing – sang – sung, ring – rang – rung, swim – swam – swum, run – ran – run, sit – sat – sat, win – won – won.",
        items: ["The concert hasn't [[begun]] yet. (begin)", "Have you [[drunk]] enough water today? (drink)", "She has never [[sung]] in front of people. (sing)",
                "The phone has [[rung]] three times. (ring)", "I have never [[swum]] in a river. (swim)", "Yusuf has [[run]] ten kilometres today. (run)",
                "They have [[sat]] on the bench for two hours. (sit)", "Has your team ever [[won]] a trophy? (win)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (4): Verben mit -en.", tipp: "drive → driven, ride → ridden, write → written, speak → spoken, wake up → woken up, choose → chosen, fly → flown.",
        items: ["My mum has never [[driven]] a bus. (drive)", "Have you ever [[ridden]] a camel? (ride)", "Omar has [[written]] a poem for his gran. (write)",
                "We have never [[spoken]] to the new teacher. (speak)", "Dad hasn't [[woken up]] yet. (wake up)", "Have you [[chosen]] a present for Mia yet? (choose)",
                "I have never [[flown]] in a helicopter. (fly)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (5): noch mehr Verben mit -n.", tipp: "throw → thrown, shake → shaken, wear → worn, fall → fallen, know → known, take → taken, give → given.",
        items: ["Who has [[thrown]] paper on the floor? (throw)", "Have you [[shaken]] the juice? (shake)", "Elif has never [[worn]] a suit. (wear)",
                "A lot of leaves have [[fallen]] from the trees. (fall)", "How long have you [[known]] Dana? (know)", "Ben has [[taken]] a lot of photos today. (take)",
                "Grandpa has [[given]] me ten euros. (give)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (6): Verben mit -t und -d.", tipp: "keep → kept, sleep → slept, feel → felt, leave → left, lose → lost, meet → met, feed → fed, hold → held. Die 3. Form ist gleich der 2. Form.",
        items: ["Dad has [[kept]] all his old football cards. (keep)", "The baby has [[slept]] since lunch. (sleep)", "I have never [[felt]] so cold. (feel)",
                "Oh no, I have [[left]] my jacket on the bus! (leave)", "Our team has never [[lost]] at home. (lose)", "Hannah hasn't [[met]] my cousin yet. (meet)",
                "Have you [[fed]] the fish today? (feed)", "Mia has [[held]] a snake before. (hold)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (7): noch mehr Verben mit -t und -d.", tipp: "stand → stood, send → sent, spend → spent, sell → sold, tell → told, pay → paid, say → said, hear → heard.",
        items: ["My brother has [[stood]] in the queue for an hour. (stand)", "Aylin has [[sent]] me three emails today. (send)", "Luca has [[spent]] ten euros on sweets. (spend)",
                "Have they already [[sold]] the house? (sell)", "Have you [[told]] your parents about it? (tell)", "Dad has already [[paid]] the bill. (pay)",
                "The teacher has [[said]] that we can go home early. (say)", "Have you [[heard]] this song before? (hear)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (8): wichtige Verben.", tipp: "Bei get geht auch gotten (USA). Vergleiche: come – came – come, become – became – become, forget – forgot – forgotten.",
        items: ["I haven't [[understood]] the last question. (understand)", "I have never [[meant]] to hurt anyone. (mean)", "Our class has [[dealt]] with this topic before. (deal with)",
                "Omar has [[got|gotten]] a new bike. (get)", "Mum has [[made]] a cake for us. (make)", "Look! The bus has [[come]]. (come)",
                "Nora has [[become]] a good swimmer. (become)", "I have [[forgotten]] my password. (forget)"] },
      { typ: "luecke", t: "Setze die 3. Form ein (9): die Form bleibt gleich oder fast gleich.", tipp: "put – put – put, read – read – read, hit – hit – hit, hurt – hurt – hurt, cost – cost – cost, swing – swung – swung.",
        items: ["Where have you [[put]] my glasses? (put)", "Have you [[read]] this book? (read)", "The ball has [[hit]] the neighbour's window. (hit)",
                "Ben has [[hurt]] his foot. (hurt)", "The new phone has [[cost]] a lot of money. (cost)", "The kids have [[swung]] on the rope for hours. (swing)"] },
      { typ: "luecke", t: "Jetzt tippst du have / has und die 3. Form zusammen.", tipp: "Du darfst auch die Kurzform schreiben: 's eaten, 've seen. Bei he, she, it, Someone, Mia heißt es has.",
        items: ["Look! The dog [[has taken|'s taken]] my slipper. (take)", "We [[have seen|'ve seen]] that film twice. (see)", "Mia [[has gone|'s gone]] home. (go)",
                "I [[haven't done|have not done]] my homework yet. (do)", "[[Has]] Leo [[written]] the email yet? (write)"] },

      { typ: "luecke", davor: "Teil 3 · Passiv", t: "is / are steht schon da. Setze die 3. Form ein.", tipp: "Passiv: is / are + 3. Form. Die Sache wird gemacht, man nennt nicht, wer es tut.",
        items: ["Spanish is [[spoken]] in Mexico. (speak)", "These T-shirts are [[made]] in Portugal. (make)", "Fresh bread is [[sold]] in this shop. (sell)",
                "Many letters are [[sent]] every day. (send)", "Rice is [[eaten]] in many countries. (eat)", "Warm clothes are [[worn]] in winter. (wear)"] },
      { typ: "luecke", t: "was / were steht schon da. Setze die 3. Form ein.", tipp: "Passiv in der Vergangenheit: was / were + 3. Form.",
        items: ["Our sports hall was [[built]] in 1998. (build)", "The photos were [[taken]] by my aunt. (take)", "The winner was [[given]] a big cup. (give)",
                "The lost dog was [[found]] in a park. (find)", "A fox was [[seen]] near the school yesterday. (see)", "The song was [[sung]] by the whole class. (sing)"] },
      { typ: "luecke", t: "is / are oder was / were? Wähle aus und setze die 3. Form ein.", tipp: "Eine Sache (cake, room) → is / was. Mehrere Sachen (photos, keys) → are / were.",
        items: ["The cake {{was|were}} [[eaten]] in five minutes. (eat)", "The keys {{were|was}} [[left]] on the table. (leave)", "The room {{is|are}} [[kept]] very clean. (keep)",
                "Two new songs {{were|was}} [[sung]] by the choir. (sing)", "Many shoes {{are|is}} [[sold]] in this shop. (sell)"] }
    ],
    plus: [
      { typ: "luecke", t: "Alle drei Formen: Ergänze die 2. und die 3. Form.", tipp: "Wenn du unsicher bist, schau in die Tabelle oben. be hat zwei 2. Formen: was oder were – schreibe eine davon.",
        items: ["go – [[went]] – [[gone]]", "see – [[saw]] – [[seen]]", "eat – [[ate]] – [[eaten]]", "write – [[wrote]] – [[written]]", "buy – [[bought]] – [[bought]]",
                "drive – [[drove]] – [[driven]]", "sing – [[sang]] – [[sung]]", "begin – [[began]] – [[begun]]", "speak – [[spoke]] – [[spoken]]", "be – [[was|were]] – [[been]]"] },
      { typ: "luecke", t: "2. oder 3. Form? Wähle aus.", tipp: "Mit yesterday, last year, last week: 2. Form. Nach have / has: 3. Form.",
        items: ["I {{saw|seen}} him yesterday.", "I have {{seen|saw}} him in town.", "Last year we {{flew|flown}} to Spain.", "We have never {{flown|flew}} in a plane.",
                "Nora {{wrote|written}} me a card last week.", "She has {{written|wrote}} me three cards.", "They {{ate|eaten}} pizza on Friday.", "Have you {{eaten|ate}} yet?"] },
      { typ: "luecke", t: "Eine E-Mail aus Italien: Setze die 3. Form ein.", tipp: "Meistens have / has + 3. Form. Beim letzten Satz tippst du have / has mit.",
        items: ["Hi Dana! I have just [[come]] back from my holiday. (come)", "We have [[spent]] ten days in Italy. (spend)", "I have [[eaten]] so much pizza! (eat)",
                "My brother has [[swum]] in the sea every day. (swim)", "I have [[written]] you a postcard, but I haven't [[sent]] it yet. (write, send)",
                "Have you [[heard]] from Luca? (hear)", "Dad [[has taken|'s taken]] 300 photos! (take)"] },
      { typ: "wahl", t: "Finde den Fehler: Welcher Satz ist richtig?", mischen: true, tipp: "Nach have / has steht die 3. Form. Bei he, she, it heißt es has.",
        items: [
          { f: "Sie hat alle Kekse gegessen.", o: ["She has eaten all the cookies.", "She has ate all the cookies.", "She have eaten all the cookies."], a: 0, e: "eat – ate – eaten; she → has." },
          { f: "Wir haben den Film gesehen.", o: ["We have seen that film.", "We have saw that film.", "We has seen that film."], a: 0, e: "see – saw – seen; we → have." },
          { f: "Hat er seine Hausaufgaben gemacht?", o: ["Has he done his homework?", "Has he did his homework?", "Have he done his homework?"], a: 0, e: "do – did – done; he → has." },
          { f: "Ich habe eine Eintrittskarte gekauft.", o: ["I have bought a ticket.", "I have buyed a ticket.", "I has bought a ticket."], a: 0, e: "buy – bought – bought; I → have." }
        ] },
      { typ: "frei", t: "Schreibe über dich: zwei Sätze im present perfect.", tipp: "Zum Beispiel: I have never eaten … / I have never seen … / I have already done … Die 3. Form siehst du in der Tabelle oben.",
        items: [
          { f: "Schreibe einen Satz mit **I have never …** und einem Verb: eat, see, ride, fly oder swim.", kriterien: ["I have never + 3. Form (eaten, seen, ridden, flown, swum)"], muster: "\\b(have|'ve) never (eaten|seen|ridden|flown|swum)\\b", bsp: "I have never ridden a horse." },
          { f: "Schreibe einen Satz mit **I have already …** und einem Verb: do, write, buy, see oder eat.", kriterien: ["I have already + 3. Form (done, written, bought, seen, eaten)"], muster: "\\b(have|'ve) already (done|written|bought|seen|eaten)\\b", bsp: "I have already done my homework." }
        ] }
    ]
  });
  </script>
