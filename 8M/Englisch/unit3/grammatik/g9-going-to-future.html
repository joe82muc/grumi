        karten: [["I'm going to call her.", 0], ["She's going to buy a ticket.", 0], ["We're going to go home.", 0],

        items: [

          { f: "Ihr habt nicht vor, früh aufzustehen.", o: ["We aren't going to get up early.", "We don't going to get up early.", "We going not to get up early."], a: 0, e: "aren't + going to + Grundform." }
        ] },
      { typ: "luecke", t: "Signalwörter: Setze das passende Wort ein.", tipp: "Diese Wörter zeigen die Zukunft an. Gestern, letzte Woche und vorhin gehören in die Vergangenheit.",

                "We [[aren't going to fly|are not going to fly|'re not going to fly]] – we want to go by train. (not fly)",

      { typ: "wahl", t: "going to + Verb oder going to + Ort?", tipp: "Steht nach going to ein Verb, ist es ein Plan. Steht ein Ort da, bist du unterwegs.",
        items: [
          { f: "Du bist gerade auf dem Weg zum Supermarkt. Welcher Satz passt?", o: ["I'm going to the supermarket.", "I'm going to go supermarket.", "I'm going to buy the supermarket."], a: 0, e: "Ort danach, kein zweites Verb → ich bin unterwegs: going to the supermarket." },
          { s: "She's ___ a new phone next month.", o: ["going to buy", "going to"], a: 0, e: "Ein Verb muss folgen: going to buy." },
          { s: "Tomorrow we're ___ pizza for dinner.", o: ["going to make", "going to"], a: 0, e: "Plan mit Verb: going to make pizza." }
        ] },
      { typ: "umformen", t: "Schreibe den Plan als Satz mit going to.", tipp: "Mach aus „plans to / wants to“ ein going to-Satz.",

          { s: "Elif plans to study medicine.", l: ["Elif is going to study medicine.", "Elif's going to study medicine."] },
          { s: "My parents plan to buy a house.", l: ["My parents are going to buy a house.", "My parents are going to buy a new house."] },
          { s: "I want to learn Spanish next year.", l: ["I am going to learn Spanish next year.", "I'm going to learn Spanish next year."] }
        ] },
      { typ: "frei", t: "Und du? Schreibe einen Satz darüber, was du nach der Schule vorhast.", tipp: "Zum Beispiel: After school I'm going to …",

        items: [{ f: "Was hat ein Freund / eine Freundin vor?", kriterien: ["ein vollständiger englischer Satz", "is/isn't + going to + Grundform"],
                  muster: "\\b(['’]s|is|isn['’]t)\\s+(not\\s+)?going to\\s+[a-z]+", bsp: "My friend Lena is going to move to Hamburg next year." }] }
    ]
  });
