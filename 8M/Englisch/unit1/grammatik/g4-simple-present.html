  <title>G4 · Simple present | Englisch 8M</title>
  <meta name="description" content="Englisch 8M, Unit 1 (Wiederholung): das simple present mit he/she/it + s, Verneinung mit don't und doesn't, Fragen mit do und does, das Verb be und die Stellung von always, usually, often, sometimes und never.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>

  <script>
  E8MSeite(1, "g");
  Grammatik.seite({
    nr: 4, modul: "e8-m-u1-g4", kurz: "G4",
    titel: "Simple present",
    lead: "„She **goes** to school by bus every day.“ – Mit dem simple present sagst du, was du regelmäßig tust und was immer stimmt. Hier frischst du es auf.",
    ziele: ["Du bildest die Formen mit he, she, it + s.", "Du verneinst mit don't und doesn't und stellst Fragen mit do und does.", "Du setzt always, usually, often, sometimes und never an die richtige Stelle."],
    bild: { src: "g/g4-school-bus.jpg", alt: "Früher Morgen an einer Bushaltestelle in einer ruhigen Straße. Ein Mädchen mit Rucksack steigt in einen gelben Schulbus, der Fahrer lächelt. Ein Junge rennt zum Bus, eine Nachbarin führt einen Hund aus, hinter den Häusern geht die Sonne auf.",
      satz: "The driver **smiles** at the girl. A boy **runs** to the bus.",
      de: "Bei the driver und a boy (= he) kommt ein -s an das Verb: smiles, runs." },
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Für <b>Gewohnheiten</b> und <b>Tatsachen</b>: <i>I live in Munich. The bus comes at seven.</i></p>
        <ul class="wb-liste"><li><b>always</b><span>immer</span></li><li><b>usually</b><span>meistens</span></li><li><b>often</b><span>oft</span></li>
        <li><b>sometimes</b><span>manchmal</span></li><li><b>never</b><span>nie</span></li><li><b>every day</b><span>jeden Tag</span></li></ul>` },
      { t: "he, she, it + s", html: `
        <p>Bei <b>he, she, it</b> bekommt das Verb ein <b>-s</b>:</p>
        <table><tr><th>Regel</th><th>Beispiele</th></tr>
        <tr><td>meist + s</td><td>play → play<b>s</b>, run → run<b>s</b></td></tr>
        <tr><td>nach s, sh, ch, o: + es</td><td>go → go<b>es</b>, watch → watch<b>es</b>, wash → wash<b>es</b></td></tr>
        <tr><td>Konsonant + y: y → ies</td><td>study → stud<b>ies</b>, carry → carr<b>ies</b></td></tr>
        <tr><td>Sonderfall</td><td>have → <b>has</b></td></tr></table>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>don't / doesn't + Grundform:</b> I <b>don't</b> like fish. She <b>doesn't</b> like fish. (kein -s mehr!)</div>
        <div class="bsp"><b>Do / Does + Person + Grundform:</b> <b>Do</b> you walk to school? – Yes, I <b>do</b>. <b>Does</b> he walk? – No, he <b>doesn't</b>.</div>
        <div class="bsp"><b>Mit Fragewort:</b> Where <b>do</b> you live? What <b>does</b> it cost?</div>` },
      { t: "be und die Stellung der Signalwörter", html: `
        <table><tr><th>Person</th><th>be</th><th>Verneinung</th></tr>
        <tr><td>I</td><td><b>am</b></td><td>I'm not</td></tr>
        <tr><td>he, she, it</td><td><b>is</b></td><td><b>isn't</b></td></tr>
        <tr><td>you, we, they</td><td><b>are</b></td><td><b>aren't</b></td></tr></table>
        <p>Frage: <b>Are</b> you ready? <b>Is</b> she here?</p>
        <p>Signalwörter stehen <b>vor dem Verb</b>: <i>She <b>always</b> walks.</i> Aber <b>nach be</b>: <i>He is <b>never</b> late.</i></p>` }
    ],
    fallen: [
      "Nach **doesn't** und **does** steht die Grundform ohne -s: She doesn't **play**. Does he **play**? Nicht: ~~She doesn't plays.~~",
      "Bei **be** brauchst du kein do: **Are** you ready? Nicht: ~~Do you are ready?~~",
      "Das Signalwort steht nach be: He **is always** hungry. Nicht: ~~He always is hungry.~~"
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Simple present",
        html: `<p><span class="rot">simple present</span> – Gewohnheiten und Tatsachen: I live in Munich.</p>
          <p>he, she, it → <span class="rot">+ s</span>: She goes. He watches. It has.</p>
          <p>Verneinung: <span class="rot">don't / doesn't</span> + Grundform<br>Frage: <span class="rot">Do / Does</span> + Person + Grundform</p>
          <p>Signalwörter: <span class="blau">always, usually, often, sometimes, never</span> – vor dem Verb, aber nach is / are.</p>` },

      { typ: "zuordnen", davor: "Teil 1 · Die Formen", t: "Wie endet das Verb bei he, she, it? Ordne zu.", tipp: "Nach s, sh, ch, o kommt -es. Bei Konsonant + y wird aus y ein -ies.",
        gruppen: ["+ s", "+ es", "y → ies"],
        karten: [["plays", 0], ["runs", 0], ["eats", 0], ["goes", 1], ["watches", 1], ["washes", 1], ["studies", 2], ["carries", 2], ["tries", 2]] },
      { typ: "luecke", t: "Setze das Verb in der richtigen Form ein.", tipp: "he, she, it → + s (oder -es / -ies). I, you, we, they → Grundform.",
        items: ["My brother [[plays]] football on Saturdays. (play)", "Aylin [[watches]] TV in the evening. (watch)", "The bus [[goes]] to the station. (go)",
                "Our teacher [[has]] a big dog. (have)", "Mia [[studies]] English every day. (study)", "We [[live]] in a small town. (live)"] },
      { typ: "paare", t: "Welche Formen gehören zusammen? Verbinde Grundform und he/she/it-Form.", tipp: "Achte auf -es und -ies.",
        paare: [["go", "goes"], ["have", "has"], ["watch", "watches"], ["study", "studies"], ["wash", "washes"], ["fly", "flies"], ["try", "tries"], ["do", "does"]] },
      { typ: "markieren", t: "Markiere in jedem Satz das Signalwort.", stiftName: "Signalwort",
        items: ["My dad [always] drinks tea.", "We [usually] eat lunch at one.", "She [often] reads on the bus.", "I [sometimes] walk to school.", "He [never] eats fish.", "They play football [every day]."] },

      { typ: "luecke", davor: "Teil 2 · Verneinung und Fragen", t: "don't oder doesn't?", tipp: "he, she, it → doesn't. I, you, we, they → don't.",
        items: ["I {{don't|doesn't}} like spicy food.", "My sister {{doesn't|don't}} eat meat.", "They {{don't|doesn't}} live in New York.", "The shop {{doesn't|don't}} open on Sundays."] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "don't oder doesn't + Grundform. Das -s fällt weg.",
        items: [
          { s: "She plays tennis.", l: ["She doesn't play tennis.", "She does not play tennis."] },
          { s: "We live near the park.", l: ["We don't live near the park.", "We do not live near the park."] },
          { s: "The shop opens at nine.", l: ["The shop doesn't open at nine.", "The shop does not open at nine."] }
        ] },
      { typ: "luecke", t: "Fragen und Kurzantworten: Wähle aus.", tipp: "Do bei I, you, we, they – Does bei he, she, it. Die Kurzantwort nimmt do / does wieder auf.",
        items: ["{{Do|Does}} you walk to school? – Yes, I {{do|does}}.", "{{Does|Do}} your brother play the guitar? – No, he {{doesn't|don't}}.",
                "{{Do|Does}} your parents work in the city? – Yes, they {{do|does}}.", "{{Does|Do}} the bus stop here? – No, it {{doesn't|don't}}."] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "(Fragewort) + do / does + Person + Grundform.",
        items: [{ teile: ["Does", "your brother", "play", "the guitar?"] }, { teile: ["Where", "do", "you", "live?"] },
                { teile: ["What", "does", "it", "cost?"] }, { teile: ["How", "do", "they", "get", "to school?"] }] },
      { typ: "wahl", t: "Wie fragst du auf Englisch?", mischen: true,
        items: [
          { f: "Wo wohnst du?", o: ["Where do you live?", "Where you live?", "Where does you live?"], a: 0, e: "Fragewort + do + Person + Grundform." },
          { f: "Was kostet das Ticket?", o: ["What does the ticket cost?", "What cost the ticket?", "What do the ticket cost?"], a: 0, e: "the ticket = it → does." },
          { f: "Wie kommt sie zur Schule?", o: ["How does she get to school?", "How she gets to school?", "How does she gets to school?"], a: 0, e: "Nach does steht die Grundform: get." }
        ] },

      { typ: "luecke", davor: "Teil 3 · be und Signalwörter", t: "am, is, are, isn't oder aren't? Wähle aus.", tipp: "I → am · he, she, it → is · you, we, they → are. Bei be brauchst du kein do.",
        items: ["I {{am|is}} from Germany.", "Our teacher {{isn't|aren't}} here today.", "{{Are|Is}} you ready?", "My cousins {{are|is}} in New York.", "It {{isn't|doesn't}} cold today."] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Das Signalwort steht vor dem Verb – aber nach is / are.",
        items: [{ teile: ["She", "always", "walks", "to school."] }, { teile: ["He", "is", "never", "late."] },
                { teile: ["We", "sometimes", "eat", "pizza."], l: ["Sometimes we eat pizza.", "We eat pizza sometimes."] }, { teile: ["They", "usually", "take", "the bus."], l: ["Usually they take the bus."] }] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { f: "Mia ist immer pünktlich.", o: ["Mia is always on time.", "Mia always is on time.", "Mia is on time always."], a: 0, e: "Das Signalwort steht nach is." },
          { f: "Wir gehen oft ins Kino.", o: ["We often go to the cinema.", "We go often to the cinema.", "We are often go to the cinema."], a: 0, e: "Das Signalwort steht vor dem Verb go." },
          { f: "Er duscht nie am Morgen.", o: ["He never showers in the morning.", "He showers never in the morning.", "He never shower in the morning."], a: 0, e: "never steht vor dem Verb, und bei he kommt ein -s ans Verb." }
        ] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Morgen an der Bushaltestelle: Setze die Verben ein.", tipp: "Achte auf he, she, it und auf die Verneinung.",
        items: ["Every morning I [[get up]] at six. (get up)", "My bus [[comes]] at ten past seven. (come)", "The driver always [[smiles]] at me. (smile)",
                "My brother is often late, so he [[runs]] to the bus. (run)", "We [[don't|do not]] have school on Saturdays. (not have)", "[[Does]] your school start at eight, too?"] },
      { typ: "wahl", t: "Welches Wort passt? Achte auf be und auf do / does.", mischen: true, tipp: "Steht be im Satz (am, is, are)? Dann kein do. Sonst: don't / doesn't und Grundform.",
        items: [
          { s: "My dad ___ in a big office.", o: ["works", "work", "is work"], a: 0, e: "my dad = he → works." },
          { s: "They ___ at home today.", o: ["aren't", "don't", "doesn't"], a: 0, e: "Mit „at home“ steht be: they aren't." },
          { s: "___ your aunt live in Berlin?", o: ["Does", "Is", "Do"], a: 0, e: "your aunt = she, Verb live → Does." },
          { s: "Our cat ___ like milk.", o: ["doesn't", "isn't", "don't"], a: 0, e: "our cat = it, Verb like → doesn't." }
        ] },
      { typ: "umformen", t: "Mache aus der Aussage eine Frage.", tipp: "Do / Does + Person + Grundform. Bei be: das Verb an den Anfang.",
        items: [
          { s: "Mia plays tennis on Mondays.", l: ["Does Mia play tennis on Mondays?"] },
          { s: "You go to bed early.", l: ["Do you go to bed early?"] },
          { s: "The shop is open on Sunday.", l: ["Is the shop open on Sunday?"] }
        ] },
      { typ: "frei", t: "Und du? Schreibe zwei Sätze über deinen Alltag.", tipp: "Zum Beispiel: Was tust du immer, oft oder nie? Was mag deine Familie nicht?",
        items: [
          { f: "Schreibe einen Satz mit always, usually, often, sometimes oder never.", kriterien: ["ein vollständiger englischer Satz", "simple present", "das Signalwort steht an der richtigen Stelle"], muster: "\\b(always|usually|often|sometimes|never)\\b", bsp: "I usually get up at seven." },
          { f: "Schreibe einen verneinten Satz.", kriterien: ["don't / doesn't + Grundform (oder isn't / aren't)", "ein vollständiger englischer Satz"], muster: "\\b(don't|doesn't|do not|does not|isn't|aren't|am not|is not|are not)\\b", bsp: "My brother doesn't like carrots." }
        ] }
    ]
  });
  </script>
