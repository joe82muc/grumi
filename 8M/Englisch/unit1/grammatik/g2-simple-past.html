  <title>G2 · Simple past | Englisch 8M</title>
  <meta name="description" content="Englisch 8M, Unit 1 (Wiederholung): das simple past mit regelmäßigen und unregelmäßigen Verben, Verneinung mit didn't, Fragen mit did sowie was und were – mit Regelheft-Eintrag und vielen Übungen.">

  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>

  <script>
  E8MSeite(1, "g");
  Grammatik.seite({
    nr: 2, modul: "e8-m-u1-g2", kurz: "G2",
    titel: "Simple past",
    lead: "„Yesterday we **visited** the harbour and **took** a lot of photos.“ – Mit dem simple past erzählst du, was vorbei ist. Hier frischst du es auf.",
    ziele: ["Du bildest das simple past mit -ed und kennst wichtige unregelmäßige Formen.", "Du verneinst mit didn't und der Grundform.", "Du stellst Fragen mit did – und mit was oder were."],
    bild: { src: "g/g2-ferry.jpg", alt: "Eine Familie steht an einem sonnigen Tag auf dem offenen Deck einer Hafenfähre. Ein Mädchen fotografiert mit dem Handy die Skyline einer großen Stadt, der kleine Bruder isst eine Brezel, Möwen fliegen neben dem Boot.",
      satz: "Last Sunday the family **went** on a ferry trip. The girl **took** photos of the skyline.",
      de: "Der Ausflug ist vorbei, deshalb steht das simple past: went und took sind die unregelmäßigen Formen von go und take." },
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Etwas ist <b>vorbei</b> und abgeschlossen. Oft steht dabei, <b>wann</b> es war:</p>
        <ul class="wb-liste"><li><b>yesterday</b><span>gestern</span></li><li><b>last week / last year</b><span>letzte Woche / letztes Jahr</span></li>
        <li><b>two days ago</b><span>vor zwei Tagen</span></li><li><b>in 2020</b><span>im Jahr 2020</span></li></ul>` },
      { t: "Die Formen", html: `
        <p>Regelmäßig: Grundform + <b>-ed</b> – <i>play → played, live → lived, stop → sto<b>pp</b>ed, carry → carr<b>ied</b></i></p>
        <table><tr><th>Grundform</th><th>simple past</th><th>Grundform</th><th>simple past</th></tr>
        <tr><td>go</td><td><b>went</b></td><td>come</td><td><b>came</b></td></tr>
        <tr><td>have</td><td><b>had</b></td><td>get</td><td><b>got</b></td></tr>
        <tr><td>see</td><td><b>saw</b></td><td>buy</td><td><b>bought</b></td></tr>
        <tr><td>take</td><td><b>took</b></td><td>make</td><td><b>made</b></td></tr>
        <tr><td>eat</td><td><b>ate</b></td><td>do</td><td><b>did</b></td></tr></table>
        <p>Die Form ist für alle Personen gleich: <i>I went, she went, they went.</i></p>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>didn't + Grundform:</b> We <b>didn't go</b> to the beach.</div>
        <div class="bsp"><b>Did + Person + Grundform:</b> <b>Did</b> you <b>see</b> the film? – Yes, I <b>did</b>. / No, I <b>didn't</b>.</div>
        <div class="bsp"><b>Mit Fragewort:</b> Where <b>did</b> she <b>go</b>? What <b>did</b> they <b>eat</b>?</div>` },
      { t: "be: was und were", html: `
        <table><tr><th>Person</th><th>Aussage</th><th>Verneinung</th></tr>
        <tr><td>I, he, she, it</td><td><b>was</b></td><td><b>wasn't</b></td></tr>
        <tr><td>you, we, they</td><td><b>were</b></td><td><b>weren't</b></td></tr></table>
        <p>Fragen ohne did: <b>Were</b> you at home? <b>Was</b> the ferry full? – Yes, it <b>was</b>.</p>` }
    ],
    fallen: [
      "Nach **did** und **didn't** steht immer die Grundform: She didn't **go**. Nicht: ~~She didn't went.~~",
      "Bei **was/were** brauchst du kein did: **Were** you tired? Nicht: ~~Did you be tired?~~",
      "Im Deutschen sagt man oft „Ich habe … gemacht“. Mit yesterday, last week oder ago steht im Englischen trotzdem das simple past: I **did** it yesterday."
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Simple past",
        html: `<p><span class="rot">simple past</span> – etwas ist <u>vorbei</u>. Signalwörter: <span class="blau">yesterday, last week, two days ago</span>.</p>
          <p>regelmäßig: Grundform + <span class="rot">-ed</span> (stop → stopped, carry → carried)<br>unregelmäßig: go → <span class="rot">went</span>, see → <span class="rot">saw</span></p>
          <p>Verneinung: <span class="rot">didn't</span> + Grundform – We didn't go.<br>Frage: <span class="rot">Did</span> you go? – Yes, I did.</p>
          <p>Merke: was / were – ohne did.</p>` },

      { typ: "zuordnen", davor: "Teil 1 · Die Formen", t: "Regelmäßig oder unregelmäßig? Ordne die Vergangenheitsformen zu.", tipp: "Regelmäßige Formen enden auf -ed.",
        gruppen: ["regelmäßig (-ed)", "unregelmäßig"],
        karten: [["walked", 0], ["visited", 0], ["stayed", 0], ["wanted", 0], ["opened", 0], ["went", 1], ["saw", 1], ["took", 1], ["bought", 1], ["made", 1]] },
      { typ: "luecke", t: "Regelmäßige Verben: Setze das Verb im simple past ein.", tipp: "Hänge -ed an. Endet das Verb auf -e, kommt nur -d dazu. stop → stopped, carry → carried.",
        items: ["We [[stopped]] at a red light. (stop)", "The girl [[carried]] her bag onto the ferry. (carry)", "My cousins [[lived]] in Brooklyn in 2020. (live)",
                "Omar [[planned]] a trip to the harbour. (plan)", "I [[studied]] for the test last night. (study)", "The boat [[arrived]] at nine o'clock. (arrive)"] },
      { typ: "paare", t: "Welche Formen gehören zusammen? Verbinde Grundform und simple past.", tipp: "Die Tabelle „Die Formen“ oben hilft dir.",
        paare: [["go", "went"], ["see", "saw"], ["take", "took"], ["have", "had"], ["buy", "bought"], ["come", "came"], ["eat", "ate"], ["make", "made"], ["get", "got"], ["do", "did"]] },
      { typ: "luecke", t: "Unregelmäßige Verben: Setze das Verb im simple past ein.", tipp: "Diese Formen musst du auswendig können.",
        items: ["Mia [[had]] a pretzel for lunch. (have)", "We [[came]] home late yesterday. (come)", "Dad [[made]] pancakes last Sunday. (make)",
                "I [[did]] my homework two days ago. (do)", "Aylin [[got]] a postcard from her aunt. (get)", "The kids [[ate]] ice cream on the boat. (eat)"] },

      { typ: "luecke", davor: "Teil 2 · Verneinung und was / were", t: "was, were, wasn't oder weren't?", tipp: "I, he, she, it → was · you, we, they → were",
        items: ["The ferry {{was|were}} full on Saturday.", "My parents {{were|was}} on the deck, but I {{wasn't|weren't}} with them.",
                "{{Were|Was}} you tired after the trip?", "The seats {{weren't|wasn't}} very comfortable."] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "didn't + Grundform. Bei was/were: wasn't oder weren't.",
        items: [
          { s: "We visited the Statue of Liberty.", l: ["We didn't visit the Statue of Liberty.", "We did not visit the Statue of Liberty."] },
          { s: "Dana took a photo of the skyline.", l: ["Dana didn't take a photo of the skyline.", "Dana did not take a photo of the skyline."] },
          { s: "The water was cold.", l: ["The water wasn't cold.", "The water was not cold."] }
        ] },
      { typ: "markieren", t: "Markiere in jedem Satz das Signalwort für das simple past.", stiftName: "Signalwort",
        items: ["We went to the harbour [yesterday].", "I saw a great film [last week].", "They arrived [two days ago].", "My uncle moved to Queens [in 2020].", "Elif called me [last night]."] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { f: "Wir haben das Frühstück nicht gegessen.", o: ["We didn't eat breakfast.", "We didn't ate breakfast.", "We not ate breakfast."], a: 0, e: "didn't + Grundform: eat, nicht ate." },
          { f: "Er war gestern nicht in der Schule.", o: ["He wasn't at school yesterday.", "He didn't was at school yesterday.", "He weren't at school yesterday."], a: 0, e: "Bei be ohne did: he → wasn't." },
          { f: "Ich habe die Fähre nicht gesehen.", o: ["I didn't see the ferry.", "I didn't saw the ferry.", "I no see the ferry."], a: 0, e: "didn't + Grundform: see, nicht saw." }
        ] },

      { typ: "luecke", davor: "Teil 3 · Fragen und Kurzantworten", t: "Fragen und Kurzantworten: Wähle aus.", tipp: "Bei was/were fragst du ohne did. Die Kurzantwort nimmt dasselbe Wort wieder auf: Yes, it was. / No, I didn't.",
        items: ["{{Did|Were}} Noah take a photo? – No, he {{didn't|wasn't}}.", "{{Were|Did}} your cousins at the harbour? – Yes, they {{were|did}}.",
                "{{Did|Was}} Lena buy a ticket? – Yes, she {{did|was}}.", "{{Was|Did}} the ferry late? – No, it {{wasn't|didn't}}."] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "(Fragewort) + did + Person + Grundform. Bei was/were: ohne did.",
        items: [{ teile: ["Did", "you", "see", "the skyline?"] }, { teile: ["Where", "did", "they", "go", "last Sunday?"] },
                { teile: ["Was", "the ferry", "full?"] }, { teile: ["What", "did", "your brother", "eat", "on the boat?"] }] },
      { typ: "paare", t: "Welche Antwort passt zu welcher Frage?", tipp: "Achte auf das Fragewort: Where = Ort, When = Zeit, Who = Person, What = Sache.",
        paare: [["Where did you go?", "We went to the harbour."], ["Who did you go with?", "With my family."], ["When did you leave?", "At eight o'clock."],
                ["What did you eat?", "A big pretzel."], ["How was the trip?", "It was great."], ["Why did you stay at home?", "Because I was ill."]] },
      { typ: "wahl", t: "Wie fragst du auf Englisch?", mischen: true,
        items: [
          { f: "Was hast du gestern gegessen?", o: ["What did you eat yesterday?", "What you ate yesterday?", "What did you ate yesterday?"], a: 0, e: "Fragewort + did + Person + Grundform." },
          { f: "Wo warst du gestern?", o: ["Where were you yesterday?", "Where did you be yesterday?", "Where was you yesterday?"], a: 0, e: "Bei be kein did; zu you gehört were." },
          { f: "Hat Mia die Nachricht gelesen?", o: ["Did Mia read the message?", "Did Mia readed the message?", "Was Mia read the message?"], a: 0, e: "Did + Person + Grundform." }
        ] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Ausflug auf dem Wasser: Setze die Verben im simple past ein.", tipp: "Achte auf Verneinungen: didn't + Grundform.",
        items: ["Last Saturday my family [[went]] to the harbour. (go)", "We [[took]] the ferry to a small island. (take)",
                "My little brother [[didn't like|did not like]] the wind, but he [[ate]] a big pretzel. (not like / eat)", "The sun [[was]] out and the seagulls [[followed]] the boat. (be / follow)"] },
      { typ: "wahl", t: "Simple past oder simple present? Achte auf das Signalwort.", mischen: true, tipp: "yesterday, last year, ago, in 2023 → simple past. every day → simple present.",
        items: [
          { s: "Last year my uncle ___ in New York.", o: ["lived", "lives"], a: 0, e: "last year ist vorbei → simple past." },
          { s: "Hannah ___ her bike every day.", o: ["rides", "rode"], a: 0, e: "every day ist eine Gewohnheit → simple present." },
          { s: "We ___ a lot of photos in 2023.", o: ["took", "take"], a: 0, e: "in 2023 ist vorbei → simple past." },
          { s: "My sister ___ the film two days ago.", o: ["saw", "sees"], a: 0, e: "two days ago ist vorbei → simple past." }
        ] },
      { typ: "umformen", t: "Mache aus der Aussage eine Frage.", tipp: "Did + Person + Grundform. Bei was/were: das Verb an den Anfang.",
        items: [
          { s: "Mia went to the harbour.", l: ["Did Mia go to the harbour?"] },
          { s: "You were on the ferry.", l: ["Were you on the ferry?"] },
          { s: "They bought tickets online.", l: ["Did they buy tickets online?"] }
        ] },
      { typ: "luecke", t: "Ein Chat: Setze die Verben im simple past ein.", tipp: "Achte auf die Verneinung und auf was/were.",
        items: ["Omar: Where [[were]] you yesterday, Aylin? (be)", "Omar: I [[called]] you three times. (call)", "Aylin: Sorry! I [[didn't|did not]] have my phone with me. (not)",
                "Aylin: My cousins [[came]] to visit, and we [[played]] games all afternoon. (come / play)", "Omar: [[Did]] you have fun? – Aylin: Yes, I [[did]]!"] },
      { typ: "frei", t: "Und du? Schreibe zwei Sätze über dein letztes Wochenende.", tipp: "Zum Beispiel: Where did you go? What did you eat? Wie war das Wetter?",
        items: [
          { f: "Schreibe einen Satz mit einem Verb im simple past.", kriterien: ["ein vollständiger englischer Satz", "das Verb steht im simple past"], muster: "\\b(went|was|were|had|did|saw|took|ate|made|got|came|met|bought|wrote|ran|swam|sat|slept|found|gave|told|said|spent|felt|left|won|lost|heard|read|drank|wore|sang|rode|flew|spoke|woke|drove|began|brought|thought|[a-z]{2,}ed)\\b", bsp: "On Saturday I played football with my friends." },
          { f: "Schreibe einen verneinten Satz mit didn't.", kriterien: ["didn't + Grundform", "ein vollständiger englischer Satz"], muster: "\\b(didn't|did not)\\b", bsp: "I didn't do my homework on Sunday." }
        ] }
    ]
  });
  </script>
