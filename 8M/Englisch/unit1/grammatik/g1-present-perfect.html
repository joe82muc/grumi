  <title>G1 · Present perfect mit for und since | Englisch 8M</title>

  <script>
  E8MSeite(1, "g");
  Grammatik.seite({
    nr: 1, modul: "e8-m-u1-g1", kurz: "G1",
    titel: "Present perfect mit for und since",
    lead: "„I **have lived** here **for** three years.“ – Etwas hat früher angefangen und reicht bis jetzt. Dafür brauchst du das present perfect.",
    ziele: ["Du bildest das present perfect mit have oder has und der 3. Form.", "Du entscheidest sicher zwischen for und since.", "Du benutzt Signalwörter wie already, just, never und yet."],
    bild: { src: "g/g1-skateboard.jpg", alt: "Ein Junge sitzt auf den Stufen vor einem Stadthaus und hält ein altes, abgenutztes Skateboard. Sein kleiner Bruder hält ein nagelneues.",
      satz: "Luca **has had** his skateboard **for** five years. His brother **has had** his **since** Monday.",
      de: "Luca hat sein Skateboard seit fünf Jahren, sein Bruder erst seit Montag. Beide haben es **immer noch** – deshalb present perfect." },
    merk: [
      { t: "So bildest du es", html: `
        <p><b>have / has + 3. Form</b> des Verbs (past participle)</p>
        <table><tr><th>Person</th><th>Aussage</th><th>Verneinung</th></tr>
        <tr><td>I, you, we, they</td><td><b>have</b> worked <i>(I've worked)</i></td><td><b>haven't</b> worked</td></tr>
        <tr><td>he, she, it</td><td><b>has</b> worked <i>(she's worked)</i></td><td><b>hasn't</b> worked</td></tr></table>
        <p>Frage: <b>Have</b> you finished? – Yes, I <b>have</b>. / No, I <b>haven't</b>.<br><b>Has</b> she called? – Yes, she <b>has</b>. / No, she <b>hasn't</b>.</p>` },
      { t: "Die 3. Form", html: `
        <p>Regelmäßige Verben: <b>-ed</b> – <i>work → worked, play → played, live → lived</i></p>
        <p>Unregelmäßige Verben musst du lernen:</p>
        <table><tr><th>Grundform</th><th>3. Form</th><th>Grundform</th><th>3. Form</th></tr>
        <tr><td>be</td><td><b>been</b></td><td>see</td><td><b>seen</b></td></tr>
        <tr><td>go</td><td><b>gone</b></td><td>eat</td><td><b>eaten</b></td></tr>
        <tr><td>do</td><td><b>done</b></td><td>write</td><td><b>written</b></td></tr>
        <tr><td>have</td><td><b>had</b></td><td>meet</td><td><b>met</b></td></tr>
        <tr><td>know</td><td><b>known</b></td><td>buy</td><td><b>bought</b></td></tr></table>
        <p>Alle 66 Verben findest du im Bereich „Unregelmäßige Verben“.</p>` },
      { t: "for oder since?", html: `
        <div class="bsp"><b>since</b> + Zeit<b>punkt</b> (seit wann?): <i>since Monday, since 2022, since my birthday, since I was six</i></div>
        <div class="bsp"><b>for</b> + Zeit<b>spanne</b> (wie lange?): <i>for two days, for a year, for a long time, for ten minutes</i></div>
        <p>Beides heißt auf Deutsch „seit“. Frage dich: Nenne ich den <b>Anfang</b> (since) oder die <b>Dauer</b> (for)?</p>` },
      { t: "Signalwörter", html: `
        <ul class="wb-liste"><li><b>already</b><span>schon</span></li><li><b>just</b><span>gerade eben</span></li><li><b>never</b><span>noch nie</span></li>
        <li><b>ever</b><span>jemals (in Fragen)</span></li><li><b>not … yet</b><span>noch nicht</span></li></ul>
        <p>Sie stehen <b>zwischen have/has und der 3. Form</b> – nur <b>yet</b> steht am Satzende: <i>We have <b>just</b> arrived. She hasn't called <b>yet</b>.</i></p>` }
    ],
    fallen: [
      "Deutsch: „Ich wohne seit 2020 hier.“ – Englisch: **I have lived** here since 2020. Nicht: ~~I live here since 2020.~~",
      "Bei **he, she, it** heißt es **has**, nicht have.",
      "Steht eine abgeschlossene Zeit dabei (**yesterday, last week, in 2019**), nimmst du das simple past: I **saw** her yesterday."
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Present perfect mit for und since",
        html: `<p><span class="rot">have / has + 3. Form</span> – etwas hat früher angefangen und dauert bis <u>jetzt</u>.</p>
          <p>I <span class="rot">have lived</span> here <span class="blau">for</span> two years.<br>She <span class="rot">has lived</span> here <span class="blau">since</span> 2023.</p>
          <p><span class="blau">for</span> + Zeitspanne (wie lange?): for two years, for a week<br><span class="blau">since</span> + Zeitpunkt (seit wann?): since Monday, since 2023</p>
          <p>Merke: he, she, it → <span class="rot">has</span></p>` },

      { typ: "luecke", davor: "Teil 1 · have oder has + 3. Form", t: "have oder has? Wähle aus.", tipp: "he, she, it → has. Alle anderen → have.",
        items: ["My cousin {{has|have}} lived in Boston for a year.", "We {{have|has}} known each other since primary school.",
                "The bus {{has|have}} just left.", "My parents {{have|has}} never been to the USA.", "{{Has|Have}} your brother finished his homework?",
                "I {{have|has}} already packed my bag."] },
      { typ: "luecke", t: "Regelmäßige Verben: Setze die 3. Form ein.", tipp: "Hänge -ed an. Endet das Verb auf -e, kommt nur -d dazu: live → lived.",
        items: ["We have [[visited]] the museum twice. (visit)", "They have just [[arrived]] at the airport. (arrive)", "Aylin has [[lived]] in Queens since 2021. (live)",
                "I have already [[finished]] my homework. (finish)", "My dad has [[worked]] in this store for ten years. (work)"] },
      { typ: "paare", t: "Unregelmäßige Verben: Welche 3. Form gehört zu welcher Grundform?", tipp: "Die Tabelle „Die 3. Form“ oben hilft dir.",
        paare: [["be", "been"], ["go", "gone"], ["see", "seen"], ["eat", "eaten"], ["write", "written"], ["buy", "bought"], ["know", "known"], ["meet", "met"]] },
      { typ: "luecke", t: "Unregelmäßige Verben: Setze die 3. Form ein.", tipp: "Diese Formen musst du auswendig können: be → been, eat → eaten, buy → bought …",
        items: ["Nora has [[written]] three emails today. (write)", "I have never [[eaten]] sushi. (eat)", "Have you ever [[been]] to New York? (be)",
                "He has [[bought]] a new skateboard. (buy)", "We have [[seen]] this film twice. (see)", "I have [[known]] Emre for five years. (know)"] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Das Signalwort steht zwischen have/has und der 3. Form – nur yet steht am Ende.",
        items: [{ teile: ["I", "have", "just", "finished", "my homework."] }, { teile: ["She", "has", "never", "seen", "the sea."] },
                { teile: ["We", "have", "already", "eaten", "lunch."], l: ["We have eaten lunch already."] }, { teile: ["He", "hasn't", "called", "me", "yet."], l: ["He hasn't yet called me."] }] },

      { typ: "zuordnen", davor: "Teil 2 · for oder since?", t: "for oder since? Ordne die Zeitangaben zu.", tipp: "Zeitspanne (wie lange?) → for · Zeitpunkt (seit wann?) → since",
        gruppen: ["for + Zeitspanne", "since + Zeitpunkt"],
        karten: [["two weeks", 0], ["a long time", 0], ["ten minutes", 0], ["three years", 0], ["an hour", 0],
                 ["last summer", 1], ["2021", 1], ["my birthday", 1], ["8 o'clock", 1], ["I was a child", 1]] },
      { typ: "luecke", t: "for oder since? Wähle aus.", tipp: "Kannst du die Zeit zählen (zwei Tage, drei Jahre)? Dann for. Nennst du den Anfang? Dann since.",
        items: ["We have lived in this flat {{since|for}} 2019.", "Mia has played the guitar {{for|since}} five years.", "I have had this phone {{since|for}} Christmas.",
                "My grandparents have had their dog {{for|since}} a long time.", "It has rained {{since|for}} this morning.", "They have been friends {{for|since}} ages."] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { f: "Ich wohne seit drei Jahren in Unterhaching.", o: ["I have lived in Unterhaching for three years.", "I live in Unterhaching since three years.", "I have lived in Unterhaching since three years."], a: 0, e: "Present perfect + for, denn „three years“ ist eine Zeitspanne." },
          { f: "Meine Schwester hat ihr Handy noch nicht gefunden.", o: ["My sister hasn't found her phone yet.", "My sister hasn't yet found her phone not.", "My sister haven't found her phone yet."], a: 0, e: "she → hasn't; yet steht am Ende." },
          { f: "Wir kennen uns seit dem letzten Sommer.", o: ["We have known each other since last summer.", "We know each other since last summer.", "We have known each other for last summer."], a: 0, e: "„last summer“ ist ein Zeitpunkt → since, und dazu gehört das present perfect." }
        ] },

      { typ: "luecke", davor: "Teil 3 · Fragen und Kurzantworten", t: "Bilde Fragen mit Have oder Has und antworte kurz.", tipp: "Have/Has steht am Anfang der Frage. In der Kurzantwort kommt dasselbe Wort wieder: Yes, I have. / No, he hasn't.",
        items: ["{{Have|Has}} you ever been to London? – Yes, I {{have|has|did}}.", "{{Has|Have}} Omar finished his project? – No, he {{hasn't|haven't|didn't}}.",
                "{{Have|Has}} your parents met the new teacher? – Yes, they {{have|has|are}}.", "{{Has|Have}} the film started yet? – No, it {{hasn't|haven't|isn't}}."] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "Fragewort – have/has – Person – 3. Form.",
        items: [{ teile: ["How long", "have", "you", "lived", "here?"] }, { teile: ["Have", "you", "ever", "met", "a famous person?"] },
                { teile: ["How long", "has", "she", "known", "him?"] }] },
      { typ: "markieren", t: "Markiere in jedem Satz das Signalwort.", stiftName: "Signalwort",
        items: ["I have [already] tidied my room.", "Have you [ever] tried surfing?", "She hasn't answered my message [yet].",
                "Dad has [just] phoned.", "We have [never] missed the bus.", "They have lived here [since] May."] }
    ],
    plus: [
      { typ: "luecke", t: "Present perfect und for oder since: Fülle beide Lücken.", tipp: "Zuerst have/has + 3. Form, dann for (Dauer) oder since (Anfang).",
        items: ["Sofia [[has played|'s played]] the guitar {{for|since}} five years. (play)", "We [[have lived|'ve lived]] in this flat {{since|for}} 2019. (live)",
                "My grandparents [[have had|'ve had]] their dog {{for|since}} a long time. (have)", "I [[have known|'ve known]] Leo {{since|for}} the first day at school. (know)",
                "Ben [[has been|'s been]] ill {{since|for}} Tuesday. (be)"] },
      { typ: "umformen", t: "Mach aus zwei Sätzen einen – im present perfect mit for oder since.", tipp: "Was dauert bis jetzt an? Dieses Verb kommt ins present perfect.",
        items: [
          { s: "Leo moved to Munich in 2022. He still lives there.", l: ["Leo has lived in Munich since 2022.", "Leo's lived in Munich since 2022."] },
          { s: "I got my bike two years ago. I still have it.", l: ["I have had my bike for two years.", "I've had my bike for two years."] },
          { s: "Carla became a member of the club in May. She is still a member.", l: ["Carla has been a member of the club since May.", "Carla's been a member of the club since May."] }
        ] },
      { typ: "wahl", t: "Present perfect oder simple past?", tipp: "Abgeschlossene Zeit (yesterday, last year, in 2020) → simple past.",
        items: [
          { s: "I ___ my keys yesterday.", o: ["lost", "have lost"], a: 0, e: "yesterday ist abgeschlossen → simple past." },
          { s: "We ___ here since 2020.", o: ["have lived", "lived"], a: 0, e: "since 2020 reicht bis jetzt → present perfect." },
          { s: "She ___ her grandma last weekend.", o: ["visited", "has visited"], a: 0, e: "last weekend ist vorbei → simple past." },
          { s: "My dad ___ at this company since May.", o: ["has worked", "worked"], a: 0, e: "since May reicht bis jetzt → present perfect." }
        ] },
      { typ: "luecke", t: "Eine Nachricht aus New York: Setze die Verben im present perfect ein.", tipp: "have/has + 3. Form. Achte auf he, she, it.",
        items: ["Hi Jonas! We [[have been|'ve been]] in New York for a week now. (be)", "I [[have seen|'ve seen]] so many tall buildings! (see)",
                "My sister [[has bought|'s bought]] a cap in a small store. (buy)", "We [[haven't visited|have not visited]] the zoo yet. (not visit)",
                "[[Have]] you ever [[eaten]] a real New York bagel? (eat)"] },
      { typ: "frei", t: "Schreibe über dich: zwei Sätze im present perfect.", tipp: "Zum Beispiel: Wie lange wohnst du schon hier? Seit wann hast du dein Handy, dein Fahrrad, dein Hobby?",
        items: [
          { f: "Schreibe einen Satz mit **for**.", kriterien: ["present perfect mit have/has + 3. Form", "for + Zeitspanne"], muster: "\\b(have|has|'ve|'s)\\b.*\\bfor\\b", bsp: "I have played football for six years." },
          { f: "Schreibe einen Satz mit **since**.", kriterien: ["present perfect mit have/has + 3. Form", "since + Zeitpunkt"], muster: "\\b(have|has|'ve|'s)\\b.*\\bsince\\b", bsp: "I have had my phone since my birthday." }
        ] }
    ]
  });
  </script>
