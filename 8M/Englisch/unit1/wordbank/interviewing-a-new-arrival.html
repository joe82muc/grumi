<html lang="de">

  <title>Wordbank: Interviewing a new arrival | Englisch 8M</title>
  <meta name="description" content="Englisch 8M, Unit 1, Wordbank: Fragen und Antworten für ein Interview mit jemandem, der neu im Land ist – Reise, Gründe, Pläne und Nachfragen, mit Bildern.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../../css/grammatik.css">
  <link rel="stylesheet" href="../../../../css/englisch-baukasten.css">

</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E8MSeite(1, "w");
  Grammatik.seite({
    nr: 1, modul: "e8-m-u1-w1", kurz: "W1",
    titel: "Interviewing a new arrival",
    lead: "Jemand ist neu in der Klasse – und du möchtest mehr erfahren. Hier übst du die **Fragen** für ein Interview, passende **Antworten** und kleine Sätze, mit denen du **nachfragst**. Alle Personen in den Übungen sind erfunden.",
    ziele: ["Du stellst die wichtigsten Interviewfragen und verstehst passende Antworten.", "Du sprichst über Reise, Gründe und Pläne und benutzt for und since richtig.", "Du fragst nach, wenn du etwas nicht verstanden hast."],
    merk: [
      { t: "Fragen im Interview", html: `
        <ul class="wb-liste"><li><b>Where are you from?</b><span>Woher kommst du?</span></li>
        <li><b>What was the journey like?</b><span>Wie war die Reise?</span></li>
        <li><b>Why did you come to Germany?</b><span>Warum bist du nach Deutschland gekommen?</span></li>
        <li><b>How long have you been here?</b><span>Wie lange bist du schon hier?</span></li>
        <li><b>What are your plans for the future?</b><span>Was sind deine Pläne für die Zukunft?</span></li></ul>` },
      { t: "Antworten zur Herkunft und Dauer", html: `
        <div class="bsp">I'm from … · My home country is … · for a year · for three months · since last year</div>
        <p>Wie lange schon? Nenne die <b>Dauer</b> mit <b>for</b> (for three months) oder den <b>Anfang</b> mit <b>since</b> (since last year).</p>` },
      { t: "Wie bist du gereist?", breit: true, html: E8MSeite.bilder([["by-train", "by train", "mit dem Zug"], ["by-boat", "by boat", "mit dem Boot, mit dem Schiff"], ["by-car", "by car", "mit dem Auto"], ["by-coach", "by coach", "mit dem Reisebus"], ["on-foot", "on foot", "zu Fuß"]]) },
      { t: "Gründe, nach Deutschland zu kommen", html: `
        <ul class="wb-liste"><li><b>work</b><span>Arbeit</span></li><li><b>war in my country</b><span>Krieg in meinem Land</span></li>
        <li><b>family already here</b><span>Familie schon hier</span></li><li><b>famine</b><span>Hungersnot</span></li>
        <li><b>hungry</b><span>hungrig</span></li><li><b>poor</b><span>arm</span></li></ul>
        <p>Menschen verlassen ihr Land aus ganz verschiedenen Gründen. Sprich darüber sachlich und höflich.</p>` },
      { t: "Pläne für die Zukunft", breit: true, html: E8MSeite.bilder([["learn-german", "to learn German", "Deutsch lernen"], ["finish-school", "to finish school", "die Schule abschließen"], ["help-others", "to help others", "anderen helfen"], ["get-a-job", "to get a job in Germany", "einen Job in Deutschland bekommen"]]) },
      { t: "Weitere Pläne", html: `
        <ul class="wb-liste"><li><b>to live in …</b><span>leben in …</span></li><li><b>to get rich</b><span>reich werden</span></li><li><b>to be a star</b><span>ein Star sein</span></li></ul>` },
      { t: "Nützliche Sätze", html: `
        <div class="bsp">It's like … · It's a kind of … · It's when you … · Can you say that again, please? · Let me say that again. · What I mean is … · I don't understand what you mean. · Do you mean …? · Really? · That's interesting! · Tell me more, please. · Wow!</div>
        <p>Mit diesen Sätzen erklärst du ein Wort, fragst nach oder zeigst Interesse.</p>` }
    ],
    fallen: [
      "**by** train, **by** boat, **by** car, **by** coach – aber **on** foot.",
      "„Seit zwei Jahren“ heißt **for** two years (Dauer), „seit letztem Jahr“ heißt **since** last year (Anfang).",
      "Wie lange schon? Das present perfect: How long **have** you **been** here? Nicht: ~~How long are you here?~~"
    ],
    basis: [
      { typ: "paare", t: "Welche Wendung passt zum Bild?", tipp: "Schau genau hin: Wie reisen die Menschen? Was möchte die Person tun?",
        paare: [["img:wb/by-train.jpg", "by train"], ["img:wb/by-boat.jpg", "by boat"], ["img:wb/by-car.jpg", "by car"], ["img:wb/by-coach.jpg", "by coach"],
                ["img:wb/on-foot.jpg", "on foot"], ["img:wb/finish-school.jpg", "to finish school"], ["img:wb/learn-german.jpg", "to learn German"], ["img:wb/get-a-job.jpg", "to get a job"]] },
      { typ: "wahl", t: "Was zeigt das Bild?", tipp: "Die Antworten stehen im Merkwissen oben.",
        items: [
          { bild: "wb/help-others.jpg", f: "Which plan fits the picture?", o: ["to help others", "to get rich", "to be a star"], a: 0 },
          { bild: "wb/by-coach.jpg", f: "How are the people travelling?", o: ["on foot", "by coach", "by boat"], a: 1 },
          { bild: "wb/on-foot.jpg", f: "How are the two people travelling?", o: ["by car", "by train", "on foot"], a: 2 },
          { bild: "wb/learn-german.jpg", f: "What are the students doing?", o: ["They are learning German.", "They are finishing school.", "They are looking for a job."], a: 0 }
        ] },
      { typ: "paare", t: "Welche Antwort passt zu welcher Frage?", tipp: "Achte auf das Fragewort: Where, Why, How long, What …",
        paare: [["Where are you from?", "I'm from Poland."], ["How long have you been here?", "For about two years."], ["Why did you come to Germany?", "My dad found work here."],
                ["What was the journey like?", "It was long and tiring."], ["What are your plans for the future?", "I want to finish school."], ["Do you like your new school?", "Yes, the teachers are very kind."]] },
      { typ: "zuordnen", t: "Worüber spricht die Person? Sortiere.", tipp: "Reise: Wie? · Grund: Warum? · Plan: Was später?",
        gruppen: ["Reise", "Grund", "Plan für die Zukunft"],
        karten: [["by coach", 0], ["on foot", 0], ["by boat", 0], ["work", 1], ["war in my country", 1], ["family already here", 1], ["to finish school", 2], ["to help others", 2], ["to learn German", 2]] },
      { typ: "luecke", t: "Wähle das passende Wort.", tipp: "by + Fahrzeug · on foot · for + Zeitspanne · since + Zeitpunkt",
        items: ["Aylin and her mum came {{by|on|with}} train.", "The two boys walked the last part {{on|by|with}} foot.", "Omar has been here {{for|since}} three months.",
                "Elif has lived in this town {{since|for}} last summer.", "Milan has been in our class {{for|since}} two weeks."] },
      { typ: "bauen", t: "Baue die Interviewfragen.", tipp: "Fragewort zuerst, dann have oder did.",
        items: [{ teile: ["How long", "have", "you", "been", "here?"] }, { teile: ["Where", "are", "you", "from?"] },
                { teile: ["Why", "did", "you", "come", "to Germany?"] }, { teile: ["What", "was", "the journey", "like?"] }] },
      { typ: "wahl", t: "Was sagst du, wenn …?", mischen: true, tipp: "Denke an die nützlichen Sätze im Merkwissen.",
        items: [
          { f: "Du hast etwas nicht verstanden und möchtest, dass es jemand wiederholt.", o: ["Can you say that again, please?", "Tell me more, please.", "Wow!"], a: 0 },
          { f: "Du möchtest mehr hören.", o: ["Tell me more, please.", "Let me say that again.", "I don't understand what you mean."], a: 0 },
          { f: "Du denkst, du hast etwas verstanden, willst aber sicher sein.", o: ["Do you mean the bus station?", "What I mean is the bus station.", "Wow!"], a: 0 },
          { f: "Du sagst selbst noch einmal etwas, damit es klarer wird.", o: ["Let me say that again.", "Really?", "Can you say that again, please?"], a: 0 }
        ] },
      { typ: "luecke", t: "Schreibe die Wendung zum Bild.", tipp: "Die Wendungen stehen im Merkwissen.",
        items: [{ bild: "wb/by-boat.jpg", s: "They crossed the sea [[by boat]]." }, { bild: "wb/by-car.jpg", s: "We packed everything and travelled [[by car]]." },
                { bild: "wb/finish-school.jpg", s: "Nora is proud. Next, she wants [[to finish school]]." }, { bild: "wb/get-a-job.jpg", s: "Dana is happy. She wants [[to get a job|to find a job]] here." }] },
      { typ: "markieren", t: "Markiere in jedem Satz, wie lange die Person schon hier ist.", stiftName: "Zeitangabe", tipp: "Die Zeitangabe beginnt mit for oder since.",
        items: ["Elif has been here [for two years].", "Luca has lived in our town [since last year].", "Sofia has been in Germany [for a year]."] },
      { typ: "paare", t: "Was bedeutet das? Verbinde Englisch und Deutsch.",
        paare: [["Really?", "Wirklich?"], ["That's interesting!", "Das ist interessant!"], ["What I mean is …", "Ich meine …"], ["It's a kind of …", "Es ist eine Art …"], ["famine", "Hungersnot"], ["poor", "arm"]] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Interview mit Omar (erfunden): Ergänze die fehlenden Wörter.", tipp: "Lies erst das ganze Gespräch.",
        items: ["A: Where are you [[from]]? – B: I'm [[from]] a big city.", "A: How [[long]] have you been here? – B: [[For]] about a year.",
                "A: Why did you [[come]] to Germany? – B: My family is already [[here]].", "A: What are your [[plans]] for the future? – B: I want to [[learn]] German well."] },
      { typ: "frei", t: "Omar kam vor zwei Jahren an. Er antwortet auf die Frage „How long have you been here?“ Schreibe seine Antwort mit for.", tipp: "I have been here for …",
        items: [{ f: "Omars Antwort:", kriterien: ["ein vollständiger englischer Satz", "present perfect mit for", "passt zu zwei Jahren"], muster: "\\bfor\\b", bsp: "I have been here for two years." }] },
      { typ: "frei", t: "Du interviewst eine neue Mitschülerin (erfunden). Schreibe zwei eigene Fragen.", tipp: "Zum Beispiel über die Reise, die Schule oder ihre Pläne.",
        items: [
          { f: "Deine erste Frage:", kriterien: ["eine vollständige englische Frage", "passt zu einem Interview mit jemandem, der neu ist"], muster: "^(what|where|why|how|when|who|which|do|does|did|are|is|have|has|can|could|would|was|were)\\b.*\\?$", bsp: "What was the journey like?" },
          { f: "Deine zweite Frage:", kriterien: ["eine vollständige englische Frage", "passt zu einem Interview mit jemandem, der neu ist"], muster: "^(what|where|why|how|when|who|which|do|does|did|are|is|have|has|can|could|would|was|were)\\b.*\\?$", bsp: "What are your plans for the future?" }
        ] }
    ]
  });
  </script>
</body>
</html>
