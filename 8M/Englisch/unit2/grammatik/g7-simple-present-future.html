  <script>
  E8MSeite(2, "g");
  Grammatik.seite({
    nr: 3, modul: "e8-m-u2-g7", kurz: "G7",
    titel: "Simple present für Zukünftiges",
    lead: "„Our flight **arrives** at 6 p.m.“ – Das ist Zukunft, aber es steht im simple present. Warum? Weil die Zeit in einem **Plan** festgelegt ist.",
    ziele: ["Du erkennst feste Termine aus Fahrplan, Stundenplan oder Programm.", "Du benutzt dafür das simple present – auch für morgen oder nächste Woche.", "Du fragst nach Abfahrts- und Anfangszeiten."],
    bild: { src: "g/g7-platform.jpg", alt: "Zwei Jugendliche mit Rucksäcken stehen frühmorgens auf einem Bahnsteig und schauen zu einer großen runden Bahnhofsuhr hinauf. Ein moderner Zug fährt gerade ein, andere Reisende warten mit Koffern.",
      satz: "Hurry up! Our train **leaves** in five minutes. It **arrives** in Berlin at noon.",
      de: "Beeil dich! Unser Zug fährt in fünf Minuten ab. Er kommt mittags in Berlin an. – Das steht im Fahrplan, darum simple present." },
    merk: [
      { t: "Die Regel", html: `
        <p>Steht ein Termin in einem <b>Fahrplan, Flugplan, Stundenplan, Programm</b> oder sind es <b>Öffnungszeiten</b>, nimmst du das <b>simple present</b> – auch wenn es um die Zukunft geht.</p>
        <div class="bsp">The train to Munich <b>leaves</b> at 8:15 tomorrow.</div>
        <div class="bsp">School <b>starts</b> on Monday.</div>` },
      { t: "Typische Verben", html: `
        <ul class="wb-liste"><li><b>leave / depart</b><span>abfahren, abfliegen</span></li><li><b>arrive / land</b><span>ankommen / landen</span></li>
        <li><b>take off</b><span>abheben</span></li><li><b>start / begin</b><span>anfangen</span></li><li><b>end</b><span>enden</span></li>
        <li><b>open / close</b><span>öffnen / schließen</span></li></ul>
        <p>Bei <b>he, she, it</b> kommt das <b>s</b> dazu: the plane land<b>s</b>.</p>` },
      { t: "Verneinung und Fragen", html: `
        <p>Wie immer im simple present – mit <b>do/does</b>:</p>
        <div class="bsp">The bus <b>doesn't stop</b> at the museum on Sundays.</div>
        <div class="bsp">When <b>does</b> the bus <b>leave</b>? · What time <b>does</b> the film <b>start</b>? · <b>Do</b> we <b>have</b> Maths tomorrow?</div>` },
      { t: "Plan oder eigene Absicht?", html: `
        <table><tr><th>Fester Termin im Plan</th><th>Eigener Plan</th></tr>
        <tr><td>simple present</td><td>going to</td></tr>
        <tr><td><i>The match <b>starts</b> at three.</i></td><td><i>I<b>'m going to visit</b> my aunt.</i></td></tr></table>` }
    ],
    fallen: [
      "Auch in der Zukunft gilt: he, she, it – das **s** muss mit. The plane **lands** at ten.",
      "In Fragen steht nach **does** die Grundform: When does the train **leave**? Nicht: ~~When does the train leaves?~~",
      "Für deine eigenen Pläne nimmst du nicht das simple present: I**'m going to visit** my aunt tomorrow."
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Simple present für Zukünftiges",
        html: `<p>Feste Termine (Fahrplan, Flugplan, Stundenplan) stehen im <span class="rot">simple present</span> – auch für die Zukunft.</p>
          <p>The train <span class="rot">leaves</span> at 8:15 <span class="blau">tomorrow</span>.<br>Our flight <span class="rot">arrives</span> at 6 p.m.</p>
          <p>Eigener Plan: <span class="blau">going to</span><br>I'm going to visit my aunt.</p>
          <p>Merke: he, she, it → <span class="rot">s</span></p>` },

      { typ: "wahl", davor: "Teil 1 · Pläne lesen", t: "Lies den Plan und beantworte die Fragen.", mischen: true, info: "Ausflug nach Salzburg, morgen · Zug ab Unterhaching: 7:42 · Ankunft in Salzburg: 9:20 · Stadtführung: 10:00 bis 12:00 · Mittagspause: 12:00 bis 13:00 · Rückfahrt: 17:35",
        tipp: "Suche die Uhrzeit im Plan.",
        items: [
          { f: "What time does the train leave Unterhaching?", o: ["It leaves at 7:42.", "It leaves at 9:20.", "It leave at 7:42."], a: 0 },
          { f: "When does the train arrive in Salzburg?", o: ["It arrives at 9:20.", "It arrives at 7:42.", "It arrive at 9:20."], a: 0 },
          { f: "When does the city tour end?", o: ["It ends at 12:00.", "It ends at 10:00.", "It end at 12:00."], a: 0 },
          { f: "What time does the train go back?", o: ["It leaves at 17:35.", "It leaves at 13:00.", "It leave at 17:35."], a: 0 }
        ] },
      { typ: "luecke", t: "Setze das Verb im simple present ein.", tipp: "Einzahl (the train, the film …) → -s",
        items: ["The next train to Hamburg [[leaves]] at 9:30. (leave)", "Our English lesson [[starts]] at ten tomorrow. (start)", "The shops [[close]] at eight tonight. (close)",
                "Your plane [[lands]] in Denver at noon. (land)", "The holidays [[begin]] next Monday. (begin)", "The show [[ends]] at half past nine. (end)"] },
      { typ: "zuordnen", t: "Steht das in einem Plan – oder hat es jemand selbst vor?", tipp: "Fahrplan, Stundenplan, Programm → fester Termin",
        gruppen: ["fester Termin (simple present)", "eigener Plan (going to)"],
        karten: [["the bus timetable", 0], ["the school timetable", 0], ["opening hours", 0], ["a cinema programme", 0],
                 ["visit a friend", 1], ["buy a new phone", 1], ["learn Spanish", 1], ["tidy my room", 1]] },
      { typ: "paare", t: "Welches Verb heißt was?", tipp: "Diese Verben stehen oft in Fahrplänen und Flugplänen.",
        paare: [["leave", "abfahren"], ["arrive", "ankommen"], ["land", "landen"], ["take off", "abheben"], ["open", "öffnen"], ["close", "schließen"], ["begin", "anfangen"]] },

      { typ: "luecke", davor: "Teil 2 · he/she/it und Verneinung", t: "Mit oder ohne s? Wähle aus.", tipp: "he, she, it → s · I, you, we, they → kein s",
        items: ["The film {{starts|start}} at eight.", "The planes {{take off|takes off}} every hour.", "The shop {{opens|open}} at nine.", "Our lessons {{begin|begins}} at 7:55.", "The ferry {{arrives|arrive}} at noon."] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "doesn't / don't + Grundform",
        items: [
          { s: "The bus stops at the stadium.", l: ["The bus doesn't stop at the stadium.", "The bus does not stop at the stadium."] },
          { s: "We have PE on Friday.", l: ["We don't have PE on Friday.", "We do not have PE on Friday."] },
          { s: "The museum opens on Mondays.", l: ["The museum doesn't open on Mondays.", "The museum does not open on Mondays."] }
        ] },
      { typ: "markieren", t: "Markiere in jedem Satz das Verb im simple present.", stiftName: "Verb",
        items: ["The bus [leaves] at 7:45 tomorrow.", "Our flight [arrives] at 6 p.m.", "The concert [starts] at seven on Saturday.", "The shops [close] early on Sunday."] },
      { typ: "wahl", t: "Fester Termin im Plan: Welcher Satz stimmt?", mischen: true, tipp: "Fester Termin → simple present, auch wenn es um morgen oder heute Abend geht.",
        items: [
          { f: "Das Schiff fährt morgen um 6 Uhr ab.", o: ["The ship leaves at 6 a.m. tomorrow.", "The ship left at 6 a.m. tomorrow."], a: 0 },
          { f: "Der Film beginnt heute Abend um 20 Uhr.", o: ["The film begins at 8 p.m. tonight.", "The film began at 8 p.m. tonight."], a: 0 },
          { f: "Das Museum schließt morgen um 18 Uhr.", o: ["The museum closed at 6 p.m. tomorrow.", "The museum closes at 6 p.m. tomorrow."], a: 1 }
        ] },

      { typ: "bauen", davor: "Teil 3 · Fragen und Abgrenzung", t: "Baue die Fragen nach den Zeiten.", tipp: "Fragewort + do/does + Subjekt + Grundform",
        items: [{ teile: ["What time", "does", "the film", "start?"] }, { teile: ["When", "does", "your flight", "leave", "tomorrow?"] },
                { teile: ["Does", "the train", "stop", "in Ulm?"] }, { teile: ["When", "do", "the holidays", "begin?"] }] },
      { typ: "luecke", t: "Ergänze die Fragen mit do oder does.", tipp: "Einzahl (the bus, the plane) → does · Mehrzahl (the shops) → do",
        items: ["When {{does|do}} the bus leave?", "What time {{do|does}} the shops open?", "{{Does|Do}} the film start at nine?", "{{Do|Does}} we have English tomorrow?"] },
      { typ: "luecke", t: "Simple present oder going to? Wähle aus.", tipp: "Plan mit fester Uhrzeit → simple present · eigene Absicht → going to",
        items: ["The ferry {{leaves|is going to leave}} at 6 a.m. – it says so on the ticket.", "I {{am going to pack|pack}} my suitcase tonight.",
                "The football match {{starts|is going to start}} at 3:30 on Saturday.", "We {{are going to buy|buy}} some snacks before the flight."] }
    ],
    plus: [
      { typ: "luecke", t: "Welche Form passt? Schreibe sie in die Lücke.", tipp: "Aussage mit s, Verneinung mit doesn't/don't, Frage mit do/does.",
        items: ["The shop [[doesn't open|does not open]] on Sundays. (not open)", "[[Does]] the plane land at eleven? (Frage)", "Our plane [[takes off|leaves]] at 6:50. (take off)",
                "The shops [[don't close|do not close]] before nine. (not close)"] },
      { typ: "umformen", t: "Frage nach dem unterstrichenen Teil.", tipp: "Nach der Uhrzeit fragst du mit What time oder When.",
        items: [
          { s: "The train arrives __at 4:50__.", l: ["What time does the train arrive?", "When does the train arrive?"] },
          { s: "The party starts __on Friday__.", l: ["When does the party start?"] },
          { s: "The bus leaves __from gate 12__.", l: ["Where does the bus leave from?", "Where does the bus leave?", "From where does the bus leave?"] }
        ] },
      { typ: "luecke", t: "Eine Nachricht vor der Reise: Setze die richtigen Formen ein.", tipp: "Fester Termin → simple present · eigener Plan → going to",
        items: ["Hi Hannah! Our flight [[leaves]] at 7:10 tomorrow. (leave)", "It [[arrives]] in Anchorage at 9 p.m. (arrive)", "I [[am going to take|'m going to take]] lots of photos. (take)",
                "My brother [[is going to sleep|'s going to sleep]] on the plane. (sleep)", "What time [[does]] your plane [[land]]? (land)"] },
      { typ: "frei", t: "Schreibe einen Satz über einen festen Termin aus deinem Stundenplan.", tipp: "Zum Beispiel: On Monday our first lesson …",
        items: [{ f: "Wann beginnt oder endet bei dir etwas nach Plan?", kriterien: ["ein vollständiger englischer Satz", "simple present für einen festen Termin", "mit einer Zeitangabe"],
                  muster: "\\b(starts?|begins?|ends?|finish(es)?|leaves?|opens?|closes?|have|has)\\b.*\\b(at|on|tomorrow|next|every)\\b", bsp: "On Monday our first lesson starts at eight o'clock." }] }
    ]
  });
  </script>
