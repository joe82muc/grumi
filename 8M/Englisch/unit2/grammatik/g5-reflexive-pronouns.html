<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>

  <script>
  E8MSeite(2, "g");
  Grammatik.seite({
    nr: 1, modul: "e8-m-u2-g5", kurz: "G5",
    titel: "Reflexivpronomen",
    lead: "„I hurt **myself**.“ – „We enjoyed **ourselves**.“ Mit den Wörtern auf -self und -selves zeigst du auf die Person zurück, die etwas tut.",
    ziele: ["Du kennst alle acht Formen auf -self und -selves.", "Du benutzt sie, wenn jemand etwas mit sich selbst tut.", "Du betonst mit ihnen, dass jemand etwas selbst gemacht hat."],
    bild: { src: "g/g5-mirror.jpg", alt: "Im Flur einer Wohnung sitzt eine Katze vor einem hohen Spiegel und schaut sich mit großen Augen selbst an. Daneben flicht sich ein Mädchen vor dem Spiegel die Haare und lacht über die Katze. In der Küche dahinter macht sich ein Junge ein Sandwich.",
      satz: "The cat is looking at **itself**. The girl is braiding her hair **herself**.",
      de: "Die Katze schaut sich selbst an. Das Mädchen flicht sich die Haare selbst – ohne Hilfe. Beide Male zeigt das Wort auf -self auf die Person (oder das Tier) zurück." },
    merk: [
      { t: "Die Formen", html: `
        <table><tr><th>Einzahl</th><th></th><th>Mehrzahl</th><th></th></tr>
        <tr><td>I</td><td><b>myself</b></td><td>we</td><td><b>ourselves</b></td></tr>
        <tr><td>you</td><td><b>yourself</b></td><td>you</td><td><b>yourselves</b></td></tr>
        <tr><td>he / she / it</td><td><b>himself / herself / itself</b></td><td>they</td><td><b>themselves</b></td></tr></table>
        <p>Einzahl: <b>-self</b> · Mehrzahl: <b>-selves</b></p>` },
      { t: "Zurück auf die Person", html: `
        <p>Wer etwas tut und wem es passiert, ist <b>dieselbe Person</b>. Dann nimmst du <b>myself, herself …</b></p>
        <div class="bsp"><b>I</b> hurt <b>myself</b>. <i>– Ich habe mir wehgetan.</i></div>
        <div class="bsp"><b>She</b> taught <b>herself</b> to swim. <i>– Sie hat sich das Schwimmen selbst beigebracht.</i></div>
        <p>Geht es um eine <b>andere</b> Person, nimmst du me, him, her: <i>She helped <b>him</b>.</i></p>` },
      { t: "Betonen: selbst", html: `
        <p>Du willst sagen, dass jemand etwas <b>selbst</b> (ohne Hilfe) gemacht hat. Das Wort steht dann oft am Satzende:</p>
        <div class="bsp">I made the cake <b>myself</b>. <i>– … selbst gemacht.</i></div>
        <div class="bsp">They painted the room <b>themselves</b>.</div>` },
      { t: "Verben, die du oft hörst", html: `
        <ul class="wb-liste"><li><b>hurt yourself</b><span>sich wehtun</span></li><li><b>enjoy yourself</b><span>sich amüsieren</span></li>
        <li><b>introduce yourself</b><span>sich vorstellen</span></li><li><b>teach yourself</b><span>sich etwas selbst beibringen</span></li>
        <li><b>help yourself</b><span>sich bedienen</span></li><li><b>look at yourself</b><span>sich ansehen</span></li>
        <li><b>make yourself</b><span>sich etwas machen</span></li><li><b>ask yourself</b><span>sich fragen</span></li></ul>` }
    ],
    fallen: [
      "Nicht jedes deutsche „sich“ wird übersetzt: sich treffen = **meet**, sich fühlen = **feel**, sich beeilen = **hurry**. Nicht: ~~We met ourselves.~~",
      "Mehrzahl mit **-selves**: ourselves, yourselves, themselves. Nicht: ~~themself, ourself~~.",
      "Es heißt **himself** und **themselves**. Nicht: ~~hisself, theirselves~~.",
      "Bei Körperteilen nimmst du my, your, her, their …: The children washed **their hands**. Nicht: ~~The children washed themselves their hands.~~"
    ],
    basis: [
      { typ: "regelheft", davor: "📓 Zuerst: dein Regelheft", t: "Schreibe den Eintrag in dein Regelheft.", tag: "Regelheft",
        info: "Schreibe sauber ab. Die Überschrift unterstreichst du mit dem Lineal, die farbigen Wörter schreibst du farbig.",
        kopf: "Reflexivpronomen",
        html: `<p><span class="rot">myself, yourself, himself, herself, itself</span><br><span class="blau">ourselves, yourselves, themselves</span></p>
          <p>Ich tue etwas mit <u>mir selbst</u>: I hurt <span class="rot">myself</span>. We enjoyed <span class="blau">ourselves</span>.</p>
          <p>Betonen (selbst): I made the cake <span class="rot">myself</span>.</p>
          <p>Merke: Einzahl -self, Mehrzahl -selves.</p>` },

      { typ: "paare", davor: "Teil 1 · Die Formen", t: "Welches Reflexivpronomen gehört zu welcher Person?", tipp: "Einzahl endet auf -self, Mehrzahl auf -selves.",
        paare: [["I", "myself"], ["you (eine Person)", "yourself"], ["he", "himself"], ["she", "herself"], ["it", "itself"], ["we", "ourselves"], ["you (mehrere)", "yourselves"], ["they", "themselves"]] },
      { typ: "zuordnen", t: "Einzahl oder Mehrzahl? Sortiere die Wörter.", tipp: "-self → eine Person · -selves → mehrere Personen",
        gruppen: ["Einzahl (-self)", "Mehrzahl (-selves)"],
        karten: [["myself", 0], ["yourself", 0], ["himself", 0], ["herself", 0], ["itself", 0], ["ourselves", 1], ["yourselves", 1], ["themselves", 1]] },
      { typ: "luecke", t: "Wähle das passende Pronomen.", tipp: "Auf wen zeigt das Pronomen zurück? Suche die Person am Satzanfang.",
        items: ["I taught {{myself|yourself|himself}} to play the guitar.", "Be careful, Omar, or you will hurt {{yourself|myself|themselves}}.",
                "My little sister can already dress {{herself|himself|itself}}.", "Ben looked at {{himself|herself|ourselves}} in the window.",
                "The dog scratched {{itself|himself|themselves}} behind the ear."] },
      { typ: "luecke", t: "Schreibe das Reflexivpronomen in die Lücke.", tipp: "Mehrzahl: -selves",
        items: ["We really enjoyed [[ourselves]] at the lake.", "The new pupils introduced [[themselves]] to the class.", "Kids, please help [[yourselves]] to some fruit!",
                "My grandpa fell and hurt [[himself]].", "I sometimes ask [[myself]] why I am so tired."] },

      { typ: "luecke", davor: "Teil 2 · Zurück auf die Person oder jemand anderes?", t: "Setze das Reflexivpronomen ein. Das Verb in Klammern hilft dir.", tipp: "Die Person, die etwas tut, ist auch die Person, der es passiert.",
        items: ["Lena cut [[herself]] with a knife. (cut)", "Aylin taught [[herself]] to skate. (teach)", "We looked at [[ourselves]] in the shop window. (look at)",
                "The boys made [[themselves]] a big pizza. (make)", "I burnt [[myself]] on the hot pan. (burn)"] },
      { typ: "wahl", t: "Wer macht was? Welcher Satz stimmt?", mischen: true, tipp: "Dieselbe Person → myself, herself … · eine andere Person → me, him, her …",
        items: [
          { f: "Mia sieht sich selbst im Spiegel.", o: ["Mia sees herself in the mirror.", "Mia sees her in the mirror."], a: 0, e: "Mia sieht Mia – dieselbe Person. Darum herself." },
          { f: "Ben sieht seinen Freund auf dem Foto.", o: ["Ben sees him in the photo.", "Ben sees himself in the photo."], a: 0, e: "Ein anderer Junge ist gemeint – darum him." },
          { f: "Wir haben uns auf der Party amüsiert.", o: ["We enjoyed ourselves at the party.", "We enjoyed us at the party."], a: 0, e: "sich amüsieren = enjoy yourself." },
          { f: "Ich helfe meiner Schwester.", o: ["I help her.", "I help herself."], a: 0, e: "Die Schwester ist eine andere Person als „I“ – darum her." }
        ] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Subjekt – Verb – Pronomen – Rest.",
        items: [{ teile: ["She", "taught", "herself", "to swim."] }, { teile: ["We", "enjoyed", "ourselves", "at the party."] },
                { teile: ["The cat", "looked at", "itself", "in the mirror."] }, { teile: ["I", "hurt", "myself", "on the stairs."] }] },
      { typ: "markieren", t: "Markiere in jedem Satz das Reflexivpronomen.", stiftName: "Reflexivpronomen",
        items: ["Lena cut [herself] with a knife.", "The boys introduced [themselves] to the teacher.", "Did you hurt [yourself]?", "I made a sandwich for [myself].", "The kitten washed [itself]."] },

      { typ: "paare", davor: "Teil 3 · Betonen und feste Wendungen", t: "Welche Wendung heißt was?", tipp: "Die Tabelle „Verben, die du oft hörst“ oben hilft dir.",
        paare: [["enjoy yourself", "sich amüsieren"], ["help yourself", "sich bedienen"], ["introduce yourself", "sich vorstellen"], ["hurt yourself", "sich wehtun"],
                ["teach yourself", "sich etwas selbst beibringen"], ["look at yourself", "sich ansehen"]] },
      { typ: "luecke", t: "Betone, dass die Person es selbst getan hat. Setze das passende Pronomen ein.", tipp: "Das Pronomen steht oft am Satzende.",
        items: ["I made this bracelet [[myself]].", "My brother repaired his bike [[himself]].", "Did you write this song [[yourself]]?", "We planned the trip [[ourselves]]."] },
      { typ: "wahl", t: "Zurückzeigen oder betonen? Wozu steht das Pronomen hier?", tipp: "Kannst du „selbst / ohne Hilfe“ einsetzen? Dann wird betont.",
        items: [
          { s: "Noah built the model plane himself.", o: ["betonen (selbst)", "zurückzeigen (sich)"], a: 0 },
          { s: "Elif hurt herself at football training.", o: ["zurückzeigen (sich)", "betonen (selbst)"], a: 0 },
          { s: "Did you bake this cake yourself?", o: ["betonen (selbst)", "zurückzeigen (sich)"], a: 0 },
          { s: "The boys locked themselves out of the flat.", o: ["zurückzeigen (sich)", "betonen (selbst)"], a: 0 }
        ] }
    ],
    plus: [
      { typ: "luecke", t: "Mit Pronomen oder ohne? Wähle aus. („–“ heißt: nichts einsetzen)", tipp: "meet, feel, hurry stehen ohne Reflexivpronomen.",
        items: ["Hurry {{–|yourself}} up, the bus is coming!", "We met {{–|ourselves}} at the station at eight.", "The kids enjoyed {{themselves|–}} at the swimming pool.",
                "I feel {{–|myself}} much better today.", "My cousin taught {{herself|–}} to play the piano."] },
      { typ: "umformen", t: "Betone, dass die Person es selbst getan hat.", tipp: "Hänge das passende Pronomen an den Satz an.",
        items: [
          { s: "I painted my room.", l: ["I painted my room myself.", "I myself painted my room."] },
          { s: "The students organised the concert.", l: ["The students organised the concert themselves.", "The students themselves organised the concert.", "The students organized the concert themselves."] },
          { s: "My mum fixed the car.", l: ["My mum fixed the car herself.", "My mum herself fixed the car."] }
        ] },
      { typ: "luecke", t: "Eine Nachricht von einem Ausflug: Setze die richtigen Wörter ein.", tipp: "Auf wen zeigt das Wort zurück? Oder ist eine andere Person gemeint?",
        items: ["Hi Mia! We are having a great time and we are really enjoying [[ourselves]].", "Yesterday Ben fell off his bike and hurt [[himself]].",
                "I helped {{him|himself}} with his bag.", "Our guide, Mrs Parker, introduced [[herself]] and told us about the day.", "The twins made lunch [[themselves]] – it was great!"] },
      { typ: "wahl", t: "Finde den richtigen Satz.", mischen: true, tipp: "Zeigt das Wort auf dieselbe Person zurück, oder ist jemand anderes gemeint?",
        items: [
          { f: "Dana hat sich selbst im Spiegel gesehen.", o: ["Dana saw herself in the mirror.", "Dana saw her in the mirror."], a: 0, e: "Dieselbe Person – herself." },
          { f: "Dana hat ihre Freundin Mia im Spiegel gesehen.", o: ["Dana saw her in the mirror.", "Dana saw herself in the mirror."], a: 0, e: "Eine andere Person – her." },
          { f: "Die Kinder haben sich die Hände gewaschen.", o: ["The children washed their hands.", "The children washed themselves their hands."], a: 0, e: "Bei Körperteilen nimmst du im Englischen meist their, my, her …" }
        ] },
      { typ: "frei", t: "Schreibe über dich: zwei Sätze.", tipp: "Zum Beispiel: Was hast du dir selbst beigebracht? Was hast du schon einmal selbst gemacht?",
        items: [
          { f: "Schreibe einen Satz mit einem Reflexivpronomen (zurückzeigen), z. B. mit teach, hurt oder enjoy.", kriterien: ["ein vollständiger englischer Satz", "ein Pronomen auf -self oder -selves"], muster: "\\b(myself|yourself|himself|herself|itself|ourselves|yourselves|themselves)\\b", bsp: "I taught myself to play chess." },
          { f: "Schreibe einen Satz, in dem du betonst, dass du etwas selbst gemacht hast.", kriterien: ["ein vollständiger englischer Satz", "myself als Betonung"], muster: "\\bmyself\\b", bsp: "I made my birthday cake myself." }
        ] }
    ]
  });
  </script>
