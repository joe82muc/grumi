.vbs-kopf{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700}
.vbs-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}.vbs-bar div{height:100%;background:var(--ok);transition:width .3s}
.vbs-marken{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.vbs-marken span{font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--sky-l);color:var(--sky-d)}
.vbs-marken span.t{background:#fef3c7;color:#92400e}
.vbs-zahl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.vbs-zahl input{width:9em;padding:10px 12px;border:2px solid #b9cbd8;border-radius:12px;font:inherit;font-size:1.1rem}
.vbs-stand{width:100%;border-collapse:collapse;margin:10px 0}
.vbs-stand td{padding:8px 6px;border-top:1px solid var(--line);font-weight:600}
.vbs-stand td:last-child{text-align:right;white-space:nowrap}
.vbs-sicher{color:var(--ok);font-weight:800}.vbs-ueben{color:#b77a06;font-weight:800}
textarea.vbs-text{width:100%;min-height:110px;padding:10px 12px;border:2px solid #b9cbd8;border-radius:12px;font:inherit}
