<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Proben und Lernfortschritt &ndash; Verwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101a2e; --muted:#5d6b84; --line:#dce4f0;
    --dark:#1f2937; --dark-2:#111827; --accent:#1d6fe0; --accent-soft:#e8f0fd;
    --ok:#15803d; --ok-bg:#e9f8ee; --ok-line:#8fd6a8;
    --bad:#c2340f; --bad-bg:#fdeeeb; --bad-line:#f3b5a6;
    --warn:#8a5a00; --warn-bg:#fff6e3; --warn-line:#f0d094;
    --shadow:0 10px 28px rgba(16,26,46,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Source Sans 3",system-ui,"Segoe UI",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#f5f7fa,#eceff5);min-height:100vh;padding:1rem;
  }
  .wrap{max-width:1080px;margin:0 auto}
  .head{
    background:linear-gradient(125deg,var(--dark),var(--dark-2));color:#fff;
    border-radius:18px;padding:1.2rem 1.3rem;box-shadow:var(--shadow);
  }
  .head h1{font-size:clamp(1.3rem,4.4vw,1.8rem);font-weight:800}
  .head p{opacity:.85;margin-top:.3rem;font-size:.93rem}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:1.1rem;box-shadow:var(--shadow);margin-top:1rem;
  }
  h2{font-size:1.05rem;font-weight:800;margin-bottom:.15rem}
  .sub{color:var(--muted);font-size:.88rem;margin-bottom:.9rem}

  label{display:block;font-size:.76rem;font-weight:800;letter-spacing:.04em;
        text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
  input[type=password]{
    width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:10px;
    font-size:1rem;font-family:inherit;font-weight:600;color:var(--ink);
  }
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

  .btn{
    padding:.7rem 1.3rem;border:none;border-radius:999px;background:var(--dark);color:#fff;
    font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .btn:hover:not(:disabled){background:var(--dark-2)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:.4rem .85rem;font-size:.82rem}
  .btn-ghost{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
  .btn-ghost:hover:not(:disabled){background:#f3f5f9}
  .btn-ok{background:var(--ok)} .btn-ok:hover:not(:disabled){background:#116631}
  .btn-bad{background:var(--bad)} .btn-bad:hover:not(:disabled){background:#a32b0c}
  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}

  .note{border-left:4px solid var(--line);background:#f7f9fc;padding:.7rem .9rem;
        border-radius:8px;font-size:.9rem;margin-top:.8rem;font-weight:600}
  .note.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
  .note.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
  .note.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}

  /* Proben: Fachgruppen und Karten */
  .group{margin-top:1.3rem}
  .group:first-child{margin-top:.2rem}
  .group-head{
    display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;
    border-bottom:2px solid var(--line);padding-bottom:.35rem;margin-bottom:.7rem;
  }
  .group-head h3{font-size:.8rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
  .group-head .cnt{font-size:.78rem;color:var(--muted);font-weight:700}

  .test-card{
    border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;margin-bottom:.7rem;
    display:flex;justify-content:space-between;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;
  }
  .test-card.open{border-color:var(--ok-line);background:var(--ok-bg)}
  .test-card .left{flex:1 1 320px;min-width:0}
  .test-card .who{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
  .klasse{
    background:var(--dark);color:#fff;border-radius:7px;padding:.15rem .5rem;
    font-size:.74rem;font-weight:900;letter-spacing:.03em;white-space:nowrap;
  }
  .test-card h4{font-size:.98rem;font-weight:800}
  .test-card .meta{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:.15rem}
  .right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .state{font-size:.78rem;font-weight:800;border-radius:99px;padding:.22rem .7rem}
  .state.on{background:var(--ok);color:#fff}
  .state.off{background:#e4e8ef;color:var(--muted)}
  .src{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:.3rem;display:flex;flex-wrap:wrap;gap:.3rem .9rem}
  .src a{color:var(--accent)}
  .schuelerlink{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;
    background:#fff;border:1.5px dashed var(--ok-line);border-radius:10px;padding:.55rem .7rem;font-size:.88rem;font-weight:700}
  .schuelerlink a{color:var(--ok);overflow-wrap:anywhere;min-width:0}
  .schuelerlink .lbl{color:var(--ok);white-space:nowrap}

  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
  .spacer{flex:1}
  .hidden{display:none}
  .skel{color:var(--muted);font-weight:600;font-size:.9rem;padding:.6rem 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Proben und Lernfortschritt</h1>
    <p>Klasse wählen, dann Proben freischalten, Noten und Lernfortschritt je Fach ansehen oder Codes verwalten.</p>
  </div>

  <!-- ============ Anmeldung ============ -->
  <section class="panel" id="view-login">
    <h2>Anmelden</h2>
    <p class="sub">Es gilt dasselbe Lehrkraft-Passwort wie auf den einzelnen Fachseiten.</p>
    <label for="pw">Lehrkraft-Passwort</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="btn-row">
      <button class="btn" id="btn-login" type="button">Anmelden</button>
    </div>
    <div id="login-msg"></div>
  </section>

  <!-- ============ Verwaltung: Klassen, Fächer, Proben, Codes (lernfortschritt.js) ============ -->
  <section class="panel hidden" id="view-main"></section>

</div>

<script src="lernfortschritt.js"></script>
<script>
/* ============================================================
   Proben verwalten - alle Module an einer Stelle

   Jede Probenart hat auf dem Server ein eigenes Modul mit eigenen
   Endpunkten. Proben.zeigen() fragt alle Module ab und zeigt das
   Ergebnis nach Fach gruppiert, auf Wunsch nur für eine Klasse
   (Stufe und Zug). Zum Sperren und Freischalten spricht die Seite
   denselben unlock-Endpunkt an wie die jeweilige Fachseite - es gibt
   also keine Sonderlogik auf dem Server. Bei offenen Proben steht der
   Link, unter dem die Kinder die Probe schreiben.
   ============================================================ */
const API_BASE = (location.hostname.includes('github.io') || location.protocol === 'file:')
  ? 'https://englisch-9.onrender.com' : '';

/* Die Module. "unlockPath" weicht bei nt7 ab (dort liegt die Freischaltung
   unter /teacher/unlock). link = Lehrerseite (Ergebnisse), schueler = Seite
   für die Kinder. klasse: "7" = alle 7. Klassen, "7M"/"7R" = nur dieser Zug. */
const MODULES = [
  {
    key:'vokabeltest', subject:'Englisch',
    listPath:'/api/vokabeltest/list', unlockPath:'/api/vokabeltest/unlock',
    klasse: idKlasse, link: t => englischSeite(t, 'test/lehrer.html'),
    schueler: t => englischSeite(t, 'test/vokabeltest.html') + '?test=' + encodeURIComponent(t.id)
  },
  {
    /* Englisch 9R, 9M, 7M und 7R: Grammatikprobe und Grammatiktests G1-G4 (Unit 1) */
    key:'grammatik9r', subject:'Englisch',
    listPath:'/api/grammatik9r/list', unlockPath:'/api/grammatik9r/unlock',
    klasse: idKlasse, link: t => englischSeite(t, 'probe/lehrer.html'),
    schueler: t => englischSeite(t, 'probe/grammatikprobe.html') + '?test=' + encodeURIComponent(t.id)
  },
  {
    key:'nt7', subject:'Natur und Technik',
    listPath:'/api/nt7/list', unlockPath:'/api/nt7/teacher/unlock',
    /* Die NT-Übersicht zeigt die Proben nur in 7M */
    klasse: () => '7M', link: () => '7M/NT/lehrer.html',
    schueler: t => '7M/NT/probe.html?probe=' + (/-2$/.test(t.id) ? '2' : '1')
  },
  {
    /* Der Argumentationstrainer kennt keine Freischaltung - er ist
       immer offen. Er steht hier nur als Hinweis mit Link. */
    key:'de7-argument', subject:'Deutsch', noUnlock:true,
    title:'Argumentation üben (immer offen)',
    listPath:null, unlockPath:null,
    klasse: () => '7', link: () => '7M/Deutsch/lehrer.html', schueler: () => '7M/Deutsch/argumentationstrainer.html'
  },
  {
    key:'infoaustausch', subject:'Informatik',
    listPath:'/api/infoaustausch/list', unlockPath:'/api/infoaustausch/unlock',
    klasse: () => '7', link: () => '7/Informatik_7/probe/lehrer.html', schueler: () => '7/Informatik_7/probe/probe.html'
  },
  {
    key:'informatik8', subject:'Informatik',
    listPath:'/api/informatik8/list', unlockPath:'/api/informatik8/unlock',
    klasse: () => '8', link: () => '8/Informatik_8/probe/lehrer.html', schueler: () => '8/Informatik_8/probe/probe.html'
  },
  {
    /* NT 9M/9R: Probe Organische Rohstoffe (Module 1-7), je eine Fassung pro Zug */
    key:'nt9probe', subject:'Natur und Technik',
    listPath:'/api/nt9probe/list', unlockPath:'/api/nt9probe/unlock',
    klasse: t => /^nt9r-/.test(t.id) ? '9R' : '9M',
    link: t => (/^nt9r-/.test(t.id) ? '9R' : '9M') + '/NT_9/App12_Organische_Rohstoffe/lehrer.html',
    schueler: t => (/^nt9r-/.test(t.id) ? '9R' : '9M') + '/NT_9/App12_Organische_Rohstoffe/probe.html'
  },
  {
    key:'netzwerktest', subject:'Informatik',
    listPath:'/api/netzwerktest/list', unlockPath:'/api/netzwerktest/unlock',
    klasse: () => '9', link: () => '9/Informatik_9/Netzwerke/lehrer.html', schueler: () => '9/Informatik_9/Netzwerke/probe.html'
  },
  {
    key:'filiuspruefung', subject:'Informatik',
    listPath:'/api/filiuspruefung/list', unlockPath:'/api/filiuspruefung/unlock',
    klasse: () => '9', link: () => '9/Informatik_9/Filius/lehrer.html', schueler: () => '9/Informatik_9/Filius/pruefung.html'
  }
];

/* Englisch-Tests: Stufe, Zug und Unit stecken in der Test-ID
   (e7-u1-…, e7m-u1-…, e8r-u2-…, e9r-u1-…, e9m-u1-…) */
function idKlasse(t){
  const m = String(t.id || '').match(/^e(\d+)([mr]?)-/i);
  if(m) return m[1] + m[2].toUpperCase();
  return String(t.classLevel || '?');
}
function englischSeite(t, datei){
  const m = String(t.id || '').match(/^e(\d+)([mr]?)-u(\d+)-/i);
  if(!m) return '';
  const st = m[1], zug = m[2].toLowerCase(), unit = 'unit' + m[3] + '/';
  if(st === '7') return '7/Englisch_7/' + unit + datei;
  if(st === '8') return '8R/Englisch/' + unit + datei;
  if(st === '9') return (zug === 'm' ? '9M/Englisch_9/' : '9R/Englisch/') + unit + datei;
  return '';
}

/* Reihenfolge der Faecher in der Anzeige */
const SUBJECT_ORDER = ['Englisch','Deutsch','Mathematik','Natur und Technik','Informatik'];

let PW = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

function note(el, text, kind){
  el.innerHTML = text ? '<div class="note ' + (kind || '') + '">' + esc(text) + '</div>' : '';
}

/* ---------- Anmelden ---------- */
$('btn-login').addEventListener('click', login);
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });

async function login(){
  const pw = $('pw').value.trim();
  if(!pw){ note($('login-msg'),'Bitte das Passwort eingeben.','bad'); return; }

  $('btn-login').disabled = true;
  $('btn-login').textContent = 'Wird geprüft …';
  note($('login-msg'),'');

  // Gegen ein Modul mit unlock-Endpunkt pruefen: ein bewusst
  // unbekannter Test liefert bei richtigem Passwort 404, bei
  // falschem 401. So wird nichts veraendert.
  try{
    const res = await fetch(API_BASE + '/api/vokabeltest/unlock', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, testId:'__pruefung__', open:false })
    });
    if(res.status === 401){
      note($('login-msg'),'Das Passwort stimmt nicht.','bad');
      $('btn-login').disabled = false;
      $('btn-login').textContent = 'Anmelden';
      return;
    }
    PW = pw;
    $('view-login').classList.add('hidden');
    $('view-main').classList.remove('hidden');
    window.Verwaltung.zeigen($('view-main'), PW, API_BASE, Proben);
  }catch(e){
    note($('login-msg'),'Keine Verbindung zum Server. Bitte später noch einmal versuchen.','bad');
    $('btn-login').disabled = false;
    $('btn-login').textContent = 'Anmelden';
  }
}

/* ============ Proben ============ */
const Proben = (() => {
  let ROWS = [], FEHLEND = [], laden = null, ziel = null, filter = null;

  async function alleLaden(){
    const rows = [], fehlend = [];
    await Promise.all(MODULES.map(async (mod) => {
      if(mod.noUnlock){
        // Kein Freischalten moeglich - nur als Hinweiszeile anzeigen.
        rows.push({ mod, subject: mod.subject, id: mod.key, title: mod.title, klasse: mod.klasse(),
                    unlocked: false, noUnlock: true, link: mod.link(), schueler: mod.schueler() });
        return;
      }
      try{
        const res = await fetch(API_BASE + mod.listPath);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        (data.tests || []).forEach(t => rows.push({
          mod, subject: mod.subject, id: t.id, title: t.title || t.id, klasse: mod.klasse(t),
          unlocked: Boolean(t.unlocked), itemCount: t.itemCount, maxPoints: t.maxPoints,
          link: mod.link(t), schueler: mod.schueler(t)
        }));
      }catch(e){ fehlend.push(mod.key); }
    }));
    ROWS = rows; FEHLEND = fehlend;
  }

  // f: { stufe, zug } oder null (alle). Probe „7“ gilt für alle 7. Klassen, „7M“ nur für den M-Zug.
  function passt(r){
    if(!filter) return true;
    return r.klasse === String(filter.stufe) || r.klasse === filter.stufe + filter.zug;
  }

  async function zeigen(container, f){
    ziel = container; filter = f;
    container.innerHTML =
      '<div class="toolbar" style="margin-bottom:.4rem"><div class="spacer"></div>' +
      '<button class="btn btn-ghost btn-sm" id="pr-reload" type="button">Neu laden</button>' +
      '<button class="btn btn-bad btn-sm" id="pr-lock-all" type="button">' + (f ? 'Alle offenen hier sperren' : 'Alle sperren') + '</button></div>' +
      '<div id="pr-msg"></div><div id="pr-groups"><div class="skel">Proben werden geladen …</div></div>' +
      '<div class="note">Ergebnisse ansehen, nachkorrigieren und als CSV exportieren geht auf der jeweiligen Fachseite – der Link „Ergebnisse“ steht bei jeder Probe.</div>';
    $('pr-reload').addEventListener('click', () => neuLaden());
    $('pr-lock-all').addEventListener('click', allesSperren);
    await neuLaden();
  }

  async function neuLaden(){
    laden = alleLaden();
    await laden;
    render();
  }

  function render(){
    if(!ziel || !document.body.contains(ziel)) return;
    const box = $('pr-groups');
    box.innerHTML = '';
    const sichtbar = ROWS.filter(passt);
    if(!sichtbar.length){
      box.innerHTML = '<div class="skel">' + (ROWS.length ? 'Für diese Klasse gibt es (noch) keine Proben.' : 'Es konnten keine Proben geladen werden.') + '</div>';
    }
    const subjects = [...new Set(sichtbar.map(r => r.subject))];
    subjects.sort((a,b) => {
      const ia = SUBJECT_ORDER.indexOf(a), ib = SUBJECT_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    subjects.forEach(sub => {
      const rows = sichtbar.filter(r => r.subject === sub);
      rows.sort((a,b) => a.klasse.localeCompare(b.klasse, 'de', {numeric:true}) || a.title.localeCompare(b.title, 'de'));
      const g = document.createElement('div');
      g.className = 'group';
      const offen = rows.filter(r => r.unlocked && !r.noUnlock).length;
      g.innerHTML = '<div class="group-head"><h3>' + esc(sub) + '</h3><span class="cnt">' + rows.length +
        (rows.length === 1 ? ' Probe' : ' Proben') + (offen ? ' · ' + offen + ' offen' : '') + '</span></div>';
      rows.forEach(r => g.appendChild(card(r)));
      box.appendChild(g);
    });
    note($('pr-msg'), FEHLEND.length ? 'Diese Bereiche antworten gerade nicht: ' + FEHLEND.join(', ')
      + '. Die übrigen Proben lassen sich normal verwalten.' : '', 'warn');
  }

  function voll(pfad){ try { return new URL(pfad, location.href).href; } catch(e){ return pfad; } }

  function card(r){
    const el = document.createElement('div');
    el.className = 'test-card' + (r.unlocked ? ' open' : '');
    const teile = [];
    if(r.itemCount) teile.push(r.itemCount + ' Aufgaben');
    if(r.maxPoints) teile.push(r.maxPoints + ' Punkte');
    const offenLink = r.schueler && (r.unlocked || r.noUnlock);
    el.innerHTML =
      '<div class="left"><div class="who"><span class="klasse">Klasse ' + esc(r.klasse) + '</span><h4>' + esc(r.title) + '</h4></div>' +
      '<div class="meta">' + esc(teile.join(' · ')) + '</div>' +
      '<div class="src">' + (r.link ? '<a href="' + esc(r.link) + '">Ergebnisse und Export →</a>' : '') +
      (r.schueler && !offenLink ? '<a href="' + esc(r.schueler) + '" target="_blank" rel="noopener">Schülerseite ansehen ↗</a>' : '') + '</div></div>' +
      '<div class="right"></div>' +
      (offenLink ? '<div class="schuelerlink"><span class="lbl">🔗 Link für die Kinder:</span><a href="' + esc(r.schueler) + '" target="_blank" rel="noopener">' + esc(voll(r.schueler)) + '</a>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-kopieren>Link kopieren</button></div>' : '');
    const right = el.querySelector('.right');
    if(r.noUnlock){
      right.innerHTML = '<span class="state off">Ohne Freischaltung</span>';
    } else {
      right.innerHTML = '<span class="state ' + (r.unlocked ? 'on' : 'off') + '">' + (r.unlocked ? 'Offen' : 'Gesperrt') + '</span>';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-sm ' + (r.unlocked ? 'btn-bad' : 'btn-ok');
      btn.textContent = r.unlocked ? 'Sperren' : 'Freischalten';
      btn.addEventListener('click', () => toggle(r, !r.unlocked, btn));
      right.appendChild(btn);
    }
    const kop = el.querySelector('[data-kopieren]');
    if(kop) kop.addEventListener('click', () => kopieren(voll(r.schueler), kop));
    return el;
  }

  function kopieren(text, btn){
    const ok = () => { btn.textContent = '✓ Kopiert'; setTimeout(() => { btn.textContent = 'Link kopieren'; }, 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => window.prompt('Link kopieren:', text));
    else window.prompt('Link kopieren:', text);
  }

  async function toggle(r, open, btn){
    btn.disabled = true;
    const ok = await setUnlock(r, open);
    if(ok){
      await neuLaden();
      note($('pr-msg'), '„' + r.title + '“ ist jetzt ' + (open ? 'freigeschaltet. Den Link für die Kinder findest du direkt bei der Probe.' : 'gesperrt.'), 'ok');
    } else {
      note($('pr-msg'), 'Das hat nicht geklappt. Bitte noch einmal versuchen.', 'bad');
      btn.disabled = false;
    }
  }

  async function setUnlock(r, open){
    try{
      const res = await fetch(API_BASE + r.mod.unlockPath, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: PW, testId: r.id, open })
      });
      const data = await res.json();
      return Boolean(data && data.ok);
    }catch(e){ return false; }
  }

  async function allesSperren(){
    const offen = ROWS.filter(r => passt(r) && r.unlocked && !r.noUnlock);
    if(!offen.length){ note($('pr-msg'),'Es ist gerade nichts freigeschaltet.','ok'); return; }
    if(!confirm('Wirklich ' + offen.length + ' offene Proben sperren?\n\nLaufende Abgaben werden dadurch nicht gelöscht.')) return;
    $('pr-lock-all').disabled = true;
    let fehler = 0;
    for(const r of offen){ if(!(await setUnlock(r, false))) fehler++; }
    await neuLaden();
    note($('pr-msg'), fehler
      ? (offen.length - fehler) + ' Proben gesperrt, ' + fehler + ' haben nicht geklappt.'
      : 'Alle ' + offen.length + ' Proben sind jetzt gesperrt.', fehler ? 'bad' : 'ok');
  }

  // Lehrerseite einer Probe (für die Notenübersicht in lernfortschritt.js)
  function link(modul, testId){
    const mod = MODULES.find(m => m.key === modul);
    return mod && mod.link ? mod.link({ id: testId }) : '';
  }

  return { zeigen, link };
