services:
  - type: web
    name: grumi-mathe-ki
    runtime: node
    plan: free
    rootDir: render-mathe-ki
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: grumi-nt7-proben
    runtime: node
    plan: free
    rootDir: 7M/NT
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /api/nt7/health
    envVars:
      - key: TEACHER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
