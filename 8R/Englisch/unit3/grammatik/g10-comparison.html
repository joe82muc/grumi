  <script>
  E8Seite(3, "g");
  Grammatik.seite({
    nr: 3, modul: "e8-u3-g10", kurz: "G10",
    titel: "Adjektive steigern",
    lead: "„Texas is **bigger than** Florida, but Alaska is **the biggest** state.“ – Wenn du vergleichst, brauchst du die Steigerungsformen.",
    ziele: ["Du steigerst kurze Adjektive mit -er und -est.", "Du steigerst lange Adjektive mit more und most.", "Du vergleichst mit than und kennst good – better – best."],
    merk: [
      { t: "Kurze Adjektive: -er, -est", html: `
        <p>Eine Silbe – und zwei Silben, wenn das Wort auf <b>-y</b> endet:</p>
        <table><tr><th>Grundform</th><th>1. Steigerung</th><th>2. Steigerung</th></tr>
        <tr><td>old</td><td>old<b>er</b></td><td>the old<b>est</b></td></tr>
        <tr><td>nice</td><td>nice<b>r</b></td><td>the nice<b>st</b></td></tr>
        <tr><td>big</td><td>bi<b>gg</b>er</td><td>the bi<b>gg</b>est</td></tr>
        <tr><td>happy</td><td>happ<b>ier</b></td><td>the happ<b>iest</b></td></tr></table>` },
      { t: "Lange Adjektive: more, most", html: `
        <p>Zwei oder mehr Silben (außer auf -y):</p>
        <table><tr><th>Grundform</th><th>1. Steigerung</th><th>2. Steigerung</th></tr>
        <tr><td>famous</td><td><b>more</b> famous</td><td>the <b>most</b> famous</td></tr>
        <tr><td>expensive</td><td><b>more</b> expensive</td><td>the <b>most</b> expensive</td></tr></table>
        <p>Das Gegenteil: <b>less</b> expensive, the <b>least</b> expensive (weniger / am wenigsten teuer).</p>` },
      { t: "Unregelmäßig", html: `
        <table><tr><th>Grundform</th><th>1. Steigerung</th><th>2. Steigerung</th></tr>
        <tr><td>good</td><td><b>better</b></td><td>the <b>best</b></td></tr>
        <tr><td>bad</td><td><b>worse</b></td><td>the <b>worst</b></td></tr>
        <tr><td>much / many</td><td><b>more</b></td><td>the <b>most</b></td></tr></table>` },
      { t: "So vergleichst du", html: `
        <div class="bsp">Zwei Dinge: 1. Steigerung + <b>than</b> – <i>The river is longer <b>than</b> the canal.</i></div>
        <div class="bsp">Das Höchste von allen: <b>the</b> + 2. Steigerung – <i>It's <b>the</b> hottest month of the year.</i></div>` }
    ],
    fallen: [
      "**than** (als) schreibt man mit a. **then** heißt „dann“.",
      "Nie beides zusammen: ~~more bigger~~, ~~the most nicest~~ – richtig: **bigger**, **the nicest**.",
      "Vor der 2. Steigerung steht **the**: She is **the** fastest runner."
    ],
    basis: [
      { typ: "zuordnen", t: "-er/-est oder more/most? Sortiere die Adjektive.", tipp: "Kurz oder auf -y → -er/-est · lang → more/most",
        gruppen: ["-er / -est", "more / most"],
        karten: [["small", 0], ["hot", 0], ["funny", 0], ["cheap", 0], ["easy", 0], ["dangerous", 1], ["interesting", 1], ["beautiful", 1], ["popular", 1], ["boring", 1]] },
      { typ: "luecke", t: "Schreibe die 1. Steigerung.", tipp: "big → bigger · happy → happier · famous → more famous",
        items: ["tall → [[taller]]", "hot → [[hotter]]", "easy → [[easier]]", "nice → [[nicer]]", "difficult → [[more difficult]]", "good → [[better]]", "bad → [[worse]]"] },
      { typ: "luecke", t: "Setze die 1. Steigerung ein und vergleiche mit than.", tipp: "1. Steigerung + than",
        items: ["Summers in Louisiana are [[hotter]] than summers in Bavaria. (hot)", "This restaurant is [[more expensive]] than the snack bar. (expensive)",

      { typ: "luecke", t: "Setze die 2. Steigerung ein.", tipp: "the + -est oder the most …",
        items: ["August is the [[hottest]] month here. (hot)", "That was the [[most exciting]] day of the trip. (exciting)", "Who is the [[best]] cook in your family? (good)",
                "It's the [[cheapest]] ticket you can buy. (cheap)", "This is the [[worst]] storm of the year. (bad)"] },
      { typ: "paare", t: "Unregelmäßig und trickreich: Was gehört zusammen?",
        paare: [["good", "better"], ["bad", "worse"], ["many", "more"], ["happy", "happier"], ["big", "bigger"], ["famous", "more famous"]] },
      { typ: "wahl", t: "than oder then? more oder -er? Finde den richtigen Satz.", mischen: true,
        items: [
          { f: "Welcher Satz ist richtig?", o: ["My bike is faster than yours.", "My bike is faster then yours.", "My bike is more fast than yours."], a: 0 },
          { f: "Welcher Satz ist richtig?", o: ["This is the most beautiful beach.", "This is the beautifullest beach.", "This is the most beautifullest beach."], a: 0 },
          { f: "Welcher Satz ist richtig?", o: ["The blue jacket is less expensive than the red one.", "The blue jacket is lesser expensive than the red one.", "The blue jacket is less expensiver than the red one."], a: 0 }
        ] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.",
        items: [{ teile: ["Lemonade", "is", "sweeter", "than", "iced tea."] }, { teile: ["This", "is", "the most popular", "dish", "on the menu."] },
                { teile: ["The weather", "is", "worse", "than", "last week."] }] }
    ],
    plus: [
      { typ: "umformen", t: "Vergleiche die beiden Dinge in einem Satz. Benutze das Adjektiv in Klammern.", tipp: "… is + 1. Steigerung + than …",
        items: [
          { s: "The red bag costs 20 dollars. The blue bag costs 35 dollars. (expensive)", l: ["The blue bag is more expensive than the red bag.", "The blue bag is more expensive than the red one.", "The red bag is less expensive than the blue bag.", "The red bag is less expensive than the blue one."] },
          { s: "Tom is 14. His sister is 12. (old)", l: ["Tom is older than his sister.", "Tom is older than she is."] },
          { s: "The bus takes 30 minutes. The train takes 15 minutes. (fast)", l: ["The train is faster than the bus."] }
        ] },
      { typ: "frei", t: "Vergleiche zwei Jahreszeiten, Sportarten oder Gerichte in einem Satz.", tipp: "Zum Beispiel: Pizza is … than …",
        items: [{ f: "Dein eigener Vergleich mit than:", kriterien: ["ein vollständiger englischer Satz", "eine richtige Steigerungsform (-er oder more …)", "than"],
                  muster: "\\b([a-z]+er|more\\s+[a-z]+|less\\s+[a-z]+|better|worse)\\s+than\\b", bsp: "Summer is warmer than spring." }] }
    ]
  });
