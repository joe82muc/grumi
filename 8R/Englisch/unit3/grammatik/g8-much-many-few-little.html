  <script>
  E8Seite(3, "g");
  Grammatik.seite({
    nr: 1, modul: "e8-u3-g8", kurz: "G8",
    titel: "much, many, (a) few, (a) little",
    lead: "Viel oder viele? Ein paar oder ein bisschen? Im Englischen kommt es darauf an, ob du etwas **zählen** kannst: „**many** oranges“, aber „**much** juice“.",
    ziele: ["Du unterscheidest zählbare und nicht zählbare Nomen.", "Du wählst richtig zwischen much und many.", "Du benutzt a few und a little für kleine Mengen."],
    merk: [
      { t: "Zählbar oder nicht?", html: `
        <div class="bsp"><b>Zählbar:</b> Es gibt eine Mehrzahl – <i>one apple, two apple<b>s</b> · a friend, three friend<b>s</b></i></div>
        <div class="bsp"><b>Nicht zählbar:</b> keine Mehrzahl, kein a/an – <i>water, rice, money, time, music, homework, weather</i></div>
        <p>Probe: Kannst du „drei …“ davor sagen? <i>three waters</i> klingt falsch → nicht zählbar.</p>` },
      { t: "much und many", html: `
        <table><tr><th></th><th>Nomen</th><th>Beispiel</th></tr>
        <tr><td><b>many</b> (viele)</td><td>zählbar, Mehrzahl</td><td>many people, many ideas</td></tr>
        <tr><td><b>much</b> (viel)</td><td>nicht zählbar</td><td>much time, much rain</td></tr></table>
        <p>Fragen: <b>How many</b> tickets do we need? · <b>How much</b> money do you have?</p>` },
      { t: "a few und a little", html: `
        <table><tr><th></th><th>Nomen</th><th>Beispiel</th></tr>
        <tr><td><b>a few</b> (ein paar)</td><td>zählbar, Mehrzahl</td><td>a few minutes, a few friends</td></tr>
        <tr><td><b>a little</b> (ein bisschen)</td><td>nicht zählbar</td><td>a little milk, a little help</td></tr></table>` },
      { t: "Ohne a: fast nichts", html: `
        <p><b>few</b> = sehr wenige · <b>little</b> = sehr wenig. Das klingt eher negativ:</p>
        <div class="bsp">I have <b>a few</b> friends here. <i>– ein paar, das ist schön.</i></div>
        <div class="bsp">I have <b>few</b> friends here. <i>– kaum welche, schade.</i></div>
        <p>Praktisch: <b>a lot of</b> passt zu beiden – <i>a lot of people, a lot of rain</i>.</p>` }
    ],
    fallen: [
      "**money** ist nicht zählbar: How **much** money …? (Zählen kannst du nur dollars, euros, coins.)",
      "Nach many und a few steht die **Mehrzahl**: many book**s**, a few day**s**.",
      "**homework, information, advice, news** sind im Englischen nicht zählbar – also much, a little."
    ],
    basis: [
      { typ: "zuordnen", t: "Zählbar oder nicht zählbar? Sortiere die Nomen.", tipp: "Passt „three …“ davor?",
        gruppen: ["zählbar", "nicht zählbar"],
        karten: [["tomatoes", 0], ["friends", 0], ["minutes", 0], ["questions", 0], ["sandwiches", 0], ["water", 1], ["money", 1], ["time", 1], ["rice", 1], ["homework", 1]] },
      { typ: "paare", t: "Was bedeutet was? Verbinde.",
        paare: [["many", "viele"], ["much", "viel"], ["a few", "ein paar"], ["a little", "ein bisschen"], ["few", "sehr wenige"], ["little", "sehr wenig"]] },
      { typ: "luecke", t: "much oder many?", tipp: "zählbar (Mehrzahl) → many · nicht zählbar → much",
        items: ["We don't have {{much|many}} time before the bus leaves.", "There are {{many|much}} restaurants in New Orleans.", "I didn't eat {{much|many}} rice.",
                "How {{many|much}} people are coming to the barbecue?", "How {{much|many}} sugar do you take in your tea?", "She hasn't got {{many|much}} cousins."] },
      { typ: "luecke", t: "a few oder a little?", tipp: "zählbar → a few · nicht zählbar → a little",
        items: ["Could I have {{a little|a few}} more lemonade, please?", "We stayed in Memphis for {{a few|a little}} days.", "I only need {{a little|a few}} help with this exercise.",
                "There are {{a few|a little}} peaches left in the bowl.", "Add {{a little|a few}} salt to the soup."] },
      { typ: "wahl", t: "Welche Frage passt zur Antwort?",
        items: [
          { s: "– About twenty.", o: ["How many students are in your class?", "How much students are in your class?"], a: 0 },
          { s: "– Only five dollars.", o: ["How much money have you got?", "How many money have you got?"], a: 0 },
          { s: "– Three bottles.", o: ["How many bottles of water do we need?", "How much bottles of water do we need?"], a: 0 },
          { s: "– Not much, just a glass.", o: ["How much juice did you drink?", "How many juice did you drink?"], a: 0 }
        ] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.",
        items: [{ teile: ["There", "isn't", "much", "milk", "in the fridge."] }, { teile: ["How many", "songs", "do", "you", "know?"] },
                { teile: ["We", "have", "a few", "ideas", "for the party."] }, { teile: ["Can", "I", "have", "a little", "more time?"] }] },
      { typ: "luecke", t: "Schreibe das passende Wort: much, many, few oder little.", tipp: "Achte auf das Nomen dahinter – und ob „a“ davorsteht.",
        items: ["Hurry up! We haven't got [[much]] time.", "How [[many]] brothers and sisters do you have?", "I can stay for a [[few]] minutes.",
                "There's only a [[little]] cake left.", "Were there [[many]] tourists at the beach?"] }
    ],
    plus: [
      { typ: "wahl", t: "Mit a oder ohne? Was ist gemeint?", tipp: "a few / a little = ein paar, etwas (gut) · few / little = fast nichts (schade)",
        items: [
          { s: "Luckily, we still have ___ time. Let's get an ice cream.", o: ["a little", "little"], a: 0, e: "Es ist noch etwas Zeit da – positiv → a little." },
          { s: "The test was really hard. ___ students got a good mark.", o: ["Few", "A few"], a: 0, e: "Fast niemand – negativ → few." },
          { s: "I'm not alone here. I have ___ good friends.", o: ["a few", "few"], a: 0, e: "Ein paar gute Freunde – positiv → a few." },
          { s: "There is ___ hope that the weather will get better. Take an umbrella.", o: ["little", "a little"], a: 0, e: "Kaum Hoffnung – negativ → little." }
        ] },
      { typ: "umformen", t: "Sag dasselbe mit much oder many.", tipp: "a lot of → much (nicht zählbar) oder many (zählbar)",
        items: [
          { s: "We don't have a lot of money.", l: ["We don't have much money.", "We do not have much money."] },
          { s: "Are there a lot of museums in your town?", l: ["Are there many museums in your town?"] },
          { s: "She didn't make a lot of mistakes.", l: ["She didn't make many mistakes.", "She did not make many mistakes."] }
        ] }
    ]
  });
  </script>
