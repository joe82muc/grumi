  <script>
  E8Seite(1, "w");
  Grammatik.seite({
    nr: 1, lsNr: 2, modul: "e8-u1-w1", kurz: "WB1",
    titel: "Interviewing a new arrival",
    lead: "Jemand ist neu in der Stadt – und du möchtest mehr erfahren. Hier übst du die **Fragen**, die **Antworten** und kleine Sätze, mit denen du im Gespräch **nachhakst**.",
    ziele: ["Du stellst die wichtigsten Interviewfragen.", "Du sprichst über Herkunft, Gründe und Pläne.", "Du reagierst im Gespräch und fragst nach."],
    merk: [
      { t: "Fragen stellen", html: `
        <ul class="wb-liste"><li><b>Where are you from?</b><span>Woher kommst du?</span></li><li><b>How long have you been here?</b><span>Wie lange bist du schon hier?</span></li>
        <li><b>Why did you come here?</b><span>Warum bist du hierhergekommen?</span></li><li><b>What was the journey like?</b><span>Wie war die Reise?</span></li>
        <li><b>What are your plans for the future?</b><span>Was sind deine Pläne?</span></li></ul>` },
      { t: "Herkunft und Reise", html: `
        <ul class="wb-liste"><li><b>home country</b><span>Heimatland</span></li><li><b>to be born in</b><span>geboren sein in</span></li><li><b>to move to</b><span>ziehen nach</span></li>
        <li><b>journey</b><span>Reise</span></li><li><b>by plane · by coach · by boat</b><span>mit Flugzeug · Reisebus · Schiff</span></li><li><b>on foot</b><span>zu Fuß</span></li></ul>` },
      { t: "Gründe und Pläne", html: `
        <ul class="wb-liste"><li><b>war</b><span>Krieg</span></li><li><b>poor · safe</b><span>arm · sicher</span></li><li><b>a better life</b><span>ein besseres Leben</span></li>
        <li><b>to find work</b><span>Arbeit finden</span></li><li><b>to learn the language</b><span>die Sprache lernen</span></li><li><b>to be homesick</b><span>Heimweh haben</span></li>
        <li><b>to feel at home</b><span>sich zu Hause fühlen</span></li></ul>` },
      { t: "Nachfragen und reagieren", html: `
        <ul class="wb-liste"><li><b>Really?</b><span>Wirklich?</span></li><li><b>That's interesting.</b><span>Das ist interessant.</span></li><li><b>Tell me more, please.</b><span>Erzähl bitte mehr.</span></li>
        <li><b>What do you mean?</b><span>Was meinst du?</span></li><li><b>Sorry, can you say that again?</b><span>Kannst du das noch einmal sagen?</span></li></ul>
        <p>Alle Wörter trainierst du im <a href="../vokabular/wordbank-interviewing-a-new-arrival.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**by** plane, **by** train, **by** boat – aber **on** foot.",
      "Wie lange schon? → present perfect: I **have been** here **for** two years / **since** 2023.",
      "„Heimweh haben“ heißt **to be homesick**: I **am** homesick. Nicht: ~~I have homesick.~~"
    ],
    basis: [
      { typ: "paare", t: "Was bedeutet das? Verbinde Englisch und Deutsch.",
        paare: [["home country", "Heimatland"], ["journey", "Reise"], ["border", "Grenze"], ["reason", "Grund"], ["relatives", "Verwandte"], ["war", "Krieg"]] },
      { typ: "paare", t: "Welche Antwort passt zu welcher Frage?",
        paare: [["Where are you from?", "I'm from Colombia."], ["How long have you been here?", "For about two years."], ["Why did you come here?", "Because my dad found work here."],
                ["What was the journey like?", "It was long and tiring."], ["What are your plans for the future?", "I want to finish school first."]] },
      { typ: "zuordnen", t: "Worüber spricht die Person? Sortiere.", gruppen: ["Reise", "Grund", "Plan für die Zukunft"],
        karten: [["by coach", 0], ["on foot", 0], ["three days on a boat", 0], ["a better life", 1], ["the war", 1], ["to find work", 1], ["to finish school", 2], ["to get a job", 2], ["to learn the language", 2]] },
      { typ: "luecke", t: "Wähle das passende Wort.", tipp: "by + Fahrzeug · on foot · for + Zeitspanne · since + Zeitpunkt",
        items: ["We travelled {{by|on|with}} plane from Lima to New York.", "They walked the last ten kilometres {{on|by|with}} foot.", "I have lived in this city {{for|since}} three years.",
                "My family has been here {{since|for}} last summer.", "At first I {{was|had}} very homesick.", "Now I really feel {{at|in}} home here."] },
      { typ: "bauen", t: "Baue die Interviewfragen.",
        items: [{ teile: ["How long", "have", "you", "been", "here?"] }, { teile: ["Why", "did", "your family", "leave", "your home country?"] },
                { teile: ["What", "do", "you", "miss", "most?"] }, { teile: ["Do", "you", "feel", "at home", "here?"] }] },
      { typ: "wahl", t: "Wie reagierst du im Interview?", mischen: true,
        items: [
          { f: "Du hast etwas nicht verstanden.", o: ["Sorry, can you say that again?", "Thank you for the interview.", "That's interesting."], a: 0 },
          { f: "Du möchtest mehr darüber hören.", o: ["Tell me more, please.", "I see.", "Really?"], a: 0 },
          { f: "Du weißt nicht, was die Person damit meint.", o: ["What do you mean?", "Where are you from?", "That's interesting."], a: 0 },
          { f: "Das Interview ist zu Ende.", o: ["Thank you for the interview.", "Tell me more, please.", "What do you mean?"], a: 0 }
        ] },
      { typ: "luecke", t: "Schreibe das englische Wort.", tipp: "Die Wörter stehen oben im Merkwissen.",
        items: ["Heimatland: home [[country]]", "Reise: [[journey]]", "sicher: [[safe]]", "Grenze: [[border]]", "Heimweh haben: to be [[homesick]]", "zu Fuß: on [[foot]]"] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Interview: Ergänze die fehlenden Wörter.", tipp: "Lies erst das ganze Gespräch.",
        items: ["A: Where are you [[from]]? – B: I was [[born]] in Ukraine.", "A: How [[long]] have you been here? – B: [[Since]] 2022.",
                "A: Why did you [[come]] here? – B: Because of the [[war]]. Here we are safe.", "A: What are your [[plans]] for the future? – B: I want to [[learn]] the language and get a job."] },
      { typ: "frei", t: "Du interviewst eine neue Mitschülerin. Schreibe zwei eigene Fragen.", tipp: "Zum Beispiel über die Schule, Hobbys oder das Lieblingsessen.",
        items: [
          { f: "Deine erste Frage:", kriterien: ["eine vollständige englische Frage", "passt zu einem Interview mit jemandem, der neu ist"], muster: "^(what|where|why|how|when|who|do|does|did|are|is|have|has|can)\\b.*\\?$", bsp: "What do you like about your new school?" },
          { f: "Deine zweite Frage:", kriterien: ["eine vollständige englische Frage", "passt zu einem Interview mit jemandem, der neu ist"], muster: "^(what|where|why|how|when|who|do|does|did|are|is|have|has|can)\\b.*\\?$", bsp: "Have you already made new friends?" }
        ] }
    ]
  });
  </script>
