  <script>
  E8Seite(1, "g");
  Grammatik.seite({
    nr: 4, modul: "e8-u1-g4", kurz: "G4",
    titel: "Simple present",
    lead: "„My cousin **lives** in Chicago. She **doesn't like** the cold winters.“ – Das simple present brauchst du für alles, was regelmäßig passiert oder einfach so ist.",
    ziele: ["Du denkst bei he, she, it an das -s.", "Du verneinst mit don't und doesn't.", "Du bildest Fragen mit do und does und kennst die Formen von be."],
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Für <b>Gewohnheiten</b>, <b>Regelmäßiges</b> und <b>Tatsachen</b>. Typische Signalwörter:</p>
        <ul class="wb-liste"><li><b>always</b><span>immer</span></li><li><b>usually</b><span>normalerweise</span></li><li><b>often</b><span>oft</span></li>
        <li><b>sometimes</b><span>manchmal</span></li><li><b>never</b><span>nie</span></li><li><b>every day / on Mondays</b><span>jeden Tag / montags</span></li></ul>` },
      { t: "Aussagen: he, she, it – das s muss mit", html: `
        <table><tr><th>I, you, we, they</th><th>he, she, it</th></tr>
        <tr><td>play</td><td>play<b>s</b></td></tr><tr><td>watch, go</td><td>watch<b>es</b>, go<b>es</b></td></tr>
        <tr><td>try</td><td>tr<b>ies</b></td></tr><tr><td>have</td><td><b>has</b></td></tr></table>
        <p>Häufigkeitswörter stehen <b>vor dem Verb</b>: <i>We <b>often</b> play cards.</i></p>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>don't / doesn't + Grundform:</b> I <b>don't like</b> fish. He <b>doesn't like</b> fish.</div>
        <div class="bsp"><b>Do / Does + Person + Grundform:</b> <b>Do</b> you <b>live</b> here? <b>Does</b> she <b>play</b> tennis?</div>
        <div class="bsp"><b>Mit Fragewort:</b> Where <b>do</b> they <b>work</b>? What time <b>does</b> the shop <b>open</b>?</div>
        <p>Kurzantworten: Yes, I <b>do</b>. / No, she <b>doesn't</b>.</p>` },
      { t: "be: am, is, are", html: `
        <table><tr><th>Aussage</th><th>Verneinung</th><th>Frage</th></tr>
        <tr><td>I <b>am</b> ready.</td><td>I<b>'m not</b> ready.</td><td><b>Am</b> I late?</td></tr>
        <tr><td>She <b>is</b> at home.</td><td>She <b>isn't</b> at home.</td><td><b>Is</b> she at home?</td></tr>
        <tr><td>They <b>are</b> friends.</td><td>They <b>aren't</b> friends.</td><td><b>Are</b> they friends?</td></tr></table>
        <p>Bei be brauchst du <b>kein do/does</b>.</p>` }
    ],
    fallen: [
      "Nach **does** und **doesn't** steht die Grundform ohne -s: She doesn't **like** it. Nicht: ~~She doesn't likes it.~~",
      "Häufigkeitswörter stehen vor dem Vollverb, aber **nach** be: He **often plays** football. He **is often** late.",
      "Fragen mit be bildest du ohne do: **Are** you hungry? Nicht: ~~Do you be hungry?~~"
    ],
    basis: [
      { typ: "luecke", t: "Setze das Verb in der richtigen Form ein.", tipp: "he, she, it → -s. Nach -ch und -o: -es. Aus -y wird -ies.",
        items: ["My dad [[works]] in a hospital. (work)", "We usually [[have]] lunch at one o'clock. (have)", "Lisa [[watches]] a series every evening. (watch)",
                "The train [[goes]] to Chicago. (go)", "My brother never [[tidies]] his room. (tidy)", "Our neighbours [[have]] two cats. (have)", "Emma [[has]] a new bike. (have)"] },
      { typ: "zuordnen", t: "don't oder doesn't? Ordne die Personen zu.", tipp: "he, she, it und alles, was man dadurch ersetzen kann → doesn't",
        gruppen: ["… don't like it.", "… doesn't like it."],
        karten: [["I", 0], ["you", 0], ["we", 0], ["they", 0], ["my friends", 0], ["he", 1], ["she", 1], ["it", 1], ["my sister", 1], ["our teacher", 1]] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "don't / doesn't + Grundform. Bei be: 'm not, isn't, aren't.",
        items: [
          { s: "I like tomatoes.", l: ["I don't like tomatoes.", "I do not like tomatoes."] },
          { s: "My uncle lives in Canada.", l: ["My uncle doesn't live in Canada.", "My uncle does not live in Canada."] },
          { s: "The shops are open.", l: ["The shops aren't open.", "The shops are not open."] }
        ] },
      { typ: "bauen", t: "Wo steht das Häufigkeitswort? Baue die Sätze.", tipp: "vor dem Vollverb – aber nach am, is, are",
        items: [{ teile: ["We", "often", "go", "to the park", "after school."] }, { teile: ["My sister", "never", "eats", "meat."] },
                { teile: ["He", "is", "always", "late", "on Mondays."] }, { teile: ["I", "usually", "do", "my homework", "in the evening."] }] },
      { typ: "luecke", t: "Do oder Does? Am, Is oder Are?", tipp: "Mit Vollverb: Do/Does. Mit be: Am/Is/Are.",
        items: ["{{Does|Do}} your friend speak Spanish?", "{{Do|Does}} you walk to school?", "{{Is|Does}} your mum a teacher?",
                "{{Are|Do}} your grandparents from Bavaria?", "Where {{do|does}} your cousins live?", "What time {{does|do}} the lesson start?"] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "(Fragewort) + do/does + Person + Grundform",
        items: [{ teile: ["Do", "you", "like", "your new school?"] }, { teile: ["Does", "your brother", "play", "an instrument?"] },
                { teile: ["Where", "do", "your grandparents", "live?"] }, { teile: ["How much", "does", "the ticket", "cost?"] }] },
      { typ: "wahl", t: "Wähle die passende Kurzantwort.", mischen: true,
        items: [
          { s: "Do you like pizza?", o: ["Yes, I do.", "Yes, I like.", "Yes, I am."], a: 0 },
          { s: "Does your sister play football?", o: ["No, she doesn't.", "No, she don't.", "No, she isn't."], a: 0 },
          { s: "Are your friends in your class?", o: ["Yes, they are.", "Yes, they do.", "Yes, they is."], a: 0 }
        ] }
    ],
    plus: [
      { typ: "luecke", t: "Ein ganz normaler Tag: Setze die Verben ein.", tipp: "Achte auf he/she/it und auf die Verneinung.",
        items: ["My friend Noah [[gets]] up at six every day. (get)", "He [[doesn't have|does not have]] breakfast at home – he [[eats]] at school. (not have / eat)",
                "After school he and his sister [[walk]] the dog. (walk)", "They [[don't watch|do not watch]] TV in the evening. They usually [[read]]. (not watch / read)"] },
      { typ: "frei", t: "Und du? Schreibe einen Satz darüber, was du samstags normalerweise machst.", tipp: "Zum Beispiel mit: On Saturdays I usually …",
        items: [{ f: "Was machst du samstags normalerweise?", kriterien: ["ein vollständiger englischer Satz", "das Verb steht im simple present", "ein Häufigkeitswort wie usually, often, always oder sometimes"],
                  muster: "\\b(usually|often|always|sometimes|never|every)\\b", bsp: "On Saturdays I usually play football with my team." }] }
    ]
  });
  </script>
