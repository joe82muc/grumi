<!doctype html>
<html lang="de">
<head>

  <title>G2 · Simple past | Englisch 8R</title>
  <meta name="description" content="Englisch 8R, Unit 1 (Wiederholung): das simple past mit regelmäßigen und unregelmäßigen Verben, Verneinung mit didn't, Fragen mit did sowie was und were.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../../css/grammatik.css">
  <link rel="stylesheet" href="../../../../css/englisch-baukasten.css">
  <script src="../../../../js/kurs-sperre.js" data-liste="../../themen.js"></script>
</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E8Seite(1, "g");
  Grammatik.seite({
    nr: 2, modul: "e8-u1-g2", kurz: "G2",
    titel: "Simple past",
    lead: "„Yesterday we **visited** the harbour and **took** a lot of photos.“ – Mit dem simple past erzählst du, was vorbei ist. Hier frischst du es auf.",
    ziele: ["Du bildest das simple past mit -ed und kennst wichtige unregelmäßige Formen.", "Du verneinst mit didn't und der Grundform.", "Du stellst Fragen mit did – und mit was oder were."],
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Etwas ist <b>vorbei</b> und abgeschlossen. Oft steht dabei, <b>wann</b> es war:</p>
        <ul class="wb-liste"><li><b>yesterday</b><span>gestern</span></li><li><b>last week / last year</b><span>letzte Woche / letztes Jahr</span></li>
        <li><b>two days ago</b><span>vor zwei Tagen</span></li><li><b>in 2020</b><span>im Jahr 2020</span></li></ul>` },
      { t: "Die Formen", html: `
        <p>Regelmäßig: Grundform + <b>-ed</b> – <i>play → played, like → liked, stop → sto<b>pp</b>ed, try → tr<b>ied</b></i></p>
        <table><tr><th>Grundform</th><th>simple past</th><th>Grundform</th><th>simple past</th></tr>
        <tr><td>go</td><td><b>went</b></td><td>come</td><td><b>came</b></td></tr>
        <tr><td>have</td><td><b>had</b></td><td>get</td><td><b>got</b></td></tr>
        <tr><td>see</td><td><b>saw</b></td><td>buy</td><td><b>bought</b></td></tr>
        <tr><td>take</td><td><b>took</b></td><td>make</td><td><b>made</b></td></tr>
        <tr><td>eat</td><td><b>ate</b></td><td>write</td><td><b>wrote</b></td></tr></table>
        <p>Die Form ist für alle Personen gleich: <i>I went, she went, they went.</i></p>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>didn't + Grundform:</b> We <b>didn't go</b> to the beach.</div>
        <div class="bsp"><b>Did + Person + Grundform:</b> <b>Did</b> you <b>see</b> the film? – Yes, I <b>did</b>. / No, I <b>didn't</b>.</div>
        <div class="bsp"><b>Mit Fragewort:</b> Where <b>did</b> she <b>go</b>? What <b>did</b> they <b>eat</b>?</div>` },
      { t: "be: was und were", html: `
        <table><tr><th>Person</th><th>Aussage</th><th>Verneinung</th></tr>
        <tr><td>I, he, she, it</td><td><b>was</b></td><td><b>wasn't</b></td></tr>
        <tr><td>you, we, they</td><td><b>were</b></td><td><b>weren't</b></td></tr></table>
        <p>Fragen ohne did: <b>Were</b> you at home? <b>Was</b> the test difficult?</p>` }
    ],
    fallen: [
      "Nach **did** und **didn't** steht immer die Grundform: She didn't **go**. Nicht: ~~She didn't went.~~",
      "Bei **was/were** brauchst du kein did: **Were** you tired? Nicht: ~~Did you be tired?~~",
      "Im Deutschen sagt man oft „Ich habe … gemacht“. Mit yesterday, last week oder ago steht im Englischen trotzdem das simple past: I **did** it yesterday."
    ],
    basis: [
      { typ: "zuordnen", t: "Regelmäßig oder unregelmäßig? Ordne die Vergangenheitsformen zu.", tipp: "Regelmäßige Formen enden auf -ed.",
        gruppen: ["regelmäßig (-ed)", "unregelmäßig"],
        karten: [["walked", 0], ["visited", 0], ["stayed", 0], ["wanted", 0], ["opened", 0], ["went", 1], ["saw", 1], ["took", 1], ["bought", 1], ["made", 1]] },
      { typ: "paare", t: "Welche Formen gehören zusammen? Verbinde Grundform und simple past.",
        paare: [["take", "took"], ["come", "came"], ["get", "got"], ["make", "made"], ["eat", "ate"], ["write", "wrote"]] },
      { typ: "luecke", t: "Setze das Verb im simple past ein.", tipp: "stop → stopped, try → tried. Unregelmäßige Formen stehen oben.",
        items: ["Last Saturday we [[went]] to the lake. (go)", "My sister [[bought]] a new phone. (buy)", "It [[rained]] all day yesterday. (rain)",
                "I [[saw]] a great film last night. (see)", "They [[stopped]] at a small café. (stop)", "Ben [[tried]] sushi for the first time. (try)"] },
      { typ: "luecke", t: "was, were, wasn't oder weren't?", tipp: "I, he, she, it → was · you, we, they → were",
        items: ["The weather {{was|were}} great last weekend.", "My friends {{were|was}} at the concert, but I {{wasn't|weren't}} there.",
                "{{Were|Was}} you at school yesterday?", "The shops {{weren't|wasn't}} open on Sunday."] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "didn't + Grundform. Bei was/were: wasn't oder weren't.",
        items: [
          { s: "We visited the zoo.", l: ["We didn't visit the zoo.", "We did not visit the zoo."] },
          { s: "Emma took the bus.", l: ["Emma didn't take the bus.", "Emma did not take the bus."] },
          { s: "The film was boring.", l: ["The film wasn't boring.", "The film was not boring."] }
        ] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "(Fragewort) + did + Person + Grundform",
        items: [{ teile: ["Did", "you", "watch", "the match", "yesterday?"] }, { teile: ["Where", "did", "she", "go", "last summer?"] },
                { teile: ["Were", "your friends", "at the party?"] }, { teile: ["What", "did", "they", "eat", "for lunch?"] }] },
      { typ: "wahl", t: "Wähle die passende Kurzantwort.",
        items: [
          { s: "Did Tom call you?", o: ["Yes, he did.", "Yes, he called.", "Yes, he was."], a: 0 },
          { s: "Were you tired after the trip?", o: ["No, I wasn't.", "No, I didn't.", "No, I weren't."], a: 0 },
          { s: "Did your parents like the hotel?", o: ["No, they didn't.", "No, they weren't.", "No, they don't."], a: 0 },
          { s: "Was the museum open?", o: ["Yes, it was.", "Yes, it did.", "Yes, it were."], a: 0 }
        ], mischen: true }
    ],
    plus: [
      { typ: "luecke", t: "Ein Wochenende in Hamburg: Setze die Verben im simple past ein.", tipp: "Achte auf Verneinungen: didn't + Grundform.",
        items: ["Last weekend my family and I [[visited]] my aunt in Hamburg. (visit)", "We [[took]] the train because we [[didn't want|did not want]] to drive. (take / not want)",
                "On Saturday we [[saw]] the big ships in the harbour and [[ate]] fish rolls. (see / eat)", "It [[was]] cold, but we [[had]] a great time. (be / have)"] },
      { typ: "frei", t: "Und du? Schreibe einen Satz darüber, was du gestern gemacht hast.", tipp: "Zum Beispiel mit: Yesterday I …",
        items: [{ f: "Was hast du gestern gemacht?", kriterien: ["ein vollständiger englischer Satz", "das Verb steht im simple past"],
                  muster: "\\b(went|was|were|had|did|saw|took|ate|made|got|came|met|bought|wrote|[a-z]{2,}ed)\\b", bsp: "Yesterday I played basketball with my friends." }] }
    ]
  });
  </script>

</html>
