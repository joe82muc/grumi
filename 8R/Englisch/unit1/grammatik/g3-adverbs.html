  <script>
  E8Seite(1, "g");
  Grammatik.seite({
    nr: 3, modul: "e8-u1-g3", kurz: "G3",
    titel: "Adverbien",
    lead: "„She is a **careful** driver. She drives **carefully**.“ – Adjektive beschreiben Dinge und Personen. Adverbien sagen, **wie** jemand etwas tut.",
    ziele: ["Du unterscheidest Adjektiv und Adverb.", "Du bildest Adverbien mit -ly und kennst die Ausnahmen.", "Du stellst das Adverb an die richtige Stelle im Satz."],
    merk: [
      { t: "Adjektiv oder Adverb?", html: `
        <div class="bsp"><b>Adjektiv</b> – wie ist jemand oder etwas? Es gehört zu einem Nomen:<br><i>a <b>quiet</b> street · The music is <b>loud</b>.</i></div>
        <div class="bsp"><b>Adverb</b> – wie tut jemand etwas? Es gehört zu einem Verb:<br><i>They talked <b>quietly</b>. · He sings <b>loudly</b>.</i></div>` },
      { t: "So bildest du Adverbien", html: `
        <table><tr><th>Regel</th><th>Beispiel</th></tr>
        <tr><td>Adjektiv + <b>-ly</b></td><td>slow → slow<b>ly</b>, careful → careful<b>ly</b></td></tr>
        <tr><td>-y wird zu <b>-ily</b></td><td>happy → happ<b>ily</b>, easy → eas<b>ily</b></td></tr>
        <tr><td>-le wird zu <b>-ly</b></td><td>terrible → terrib<b>ly</b>, simple → simp<b>ly</b></td></tr>
        <tr><td>-ic wird zu <b>-ically</b></td><td>fantastic → fantastic<b>ally</b></td></tr></table>` },
      { t: "Diese sind anders", html: `
        <ul class="wb-liste"><li><b>good → well</b><span>gut</span></li><li><b>fast → fast</b><span>schnell</span></li>
        <li><b>hard → hard</b><span>hart, fleißig</span></li><li><b>late → late</b><span>spät</span></li><li><b>early → early</b><span>früh</span></li></ul>
        <p><i>She is a <b>good</b> player. She plays <b>well</b>.</i></p>` },
      { t: "Wo steht das Adverb?", html: `
        <p>Meist <b>nach dem Verb</b> – oder nach dem Objekt, wenn es eines gibt:</p>
        <div class="bsp">He <u>walked</u> <b>slowly</b>.</div>
        <div class="bsp">She <u>speaks English</u> <b>well</b>. <i>(nicht: She speaks well English.)</i></div>` }
    ],
    fallen: [
      "**good** ist das Adjektiv, **well** das Adverb: He cooks **well**. Nicht: ~~He cooks good.~~",
      "Nach **be, look, feel, smell, taste, sound** steht ein Adjektiv: The soup tastes **good**. You look **happy**.",
      "**hardly** heißt „kaum“. „Hart arbeiten“ ist **work hard**."
    ],
    basis: [
      { typ: "zuordnen", t: "Adjektiv oder Adverb? Sortiere die Wörter.", tipp: "Die meisten Adverbien enden auf -ly.",
        gruppen: ["Adjektiv", "Adverb"],
        karten: [["quiet", 0], ["happy", 0], ["careful", 0], ["slow", 0], ["good", 0], ["quietly", 1], ["happily", 1], ["carefully", 1], ["slowly", 1], ["well", 1]] },
      { typ: "luecke", t: "Bilde das Adverb.", tipp: "-y → -ily · -le → -ly · good → well · fast bleibt fast",
        items: ["quick → [[quickly]]", "easy → [[easily]]", "angry → [[angrily]]", "careful → [[carefully]]", "good → [[well]]", "terrible → [[terribly]]", "fast → [[fast]]"] },
      { typ: "luecke", t: "Adjektiv oder Adverb? Wähle das passende Wort.", tipp: "Frage: Wie IST etwas? → Adjektiv. Wie TUT jemand etwas? → Adverb.",
        items: ["Please speak {{slowly|slow}}. I'm still learning English.", "This is an {{easy|easily}} exercise.", "Our team played really {{well|good}} yesterday.",
                "The children were very {{quiet|quietly}} in the library.", "He opened the door {{carefully|careful}}.", "My aunt is a {{careful|carefully}} driver."] },
      { typ: "markieren", t: "Markiere in jedem Satz das Adverb.", stiftName: "Adverb", tipp: "Welches Wort sagt, wie etwas getan wird?",
        items: ["The old man walked [slowly] across the street.", "Lena answered the question [correctly].", "The dog barked [loudly] at night.",
                "We arrived [late] because of the snow.", "My little brother can swim [well]."] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Erst Verb und Objekt, dann das Adverb.",
        items: [{ teile: ["She", "speaks", "English", "very well."] }, { teile: ["He", "closed", "the window", "quietly."] },
                { teile: ["They", "did", "their homework", "carefully."] }, { teile: ["My brother", "runs", "really fast."] }] },
      { typ: "wahl", t: "Welches Wort passt? Achte auf das Verb.", tipp: "Nach look, smell, taste, feel (= aussehen, riechen, schmecken, sich fühlen) steht ein Adjektiv.",
        items: [
          { s: "The pizza smells ___.", o: ["delicious", "deliciously"], a: 0, e: "smell beschreibt hier, wie die Pizza IST → Adjektiv." },
          { s: "You look ___ today. Is everything okay?", o: ["tired", "tiredly"], a: 0, e: "look = aussehen → Adjektiv." },
          { s: "She looked ___ at the map.", o: ["carefully", "careful"], a: 0, e: "look at = etwas ansehen, eine Handlung → Adverb." },
          { s: "The music sounds ___.", o: ["great", "greatly"], a: 0, e: "sound = klingen → Adjektiv." }
        ] }
    ],
    plus: [
      { typ: "umformen", t: "Sag dasselbe mit Verb und Adverb.", tipp: "a good singer → sing well",
        items: [
          { s: "Mia is a quick learner.", l: ["Mia learns quickly.", "Mia learns fast."] },
          { s: "Tom is a good singer.", l: ["Tom sings well."] },
          { s: "They are hard workers.", l: ["They work hard."] },
          { s: "My grandpa is a slow walker.", l: ["My grandpa walks slowly."] }
        ] },
      { typ: "wahl", t: "hard oder hardly? late oder lately?", tipp: "hardly = kaum · lately = in letzter Zeit",
        items: [
          { s: "We trained ___ for the match.", o: ["hard", "hardly"], a: 0, e: "work/train hard = hart, fleißig." },
          { s: "It was so loud that I could ___ hear you.", o: ["hardly", "hard"], a: 0, e: "hardly = kaum." },
          { s: "The bus came ten minutes ___.", o: ["late", "lately"], a: 0, e: "late = zu spät." }
        ] }
    ]
  });
  </script>
