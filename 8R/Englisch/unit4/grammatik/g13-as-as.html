<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>

  <script src="../../seiten.js"></script>
  <script>
  E8Seite(4, "g");
  Grammatik.seite({
    nr: 3, modul: "e8-u4-g13", kurz: "G13",
    titel: "Vergleiche mit (not) as … as",
    lead: "„My job is **as interesting as** yours.“ – „But it is **not as well paid as** yours.“ So sagst du, dass etwas gleich ist – oder eben nicht.",
    ziele: ["Du vergleichst Gleiches mit as … as.", "Du vergleichst Ungleiches mit not as … as.", "Du wechselst sicher zwischen not as … as und der Steigerung mit than."],
    merk: [
      { t: "Gleich: as … as", html: `
        <p><b>as + Adjektiv (Grundform) + as</b> = genauso … wie</p>
        <div class="bsp">Mia is <b>as tall as</b> her brother. <i>– genauso groß wie</i></div>
        <div class="bsp">The second test was <b>as easy as</b> the first one.</div>` },
      { t: "Ungleich: not as … as", html: `
        <p><b>not as + Adjektiv (Grundform) + as</b> = nicht so … wie</p>
        <div class="bsp">A bike is <b>not as fast as</b> a car.</div>
        <div class="bsp">Winters here are<b>n't as cold as</b> in Canada.</div>` },
      { t: "Zwei Wege, dasselbe zu sagen", html: `
        <table><tr><th>mit not as … as</th><th>mit Steigerung + than</th></tr>
        <tr><td>The bus is <b>not as fast as</b> the train.</td><td>The train is <b>faster than</b> the bus.</td></tr>
        <tr><td>Maths is <b>not as difficult as</b> Physics.</td><td>Physics is <b>more difficult than</b> Maths.</td></tr></table>
        <p>Auch möglich: Maths is <b>less difficult than</b> Physics.</p>` },
      { t: "as oder than?", html: `
        <ul class="wb-liste"><li><b>as … as</b><span>mit der Grundform: as old as</span></li><li><b>than</b><span>nur nach einer Steigerungsform: older than</span></li></ul>` }
    ],
    fallen: [
      "Zwischen as und as steht die **Grundform**: as **big** as. Nicht: ~~as bigger as~~.",
      "Nach einer Steigerungsform steht **than**, nicht as: taller **than**. Nicht: ~~taller as~~.",
      "Deutsch „so … wie“ = **as … as**. Nicht: ~~so tall like~~."
    ],
    basis: [
      { typ: "luecke", t: "as oder than?", tipp: "Grundform → as … as · Steigerungsform → than",
        items: ["My brother is as old {{as|than}} your sister.", "Toronto is bigger {{than|as}} Vancouver.", "This job is not as hard {{as|than}} it looks.",
                "The new office is more modern {{than|as}} the old one.", "Is your salary as high {{as|than}} mine?"] },
      { typ: "luecke", t: "Gleich! Setze as + Adjektiv + as ein.", tipp: "Das Adjektiv bleibt in der Grundform.",
        items: ["Our team is [[as good as]] yours. (good)", "The film was [[as boring as]] the book. (boring)", "I'm [[as tall as]] my dad now. (tall)",
                "This phone is [[as expensive as]] a laptop. (expensive)"] },
      { typ: "wahl", t: "Was bedeutet der Satz?", tipp: "not as … as = weniger",
        items: [
          { s: "Ben is not as tall as Leo.", o: ["Leo is taller.", "Ben is taller.", "They are the same height."], a: 0 },
          { s: "The red car is as fast as the blue car.", o: ["They are equally fast.", "The red car is faster.", "The blue car is faster."], a: 0 },
          { s: "My room isn't as big as my sister's room.", o: ["My sister's room is bigger.", "My room is bigger.", "Both rooms are the same size."], a: 0 },
          { s: "Working in the shop is less tiring than working on the farm.", o: ["The farm work is more tiring.", "The shop work is more tiring.", "Both jobs are equally tiring."], a: 0 }
        ] },
      { typ: "umformen", t: "Sag dasselbe mit not as … as.", tipp: "Die beiden Dinge tauschen die Plätze, das Adjektiv geht zurück in die Grundform.",
        items: [
          { s: "The train is faster than the bus.", l: ["The bus is not as fast as the train.", "The bus isn't as fast as the train."] },
          { s: "My sister is older than me.", l: ["I am not as old as my sister.", "I'm not as old as my sister."] },
          { s: "Gold is more expensive than silver.", l: ["Silver is not as expensive as gold.", "Silver isn't as expensive as gold."] }
        ] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.",
        items: [{ teile: ["My bag", "is", "as heavy as", "yours."] }, { teile: ["The café", "is", "not", "as busy as", "the restaurant."] },
                { teile: ["Is", "your new job", "as interesting as", "your old one?"] }] },
      { typ: "zuordnen", t: "Gleich oder ungleich? Sortiere die Ausdrücke.", gruppen: ["gleich", "ungleich"],
        karten: [["as old as", 0], ["as friendly as", 0], ["as good as", 0], ["not as fast as", 1], ["bigger than", 1], ["less expensive than", 1], ["more reliable than", 1]] },
      { typ: "luecke", t: "Jetzt gemischt: Setze das Adjektiv in der passenden Form ein.", tipp: "as … as → Grundform · than → Steigerungsform",
        items: ["A plane is [[faster]] than a ship. (fast)", "Is ice hockey as [[popular]] as football in Canada? (popular)", "My marks are [[better]] than last year. (good)",
                "This chair isn't as [[comfortable]] as the sofa. (comfortable)", "Friday was [[busier]] than Thursday. (busy)"] }
    ],
    plus: [
      { typ: "umformen", t: "Vergleiche mit as … as oder not as … as. Benutze das Adjektiv in Klammern.", info: "Zugspitze: 2 962 m · Watzmann: 2 713 m · Lukas: 1,72 m · Emil: 1,72 m",
        items: [
          { s: "Watzmann – Zugspitze (high)", l: ["The Watzmann is not as high as the Zugspitze.", "The Watzmann isn't as high as the Zugspitze.", "Watzmann is not as high as Zugspitze.", "Watzmann isn't as high as Zugspitze."] },
          { s: "Lukas – Emil (tall)", l: ["Lukas is as tall as Emil.", "Emil is as tall as Lukas."] }
        ] },
      { typ: "frei", t: "Vergleiche zwei Berufe mit as … as oder not as … as.", tipp: "Adjektive: interesting, dangerous, hard, well paid, stressful, boring",
        items: [{ f: "Dein Vergleich:", kriterien: ["ein vollständiger englischer Satz", "(not) as + Adjektiv in der Grundform + as", "zwei Berufe oder Tätigkeiten werden verglichen"],
                  muster: "\\bas\\s+[a-z]+(\\s+[a-z]+)?\\s+as\\b", bsp: "Working as a waiter is not as dangerous as working as a police officer." }] }
    ]
  });
  </script>
