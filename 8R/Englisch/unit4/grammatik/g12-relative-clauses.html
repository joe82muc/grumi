  <title>G12 · Relativsätze mit who, which, that | Englisch 8R</title>
  <meta name="description" content="Englisch 8R, Unit 4: Personen und Dinge mit Relativsätzen genauer beschreiben – who für Personen, which für Sachen, that für beides. Mit abwechslungsreichen Übungen.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E8Seite(4, "g");
  Grammatik.seite({
    nr: 2, modul: "e8-u4-g12", kurz: "G12",
    titel: "Relativsätze mit who, which, that",
    lead: "„A vet is someone **who** helps sick animals.“ – „A tablet is a computer **which** has no keyboard.“ Mit Relativsätzen erklärst du genauer, wen oder was du meinst.",
    ziele: ["Du benutzt who für Personen und which für Sachen.", "Du weißt, dass that für beides geht.", "Du verbindest zwei Sätze zu einem."],
    merk: [
      { t: "who, which, that", html: `
        <table><tr><th>Relativpronomen</th><th>für</th><th>Beispiel</th></tr>
        <tr><td><b>who</b></td><td>Personen</td><td>the girl <b>who</b> lives next door</td></tr>
        <tr><td><b>which</b></td><td>Sachen und Tiere</td><td>the bus <b>which</b> goes to the airport</td></tr>
        <tr><td><b>that</b></td><td>beides</td><td>the girl <b>that</b> … · the bus <b>that</b> …</td></tr></table>` },
      { t: "Wozu?", html: `
        <p>Der Relativsatz sagt, <b>welche</b> Person oder Sache gemeint ist. Er steht <b>direkt hinter</b> dem Wort, das er beschreibt:</p>
        <div class="bsp"><u>The man</u> <b>who repaired our car</b> is from Montreal.</div>
        <div class="bsp">I need <u>a phone</u> <b>which takes good photos</b>.</div>` },
      { t: "Zwei Sätze verbinden", html: `
        <div class="bsp">I have a cousin. <u>She</u> works in a hotel.<br>→ I have a cousin <b>who</b> works in a hotel.</div>
        <div class="bsp">This is the app. <u>It</u> helps me with vocabulary.<br>→ This is the app <b>which</b> helps me with vocabulary.</div>
        <p>Das Pronomen (she, it, they …) fällt weg – an seine Stelle tritt who oder which.</p>` },
      { t: "Kein Komma!", html: `
        <p>Im Deutschen steht vor dem Relativsatz ein Komma, im Englischen hier <b>nicht</b>:</p>
        <div class="bsp">Das ist der Lehrer<b>,</b> der Sport unterrichtet.<br>That's the teacher who teaches PE.</div>` }
    ],
    fallen: [
      "**who** nur für Personen. Für Sachen: **which** oder **that**. Nicht: ~~the book who …~~",
      "Das Pronomen nicht doppelt: the girl who lives here. Nicht: ~~the girl who she lives here~~.",
      "Kein Komma vor who, which, that in diesen Sätzen."
    ],
    basis: [
      { typ: "zuordnen", t: "who oder which? Ordne die Nomen zu.", tipp: "Personen → who · Sachen und Tiere → which",
        gruppen: ["… who …", "… which …"],
        karten: [["a teacher", 0], ["my uncle", 0], ["the pilot", 0], ["children", 0], ["a friend", 0], ["a laptop", 1], ["the bus", 1], ["this song", 1], ["an app", 1], ["a dog", 1]] },
      { typ: "luecke", t: "who oder which? Wähle aus.",
        items: ["A baker is a person {{who|which}} makes bread.", "This is the video {{which|who}} got a million views.", "Do you know the boy {{who|which}} won the race?",
                "I'm looking for a job {{which|who}} is not boring.", "The woman {{who|which}} interviewed me was very friendly.", "We stayed at a hotel {{which|who}} had a pool."] },
      { typ: "paare", t: "Was gehört zusammen? Baue die Erklärungen.",
        paare: [["A nurse is someone", "who looks after sick people."], ["A search engine is a website", "which helps you find information."], ["A chef is a person", "who cooks in a restaurant."],
                ["A password is a word", "which keeps your account safe."], ["A babysitter is someone", "who looks after children."], ["A charger is a thing", "which gives your phone power."]] },
      { typ: "markieren", t: "Markiere den ganzen Relativsatz.", stiftName: "Relativsatz", tipp: "Er beginnt mit who, which oder that und beschreibt das Wort davor.",
        items: ["The girl [who sits next to me] comes from Ottawa.", "I like films [which make me laugh].", "The man [that lives upstairs] plays the drums.",
                "This is the shop [which sells cheap games]."] },
      { typ: "umformen", t: "Verbinde die beiden Sätze mit who oder which.", tipp: "she, he, it, they fällt weg.",
        items: [
          { s: "I have a friend. She lives in Toronto.", l: ["I have a friend who lives in Toronto.", "I have a friend that lives in Toronto."] },
          { s: "We watched a film. It was very exciting.", l: ["We watched a film which was very exciting.", "We watched a film that was very exciting."] },
          { s: "That's the teacher. He helps us with the applications.", l: ["That's the teacher who helps us with the applications.", "That's the teacher that helps us with the applications.", "That is the teacher who helps us with the applications."] }
        ] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.", tipp: "Der Relativsatz steht direkt hinter dem Nomen.",
        items: [{ teile: ["The boy", "who", "found", "my phone", "is in my class."] }, { teile: ["I need", "a bag", "which", "is big enough", "for my laptop."] },
                { teile: ["She", "is", "the singer", "who", "wrote this song."] }] },
      { typ: "wahl", t: "Wo passt auch that? Und wo steckt ein Fehler?", mischen: true,
        items: [
          { f: "Welcher Satz ist richtig?", o: ["The dog that barks all night belongs to our neighbour.", "The dog who barks all night belongs to our neighbour, which.", "The dog, that barks all night belongs to our neighbour."], a: 0, e: "that geht für Tiere und Sachen; kein Komma." },
          { f: "Welcher Satz ist richtig?", o: ["She's the girl who helped me.", "She's the girl which helped me.", "She's the girl who she helped me."], a: 0, e: "Personen → who; das Pronomen she fällt weg." }
        ] }
    ],
    plus: [
      { typ: "frei", t: "Erkläre das Wort mit einem Relativsatz.", tipp: "A … is someone who … / A … is something which …",
        items: [
          { f: "What is a mechanic?", kriterien: ["ein vollständiger englischer Satz", "Relativsatz mit who oder that", "die Erklärung passt zum Beruf"], muster: "\\bmechanic\\b.*\\b(who|that)\\b.*\\b(repair|fix|car|bike|machine|engine)", bsp: "A mechanic is someone who repairs cars." },
          { f: "What is a suitcase?", kriterien: ["ein vollständiger englischer Satz", "Relativsatz mit which oder that", "die Erklärung passt zum Gegenstand"], muster: "\\bsuitcase\\b.*\\b(which|that)\\b.*\\b(travel|clothes|carry|pack|trip|holiday|things)", bsp: "A suitcase is a bag which you use for travelling." }
        ] },
      { typ: "umformen", t: "Verbinde die Sätze. Der Relativsatz kommt in die Mitte.", tipp: "Der Relativsatz steht direkt hinter „The …“.",
        items: [
          { s: "The woman is my aunt. She is wearing a red jacket.", l: ["The woman who is wearing a red jacket is my aunt.", "The woman that is wearing a red jacket is my aunt."] },
          { s: "The bus was late. It goes to the stadium.", l: ["The bus which goes to the stadium was late.", "The bus that goes to the stadium was late."] }
        ] }
    ]
  });
  </script>
