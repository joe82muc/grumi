  <title>G11 · Das Passiv | Englisch 8R</title>
  <meta name="description" content="Englisch 8R, Unit 4: das Passiv im simple present und simple past bilden – am/is/are oder was/were und die 3. Form des Verbs, dazu by. Mit abwechslungsreichen Übungen.">
  <link rel="stylesheet" href="../../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../../css/grammatik.css">

</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E8Seite(4, "g");
  Grammatik.seite({
    nr: 1, modul: "e8-u4-g11", kurz: "G11",
    titel: "Das Passiv",
    lead: "„Maple syrup **is made** in Canada.“ – Wer ihn macht, ist nicht wichtig. Im Passiv steht im Mittelpunkt, **was getan wird**.",
    ziele: ["Du unterscheidest Aktiv und Passiv.", "Du bildest das Passiv im simple present und im simple past.", "Du nennst mit by, wer etwas getan hat."],
    merk: [
      { t: "Aktiv oder Passiv?", html: `
        <div class="bsp"><b>Aktiv:</b> Wer tut etwas? – <i>Many people <b>speak</b> French in Quebec.</i></div>
        <div class="bsp"><b>Passiv:</b> Was wird getan? – <i>French <b>is spoken</b> in Quebec.</i></div>
        <p>Im Passiv ist unwichtig oder unbekannt, wer es tut.</p>` },
      { t: "Simple present: am / is / are + 3. Form", html: `
        <div class="bsp">This app <b>is used</b> every day. <i>– … wird benutzt.</i></div>
        <div class="bsp">The parcels <b>are sent</b> by plane. <i>– … werden verschickt.</i></div>` },
      { t: "Simple past: was / were + 3. Form", html: `
        <div class="bsp">The bridge <b>was built</b> in 1930. <i>– … wurde gebaut.</i></div>
        <div class="bsp">The photos <b>were taken</b> last winter. <i>– … wurden gemacht.</i></div>
        <table><tr><th>Grundform</th><th>3. Form</th><th>Grundform</th><th>3. Form</th></tr>
        <tr><td>make</td><td><b>made</b></td><td>build</td><td><b>built</b></td></tr>
        <tr><td>write</td><td><b>written</b></td><td>speak</td><td><b>spoken</b></td></tr>
        <tr><td>sell</td><td><b>sold</b></td><td>take</td><td><b>taken</b></td></tr>
        <tr><td>send</td><td><b>sent</b></td><td>find</td><td><b>found</b></td></tr></table>` },
      { t: "Wer war es? by", html: `
        <p>Willst du doch sagen, wer es getan hat, hängst du es mit <b>by</b> an:</p>
        <div class="bsp">The website was designed <b>by</b> two students.</div>
        <p>Vom Aktiv zum Passiv: Das Objekt rückt nach vorn – <i>A student took <u>this photo</u>. → <u>This photo</u> was taken by a student.</i></p>` }
    ],
    fallen: [
      "Deutsch: „wird gemacht“ – Englisch: **is made**. Nicht mit will: ~~will made~~.",
      "Du brauchst immer die **3. Form**: was **written**. Nicht: ~~was wrote~~.",
      "Einzahl oder Mehrzahl? The letter **is / was** sent. The letters **are / were** sent."
    ],
    basis: [
      { typ: "wahl", t: "Aktiv oder Passiv?", tipp: "Passiv: eine Form von be + 3. Form",
        items: [
          { s: "Ice hockey is played all over Canada.", o: ["Passiv", "Aktiv"], a: 0 },
          { s: "My uncle works in a bank in Toronto.", o: ["Aktiv", "Passiv"], a: 0 },
          { s: "The tickets were sold in two hours.", o: ["Passiv", "Aktiv"], a: 0 },
          { s: "A girl from Vancouver won the competition.", o: ["Aktiv", "Passiv"], a: 0 },
          { s: "These laptops are made in Asia.", o: ["Passiv", "Aktiv"], a: 0 }
        ] },
      { typ: "paare", t: "Verbinde Grundform und 3. Form.",
        paare: [["make", "made"], ["build", "built"], ["write", "written"], ["speak", "spoken"], ["sell", "sold"], ["take", "taken"]] },
      { typ: "luecke", t: "is oder are? was oder were?", tipp: "Einzahl → is / was · Mehrzahl → are / were",
        items: ["English and French {{are|is}} spoken in Canada.", "The email {{was|were}} sent yesterday.", "A lot of films {{are|is}} made in Toronto.",
                "The two bridges {{were|was}} built more than 100 years ago.", "Breakfast {{is|are}} served from seven to ten."] },
      { typ: "zuordnen", t: "Gegenwart oder Vergangenheit? Sortiere die Passivformen.", gruppen: ["simple present", "simple past"],
        karten: [["is made", 0], ["are sold", 0], ["is used", 0], ["are written", 0], ["was built", 1], ["were taken", 1], ["was found", 1], ["were sent", 1]] },
      { typ: "luecke", t: "Passiv im simple present: Schreibe die ganze Form.", tipp: "am/is/are + 3. Form",
        items: ["The website [[is updated]] every week. (update)", "Thousands of photos [[are posted]] every minute. (post)", "The shop [[is closed]] on Sundays. (close)",
                "These bikes [[are made]] in Germany. (make)"] },
      { typ: "luecke", t: "Passiv im simple past: Schreibe die ganze Form.", tipp: "was/were + 3. Form",
        items: ["The school [[was built]] in 1975. (build)", "The winners [[were chosen]] by the class. (choose)", "My bag [[was found]] in the gym. (find)",
                "The tickets [[were sold]] online. (sell)"] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.",
        items: [{ teile: ["This song", "was written", "by", "a Canadian singer."] }, { teile: ["Tablets", "are used", "in", "many classrooms."] },
                { teile: ["The film", "was shown", "at", "our school", "last week."] }] }
    ],
    plus: [
      { typ: "umformen", t: "Setze den Satz ins Passiv.", tipp: "Das Objekt kommt nach vorn. Zeit beibehalten: is/are oder was/were + 3. Form. Wer es tut: by …",
        items: [
          { s: "Millions of people use this app.", l: ["This app is used by millions of people."] },
          { s: "A student took these photos.", l: ["These photos were taken by a student."] },
          { s: "They built the tower in 1976.", l: ["The tower was built in 1976.", "The tower was built in 1976 by them."] },
          { s: "People speak English in many countries.", l: ["English is spoken in many countries.", "English is spoken in many countries by people."] }
        ] },
      { typ: "frei", t: "Schreibe einen Passivsatz über etwas, das in deiner Schule oder Stadt gemacht wird oder wurde.", tipp: "Zum Beispiel: Our school was built in …",
        items: [{ f: "Dein eigener Passivsatz:", kriterien: ["ein vollständiger englischer Satz", "Passiv: is/are oder was/were + 3. Form des Verbs"],
                  muster: "\\b(is|are|was|were)\\s+(not\\s+)?[a-z]+(ed|en|t|ne|ld|nd|ght|wn)\\b", bsp: "Our school was built in 1975." }] }
    ]
  });
  </script>
