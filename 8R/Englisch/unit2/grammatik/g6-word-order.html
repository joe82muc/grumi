    lead: "Im Deutschen darfst du Satzteile oft verschieben. Im Englischen hat fast alles seinen **festen Platz**: „We met our friends **in the park** **yesterday**.“",

      { t: "Subjekt – Verb – Objekt", html: `
        <table><tr><th>Subjekt</th><th>Verb</th><th>Objekt</th></tr>
        <tr><td>My brother</td><td>loves</td><td>basketball.</td></tr><tr><td>We</td><td>visited</td><td>our grandparents.</td></tr></table>
        <p>Bei zwei Objekten: erst <b>wem</b>, dann <b>was</b> – <i>She showed <b>me</b> <b>her photos</b>.</i></p>` },
      { t: "Ort vor Zeit", html: `
        <table><tr><th>…</th><th>Ort (wo? wohin?)</th><th>Zeit (wann?)</th></tr>
        <tr><td>We arrived</td><td><b>in Denver</b></td><td><b>at noon</b>.</td></tr><tr><td>I left my bag</td><td><b>on the bus</b></td><td><b>this morning</b>.</td></tr></table>

      { t: "Meistens: erst genau, dann ungenau", html: `
        <div class="bsp">Ort: We stayed <b>at a small hotel</b> <b>in Boston</b>.</div>
        <div class="bsp">Zeit: The film starts <b>at 7:30</b> <b>on Friday</b>.</div>
        <p>Die genauere Angabe steht normalerweise zuerst.</p>` },
      { t: "Art und Weise (wie?)", html: `
        <p>Das Adverb steht nach dem Verb (und dem Objekt) – aber <b>vor Ort und Zeit</b>:</p>
        <table><tr><th>…</th><th>wie?</th><th>wo?</th><th>wann?</th></tr>
        <tr><td>He drove</td><td><b>carefully</b></td><td>through the city</td><td>last night.</td></tr>
        <tr><td>They waited</td><td><b>quietly</b></td><td>at the gate</td><td>for an hour.</td></tr></table>` }
    ],
    fallen: [
      "Deutsch: „Gestern habe ich im Park Fußball gespielt.“ – Englisch: Yesterday **I played football** in the park. Subjekt und Verb bleiben zusammen.",

      "Ort vor Zeit: We go **to school at eight**. Nicht: ~~We go at eight to school.~~"
    ],
    basis: [
      { typ: "markieren", t: "Markiere den Ort und die Zeit mit zwei Farben.", stifte: [["b", "Ort"], ["o", "Zeit"]], tipp: "Ort: wo? wohin? · Zeit: wann? wie lange?",

      { typ: "bauen", t: "Subjekt – Verb – Objekt: Baue die Sätze.", tipp: "Wer? Tut was? Wen oder was?",

      { typ: "bauen", t: "Ort vor Zeit: Baue die Sätze.", tipp: "Erst wo oder wohin, dann wann.",

      { typ: "wahl", t: "Welcher Satz hat die richtige Reihenfolge?", mischen: true,
        items: [
          { f: "Art und Weise – Ort – Zeit", o: ["The children played happily in the garden all afternoon.", "The children played in the garden happily all afternoon.", "The children played all afternoon happily in the garden."], a: 0 },
          { f: "Verb und Objekt bleiben zusammen", o: ["She speaks English very well.", "She speaks very well English.", "She very well speaks English."], a: 0 },
          { f: "Zeit am Anfang", o: ["Last summer we travelled to California.", "Last summer travelled we to California.", "We last summer travelled to California."], a: 0 },
          { f: "Zwei Objekte: erst wem, dann was", o: ["Mia gave her brother a present.", "Mia gave a present her brother.", "Mia her brother gave a present."], a: 0 }
        ] },
      { typ: "zuordnen", t: "Wie? Wo? Wann? Sortiere die Satzteile.", gruppen: ["Art und Weise (wie?)", "Ort (wo?)", "Zeit (wann?)"],
        karten: [["slowly", 0], ["carefully", 0], ["very well", 0], ["in New Orleans", 1], ["at the gate", 1], ["on the plane", 1], ["last night", 2], ["at 5 p.m.", 2], ["next week", 2]] },
      { typ: "bauen", t: "Jetzt alles zusammen: wie – wo – wann.", tipp: "Adverb der Art und Weise → Ort → Zeit",
        items: [{ teile: ["He", "drove", "carefully", "through the city", "last night."] }, { teile: ["We", "waited", "patiently", "at the gate", "for two hours."] },
                { teile: ["The band", "played", "loudly", "in the park", "yesterday evening."] }] }
    ],
    plus: [
      { typ: "umformen", t: "Übersetze ins Englische. Achte auf die Satzstellung.", tipp: "Subjekt – Verb – Objekt – Ort – Zeit",
        items: [
          { s: "Wir haben gestern im Park Fußball gespielt.", l: ["We played football in the park yesterday.", "Yesterday we played football in the park."] },
          { s: "Meine Tante wohnt seit zwei Jahren in Florida.", l: ["My aunt has lived in Florida for two years.", "My aunt has been living in Florida for two years."] },
          { s: "Ich mag Schokolade sehr gern.", l: ["I like chocolate very much.", "I really like chocolate.", "I like chocolate a lot."] }
        ] },
      { typ: "wahl", t: "Finde den Fehler: Welcher Satz ist falsch gebaut?", tipp: "Suche einen Satz, in dem etwas zwischen Verb und Objekt steht oder die Zeit vor dem Ort.",
        items: [
          { f: "Einer dieser Sätze ist falsch.", o: ["I do every day my homework.", "I do my homework every day.", "Every day I do my homework."], a: 0, e: "Zwischen Verb (do) und Objekt (my homework) darf nichts stehen." },
          { f: "Einer dieser Sätze ist falsch.", o: ["We flew in June to New York.", "We flew to New York in June.", "In June we flew to New York."], a: 0, e: "Ort (to New York) kommt vor Zeit (in June)." }
        ] }
    ]
