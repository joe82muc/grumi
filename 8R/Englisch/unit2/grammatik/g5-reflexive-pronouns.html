  <title>G5 · Reflexivpronomen | Englisch 8R</title>
  <meta name="description" content="Englisch 8R, Unit 2: Reflexivpronomen mit -self und -selves bilden und verwenden – auch zum Betonen (I did it myself). Mit abwechslungsreichen Übungen.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E8Seite(2, "g");
  Grammatik.seite({
    nr: 1, modul: "e8-u2-g5", kurz: "G5",
    titel: "Reflexivpronomen",
    lead: "„I cut **myself**.“ – „We made the pizza **ourselves**.“ Mit den Wörtern auf -self und -selves zeigst du zurück auf die Person – oder du betonst, wer etwas selbst getan hat.",
    ziele: ["Du kennst alle acht Formen auf -self und -selves.", "Du benutzt sie, wenn jemand etwas mit sich selbst tut.", "Du betonst mit ihnen, dass jemand etwas selbst gemacht hat."],
    merk: [
      { t: "Die Formen", html: `
        <table><tr><th>Einzahl</th><th></th><th>Mehrzahl</th><th></th></tr>
        <tr><td>I</td><td><b>myself</b></td><td>we</td><td><b>ourselves</b></td></tr>
        <tr><td>you</td><td><b>yourself</b></td><td>you</td><td><b>yourselves</b></td></tr>
        <tr><td>he / she / it</td><td><b>himself / herself / itself</b></td><td>they</td><td><b>themselves</b></td></tr></table>
        <p>Einzahl: <b>-self</b> · Mehrzahl: <b>-selves</b></p>` },
      { t: "Zurück auf die Person", html: `
        <p>Die Person tut etwas <b>mit sich selbst</b>. Im Deutschen steht dann meist <i>mich, dich, sich, uns, euch</i>.</p>
        <div class="bsp"><b>I</b> can see <b>myself</b> in the mirror. <i>– Ich sehe mich im Spiegel.</i></div>
        <div class="bsp"><b>The children</b> taught <b>themselves</b> to skate. <i>– Die Kinder haben sich das Skaten selbst beigebracht.</i></div>` },
      { t: "Betonen: selbst", html: `
        <p>Du willst sagen, dass jemand etwas <b>selbst</b> (ohne Hilfe) gemacht hat. Das Pronomen steht dann oft am Satzende:</p>
        <div class="bsp">My sister repaired her bike <b>herself</b>. <i>– … selbst repariert.</i></div>
        <div class="bsp">We planned the trip <b>ourselves</b>. <i>– … selbst geplant.</i></div>` },
      { t: "Wendungen zum Merken", html: `
        <ul class="wb-liste"><li><b>enjoy yourself</b><span>sich amüsieren, Spaß haben</span></li><li><b>help yourself</b><span>sich bedienen</span></li>
        <li><b>introduce yourself</b><span>sich vorstellen</span></li><li><b>hurt yourself</b><span>sich wehtun</span></li><li><b>by myself</b><span>allein, ohne andere</span></li></ul>` }
    ],
    fallen: [
      "Nicht jedes deutsche „sich“ wird übersetzt: sich treffen = **meet**, sich fühlen = **feel**, sich erinnern = **remember**, sich beeilen = **hurry**.",
      "Mehrzahl mit **-selves**: ourselves, yourselves, themselves. Nicht: ~~themself, ourself~~.",
      "Es heißt **himself** und **themselves**. Nicht: ~~hisself, theirselves~~."
    ],
    basis: [
      { typ: "paare", t: "Welches Reflexivpronomen gehört zu welcher Person?",
        paare: [["I", "myself"], ["he", "himself"], ["she", "herself"], ["it", "itself"], ["we", "ourselves"], ["they", "themselves"]] },
      { typ: "luecke", t: "Wähle das passende Pronomen.", tipp: "Auf wen zeigt das Pronomen zurück? Suche die Person am Satzanfang.",
        items: ["I taught {{myself|yourself|himself}} to play the ukulele.", "Be careful with that knife, Tim, or you'll cut {{yourself|myself|yourselves}}.",
                "My little brother can already dress {{himself|herself|itself}}.", "Emma looked at {{herself|himself|themselves}} in the shop window.",
                "The cat cleaned {{itself|herself|themselves}} after dinner."] },
      { typ: "luecke", t: "Schreibe das Reflexivpronomen in die Lücke.", tipp: "Mehrzahl: -selves",
        items: ["We really enjoyed [[ourselves]] at the beach.", "The players introduced [[themselves]] to the new coach.", "Kids, please help [[yourselves]] to some cake!",
                "My grandma fell and hurt [[herself]].", "I sometimes talk to [[myself]] when I'm nervous."] },
      { typ: "wahl", t: "Zurückzeigen oder betonen? Wozu steht das Pronomen hier?", tipp: "Kannst du „selbst / ohne Hilfe“ einsetzen? Dann wird betont.",
        items: [
          { s: "Paul built the bookshelf himself.", o: ["betonen (selbst)", "zurückzeigen (sich)"], a: 0 },
          { s: "Anna burnt herself on the hot pan.", o: ["zurückzeigen (sich)", "betonen (selbst)"], a: 0 },
          { s: "Did you write this song yourself?", o: ["betonen (selbst)", "zurückzeigen (sich)"], a: 0 },
          { s: "The boys locked themselves out of the house.", o: ["zurückzeigen (sich)", "betonen (selbst)"], a: 0 }
        ] },
      { typ: "wahl", t: "Welche Übersetzung stimmt?", mischen: true, tipp: "Bei manchen Verben gibt es im Englischen kein „sich“.",
        items: [
          { f: "Wir treffen uns um vier.", o: ["We meet at four.", "We meet ourselves at four."], a: 0, e: "sich treffen = meet, ohne -selves." },
          { f: "Ich fühle mich heute gut.", o: ["I feel good today.", "I feel myself good today."], a: 0, e: "sich fühlen = feel, ohne myself." },
          { f: "Bedien dich!", o: ["Help yourself!", "Help you!"], a: 0, e: "sich bedienen = help yourself." },
          { f: "Sie hat sich am Fuß wehgetan.", o: ["She hurt herself on the foot.", "She hurt her on the foot."], a: 0, e: "sich wehtun = hurt herself." }
        ] },
      { typ: "bauen", t: "Bringe die Bausteine in die richtige Reihenfolge.",
        items: [{ teile: ["My parents", "painted", "the kitchen", "themselves."] }, { teile: ["Did", "you", "make", "this cake", "yourself?"] },
                { teile: ["We", "enjoyed", "ourselves", "at the party."] }, { teile: ["She", "taught", "herself", "to swim."] }] }
    ],
    plus: [
      { typ: "umformen", t: "Betone, dass die Person es selbst getan hat.", tipp: "Hänge das passende Pronomen an den Satz an.",
        items: [
          { s: "I repaired my bike.", l: ["I repaired my bike myself.", "I myself repaired my bike."] },
          { s: "The students organised the concert.", l: ["The students organised the concert themselves.", "The students themselves organised the concert.", "The students organized the concert themselves."] },
          { s: "My dad baked the bread.", l: ["My dad baked the bread himself.", "My dad himself baked the bread."] }
        ] },
      { typ: "luecke", t: "Mit Pronomen oder ohne? Wähle aus. („–“ heißt: nichts einsetzen)", tipp: "meet, feel, remember, hurry stehen ohne Reflexivpronomen.",
        items: ["Hurry {{–|yourself}} up, the bus is coming!", "Do you remember {{–|yourself}} our trip to the lake?", "The kids amused {{themselves|–}} with a card game.",
                "We met {{–|ourselves}} at the station.", "My cousin taught {{herself|–}} to play the piano – without a teacher."] }
    ]
  });
  </script>
