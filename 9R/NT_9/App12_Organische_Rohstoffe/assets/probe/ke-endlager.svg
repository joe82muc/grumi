<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Arial, Helvetica, sans-serif">
  <style>
    .tropf{animation:tropf 3s linear infinite}
    .t2{animation-delay:.9s}.t3{animation-delay:1.8s}.t4{animation-delay:.4s}.t5{animation-delay:1.4s}
    @keyframes tropf{0%{transform:translateY(0);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateY(96px);opacity:0}}
    .kurz{animation:kurz 2.6s linear infinite}
    .k2{animation-delay:.9s}.k3{animation-delay:1.7s}
    @keyframes kurz{0%{transform:translateY(0);opacity:0}20%{opacity:1}70%{opacity:1}100%{transform:translateY(22px);opacity:0}}
    .puls{transform-box:fill-box;transform-origin:center;animation:puls 2.2s ease-out infinite}
    .p2{animation-delay:1.1s}
    @keyframes puls{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
    @media (prefers-reduced-motion: reduce){.tropf,.kurz,.puls{animation:none}.puls{opacity:.5}}
  </style>
  <defs>
    <clipPath id="lupe"><circle cx="478" cy="194" r="146"/></clipPath>
    <marker id="pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15212b"/></marker>
    <path id="tr" d="M0 -7 C4 -1 5 2 5 4 A5 5 0 0 1 -5 4 C-5 2 -4 -1 0 -7z"/>
  </defs>
  <rect width="640" height="380" fill="#f6f9fb"/>
  <!-- linke Ansicht: Schnitt durch den Boden -->
  <rect x="0" y="0" width="300" height="64" fill="#cfe8fa"/>
  <rect x="0" y="64" width="300" height="316" fill="#8d949c"/>
  <rect x="0" y="64" width="300" height="60" fill="#a98258"/>
  <rect x="0" y="124" width="300" height="66" fill="#b7ab97"/>
  <rect x="0" y="64" width="300" height="10" fill="#6fae4f"/>
  <g stroke="#7a828b" stroke-width="2" fill="none"><path d="M0 232 Q80 222 160 234 T300 228"/><path d="M0 348 Q90 340 170 350 T300 344"/></g>
  <rect x="134" y="34" width="32" height="30" fill="#d9dee4" stroke="#4a5866" stroke-width="2"/>
  <path d="M128 34 L150 12 L172 34z" fill="#9aa7b4" stroke="#4a5866" stroke-width="2"/>
  <rect x="145" y="64" width="10" height="240" fill="#2f3945"/>
  <rect x="66" y="298" width="188" height="22" rx="5" fill="#2f3945"/>
  <g fill="#f2b632"><rect x="80" y="304" width="16" height="10" rx="2"/><rect x="104" y="304" width="16" height="10" rx="2"/><rect x="176" y="304" width="16" height="10" rx="2"/><rect x="202" y="304" width="16" height="10" rx="2"/><rect x="226" y="304" width="16" height="10" rx="2"/></g>
  <path d="M28 80 L28 300" stroke="#15212b" stroke-width="2.5" marker-start="url(#pm)" marker-end="url(#pm)" fill="none"/>
  <text transform="translate(18 190) rotate(-90)" text-anchor="middle" font-size="13" font-weight="800" fill="#15212b">tief unter der Erde</text>
  <g fill="#1e88e5">
    <g class="tropf"><use href="#tr" x="70" y="86"/></g><g class="tropf t2"><use href="#tr" x="108" y="92"/></g><g class="tropf t3"><use href="#tr" x="200" y="84"/></g><g class="tropf t4"><use href="#tr" x="238" y="94"/></g><g class="tropf t5"><use href="#tr" x="274" y="86"/></g>
  </g>
  <circle cx="210" cy="309" r="17" fill="none" stroke="#1f5f99" stroke-width="3"/>
  <g stroke="#1f5f99" stroke-width="2" stroke-dasharray="6 5" fill="none"><path d="M218 294 L372 94"/><path d="M220 323 L392 312"/></g>
  <!-- Lupe: Stollen im Querschnitt -->
  <g clip-path="url(#lupe)">
    <rect x="330" y="46" width="300" height="300" fill="#8d949c"/>
    <g stroke="#7a828b" stroke-width="2.5" fill="none"><path d="M330 96 Q410 84 490 98 T630 90"/><path d="M330 300 Q420 290 500 304 T630 296"/><path d="M330 196 L372 190M584 200 L630 194"/></g>
    <circle cx="478" cy="194" r="102" fill="#e6d3a3" stroke="#b89b5e" stroke-width="3"/>
    <g fill="#c9b278"><circle cx="410" cy="150" r="3"/><circle cx="398" cy="210" r="3"/><circle cx="430" cy="262" r="3"/><circle cx="540" cy="266" r="3"/><circle cx="560" cy="208" r="3"/><circle cx="548" cy="140" r="3"/><circle cx="478" cy="110" r="3"/><circle cx="446" cy="118" r="3"/><circle cx="512" cy="120" r="3"/><circle cx="412" cy="240" r="3"/><circle cx="556" cy="240" r="3"/><circle cx="504" cy="284" r="3"/></g>
    <circle cx="478" cy="194" r="60" fill="#4a5560" stroke="#222c36" stroke-width="3"/>
    <circle cx="478" cy="194" r="33" fill="#f2b632" stroke="#a36f00" stroke-width="2"/>
    <g fill="none" stroke="#d9480f" stroke-width="3"><circle class="puls" cx="478" cy="194" r="31"/><circle class="puls p2" cx="478" cy="194" r="31"/></g>
    <g transform="translate(478 187)">
      <g fill="#222"><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(90)"/><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(210)"/><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(330)"/></g>
      <circle r="4.4" fill="#f2b632"/><circle r="2.4" fill="#222"/>
    </g>
    <text x="478" y="219" text-anchor="middle" font-size="11.5" font-weight="900" fill="#222">Abfall</text>
    <g fill="#1e88e5"><g class="kurz"><use href="#tr" x="478" y="60"/></g><g class="kurz k2"><use href="#tr" x="398" y="96"/></g><g class="kurz k3"><use href="#tr" x="560" y="96"/></g></g>
  </g>
  <circle cx="478" cy="194" r="146" fill="none" stroke="#1f5f99" stroke-width="5"/>
  <text x="478" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#33414f">Stollen im Querschnitt (vergrößert)</text>
  <!-- Buchstaben -->
  <g font-size="18" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="478" cy="147" r="13" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="478" y="153.5">A</text>
    <circle cx="478" cy="276" r="14" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="478" y="282.5">B</text>
    <circle cx="354" cy="194" r="14" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="354" y="200.5">C</text>
  </g>
</svg>
