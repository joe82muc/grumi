<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Arial, Helvetica, sans-serif">
  <style>
    .kb{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.5)}
    .gb0,.gb1{transform-box:fill-box;transform-origin:50% 100%;animation:gb 8s infinite}
    @keyframes gb{0%,12%{transform:scale(.5)}30%,92%{transform:none}100%{transform:scale(.5)}}
    .lb{animation:lb 8s infinite}
    @keyframes lb{0%,12%{transform:translateY(30px)}30%,92%{transform:none}100%{transform:translateY(30px)}}
    .pl0{transform-origin:165px 214px;transform:rotate(-11deg);animation:pl0 8s infinite}
    @keyframes pl0{0%,30%{transform:none}42%,92%{transform:rotate(-11deg)}100%{transform:none}}
    .pl1{transform-origin:475px 214px;transform:rotate(11deg);animation:pl1 8s infinite}
    @keyframes pl1{0%,30%{transform:none}42%,92%{transform:rotate(11deg)}100%{transform:none}}
    .bein1{transform-origin:162px 100px;animation:bein .45s ease-in-out infinite alternate}
    .bein2{transform-origin:162px 100px;animation:bein .45s ease-in-out infinite alternate-reverse}
    @keyframes bein{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
    .zz{animation:zz 2.4s linear infinite}
    @keyframes zz{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="290" fill="#f6f9fb"/>
  <text x="165" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">beim Sprint</text><text x="475" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">im Schlaf</text>
  <g stroke="#2b3640" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="172" cy="56" r="10" fill="#2b3640" stroke="none"/>
    <line x1="168" y1="68" x2="162" y2="100"/>
    <path d="M166 76 L184 88 L194 80"/><path d="M166 76 L150 86 L140 80"/>
    <g class="bein1"><path d="M162 100 L176 116 L172 132"/></g>
    <g class="bein2"><path d="M162 100 L150 118 L138 124"/></g>
  </g>
  <g stroke="#9aa9b5" stroke-width="3" stroke-linecap="round"><line x1="112" y1="70" x2="132" y2="70"/><line x1="106" y1="86" x2="130" y2="86"/><line x1="114" y1="102" x2="134" y2="102"/></g>
  <rect x="418" y="92" width="114" height="22" rx="4" fill="#c9b08a" stroke="#8b6b4a" stroke-width="2"/>
  <line x1="422" y1="114" x2="422" y2="130" stroke="#8b6b4a" stroke-width="4"/><line x1="528" y1="114" x2="528" y2="130" stroke="#8b6b4a" stroke-width="4"/>
  <ellipse cx="436" cy="88" rx="16" ry="8" fill="#ffffff" stroke="#9aa9b5" stroke-width="1.5"/>
  <circle cx="440" cy="80" r="10" fill="#f2cba5" stroke="#b07a4f" stroke-width="1.5"/>
  <path d="M452 84 Q490 66 530 86 L530 96 L452 96 Z" fill="#7aa6d6" stroke="#3a5f7d" stroke-width="1.5"/>
  <g class="zz"><text x="456" y="64" font-size="15" font-weight="700" fill="#3a5f7d">z</text><text x="470" y="52" font-size="19" font-weight="700" fill="#3a5f7d">Z</text></g>
  
  <path d="M143 252 L187 252 L165 216 Z" fill="#7f8b95" stroke="#4d5963" stroke-width="2"/>
  <g class="pl0">
    <rect x="33" y="207" width="264" height="10" rx="4" fill="#8b6b4a" stroke="#5e4630" stroke-width="1.5"/>
    <rect class="gb0" x="33" y="147" width="60" height="60" rx="6" fill="#8e6bbf" stroke="#5b3a91" stroke-width="2"/>
    <rect class="kb" x="237" y="147" width="60" height="60" rx="6" fill="#3c9d8f" stroke="#1f6b60" stroke-width="2"/>
    <text x="63" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#5b3a91" class="lb">X</text><text x="267" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6b60">Y</text>
  </g>
  <line x1="15" y1="252" x2="315" y2="252" stroke="#9aa9b5" stroke-width="2"/>
  <path d="M453 252 L497 252 L475 216 Z" fill="#7f8b95" stroke="#4d5963" stroke-width="2"/>
  <g class="pl1">
    <rect x="343" y="207" width="264" height="10" rx="4" fill="#8b6b4a" stroke="#5e4630" stroke-width="1.5"/>
    <rect class="kb" x="343" y="147" width="60" height="60" rx="6" fill="#8e6bbf" stroke="#5b3a91" stroke-width="2"/>
    <rect class="gb1" x="547" y="147" width="60" height="60" rx="6" fill="#3c9d8f" stroke="#1f6b60" stroke-width="2"/>
    <text x="373" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#5b3a91">X</text><text x="577" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6b60" class="lb">Y</text>
  </g>
  <line x1="325" y1="252" x2="625" y2="252" stroke="#9aa9b5" stroke-width="2"/>
  <text x="320" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#566674">großer Block = dieser Teil ist stark</text>
</svg>
