<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:3 9;stroke-linecap:round;animation:lauf 1.2s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-24}}
    .glut{transform-box:fill-box;transform-origin:center;animation:glut 2.4s ease-in-out infinite}
    .g2{animation-delay:.6s}.g3{animation-delay:1.2s}
    @keyframes glut{0%,60%,100%{transform:scale(1);opacity:0}20%{transform:scale(1.5);opacity:.75}}
    @media (prefers-reduced-motion: reduce){.lauf,.glut{animation:none}}
  </style>
  <defs>
    <radialGradient id="uran" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#f3d36b"/><stop offset="1" stop-color="#b98a16"/></radialGradient>
    <marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4a5c"/></marker>
    <g id="kern"><circle r="17" fill="url(#uran)" stroke="#8a6a10" stroke-width="2.5"/></g>
  </defs>
  <rect width="640" height="372" fill="#f6f9fb"/>
  <rect x="8" y="8" width="304" height="304" rx="14" fill="#fff" stroke="#d5dde5" stroke-width="2"/>
  <rect x="328" y="8" width="304" height="304" rx="14" fill="#fff" stroke="#d5dde5" stroke-width="2"/>
  <g font-size="17" font-weight="900" fill="#15212b"><text x="22" y="34">Bild A</text><text x="342" y="34">Bild B</text></g>

  <!-- Bild A: es werden immer mehr -->
  <g fill="none" stroke="#3d4a5c" stroke-width="4">
    <path class="lauf" d="M18 165 L38 165" marker-end="url(#pk)"/>
    <path class="lauf" d="M74 155 L126 116" marker-end="url(#pk)"/>
    <path class="lauf" d="M74 175 L126 214" marker-end="url(#pk)"/>
    <path class="lauf" d="M158 98 L214 72" marker-end="url(#pk)"/>
    <path class="lauf" d="M158 112 L214 132" marker-end="url(#pk)"/>
    <path class="lauf" d="M158 218 L214 198" marker-end="url(#pk)"/>
    <path class="lauf" d="M158 232 L214 258" marker-end="url(#pk)"/>
    <path class="lauf" d="M250 58 L292 46" marker-end="url(#pk)"/><path class="lauf" d="M250 70 L292 82" marker-end="url(#pk)"/>
    <path class="lauf" d="M250 128 L292 116" marker-end="url(#pk)"/><path class="lauf" d="M250 140 L292 152" marker-end="url(#pk)"/>
    <path class="lauf" d="M250 192 L292 180" marker-end="url(#pk)"/><path class="lauf" d="M250 204 L292 216" marker-end="url(#pk)"/>
    <path class="lauf" d="M250 258 L292 246" marker-end="url(#pk)"/><path class="lauf" d="M250 270 L292 282" marker-end="url(#pk)"/>
  </g>
  <g fill="#ff8a1f">
    <circle class="glut" cx="56" cy="165" r="17"/><circle class="glut g2" cx="142" cy="105" r="17"/><circle class="glut g2" cx="142" cy="225" r="17"/>
    <circle class="glut g3" cx="232" cy="64" r="17"/><circle class="glut g3" cx="232" cy="134" r="17"/><circle class="glut g3" cx="232" cy="198" r="17"/><circle class="glut g3" cx="232" cy="264" r="17"/>
  </g>
  <use href="#kern" x="56" y="165"/><use href="#kern" x="142" y="105"/><use href="#kern" x="142" y="225"/>
  <use href="#kern" x="232" y="64"/><use href="#kern" x="232" y="134"/><use href="#kern" x="232" y="198"/><use href="#kern" x="232" y="264"/>

  <!-- Bild B: gleich bleibend -->
  <rect x="346" y="54" width="268" height="18" rx="5" fill="#8d99a6" stroke="#4a5866" stroke-width="2"/>
  <rect x="346" y="258" width="268" height="18" rx="5" fill="#8d99a6" stroke="#4a5866" stroke-width="2"/>
  <g fill="none" stroke="#3d4a5c" stroke-width="4">
    <path class="lauf" d="M338 165 L360 165" marker-end="url(#pk)"/>
    <path class="lauf" d="M400 165 L452 165" marker-end="url(#pk)"/>
    <path class="lauf" d="M492 165 L544 165" marker-end="url(#pk)"/>
    <path class="lauf" d="M584 165 L624 165" marker-end="url(#pk)"/>
    <path class="lauf" d="M388 149 L410 76" marker-end="url(#pk)"/><path class="lauf" d="M388 181 L410 254" marker-end="url(#pk)"/>
    <path class="lauf" d="M480 149 L502 76" marker-end="url(#pk)"/><path class="lauf" d="M480 181 L502 254" marker-end="url(#pk)"/>
    <path class="lauf" d="M572 149 L594 76" marker-end="url(#pk)"/><path class="lauf" d="M572 181 L594 254" marker-end="url(#pk)"/>
  </g>
  <g fill="#ff8a1f">
    <circle class="glut" cx="380" cy="165" r="17"/><circle class="glut g2" cx="472" cy="165" r="17"/><circle class="glut g3" cx="564" cy="165" r="17"/>
  </g>
  <use href="#kern" x="380" y="165"/><use href="#kern" x="472" y="165"/><use href="#kern" x="564" y="165"/>

  <!-- Legende -->
  <g font-size="13.5" font-weight="700" fill="#15212b">
    <use href="#kern" transform="translate(28 342) scale(.7)"/><text x="46" y="347">Uran-235-Kern</text>
    <path d="M168 342 L206 342" stroke="#3d4a5c" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#pk)" fill="none"/><text x="216" y="347">Weg eines Neutrons</text>
    <rect x="366" y="334" width="44" height="16" rx="5" fill="#8d99a6" stroke="#4a5866" stroke-width="2"/><text x="420" y="347">Stoff, der Neutronen einfängt</text>
  </g>
</svg>
