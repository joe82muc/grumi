<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{transform-box:view-box;transform-origin:230px 158px;animation:rund 6s linear infinite}
    @keyframes rund{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.lauf{animation:none}}
  </style>
  <rect width="460" height="300" fill="#f4fbf6"/>
  <text x="14" y="26" font-size="15" font-weight="900" fill="#1f7a5a">Kreislaufwirtschaft</text>
  <!-- Kreis mit Pfeilspitzen im Uhrzeigersinn -->
  <circle cx="230" cy="158" r="96" fill="none" stroke="#1f7a5a" stroke-width="4" stroke-dasharray="10 8"/>
  <g fill="#1f7a5a">
    <path d="M-9 -9 L9 0 L-9 9z" transform="translate(298 90) rotate(45)"/>
    <path d="M-9 -9 L9 0 L-9 9z" transform="translate(298 226) rotate(135)"/>
    <path d="M-9 -9 L9 0 L-9 9z" transform="translate(162 226) rotate(225)"/>
    <path d="M-9 -9 L9 0 L-9 9z" transform="translate(162 90) rotate(315)"/>
  </g>
  <!-- wandernder Rohstoff -->
  <g class="lauf"><circle cx="230" cy="62" r="8" fill="#f2b632" stroke="#a36f00" stroke-width="2"/></g>
  <!-- Stationen -->
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="166" y="40" width="128" height="40" rx="12" fill="#1f7a5a"/><text x="230" y="65" fill="#fff">neues Produkt</text>
    <rect x="276" y="138" width="108" height="40" rx="12" fill="#1f7a5a"/><text x="330" y="163" fill="#fff">benutzen</text>
  </g>
  <g font-size="20" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="230" cy="254" r="20" fill="#1f5f99"/><text x="230" y="261">A</text>
    <circle cx="134" cy="158" r="20" fill="#1f5f99"/><text x="134" y="165">B</text>
  </g>
  <!-- kleine Produkte in der Mitte -->
  <g transform="translate(206 136)">
    <rect x="4" y="10" width="16" height="30" rx="4" fill="#7cc3e8"/><rect x="8" y="4" width="8" height="8" fill="#1f5f99"/>
    <rect x="28" y="16" width="20" height="24" rx="3" fill="#d58a33"/>
  </g>
</svg>
