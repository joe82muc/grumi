    .z9{animation:z9 12s infinite}@keyframes z9{0%,54%{fill:#cfd8df}58%,95%{fill:#e08a2e}100%{fill:#cfd8df}}
    .l1{animation:l1 12s infinite}@keyframes l1{0%,22%{opacity:0}26%,95%{opacity:1}100%{opacity:0}}
    .l2{animation:l2 12s infinite}@keyframes l2{0%,56%{opacity:0}60%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
