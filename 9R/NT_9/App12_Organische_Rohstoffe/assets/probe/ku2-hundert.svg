  <g class="l2"><circle cx="330" cy="184" r="11" fill="#e08a2e"/><text x="350" y="181" font-size="15" fill="#15212b">wird zu Fasern, Folien oder</text><text x="350" y="200" font-size="15" font-weight="700" fill="#15212b">Behältern für Nicht-Lebensmittel</text></g>
