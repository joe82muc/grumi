<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P5: 100 Punkte stehen für 100 gesammelte PET-Einwegflaschen. 40 Punkte werden grün: Sie werden wieder zu Getränkeflaschen. 60 Punkte werden orange: Sie werden zu Fasern, Folien oder Behältern für Nicht-Lebensmittel. -->
  <style>
    .z0{animation:z0 12s infinite}@keyframes z0{0%,8%{fill:#cfd8df}12%,95%{fill:#0f7f8f}100%{fill:#cfd8df}}
