    .z2{animation:z2 12s infinite}@keyframes z2{0%,16%{fill:#cfd8df}20%,95%{fill:#0f7f8f}100%{fill:#cfd8df}}
    .z3{animation:z3 12s infinite}@keyframes z3{0%,20%{fill:#cfd8df}24%,95%{fill:#0f7f8f}100%{fill:#cfd8df}}
    .z4{animation:z4 12s infinite}@keyframes z4{0%,34%{fill:#cfd8df}38%,95%{fill:#e08a2e}100%{fill:#cfd8df}}
    .z5{animation:z5 12s infinite}@keyframes z5{0%,38%{fill:#cfd8df}42%,95%{fill:#e08a2e}100%{fill:#cfd8df}}
    .z6{animation:z6 12s infinite}@keyframes z6{0%,42%{fill:#cfd8df}46%,95%{fill:#e08a2e}100%{fill:#cfd8df}}
