<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe Kunststoffe (9M): Recycling-Code auf dem Boden einer Brotzeitbox. Ein heller Streifen läuft über die Pfeile. -->
  <style>
    .lauf{stroke-dasharray:18 150;animation:lauf 2.2s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-168}}
    .glanz{animation:glanz 3.5s ease-in-out infinite}
    @keyframes glanz{0%,100%{opacity:.15}50%{opacity:.45}}
    @media (prefers-reduced-motion: reduce){.lauf,.glanz{animation:none}}
  </style>
  <defs>
    <marker id="sp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f3b2a"/></marker>
  </defs>
  <rect width="640" height="320" fill="#f6f9fb"/>
  <!-- Boden der Box -->
  <rect x="110" y="14" width="420" height="292" rx="50" fill="#a8dba1" stroke="#3f8a36" stroke-width="5"/>
  <rect x="134" y="38" width="372" height="244" rx="38" fill="#b9e3b2" stroke="#7cbf73" stroke-width="2"/>
  <ellipse class="glanz" cx="230" cy="78" rx="78" ry="20" fill="#ffffff"/>
  <!-- Dreieck aus drei Pfeilen (Ecken 320/48, 222/214, 418/214) -->
  <g fill="none" stroke="#1f3b2a" stroke-width="12" stroke-linecap="round" marker-end="url(#sp)">
    <path d="M306 72 L244 178"/>
    <path d="M250 214 L386 214"/>
    <path d="M404 190 L342 84"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path class="lauf" d="M306 72 L244 178"/>
    <path class="lauf" d="M250 214 L386 214" style="animation-delay:.7s"/>
    <path class="lauf" d="M404 190 L342 84" style="animation-delay:1.4s"/>
  </g>
  <text x="320" y="178" text-anchor="middle" font-size="44" font-weight="700" fill="#1f3b2a">05</text>
  <text x="320" y="270" text-anchor="middle" font-size="40" font-weight="700" fill="#1f3b2a">PP</text>
</svg>
