<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P5: zwei Thermometer – für eine PET-Flasche wird das Material auf etwa 250 Grad Celsius erhitzt, für eine Glasflasche auf etwa 1600 Grad Celsius. -->
  <style>
    .pet{transform-origin:0 222px;animation:pet 9s infinite}
    @keyframes pet{0%,6%{transform:scaleY(.05)}24%,95%{transform:none}100%{transform:scaleY(.05)}}
    .gl{transform-origin:0 222px;animation:gl 9s infinite}
    @keyframes gl{0%,6%{transform:scaleY(.05)}62%,95%{transform:none}100%{transform:scaleY(.05)}}
    .petw{animation:petw 9s infinite}@keyframes petw{0%,22%{opacity:0}26%,95%{opacity:1}100%{opacity:0}}
    .glw{animation:glw 9s infinite}@keyframes glw{0%,60%{opacity:0}64%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="296" fill="#f6f9fb"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">So heiß wird das Material für eine neue Flasche gemacht</text>
  <line x1="308" y1="222" x2="332" y2="222" stroke="#566674" stroke-width="1.5"/><text x="344" y="226" font-size="12" fill="#566674">0 °C</text><line x1="314" y1="202.9" x2="326" y2="202.9" stroke="#566674" stroke-width="1.5"/><line x1="308" y1="183.8" x2="332" y2="183.8" stroke="#566674" stroke-width="1.5"/><text x="344" y="187.8" font-size="12" fill="#566674">400 °C</text><line x1="314" y1="164.6" x2="326" y2="164.6" stroke="#566674" stroke-width="1.5"/><line x1="308" y1="145.5" x2="332" y2="145.5" stroke="#566674" stroke-width="1.5"/><text x="344" y="149.5" font-size="12" fill="#566674">800 °C</text><line x1="314" y1="126.4" x2="326" y2="126.4" stroke="#566674" stroke-width="1.5"/><line x1="308" y1="107.3" x2="332" y2="107.3" stroke="#566674" stroke-width="1.5"/><text x="344" y="111.3" font-size="12" fill="#566674">1200 °C</text><line x1="314" y1="88.2" x2="326" y2="88.2" stroke="#566674" stroke-width="1.5"/><line x1="308" y1="69" x2="332" y2="69" stroke="#566674" stroke-width="1.5"/><text x="344" y="73" font-size="12" fill="#566674">1600 °C</text><line x1="314" y1="49.9" x2="326" y2="49.9" stroke="#566674" stroke-width="1.5"/>
  <rect x="209" y="40" width="22" height="190" rx="11" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/>
    <rect class="pet" x="215" y="198.1" width="10" height="31.9" rx="4" fill="#d63a30"/>
    <circle cx="220" cy="238" r="18" fill="#d63a30"/>
    <text x="220" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#15212b">PET</text>
    <g class="petw"><line x1="206" y1="198.1" x2="180" y2="198.1" stroke="#15212b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="176" y="203.1" text-anchor="end" font-size="15" font-weight="700" fill="#15212b">etwa 250 °C</text></g>
  <rect x="419" y="40" width="22" height="190" rx="11" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/>
    <rect class="gl" x="425" y="69" width="10" height="161" rx="4" fill="#d63a30"/>
    <circle cx="430" cy="238" r="18" fill="#d63a30"/>
    <text x="430" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#15212b">Glas</text>
    <g class="glw"><line x1="444" y1="69" x2="470" y2="69" stroke="#15212b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="474" y="74" text-anchor="start" font-size="15" font-weight="700" fill="#15212b">etwa 1600 °C</text></g>
</svg>
