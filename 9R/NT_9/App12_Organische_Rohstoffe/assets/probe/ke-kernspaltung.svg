<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .flug{animation:flug 2.2s ease-in infinite}
    @keyframes flug{0%{transform:translateX(0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(86px);opacity:0}}
    .wackel{transform-box:fill-box;transform-origin:center;animation:wackel .5s ease-in-out infinite alternate}
    @keyframes wackel{from{transform:scale(1,1)}to{transform:scale(1.05,.96)}}
    .links{animation:links 1.6s ease-in-out infinite alternate}
    .rechts{animation:rechts 1.6s ease-in-out infinite alternate}
    @keyframes links{from{transform:translateX(8px)}to{transform:translateX(-10px)}}
    @keyframes rechts{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
    .stern{transform-box:fill-box;transform-origin:center;animation:stern .8s ease-in-out infinite alternate}
    @keyframes stern{from{transform:scale(.8);opacity:.75}to{transform:scale(1.12);opacity:1}}
    .raus{animation:raus 1.8s ease-out infinite}
    .r2{animation-delay:.3s}.r3{animation-delay:.6s}
    @keyframes raus{0%{transform:translateY(-12px);opacity:.3}40%{opacity:1}100%{transform:translateY(8px);opacity:1}}
    @media (prefers-reduced-motion: reduce){.flug,.wackel,.links,.rechts,.stern,.raus{animation:none}}
  </style>
  <defs>
    <radialGradient id="uran" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#f3d36b"/><stop offset="1" stop-color="#b98a16"/></radialGradient>
    <radialGradient id="t1" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#f0b56a"/><stop offset="1" stop-color="#b8691c"/></radialGradient>
    <radialGradient id="t2" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#8fc3da"/><stop offset="1" stop-color="#3a6f8a"/></radialGradient>
    <marker id="pk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7a"/></marker>
  </defs>
  <rect width="640" height="300" fill="#f6f9fb"/>
  <rect x="10" y="40" width="270" height="250" rx="14" fill="#fff" stroke="#d5dde5" stroke-width="2"/>
  <rect x="340" y="40" width="290" height="250" rx="14" fill="#fff" stroke="#d5dde5" stroke-width="2"/>
  <g font-size="16" font-weight="900" fill="#15212b" text-anchor="middle"><text x="145" y="28">vor der Spaltung</text><text x="485" y="28">nach der Spaltung</text></g>
  <path d="M290 165 h28 v-12 l20 17 l-20 17 v-12 h-28z" fill="#9aa7b4"/>
  <!-- vorher -->
  <path d="M40 190 L128 190" stroke="#5b6b7a" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#pk)" fill="none"/>
  <g class="flug"><circle cx="42" cy="165" r="10" fill="#7c8aa0" stroke="#3d4a5c" stroke-width="2"/></g>
  <g class="wackel">
    <circle cx="205" cy="165" r="50" fill="url(#uran)" stroke="#8a6a10" stroke-width="3"/>
    <g fill="#d9a520" stroke="#8a6a10" stroke-width="1.2" opacity=".85"><circle cx="186" cy="146" r="9"/><circle cx="212" cy="140" r="9"/><circle cx="228" cy="160" r="9"/><circle cx="196" cy="170" r="9"/><circle cx="218" cy="186" r="9"/><circle cx="184" cy="192" r="9"/></g>
  </g>
  <!-- nachher -->
  <polygon class="stern" points="485,118 493,142 518,134 502,154 524,168 499,170 504,196 485,178 466,196 471,170 446,168 468,154 452,134 477,142" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>
  <text x="485" y="216" text-anchor="middle" font-size="14" font-weight="900" fill="#b45309">Energie</text>
  <g class="links"><circle cx="408" cy="158" r="32" fill="url(#t1)" stroke="#7c4a12" stroke-width="3"/></g>
  <g class="rechts"><circle cx="566" cy="158" r="27" fill="url(#t2)" stroke="#27506a" stroke-width="3"/></g>
  <ellipse cx="485" cy="254" rx="70" ry="24" fill="none" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#7c8aa0" stroke="#3d4a5c" stroke-width="2">
    <circle class="raus" cx="446" cy="252" r="9"/><circle class="raus r2" cx="485" cy="258" r="9"/><circle class="raus r3" cx="524" cy="252" r="9"/>
  </g>
  <!-- Buchstaben -->
  <g stroke="#1f5f99" stroke-width="2" fill="none"><path d="M42 122 L42 150"/><path d="M473 82 L420 128"/><path d="M497 82 L556 132"/><path d="M586 254 L556 254"/></g>
  <g font-size="19" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="42" cy="106" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="42" y="113">A</text>
    <circle cx="205" cy="84" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="205" y="91">B</text>
    <circle cx="485" cy="72" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="485" y="79">C</text>
    <circle cx="602" cy="254" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="602" y="261">D</text>
  </g>
</svg>
