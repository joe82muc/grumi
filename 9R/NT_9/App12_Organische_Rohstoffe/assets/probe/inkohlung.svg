<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .druck{animation:drueck 2.4s ease-in-out infinite}
    .d2{animation-delay:.8s}.d3{animation-delay:1.6s}
    @keyframes drueck{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(8px);opacity:1}}
    .glanz{animation:funkel 3s ease-in-out infinite}.g2{animation-delay:1.5s}
    @keyframes funkel{0%,100%{opacity:.15}50%{opacity:.9}}
    @media (prefers-reduced-motion: reduce){.druck,.glanz{animation:none;opacity:.8}}
  </style>
  <!-- Himmel und Sumpfwald -->
  <rect width="460" height="300" fill="#d8eefb"/>
  <rect y="58" width="460" height="22" fill="#6aa3a0"/>
  <g fill="#5b3b1f">
    <rect x="96" y="22" width="6" height="40"/><rect x="186" y="14" width="7" height="48"/><rect x="292" y="26" width="6" height="36"/><rect x="372" y="18" width="7" height="44"/>
  </g>
  <g fill="#3f8f3a">
    <ellipse cx="99" cy="22" rx="22" ry="12"/><ellipse cx="189" cy="14" rx="26" ry="12"/><ellipse cx="295" cy="26" rx="20" ry="11"/><ellipse cx="375" cy="18" rx="24" ry="12"/>
  </g>
  <g fill="#7a5a2a" opacity=".8"><path d="M140 70 l24 -6 l3 4 l-24 6z"/><path d="M330 72 l20 -8 l3 4 l-20 8z"/></g>
  <!-- Druck von oben durch neue Schichten -->
  <g fill="#1f5f99">
    <path class="druck" d="M150 40 h10 v10 h6 l-11 12 l-11 -12 h6z"/>
    <path class="druck d2" d="M240 40 h10 v10 h6 l-11 12 l-11 -12 h6z"/>
    <path class="druck d3" d="M330 40 h10 v10 h6 l-11 12 l-11 -12 h6z"/>
  </g>
  <!-- Schichten im Boden: A oben, B Mitte, C unten -->
  <rect y="80" width="460" height="54" fill="#8a6a3e"/>
  <g stroke="#6d5130" stroke-width="2" fill="none" opacity=".8">
    <path d="M70 96 q20 -6 40 0 t40 0"/><path d="M200 112 q20 -6 40 0 t40 0"/><path d="M320 98 q16 -5 32 0 t32 0"/><path d="M110 122 q14 -4 28 0 t28 0"/>
  </g>
  <rect y="134" width="460" height="12" fill="#bfae8f"/>
  <rect y="146" width="460" height="58" fill="#4e3620"/>
  <rect y="204" width="460" height="12" fill="#bfae8f"/>
  <rect y="216" width="460" height="84" fill="#1c1916"/>
  <g fill="#e9eef3">
    <circle class="glanz" cx="150" cy="248" r="2.5"/><circle class="glanz g2" cx="260" cy="270" r="2"/><circle class="glanz" cx="330" cy="238" r="2"/><circle class="glanz g2" cx="210" cy="232" r="1.8"/>
  </g>
  <!-- Pfeil: immer tiefer, mehr Druck und Wärme -->
  <line x1="40" y1="88" x2="40" y2="282" stroke="#fff" stroke-width="3"/>
  <path d="M32 278 L40 292 L48 278z" fill="#fff"/>
  <text x="22" y="186" transform="rotate(-90 22 186)" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">tiefer · älter · mehr Druck</text>
  <!-- Beschriftungen -->
  <g font-size="20" font-weight="900" fill="#fff" text-anchor="middle">
    <line x1="330" y1="107" x2="400" y2="107" stroke="#1f5f99" stroke-width="3"/><circle cx="420" cy="107" r="18" fill="#1f5f99"/><text x="420" y="114">A</text>
    <line x1="330" y1="175" x2="400" y2="175" stroke="#1f5f99" stroke-width="3"/><circle cx="420" cy="175" r="18" fill="#1f5f99"/><text x="420" y="182">B</text>
    <line x1="330" y1="258" x2="400" y2="258" stroke="#1f5f99" stroke-width="3"/><circle cx="420" cy="258" r="18" fill="#1f5f99"/><text x="420" y="265">C</text>
  </g>
</svg>
