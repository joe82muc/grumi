<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .weg{transform-box:fill-box;animation-timing-function:linear;animation-iteration-count:infinite}
    .samen{animation-name:samen;animation-duration:2.4s}
    @keyframes samen{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(34px);opacity:0}}
    .oel{animation-name:oel;animation-duration:2.4s}
    @keyframes oel{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(42px);opacity:0}}
    .diesel{animation-name:diesel;animation-duration:2.4s}
    @keyframes diesel{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(46px);opacity:0}}
    .runter{animation-name:runter;animation-duration:2.4s}
    @keyframes runter{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(26px);opacity:0}}
    .rein{animation-name:rein;animation-duration:2.4s}
    @keyframes rein{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(16px);opacity:0}}
    .blase{animation-name:blase;animation-duration:2s}
    @keyframes blase{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-22px);opacity:0}}
    .d2{animation-delay:-.8s}.d3{animation-delay:-1.6s}
    .presse{transform-box:fill-box;animation:presse 1.2s ease-in-out infinite alternate}
    @keyframes presse{from{transform:translateY(0)}to{transform:translateY(7px)}}
    @media (prefers-reduced-motion: reduce){.weg,.presse{animation:none}}
  </style>
  <rect width="460" height="300" fill="#f6faf3"/>
  <text x="14" y="24" font-size="15" font-weight="900" fill="#1f7a5a">Vom Raps zum Biodiesel</text>

  <!-- Rapsfeld -->
  <rect x="10" y="172" width="60" height="12" rx="3" fill="#7a5a32"/>
  <g stroke="#3f8a3a" stroke-width="3" stroke-linecap="round">
    <path d="M18 172 V128"/><path d="M32 172 V118"/><path d="M46 172 V124"/><path d="M60 172 V116"/>
  </g>
  <g fill="#f2c318" stroke="#c99a00" stroke-width="1">
    <circle cx="18" cy="124" r="7"/><circle cx="32" cy="114" r="7"/><circle cx="46" cy="120" r="7"/><circle cx="60" cy="112" r="7"/>
  </g>
  <g font-size="13" font-weight="800" fill="#24412b" text-anchor="middle"><text x="40" y="202">Raps</text><text x="40" y="218">vom Feld</text></g>

  <!-- Pfeile -->
  <g stroke="#1f7a5a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M74 140 H106"/><path d="M190 140 H232"/><path d="M318 140 H366"/>
    <path d="M152 180 V208"/><path d="M280 180 V208"/><path d="M280 66 V82"/>
  </g>
  <g fill="#1f7a5a">
    <path d="M106 132 L116 140 L106 148 Z"/><path d="M232 132 L242 140 L232 148 Z"/><path d="M366 132 L376 140 L366 148 Z"/>
    <path d="M144 206 L152 216 L160 206 Z"/><path d="M272 206 L280 216 L288 206 Z"/><path d="M272 80 L280 90 L288 80 Z"/>
  </g>
  <g font-size="12" font-weight="800" fill="#24412b" text-anchor="middle">
    <text x="94" y="125">Samen</text><text x="214" y="125">Rapsöl</text><text x="345" y="125">Biodiesel</text>
    <text x="280" y="58" font-size="13">+ Methanol</text>
  </g>

  <!-- wandernde Stoffe -->
  <g fill="#6b4a22">
    <circle class="weg samen" cx="76" cy="140" r="4"/><circle class="weg samen d2" cx="76" cy="140" r="4"/><circle class="weg samen d3" cx="76" cy="140" r="4"/>
  </g>
  <g fill="#e8b10b">
    <circle class="weg oel" cx="192" cy="140" r="5"/><circle class="weg oel d2" cx="192" cy="140" r="5"/><circle class="weg oel d3" cx="192" cy="140" r="5"/>
  </g>
  <g fill="#c98a12">
    <circle class="weg diesel" cx="320" cy="140" r="5"/><circle class="weg diesel d2" cx="320" cy="140" r="5"/><circle class="weg diesel d3" cx="320" cy="140" r="5"/>
  </g>
  <g fill="#8a6a3c"><rect class="weg runter" x="148" y="182" width="8" height="6" rx="2"/><rect class="weg runter d2" x="148" y="182" width="8" height="6" rx="2"/></g>
  <g fill="#cfd8e3" stroke="#8a99ab"><circle class="weg runter" cx="280" cy="186" r="4"/><circle class="weg runter d2" cx="280" cy="186" r="4"/></g>
  <g fill="#9fd3f0"><circle class="weg rein" cx="280" cy="66" r="4"/><circle class="weg rein d2" cx="280" cy="66" r="4"/></g>

  <!-- Station A -->
  <rect x="120" y="104" width="64" height="74" rx="12" fill="#ffffff" stroke="#1f7a5a" stroke-width="3"/>
  <rect class="presse" x="131" y="120" width="42" height="9" rx="2" fill="#7c8796"/>
  <g fill="#6b4a22"><circle cx="139" cy="141" r="3.5"/><circle cx="148" cy="143" r="3.5"/><circle cx="157" cy="141" r="3.5"/><circle cx="166" cy="143" r="3.5"/></g>
  <rect x="131" y="148" width="42" height="9" rx="2" fill="#7c8796"/>
  <path d="M143 162 h18 l-4 10 h-10 z" fill="#e8b10b"/>
  <circle cx="152" cy="102" r="16" fill="#1f5f99"/><text x="152" y="109" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">A</text>

  <!-- Station B -->
  <rect x="248" y="104" width="64" height="74" rx="12" fill="#ffffff" stroke="#1f7a5a" stroke-width="3"/>
  <rect x="259" y="124" width="42" height="46" rx="10" fill="#eef3f8" stroke="#7c8796" stroke-width="2"/>
  <rect x="261" y="146" width="38" height="22" rx="8" fill="#e8b10b"/>
  <g fill="#ffffff"><circle class="weg blase" cx="271" cy="164" r="3"/><circle class="weg blase d2" cx="281" cy="166" r="3"/><circle class="weg blase d3" cx="290" cy="163" r="3"/></g>
  <circle cx="280" cy="102" r="16" fill="#1f5f99"/><text x="280" y="109" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">B</text>

  <!-- Nebenprodukte -->
  <g font-size="13" font-weight="800" text-anchor="middle">
    <rect x="105" y="220" width="94" height="40" rx="10" fill="#efe3cf" stroke="#8a6a3c" stroke-width="2"/>
    <text x="152" y="237" fill="#4a3517">Rapsschrot</text><text x="152" y="253" fill="#4a3517" font-size="12" font-weight="700">(Tierfutter)</text>
    <rect x="233" y="220" width="94" height="40" rx="10" fill="#eef3f8" stroke="#8a99ab" stroke-width="2"/>
    <text x="280" y="237" fill="#2f3f52">Glycerin</text><text x="280" y="253" fill="#2f3f52" font-size="12" font-weight="700">(Kosmetik)</text>
  </g>

  <!-- Tankstelle -->
  <rect x="384" y="100" width="38" height="80" rx="6" fill="#1f7a5a"/>
  <rect x="390" y="108" width="26" height="18" rx="3" fill="#dff3e8"/>
  <path d="M422 116 h12 v40 a6 6 0 0 1 -12 0" fill="none" stroke="#24412b" stroke-width="4"/>
  <rect x="378" y="178" width="50" height="8" rx="3" fill="#24412b"/>
  <text x="406" y="204" font-size="13" font-weight="800" fill="#24412b" text-anchor="middle">Tankstelle</text>
</svg>
