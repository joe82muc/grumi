<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P2: Zoom in die Wand eines Kunststoffeimers – ein dichtes Gewirr aus Fäden; ein Faden wird hervorgehoben und als lange Kette aus vielen gleichen Perlen gezeigt. -->
  <style>
    .gewirr{opacity:.15;animation:gewirr 12s infinite}
    @keyframes gewirr{0%,54%{opacity:1}62%,95%{opacity:.15}100%{opacity:1}}
    .faden{opacity:0;animation:faden 12s infinite}
    @keyframes faden{0%,26%{opacity:1;stroke-width:5}32%,40%{opacity:1;stroke-width:8}48%,54%{opacity:1;stroke-width:5}62%,100%{opacity:0}}
    .perlen{animation:perlen 12s infinite} @keyframes perlen{0%,60%{opacity:0}64%,95%{opacity:1}100%{opacity:0}}
    .wackel{animation:wackel 1.6s ease-in-out infinite alternate}
    @keyframes wackel{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
    .lupe{transform-box:fill-box;transform-origin:center;animation:lupe 12s infinite}
    @keyframes lupe{0%,4%{transform:scale(1)}8%{transform:scale(1.35)}12%,100%{transform:scale(1)}}
    .zoom{animation:zoom 12s infinite} @keyframes zoom{0%,8%{opacity:0}12%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
