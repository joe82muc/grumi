<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P3: drei Verfahren der Kunststoffverarbeitung – A: Schmelze wird in eine Hohlform gepresst, die Form öffnet sich, eine Schüssel fällt heraus; B: ein Schlauch wird mit Druckluft zu einer großen Blase aufgeblasen und oben zwischen Walzen flach gedrückt; C: aus einer Düse wächst ein langes Rohr. -->
  <style>
    .fuell{transform-origin:138px 196px;animation:fuell 9s infinite}
    @keyframes fuell{0%,8%{transform:scaleY(0)}36%,100%{transform:none}}
    .formR{animation:formR 9s infinite}
    @keyframes formR{0%,42%{transform:none}54%,92%{transform:translateX(56px)}100%{transform:none}}
    .fall{animation:fall 9s infinite}
    @keyframes fall{0%,56%{transform:none;opacity:1}70%,92%{transform:translate(18px,64px);opacity:1}96%{transform:translate(18px,64px);opacity:0}100%{transform:none;opacity:0}}
    .blase{transform-origin:320px 250px;animation:blase 9s infinite}
    @keyframes blase{0%,4%{transform:scale(.24,.14)}56%,95%{transform:none}100%{transform:scale(.24,.14)}}
    .walze{animation:walze 9s infinite} @keyframes walze{0%,54%{opacity:0}58%,95%{opacity:1}100%{opacity:0}}
    .luft{animation:luft 1.5s linear infinite}
    @keyframes luft{0%{transform:translateY(20px);opacity:0}30%{opacity:.8}100%{transform:translateY(-60px);opacity:0}}
    .rohr{transform-origin:522px 140px;animation:rohr 9s infinite}
    @keyframes rohr{0%,4%{transform:scaleX(0)}60%,95%{transform:none}100%{transform:scaleX(0)}}
    .korn{animation:korn 1.2s linear infinite}
    @keyframes korn{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#f6f9fb"/>
  <rect x="10" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="110" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">A</text>
  <rect x="220" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="320" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">B</text>
  <rect x="430" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="530" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">C</text>
  <defs><clipPath id="p0"><rect x="10" y="40" width="200" height="252" rx="10"/></clipPath><clipPath id="p1"><rect x="220" y="40" width="200" height="252" rx="10"/></clipPath><clipPath id="p2"><rect x="430" y="40" width="200" height="252" rx="10"/></clipPath></defs>
  <g clip-path="url(#p0)">
    <rect x="18" y="146" width="46" height="22" fill="#8e98a1" stroke="#5f6870" stroke-width="2"/><rect x="22" y="152" width="40" height="10" fill="#3a8fd8" opacity=".85"/>
    <path d="M64 149 L76 154 L76 160 L64 165 Z" fill="#6b7781"/>
    <rect x="76" y="100" width="62" height="120" fill="#aab4bd" stroke="#5f6870" stroke-width="2"/>
    <rect x="76" y="154" width="28" height="6" fill="#4a545c"/>
    <path d="M102 126 H174 Q172 196 138 196 Q104 196 102 126 Z" fill="#4a545c"/>
    <g class="formR"><rect x="138" y="100" width="62" height="120" fill="#aab4bd" stroke="#5f6870" stroke-width="2"/><path d="M138 126 H174 Q172 196 138 196 Z" fill="#4a545c"/></g>
    <g class="fall"><path class="fuell" d="M102 126 H174 Q172 196 138 196 Q104 196 102 126 Z" fill="#3a8fd8" stroke="#1f6aa5" stroke-width="2"/></g>
    <line x1="106" y1="263" x2="206" y2="263" stroke="#59636b" stroke-width="3"/>
  </g>
  <g clip-path="url(#p1)">
    <g class="blase"><path d="M300 250 C282 222 268 190 268 150 V80 H372 V150 C372 190 358 222 340 250 Z" fill="#cfe8f7" fill-opacity=".75" stroke="#3a7fa8" stroke-width="2"/></g>
    <g fill="none" stroke="#3a7fa8" stroke-width="2.5" stroke-linecap="round" opacity=".8">
      <path class="luft" d="M302 210 v-16 m-5 5 l5 -5 l5 5"/><path class="luft" style="animation-delay:-.5s" d="M320 200 v-16 m-5 5 l5 -5 l5 5"/><path class="luft" style="animation-delay:-1s" d="M338 210 v-16 m-5 5 l5 -5 l5 5"/>
    </g>
    <g class="walze"><line x1="320" y1="62" x2="320" y2="40" stroke="#3a7fa8" stroke-width="4"/><path d="M272 80 L312 66 M368 80 L328 66" stroke="#3a7fa8" stroke-width="2"/><circle cx="308" cy="68" r="8" fill="#6b7781"/><circle cx="332" cy="68" r="8" fill="#6b7781"/></g>
    <rect x="288" y="250" width="64" height="12" rx="3" fill="#6b7781"/><rect x="310" y="262" width="20" height="30" fill="#8e98a1"/>
  </g>
  <g clip-path="url(#p2)">
    <g class="korn"><circle cx="460" cy="100" r="3" fill="#f6d16b" stroke="#b48a1c"/><circle cx="468" cy="95" r="3" fill="#f6d16b" stroke="#b48a1c"/><circle cx="476" cy="100" r="3" fill="#f6d16b" stroke="#b48a1c"/><circle cx="464" cy="106" r="3" fill="#f6d16b" stroke="#b48a1c"/><circle cx="472" cy="106" r="3" fill="#f6d16b" stroke="#b48a1c"/></g>
    <path d="M448 88 H488 L476 120 H460 Z" fill="#c3ccd3" fill-opacity=".7" stroke="#5f6870" stroke-width="2"/>
    <rect x="442" y="120" width="66" height="40" rx="4" fill="#aab4bd" stroke="#5f6870" stroke-width="2"/>
    <rect x="460" y="118" width="8" height="44" fill="#d35400"/><rect x="484" y="118" width="8" height="44" fill="#d35400"/>
    <rect x="508" y="116" width="14" height="48" fill="#6b7781"/>
    <g class="rohr"><rect x="522" y="127" width="104" height="26" fill="#f6d16b" stroke="#b48a1c" stroke-width="2"/><line x1="522" y1="133" x2="626" y2="133" stroke="#d9b24a" stroke-width="1.5"/></g>
    <g fill="#f6d16b" stroke="#b48a1c" stroke-width="2"><rect x="500" y="226" width="110" height="20" rx="3"/><rect x="500" y="250" width="110" height="20" rx="3"/></g>
    <g fill="#fff3c4" stroke="#b48a1c" stroke-width="2"><circle cx="484" cy="236" r="9"/><circle cx="484" cy="260" r="9"/></g>
    <g fill="#b48a1c"><circle cx="484" cy="236" r="4"/><circle cx="484" cy="260" r="4"/></g>
  </g>
</svg>
