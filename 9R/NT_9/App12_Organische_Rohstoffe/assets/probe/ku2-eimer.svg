<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P1: Eimer aus Holz, Blech und Kunststoff nacheinander auf einer Waage; Holz fault, Blech rostet, der Kunststoffeimer ist am leichtesten. -->
  <style>
    .g1{animation:g1 12s infinite}.g2{animation:g2 12s infinite}.g3{animation:g3 12s infinite}
    .s1{animation:s1 12s infinite}.s2{animation:s2 12s infinite}
    .z1{transform-origin:110px 252px;transform:rotate(62deg);animation:z1 12s infinite}
    .z2{transform-origin:320px 252px;transform:rotate(50deg);animation:z2 12s infinite}
    .z3{transform-origin:530px 252px;transform:rotate(-58deg);animation:z3 12s infinite}
    @keyframes g1{0%,1%{opacity:0}5%,95%{opacity:1}100%{opacity:0}} @keyframes g2{0%,29%{opacity:0}33%,95%{opacity:1}100%{opacity:0}} @keyframes g3{0%,57%{opacity:0}61%,95%{opacity:1}100%{opacity:0}} @keyframes s1{0%,18%{opacity:0}22%,95%{opacity:1}100%{opacity:0}} @keyframes s2{0%,46%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
    @keyframes z1{0%,6%{transform:rotate(0deg)}14%,100%{transform:rotate(62deg)}}
    @keyframes z2{0%,34%{transform:rotate(0deg)}42%,100%{transform:rotate(50deg)}}
    @keyframes z3{0%,62%{transform:rotate(0deg)}70%,100%{transform:rotate(-58deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="310" fill="#f6f9fb"/>
  <g class="g1">
    <text x="110" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">vor etwa 120 Jahren</text><text x="110" y="40" text-anchor="middle" font-size="13" fill="#566674">Holz</text>
    <path d="M63 91 Q110 18 157 91" fill="none" stroke="#5f6870" stroke-width="4"/><path d="M60 90 L160 90 L148 190 Q110 197 72 190 Z" fill="#c08a54" stroke="#7a5230" stroke-width="2.5"/><line x1="80" y1="90" x2="87.2" y2="190" stroke="#8a5c33" stroke-width="2"/><line x1="100" y1="90" x2="102.4" y2="190" stroke="#8a5c33" stroke-width="2"/><line x1="120" y1="90" x2="117.6" y2="190" stroke="#8a5c33" stroke-width="2"/><line x1="140" y1="90" x2="132.8" y2="190" stroke="#8a5c33" stroke-width="2"/><line x1="62.4" y1="110" x2="157.6" y2="110" stroke="#59636b" stroke-width="6"/><line x1="69.4" y1="168" x2="150.6" y2="168" stroke="#59636b" stroke-width="6"/><ellipse cx="110" cy="90" rx="50" ry="8" fill="#a8743f" stroke="#7a5230" stroke-width="2.5"/>
    <rect x="40" y="198" width="140" height="8" rx="3" fill="#5f6870"/>
    <rect x="44" y="206" width="132" height="56" rx="8" fill="#e3e9ee" stroke="#9aa9b5" stroke-width="2"/>
    <path d="M80 252 A30 30 0 0 1 140 252 Z" fill="#ffffff" stroke="#15212b" stroke-width="1.5"/>
    <text x="62" y="258" text-anchor="middle" font-size="10.5" fill="#3a4a57">leicht</text><text x="158" y="258" text-anchor="middle" font-size="10.5" fill="#3a4a57">schwer</text>
    <line class="z1" x1="110" y1="252" x2="110" y2="229" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="110" cy="252" r="3.5" fill="#15212b"/>
    <g class="s1"><ellipse cx="90" cy="150" rx="10" ry="7" fill="#4f5b2e" opacity=".78"/><ellipse cx="128" cy="126" rx="8" ry="6" fill="#4f5b2e" opacity=".78"/><ellipse cx="114" cy="174" rx="12" ry="5" fill="#4f5b2e" opacity=".78"/><ellipse cx="102" cy="112" rx="6" ry="4" fill="#4f5b2e" opacity=".78"/><text x="110" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4d1f">fault mit der Zeit</text></g>
  </g>
  <g class="g2">
    <text x="320" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">vor etwa 70 Jahren</text><text x="320" y="40" text-anchor="middle" font-size="13" fill="#566674">Blech</text>
    <path d="M273 91 Q320 18 367 91" fill="none" stroke="#5f6870" stroke-width="4"/><path d="M270 90 L370 90 L358 190 Q320 197 282 190 Z" fill="#c3ccd3" stroke="#7f8b95" stroke-width="2.5"/><line x1="275.1" y1="116" x2="364.9" y2="116" stroke="#96a2ab" stroke-width="3"/><line x1="278.5" y1="144" x2="361.5" y2="144" stroke="#96a2ab" stroke-width="3"/><line x1="281.6" y1="170" x2="358.4" y2="170" stroke="#96a2ab" stroke-width="3"/><ellipse cx="320" cy="90" rx="50" ry="8" fill="#dde3e8" stroke="#7f8b95" stroke-width="2.5"/>
    <rect x="250" y="198" width="140" height="8" rx="3" fill="#5f6870"/>
    <rect x="254" y="206" width="132" height="56" rx="8" fill="#e3e9ee" stroke="#9aa9b5" stroke-width="2"/>
    <path d="M290 252 A30 30 0 0 1 350 252 Z" fill="#ffffff" stroke="#15212b" stroke-width="1.5"/>
    <text x="272" y="258" text-anchor="middle" font-size="10.5" fill="#3a4a57">leicht</text><text x="368" y="258" text-anchor="middle" font-size="10.5" fill="#3a4a57">schwer</text>
    <line class="z2" x1="320" y1="252" x2="320" y2="229" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="320" cy="252" r="3.5" fill="#15212b"/>
    <g class="s2"><ellipse cx="300" cy="150" rx="10" ry="7" fill="#b4572b" opacity=".78"/><ellipse cx="338" cy="126" rx="8" ry="6" fill="#b4572b" opacity=".78"/><ellipse cx="324" cy="174" rx="12" ry="5" fill="#b4572b" opacity=".78"/><ellipse cx="312" cy="112" rx="6" ry="4" fill="#b4572b" opacity=".78"/><text x="320" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#9b4421">kann rosten</text></g>
  </g>
  <g class="g3">
    <text x="530" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">heute</text><text x="530" y="40" text-anchor="middle" font-size="13" fill="#566674">Kunststoff</text>
    <path d="M483 91 Q530 18 577 91" fill="none" stroke="#5f6870" stroke-width="4"/><path d="M480 90 L580 90 L568 190 Q530 197 492 190 Z" fill="#2f8fd8" stroke="#1f6aa5" stroke-width="2.5"/><path d="M494 102 L503 102 L508 178 L501 178 Z" fill="#ffffff" opacity=".35"/><ellipse cx="530" cy="90" rx="50" ry="8" fill="#6cb5ec" stroke="#1f6aa5" stroke-width="2.5"/>
    <rect x="460" y="198" width="140" height="8" rx="3" fill="#5f6870"/>
    <rect x="464" y="206" width="132" height="56" rx="8" fill="#e3e9ee" stroke="#9aa9b5" stroke-width="2"/>
    <path d="M500 252 A30 30 0 0 1 560 252 Z" fill="#ffffff" stroke="#15212b" stroke-width="1.5"/>
    <text x="482" y="258" text-anchor="middle" font-size="10.5" fill="#3a4a57">leicht</text><text x="578" y="258" text-anchor="middle" font-size="10.5" fill="#3a4a57">schwer</text>
    <line class="z3" x1="530" y1="252" x2="530" y2="229" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="530" cy="252" r="3.5" fill="#15212b"/>
    
  </g>
</svg>
