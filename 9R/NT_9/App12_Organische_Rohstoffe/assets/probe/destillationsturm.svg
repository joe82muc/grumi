<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" font-family="Arial, Helvetica, sans-serif">
  <style>
    .blase{fill:#d9d2c3;opacity:.85;animation:steig 3.2s linear infinite}
    .b2{animation-delay:.8s}.b3{animation-delay:1.6s}.b4{animation-delay:2.4s}
    @keyframes steig{0%{transform:translateY(0);opacity:0}10%{opacity:.85}90%{opacity:.6}100%{transform:translateY(-250px);opacity:0}}
    .flamme{transform-origin:210px 432px;animation:flacker .6s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(1)}to{transform:scaleY(1.18)}}
    @media (prefers-reduced-motion: reduce){.blase,.flamme{animation:none}}
  </style>
  <defs>
    <linearGradient id="thermo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d7263d"/><stop offset=".55" stop-color="#f4a259"/><stop offset="1" stop-color="#3a86c8"/></linearGradient>
  </defs>
  <rect width="420" height="460" fill="#f6f9fb"/>
  <!-- Thermometer -->
  <rect x="34" y="70" width="18" height="300" rx="9" fill="url(#thermo)" stroke="#5b6b7a" stroke-width="2"/>
  <circle cx="43" cy="382" r="16" fill="#d7263d" stroke="#5b6b7a" stroke-width="2"/>
  <text x="43" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#3a86c8">kühler</text>
  <text x="43" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#d7263d">heiß</text>
  <!-- Turm -->
  <rect x="150" y="40" width="120" height="340" rx="20" fill="#e3e8ed" stroke="#4a5866" stroke-width="4"/>
  <g stroke="#9aa7b4" stroke-width="3"><line x1="154" y1="120" x2="266" y2="120"/><line x1="154" y1="200" x2="266" y2="200"/><line x1="154" y1="280" x2="266" y2="280"/></g>
  <g class="blasen">
    <circle class="blase" cx="185" cy="360" r="7"/><circle class="blase b2" cx="215" cy="365" r="6"/>
    <circle class="blase b3" cx="240" cy="358" r="8"/><circle class="blase b4" cx="200" cy="362" r="5"/>
  </g>
  <!-- Entnahmestellen -->
  <g stroke="#4a5866" stroke-width="10" stroke-linecap="round"><line x1="270" y1="70" x2="330" y2="70"/><line x1="270" y1="160" x2="330" y2="160"/><line x1="270" y1="240" x2="330" y2="240"/><line x1="270" y1="360" x2="330" y2="360"/></g>
  <g font-size="22" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="360" cy="70" r="20" fill="#1f5f99"/><text x="360" y="78">A</text>
    <circle cx="360" cy="160" r="20" fill="#1f5f99"/><text x="360" y="168">B</text>
    <circle cx="360" cy="240" r="20" fill="#1f5f99"/><text x="360" y="248">C</text>
    <circle cx="360" cy="360" r="20" fill="#1f5f99"/><text x="360" y="368">D</text>
  </g>
  <!-- Erdöl rein und Ofen -->
  <path d="M60 330 H150" stroke="#2a2018" stroke-width="10"/>
  <text x="100" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2018">Erdöl</text>
  <rect x="160" y="392" width="100" height="22" rx="4" fill="#5b6b7a"/>
  <g class="flamme"><path d="M180 438 q10 -26 18 -8 q6 -22 14 -2 q8 -20 16 0 q6 -12 12 10z" fill="#f4a259"/><path d="M192 438 q8 -14 14 -2 q6 -12 12 2z" fill="#d7263d"/></g>
</svg>
