<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:12 7;animation:lauf 1.1s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-38}}
    @media (prefers-reduced-motion: reduce){.lauf{animation:none}}
  </style>
  <defs>
    <marker id="ps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b3fa0"/></marker>
  </defs>
  <rect width="640" height="340" fill="#f6f9fb"/>
  <!-- Strahler -->
  <rect x="18" y="130" width="56" height="80" rx="8" fill="#4a5866" stroke="#2c3742" stroke-width="2"/>
  <g transform="translate(46 170)">
    <circle r="16" fill="#ffd23f" stroke="#222" stroke-width="2"/>
    <g fill="#222"><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(90)"/><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(210)"/><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(330)"/></g>
    <circle r="4.4" fill="#ffd23f"/><circle r="2.4" fill="#222"/>
  </g>
  <text x="46" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3742">Strahler</text>
  <!-- geladene Platten -->
  <rect x="230" y="52" width="200" height="26" rx="4" fill="#f6b3ad" stroke="#c0392b" stroke-width="2"/>
  <rect x="230" y="262" width="200" height="26" rx="4" fill="#a9c9f5" stroke="#1f5f99" stroke-width="2"/>
  <g font-size="22" font-weight="900" text-anchor="middle">
    <text x="330" y="73" fill="#8e1b10" letter-spacing="14">+++++</text>
    <text x="330" y="282" fill="#123f6b" letter-spacing="16">−−−−−</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="330" y="40" fill="#8e1b10">positiv geladene Platte</text>
    <text x="330" y="310" fill="#123f6b">negativ geladene Platte</text>
  </g>
  <!-- Strahlen -->
  <g fill="none" stroke="#6b3fa0" stroke-width="6">
    <path class="lauf" d="M74 170 L230 170"/>
    <path class="lauf" d="M230 170 Q340 170 430 128 L586 55" marker-end="url(#ps)"/>
    <path class="lauf" d="M230 170 L586 170" marker-end="url(#ps)"/>
    <path class="lauf" d="M230 170 Q340 170 430 190 L586 225" marker-end="url(#ps)"/>
  </g>
  <!-- Nummern -->
  <g font-size="19" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="612" cy="44" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="612" y="51">1</text>
    <circle cx="612" cy="170" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="612" y="177">2</text>
    <circle cx="612" cy="232" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="612" y="239">3</text>
  </g>
</svg>
