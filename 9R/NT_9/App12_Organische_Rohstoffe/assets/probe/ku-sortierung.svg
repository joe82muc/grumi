<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe Kunststoffe (9M): Förderband mit Scanner. Eine Luftdüse bläst den Joghurtbecher, auf dem noch der
       Alu-Deckel klebt, in den Behälter „aussortiert“. Band läuft, Scannerlicht pulsiert, der Becher fliegt im Bogen. -->
  <style>
    .band{stroke-dasharray:14 12;animation:band 1s linear infinite}
    @keyframes band{to{stroke-dashoffset:-26}}
    .licht{animation:licht 1.6s ease-in-out infinite alternate}
    @keyframes licht{from{opacity:.25}to{opacity:.6}}
    .flug{animation:flug 2.6s ease-in infinite}
    @keyframes flug{0%{transform:translate(0,0) rotate(0deg);opacity:1}70%{transform:translate(78px,52px) rotate(70deg);opacity:1}100%{transform:translate(92px,92px) rotate(95deg);opacity:0}}
    .puff{animation:puff 1.2s ease-out infinite}
    @keyframes puff{from{transform:translate(0,0);opacity:.9}to{transform:translate(18px,-22px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.band,.licht,.flug,.puff{animation:none}}
  </style>
  <rect width="640" height="320" fill="#f6f9fb"/>
  <!-- Scanner -->
  <rect x="222" y="34" width="132" height="46" rx="8" fill="#33414d"/>
  <rect x="236" y="46" width="104" height="10" rx="5" fill="#8fd0f5"/>
  <polygon class="licht" points="250,80 326,80 380,200 196,200" fill="#ffd23f"/>
  <!-- Förderband -->
  <rect x="24" y="200" width="496" height="22" rx="11" fill="#46525c"/>
  <line class="band" x1="36" y1="203" x2="508" y2="203" stroke="#c9d2d8" stroke-width="4"/>
  <circle cx="36" cy="211" r="14" fill="#7d8a94" stroke="#33414d" stroke-width="2"/><circle cx="508" cy="211" r="14" fill="#7d8a94" stroke="#33414d" stroke-width="2"/>
  <rect x="60" y="222" width="12" height="70" fill="#7d8a94"/><rect x="470" y="222" width="12" height="70" fill="#7d8a94"/>
  <!-- Shampooflasche -->
  <g transform="translate(92 120)">
    <rect x="0" y="22" width="40" height="58" rx="10" fill="#2f6fdb" stroke="#1d4b9a" stroke-width="2"/>
    <rect x="12" y="6" width="16" height="18" rx="3" fill="#f2b632" stroke="#a87808" stroke-width="2"/>
    <rect x="8" y="40" width="24" height="20" rx="3" fill="#ffffff" opacity=".85"/>
  </g>
  <!-- Folie -->
  <path d="M236 196 Q256 170 276 190 Q296 210 316 184 Q330 170 344 192 L344 200 L236 200 Z" fill="#e3f3fb" stroke="#7d9bb0" stroke-width="2" opacity=".95"/>
  <!-- Joghurtbecher mit Alu-Deckel, fliegt in den Behälter -->
  <g class="flug" style="transform-box:fill-box;transform-origin:50% 50%">
    <g transform="translate(450 150)">
      <path d="M0 0 L44 0 L38 48 L6 48 Z" fill="#ffffff" stroke="#8a97a3" stroke-width="2"/>
      <rect x="6" y="14" width="32" height="18" rx="2" fill="#f2a6c8"/>
      <rect x="-3" y="-7" width="50" height="8" rx="2" fill="#c9d2d8" stroke="#7d8a94" stroke-width="2"/>
    </g>
  </g>
  <!-- Luftdüse -->
  <rect x="404" y="228" width="40" height="14" rx="4" fill="#566674"/>
  <g fill="#b9c3cb"><circle class="puff" cx="448" cy="228" r="6"/><circle class="puff" cx="452" cy="222" r="5" style="animation-delay:.4s"/><circle class="puff" cx="446" cy="218" r="4" style="animation-delay:.8s"/></g>
  <!-- Behälter -->
  <path d="M538 214 L626 214 L616 306 L548 306 Z" fill="#fbe3d6" stroke="#c0392b" stroke-width="3"/>
  <text x="582" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#a52a23">aussortiert:</text>
  <text x="582" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#a52a23">wird</text>
  <text x="582" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#a52a23">verbrannt</text>
</svg>
