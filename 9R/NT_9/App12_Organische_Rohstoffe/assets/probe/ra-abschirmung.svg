<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:12 7;animation:lauf 1.1s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-38}}
    @media (prefers-reduced-motion: reduce){.lauf{animation:none}}
  </style>
  <defs>
    <marker id="ps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker>
  </defs>
  <rect width="640" height="320" fill="#f6f9fb"/>
  <!-- Strahler -->
  <rect x="18" y="96" width="56" height="140" rx="8" fill="#4a5866" stroke="#2c3742" stroke-width="2"/>
  <g transform="translate(46 166)">
    <circle r="16" fill="#ffd23f" stroke="#222" stroke-width="2"/>
    <g fill="#222"><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(90)"/><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(210)"/><path d="M0 0L11.3 -6.5A13 13 0 0 1 11.3 6.5z" transform="rotate(330)"/></g>
    <circle r="4.4" fill="#ffd23f"/><circle r="2.4" fill="#222"/>
  </g>
  <text x="46" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3742">Strahler</text>
  <!-- Platten -->
  <rect x="246" y="56" width="7" height="214" fill="#fff3c4" stroke="#b89b3c" stroke-width="2"/>
  <rect x="376" y="56" width="16" height="214" fill="#cfd6dd" stroke="#6b7785" stroke-width="2"/>
  <rect x="498" y="56" width="50" height="214" fill="#5b6570" stroke="#2c3742" stroke-width="2"/>
  <g font-size="15" font-weight="800" fill="#15212b" text-anchor="middle">
    <text x="250" y="40">Papier</text><text x="384" y="40">Aluminium</text><text x="523" y="40">Blei</text>
  </g>
  <!-- Strahlen -->
  <g fill="none" stroke="#d9480f" stroke-width="6" stroke-linecap="butt">
    <path class="lauf" d="M74 106 L375 106"/>
    <path class="lauf" d="M74 166 L245 166"/>
    <path class="lauf" d="M74 226 L497 226"/>
    <path class="lauf" d="M498 226 L548 226" stroke="#f4a259" stroke-width="4"/>
    <path class="lauf" d="M549 226 L622 226" stroke-width="3" opacity=".6" marker-end="url(#ps)"/>
  </g>
  <text x="590" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b12">schwächer</text>
  <!-- Buchstaben -->
  <g font-size="19" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="124" cy="106" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="124" y="113">A</text>
    <circle cx="124" cy="166" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="124" y="173">B</text>
    <circle cx="124" cy="226" r="16" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="124" y="233">C</text>
  </g>
</svg>
