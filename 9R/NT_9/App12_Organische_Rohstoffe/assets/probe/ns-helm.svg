    .sf{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.4);animation:sf 8s infinite}
    @keyframes sf{0%,28%{transform:none;animation-timing-function:ease-out}36%,94%{transform:scaleY(.4)}100%{transform:none}}
    .g0{animation:g0 8s infinite}
    @keyframes g0{0%,30%{transform:none}32%{transform:translateY(9px)}34%{transform:translateY(-6px)}36%{transform:translateY(5px)}38%{transform:translateY(-2px)}40%,100%{transform:none}}
    .g1{animation:g1 8s infinite}
    @keyframes g1{0%,30%{transform:none}34%{transform:translateY(2px)}38%,100%{transform:none}}
    .knall{opacity:0;animation:knall 8s infinite} @keyframes knall{0%,28%{opacity:0}30%,38%{opacity:1}40%,100%{opacity:0}}
    .f0{transform-box:fill-box;transform-origin:50% 100%;animation:f0 8s infinite}
    @keyframes f0{0%,29%{transform:scaleY(0)}32%,94%{transform:none}100%{transform:scaleY(0)}}
    .f1{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.33);animation:f1 8s infinite}
    @keyframes f1{0%,27%{transform:scaleY(0)}36%,94%{transform:scaleY(.33)}100%{transform:scaleY(0)}}
    .b0{animation:b0 8s infinite} @keyframes b0{0%,33%{opacity:0}36%,94%{opacity:1}100%{opacity:0}}
    .b1{animation:b1 8s infinite} @keyframes b1{0%,35%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
