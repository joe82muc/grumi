<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P1: vier Versuche mit Kunststoffproben – Nagel ritzt eine Probe, Probe im Stromkreis mit Lämpchen (bleibt aus), vier Proben in Wasser (zwei schwimmen, zwei sinken), zwei Streifen in heißem Wasser (einer verbiegt sich). -->
  <style>
    .kratz{stroke-dasharray:82;stroke-dashoffset:0;animation:kratz 8s infinite}
    @keyframes kratz{0%,18%{stroke-dashoffset:82}60%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:82}}
    .nagel{transform:translate(122px,190px);animation:nagel 8s infinite}
    @keyframes nagel{0%,8%{transform:translate(44px,172px)}18%{transform:translate(44px,190px)}60%{transform:translate(122px,206px)}70%,100%{transform:translate(122px,190px)}}
    .probe2{animation:rein 8s infinite}
    @keyframes rein{0%,6%{transform:translateY(46px);opacity:0}10%{opacity:1}30%,95%{transform:none;opacity:1}100%{transform:translateY(46px);opacity:0}}
    .schwimm{animation:schwimm 8s infinite}
    @keyframes schwimm{0%,8%{transform:translateY(-74px)}22%{transform:translateY(36px)}42%,95%{transform:none}100%{transform:translateY(-74px)}}
    .sink{animation:sink 8s infinite}
    @keyframes sink{0%,8%{transform:translateY(-220px)}22%{transform:translateY(-110px)}42%,95%{transform:none}100%{transform:translateY(-220px)}}
    .zange{animation:zange 8s infinite}
    @keyframes zange{0%,6%{transform:translateY(-62px)}22%,95%{transform:none}100%{transform:translateY(-62px)}}
    .gerade{opacity:0;animation:gerade 8s infinite}.krumm{animation:krumm 8s infinite}
    @keyframes gerade{0%,44%{opacity:1}52%,100%{opacity:0}}
    @keyframes krumm{0%,44%{opacity:0}52%,95%{opacity:1}100%{opacity:0}}
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
    .dampf{animation:dampf 2.4s linear infinite}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="318" fill="#f6f9fb"/>
  <rect x="8" y="40" width="150" height="270" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="83" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Versuch 1</text>
  <rect x="166" y="40" width="150" height="270" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="241" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Versuch 2</text>
  <rect x="324" y="40" width="150" height="270" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="399" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Versuch 3</text>
  <rect x="482" y="40" width="150" height="270" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="557" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Versuch 4</text>
  <rect x="30" y="170" width="106" height="60" rx="8" fill="#a8dba1" stroke="#3f8a36" stroke-width="2"/>
  <path class="kratz" d="M44 190 L122 206" stroke="#f3fff1" stroke-width="3.5" stroke-linecap="round"/>
  <g class="nagel"><g transform="rotate(28)"><line x1="0" y1="-4" x2="0" y2="-80" stroke="#8e98a1" stroke-width="6" stroke-linecap="round"/><rect x="-13" y="-87" width="26" height="7" rx="2" fill="#6b7781"/><path d="M-3.2 -6 L0 2 L3.2 -6 Z" fill="#6b7781"/></g></g>
  <g fill="none" stroke="#3a4a57" stroke-width="3"><path d="M191 150 V101 H229"/><path d="M253 101 H291 V255 H270"/><path d="M214 255 H191 V196"/></g>
  <rect x="180" y="150" width="22" height="46" rx="3" fill="#e9c46a" stroke="#8d6e1c" stroke-width="2"/><rect x="186" y="145" width="10" height="6" fill="#8d6e1c"/>
  <text x="191" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4710">+</text>
  <rect x="229" y="95" width="24" height="12" rx="2" fill="#8e98a1"/>
  <circle cx="241" cy="78" r="17" fill="#eef1f3" stroke="#6b7781" stroke-width="2"/>
  <path d="M234 85 q3.5 -12 7 0 q3.5 -12 7 0" fill="none" stroke="#6b7781" stroke-width="1.5"/>
  <g class="probe2"><rect x="220" y="246" width="44" height="18" rx="3" fill="#f6d16b" stroke="#b48a1c" stroke-width="2"/></g>
  <path d="M210 248 L226 252 L226 258 L210 262 Z" fill="#2b3640"/>
  <path d="M274 248 L258 252 L258 258 L274 262 Z" fill="#2b3640"/>
  <path d="M348 140 H450 V282 Q450 294 438 294 H360 Q348 294 348 282 Z" fill="#cfe8ff"/>
  <line x1="348" y1="140" x2="450" y2="140" stroke="#7fb6e0" stroke-width="2"/>
  <g class="sink"><rect x="354" y="280" width="20" height="11" rx="2" fill="#cfe8f7" stroke="#3a7fa8" stroke-width="2"/></g>
  <g class="schwimm"><rect x="377" y="134" width="20" height="11" rx="2" fill="#a8dba1" stroke="#3f8a36" stroke-width="2"/></g>
  <g class="schwimm"><rect x="400" y="134" width="20" height="11" rx="2" fill="#f6d16b" stroke="#b48a1c" stroke-width="2"/></g>
  <g class="sink"><rect x="423" y="280" width="20" height="11" rx="2" fill="#efe9dc" stroke="#8d7f63" stroke-width="2"/></g>
  <path d="M346 92 V282 Q346 296 360 296 H438 Q452 296 452 282 V92" fill="none" stroke="#6b7781" stroke-width="3"/>
  <path d="M512 166 H602 V250 Q602 260 592 260 H522 Q512 260 512 250 Z" fill="#f7d6c6"/>
  <g fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round">
    <path class="dampf" d="M532 158 q6 -8 0 -16 q-6 -8 0 -16"/><path class="dampf" style="animation-delay:-.8s" d="M582 158 q6 -8 0 -16 q-6 -8 0 -16"/><path class="dampf" style="animation-delay:-1.6s" d="M557 158 q6 -8 0 -16 q-6 -8 0 -16"/>
  </g>
  <defs><clipPath id="v4"><rect x="482" y="40" width="150" height="270" rx="10"/></clipPath></defs>
  <g clip-path="url(#v4)"><g class="zange">
    <g class="gerade"><path d="M536 92 V212" stroke="#3a7fa8" stroke-width="12" stroke-linecap="round"/><path d="M536 92 V212" stroke="#cfe8f7" stroke-width="8" stroke-linecap="round"/></g>
    <g class="krumm" fill="none"><path d="M536 92 V172 Q536 204 562 214" stroke="#3a7fa8" stroke-width="12" stroke-linecap="round"/><path d="M536 92 V172 Q536 204 562 214" stroke="#cfe8f7" stroke-width="8" stroke-linecap="round"/></g>
    <path d="M580 92 V212" stroke="#8d7f63" stroke-width="12" stroke-linecap="round"/><path d="M580 92 V212" stroke="#efe9dc" stroke-width="8" stroke-linecap="round"/>
    <g fill="none" stroke="#59636b" stroke-width="3"><path d="M528 62 L536 96 L544 62"/><path d="M572 62 L580 96 L588 62"/></g>
  </g></g>
  <path d="M510 120 V250 Q510 262 522 262 H592 Q604 262 604 250 V120" fill="none" stroke="#6b7781" stroke-width="3"/>
  <line x1="500" y1="265" x2="614" y2="265" stroke="#59636b" stroke-width="3"/>
  <line x1="510" y1="265" x2="504" y2="302" stroke="#59636b" stroke-width="3"/><line x1="604" y1="265" x2="610" y2="302" stroke="#59636b" stroke-width="3"/>
  <path class="flamme" d="M557 268 Q570 282 557 292 Q544 282 557 268 Z" fill="#f39c12"/>
  <rect x="545" y="292" width="24" height="12" rx="2" fill="#6b7781"/>
</svg>
