<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .balken{transform-origin:150px 0;transform-box:fill-box;animation:wachse 1.6s ease-out both}
    .z2{animation-delay:.2s}.z3{animation-delay:.4s}.z4{animation-delay:.6s}.z5{animation-delay:.8s}
    @keyframes wachse{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.balken{animation:none}}
  </style>
  <rect width="480" height="300" fill="#f6f9fb"/>
  <text x="20" y="32" font-size="18" font-weight="900" fill="#15212b">Verwendung von Erdöl in Deutschland</text>
  <g font-size="16" font-weight="800" fill="#15212b">
    <text x="20" y="80">A</text><text x="20" y="128">B</text><text x="20" y="176">C</text>
    <text x="20" y="224" font-size="13">Chemische</text><text x="20" y="238" font-size="13">Industrie</text><text x="20" y="276" font-size="13">Sonstiges</text>
  </g>
  <g>
    <rect class="balken" x="150" y="60" width="245" height="30" rx="6" fill="#d7473a"/>
    <rect class="balken z2" x="150" y="108" width="203" height="30" rx="6" fill="#2b8be0"/>
    <rect class="balken z3" x="150" y="156" width="154" height="30" rx="6" fill="#f0a020"/>
    <rect class="balken z4" x="150" y="210" width="49" height="30" rx="6" fill="#7a4fc1"/>
    <rect class="balken z5" x="150" y="258" width="49" height="30" rx="6" fill="#6c757d"/>
  </g>
  <g font-size="16" font-weight="900" fill="#15212b">
    <text x="405" y="81">35 %</text><text x="363" y="129">29 %</text><text x="314" y="177">22 %</text><text x="209" y="231">7 %</text><text x="209" y="279">7 %</text>
  </g>
</svg>
