  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>

  <script>
  E9Seite(3, "g");
  Grammatik.seite({
    nr: 2, lsNr: 2, modul: "e9-u3-g8", kurz: "G8",
    titel: "Present perfect with for and since",
    lead: "„Mrs Mahlangu **has worked** at the hospital **for** twenty years.“ – Mit dem present perfect sagst du, was **früher begonnen hat und bis heute gilt**. Hier frischst du es auf.",
    ziele: ["Du bildest das present perfect mit have/has und dem Partizip.", "Du benutzt for (Zeitraum) und since (Zeitpunkt) richtig.", "Du unterscheidest present perfect und simple past und fragst mit How long …?"],
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Etwas hat <b>in der Vergangenheit begonnen</b> und gilt <b>auch jetzt noch</b>. Im Deutschen steht dafür die Gegenwart:</p>
        <div class="bsp">Palesa <b>has lived</b> in Durban for ten years. = Palesa wohnt seit zehn Jahren in Durban.</div>
        <div class="bsp">I <b>have known</b> Sandile since 2019. = Ich kenne Sandile seit 2019.</div>` },
      { t: "Die Bildung", html: `
        <p><b>have / has + Partizip</b> (he, she, it → has; alle anderen → have)</p>
        <p>Regelmäßig: Grundform + <b>-ed</b> – <i>live → lived, work → worked, play → played</i></p>
        <table><tr><th>Grundform</th><th>Partizip</th><th>Grundform</th><th>Partizip</th></tr>
        <tr><td>be</td><td><b>been</b></td><td>know</td><td><b>known</b></td></tr>
        <tr><td>have</td><td><b>had</b></td><td>teach</td><td><b>taught</b></td></tr>
        <tr><td>see</td><td><b>seen</b></td><td>go</td><td><b>gone</b></td></tr></table>
        <div class="bsp"><b>Verneinung:</b> She <b>hasn't seen</b> him since May. · We <b>haven't had</b> a test for weeks.</div>
        <div class="bsp"><b>Frage:</b> <b>Has</b> he <b>played</b> football for long? – Yes, he <b>has</b>. / No, he <b>hasn't</b>.</div>` },
      { t: "for und since", html: `
        <p><b>for</b> + <b>Zeitraum</b> (wie lange?) · <b>since</b> + <b>Zeitpunkt</b> (seit wann?)</p>
        <ul class="wb-liste"><li><b>for</b><span>three years · two weeks · an hour · a long time</span></li><li><b>since</b><span>2019 · Monday · April · last summer · 6 o'clock</span></li></ul>
        <div class="bsp">Sandile has been a volunteer <b>for</b> two years.</div>
        <div class="bsp">Sandile has been a volunteer <b>since</b> 2024.</div>` },
      { t: "How long …? und Abgrenzung zum simple past", html: `
        <div class="bsp"><b>How long</b> <b>has</b> Mrs Mahlangu <b>worked</b> at the hospital? – For twenty years. / Since 2006.</div>
        <p>Ist die Zeit <b>abgeschlossen</b> und steht eine Zeitangabe der Vergangenheit dabei, nimmst du das <b>simple past</b>:</p>
        <ul class="wb-liste"><li><b>last year</b><span>letztes Jahr</span></li><li><b>in 2019</b><span>im Jahr 2019</span></li><li><b>two days ago</b><span>vor zwei Tagen</span></li><li><b>yesterday</b><span>gestern</span></li></ul>
        <div class="bsp">Palesa <b>moved</b> to Durban <b>in 2015</b>. · She <b>has lived</b> there <b>since 2015</b>.</div>` }
    ],
    fallen: [
      "Im Deutschen sagt man „Ich kenne sie seit 2019“ – im Englischen steht dafür das present perfect: I **have known** her since 2019. Nicht: ~~I know her since 2019.~~",
      "**for** und **since** nicht verwechseln: for **three years**, but since **2021**. Nicht: ~~since three years~~.",
      "Mit einer abgeschlossenen Zeit (last year, in 2019, two days ago) steht das **simple past**: We **went** to Cape Town last year. Nicht: ~~We have gone to Cape Town last year.~~",
      "Das Partizip bleibt bei allen Personen gleich, nur have/has ändert sich: She **has** been ill. · They **have** been ill."
    ],
    basis: [
      { typ: "paare", t: "Welche Formen gehören zusammen? Verbinde Grundform und Partizip.",
        paare: [["be", "been"], ["know", "known"], ["teach", "taught"], ["see", "seen"], ["have", "had"], ["go", "gone"]] },
      { typ: "zuordnen", t: "for oder since? Ordne die Angaben zu.", tipp: "for → wie lange? (Zeitraum) · since → seit wann? (Zeitpunkt)",
        gruppen: ["for (Zeitraum)", "since (Zeitpunkt)"],
        karten: [["three years", 0], ["two weeks", 0], ["an hour", 0], ["a long time", 0], ["2019", 1], ["Monday", 1], ["last summer", 1], ["April", 1]] },
      { typ: "luecke", t: "for oder since?", tipp: "for + Zeitraum · since + Zeitpunkt",
        items: ["Palesa has lived in Durban {{for|since}} ten years.", "Sandile has played football {{since|for}} he was seven.", "We have known each other {{for|since}} a long time.",
                "My aunt has worked at the hospital {{since|for}} 2012."] },
      { typ: "luecke", t: "Setze das Partizip ein.", tipp: "be → been · know → known · teach → taught · work → worked",
        items: ["Sandile has [[been]] a volunteer for two years. (be)", "Mrs Mahlangu has [[taught]] maths since 2010. (teach)", "I [[have|'ve]] [[known]] Palesa for years. (know)",
                "She hasn't [[seen]] her cousin since March. (see)", "They have [[worked]] in the clinic for six months. (work)", "He [[hasn't|has not]] [[had]] a holiday for a long time. (have)"] },
      { typ: "luecke", t: "Present perfect oder simple past?", tipp: "Mit last year, in 2019 oder ago → simple past. Mit for oder since → present perfect.",
        items: ["Sandile {{was|has been}} ill two days ago.", "Mrs Mahlangu {{has worked|worked}} at the hospital since 2015.", "We {{went|have gone}} to Cape Town last summer.",
                "Palesa {{has had|had}} her phone since last year."] },
      { typ: "wahl", t: "Welcher Satz ist richtig?",
        items: [
          { s: "Wähle den richtigen Satz.", o: ["I have known her since 2019.", "I know her since 2019.", "I am knowing her since 2019."], a: 0 },
          { s: "Wähle den richtigen Satz.", o: ["She has lived here for three years.", "She has lived here since three years.", "She lives here since three years."], a: 0 },
          { s: "Wähle den richtigen Satz.", o: ["We went to Durban in 2022.", "We have gone to Durban in 2022.", "We have went to Durban in 2022."], a: 0 },
          { s: "How long has Sandile played the guitar?", o: ["He has played it for four years.", "He is playing it for four years.", "He has play it since four years."], a: 0 }
        ], mischen: true },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "hasn't / haven't + Partizip",
        items: [
          { s: "Sandile has played football for years.", l: ["Sandile hasn't played football for years.", "Sandile has not played football for years."] },
          { s: "They have lived there since 2020.", l: ["They haven't lived there since 2020.", "They have not lived there since 2020."] },
          { s: "I have seen Palesa today.", l: ["I haven't seen Palesa today.", "I have not seen Palesa today."] }
        ] },
      { typ: "bauen", t: "Baue die Fragen und Sätze.", tipp: "How long + have/has + Person + Partizip",
        items: [{ teile: ["How long", "has", "Mrs Mahlangu", "worked", "at the hospital?"] }, { teile: ["Have", "you", "known", "Palesa", "for a long time?"] },
                { teile: ["Palesa", "has", "lived", "in Durban", "since 2015."] }] },
      { typ: "frei", t: "Und du? Schreibe ein, zwei Sätze darüber, wie lange du schon etwas machst oder jemanden kennst.", tipp: "Zum Beispiel mit: I have played … for … / I have known … since …",
        items: [{ f: "Seit wann oder wie lange machst du etwas schon (Sport, Hobby, Schule)?", kriterien: ["ein vollständiger englischer Satz", "present perfect (have/has + Partizip)", "mit for oder since"],
                  muster: "\\b(have|has|'ve|haven't|hasn't)\\b", bsp: "I have played the guitar for two years." }] }
    ],
    plus: [
      { typ: "luecke", t: "Beim Arzt: Ergänze die Sätze (present perfect oder simple past).", tipp: "last week, ago und in + Jahr → simple past · for und since → present perfect",
        items: ["Palesa [[has been]] at the clinic since nine o'clock. (be)", "She [[hurt]] her arm two days ago. (hurt)", "How long [[has]] she [[had]] the pain? (have)",
                "The doctor [[has worked]] here for twelve years. (work)", "He [[came]] to the clinic in 2014. (come)"] },
      { typ: "umformen", t: "Schreibe den Satz mit dem present perfect.", tipp: "Aus der Gegenwart wird: have/has + Partizip + for/since.",
        items: [
          { s: "I know Sandile. (since 2019)", l: ["I have known Sandile since 2019.", "I've known Sandile since 2019."] },
          { s: "Palesa is a volunteer. (for two years)", l: ["Palesa has been a volunteer for two years."] }
        ] }
    ]
  });
  </script>
