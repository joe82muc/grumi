  <title>G7 · Past progressive | Englisch 9R</title>
  <meta name="description" content="Englisch 9R, Unit 3: das past progressive (was/were + -ing) und der Unterschied zwischen when und while, zum Beispiel bei einem kleinen Unfall.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>

  <script>
  E9Seite(3, "g");
  Grammatik.seite({
    nr: 1, lsNr: 1, modul: "e9-u3-g7", kurz: "G7",
    titel: "Past progressive",
    lead: "„I **was crossing** the road when a car **stopped**.“ – Mit dem past progressive sagst du, was in der Vergangenheit **gerade im Gange war**. Das brauchst du, wenn du einen Unfall oder einen Tag genau beschreibst.",
    ziele: ["Du bildest das past progressive mit was/were + -ing.", "Du verneinst und stellst Fragen.", "Du erklärst den Unterschied: lange Handlung (past progressive) und kurze Handlung (simple past) – und wählst when oder while."],
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Du erzählst von etwas, das zu einem bestimmten Zeitpunkt in der Vergangenheit <b>gerade lief</b> – es hatte schon angefangen und war noch nicht fertig.</p>
        <div class="bsp">At six o'clock Palesa <b>was waiting</b> at the bus stop. (Sie war mitten im Warten.)</div>
        <div class="bsp">What <b>were</b> you <b>doing</b> at eight? – I <b>was doing</b> my homework.</div>` },
      { t: "Die Bildung", html: `
        <p><b>was / were + Verb mit -ing</b></p>
        <table><tr><th>Person</th><th>Form</th></tr>
        <tr><td>I, he, she, it</td><td><b>was</b> walking</td></tr>
        <tr><td>you, we, they</td><td><b>were</b> walking</td></tr></table>
        <p>Schreibung der -ing-Form:</p>
        <ul class="wb-liste"><li><b>run → running</b><span>Endkonsonant verdoppeln</span></li><li><b>sit → sitting</b><span>Endkonsonant verdoppeln</span></li>
        <li><b>make → making</b><span>stummes -e fällt weg</span></li><li><b>write → writing</b><span>stummes -e fällt weg</span></li>
        <li><b>lie → lying</b><span>-ie wird zu -y</span></li><li><b>play → playing</b><span>einfach -ing anhängen</span></li></ul>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>wasn't / weren't + -ing:</b> Sandile <b>wasn't looking</b> at the road. · They <b>weren't running</b>.</div>
        <div class="bsp"><b>Was / Were + Person + -ing:</b> <b>Was</b> she <b>carrying</b> a bag? – Yes, she <b>was</b>. / No, she <b>wasn't</b>.</div>
        <div class="bsp"><b>Mit Fragewort:</b> What <b>were</b> they <b>doing</b>? Where <b>was</b> he <b>going</b>?</div>
        <p>Kein <i>did</i> – du brauchst nur was oder were.</p>` },
      { t: "when und while", html: `
        <p>Meist läuft eine <b>lange Handlung</b> (past progressive), und eine <b>kurze Handlung</b> (simple past) unterbricht sie.</p>
        <div class="bsp">Palesa <b>was crossing</b> the road <b>when</b> a car <b>stopped</b>.</div>
        <div class="bsp"><b>While</b> Mrs Mahlangu <b>was talking</b> to the driver, a police officer <b>arrived</b>.</div>
        <p><b>when</b> steht meist vor der <b>kurzen</b> Handlung (simple past), <b>while</b> vor der <b>langen</b> (past progressive).</p>
        <p>Zwei lange Handlungen, die <b>gleichzeitig</b> liefen, verbindest du mit while:</p>
        <div class="bsp">Sandile <b>was cooking</b> <b>while</b> his sister <b>was doing</b> her homework.</div>` }
    ],
    fallen: [
      "Das **-ing** darf nicht fehlen und **was/were** auch nicht: Sandile was **running**. Nicht: ~~Sandile was run.~~ und nicht: ~~Sandile running.~~",
      "Zu **I, he, she, it** gehört **was**, zu **you, we, they** gehört **were**: They **were** waiting. Nicht: ~~They was waiting.~~",
      "Die kurze Handlung, die dazwischenkommt, steht im **simple past**: I was walking home when it **started** to rain. Nicht: ~~when it was start to rain.~~",
      "Auf Fragen mit was/were antwortest du auch mit was/were: Were you sleeping? – No, I **wasn't**. Nicht: ~~No, I didn't.~~"
    ],
    basis: [
      { typ: "zuordnen", t: "Past progressive oder simple past? Ordne die Formen zu.", tipp: "was/were + -ing → past progressive. Die anderen Formen sind simple past.",
        gruppen: ["past progressive (lange Handlung)", "simple past (kurze Handlung)"],
        karten: [["was walking", 0], ["were waiting", 0], ["was raining", 0], ["was talking", 0], ["stopped", 1], ["fell", 1], ["rang", 1], ["arrived", 1]] },
      { typ: "luecke", t: "Schreibe die -ing-Form richtig.", tipp: "run → running · make → making · lie → lying",
        items: ["Palesa was [[running]] to the bus stop. (run)", "Sandile was [[making]] a sandwich. (make)", "The dog was [[lying]] in the sun. (lie)",
                "We were [[sitting]] in the waiting room. (sit)", "Mrs Mahlangu was [[writing]] a short report. (write)"] },
      { typ: "luecke", t: "Setze die Verben ein: die lange Handlung im past progressive, die kurze im simple past.", tipp: "lange Handlung: was/were + -ing · kurze Handlung: simple past",
        items: ["Palesa [[was crossing]] the road when a car [[stopped]]. (cross / stop)", "Sandile [[was talking]] on the phone when the bus [[arrived]]. (talk / arrive)",
                "While we [[were waiting]] at the bus stop, it [[started]] to rain. (wait / start)", "A man [[was carrying]] a big box when he [[fell]] over. (carry / fall)"] },
      { typ: "luecke", t: "when oder while?", tipp: "when + kurze Handlung (simple past) · while + lange Handlung (past progressive)",
        items: ["Palesa was shopping {{when|while}} she heard a loud noise.", "They were having lunch {{when|while}} the phone rang."] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "wasn't / weren't + -ing",
        items: [
          { s: "Sandile was watching TV.", l: ["Sandile wasn't watching TV.", "Sandile was not watching TV."] },
          { s: "The children were playing outside.", l: ["The children weren't playing outside.", "The children were not playing outside."] },
          { s: "I was listening to the teacher.", l: ["I wasn't listening to the teacher.", "I was not listening to the teacher."] }
        ] },
      { typ: "bauen", t: "Baue die Sätze und Fragen.", tipp: "(Fragewort) + was/were + Person + -ing",
        items: [{ teile: ["What", "were", "you", "doing", "at eight o'clock?"] }, { teile: ["Was", "Palesa", "waiting", "for the bus?"] },
                { teile: ["Palesa", "was reading", "while", "Sandile", "was cooking."], l: ["While Sandile was cooking, Palesa was reading."] }] },
      { typ: "markieren", t: "Markiere die lange Handlung blau und die kurze Handlung orange.", stifte: [["b", "lange Handlung"], ["o", "kurze Handlung"]], tipp: "Die lange Handlung steht im past progressive, die kurze im simple past.",
        items: ["Palesa [b:was crossing] the road when a car [o:stopped].", "While Sandile [b:was cycling] home, his phone [o:rang].", "Mrs Mahlangu [b:was talking] to a witness when the ambulance [o:arrived]."] },
      { typ: "wahl", t: "Wähle die richtige Antwort.",
        items: [
          { s: "Which sentence is correct?", o: ["Sandile was running for the bus.", "Sandile was run for the bus.", "Sandile were running for the bus."], a: 0 },
          { s: "What were you doing at eight o'clock?", o: ["I was doing my homework.", "I did doing my homework.", "I were doing my homework."], a: 0 },
          { s: "Was Palesa waiting outside?", o: ["Yes, she was.", "Yes, she did.", "Yes, she were."], a: 0 },
          { s: "Which sentence is correct?", o: ["A police officer arrived while we were talking.", "A police officer was arrive while we were talking.", "A police officer arrived while we was talking."], a: 0 }
        ], mischen: true },
      { typ: "frei", t: "Und du? Schreibe ein, zwei Sätze darüber, was du gestern um acht Uhr abends gemacht hast.", tipp: "Zum Beispiel mit: At eight o'clock yesterday I was …",
        items: [{ f: "Was hast du gestern um acht Uhr abends gerade gemacht?", kriterien: ["ein vollständiger englischer Satz", "das Verb steht im past progressive (was/were + -ing)"],
                  muster: "\\b(was|were)\\s+[a-z]+ing\\b", bsp: "At eight o'clock yesterday I was watching a film with my brother." }] }
    ],
    plus: [
      { typ: "luecke", t: "Ein kleiner Unfall: Setze die Verben im past progressive oder simple past ein.", tipp: "Was lief gerade? → was/were + -ing. Was passierte plötzlich? → simple past.",
        items: ["It [[was raining]] and Palesa [[was walking]] to school. (rain / walk)", "A boy [[was riding]] his bike very fast when he [[hit]] a bin. (ride / hit)",
                "Sandile [[saw]] the accident because he [[was standing]] at the corner. (see / stand)", "The police officer [[wasn't|was not]] writing when I [[arrived]]. (not write / arrive)",
                "While two nurses [[were helping]] the boy, Mrs Mahlangu [[called|phoned|rang]] his mother. (help / call)"] },
      { typ: "umformen", t: "Verbinde die Sätze mit when oder while. Beginne mit dem ersten Satz.", tipp: "Eine lange Handlung (past progressive) und eine kurze Handlung (simple past).",
        items: [
          { s: "Palesa was cycling to the hospital. A dog ran across the road. (when)", l: ["Palesa was cycling to the hospital when a dog ran across the road."] },
          { s: "Sandile was sitting in the waiting room. His mother was talking to the doctor. (while)", l: ["Sandile was sitting in the waiting room while his mother was talking to the doctor."] }
        ] }
    ]
  });
  </script>
