  <script>
  E9Seite(3, "w");
  Grammatik.seite({
    nr: 2, lsNr: 4, modul: "e9-u3-w2", kurz: "WB2",
    titel: "Describing a role model",
    lead: "Wen **bewunderst** du – und warum? Hier lernst du **Eigenschaften**, sagst, was ein **Vorbild** tut, und erzählst mit **for** und **since**, wie lange etwas schon so ist.",
    ziele: ["Du beschreibst eine Person mit passenden Eigenschaften.", "Du sagst, warum du jemanden bewunderst.", "Du erzählst den Lebensweg mit present perfect, for und since."],
    merk: [
      { t: "Qualities", html: `
        <ul class="wb-liste"><li><b>brave</b><span>mutig</span></li><li><b>reliable</b><span>zuverlässig</span></li><li><b>patient</b><span>geduldig</span></li><li><b>generous</b><span>großzügig</span></li>
        <li><b>honest</b><span>ehrlich</span></li><li><b>hard-working</b><span>fleißig</span></li><li><b>modest</b><span>bescheiden</span></li><li><b>determined</b><span>entschlossen</span></li></ul>` },
      { t: "What role models do", html: `
        <ul class="wb-liste"><li><b>to help · to support</b><span>helfen · unterstützen</span></li><li><b>to stand up for</b><span>eintreten für</span></li><li><b>to give up</b><span>aufgeben</span></li>
        <li><b>to inspire</b><span>inspirieren</span></li><li><b>to achieve</b><span>erreichen</span></li><li><b>to set an example</b><span>ein Vorbild sein</span></li></ul>` },
      { t: "Admiring and explaining", html: `
        <div class="bsp"><b>I admire</b> my coach <b>because</b> she never gives up.</div>
        <div class="bsp"><b>I look up to</b> my grandfather. · <b>She has always</b> stood up for weaker children.</div>
        <div class="bsp"><b>What I have learned from him is</b> to be patient. · <b>That's why I respect her.</b></div>` },
      { t: "A life story", html: `
        <ul class="wb-liste"><li><b>to grow up</b><span>aufwachsen</span></li><li><b>to found</b><span>gründen</span></li><li><b>to win</b><span>gewinnen</span></li><li><b>since then</b><span>seitdem</span></li></ul>
        <div class="bsp">She has lived in Durban <b>for</b> ten years. · He has played football <b>since</b> 2015.</div>
        <p><b>for</b> + Zeitraum (for ten years), <b>since</b> + Zeitpunkt (since 2015). Dazu: <b>present perfect</b> = have / has + Partizip.</p>
        <p>Alle Wörter und Sätze trainierst du im <a href="../vokabular/wordbank-describing-a-role-model.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**for** oder **since**? **for** nennt, wie lange: for **three years**. **since** nennt, seit wann: since **2020**, since **I was six**.",
      "**honest** spricht man ohne h: „onnest“. Und **modest** heißt „bescheiden“, nicht „modisch“.",
      "**role model** heißt „Vorbild“ (eine Person, an der man sich orientiert) – nicht „Modell“ im Sinne von Mannequin. Und **to look up to** heißt „aufschauen zu“: I **look up to** her."
    ],
    basis: [
      { typ: "zuordnen", t: "Eigenschaft oder Tätigkeit? Sortiere die Wörter.", gruppen: ["🌟 Qualities", "🏃 What role models do"],
        karten: [["brave", 0], ["reliable", 0], ["patient", 0], ["honest", 0], ["modest", 0], ["to help", 1], ["to support", 1], ["to inspire", 1], ["to achieve", 1], ["to stand up for", 1]] },
      { typ: "paare", t: "Verbinde Englisch und Deutsch.",
        paare: [["role model", "Vorbild"], ["to admire", "bewundern"], ["hard-working", "fleißig"], ["determined", "entschlossen"], ["generous", "großzügig"], ["to grow up", "aufwachsen"]] },
      { typ: "wahl", t: "Welche Eigenschaft passt?", mischen: true,
        items: [
          { f: "She always tells the truth. She is …", o: ["honest", "generous", "patient"], a: 0 },
          { f: "He gives a lot of money to poor families. He is very …", o: ["generous", "modest", "determined"], a: 0 },
          { f: "She works from early morning until late at night. She is …", o: ["hard-working", "modest", "patient"], a: 0 },
          { f: "He never talks about his own success. He is …", o: ["modest", "brave", "generous"], a: 0 },
          { f: "You can always count on her. She is …", o: ["reliable", "famous", "creative"], a: 0 },
          { f: "He was not afraid to jump into the river to save the child. He was …", o: ["brave", "modest", "patient"], a: 0 }
        ] },
      { typ: "bauen", t: "Bringe den Lebensweg in die richtige Reihenfolge.", tipp: "Achte auf Later und Since then.",
        items: [{ teile: ["Mr Zulu grew up in a small village.", "As a boy he loved football.", "At twenty he started a team for children.", "Later he founded a sports club.", "Since then he has helped hundreds of children."] }] },
      { typ: "luecke", t: "for oder since? Wähle das richtige Wort.",
        items: ["She has lived in Durban {{since|for}} 2010.", "He has been a teacher {{for|since}} twenty years.", "Nandi has played the guitar {{since|for}} she was six.",
                "They have helped the village {{for|since}} many years.", "Luyanda has wanted to be a nurse {{since|for}} she was a little girl."] },
      { typ: "luecke", t: "Setze das Verb ins present perfect.", tipp: "have / has + Partizip. Unregelmäßig: give – given, win – won, know – known.",
        items: ["She [[has helped]] (help) many children in her life.", "He [[has never given]] (never give) up.", "They [[have won]] (win) three prizes since 2018.",
                "I [[have known]] (know) her since I was a child.", "She [[hasn't missed|has not missed]] (not miss) a day of training since January."] },
      { typ: "paare", t: "Welche Satzhälften gehören zusammen?",
        paare: [["I admire my coach because …", "she never gives up."], ["What I have learned from him is …", "to believe in myself."], ["She has always …", "stood up for weaker children."],
                ["I look up to my grandfather because …", "he has worked hard all his life."], ["I would like to be …", "as brave as she is."]] }
    ],
    plus: [
      { typ: "luecke", t: "Beschreibe dein Vorbild: Ergänze die fehlenden Wörter.", tipp: "Wörter aus dem Merkwissen: admire, look, learned, always, respect",
        items: ["I {{admire|admires|admiring}} my aunt because she is so brave.", "I {{look|see|watch}} up to her.", "What I have {{learned|learn|learning}} from her is to be patient.", "She has {{always|since|ago}} helped other people.", "That is why I {{respect|respects|respecting}} her."] },
      { typ: "frei", t: "Beschreibe ein Vorbild in zwei bis drei Sätzen: Wer ist es, und warum bewunderst du die Person?", tipp: "My role model is … · I admire … because … · She/He has always …",
        items: [{ f: "Dein Vorbild:", kriterien: ["zwei bis drei englische Sätze", "mindestens eine Eigenschaft", "ein Grund mit because oder ein Satz im present perfect"],
                  muster: "\\b(has|have|hasn't|haven't)\\b[\\s\\S]*\\b(brave|reliable|patient|generous|honest|hard-working|modest|determined|kind|strong|confident|creative)\\b|\\b(brave|reliable|patient|generous|honest|hard-working|modest|determined|kind|strong|confident|creative)\\b[\\s\\S]*\\b(has|have|hasn't|haven't|because)\\b",
                  bsp: "My role model is my uncle. I admire him because he is hard-working and honest. He has helped our family for many years." }] }
    ]
  });
  </script>
