  <script>
  E9Seite(3, "w");
  Grammatik.seite({
    nr: 1, lsNr: 2, modul: "e9-u3-w1", kurz: "WB1",
    titel: "Talking about an accident",
    lead: "Es ist etwas passiert – und du musst davon berichten? Hier lernst du die Wörter für **Unfall**, **Verletzung** und **Hilfe** und wie du sagst, **was du gerade getan hast, als es passierte**.",
    ziele: ["Du sagst, was bei einem Unfall passiert ist.", "Du benennst die Menschen am Unfallort und die Hilfe.", "Du berichtest mit „I was … when …“ und beantwortest Fragen der Polizei."],
    merk: [
      { t: "What happened?", html: `
        <ul class="wb-liste"><li><b>accident</b><span>Unfall</span></li><li><b>to crash into</b><span>zusammenstoßen mit</span></li><li><b>to slip · to skid</b><span>ausrutschen · schleudern</span></li>
        <li><b>to fall off</b><span>herunterfallen von</span></li><li><b>to brake</b><span>bremsen</span></li><li><b>to trip over</b><span>stolpern über</span></li><li><b>to hit</b><span>treffen; anfahren</span></li></ul>` },
      { t: "Where? Who?", html: `
        <ul class="wb-liste"><li><b>crossing · junction</b><span>Überweg · Kreuzung</span></li><li><b>pavement</b><span>Gehweg</span></li><li><b>traffic lights</b><span>Ampel</span></li><li><b>corner · lane</b><span>Ecke · Fahrspur</span></li>
        <li><b>witness</b><span>Zeuge</span></li><li><b>driver · cyclist · pedestrian</b><span>Fahrer · Radfahrer · Fußgänger</span></li><li><b>police officer · paramedic</b><span>Polizist · Rettungssanitäter</span></li></ul>` },
      { t: "Injuries and help", html: `
        <ul class="wb-liste"><li><b>injured</b><span>verletzt</span></li><li><b>to bleed</b><span>bluten</span></li><li><b>bruise</b><span>blauer Fleck</span></li><li><b>to break</b><span>sich etwas brechen</span></li>
        <li><b>ambulance</b><span>Krankenwagen</span></li><li><b>first aid</b><span>Erste Hilfe</span></li><li><b>plaster · bandage</b><span>Pflaster · Verband</span></li><li><b>to call the police</b><span>die Polizei rufen</span></li></ul>` },
      { t: "Reporting and asking", html: `
        <div class="bsp"><b>I was crossing</b> the road <b>when</b> a car came round the corner.</div>
        <div class="bsp"><b>While</b> I <b>was waiting</b>, I saw the accident. · <b>It happened at</b> half past four. · <b>Nobody was hurt.</b></div>
        <div class="bsp"><b>What happened?</b> · <b>Can you describe</b> the car? · <b>Did you see anything?</b></div>
        <p>Was gerade im Gange war, steht im <b>past progressive</b> (was / were + -ing). Was dazwischenkam, steht im <b>simple past</b>.</p>
        <p>Alle Wörter und Sätze trainierst du im <a href="../vokabular/wordbank-talking-about-an-accident.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**injured** oder **hurt**? Beides heißt „verletzt“: Two people were **injured**. Nobody was **hurt**. Mit „Nobody“ sagt man meist **hurt**.",
      "Nach **when** und **while** steht im Bericht die Handlung, die dazwischenkam bzw. andauerte: I **was waiting** when the car **crashed**. Nicht: ~~I waited when …~~ für eine lange Handlung.",
      "**witness** ist die Person, die etwas gesehen hat – nicht „Zeugnis“. Ein Zeugnis heißt **report**."
    ],
    basis: [
      { typ: "zuordnen", t: "Menschen oder Verletzung und Hilfe? Sortiere die Wörter.", gruppen: ["👥 People", "🚑 Injuries and help"],
        karten: [["witness", 0], ["driver", 0], ["cyclist", 0], ["pedestrian", 0], ["police officer", 0], ["paramedic", 0], ["bandage", 1], ["ambulance", 1], ["first aid", 1], ["plaster", 1], ["bruise", 1]] },
      { typ: "paare", t: "Verbinde Englisch und Deutsch.",
        paare: [["to slip", "ausrutschen"], ["to brake", "bremsen"], ["witness", "Zeuge"], ["pavement", "Gehweg"], ["bruise", "blauer Fleck"], ["injured", "verletzt"]] },
      { typ: "wahl", t: "Welche Form oder welches Wort passt?", mischen: true,
        items: [
          { f: "We … at the traffic lights when we heard a loud crash.", o: ["were waiting", "was waiting", "are waiting"], a: 0 },
          { f: "The cyclist … on the pavement when he hit a stone.", o: ["was riding", "were riding", "rides"], a: 0 },
          { f: "A … saw the accident and told the police what happened.", o: ["witness", "paramedic", "plaster"], a: 0 },
          { f: "The road was wet and …, so the bus skidded.", o: ["slippery", "injured", "patient"], a: 0 },
          { f: "The ambulance came, and the … put a bandage on his arm.", o: ["paramedic", "pavement", "crossing"], a: 0 }
        ] },
      { typ: "bauen", t: "Bringe den Bericht in die richtige Reihenfolge.", tipp: "Achte auf Suddenly, but, Luckily.",
        items: [{ teile: ["At half past four Nandi was walking home.", "Suddenly a bike came round the corner.", "Nandi jumped aside, but she slipped on the wet pavement.", "A passer-by called an ambulance.", "Luckily nobody was hurt."] }] },
      { typ: "luecke", t: "Wähle das passende Wort.",
        items: ["He fell off his bike and got a big {{bruise|ambulance}} on his leg.", "The driver braked hard, but the car {{crashed|fell}} into a wall.",
                "The police officer asked the {{witness|bandage}} what she saw.", "{{Nobody|Somebody}} was hurt, so we didn't need an ambulance.",
                "Please call an {{ambulance|accident}} – he is injured!", "Can you {{describe|admire}} the car, please?"] },
      { typ: "luecke", t: "Setze das Verb ins past progressive oder simple past.", tipp: "Was gerade lief: was / were + -ing. Was dazwischenkam: simple past.",
        items: ["Mr Zulu [[was driving]] (drive) home when a dog [[ran]] (run) onto the road.", "We [[were waiting]] (wait) at the traffic lights when the crash [[happened]] (happen).",
                "Nandi [[wasn't looking|was not looking]] (not look) when the ball hit her.", "What [[were]] you doing when the accident happened?",
                "While the paramedic [[was helping]] (help) the driver, the police officer talked to the witnesses."] },
      { typ: "paare", t: "Frage und Antwort: Was passt zusammen?",
        paare: [["What happened?", "A car crashed into a wall."], ["Can you describe the car?", "It was small and red."], ["Did you see anything?", "Yes, I saw a cyclist fall off his bike."],
                ["Was anybody hurt?", "No, nobody was hurt."], ["What were you doing when it happened?", "I was waiting at the traffic lights."]] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Unfallbericht: Ergänze die fehlenden Wörter.", tipp: "Wörter aus dem Merkwissen: witness, injured, ambulance, police, first aid",
        items: ["I saw the accident, so I was a {{witness|bandage|pavement}}.", "A cyclist was {{injured|slippery|careful}} and his arm was bleeding.", "A passer-by called an {{ambulance|accident|aid}}.", "Somebody else called the {{police|plaster|pavement}}.",
                "I knew some {{first aid|traffic lights|bruise}}, so I helped the cyclist until the paramedic arrived."] },
      { typ: "frei", t: "Berichte in zwei bis drei Sätzen von einem Unfall – wirklich oder erfunden.", tipp: "I was … when … · While I was …, … · Luckily nobody was hurt.",
        items: [{ f: "Dein Bericht:", kriterien: ["zwei bis drei englische Sätze", "past progressive mit when oder while", "ein Wort zu Verletzung oder Hilfe"],
                  muster: "\\b(was|were)\\s+\\w+ing\\b[\\s\\S]*\\b(when|while)\\b|\\b(when|while)\\b[\\s\\S]*\\b(was|were)\\s+\\w+ing\\b",
                  bsp: "I was walking to school when a boy fell off his bike. He had a bruise on his knee, so I gave him a plaster." }] }
    ]
  });
