  <script>
  E9Seite(1, "w");
  Grammatik.seite({
    nr: 1, lsNr: 2, modul: "e9-u1-w1", kurz: "WB1",
    titel: "Talking about experiences",
    lead: "Du warst unterwegs und willst davon erzählen? Hier lernst du, wie du sagst, **wie es war**, **was du gemacht hast** – und was du darüber **denkst**.",
    ziele: ["Du beschreibst ein Erlebnis mit passenden Adjektiven.", "Du erzählst der Reihe nach, was passiert ist.", "Du sagst deine Meinung und fragst andere nach ihren Erlebnissen."],
    merk: [
      { t: "How was it?", html: `
        <ul class="wb-liste"><li><b>amazing · exciting</b><span>fantastisch · aufregend</span></li><li><b>relaxing · peaceful</b><span>erholsam · ruhig</span></li>
        <li><b>exhausting</b><span>anstrengend</span></li><li><b>boring · disappointing</b><span>langweilig · enttäuschend</span></li>
        <li><b>scary · strange</b><span>unheimlich · seltsam</span></li><li><b>awful</b><span>schrecklich</span></li><li><b>crowded</b><span>überfüllt</span></li><li><b>unforgettable</b><span>unvergesslich</span></li></ul>` },
      { t: "Telling the story", html: `
        <div class="bsp"><b>First</b> … <b>Then</b> … <b>After that</b> … <b>In the evening</b> … <b>In the end</b> …</div>
        <ul class="wb-liste"><li><b>suddenly</b><span>plötzlich</span></li><li><b>luckily</b><span>zum Glück</span></li><li><b>unfortunately</b><span>leider</span></li><li><b>two days later</b><span>zwei Tage später</span></li></ul>
        <p>Was vorbei ist, steht im <b>simple past</b>: We <u>went</u> … · I <u>tried</u> … · We <u>didn't see</u> …</p>` },
      { t: "What I did", html: `
        <ul class="wb-liste"><li><b>to go on a trip</b><span>einen Ausflug machen</span></li><li><b>to stay at</b><span>übernachten in / bei</span></li><li><b>to try</b><span>probieren</span></li>
        <li><b>to go hiking · sightseeing</b><span>wandern · Sehenswürdigkeiten ansehen</span></li><li><b>to get lost</b><span>sich verlaufen</span></li>
        <li><b>to miss the bus</b><span>den Bus verpassen</span></li><li><b>to arrive · to leave</b><span>ankommen · abfahren</span></li></ul>` },
      { t: "What I thought – and asking others", html: `
        <div class="bsp"><b>I really enjoyed</b> the boat trip. · <b>The best part was</b> the sunset. · <b>It was worth it.</b> · <b>I'd love to go back.</b></div>
        <div class="bsp"><b>What was it like?</b> · <b>What did you do there?</b> · <b>Would you go again?</b></div>
        <p>Alle Wörter und Sätze trainierst du im <a href="../vokabular/wordbank-talking-about-experiences.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**boring** oder **bored**? The film was **boring** (so war der Film). I was **bored** (so habe ich mich gefühlt). Genauso: exciting – excited, exhausting – exhausted.",
      "Nach **I really enjoyed** steht ein Nomen oder die -ing-Form: I enjoyed **the trip**. I enjoyed **swimming**. Nicht: ~~I enjoyed to swim.~~",
      "**to stay** heißt hier „übernachten, wohnen“: We **stayed at** a hostel. „Bleiben“ passt nicht immer."
    ],
    basis: [
      { typ: "zuordnen", t: "Positiv oder negativ? Sortiere die Adjektive.", gruppen: ["👍 positive", "👎 negative"],
        karten: [["amazing", 0], ["exciting", 0], ["relaxing", 0], ["unforgettable", 0], ["peaceful", 0], ["boring", 1], ["awful", 1], ["disappointing", 1], ["exhausting", 1], ["scary", 1]] },
      { typ: "paare", t: "Verbinde Englisch und Deutsch.",
        paare: [["to get lost", "sich verlaufen"], ["to stay at", "übernachten in"], ["to miss the bus", "den Bus verpassen"], ["to go hiking", "wandern gehen"], ["to arrive", "ankommen"], ["to try", "probieren"]] },
      { typ: "wahl", t: "Welches Adjektiv passt?", mischen: true,
        items: [
          { f: "We walked for seven hours in the heat. It was …", o: ["exhausting", "relaxing", "boring"], a: 0 },
          { f: "There were thousands of people on the beach. It was really …", o: ["crowded", "peaceful", "strange"], a: 0 },
          { f: "I waited two hours for the show, and then it was only ten minutes long. How …!", o: ["disappointing", "exciting", "unforgettable"], a: 0 },
          { f: "At night we heard noises in the forest. It was a bit …", o: ["scary", "relaxing", "crowded"], a: 0 },
          { f: "We saw dolphins next to our boat! It was …", o: ["amazing", "awful", "boring"], a: 0 }
        ] },
      { typ: "bauen", t: "Bringe den Reisebericht in die richtige Reihenfolge.", tipp: "Achte auf First, Then, After that, In the evening, In the end.",
        items: [{ teile: ["First we took the train to the coast.", "Then we walked to the campsite.", "After that we put up our tent.", "In the evening we made a fire.", "In the end we fell asleep under the stars."] }] },
      { typ: "luecke", t: "Wähle das passende Wort.",
        items: ["It started to rain. {{Luckily|Unfortunately}} we had our jackets with us.", "{{Unfortunately|Luckily}} the museum was closed on Monday.",
                "We were on the bridge. {{Suddenly|First}} a big bird flew over our heads.", "The film was {{boring|bored}}. I almost fell asleep.",
                "I was really {{excited|exciting}} before the trip.", "We {{stayed|slept}} at a small hostel near the harbour."] },
      { typ: "luecke", t: "Setze das Verb ins simple past.", tipp: "Was vorbei ist, steht im simple past. Achtung: unregelmäßige Verben!",
        items: ["Last summer we [[went]] (go) on a trip to the mountains.", "I [[tried]] (try) a new kind of ice cream.", "We [[got]] (get) lost in the old town.",
                "My brother [[took]] (take) a lot of photos.", "We [[didn't see|did not see]] (not see) any kangaroos.", "The bus [[left]] (leave) at seven in the morning."] },
      { typ: "paare", t: "Frage und Antwort: Was passt zusammen?",
        paare: [["What was it like?", "It was amazing. I'll never forget it."], ["Who did you go with?", "With my aunt and my cousins."], ["What did you do there?", "We went hiking and swimming."],
                ["Did you like the food?", "Yes, especially the fresh fish."], ["Would you go again?", "Sure! I'd love to go back."]] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Erlebnisbericht: Ergänze die fehlenden Wörter.", tipp: "Wörter aus dem Merkwissen: enjoyed, best, worth, recommend, forget",
        items: ["I really [[enjoyed]] our weekend at the lake.", "The [[best]] part was the night walk with torches.", "The tickets for the boat were expensive, but it was [[worth]] it.",
                "I would [[recommend]] the campsite to every family.", "We saw a shooting star. I'll never [[forget]] it."] },
      { typ: "frei", t: "Erzähle in zwei bis drei Sätzen von einem Ausflug – und sag, wie er war.", tipp: "Last … we went … · First … Then … · It was … because …",
        items: [{ f: "Dein Erlebnis:", kriterien: ["zwei bis drei englische Sätze", "simple past für das, was passiert ist", "mindestens ein Adjektiv, das sagt, wie es war"],
                  muster: "\\b(went|was|were|saw|visited|tried|stayed|had|took|got|met|played|ate)\\b[\\s\\S]*\\b(amazing|exciting|boring|scary|relaxing|exhausting|awful|disappointing|unforgettable|strange|crowded|peaceful|great|fun|nice|cool|fantastic)\\b|\\b(amazing|exciting|boring|scary|relaxing|exhausting|awful|disappointing|unforgettable|strange|crowded|peaceful|great|fun|nice|cool|fantastic)\\b[\\s\\S]*\\b(went|was|were|saw|visited|tried|stayed|had|took|got|met|played|ate)\\b",
                  bsp: "Last month we went to a climbing park. First I was scared, but then it was really exciting." }] }
    ]
  });
  </script>
