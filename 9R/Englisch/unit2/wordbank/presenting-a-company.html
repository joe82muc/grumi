<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>

  <script>
  E9Seite(2, "w");
  Grammatik.seite({
    nr: 1, lsNr: 2, modul: "e9-u2-w1", kurz: "WB1",
    titel: "Presenting a company",
    lead: "Du sollst eine Firma vorstellen? Hier lernst du die **wichtigsten Wörter** für Betrieb und Beruf – und wie du deinen **Vortrag** Schritt für Schritt gliederst.",
    ziele: ["Du nennst Orte und Menschen in einer Firma.", "Du sagst, was eine Firma herstellt, verkauft und liefert, und nennst Zahlen und Fakten.", "Du gliederst einen kurzen Vortrag mit festen Wendungen."],
    merk: [
      { t: "The company and the people", html: `
        <ul class="wb-liste"><li><b>company · factory</b><span>Firma · Fabrik</span></li><li><b>workshop · office</b><span>Werkstatt · Büro</span></li>
        <li><b>branch · head office</b><span>Filiale · Zentrale</span></li><li><b>department</b><span>Abteilung</span></li>
        <li><b>employee</b><span>Angestellte(r)</span></li><li><b>boss · manager · owner</b><span>Chef · Leiter · Besitzer</span></li>
        <li><b>customer</b><span>Kunde / Kundin</span></li><li><b>colleague · apprentice</b><span>Kollege · Auszubildende(r)</span></li></ul>` },
      { t: "What a company does", html: `
        <ul class="wb-liste"><li><b>to produce</b><span>herstellen</span></li><li><b>to sell</b><span>verkaufen</span></li><li><b>to deliver</b><span>liefern</span></li>
        <li><b>to export</b><span>exportieren</span></li><li><b>to repair</b><span>reparieren</span></li><li><b>to employ</b><span>beschäftigen</span></li></ul>
        <p>Im <b>simple present</b> bekommt he/she/it ein <b>-s</b>: The company produce<u>s</u> bags. · Kunal repair<u>s</u> bikes. · It doesn't sell shoes.</p>` },
      { t: "Facts and figures", html: `
        <div class="bsp">The company <b>was founded in</b> 1998. · It <b>is based in</b> Pune.</div>
        <div class="bsp">It <b>has about</b> 60 <b>employees</b>. · It <b>has</b> three <b>branches</b>. · It <b>sells its products to</b> hotels.</div>` },
      { t: "Giving a talk", html: `
        <div class="bsp"><b>Today I would like to tell you about</b> … · <b>First,</b> I will talk about … · <b>Next,</b> … · <b>Then</b> … · <b>Finally,</b> …</div>
        <div class="bsp"><b>Here you can see</b> … · <b>Let me show you</b> … · <b>Thank you for listening.</b> · <b>Are there any questions?</b></div>` },
      { t: "Work and money", html: `
        <ul class="wb-liste"><li><b>salary · to earn</b><span>Gehalt · verdienen</span></li><li><b>working hours</b><span>Arbeitszeit</span></li>
        <li><b>shift</b><span>Schicht</span></li><li><b>full-time · part-time</b><span>Vollzeit · Teilzeit</span></li></ul>
        <p>Alle Wörter und Sätze trainierst du im <a href="../vokabular/wordbank-presenting-a-company.html">Wordbank-Trainer</a>.</p>` }
    ],
    fallen: [
      "**he/she/it braucht -s**: The company **produces** bags. Nicht: ~~The company produce bags.~~ In Verneinung und Frage steht das -s bei **does**: It **doesn't sell** shoes. · **Does** it export tea?",
      "**employee** ist nicht der Arbeitgeber: Ein **employee** arbeitet für die Firma, der **boss** oder **owner** leitet sie. Und ein **customer** kauft etwas – er arbeitet nicht dort.",
      "**Filiale** heißt **branch**, nicht ~~filial~~. Und **Gehalt** heißt **salary**, nicht ~~gehalt~~."
    ],
    basis: [
      { typ: "zuordnen", t: "Ort oder Person? Sortiere die Wörter.", gruppen: ["🏢 Ort / Firma", "🧑 Person"],
        karten: [["company", 0], ["factory", 0], ["workshop", 0], ["office", 0], ["branch", 0], ["head office", 0], ["employee", 1], ["boss", 1], ["customer", 1], ["colleague", 1], ["apprentice", 1], ["manager", 1]] },
      { typ: "paare", t: "Verbinde Englisch und Deutsch.",
        paare: [["to deliver", "liefern"], ["to export", "exportieren"], ["to repair", "reparieren"], ["salary", "Gehalt"], ["shift", "Schicht"], ["apprentice", "Auszubildende(r)"]] },
      { typ: "wahl", t: "Welches Wort passt?", mischen: true,
        items: [
          { f: "A … is a person who buys things in a shop.", o: ["customer", "boss", "worker"], a: 0 },
          { f: "Riya works in a company, but she is not the boss. She is an …", o: ["employee", "owner", "customer"], a: 0 },
          { f: "Our company makes bicycle parts in a big …", o: ["factory", "salary", "shift"], a: 0 },
          { f: "At the end of the month she gets her …", o: ["salary", "shift", "branch"], a: 0 },
          { f: "The bakery has a second shop in the next town. That is a new …", o: ["branch", "product", "shift"], a: 0 },
          { f: "A nurse often works at night. She works the night …", o: ["shift", "branch", "office"], a: 0 }
        ] },
      { typ: "luecke", t: "Wähle die richtige Form (simple present).",
        items: ["The company {{produces|produce}} paper bags.", "My colleagues {{work|works}} in the office.", "Kunal {{repairs|repair}} bikes in the workshop.",
                "We {{deliver|delivers}} our products every Monday.", "The shop {{doesn't|don't}} sell shoes.", "{{Does|Do}} the company export tea?"] },
      { typ: "luecke", t: "Setze das Verb im simple present ein.", tipp: "he/she/it: -s. Bei der Verneinung: doesn't + Grundform.",
        items: ["The firm [[exports]] (export) tea to Germany.", "The apprentice [[earns]] (earn) a small salary.", "Our shop [[sells]] (sell) cheap shoes.",
                "The factory [[doesn't produce|does not produce]] (not produce) toys.", "Mrs Nair [[employs]] (employ) twenty people.", "We [[deliver]] (deliver) to customers in the city."] },
      { typ: "bauen", t: "Bringe den Vortrag in die richtige Reihenfolge.", tipp: "Today … · First … · Next … · Finally …",
        items: [{ teile: ["Today I would like to tell you about our company.", "First, I will talk about our products.", "Next, I will show you our workshop.", "Finally, I will answer your questions."] }] },
      { typ: "paare", t: "Frage und Antwort: Was passt zusammen?",
        paare: [["Where is the company based?", "It is based in Pune."], ["How many employees does it have?", "It has about 200 employees."], ["When was it founded?", "It was founded in 1995."],
                ["What does the company sell?", "It sells tea."], ["Are there any questions?", "Yes. Do you export to Europe?"]] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Kurzvortrag: Ergänze die fehlenden Wörter.", tipp: "Wörter aus dem Merkwissen: today, first, finally, see, listening, questions",
        items: ["{{Today|Yesterday|Tomorrow ago}} I would like to tell you about my uncle's workshop.", "{{First|One|Firstest}}, I will talk about his products.", "Here you can {{see|seeing|sees}} a picture of the workshop.",
                "{{Finally|Final|At finally}}, I will say why I like the job.", "Thank you for {{listening|listen|listened}}.", "Are there any {{questions|question|asks}}?"] },
      { typ: "frei", t: "Stelle eine Firma vor (echt oder ausgedacht) – in drei Sätzen.", tipp: "The company … was founded in … · It is based in … · It sells / produces … · It has … employees",
        items: [{ f: "Deine Firma:", kriterien: ["drei englische Sätze", "simple present (he/she/it mit -s)", "mindestens eine Information zu Ort, Gründung oder Mitarbeitern"],
                  muster: "\\b(is based in|was founded in|has (about |around )?\\d+|employees|sells|produces|makes|repairs|exports)\\b",
                  bsp: "Riya's Bike Shop is based in Kochi. It was founded in 2010 and has about 12 employees. It sells and repairs bikes." }] }
    ]
  });
  </script>
