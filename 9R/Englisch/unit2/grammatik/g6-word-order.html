  <script>
  E9Seite(2, "g");
  Grammatik.seite({
    nr: 2, lsNr: 2, modul: "e9-u2-g6", kurz: "G6",
    titel: "Word order",
    lead: "„Neha sells handmade bags **carefully in her shop every Saturday.**“ – Im Englischen hat jedes Satzglied seinen festen Platz. Wenn du die Reihenfolge kennst, klingen deine Sätze sofort richtig.",
    ziele: ["Du baust Sätze nach dem Muster Subjekt – Verb – Objekt.", "Du ordnest Angaben richtig: Art und Weise – Ort – Zeit.", "Du weißt, dass nach einer Zeitangabe am Satzanfang das Subjekt vor dem Verb bleibt."],
    merk: [
      { t: "Subjekt – Verb – Objekt", html: `
        <table><tr><th>Subjekt</th><th>Verb</th><th>Objekt</th></tr>
        <tr><td>Ishaan</td><td>repairs</td><td>solar lamps.</td></tr>
        <tr><td>The customers</td><td>like</td><td>the new design.</td></tr></table>
        <p>Verb und Objekt bleiben <b>zusammen</b>. Nichts darf dazwischen stehen: <i>Ishaan repairs <b>solar lamps</b> in the workshop.</i> Nicht: ~~Ishaan repairs in the workshop solar lamps.~~</p>` },
      { t: "Art und Weise – Ort – Zeit", html: `
        <p>Nach dem Objekt kommen die Angaben in dieser Reihenfolge: <b>Wie?</b> – <b>Wo?</b> – <b>Wann?</b></p>
        <table><tr><th>Subjekt + Verb + Objekt</th><th>Wie?</th><th>Wo?</th><th>Wann?</th></tr>
        <tr><td>Neha sells bags</td><td>happily</td><td>in her shop</td><td>on Saturdays.</td></tr>
        <tr><td>The workers pack boxes</td><td>quickly</td><td>in the hall</td><td>every morning.</td></tr></table>
        <p>Merkhilfe: <b>Wie – Wo – Wann</b>. Im Deutschen ist es oft anders (Zeit – Art und Weise – Ort).</p>` },
      { t: "Die Zeitangabe am Satzanfang", html: `
        <p>Eine Zeitangabe darf auch <b>vorne</b> stehen. Dann kommt oft ein Komma – aber das <b>Subjekt bleibt vor dem Verb</b>:</p>
        <div class="bsp"><b>On Mondays</b> Mr Joshi <b>visits</b> the factory.</div>
        <div class="bsp"><b>In the evening</b> we <b>talk</b> about the day.</div>
        <p>Im Deutschen tauschen Subjekt und Verb den Platz („Am Montag besucht Herr Joshi …“). Im Englischen <b>nicht</b>!</p>` },
      { t: "Häufigkeitswörter und Fragen mit Fragewort", html: `
        <div class="bsp">Häufigkeitswort <b>vor</b> dem Vollverb: Neha <b>often</b> works late. · <b>nach</b> be: She <b>is often</b> tired.</div>
        <div class="bsp"><b>Fragewort + do/does + Subjekt + Verb:</b> <b>Where</b> does Ishaan work? · <b>When</b> do the shops open? · <b>How</b> do you go to work?</div>
        <p>Auch in der Frage bleiben Subjekt und Verb zusammen, dahinter folgen die Angaben: <i>Where does Neha sell her bags <b>on Saturdays</b>?</i></p>` }
    ],
    fallen: [
      "Nach einer Zeitangabe am Satzanfang bleibt das Subjekt vor dem Verb: **In the morning** Neha **opens** the shop. Nicht: ~~In the morning opens Neha the shop.~~",
      "Zwischen Verb und Objekt steht nichts: Ishaan **likes his job** very much. Nicht: ~~Ishaan likes very much his job.~~",
      "Ort vor Zeit: We meet **in the office on Fridays**. Nicht: ~~We meet on Fridays in the office.~~",
      "Häufigkeitswörter stehen vor dem Vollverb, aber nach be: Mr Joshi **always** drinks tea. Mr Joshi **is always** friendly."
    ],
    basis: [
      { typ: "bauen", t: "Baue die Sätze: Subjekt – Verb – Objekt – Ort – Zeit.", tipp: "Ort steht vor Zeit.",
        items: [{ teile: ["Neha", "sells", "handmade bags", "in her shop", "on Saturdays."] }, { teile: ["Ishaan", "repairs", "solar lamps", "in the workshop", "every day."] },
                { teile: ["The team", "has", "a meeting", "in the office", "on Mondays."] }, { teile: ["Mr Joshi", "visits", "the factory", "in Jaipur", "twice a month."] }] },
      { typ: "wahl", t: "Welcher Satz ist richtig?", mischen: true,
        items: [
          { s: "Wähle den richtigen Satz.", o: ["Neha sells bags in the market on Sundays.", "Neha sells in the market bags on Sundays.", "Neha sells bags on Sundays in the market."], a: 0 },
          { s: "Wähle den richtigen Satz.", o: ["On Fridays the workers clean the machines.", "On Fridays clean the workers the machines.", "On Fridays the workers the machines clean."], a: 0 },
          { s: "Wähle den richtigen Satz.", o: ["Ishaan explains the plan clearly to the team.", "Ishaan explains clearly the plan to the team.", "Ishaan clearly explains to the team the plan."], a: 0 }
        ] },
      { typ: "zuordnen", t: "Gehört die Angabe zu Wie?, Wo? oder Wann?", tipp: "Reihenfolge im Satz: Wie – Wo – Wann",
        gruppen: ["Wie? (Art und Weise)", "Wo? (Ort)", "Wann? (Zeit)"],
        karten: [["carefully", 0], ["quickly", 0], ["happily", 0], ["in the office", 1], ["at the market", 1], ["in Delhi", 1], ["every day", 2], ["on Fridays", 2], ["in the morning", 2], ["at half past six", 2]] },
      { typ: "markieren", t: "Markiere in jedem Satz die Zeitangabe.", tipp: "Sie antwortet auf die Frage: Wann?",
        items: ["[Every morning] Neha opens the shop.", "The workers eat lunch together [at one o'clock].", "Mr Joshi checks the numbers [on Thursdays].", "[In the evening] Ishaan phones his parents."] },
      { typ: "luecke", t: "Wähle den Satz mit der richtigen Wortstellung.", tipp: "Verb und Objekt zusammen – dann Wie, Wo, Wann.",
        items: ["{{Neha drinks tea every morning.|Neha drinks every morning tea.}}", "{{In the afternoon the team plans the week.|In the afternoon plans the team the week.}}",
                "{{The workers pack the boxes carefully in the hall.|The workers pack carefully the boxes in the hall.}}", "{{We often recycle paper at work.|We recycle often paper at work.}}"] },
      { typ: "umformen", t: "Stelle die Zeitangabe an den Satzanfang. Das Subjekt bleibt vor dem Verb.", tipp: "Zeitangabe + Subjekt + Verb + Objekt …",
        items: [
          { s: "Neha has a meeting on Mondays.", l: ["On Mondays Neha has a meeting.", "On Mondays, Neha has a meeting."] },
          { s: "The workers go home at five o'clock.", l: ["At five o'clock the workers go home.", "At five o'clock, the workers go home."] },
          { s: "Mr Joshi visits the factory every week.", l: ["Every week Mr Joshi visits the factory.", "Every week, Mr Joshi visits the factory."] }
        ] },
      { typ: "bauen", t: "Baue die Fragen mit Fragewort.", tipp: "Fragewort + do / does + Subjekt + Verb + Rest",
        items: [{ teile: ["Where", "does", "Ishaan", "repair", "the lamps?"] }, { teile: ["When", "do", "the shops", "open", "on Sundays?"] },
                { teile: ["How", "does", "Neha", "go", "to work?"] }, { teile: ["Why", "do", "the employees", "like", "their boss?"] }] },
      { typ: "luecke", t: "Wo steht das Häufigkeitswort? Wähle den richtigen Satz.", tipp: "vor dem Vollverb – aber nach am, is, are",
        items: ["{{Ishaan usually takes the bus.|Ishaan takes usually the bus.}}", "{{Neha is never late.|Neha never is late.}}", "{{They sometimes eat lunch outside.|They eat lunch sometimes outside.}}"] },
      { typ: "frei", t: "Schreibe einen Satz über einen Arbeitstag von einer Person, die du kennst. Nenne darin einen Ort und eine Zeit.", tipp: "Zum Beispiel: My aunt works in a hospital every Monday.",
        items: [{ f: "Was macht die Person bei der Arbeit, wo und wann?", kriterien: ["ein vollständiger englischer Satz", "Subjekt, Verb und Objekt stehen zusammen", "der Ort steht vor der Zeit"],
                  muster: "\\b(in|at|on)\\b", bsp: "My aunt cuts hair in a small salon on Saturdays." }] }
    ],
    plus: [
      { typ: "bauen", t: "Baue die längeren Sätze: Wie – Wo – Wann.", tipp: "Ist die Zeitangabe vorne, bleibt der Rest in der Reihenfolge Subjekt – Verb – Objekt – Wie – Wo.",
        items: [{ teile: ["Neha", "talks", "to customers", "politely", "in her shop", "every day."] },
                { teile: ["Ishaan", "presents", "his ideas", "confidently", "in the meeting", "on Wednesdays."] },
                { teile: ["On Fridays", "the team", "cleans", "the workshop", "carefully."], l: ["The team cleans the workshop carefully on Fridays."] }] },
      { typ: "umformen", t: "Setze die Satzglieder in der richtigen Reihenfolge zu einem Satz zusammen.", tipp: "Wie – Wo – Wann",
        items: [
          { s: "(in the office / Mr Joshi / on Mondays / works / quietly)", l: ["Mr Joshi works quietly in the office on Mondays.", "On Mondays Mr Joshi works quietly in the office.", "On Mondays, Mr Joshi works quietly in the office."] },
          { s: "(sell / the children / cold drinks / every summer / at the station)", l: ["The children sell cold drinks at the station every summer.", "Every summer the children sell cold drinks at the station.", "Every summer, the children sell cold drinks at the station."] }
        ] }
    ]
  });
  </script>
