  <title>G5 · Simple present | Englisch 9R</title>
  <meta name="description" content="Englisch 9R, Unit 2 (Wiederholung): das simple present für Gewohnheiten, Tatsachen und Abläufe – Aussagen mit -s, Verneinung mit don't und doesn't, Fragen mit do und does, Häufigkeitsadverbien.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../../js/lernstand.js"></script>
  <script src="../../../../js/grammatik.js"></script>
  <script src="../../seiten.js"></script>
  <script>
  E9Seite(2, "g");
  Grammatik.seite({
    nr: 1, lsNr: 1, modul: "e9-u2-g5", kurz: "G5",
    titel: "Simple present",
    lead: "„Ishaan **works** for a solar company in India. His team **doesn't finish** before six.“ – Das simple present brauchst du, wenn du über Gewohnheiten, Tatsachen und feste Abläufe sprichst, zum Beispiel über den Alltag in einer Firma.",
    ziele: ["Du setzt bei he, she, it das -s richtig (auch -es, -ies, has, does, goes).", "Du verneinst mit don't und doesn't und bildest Fragen mit do und does.", "Du setzt Häufigkeitswörter an die richtige Stelle."],
    merk: [
      { t: "Wann brauchst du das simple present?", html: `
        <p>Für <b>Gewohnheiten</b>, <b>Tatsachen</b> und <b>feste Abläufe</b>:</p>
        <div class="bsp">Neha <b>starts</b> work at nine o'clock. (Gewohnheit)<br>India <b>has</b> many different languages. (Tatsache)<br>The bus to the factory <b>leaves</b> at 7.30. (fester Ablauf)</div>
        <p>Typische Signalwörter:</p>
        <ul class="wb-liste"><li><b>every day / every week</b><span>jeden Tag / jede Woche</span></li><li><b>on Mondays</b><span>montags</span></li><li><b>in the morning</b><span>morgens</span></li>
        <li><b>once / twice a week</b><span>einmal / zweimal pro Woche</span></li><li><b>always · usually · often</b><span>immer · normalerweise · oft</span></li><li><b>sometimes · never</b><span>manchmal · nie</span></li></ul>` },
      { t: "Aussagen: he, she, it – das s muss mit", html: `
        <table><tr><th>I, you, we, they</th><th>he, she, it</th></tr>
        <tr><td>work, live, start</td><td>work<b>s</b>, live<b>s</b>, start<b>s</b></td></tr>
        <tr><td>watch, finish, go, do</td><td>watch<b>es</b>, finish<b>es</b>, go<b>es</b>, do<b>es</b></td></tr>
        <tr><td>carry, study</td><td>carr<b>ies</b>, stud<b>ies</b></td></tr>
        <tr><td>have</td><td><b>has</b></td></tr></table>
        <p>Nach <b>s, sh, ch, x, o</b> kommt <b>-es</b>. Aus <b>Konsonant + y</b> wird <b>-ies</b>, aber: play → play<b>s</b>.</p>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>don't / doesn't + Grundform:</b> We <b>don't use</b> plastic bags. Mr Joshi <b>doesn't drive</b> to work.</div>
        <div class="bsp"><b>Do / Does + Person + Grundform:</b> <b>Do</b> you <b>work</b> here? <b>Does</b> Neha <b>speak</b> Hindi?</div>
        <div class="bsp"><b>Mit Fragewort:</b> <b>Where</b> do the employees eat? <b>What time</b> does the shop open? <b>Who</b> works on Sundays?</div>
        <p>Kurzantworten: Yes, I <b>do</b>. / No, he <b>doesn't</b>.</p>
        <p>Bei <b>who</b> als Subjekt gibt es kein do/does: <i>Who <b>works</b> here?</i></p>` },
      { t: "Wohin mit always, usually, often …?", html: `
        <div class="bsp">Vor dem Vollverb: Ishaan <b>usually</b> takes the bus. · We <b>never</b> waste water.</div>
        <div class="bsp">Nach am / is / are: Neha <b>is always</b> on time. · They <b>are often</b> busy.</div>
        <p>In der Verneinung steht das Häufigkeitswort <b>vor</b> don't / doesn't: <i>He <b>often</b> doesn't have time.</i> Einfacher ist meist: <i>He <b>rarely</b> has time.</i></p>
        <p>Zeitangaben wie <b>every day</b>, <b>on Mondays</b> stehen meistens am Ende (oder am Satzanfang).</p>` }
    ],
    fallen: [
      "Nach **does** und **doesn't** steht die Grundform ohne -s: Neha doesn't **work** on Sundays. Nicht: ~~Neha doesn't works on Sundays.~~",
      "Häufigkeitswörter stehen vor dem Vollverb, aber **nach** am / is / are: Mr Joshi **often works** late. Mr Joshi **is often** late.",
      "Fragen mit be bildest du ohne do: **Is** your boss friendly? Nicht: ~~Does your boss is friendly?~~",
      "Vergiss das -s nicht: She **has** a new job. Nicht: ~~She have a new job.~~"
    ],
    basis: [
      { typ: "luecke", t: "Setze das Verb in der richtigen Form ein.", tipp: "he, she, it → -s. Nach -ch, -sh und -o: -es. Aus -y wird -ies.",
        items: ["Ishaan [[works]] in a solar company. (work)", "He [[studies]] new ideas every week. (study)", "Neha [[watches]] the machines carefully. (watch)",
                "The company [[has]] two hundred employees. (have)", "Mr Joshi [[goes]] to the factory by bike. (go)", "My dad [[carries]] boxes at work. (carry)", "The workers [[finish]] at five o'clock. (finish)"] },
      { typ: "zuordnen", t: "Wie wird aus dem Verb die he/she/it-Form? Ordne zu.", tipp: "Achte auf den Wortausgang: -ch, -sh, -o → -es. Konsonant + y → -ies.",
        gruppen: ["+ -s", "+ -es", "-y wird -ies"],
        karten: [["work", 0], ["start", 0], ["live", 0], ["play", 0], ["watch", 1], ["finish", 1], ["go", 1], ["do", 1], ["try", 2], ["carry", 2], ["study", 2]] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "don't / doesn't + Grundform. Bei be: isn't, aren't.",
        items: [
          { s: "We use solar energy.", l: ["We don't use solar energy.", "We do not use solar energy."] },
          { s: "Neha lives in a big city.", l: ["Neha doesn't live in a big city.", "Neha does not live in a big city."] },
          { s: "The shops are open on Sundays.", l: ["The shops aren't open on Sundays.", "The shops are not open on Sundays."] },
          { s: "Mr Joshi has a car.", l: ["Mr Joshi doesn't have a car.", "Mr Joshi does not have a car."] }
        ] },
      { typ: "markieren", t: "Markiere in jedem Satz das Häufigkeitswort.", tipp: "always, usually, often, sometimes, never, rarely",
        items: ["Ishaan [usually] starts work at eight.", "The team [often] has a meeting on Fridays.", "Neha is [always] friendly to customers.", "We [never] throw away glass bottles."] },
      { typ: "bauen", t: "Wo steht das Häufigkeitswort? Baue die Sätze.", tipp: "vor dem Vollverb – aber nach am, is, are",
        items: [{ teile: ["Neha", "usually", "cycles", "to the office."] }, { teile: ["Our boss", "is", "always", "friendly", "to new employees."] },
                { teile: ["The workers", "sometimes", "eat", "lunch", "outside."] }, { teile: ["Ishaan", "never", "arrives", "late", "for work."] }] },
      { typ: "luecke", t: "Do, Does, Is oder Are?", tipp: "Mit Vollverb: Do / Does. Mit be: Is / Are.",
        items: ["{{Does|Do}} Neha work in a team?", "{{Do|Does}} the employees get a lunch break?", "{{Is|Does}} Mr Joshi a manager?",
                "{{Are|Do}} your parents at home in the evening?", "Where {{does|do}} Ishaan live?", "What time {{do|does}} you start work?"] },
      { typ: "wahl", t: "Wähle das passende Fragewort oder die passende Kurzantwort.", mischen: true,
        items: [
          { s: "… do the employees start work? – At eight o'clock.", o: ["What time", "Where", "Who"], a: 0 },
          { s: "… does Neha live? – In Pune.", o: ["Where", "What time", "Who"], a: 0 },
          { s: "Does Mr Joshi work on Saturdays?", o: ["No, he doesn't.", "No, he don't.", "No, he isn't."], a: 0 },
          { s: "Do you recycle paper at home?", o: ["Yes, I do.", "Yes, I recycle.", "Yes, I am."], a: 0 }
        ] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "(Fragewort) + do / does + Person + Grundform",
        items: [{ teile: ["Do", "you", "work", "in a team?"] }, { teile: ["Does", "Neha", "speak", "English at work?"] },
                { teile: ["Where", "do", "the workers", "eat", "lunch?"] }, { teile: ["How often", "does", "Mr Joshi", "visit", "the factory?"] }] },
      { typ: "frei", t: "Und du? Schreibe ein, zwei Sätze darüber, was du an einem normalen Schultag immer, oft oder nie machst.", tipp: "Zum Beispiel mit: On school days I usually … but I never …",
        items: [{ f: "Was machst du an einem normalen Schultag?", kriterien: ["ein bis zwei vollständige englische Sätze", "das Verb steht im simple present", "mindestens ein Häufigkeitswort wie usually, often, always, sometimes oder never"],
                  muster: "\\b(usually|often|always|sometimes|never|rarely|every)\\b", bsp: "On school days I usually get up at six. I never eat breakfast at school." }] }
    ],
    plus: [
      { typ: "luecke", t: "Ein Tag in der Firma: Setze die Verben ein.", tipp: "Achte auf he/she/it und auf die Verneinung.",
        items: ["Neha [[starts]] work at half past eight. (start)", "She [[doesn't use|does not use]] her car – she [[takes]] the bus. (not use / take)",
                "Her colleagues [[don't work|do not work]] on Sundays. (not work)", "Her boss [[has]] a small office, but he often [[works]] with the team. (have / work)",
                "[[Does]] your company [[recycle]] old computers? (recycle)"] },
      { typ: "umformen", t: "Stelle eine Frage mit dem Fragewort in Klammern. Beispiel: Neha works in Pune. (Where) → Where does Neha work?", tipp: "Fragewort + do / does + Person + Grundform",
        items: [
          { s: "Mr Joshi starts work at nine. (What time)", l: ["What time does Mr Joshi start work?"] },
          { s: "Ishaan lives in Jaipur. (Where)", l: ["Where does Ishaan live?"] },
          { s: "Neha goes to work by train. (How)", l: ["How does Neha go to work?"] }
        ] },
      { typ: "paare", t: "Verbinde die Signalwörter mit ihrer Bedeutung.",
        paare: [["every day", "jeden Tag"], ["on Mondays", "montags"], ["twice a week", "zweimal pro Woche"], ["in the morning", "morgens"], ["rarely", "selten"], ["never", "nie"]] }
    ]
  });
  </script>
