  <script>
  E9Seite(4, "g");
  Grammatik.seite({
    nr: 1, lsNr: 1, modul: "e9-u4-g9", kurz: "G9",
    titel: "Going to-future",
    lead: "„After school I **am going to** look for an apprenticeship.“ – Mit **going to** sagst du, was du **vorhast** oder **geplant** hast. Das brauchst du, wenn du über deine Pläne, ein Praktikum oder eine Bewerbung sprichst.",
    ziele: ["Du bildest das going to-future: am/is/are + going to + Grundform.", "Du verneinst, stellst Fragen und antwortest kurz.", "Du erkennst, wann will besser passt: spontane Entscheidung, Versprechen und Vermutung."],
    merk: [
      { t: "Wann brauchst du es?", html: `
        <p>Du sprichst über einen <b>Plan</b> oder eine <b>Absicht</b>: Du hast dich schon entschieden, bevor du darüber sprichst.</p>
        <div class="bsp">Ana <b>is going to</b> start her work experience next week.</div>
        <div class="bsp">We <b>are going to</b> visit a fruit farm tomorrow.</div>
        <p>Typische Signale: <i>tomorrow, next week, next year, after school, in the holidays, this evening, soon</i>.</p>` },
      { t: "Die Bildung", html: `
        <p><b>am / is / are + going to + Verb in der Grundform</b></p>
        <table><tr><th>Person</th><th>Form</th></tr>
        <tr><td>I</td><td><b>am</b> (I'm) going to ask</td></tr>
        <tr><td>he, she, it</td><td><b>is</b> (he's) going to ask</td></tr>
        <tr><td>you, we, they</td><td><b>are</b> (we're) going to ask</td></tr></table>
        <p>Nach <i>going to</i> steht immer die <b>Grundform</b> – ohne -s, ohne -ing, ohne to dazwischen.</p>
        <div class="bsp">Wiremu <b>is going to</b> write a CV tonight.</div>` },
      { t: "Verneinung und Fragen", html: `
        <div class="bsp"><b>Verneinung: am not / isn't / aren't + going to:</b> I'<b>m not going to</b> wait. · Ana <b>isn't going to</b> stay at home. · They <b>aren't going to</b> come.</div>
        <div class="bsp"><b>Frage: Am / Is / Are + Person + going to + Grundform:</b> <b>Is</b> Wiremu <b>going to</b> join the club? – Yes, he <b>is</b>. / No, he <b>isn't</b>.</div>
        <div class="bsp"><b>Mit Fragewort:</b> What <b>are</b> you <b>going to</b> do after school? · When <b>is</b> Mrs Tipene <b>going to</b> call?</div>
        <p>Kein <i>do</i> und kein <i>does</i> – du brauchst nur am, is oder are.</p>` },
      { t: "going to oder will?", html: `
        <p>Beide kannst du für die Zukunft benutzen. Merke dir die klaren Fälle:</p>
        <div class="bsp"><b>going to</b> = Plan, der schon feststeht: I'm <b>going to</b> apply for a job at the garage. (Ich habe es mir vorgenommen.)</div>
        <div class="bsp"><b>will</b> = spontane Entscheidung im Moment des Sprechens: The phone is ringing. – I'<b>ll</b> answer it.</div>
        <div class="bsp"><b>will</b> = Versprechen: I <b>will</b> help you tomorrow, I promise.</div>
        <div class="bsp"><b>will</b> = Vermutung ohne Anzeichen: I think the interview <b>will</b> be easy.</div>` }
    ],
    fallen: [
      "Zu **I** gehört **am**, zu **he, she, it** gehört **is**, zu **you, we, they** gehört **are**: She **is** going to call. Nicht: ~~She are going to call.~~",
      "Nach **going to** steht die **Grundform**: Ana is going to **ask**. Nicht: ~~Ana is going to asks.~~ und nicht: ~~Ana is going to asking.~~",
      "Das **am / is / are** darf nicht fehlen: We **are** going to wait. Nicht: ~~We going to wait.~~",
      "Verneinung und Frage mit **am / is / are**, nicht mit do: Is he going to come? Nicht: ~~Does he going to come?~~ Er **isn't** going to come. Nicht: ~~He doesn't going to come.~~"
    ],
    basis: [
      { typ: "markieren", t: "Markiere am/is/are + going to blau und die Grundform orange.", stifte: [["b", "am/is/are + going to"], ["o", "Grundform"]], tipp: "Nach going to steht das Verb in der Grundform.",
        items: ["I [b:am going to] [o:ask] Mrs Tipene about a job.", "Ana [b:is going to] [o:visit] a small shop tomorrow.", "We [b:are going to] [o:meet] after school.", "Wiremu and his brother [b:aren't going to] [o:stay] at home."] },
      { typ: "luecke", t: "Setze am, is oder are ein.", tipp: "I → am · he/she/it → is · you/we/they → are",
        items: ["I [[am|'m]] going to write a CV tonight.", "Wiremu [[is|'s]] going to join a club in the holidays.", "We [[are|'re]] going to wait for the bus.",
                "Mrs Tipene [[is|'s]] going to call you tomorrow.", "My friends [[are]] going to start work next week."] },
      { typ: "luecke", t: "Schreibe die ganze Form mit going to.", tipp: "am/is/are + going to + Grundform",
        items: ["Ana [[is going to visit|'s going to visit]] her aunt next week. (visit)", "We [[are going to play|'re going to play]] football after school. (play)",
                "I [[am going to look|'m going to look]] for an apprenticeship next year. (look)", "They [[are going to leave|'re going to leave]] early tomorrow. (leave)"] },
      { typ: "umformen", t: "Verneine den Satz.", tipp: "am not / isn't / aren't + going to + Grundform",
        items: [
          { s: "Ana is going to leave school this year.", l: ["Ana isn't going to leave school this year.", "Ana is not going to leave school this year.", "Ana's not going to leave school this year."] },
          { s: "We are going to wait for the bus.", l: ["We aren't going to wait for the bus.", "We are not going to wait for the bus.", "We're not going to wait for the bus."] },
          { s: "I am going to call the club.", l: ["I'm not going to call the club.", "I am not going to call the club."] }
        ] },
      { typ: "bauen", t: "Baue die Fragen.", tipp: "(Fragewort) + am/is/are + Person + going to + Grundform",
        items: [{ teile: ["Are", "you", "going to", "apply", "for the job?"] }, { teile: ["What", "is", "Wiremu", "going to", "do", "after school?"] },
                { teile: ["Is", "Ana", "going to", "start", "her internship", "next week?"] }] },
      { typ: "luecke", t: "Antworte kurz.", tipp: "Yes, I am. / No, she isn't. – kein do/does",
        items: ["Is Ana going to write the letter? – Yes, she [[is]].", "Are Wiremu and Ana going to wait? – No, they [[aren't|are not]].",
                "Is Mrs Tipene going to call today? – No, she [[isn't|is not|'s not]].", "Are you going to join the club? – Yes, I [[am]]."] },
      { typ: "wahl", t: "Wähle die richtige Antwort.",
        items: [
          { s: "Which sentence is correct?", o: ["Wiremu is going to write an email.", "Wiremu is going write an email.", "Wiremu going to write an email."], a: 0 },
          { s: "Which sentence is correct?", o: ["Ana isn't going to come.", "Ana doesn't going to come.", "Ana isn't going to comes."], a: 0 },
          { s: "Which question fits? – Ana is going to start her internship next Monday.", o: ["When is Ana going to start her internship?", "Where is Ana going to start her internship?", "Why is Ana going to start her internship?"], a: 0 },
          { s: "Which question fits? – Wiremu is going to meet Mrs Tipene.", o: ["Who is Wiremu going to meet?", "When is Wiremu going to meet Mrs Tipene?", "Why is Wiremu going to meet Mrs Tipene?"], a: 0 }
        ], mischen: true },
      { typ: "zuordnen", t: "Going to oder will? Wähle die Form, die am besten passt.", tipp: "Plan, der schon feststeht → going to · spontane Entscheidung, Versprechen, Vermutung → will",
        gruppen: ["going to (Plan, feststehende Absicht)", "will (spontan, Versprechen, Vermutung)"],
        karten: [["Ana hat die Bewerbung schon geschrieben und schickt sie morgen ab.", 0], ["Wiremu hat sich im Verein angemeldet und fängt nächste Woche an.", 0],
                 ["Es klingelt. Du sagst sofort: „Ich gehe ran!“", 1], ["Du versprichst deiner Mutter: „Ich helfe dir morgen.“", 1],
                 ["Wir haben Tickets gekauft und fahren in den Ferien weg.", 0], ["Du glaubst: Das Vorstellungsgespräch wird bestimmt leicht.", 1]] },
      { typ: "frei", t: "Und du? Schreibe ein, zwei Sätze darüber, was du nach der Schule vorhast.", tipp: "Zum Beispiel mit: After school I am going to …",
        items: [{ f: "Was hast du nach der Schule vor?", kriterien: ["ein vollständiger englischer Satz", "der Satz benutzt am/is/are + going to + Grundform"],
                  muster: "\\b(am|is|are|'m|'s|'re)\\s+going\\s+to\\s+[a-z]+", bsp: "After school I am going to do work experience in a garage. My friend is going to start an apprenticeship." }] }
    ],
    plus: [
      { typ: "luecke", t: "Pläne für das Praktikum: Setze die richtige Form ein (Aussage, Verneinung oder Frage).", tipp: "Achte auf not und auf das Fragezeichen.",
        items: ["Ana [[is going to meet|'s going to meet]] her boss on Monday. (meet)", "Wiremu [[isn't going to be|is not going to be|'s not going to be]] late. (not be)",
                "[[Are]] you [[going to take]] your CV with you? (take)", "We [[aren't going to leave|are not going to leave|'re not going to leave]] before four o'clock. (not leave)",
                "What [[is]] Ana [[going to wear]] on her first day? (wear)"] },
      { typ: "umformen", t: "Mache aus dem Satz eine Frage.", tipp: "Am / Is / Are kommt an den Anfang.",
        items: [
          { s: "Wiremu is going to wait after school.", l: ["Is Wiremu going to wait after school?"] },
          { s: "They are going to visit a factory next week.", l: ["Are they going to visit a factory next week?"] },
          { s: "You are going to apply for the job.", l: ["Are you going to apply for the job?"] }
        ] }
    ]
  });
  </script>
