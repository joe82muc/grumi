  <script>
  E9Seite(4, "g");
  Grammatik.seite({
    nr: 2, lsNr: 2, modul: "e9-u4-g10", kurz: "G10",
    titel: "Passive",
    lead: "„The kiwis **are packed** by hand.“ – Im Passiv ist wichtig, **was passiert**, nicht, wer es tut. Du liest Passivsätze oft in Texten über Betriebe, Vereine und Berufe. Hier lernst du vor allem, sie zu **verstehen**.",
    ziele: ["Du erkennst Passivsätze im simple present (is/are + Partizip) und im simple past (was/were + Partizip).", "Du verstehst, wer etwas tut (by …) und was der Satz bedeutet.", "Im Challenge-Teil bildest du Passivsätze selbst."],
    merk: [
      { t: "Aktiv und Passiv", html: `
        <p>Im <b>Aktiv</b> steht der Handelnde vorn: Er tut etwas. Im <b>Passiv</b> steht das vorn, <b>mit dem etwas getan wird</b>.</p>
        <div class="bsp"><b>Aktiv:</b> Workers pack the kiwis. (Arbeiter packen die Kiwis.)</div>
        <div class="bsp"><b>Passiv:</b> The kiwis <b>are packed</b>. (Die Kiwis werden gepackt.)</div>
        <p>Das Passiv benutzt du, wenn der Handelnde unwichtig oder unbekannt ist.</p>` },
      { t: "So erkennst du das Passiv", html: `
        <p><b>is / are / was / were + Partizip</b> (3. Form des Verbs)</p>
        <table><tr><th>Zeit</th><th>Form</th><th>Beispiel</th></tr>
        <tr><td>simple present</td><td><b>is / are</b> + Partizip</td><td>The jam <b>is made</b> here.</td></tr>
        <tr><td>simple past</td><td><b>was / were</b> + Partizip</td><td>The club <b>was founded</b> by parents.</td></tr></table>
        <ul class="wb-liste"><li><b>make → made</b><span>unregelmäßig</span></li><li><b>sell → sold</b><span>unregelmäßig</span></li>
        <li><b>write → written</b><span>unregelmäßig</span></li><li><b>pack → packed</b><span>regelmäßig: -ed</span></li></ul>
        <p>Ob der Satz in der Gegenwart oder Vergangenheit steht, zeigt dir <b>is/are</b> oder <b>was/were</b>.</p>` },
      { t: "by = von", html: `
        <p>Mit <b>by</b> sagst du, <b>wer</b> etwas tut. Das ist die Person oder Gruppe, die im Aktivsatz das Subjekt wäre.</p>
        <div class="bsp">The CVs <b>are checked by</b> Mrs Tipene. (Mrs Tipene prüft die Lebensläufe.)</div>
        <div class="bsp">Ana <b>was invited by</b> the club. (Der Verein hat Ana eingeladen.)</div>
        <p>Oft fehlt <i>by</i>, weil es nicht wichtig ist: <i>Fruit is sold at the market.</i> Dann weißt du nicht, wer verkauft.</p>` },
      { t: "Passiv selbst bilden (Challenge)", html: `
        <p>Aus dem Aktivsatz machst du einen Passivsatz in drei Schritten:</p>
        <p>1. Das Objekt wird das neue Subjekt. 2. Du nimmst is/are/was/were + Partizip. 3. Das alte Subjekt kommt mit <b>by</b> ans Ende.</p>
        <div class="bsp">Wiremu <b>wrote</b> the letter. → The letter <b>was written by</b> Wiremu.</div>` }
    ],
    fallen: [
      "**is/are** sagt dir: Gegenwart. **was/were** sagt dir: Vergangenheit. The boxes **are** sent heißt „werden geschickt“, The boxes **were** sent heißt „wurden geschickt“.",
      "**by** heißt hier **von** (wer es tut), nicht „bei“ oder „neben“: The letter was written **by** Ana = Ana hat den Brief geschrieben.",
      "Im Passiv tut das Subjekt **nichts selbst**: The kiwis are packed. Die Kiwis packen nicht – sie werden gepackt.",
      "Das Partizip allein ist kein Passiv: ~~The kiwis packed.~~ Erst **are packed** (is/are + Partizip) ist Passiv."
    ],
    basis: [
      { typ: "zuordnen", t: "Aktiv oder Passiv? Ordne die Sätze zu.", tipp: "is/are/was/were + Partizip → Passiv. Wer etwas tut, steht vorn → Aktiv.",
        gruppen: ["Aktiv", "Passiv"],
        karten: [["The kiwis are packed by hand.", 1], ["Workers pack the kiwis by hand.", 0], ["The club was founded years ago.", 1], ["Mrs Tipene runs the club.", 0],
                 ["Ana was invited to an interview.", 1], ["The company invited Ana.", 0], ["Letters are written every day.", 1], ["Wiremu wrote a letter.", 0]] },
      { typ: "wahl", t: "Who does the action? Wähle, wer etwas tut.",
        items: [
          { s: "The CVs are checked by Mrs Tipene. Who checks the CVs?", o: ["Mrs Tipene", "The CVs", "Ana"], a: 0 },
          { s: "The letter was written by Ana. Who wrote the letter?", o: ["Ana", "The letter", "Mrs Tipene"], a: 0 },
          { s: "The club was founded by a group of parents. Who founded the club?", o: ["a group of parents", "the club", "Wiremu"], a: 0 },
          { s: "Fruit is sold at the market. Who sells the fruit?", o: ["The text does not say who sells it.", "The fruit sells itself.", "The market"], a: 0 }
        ], mischen: true },
      { typ: "wahl", t: "Was bedeutet der Satz? Achte auf is/are und was/were.",
        items: [
          { s: "The kiwis are packed by hand.", o: ["Die Kiwis werden von Hand verpackt.", "Die Kiwis packen von Hand.", "Die Kiwis wurden von Hand verpackt."], a: 0 },
          { s: "The club was founded in a small hall.", o: ["Der Verein wurde in einer kleinen Halle gegründet.", "Der Verein gründet in einer kleinen Halle.", "Der Verein wird in einer kleinen Halle gegründet."], a: 0 },
          { s: "Ana was invited by Mrs Tipene.", o: ["Ana wurde von Mrs Tipene eingeladen.", "Ana lädt Mrs Tipene ein.", "Mrs Tipene wurde von Ana eingeladen."], a: 0 },
          { s: "The boxes are sent to shops.", o: ["Die Kisten werden an Läden geschickt.", "Die Kisten schicken an Läden.", "Die Kisten wurden an Läden geschickt."], a: 0 }
        ], mischen: true },
      { typ: "markieren", t: "Markiere is/are/was/were orange und das Partizip blau.", stifte: [["o", "is/are/was/were"], ["b", "Partizip"]], tipp: "Das Partizip steht direkt nach is/are/was/were.",
        items: ["The kiwis [o:are] [b:packed] by hand.", "The letter [o:was] [b:written] by Ana.", "The applications [o:are] [b:checked] by Mrs Tipene.", "The club [o:was] [b:founded] by two parents."] },
      { typ: "paare", t: "Verbinde den Aktivsatz mit dem Passivsatz, der dasselbe sagt.", tipp: "Achte auf das Verb und darauf, wer etwas tut.",
        paare: [["Mrs Tipene checks the CVs.", "The CVs are checked by Mrs Tipene."], ["Workers pack the kiwis.", "The kiwis are packed by workers."],
                ["Ana wrote the letter.", "The letter was written by Ana."], ["A parent founded the club.", "The club was founded by a parent."]] },
      { typ: "luecke", t: "Setze aus dem Wortkasten die passende Passivform ein. Jede Form passt genau einmal: is made · are sold · was built · were invited · is checked · was founded.", tipp: "Singular oder Plural? Gegenwart oder Vergangenheit? Was ergibt Sinn?",
        items: ["The jam [[is made]] from fresh fruit.", "Fresh kiwis [[are sold]] at the market every Saturday.", "The wooden hut for the club [[was built]] last summer.",
                "Ten students [[were invited]] to the interview yesterday.", "Every CV [[is checked]] by Mrs Tipene before the interview.", "The club [[was founded]] by two parents a long time ago."] },
      { typ: "luecke", t: "Wähle is, are, was oder were.", tipp: "Passt das Wort zu Singular oder Plural? Gegenwart oder Vergangenheit?",
        items: ["The kiwis {{are|is|was}} packed by hand every day.", "The letter {{was|were|are}} written yesterday.", "Two apprentices {{were|was|is}} invited to the club last week.", "The office {{is|are|were}} cleaned every evening."] },
      { typ: "wahl", t: "Wähle die richtige Antwort.",
        items: [
          { s: "Which sentence is passive?", o: ["The shop is opened at eight.", "The shop opens at eight.", "Mrs Tipene opens the shop at eight."], a: 0 },
          { s: "Which sentence says the same as: Mrs Tipene invited Ana?", o: ["Ana was invited by Mrs Tipene.", "Ana invited Mrs Tipene.", "Ana is invited by Mrs Tipene."], a: 0 },
          { s: "Which sentence is about the past?", o: ["The boxes were sent to the shop.", "The boxes are sent to the shop.", "The boxes send to the shop."], a: 0 }
        ], mischen: true },
      { typ: "frei", t: "Und du? Schreibe auf Deutsch, was dieser Satz bedeutet: The old hall was used by the club for many years.", tipp: "Wer tut etwas? In welcher Zeit steht der Satz?",
        items: [{ f: "Was bedeutet: The old hall was used by the club for many years.", kriterien: ["auf Deutsch", "sagt, dass der Verein die alte Halle viele Jahre benutzt hat (Vergangenheit)"],
                  muster: "(benutz|genutzt|verwendet|gebraucht)", bsp: "Die alte Halle wurde viele Jahre lang vom Verein benutzt." }] }
    ],
    plus: [
      { typ: "umformen", t: "Mache aus dem Aktivsatz einen Passivsatz.", tipp: "Objekt nach vorn · is/are/was/were + Partizip · alter Handelnder mit by ans Ende",
        items: [
          { s: "Mrs Tipene checks the CVs.", l: ["The CVs are checked by Mrs Tipene."] },
          { s: "Ana wrote the letter.", l: ["The letter was written by Ana."] },
          { s: "The club invited Wiremu.", l: ["Wiremu was invited by the club."] }
        ] },
      { typ: "bauen", t: "Baue die Passivsätze.", tipp: "Objekt · is/are/was/were · Partizip · by + Handelnder",
        items: [{ teile: ["The kiwis", "are", "packed", "by hand."] }, { teile: ["The interview", "was", "organised", "by Mrs Tipene."], l: ["The interview was organized by Mrs Tipene."] }] },
      { typ: "luecke", t: "Bilde das Passiv mit dem Verb in Klammern.", tipp: "Zeitangabe beachten: every day → is/are · yesterday, last week → was/were",
        items: ["Every day the post [[is collected]] by a driver. (collect)", "The hall [[was cleaned]] after the party. (clean)", "The boxes [[are loaded]] onto the lorry every morning. (load)"] }
    ]
  });
  </script>
