<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><meta name="theme-color" content="#8a2434"><title>Meine Merkliste | GRUMI</title>
  <link rel="stylesheet" href="7M/Deutsch/probe.css">
  <style>
    .m-zahlen{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
    .m-zahl{flex:1 1 130px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
    .m-zahl b{display:block;font-size:1.7rem;line-height:1.1}.m-zahl span{font-size:.82rem;color:var(--muted);font-weight:700}
    .m-zahl.offen b{color:var(--pri-d)}.m-zahl.gut b{color:var(--ok)}
    .m-balken{height:10px;border-radius:99px;background:#eee3e5;overflow:hidden;margin:4px 0 14px}.m-balken i{display:block;height:100%;background:var(--ok);transition:width .3s}
    .m-leiste{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
    .m-karte{background:#fff;border:2px solid var(--pri);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 26px rgba(138,36,52,.10)}
    .m-karte .m-nr{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .m-karte .m-frage{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;line-height:1.2;margin:6px 0 2px;overflow-wrap:anywhere}
    .m-karte .m-hinweis{color:var(--muted);font-size:.92rem;margin:0 0 10px}
    .m-eingabe{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .m-eingabe input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.2rem;font-weight:700;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px}
    .m-eingabe input:focus{outline:3px solid #f2c9cf;border-color:var(--pri)}
    .m-rueck{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700;line-height:1.45}
    .m-rueck.gut{background:var(--ok-l);color:#14693a}.m-rueck.nein{background:var(--bad-l);color:#9c2626}
    .m-rueck .m-loesung{display:block;font-size:1.25rem;margin-top:2px;color:var(--ink)}.m-rueck small{display:block;font-weight:600;margin-top:3px}
    .m-punkte{display:inline-flex;gap:4px;vertical-align:middle}.m-punkte i{width:11px;height:11px;border-radius:50%;border:2px solid #c9b9bc;display:inline-block}.m-punkte i.an{background:var(--ok);border-color:var(--ok)}
    .m-tab{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:.98rem;margin-top:6px}
    .m-tab th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;text-align:left;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
    .m-tab td{padding:7px 10px;border-bottom:1px solid #f0e6e8;vertical-align:top;overflow-wrap:anywhere}
    .m-tab .en{font-weight:800}.m-tab .falsch{color:#9c2626}.m-tab small{display:block;color:var(--muted)}
    .m-tab td.m-stand{white-space:nowrap;text-align:right}
    .m-h2{font-size:1.1rem;margin:22px 0 4px}
    details.m-gelernt{margin-top:18px}details.m-gelernt summary{cursor:pointer;font-weight:800;color:var(--ok)}
    @media (max-width:560px){.m-tab{font-size:.9rem}.m-tab td,.m-tab th{padding:5px 6px}.m-tab .wo{display:none}}
    @media print{.kein-druck,.topbar,.m-karte,.m-zahlen,.m-balken{display:none!important}body{background:#fff}.m-tab{font-size:10pt}.m-tab td{padding:3pt 6pt}details.m-gelernt[open] summary{color:#000}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">GRUMI <span>Englisch</span></a><span class="top-tag">Meine Merkliste</span></header>
  <main class="schmal">
    <section id="anmelden" class="unit-section" hidden>
      <div class="eyebrow">Englisch · Vokabeln</div>
      <h1>Meine Merkliste</h1>
      <p>Gib deinen Code ein. Nur mit deinem Code siehst du deine Merkliste.</p>
      <form id="code-form" class="identity-grid">
        <label class="field">Dein Code<input name="code" id="code" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" placeholder="3 Ziffern" title="3 Ziffern" autocomplete="off" required></label>
        <button class="btn" type="submit">Merkliste öffnen</button>
      </form>
    </section>
    <p id="status" class="notice" role="status" hidden></p>
    <section id="merk" hidden></section>
  </main>
  <script src="js/vokabel-merkliste.js"></script>
</body>
</html>
