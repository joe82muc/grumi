<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P3: In Werk 1 fallen Kunststoffkörnchen in Säcke, ein Lastwagen bringt sie zu Werk 2, dort werden sie geschmolzen und es kommen Eimer und Schüsseln heraus. -->
  <style>
    .korn{animation:korn .9s linear infinite}
    @keyframes korn{from{transform:translateY(-4px);opacity:1}to{transform:translateY(28px);opacity:0}}
    .rauch{animation:rauch 3s linear infinite}
    @keyframes rauch{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.7}100%{transform:translateY(-40px) scale(1.3);opacity:0}}
    .lkw{animation:lkw 12s infinite}
    @keyframes lkw{0%,14%{transform:none}44%,95%{transform:translateX(150px)}100%{transform:none}}
    .ladung{animation:ladung 12s infinite}
    @keyframes ladung{0%,46%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    .glut{animation:glut 12s infinite}
    @keyframes glut{0%,48%{fill:#33414d}56%,95%{fill:#e8731c}100%{fill:#33414d}}
    .e1{animation:e1 12s infinite}.e2{animation:e2 12s infinite}.e3{animation:e3 12s infinite}
    @keyframes e1{0%,58%{transform:translateX(-30px);opacity:0}64%,95%{transform:none;opacity:1}100%{opacity:0}}
    @keyframes e2{0%,68%{transform:translateX(-30px);opacity:0}74%,95%{transform:none;opacity:1}100%{opacity:0}}
    @keyframes e3{0%,78%{transform:translateX(-30px);opacity:0}84%,95%{transform:none;opacity:1}100%{opacity:0}}
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#eaf5fb"/>

  <rect y="262" width="640" height="38" fill="#c9d3db"/><rect y="266" width="640" height="12" fill="#8e98a1"/>
  <line x1="0" y1="272" x2="640" y2="272" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 12"/>
  <rect x="40" y="70" width="18" height="52" fill="#9aa9b5"/>
  <circle class="rauch" cx="49" cy="62" r="10" fill="#c9d3db"/><circle class="rauch" style="animation-delay:-1.5s" cx="49" cy="62" r="10" fill="#c9d3db"/>
  <path d="M18 262 V120 L58 100 V120 L98 100 V120 L138 100 V120 L172 104 V262 Z" fill="#d9e3ea" stroke="#7d8a94" stroke-width="2"/>
  <rect x="58" y="134" width="76" height="26" rx="4" fill="#ffffff" stroke="#7d8a94"/><text x="96" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">Werk 1</text>
  <rect x="34" y="186" width="34" height="76" fill="#9aa9b5"/>
  <rect x="150" y="176" width="44" height="12" fill="#8e98a1" stroke="#5f6870"/><rect x="180" y="176" width="12" height="22" fill="#8e98a1" stroke="#5f6870"/>
  <circle class="korn" style="animation-delay:0s" cx="181" cy="198" r="2.6" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle class="korn" style="animation-delay:-0.3s" cx="189" cy="198" r="2.6" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle class="korn" style="animation-delay:-0.6s" cx="185" cy="198" r="2.6" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle class="korn" style="animation-delay:-0.45s" cx="192" cy="198" r="2.6" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle class="korn" style="animation-delay:-0.15s" cx="180" cy="198" r="2.6" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/>
  <path d="M168 262 Q165 230 174 222 H198 Q207 230 204 262 Z" fill="#e9d8b4" stroke="#a8874f" stroke-width="2"/><path d="M176 224 q10 6 20 0" fill="none" stroke="#a8874f" stroke-width="2"/>
  <g class="lkw">
    <g class="ladung"><path d="M214 222 Q211 190 220 182 H244 Q253 190 250 222 Z" fill="#e9d8b4" stroke="#a8874f" stroke-width="2"/><path d="M222 184 q10 6 20 0" fill="none" stroke="#a8874f" stroke-width="2"/><path d="M252 222 Q249 190 258 182 H282 Q291 190 288 222 Z" fill="#e9d8b4" stroke="#a8874f" stroke-width="2"/><path d="M260 184 q10 6 20 0" fill="none" stroke="#a8874f" stroke-width="2"/></g>
    <rect x="208" y="222" width="86" height="24" fill="#2f8fd8" stroke="#1f6aa5" stroke-width="2"/>
    <path d="M294 246 V214 Q294 206 302 206 H318 L332 224 V246 Z" fill="#e8453c" stroke="#a52a23" stroke-width="2"/><path d="M302 212 H316 L326 224 H302 Z" fill="#cfe8f7"/>
    <circle cx="232" cy="254" r="10" fill="#33414d"/><circle cx="312" cy="254" r="10" fill="#33414d"/><circle cx="232" cy="254" r="4" fill="#c3ccd3"/><circle cx="312" cy="254" r="4" fill="#c3ccd3"/>
  </g>
  <path d="M484 262 V118 H630 V262 Z" fill="#e3e9ee" stroke="#7d8a94" stroke-width="2"/><path d="M478 120 L557 92 L636 120" fill="#c3ccd3" stroke="#7d8a94" stroke-width="2"/>
  <rect x="520" y="128" width="76" height="26" rx="4" fill="#ffffff" stroke="#7d8a94"/><text x="558" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">Werk 2</text>
  <rect class="glut" x="500" y="164" width="60" height="44" rx="4" stroke="#15212b" stroke-width="2"/>
  <path class="flamme" d="M530 200 Q542 188 534 172 Q530 182 524 178 Q518 190 530 200 Z" fill="#f6c343" opacity=".9"/>
  <rect x="560" y="180" width="26" height="12" fill="#8e98a1" stroke="#5f6870"/>
  <rect x="488" y="242" width="138" height="8" rx="4" fill="#59636b"/>
  <g fill="#c3ccd3" stroke="#59636b"><circle cx="498" cy="246" r="4"/><circle cx="557" cy="246" r="4"/><circle cx="616" cy="246" r="4"/></g>
  <g class="e1"><path d="M499 218 H525 L521 242 H503 Z" fill="#2f8fd8" stroke="#1f6aa5" stroke-width="2"/><path d="M500 219 Q512 202 524 219" fill="none" stroke="#33414d" stroke-width="2"/></g><g class="e2"><path d="M539 226 H573 Q571 242 556 242 Q541 242 539 226 Z" fill="#f6d16b" stroke="#b48a1c" stroke-width="2"/></g><g class="e3"><path d="M587 218 H613 L609 242 H591 Z" fill="#2f8fd8" stroke="#1f6aa5" stroke-width="2"/><path d="M588 219 Q600 202 612 219" fill="none" stroke="#33414d" stroke-width="2"/></g>
</svg>
