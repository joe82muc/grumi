<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .perle{fill:#fff;opacity:.8;animation:hoch 3s ease-in infinite}
    .p2{animation-delay:1s}.p3{animation-delay:2s}
    @keyframes hoch{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-14px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.perle{animation:none}}
  </style>
  <defs>
    <!-- Bereich unter der gewölbten Deckschicht: Hier sammeln sich die Stoffe -->
    <clipPath id="unterDecke"><path d="M0 228 Q230 68 460 228 V300 H0Z"/></clipPath>
  </defs>
  <rect width="460" height="300" fill="#d8eefb"/>
  <rect y="30" width="460" height="270" fill="#cdb38c"/>
  <rect y="24" width="460" height="10" fill="#7cb85a"/>
  <path d="M0 150 Q230 0 460 150 V300 H0Z" fill="#bea47b"/>
  <!-- Speichergestein unter der Deckschicht -->
  <path d="M0 228 Q230 68 460 228 V300 H0Z" fill="#d9c7a3"/>
  <!-- Erdgas, Erdöl, Wasser mit waagrechten Grenzen -->
  <g clip-path="url(#unterDecke)">
    <rect x="0" y="130" width="460" height="42" fill="#eef6ff"/>
    <rect x="0" y="172" width="460" height="28" fill="#2a2018"/>
    <rect x="0" y="200" width="460" height="20" fill="#7cc3e8" opacity=".6"/>
  </g>
  <!-- gewölbte, undurchlässige Deckschicht -->
  <path d="M0 200 Q230 40 460 200 V228 Q230 68 0 228Z" fill="#6f5a43"/>
  <circle class="perle" cx="210" cy="166" r="3"/><circle class="perle p2" cx="245" cy="168" r="2.5"/><circle class="perle p3" cx="228" cy="164" r="2"/>
  <!-- Beschriftungen -->
  <g font-size="20" font-weight="900" fill="#fff" text-anchor="middle">
    <line x1="260" y1="160" x2="408" y2="68" stroke="#1f5f99" stroke-width="3"/><circle cx="420" cy="60" r="18" fill="#1f5f99"/><text x="420" y="67">A</text>
    <line x1="260" y1="186" x2="408" y2="262" stroke="#1f5f99" stroke-width="3"/><circle cx="420" cy="268" r="18" fill="#1f5f99"/><text x="420" y="275">B</text>
    <line x1="100" y1="160" x2="46" y2="76" stroke="#1f5f99" stroke-width="3"/><circle cx="38" cy="66" r="18" fill="#1f5f99"/><text x="38" y="73">C</text>
  </g>
</svg>
