<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P2: Modell – acht einzelne Büroklammern haken sich nacheinander zu einer langen Kette aneinander. -->
  <style>
    .c1{animation:c1 12s infinite}.c2{animation:c2 12s infinite}.c3{animation:c3 12s infinite}
    @keyframes c1{0%,0%{opacity:0}2%,20%{opacity:1}23%,100%{opacity:0}} @keyframes c2{0%,22%{opacity:0}25%,62%{opacity:1}65%,100%{opacity:0}} @keyframes c3{0%,64%{opacity:0}68%,95%{opacity:1}100%{opacity:0}}
    .k0{animation:k0 12s infinite}
    @keyframes k0{0%,22%{transform:translate(70px,70px) rotate(-30deg)}27%,95%{transform:translate(90px,112px) rotate(-5deg)}100%{transform:translate(70px,70px) rotate(-30deg)}}
    .k1{animation:k1 12s infinite}
    @keyframes k1{0%,27%{transform:translate(200px,160px) rotate(20deg)}32%,95%{transform:translate(138px,117px) rotate(5deg)}100%{transform:translate(200px,160px) rotate(20deg)}}
    .k2{animation:k2 12s infinite}
    @keyframes k2{0%,32%{transform:translate(300px,60px) rotate(65deg)}37%,95%{transform:translate(186px,112px) rotate(-5deg)}100%{transform:translate(300px,60px) rotate(65deg)}}
    .k3{animation:k3 12s infinite}
    @keyframes k3{0%,37%{transform:translate(430px,150px) rotate(-15deg)}42%,95%{transform:translate(234px,117px) rotate(5deg)}100%{transform:translate(430px,150px) rotate(-15deg)}}
    .k4{animation:k4 12s infinite}
    @keyframes k4{0%,42%{transform:translate(530px,60px) rotate(40deg)}47%,95%{transform:translate(282px,112px) rotate(-5deg)}100%{transform:translate(530px,60px) rotate(40deg)}}
    .k5{animation:k5 12s infinite}
    @keyframes k5{0%,47%{transform:translate(130px,140px) rotate(75deg)}52%,95%{transform:translate(330px,117px) rotate(5deg)}100%{transform:translate(130px,140px) rotate(75deg)}}
    .k6{animation:k6 12s infinite}
    @keyframes k6{0%,52%{transform:translate(350px,180px) rotate(-50deg)}57%,95%{transform:translate(378px,112px) rotate(-5deg)}100%{transform:translate(350px,180px) rotate(-50deg)}}
    .k7{animation:k7 12s infinite}
    @keyframes k7{0%,57%{transform:translate(470px,90px) rotate(10deg)}62%,95%{transform:translate(426px,117px) rotate(5deg)}100%{transform:translate(470px,90px) rotate(10deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="220" fill="#f6f9fb"/>

  <g class="k0"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k1"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k2"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k3"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k4"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k5"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k6"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="k7"><path d="M46 4 H9 A7 7 0 0 0 9 18 H52 A5 5 0 0 0 52 8 H15 A3 3 0 0 0 15 14 H42" fill="none" stroke="#6b7a86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g font-size="17" font-weight="700" fill="#0a5a66" text-anchor="middle">
    <text class="c1" x="320" y="30">einzelne Büroklammern</text>
    <text class="c2" x="320" y="30">die Klammern haken sich nacheinander aneinander</text>
    <text class="c3" x="320" y="30">eine lange Kette</text>
  </g>
  <g class="c3"><text x="510" y="132" font-size="34" font-weight="700" fill="#6b7a86">…</text><text x="320" y="200" text-anchor="middle" font-size="13" fill="#566674">Die Kette geht in Wirklichkeit noch viel, viel weiter.</text></g>
</svg>
