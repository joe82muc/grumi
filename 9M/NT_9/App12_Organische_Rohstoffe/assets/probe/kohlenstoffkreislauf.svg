<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .fluss{stroke-dasharray:7 7;animation:fliess 1.4s linear infinite}
    @keyframes fliess{to{stroke-dashoffset:-14}}
    .rauch{fill:#9aa3ad;animation:steig 3s ease-out infinite}.r2{animation-delay:1s}.r3{animation-delay:2s}
    @keyframes steig{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-26px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.fluss,.rauch{animation:none}}
  </style>
  <defs>
    <marker id="kopf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1f5f99"/></marker>
  </defs>
  <rect width="460" height="300" fill="#e8f4fc"/>
  <rect y="232" width="460" height="68" fill="#a7cf7e"/>
  <rect y="256" width="460" height="44" fill="#a0784f"/>
  <!-- CO2 in der Luft -->
  <g fill="#fff" stroke="#c9d6e2" stroke-width="2">
    <ellipse cx="200" cy="52" rx="44" ry="24"/><ellipse cx="250" cy="40" rx="48" ry="28"/><ellipse cx="295" cy="56" rx="40" ry="22"/>
  </g>
  <rect x="176" y="46" width="146" height="26" fill="#fff"/>
  <text x="248" y="60" text-anchor="middle" font-size="15" font-weight="800" fill="#15212b">CO₂ in der Luft</text>
  <!-- Baum -->
  <rect x="64" y="168" width="14" height="66" fill="#6b4a2b"/>
  <circle cx="71" cy="150" r="38" fill="#3f8f3a"/><circle cx="48" cy="166" r="20" fill="#4ea047"/><circle cx="96" cy="164" r="20" fill="#4ea047"/>
  <!-- Mensch -->
  <g stroke="#15212b" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="165" cy="176" r="10" fill="#f2c9a0"/><line x1="165" y1="186" x2="165" y2="212"/><line x1="165" y1="194" x2="152" y2="206"/><line x1="165" y1="194" x2="178" y2="206"/><line x1="165" y1="212" x2="156" y2="232"/><line x1="165" y1="212" x2="174" y2="232"/>
  </g>
  <!-- abgestorbene Blätter am Boden -->
  <ellipse cx="292" cy="236" rx="36" ry="10" fill="#8a5a2b"/>
  <g fill="#c07a2f"><path d="M268 230 q8 -8 16 0 q-8 6 -16 0z"/><path d="M292 226 q8 -8 16 0 q-8 6 -16 0z"/><path d="M304 233 q7 -7 14 0 q-7 5 -14 0z"/></g>
  <g fill="#f4ecd8"><circle cx="280" cy="240" r="1.6"/><circle cx="298" cy="242" r="1.6"/><circle cx="312" cy="239" r="1.6"/></g>
  <!-- Fabrik mit Schornstein -->
  <rect x="362" y="186" width="74" height="48" fill="#8b96a3"/>
  <path d="M362 186 l18 -14 v14 l18 -14 v14 l18 -14 v14z" fill="#76818e"/>
  <rect x="408" y="128" width="14" height="58" fill="#5f6b78"/>
  <circle class="rauch" cx="415" cy="120" r="7"/><circle class="rauch r2" cx="420" cy="118" r="6"/><circle class="rauch r3" cx="412" cy="117" r="5"/>
  <!-- Pfeile 1 bis 4 -->
  <g stroke="#1f5f99" stroke-width="4" fill="none" marker-end="url(#kopf)">
    <path class="fluss" d="M168 72 Q120 82 100 112"/>
    <path class="fluss" d="M170 162 Q176 120 200 84"/>
    <path class="fluss" d="M290 222 Q290 150 264 90"/>
    <path class="fluss" d="M414 104 Q400 70 340 60"/>
  </g>
  <g font-size="18" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="116" cy="74" r="15" fill="#1f5f99"/><text x="116" y="80">1</text>
    <circle cx="160" cy="118" r="15" fill="#1f5f99"/><text x="160" y="124">2</text>
    <circle cx="306" cy="156" r="15" fill="#1f5f99"/><text x="306" y="162">3</text>
    <circle cx="392" cy="56" r="15" fill="#1f5f99"/><text x="392" y="62">4</text>
  </g>
</svg>
