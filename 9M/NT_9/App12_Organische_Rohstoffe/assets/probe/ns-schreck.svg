<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="640" height="304" font-family="Arial, Helvetica, sans-serif">
  <style>
    .rad{transform:translate(388px,87px);animation:rad 10s infinite}
    @keyframes rad{0%{transform:translate(30px,87px);opacity:0}3%{opacity:1;transform:translate(40px,87px)}24%{transform:translate(310px,87px);animation-timing-function:ease-out}31%,72%{transform:translate(388px,87px)}93%{transform:translate(680px,87px);opacity:1}94%,100%{transform:translate(680px,87px);opacity:0}}
    .tuer{transform-origin:468px 122px;transform:rotate(55deg);animation:tuer 10s infinite}
    @keyframes tuer{0%,21%{transform:none}25%,66%{transform:rotate(55deg)}71%,100%{transform:none}}
    .ruf{opacity:1;animation:ruf 10s infinite} @keyframes ruf{0%,23%{opacity:0}25%,60%{opacity:1}62%,100%{opacity:0}}
    .hs{animation:hs 10s infinite} @keyframes hs{0%,24%{opacity:0}26%,72%{opacity:1}74%,100%{opacity:0}}
    .hr{opacity:0;animation:hr 10s infinite}
    @keyframes hr{0%,24%{opacity:1}26%,72%{opacity:0}74%,100%{opacity:1}}
    .schlag1{transform-box:fill-box;transform-origin:center;animation:schlag .34s ease-in-out infinite alternate}
    .schlag2{transform-box:fill-box;transform-origin:center;animation:schlag 1.1s ease-in-out infinite alternate}
    @keyframes schlag{from{transform:scale(.88)}to{transform:scale(1.08)}}
    .pu{transform-box:fill-box;transform-origin:center;transform:scale(1.9);animation:pu 10s infinite}
    @keyframes pu{0%,25%{transform:none}29%,70%{transform:scale(1.9)}76%,100%{transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
