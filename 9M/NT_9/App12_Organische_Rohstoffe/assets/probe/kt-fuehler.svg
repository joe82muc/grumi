    <path d="M253 228 H292 M253 236 H292" stroke="#9aa5ad" stroke-width="3"/><circle cx="292" cy="228" r="3.5" fill="#7d8a96"/><circle cx="292" cy="236" r="3.5" fill="#7d8a96"/>
