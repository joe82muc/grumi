  <text x="264" y="84" text-anchor="middle" font-size="26" font-weight="700" fill="#144a74" class="t1">20 °C</text><text x="264" y="84" text-anchor="middle" font-size="26" font-weight="700" fill="#c0392b" class="t2">60 °C</text>
  <rect x="196" y="110" width="104" height="164" rx="10" fill="#e9d3a8" stroke="#b48a5a" stroke-width="2.5"/>
