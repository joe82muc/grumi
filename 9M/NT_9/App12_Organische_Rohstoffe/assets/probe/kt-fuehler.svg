<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t1{opacity:0;animation:t1 12s infinite}.t2{animation:t2 12s infinite}
    @keyframes t1{0%{opacity:1}40%{opacity:1}41.5%{opacity:0}100%{opacity:0}} @keyframes t2{0%{opacity:0}48.5%{opacity:0}50%{opacity:1}95%{opacity:1}96.5%{opacity:0}100%{opacity:0}}
    .f1{animation:f1 12s infinite}
    @keyframes f1{0%{opacity:0}32.5%{opacity:0}34%{opacity:1}95%{opacity:1}96.5%{opacity:0}100%{opacity:0}}
    .p1{animation:p1 12s infinite}.p2{animation:p2 12s infinite}
    @keyframes p1{0%{opacity:0}6.5%{opacity:0}8%{opacity:1}97%{opacity:1}98.5%{opacity:0}100%{opacity:0}} @keyframes p2{0%{opacity:0}50.5%{opacity:0}52%{opacity:1}97%{opacity:1}98.5%{opacity:0}100%{opacity:0}}
    .luft{stroke-dasharray:8 7;animation:luft .6s linear infinite}
    @keyframes luft{to{stroke-dashoffset:-15}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="338" fill="#f6f9fb"/>
  <rect y="282" width="640" height="56" fill="#e7dcc6"/>
  <rect x="184" y="30" width="160" height="66" rx="10" fill="#fff" stroke="#9cc3e0" stroke-width="2"/>
