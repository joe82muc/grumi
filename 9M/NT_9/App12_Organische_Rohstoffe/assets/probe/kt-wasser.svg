    .d2{transform-box:fill-box;transform-origin:center;transform:rotate(90deg);animation:d2 12s infinite}
    @keyframes d2{0%,22%{transform:rotate(0)}27%,70%{transform:rotate(90deg)}75%,100%{transform:rotate(0)}}
    .q1{animation:q1 12s infinite}.q2{animation:q2 12s infinite}
    @keyframes q1{0%{opacity:0}13.5%{opacity:0}15%{opacity:1}71%{opacity:1}72.5%{opacity:0}100%{opacity:0}} @keyframes q2{0%{opacity:0}26.5%{opacity:0}28%{opacity:1}71%{opacity:1}72.5%{opacity:0}100%{opacity:0}}
    .n1{opacity:0;animation:n1 12s infinite}.n2{opacity:0;animation:n2 12s infinite}
    @keyframes n1{0%{opacity:1}13%{opacity:1}14.5%{opacity:0}72.5%{opacity:0}74%{opacity:1}100%{opacity:1}} @keyframes n2{0%{opacity:1}26%{opacity:1}27.5%{opacity:0}72.5%{opacity:0}74%{opacity:1}100%{opacity:1}}
    .l1{transform-box:fill-box;transform-origin:left center;animation:l1 12s infinite}
    @keyframes l1{0%,13%{transform:scaleX(0)}16%,71%{transform:scaleX(1)}74%,100%{transform:scaleX(0)}}
    .l2{transform-box:fill-box;transform-origin:left center;animation:l2 12s infinite}
    @keyframes l2{0%,26%{transform:scaleX(0)}31%,71%{transform:scaleX(1)}74%,100%{transform:scaleX(0)}}
    .fl{stroke-dasharray:7 9;animation:fl .7s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
