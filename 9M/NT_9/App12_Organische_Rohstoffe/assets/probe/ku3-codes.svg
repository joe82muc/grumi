<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P1: Shampooflasche mit Recycling-Code 02 PE-HD und Plastiktüte mit 04 PE-LD; eine Lupe zeigt die Zeichen, die Flasche bleibt beim Drücken fest, die Tüte lässt sich knüllen. -->
  <style>
    .lupe{animation:lupe 11s infinite}
    @keyframes lupe{0%,4%{transform:translate(170px,218px);opacity:0}8%,26%{transform:translate(170px,218px);opacity:1}36%,48%{transform:translate(470px,203px);opacity:1}54%,100%{transform:translate(470px,203px);opacity:0}}
    .druck{animation:druck 11s infinite}
    @keyframes druck{0%,54%{transform:translateX(70px);opacity:0}58%{transform:translateX(70px);opacity:1}66%,78%{transform:none;opacity:1}86%,100%{transform:translateX(70px);opacity:0}}
    .flasche{transform-box:fill-box;transform-origin:50% 100%;animation:flasche 11s infinite}
    @keyframes flasche{0%,64%{transform:none}68%,76%{transform:scaleX(.97)}80%,100%{transform:none}}
    .tuete{transform-box:fill-box;transform-origin:50% 100%;animation:tuete 11s infinite}
    @keyframes tuete{0%,58%{transform:none}70%,95%{transform:scale(.7,.55) rotate(-4deg)}100%{transform:none}}
    .falten{animation:falten 11s infinite} @keyframes falten{0%,66%{opacity:0}70%,95%{opacity:1}100%{opacity:0}}
    .t1{animation:t1 11s infinite}.t2{animation:t2 11s infinite}
    @keyframes t1{0%,66%{opacity:0}70%,95%{opacity:1}100%{opacity:0}} @keyframes t2{0%,68%{opacity:0}72%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#f6f9fb"/>

  <g class="flasche">
    <rect x="150" y="64" width="40" height="30" fill="#f7d9e8" stroke="#b5577f" stroke-width="2.5"/>
    <rect x="144" y="44" width="52" height="24" rx="5" fill="#b5577f"/>
    <rect x="120" y="90" width="100" height="182" rx="22" fill="#f7d9e8" stroke="#b5577f" stroke-width="2.5"/>
    <rect x="130" y="112" width="80" height="44" rx="6" fill="#ffffff"/><text x="170" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#b5577f">Shampoo</text>
    <g transform="translate(137 182) scale(0.66)"><g fill="none" stroke="#15212b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><line x1="55.0" y1="16.7" x2="80.2" y2="60.1"/><polyline points="72.3,55.8 80.2,60.1 80.5,51.1"/><line x1="75.9" y1="70.0" x2="25.5" y2="70.0"/><polyline points="33.2,65.3 25.5,70.0 33.2,74.7"/><line x1="19.0" y1="61.3" x2="44.2" y2="17.9"/><polyline points="44.5,26.9 44.2,17.9 36.3,22.2"/></g><text x="50" y="55" text-anchor="middle" font-size="20" font-weight="800" fill="#15212b">02</text><text x="50" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="#15212b">PE-HD</text></g>
  </g>
  <g class="druck"><path d="M290 214 L234 214" stroke="#7aa6c9" stroke-width="22" stroke-linecap="round"/><ellipse cx="232" cy="214" rx="14" ry="17" fill="#f2c7a5" stroke="#b98a68" stroke-width="2"/></g>
  <g class="tuete">
    <path d="M425 112 Q440 58 455 112 M485 112 Q500 58 515 112" fill="none" stroke="#7fa7c4" stroke-width="6" stroke-linecap="round"/>
    <path d="M408 110 H532 L544 272 H396 Z" fill="#eaf4fb" stroke="#7fa7c4" stroke-width="2.5"/>
    <g transform="translate(437 166) scale(0.66)"><g fill="none" stroke="#15212b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><line x1="55.0" y1="16.7" x2="80.2" y2="60.1"/><polyline points="72.3,55.8 80.2,60.1 80.5,51.1"/><line x1="75.9" y1="70.0" x2="25.5" y2="70.0"/><polyline points="33.2,65.3 25.5,70.0 33.2,74.7"/><line x1="19.0" y1="61.3" x2="44.2" y2="17.9"/><polyline points="44.5,26.9 44.2,17.9 36.3,22.2"/></g><text x="50" y="55" text-anchor="middle" font-size="20" font-weight="800" fill="#15212b">04</text><text x="50" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="#15212b">PE-LD</text></g>
    <g class="falten" fill="none" stroke="#7fa7c4" stroke-width="2"><path d="M410 140 l30 20 l-12 18 l26 14"/><path d="M528 150 l-24 16 l14 20 l-28 12"/><path d="M420 240 l40 -12 l30 14 l36 -10"/></g>
  </g>
  <g class="lupe"><circle cx="0" cy="0" r="46" fill="#ffffff" fill-opacity=".2" stroke="#33414d" stroke-width="6"/><line x1="33" y1="33" x2="66" y2="66" stroke="#33414d" stroke-width="11" stroke-linecap="round"/></g>
  <text x="170" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#0a5a66" class="t1">bleibt fest</text>
  <text x="470" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#0a5a66" class="t2">lässt sich zusammenknüllen</text>
</svg>
