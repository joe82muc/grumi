<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" width="640" height="274" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P4: Balkendiagramm zur Verwertung von Kunststoffabfall in Deutschland – Balken A 46,4 Prozent, Balken B 52,8 Prozent, Balken C 0,2 Prozent; der Rest von 0,6 Prozent kommt auf die Deponie. -->
  <style>
    .b0,.b1,.b2{transform-origin:80px 0}
    .b0{animation:b0 10s infinite}@keyframes b0{0%,8%{transform:scaleX(0)}20%,95%{transform:none}100%{transform:scaleX(0)}}
    .w0{animation:w0 10s infinite}@keyframes w0{0%,17%{opacity:0}21%,95%{opacity:1}100%{opacity:0}}
    .b1{animation:b1 10s infinite}@keyframes b1{0%,22%{transform:scaleX(0)}34%,95%{transform:none}100%{transform:scaleX(0)}}
    .w1{animation:w1 10s infinite}@keyframes w1{0%,31%{opacity:0}35%,95%{opacity:1}100%{opacity:0}}
    .b2{animation:b2 10s infinite}@keyframes b2{0%,36%{transform:scaleX(0)}48%,95%{transform:none}100%{transform:scaleX(0)}}
    .w2{animation:w2 10s infinite}@keyframes w2{0%,45%{opacity:0}49%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="274" fill="#f6f9fb"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Wie wird Kunststoffabfall in Deutschland verwertet?</text>
  <g stroke="#e1e8ee" stroke-width="1"><line x1="160" y1="48" x2="160" y2="212"/><line x1="240" y1="48" x2="240" y2="212"/><line x1="320" y1="48" x2="320" y2="212"/><line x1="400" y1="48" x2="400" y2="212"/><line x1="480" y1="48" x2="480" y2="212"/><line x1="560" y1="48" x2="560" y2="212"/></g>
  <text x="50" y="82" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">A</text><rect class="b0" x="80" y="58" width="371.2" height="34" rx="3" fill="#5b8fb9"/><text x="461.2" y="81" font-size="15" font-weight="700" fill="#15212b" class="w0">46,4 %</text><text x="50" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">B</text><rect class="b1" x="80" y="110" width="422.4" height="34" rx="3" fill="#5b8fb9"/><text x="512.4" y="133" font-size="15" font-weight="700" fill="#15212b" class="w1">52,8 %</text><text x="50" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">C</text><rect class="b2" x="80" y="162" width="3" height="34" rx="3" fill="#5b8fb9"/><text x="93" y="185" font-size="15" font-weight="700" fill="#15212b" class="w2">0,2 %</text>
  <line x1="80" y1="216" x2="560" y2="216" stroke="#566674" stroke-width="1.5"/><line x1="80" y1="212" x2="80" y2="220" stroke="#566674" stroke-width="1.5"/><text x="80" y="236" text-anchor="middle" font-size="12" fill="#566674">0 %</text><line x1="160" y1="212" x2="160" y2="220" stroke="#566674" stroke-width="1.5"/><text x="160" y="236" text-anchor="middle" font-size="12" fill="#566674">10 %</text><line x1="240" y1="212" x2="240" y2="220" stroke="#566674" stroke-width="1.5"/><text x="240" y="236" text-anchor="middle" font-size="12" fill="#566674">20 %</text><line x1="320" y1="212" x2="320" y2="220" stroke="#566674" stroke-width="1.5"/><text x="320" y="236" text-anchor="middle" font-size="12" fill="#566674">30 %</text><line x1="400" y1="212" x2="400" y2="220" stroke="#566674" stroke-width="1.5"/><text x="400" y="236" text-anchor="middle" font-size="12" fill="#566674">40 %</text><line x1="480" y1="212" x2="480" y2="220" stroke="#566674" stroke-width="1.5"/><text x="480" y="236" text-anchor="middle" font-size="12" fill="#566674">50 %</text><line x1="560" y1="212" x2="560" y2="220" stroke="#566674" stroke-width="1.5"/><text x="560" y="236" text-anchor="middle" font-size="12" fill="#566674">60 %</text>
  <text x="320" y="262" text-anchor="middle" font-size="13" fill="#566674">Der Rest (0,6 %) kommt auf die Deponie.</text>
</svg>
