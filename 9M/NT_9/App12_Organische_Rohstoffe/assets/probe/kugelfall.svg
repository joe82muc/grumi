<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .kugel{animation-duration:8s;animation-timing-function:linear;animation-iteration-count:infinite}
    .kA{animation-name:fallA}.kB{animation-name:fallB}.kC{animation-name:fallC}.kD{animation-name:fallD}
    @keyframes fallA{0%{transform:translateY(0);opacity:1}32%,95%{transform:translateY(150px);opacity:1}100%{transform:translateY(150px);opacity:0}}
    @keyframes fallB{0%{transform:translateY(0);opacity:1}11%,95%{transform:translateY(150px);opacity:1}100%{transform:translateY(150px);opacity:0}}
    @keyframes fallC{0%{transform:translateY(0);opacity:1}93%,95%{transform:translateY(150px);opacity:1}100%{transform:translateY(150px);opacity:0}}
    @keyframes fallD{0%{transform:translateY(0);opacity:1}19%,95%{transform:translateY(150px);opacity:1}100%{transform:translateY(150px);opacity:0}}
    /* ohne Bewegung: ein Augenblick nach etwa 1 Sekunde */
    @media (prefers-reduced-motion: reduce){.kugel{animation:none}.kA{transform:translateY(55px)}.kB{transform:translateY(150px)}.kC{transform:translateY(4px)}.kD{transform:translateY(95px)}}
  </style>
  <rect width="460" height="300" fill="#f7f9fc"/>
  <text x="14" y="24" font-size="15" font-weight="900" fill="#1f5f99">Kugelfall-Versuch: Wie zähflüssig ist der Stoff?</text>

  <!-- vier Messzylinder mit Fraktionen -->
  <g stroke="#4b6584" stroke-width="3">
    <path d="M59 46 V240 a10 10 0 0 0 10 10 H101 a10 10 0 0 0 10 -10 V46" fill="#e6f0f7"/>
    <path d="M159 46 V240 a10 10 0 0 0 10 10 H201 a10 10 0 0 0 10 -10 V46" fill="#e6f0f7"/>
    <path d="M259 46 V240 a10 10 0 0 0 10 10 H301 a10 10 0 0 0 10 -10 V46" fill="#e6f0f7"/>
    <path d="M359 46 V240 a10 10 0 0 0 10 10 H401 a10 10 0 0 0 10 -10 V46" fill="#e6f0f7"/>
  </g>
  <path d="M62 64 V240 a7 7 0 0 0 7 7 H101 a7 7 0 0 0 7 -7 V64 Z" fill="#f1dc8c"/>
  <path d="M162 64 V240 a7 7 0 0 0 7 7 H201 a7 7 0 0 0 7 -7 V64 Z" fill="#fbf5d8"/>
  <path d="M262 64 V240 a7 7 0 0 0 7 7 H301 a7 7 0 0 0 7 -7 V64 Z" fill="#c98e2c"/>
  <path d="M362 64 V240 a7 7 0 0 0 7 7 H401 a7 7 0 0 0 7 -7 V64 Z" fill="#f6ecb8"/>
  <!-- Start und Ziel -->
  <g stroke="#8a99ab" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M50 80 H420"/><path d="M50 238 H420"/>
  </g>
  <g font-size="11" font-weight="800" fill="#5d6b84"><text x="424" y="84">Start</text><text x="424" y="242">Ziel</text></g>

  <!-- Kugeln -->
  <g fill="#59626e" stroke="#2f3640" stroke-width="1">
    <circle class="kugel kA" cx="85" cy="80" r="9"/>
    <circle class="kugel kB" cx="185" cy="80" r="9"/>
    <circle class="kugel kC" cx="285" cy="80" r="9"/>
    <circle class="kugel kD" cx="385" cy="80" r="9"/>
  </g>

  <!-- Beschriftung -->
  <g font-size="20" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="85" cy="276" r="17" fill="#1f5f99"/><text x="85" y="283">A</text>
    <circle cx="185" cy="276" r="17" fill="#1f5f99"/><text x="185" y="283">B</text>
    <circle cx="285" cy="276" r="17" fill="#1f5f99"/><text x="285" y="283">C</text>
    <circle cx="385" cy="276" r="17" fill="#1f5f99"/><text x="385" y="283">D</text>
  </g>
</svg>
