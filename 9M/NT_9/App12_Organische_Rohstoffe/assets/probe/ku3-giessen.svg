<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P3: Versuch – Körnchen schmelzen in einer Dose langsam auf der Heizplatte, die Schmelze wird mit Schutzhandschuh durch einen Trichter in eine zweiteilige Form gegossen, kühlt ab, die Form öffnet sich, ein Becher ist fertig. -->
  <style>
    .platte{animation:platte 13s infinite}
    @keyframes platte{0%,3%{fill:#59636b}24%,28%{fill:#e74c3c}32%,100%{fill:#59636b}}
    .dose1{animation:dose1 13s infinite}
    @keyframes dose1{0%,27%{opacity:1}30%,97%{opacity:0}100%{opacity:1}}
    .koerner{animation:koerner 13s infinite}
    @keyframes koerner{0%,12%{opacity:1}22%,100%{opacity:0}}
    .schmelze{animation:schmelze 13s infinite}
    @keyframes schmelze{0%,12%{opacity:0}22%,100%{opacity:1}}
    .giessen{animation:giessen 13s infinite} @keyframes giessen{0%,28%{opacity:0}31%,50%{opacity:1}53%,100%{opacity:0}}
    .strahl{stroke-dasharray:6 5;animation:strahl .5s linear infinite}
    @keyframes strahl{to{stroke-dashoffset:-11}}
    .fuell{transform-box:fill-box;transform-origin:50% 100%;animation:fuell 13s infinite}
    @keyframes fuell{0%,34%{transform:scaleY(0);fill:#e67e22}50%,56%{transform:none;fill:#e67e22}66%,95%{transform:none;fill:#5dade2}100%{transform:scaleY(0);fill:#e67e22}}
    .kuehl{animation:kuehl 13s infinite} @keyframes kuehl{0%,51%{opacity:0}54%,70%{opacity:1}73%,100%{opacity:0}}
    .hohl{animation:hohl 13s infinite}
    @keyframes hohl{0%,72%{opacity:1}76%,95%{opacity:0}100%{opacity:1}}
    .fL{animation:fL 13s infinite}.fR{animation:fR 13s infinite}
    @keyframes fL{0%,72%{transform:none}80%,95%{transform:translateX(-36px)}100%{transform:none}}
    @keyframes fR{0%,72%{transform:none}80%,95%{transform:translateX(60px)}100%{transform:none}}
    .fertig{animation:fertig 13s infinite} @keyframes fertig{0%,78%{opacity:0}82%,95%{opacity:1}100%{opacity:0}}
    .t0{animation:t0 13s infinite} @keyframes t0{0%,0%{opacity:0}2%,27%{opacity:1}30%,100%{opacity:0}}
    .dampf{animation:dampf 2.4s linear infinite}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="280" fill="#f6f9fb"/>

  <rect x="50" y="230" width="150" height="24" rx="4" fill="#4a545c"/>
  <rect class="platte" x="70" y="222" width="110" height="8" rx="3"/>
  <g class="dose1">
    <g transform="translate(85 160)"><rect x="0" y="0" width="80" height="62" fill="#c3ccd3" stroke="#6b7781" stroke-width="2"/><rect x="-3" y="-4" width="86" height="7" rx="2" fill="#aab4bd" stroke="#6b7781" stroke-width="1.5"/></g>
    <g class="koerner"><circle cx="96" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="103.5" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="111" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="118.5" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="126" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="133.5" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="141" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="148.5" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="156" cy="211" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="96" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="103.5" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="111" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="118.5" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="126" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="133.5" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="141" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="148.5" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/><circle cx="156" cy="205" r="3.2" fill="#f6d16b" stroke="#b48a1c" stroke-width=".8"/></g>
    <path class="schmelze" d="M89 220 V206 Q110 198 125 205 Q145 199 161 206 V220 Z" fill="#e67e22"/>
    <g class="schmelze"><path class="dampf" style="animation-delay:0s" d="M110 152 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-1.2s" d="M140 152 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/></g>
  </g>
  <text x="125" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b" class="t0">langsam erhitzen</text>
  <g class="giessen">
    <g transform="translate(360 22) rotate(38)"><rect x="0" y="0" width="80" height="62" fill="#c3ccd3" stroke="#6b7781" stroke-width="2"/><rect x="-3" y="-4" width="86" height="7" rx="2" fill="#aab4bd" stroke="#6b7781" stroke-width="1.5"/><path d="M2 40 Q20 30 40 38 Q60 30 78 40 V60 H2 Z" fill="#e67e22"/></g>
    <ellipse cx="352" cy="66" rx="20" ry="16" fill="#2f8fd8" stroke="#1f6aa5" stroke-width="2"/><path d="M334 60 L300 40" stroke="#2f8fd8" stroke-width="18" stroke-linecap="round"/>
    <text x="300" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6aa5">Schutzhandschuh</text>
    <path class="strahl" d="M422 74 Q440 72 450 92" fill="none" stroke="#e67e22" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path class="hohl" d="M427 150 H473 L468 223 H432 Z M446 100 H454 V150 H446 Z" fill="#4a545c"/>
  <path class="fuell" d="M427 150 H473 L468 223 H432 Z" stroke="#1f6aa5" stroke-width="1.5"/>
  <g class="fL"><path d="M380 120 H446 V150 H427 L432 223 H450 V240 H380 Z" fill="#aab4bd" stroke="#5f6870" stroke-width="2"/></g>
  <g class="fR"><path d="M454 120 H520 V240 H450 V223 H468 L473 150 H454 Z" fill="#aab4bd" stroke="#5f6870" stroke-width="2"/></g>
  <path d="M425 70 H475 L456 100 H444 Z" fill="#c3ccd3" stroke="#6b7781" stroke-width="2"/>
  <g class="kuehl" stroke="#3a8fd8" stroke-width="4" stroke-linecap="round">
    <line x1="580" y1="132" x2="580" y2="176"/><line x1="561" y1="143" x2="599" y2="165"/><line x1="561" y1="165" x2="599" y2="143"/>
    <text x="580" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6aa5">abkühlen</text>
  </g>
  <text x="450" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#0a5a66" class="fertig">fertig!</text>
</svg>
