<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:10 8;animation:lauf 1.3s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-36}}
    .dreh{transform-box:fill-box;transform-origin:center;animation:dreh 1.8s linear infinite}
    @keyframes dreh{to{transform:rotate(360deg)}}
    .dampf{animation:dampf 3.6s linear infinite}
    .d2{animation-delay:1.2s}.d3{animation-delay:2.4s}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}20%{opacity:.95}100%{transform:translateY(-44px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.lauf,.dreh,.dampf{animation:none}}
  </style>
  <rect width="640" height="400" fill="#f6f9fb"/>
  <rect y="352" width="640" height="48" fill="#dfe8dc"/>
  <!-- Kuppel -->
  <path d="M22 352 L22 160 A112 112 0 0 1 246 160 L246 352z" fill="#eceff3" stroke="#9aa7b4" stroke-width="3"/>
  <text x="134" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b6b7a">Reaktorgebäude</text>
  <!-- A: Behälter mit Stäben -->
  <rect x="52" y="196" width="60" height="112" rx="28" fill="#f7c9b8" stroke="#b03a2e" stroke-width="3"/>
  <g stroke="#b03a2e" stroke-width="5" stroke-linecap="round"><path d="M68 250V294M82 250V298M96 250V294"/></g>
  <g stroke="#4a5866" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M75 172V246M89 172V246M66 172H98"/></g>
  <!-- B: hoher Behälter -->
  <rect x="172" y="150" width="52" height="160" rx="22" fill="#dcecf8" stroke="#4a5866" stroke-width="3"/>
  <path d="M175 232 H221 V288 A22 22 0 0 1 199 310 H197 A22 22 0 0 1 175 288z" fill="#9cc8ee"/>
  <!-- Kreislauf 1 (rot) -->
  <g fill="none" stroke="#d7263d" stroke-width="6" stroke-linejoin="round">
    <path class="lauf" d="M112 222 L142 222 L142 328 L186 328 L186 214 Q198 190 210 214 L210 340 L82 340 L82 308"/>
  </g>
  <!-- Kreislauf 2 (blau) -->
  <g fill="none" stroke="#2b6fd6" stroke-width="6" stroke-linejoin="round">
    <path class="lauf" d="M198 150 L198 112 L326 112"/>
    <path class="lauf" d="M378 138 L378 204"/>
    <path class="lauf" d="M322 250 L286 250 L286 292 L224 292"/>
  </g>
  <circle cx="286" cy="272" r="10" fill="#fff" stroke="#2b6fd6" stroke-width="3"/><path d="M281 276 L286 266 L291 276z" fill="#2b6fd6"/>
  <!-- C: Schaufelrad im Gehäuse -->
  <path d="M326 98 L400 82 L400 142 L326 126z" fill="#dfe5ea" stroke="#4a5866" stroke-width="3" stroke-linejoin="round"/>
  <g class="dreh" stroke="#4a5866" stroke-width="4" stroke-linecap="round">
    <path d="M366 94V130M350.4 103L381.6 121M350.4 121L381.6 103"/>
    <circle cx="366" cy="112" r="5" fill="#4a5866" stroke="none"/>
  </g>
  <path d="M400 112 H428" stroke="#4a5866" stroke-width="7"/>
  <!-- D: Maschine mit Leitungen -->
  <rect x="428" y="88" width="62" height="48" rx="10" fill="#f2b632" stroke="#a36f00" stroke-width="3"/>
  <g stroke="#a36f00" stroke-width="2.5"><path d="M444 96V128M456 96V128M468 96V128"/></g>
  <g fill="none" stroke="#4a5866" stroke-width="2"><path d="M490 104 Q548 116 598 86"/><path d="M490 114 Q552 138 602 112"/><path d="M634 86 L640 84M630 112 L640 110"/></g>
  <g fill="none" stroke="#4a5866" stroke-width="3" stroke-linecap="round"><path d="M606 352 L616 58 L626 352M598 86 H634M602 112 H630"/></g>
  <polygon points="538,60 550,60 544,73 554,73 536,96 541,80 531,80" fill="#ffd23f" stroke="#a36f00" stroke-width="1.5"/>
  <!-- Kondensator -->
  <rect x="322" y="204" width="96" height="62" rx="6" fill="#e4eef8" stroke="#4a5866" stroke-width="3"/>
  <text x="370" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#33414f">Kondensator</text>
  <!-- Kreislauf 3 (türkis) -->
  <g fill="none" stroke="#12a3b4" stroke-width="6" stroke-linejoin="round">
    <path class="lauf" d="M498 338 L436 338 L436 252 L400 252 L400 236 L340 236 L340 220 L452 220 L452 318 L500 318"/>
  </g>
  <!-- E: Turm mit Dampf -->
  <g fill="#fff" stroke="#c2ccd6" stroke-width="1.5"><circle class="dampf" cx="528" cy="166" r="12"/><circle class="dampf d2" cx="548" cy="160" r="14"/><circle class="dampf d3" cx="562" cy="168" r="10"/></g>
  <path d="M492 352 Q514 262 506 176 L574 176 Q566 262 588 352z" fill="#d9dee4" stroke="#6b7785" stroke-width="3"/>
  <!-- Nummern der Kreisläufe -->
  <g font-size="15" font-weight="900" fill="#fff" text-anchor="middle">
    <rect x="131" y="259" width="22" height="22" rx="4" fill="#d7263d" stroke="#fff" stroke-width="2"/><text x="142" y="275.5">1</text>
    <rect x="261" y="101" width="22" height="22" rx="4" fill="#2b6fd6" stroke="#fff" stroke-width="2"/><text x="272" y="117.5">2</text>
    <rect x="441" y="265" width="22" height="22" rx="4" fill="#0e7f8c" stroke="#fff" stroke-width="2"/><text x="452" y="281.5">3</text>
  </g>
  <!-- Buchstaben -->
  <g font-size="19" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="37" cy="252" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="37" y="259">A</text>
    <circle cx="154" cy="176" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="154" y="183">B</text>
    <circle cx="366" cy="58" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="366" y="65">C</text>
    <circle cx="459" cy="62" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="459" y="69">D</text>
    <circle cx="540" cy="268" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="540" y="275">E</text>
  </g>
</svg>
