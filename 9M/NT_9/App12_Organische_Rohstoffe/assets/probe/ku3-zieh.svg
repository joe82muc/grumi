<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P2: drei Kunststoffstreifen werden auseinandergezogen und losgelassen – A bleibt lang, B springt zurück, C bekommt einen Riss und bricht. -->
  <style>
    .zw{animation:zw 10s infinite} @keyframes zw{0%,5%{opacity:0}8%,40%{opacity:1}43%,100%{opacity:0}}
    .los{animation:los 10s infinite} @keyframes los{0%,42%{opacity:0}46%,95%{opacity:1}100%{opacity:0}}
    .sA{transform-box:fill-box;transform-origin:50% 50%;animation:sA 10s infinite}
    @keyframes sA{0%,8%{transform:none}30%,95%{transform:scale(1.6,.8)}100%{transform:none}}
    .sB{transform-box:fill-box;transform-origin:50% 50%;animation:sB 10s infinite}
    @keyframes sB{0%,8%{transform:none}30%,42%{transform:scale(1.6,.8)}47%{transform:scale(.95,1.04)}51%,100%{transform:none}}
    .kL{animation:kL 10s infinite}.kR{animation:kR 10s infinite}
    @keyframes kL{0%,8%{transform:none;opacity:1}30%,42%{transform:translateX(-60px);opacity:1}46%,95%{transform:translateX(-60px);opacity:.3}100%{transform:none;opacity:1}}
    @keyframes kR{0%,8%{transform:none;opacity:1}30%,42%{transform:translateX(60px);opacity:1}46%,95%{transform:translateX(60px);opacity:.3}100%{transform:none;opacity:1}}
    .cL{transform-box:fill-box;transform-origin:100% 50%;animation:cL 10s infinite}.cR{transform-box:fill-box;transform-origin:0 50%;animation:cR 10s infinite}
    @keyframes cL{0%,8%{transform:none}24%,30%{transform:translateX(-4px)}36%,95%{transform:translateX(-34px) rotate(-7deg)}100%{transform:none}}
    @keyframes cR{0%,8%{transform:none}24%,30%{transform:translateX(4px)}36%,95%{transform:translateX(34px) rotate(7deg)}100%{transform:none}}
    .riss{animation:riss 10s infinite} @keyframes riss{0%,19%{opacity:0}22%,32%{opacity:1}35%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="290" fill="#f6f9fb"/>

  <g font-size="17" font-weight="700" fill="#0a5a66" text-anchor="middle"><text class="zw" x="320" y="30">auseinanderziehen …</text><text class="los" x="320" y="30">… und loslassen</text></g>
  <text x="46" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#15212b">A</text>
  <rect class="sA" x="220" y="68" width="200" height="24" rx="4" fill="#9fd3f5" stroke="#3a7fa8" stroke-width="2"/>
  <g class="kL"><rect x="206" y="58" width="16" height="44" rx="3" fill="#33414d"/><rect x="211" y="50" width="6" height="10" fill="#59636b"/></g><g class="kR"><rect x="418" y="58" width="16" height="44" rx="3" fill="#33414d"/><rect x="423" y="50" width="6" height="10" fill="#59636b"/></g><g class="zw" fill="none" stroke="#e8731c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M140 80 H110 M120 72 L110 80 L120 88"/><path d="M500 80 H530 M520 72 L530 80 L520 88"/></g>
  <text x="46" y="173" text-anchor="middle" font-size="24" font-weight="700" fill="#15212b">B</text>
  <rect class="sB" x="220" y="153" width="200" height="24" rx="4" fill="#a8dba1" stroke="#3f8a36" stroke-width="2"/>
  <g class="kL"><rect x="206" y="143" width="16" height="44" rx="3" fill="#33414d"/><rect x="211" y="135" width="6" height="10" fill="#59636b"/></g><g class="kR"><rect x="418" y="143" width="16" height="44" rx="3" fill="#33414d"/><rect x="423" y="135" width="6" height="10" fill="#59636b"/></g><g class="zw" fill="none" stroke="#e8731c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M140 165 H110 M120 157 L110 165 L120 173"/><path d="M500 165 H530 M520 157 L530 165 L520 173"/></g>
  <text x="46" y="258" text-anchor="middle" font-size="24" font-weight="700" fill="#15212b">C</text>
  <g class="cL"><rect x="220" y="238" width="100" height="24" fill="#efe9dc" stroke="#8d7f63" stroke-width="2"/><rect x="206" y="228" width="16" height="44" rx="3" fill="#33414d"/><rect x="211" y="220" width="6" height="10" fill="#59636b"/></g>
  <g class="cR"><rect x="320" y="238" width="100" height="24" fill="#efe9dc" stroke="#8d7f63" stroke-width="2"/><rect x="418" y="228" width="16" height="44" rx="3" fill="#33414d"/><rect x="423" y="220" width="6" height="10" fill="#59636b"/></g>
  <path class="riss" d="M320 238 L314 246 L324 253 L317 262" fill="none" stroke="#15212b" stroke-width="2.5"/>
  <g class="zw" fill="none" stroke="#e8731c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M140 250 H110 M120 242 L110 250 L120 258"/><path d="M500 250 H530 M520 242 L530 250 L520 258"/></g>
</svg>
