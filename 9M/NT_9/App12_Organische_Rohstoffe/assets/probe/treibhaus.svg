<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:10 8;animation:lauf 1.4s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-36}}
    .sonne{animation:glueh 2.4s ease-in-out infinite alternate;transform-origin:62px 50px}
    @keyframes glueh{to{transform:scale(1.08)}}
    @media (prefers-reduced-motion: reduce){.lauf,.sonne{animation:none}}
  </style>
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0a800"/></marker>
    <marker id="pr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d7263d"/></marker>
  </defs>
  <rect width="480" height="330" fill="#0e1f38"/>
  <text x="440" y="30" text-anchor="end" font-size="14" font-weight="700" fill="#cfe3ff">Weltall</text>
  <rect y="110" width="480" height="120" fill="#a9d8f5" opacity=".9"/>
  <text x="470" y="128" text-anchor="end" font-size="13" font-weight="700" fill="#1d4f7a">Atmosphäre</text>
  <g fill="#4a5866"><circle cx="300" cy="150" r="6"/><circle cx="312" cy="150" r="4"/><circle cx="110" cy="150" r="6"/><circle cx="122" cy="150" r="4"/><circle cx="390" cy="190" r="6"/><circle cx="402" cy="190" r="4"/><circle cx="230" cy="200" r="6"/><circle cx="242" cy="200" r="4"/></g>
  <rect y="230" width="480" height="100" fill="#6fae4f"/>
  <rect y="270" width="480" height="60" fill="#8a6b42"/>
  <path d="M150 230 v-34 l22 -18 l22 18 v34z" fill="#f2e6d0" stroke="#5b4630" stroke-width="2"/>
  <rect x="80" y="196" width="10" height="34" fill="#6b4a2b"/><circle cx="85" cy="190" r="18" fill="#2f7d32"/>
  <circle class="sonne" cx="62" cy="50" r="28" fill="#ffd23f"/>
  <!-- 1 Sonnenlicht -->
  <path class="lauf" d="M90 70 q20 15 40 30 t40 30 t40 30 t40 30 t30 60" fill="none" stroke="#e0a800" stroke-width="5" marker-end="url(#pg)"/>
  <!-- 2 Wärme ins All -->
  <path class="lauf" d="M300 262 L300 40" fill="none" stroke="#d7263d" stroke-width="5" marker-end="url(#pr)"/>
  <!-- 3 Wärme an Treibhausgas zurück -->
  <path class="lauf" d="M340 262 L390 196 L430 262" fill="none" stroke="#d7263d" stroke-width="5" marker-end="url(#pr)"/>
  <g font-size="18" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="150" cy="95" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="150" y="101">1</text>
    <circle cx="275" cy="80" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="275" y="86">2</text>
    <circle cx="455" cy="230" r="15" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="455" y="236">3</text>
  </g>
</svg>
