<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P4: Eine Plastiktüte, eine Flasche und ein Becher liegen an Land bei einem Mülleimer. Regen und Wind tragen sie in einen Fluss, der Fluss spült sie ins Meer, dort treiben sie in einen Müllstrudel. Im Meer schwimmen winzige Plastikteilchen und eine Schildkröte. -->
  <style>
    .tropf{animation:tropf .9s linear infinite}
    @keyframes tropf{from{transform:translateY(0);opacity:1}to{transform:translateY(60px);opacity:0}}
    .wind{stroke-dasharray:14 10;animation:wind 1s linear infinite}
    @keyframes wind{to{stroke-dashoffset:-24}}
    .strom{stroke-dasharray:10 14;animation:strom 1.4s linear infinite}
    @keyframes strom{to{stroke-dashoffset:-24}}
    .welle{animation:welle 3s ease-in-out infinite alternate}
    @keyframes welle{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
    .kroete{animation:kroete 7s ease-in-out infinite alternate}
    @keyframes kroete{from{transform:translateX(-36px)}to{transform:translateX(30px)}}
    .strudel{stroke-dasharray:12 8;animation:strom 2s linear infinite}
    .mikro{animation:mik 4s ease-in-out infinite alternate}
    @keyframes mik{from{opacity:.3}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="320" fill="#eaf5fb"/>
  <g><ellipse cx="100" cy="48" rx="34" ry="16" fill="#ffffff" stroke="#b8c2ca" stroke-width="1.5"/><ellipse cx="128" cy="44" rx="24" ry="14" fill="#ffffff" stroke="#b8c2ca" stroke-width="1.5"/><ellipse cx="78" cy="52" rx="20" ry="11" fill="#ffffff" stroke="#b8c2ca" stroke-width="1.5"/><line class="tropf" style="animation-delay:0s" x1="78" y1="64" x2="75" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.1s" x1="87" y1="64" x2="84" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.3s" x1="96" y1="64" x2="93" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.4s" x1="105" y1="64" x2="102" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.5s" x1="114" y1="64" x2="111" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.6s" x1="123" y1="64" x2="120" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.8s" x1="132" y1="64" x2="129" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-0.9s" x1="141" y1="64" x2="138" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/><line class="tropf" style="animation-delay:-1s" x1="150" y1="64" x2="147" y2="72" stroke="#5aa9d6" stroke-width="2" stroke-linecap="round"/></g>
  <g stroke="#8aa1b1" stroke-width="2.5" fill="none" stroke-linecap="round"><path class="wind" d="M150 120 q30 -8 60 0 t60 0"/><path class="wind" d="M170 140 q30 -8 60 0"/></g>
  <path d="M0 150 Q80 130 160 152 Q230 168 300 196 L300 320 L0 320 Z" fill="#9bc76a"/>
  <path d="M290 202 Q330 196 360 202 T430 202 T500 202 T570 202 T640 202 V320 H290 Z" fill="#5aa9d6"/>
  <path class="welle" d="M280 206 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7"/>
  <path d="M30 210 C90 196 120 236 170 228 S250 250 302 236" fill="none" stroke="#5aa9d6" stroke-width="16" stroke-linecap="round"/>
  <path class="strom" d="M30 210 C90 196 120 236 170 228 S250 250 302 236" fill="none" stroke="#bfe0f2" stroke-width="2.5"/>
  <path class="strudel" d="M540 266 C540 286 470 288 462 268 C456 252 510 244 520 262 C526 274 492 278 490 266" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".75"/>
  <g class="mikro"><circle cx="440" cy="237.5" r="1.6" fill="#ffffff"/><circle cx="516.9" cy="251.2" r="1.1" fill="#f6d16b"/><circle cx="451.5" cy="272.8" r="2" fill="#e74c3c"/><circle cx="509.7" cy="285.2" r="2.5" fill="#ffffff"/><circle cx="455.7" cy="283.7" r="1.4" fill="#f6d16b"/><circle cx="465.6" cy="262.2" r="1.3" fill="#e74c3c"/><circle cx="554.6" cy="268.2" r="2" fill="#ffffff"/><circle cx="551.4" cy="268.8" r="1.6" fill="#f6d16b"/><circle cx="504.7" cy="243.2" r="1.2" fill="#e74c3c"/><circle cx="445.6" cy="270.1" r="1.2" fill="#ffffff"/><circle cx="571.2" cy="267.8" r="1.1" fill="#f6d16b"/><circle cx="452.8" cy="291.8" r="1.9" fill="#e74c3c"/><circle cx="517.1" cy="259.8" r="2.3" fill="#ffffff"/><circle cx="496.4" cy="276.9" r="2" fill="#f6d16b"/><circle cx="527" cy="255.6" r="2.6" fill="#e74c3c"/><circle cx="534" cy="267.7" r="1.6" fill="#ffffff"/><circle cx="478.1" cy="238.2" r="2" fill="#f6d16b"/><circle cx="578.3" cy="264.1" r="1.5" fill="#e74c3c"/><circle cx="476.8" cy="285.8" r="1.3" fill="#ffffff"/><circle cx="530.5" cy="290.7" r="1.6" fill="#f6d16b"/><circle cx="553" cy="272.2" r="2.4" fill="#e74c3c"/><circle cx="487.3" cy="277.6" r="1.6" fill="#ffffff"/><circle cx="457" cy="241.2" r="2.3" fill="#f6d16b"/><circle cx="537.5" cy="267" r="2.3" fill="#e74c3c"/><circle cx="492.2" cy="237.1" r="1.3" fill="#ffffff"/><circle cx="535.5" cy="274.6" r="1.2" fill="#f6d16b"/></g>
  <rect x="62" y="156" width="20" height="24" rx="2" fill="#6b7781"/><rect x="59" y="152" width="26" height="6" rx="2" fill="#59636b"/>
  <g class="kroete"><g transform="translate(400 288)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="#6b8e4e" stroke="#3d5a2a" stroke-width="2"/><circle cx="23" cy="-2" r="6" fill="#8bb26b" stroke="#3d5a2a" stroke-width="1.5"/><path d="M-8 9 l-8 7 M8 9 l8 7 M-8 -9 l-8 -7 M8 -9 l8 -7" stroke="#3d5a2a" stroke-width="4" stroke-linecap="round"/></g></g>
  <g><path d="M-9 -8 L9 -8 L11 9 L-11 9 Z" fill="#ffffff" stroke="#8e98a1" stroke-width="1.5"/><path d="M-5 -8 q0 -6 4 -6 M5 -8 q0 -6 -4 -6" fill="none" stroke="#8e98a1" stroke-width="1.5"/><animateMotion dur="12s" begin="0s" repeatCount="indefinite" path="M80 170 C74 188 54 204 42 212 C90 197 120 236 170 228 S250 250 300 236 C360 226 420 238 470 248 C520 258 548 272 520 282 C490 292 464 272 486 262 C502 255 516 266 500 268"/><animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.9;0.97;1"/></g><g><rect x="-4" y="-9" width="8" height="15" rx="2" fill="#7fc97f" stroke="#3f8a36" stroke-width="1.5"/><rect x="-2" y="-13" width="4" height="5" fill="#3f8a36"/><animateMotion dur="12s" begin="-4s" repeatCount="indefinite" path="M80 170 C74 188 54 204 42 212 C90 197 120 236 170 228 S250 250 300 236 C360 226 420 238 470 248 C520 258 548 272 520 282 C490 292 464 272 486 262 C502 255 516 266 500 268"/><animate attributeName="opacity" dur="12s" begin="-4s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.9;0.97;1"/></g><g><path d="M-6 -7 H6 L4 7 H-4 Z" fill="#e74c3c" stroke="#a93226" stroke-width="1.5"/><animateMotion dur="12s" begin="-8s" repeatCount="indefinite" path="M80 170 C74 188 54 204 42 212 C90 197 120 236 170 228 S250 250 300 236 C360 226 420 238 470 248 C520 258 548 272 520 282 C490 292 464 272 486 262 C502 255 516 266 500 268"/><animate attributeName="opacity" dur="12s" begin="-8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.9;0.97;1"/></g>
  <text x="40" y="300" font-size="15" font-weight="700" fill="#3d6b25">Land</text><text x="212" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6aa5">Fluss</text><text x="600" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Meer</text>
</svg>
