  <g class="tauch">
    <g class="" fill="none"><path d="M405 274 V382" stroke="#b48a1c" stroke-width="12" stroke-linecap="round"/><path d="M405 274 V382" stroke="#f6d16b" stroke-width="8" stroke-linecap="round"/></g>
