  <text x="565" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15212b">D Lichtschalter</text>
  <line x1="10" y1="214" x2="630" y2="214" stroke="#d5dde3" stroke-width="2"/>
  <g class="zweit"><text x="18" y="240" font-size="15" font-weight="700" fill="#c0392b">Versuch 2: in heißem Wasser (etwa 75 °C)</text>
