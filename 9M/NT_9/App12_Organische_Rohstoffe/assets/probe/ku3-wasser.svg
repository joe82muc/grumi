<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P1: vier Proben A Trinkflasche, B Deckel Brotzeitbox, C Eimer, D Lichtschalter; in Wasser schwimmen B und C, A und D sinken; in heißem Wasser biegt sich nur A. -->
  <style>
    .schwimm{animation:schwimm 13s infinite}
    @keyframes schwimm{0%,3%{transform:translateY(-44px);opacity:0}6%{transform:translateY(-44px);opacity:1}14%{transform:translateY(22px)}22%,95%{transform:none;opacity:1}100%{transform:translateY(-44px);opacity:0}}
    .sink{animation:sink 13s infinite}
    @keyframes sink{0%,3%{transform:translateY(-134px);opacity:0}6%{transform:translateY(-134px);opacity:1}14%{transform:translateY(-62px)}26%,95%{transform:none;opacity:1}100%{transform:translateY(-134px);opacity:0}}
    .zweit{animation:zweit 13s infinite} @keyframes zweit{0%,34%{opacity:0}38%,95%{opacity:1}100%{opacity:0}}
    .tauch{animation:tauch 13s infinite}
    @keyframes tauch{0%,40%{transform:translateY(-14px)}50%,95%{transform:none}100%{transform:translateY(-14px)}}
    .gerade{animation:gerade 13s infinite}.krumm{opacity:0;animation:krumm 13s infinite}
    @keyframes gerade{0%,58%{opacity:1}64%,95%{opacity:0}100%{opacity:1}}
    @keyframes krumm{0%,58%{opacity:0}64%,95%{opacity:1}100%{opacity:0}}
    .dampf{animation:dampf 2.4s linear infinite}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="432" fill="#f6f9fb"/>
<text x="18" y="28" font-size="15" font-weight="700" fill="#0a5a66">Versuch 1: in Wasser</text>
  <rect x="39" y="80" width="92" height="98" fill="#cfe8ff"/><line x1="39" y1="80" x2="131" y2="80" stroke="#7fb6e0" stroke-width="2"/>
  <g class="sink"><rect x="63" y="164" width="44" height="12" rx="2" fill="#cfe8f7" stroke="#3a7fa8" stroke-width="2"/></g>
  <path d="M37 48 V172 Q37 180 45 180 H125 Q133 180 133 172 V48" fill="none" stroke="#6b7781" stroke-width="3"/>
  <text x="85" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15212b">A Trinkflasche</text>
  <rect x="199" y="80" width="92" height="98" fill="#cfe8ff"/><line x1="199" y1="80" x2="291" y2="80" stroke="#7fb6e0" stroke-width="2"/>
  <g class="schwimm"><rect x="223" y="74" width="44" height="12" rx="2" fill="#a8dba1" stroke="#3f8a36" stroke-width="2"/></g>
  <path d="M197 48 V172 Q197 180 205 180 H285 Q293 180 293 172 V48" fill="none" stroke="#6b7781" stroke-width="3"/>
  <text x="245" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15212b">B Deckel Brotzeitbox</text>
  <rect x="359" y="80" width="92" height="98" fill="#cfe8ff"/><line x1="359" y1="80" x2="451" y2="80" stroke="#7fb6e0" stroke-width="2"/>
  <g class="schwimm"><rect x="383" y="74" width="44" height="12" rx="2" fill="#f6d16b" stroke="#b48a1c" stroke-width="2"/></g>
  <path d="M357 48 V172 Q357 180 365 180 H445 Q453 180 453 172 V48" fill="none" stroke="#6b7781" stroke-width="3"/>
  <text x="405" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15212b">C Eimer</text>
  <rect x="519" y="80" width="92" height="98" fill="#cfe8ff"/><line x1="519" y1="80" x2="611" y2="80" stroke="#7fb6e0" stroke-width="2"/>
