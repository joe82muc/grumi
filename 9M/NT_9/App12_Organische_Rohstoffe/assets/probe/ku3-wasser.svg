  <text x="405" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#15212b">C</text>
  <rect x="523" y="328" width="84" height="70" fill="#f7d6c6"/>
  <path class="dampf" style="animation-delay:-1.2000000000000002s" d="M543 322 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-2.4000000000000004s" d="M589 322 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/>
  <g class="tauch">
    <g class="" fill="none"><path d="M565 274 V382" stroke="#8d7f63" stroke-width="12" stroke-linecap="round"/><path d="M565 274 V382" stroke="#efe9dc" stroke-width="8" stroke-linecap="round"/></g>
    <path d="M556 256 L565 276 L574 256" fill="none" stroke="#59636b" stroke-width="3"/><path d="M556 256 L551 260 M574 256 L579 260" stroke="#59636b" stroke-width="3"/>
  </g>
  <path d="M521 300 V392 Q521 400 529 400 H601 Q609 400 609 392 V300" fill="none" stroke="#6b7781" stroke-width="3"/>
