  <line x1="300" y1="236" x2="300" y2="160" stroke="#ffffff" stroke-width="5"/><line x1="300" y1="236" x2="300" y2="160" stroke="#15212b" stroke-width="2"/><circle cx="300" cy="236" r="15" fill="#15212b"/><text x="300" y="241.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">C</text>
