<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P3: Schmelzpresse (Extruder) im Schnitt – A Trichter mit fallenden Körnchen, B glühende Heizbänder, C drehende Schnecke im Rohr, D Öffnung am Ende, aus der ein Strang kommt. -->
  <style>
    .korn{animation:korn 1.4s linear infinite}
    @keyframes korn{from{transform:translateY(-6px);opacity:0}20%{opacity:1}to{transform:translateY(40px);opacity:0}}
    .schnecke{animation:schnecke .9s linear infinite}
    @keyframes schnecke{to{transform:translateX(24px)}}
    .heiz{animation:heiz 1.6s ease-in-out infinite alternate}
    @keyframes heiz{from{fill:#c0392b}to{fill:#ff7a3d}}
    .strang{transform-box:fill-box;transform-origin:0 50%;animation:strang 7s linear infinite}
    @keyframes strang{0%{transform:scaleX(0)}88%,100%{transform:scaleX(1)}}
    .dampf{animation:dampf 2.4s linear infinite}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="260" fill="#f6f9fb"/>

  <defs>
    <linearGradient id="masse" x1="0" x2="1"><stop offset="0" stop-color="#f6d16b"/><stop offset=".35" stop-color="#f3b14b"/><stop offset="1" stop-color="#e67e22"/></linearGradient>
    <clipPath id="kanal"><rect x="118" y="140" width="392" height="36"/></clipPath>
  </defs>
  <rect x="110" y="130" width="400" height="56" rx="4" fill="#aab4bd" stroke="#5f6870" stroke-width="2"/>
  <rect x="118" y="140" width="392" height="36" fill="#e8edf1"/>
  <rect x="210" y="141" width="300" height="34" fill="url(#masse)"/>
