<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P2: Thermoplast (Ketten ohne Verbindung) und Duroplast (Ketten eng vernetzt) werden erwärmt. Der Thermoplast wird weich und zerfließt, der Duroplast bleibt hart und verkohlt bei sehr großer Hitze mit Rauch. -->
  <style>
    .gl1{animation:gleit 1.6s ease-in-out infinite alternate}.gl2{animation:gleit 1.6s ease-in-out infinite alternate-reverse}
    @keyframes gleit{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
    .schmelz{transform-origin:160px 214px;transform:scale(1.1,.68);animation:schmelz 12s infinite}
    @keyframes schmelz{0%,6%{transform:none}42%,95%{transform:scale(1.1,.68)}100%{transform:none}}
    .dunkel{animation:dunkel 12s infinite;opacity:.55}
    @keyframes dunkel{0%,54%{opacity:0}70%,95%{opacity:.55}100%{opacity:0}}
    .rauch{animation:rauchp 12s infinite} @keyframes rauchp{0%,58%{opacity:0}62%,95%{opacity:1}100%{opacity:0}}
    .puff{animation:puff 2.4s linear infinite}
    @keyframes puff{0%{transform:translateY(10px);opacity:0}25%{opacity:.7}100%{transform:translateY(-40px);opacity:0}}
    .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.8)}to{transform:scaleY(1.1)}}
    .gross{transform-origin:480px 250px;transform:scale(1.5);animation:gross 12s infinite}
    @keyframes gross{0%,50%{transform:none}56%,95%{transform:scale(1.5)}100%{transform:none}}
    .q{transform-origin:320px 215px;transform:scaleY(1);animation:q 12s infinite}
    @keyframes q{0%,4%{transform:scaleY(.12)}40%,48%{transform:scaleY(.55)}62%,95%{transform:scaleY(1)}100%{transform:scaleY(.12)}}
    .k1{opacity:0;animation:k1 12s infinite}.k2{animation:k2 12s infinite}
    @keyframes k1{0%,0%{opacity:0}3%,48%{opacity:1}51%,100%{opacity:0}} @keyframes k2{0%,50%{opacity:0}54%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
