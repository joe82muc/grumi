<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .h1{opacity:0;animation:h1 15s infinite}.h2{opacity:0;animation:h2 15s infinite}.h3{animation:h3 15s infinite}
    @keyframes h1{0%{opacity:1}31%{opacity:1}32.5%{opacity:0}100%{opacity:0}} @keyframes h2{0%{opacity:0}32.5%{opacity:0}34%{opacity:1}64%{opacity:1}65.5%{opacity:0}100%{opacity:0}} @keyframes h3{0%{opacity:0}65.5%{opacity:0}67%{opacity:1}97%{opacity:1}98.5%{opacity:0}100%{opacity:0}}
    .m2{animation:m2 15s infinite}
    @keyframes m2{0%,5%{transform:translateX(0)}6%,27%{transform:translateX(15px)}29%,39%{transform:translateX(0)}40%,58%{transform:translateX(-15px)}60%,66%{transform:translateX(0)}67%{transform:translateX(12px)}68.2%{transform:translateX(-12px)}69.4%{transform:translateX(12px)}70.6%{transform:translateX(-12px)}71.8%{transform:translateX(12px)}73%{transform:translateX(-12px)}74.2%{transform:translateX(12px)}75.4%{transform:translateX(-12px)}76.6%{transform:translateX(12px)}77.8%{transform:translateX(-12px)}79%{transform:translateX(12px)}80.2%{transform:translateX(-12px)}81.4%{transform:translateX(12px)}82.6%{transform:translateX(-12px)}83.8%{transform:translateX(12px)}85%{transform:translateX(-12px)}86.2%{transform:translateX(12px)}87.4%{transform:translateX(-12px)}88.6%{transform:translateX(12px)}89.8%{transform:translateX(-12px)}91%{transform:translateX(12px)}92.2%{transform:translateX(-12px)}93.4%{transform:translateX(12px)}94.6%{transform:translateX(-12px)}96%,100%{transform:translateX(0)}}
    .k1{opacity:0;animation:k1 15s infinite}
    @keyframes k1{0%{opacity:0}4.5%{opacity:0}6%{opacity:1}14%{opacity:1}15.5%{opacity:0}38.5%{opacity:0}40%{opacity:1}48%{opacity:1}49.5%{opacity:0}100%{opacity:0}}
    .sg{animation:h3 15s infinite}
    .sw{fill:none;stroke:#1f6aa5;stroke-width:3.5;stroke-linecap:round;opacity:.7;animation:puls 1.2s linear infinite}
    .v1{animation-delay:.2s}.v2{animation-delay:.4s}
    @keyframes puls{0%{opacity:.15}25%{opacity:1}60%,100%{opacity:.15}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#f6f9fb"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#144a74" class="h1">Versuch 1: Batterie kurz anschließen</text>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#144a74" class="h2">Versuch 2: Pole der Batterie vertauscht</text>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#144a74" class="h3">Versuch 3: Wechselspannung mit 50 Hz (in Zeitlupe)</text>
  <text x="101" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#566674">Spannungsquelle</text>
  <rect x="24" y="96" width="154" height="134" rx="12" fill="#fff" stroke="#9aa9b5" stroke-width="2"/>
  <g class="h1">
    <rect x="76" y="110" width="50" height="106" rx="7" fill="#33414d"/><rect x="93" y="104" width="16" height="6" rx="1.5" fill="#9aa5ad"/>
    <text x="101" y="146" text-anchor="middle" font-size="26" font-weight="700" fill="#ff9e94">+</text>
    <text x="101" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4,5 V</text>
    <text x="101" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#9cc9f2">−</text></g><g class="h2">
    <rect x="76" y="110" width="50" height="106" rx="7" fill="#33414d"/><rect x="93" y="216" width="16" height="6" rx="1.5" fill="#9aa5ad"/>
    <text x="101" y="146" text-anchor="middle" font-size="26" font-weight="700" fill="#9cc9f2">−</text>
    <text x="101" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4,5 V</text>
    <text x="101" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#ff9e94">+</text></g>
  <g class="h3"><circle cx="101" cy="152" r="36" fill="#fff" stroke="#33414d" stroke-width="3"/><text x="101" y="166" text-anchor="middle" font-size="44" font-weight="700" fill="#33414d">~</text><text x="101" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#33414d">50 Hz</text></g>
  <path d="M178 140 H236 V96 H382 M178 190 H236 V238 H382" fill="none" stroke="#566674" stroke-width="3"/>
  <path d="M392 140 L560 92 M392 184 L560 232" stroke="#aab4bd" stroke-width="4"/>
  <rect x="296" y="140" width="48" height="44" fill="#2e8b57"/><rect x="344" y="140" width="48" height="44" fill="#d64541"/>
  <text x="320" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">S</text><text x="368" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">N</text>
  <g class="m2">
    <path d="M366 96 H400 V130 M366 238 H412 V194" fill="none" stroke="#566674" stroke-width="3"/>
    <path d="M442 150 L548 102 L548 222 L442 174 Z" fill="#efe2c4" stroke="#a68a5b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M442 150 Q460 162 442 174" fill="#e3d3ae" stroke="#a68a5b" stroke-width="2"/>
    <rect x="388" y="130" width="6.5" height="64" rx="3" fill="#c87533" stroke="#8a4b1c" stroke-width="1"/><rect x="397" y="130" width="6.5" height="64" rx="3" fill="#c87533" stroke="#8a4b1c" stroke-width="1"/><rect x="406" y="130" width="6.5" height="64" rx="3" fill="#c87533" stroke="#8a4b1c" stroke-width="1"/><rect x="415" y="130" width="6.5" height="64" rx="3" fill="#c87533" stroke="#8a4b1c" stroke-width="1"/><rect x="424" y="130" width="6.5" height="64" rx="3" fill="#c87533" stroke="#8a4b1c" stroke-width="1"/><rect x="433" y="130" width="6.5" height="64" rx="3" fill="#c87533" stroke="#8a4b1c" stroke-width="1"/>
  </g>
  <rect x="556" y="80" width="9" height="26" rx="2" fill="#566674"/><rect x="556" y="218" width="9" height="26" rx="2" fill="#566674"/>
  <g class="sg"><path class="sw v0" d="M582.8 149.5 A26 26 0 0 1 582.8 174.5"/><path class="sw v1" d="M598.6 140.9 A44 44 0 0 1 598.6 183.1"/><path class="sw v2" d="M614.4 132.3 A62 62 0 0 1 614.4 191.7"/></g>
  <text x="604" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b" class="k1">Knack!</text>
  <text x="430" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#566674">Lautsprecher (aufgeschnitten)</text>
</svg>
