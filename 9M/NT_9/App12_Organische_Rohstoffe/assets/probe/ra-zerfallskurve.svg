<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif">
  <style>
    .kurve{stroke-dasharray:600;animation:zeichne 3.2s ease-out .3s both}
    @keyframes zeichne{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
    .punkt{animation:zeig .4s ease-out both}
    .p1{animation-delay:.3s}.p2{animation-delay:1.1s}.p3{animation-delay:1.9s}.p4{animation-delay:2.7s}.p5{animation-delay:3.5s}
    @keyframes zeig{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){.kurve,.punkt{animation:none}}
  </style>
  <rect width="640" height="400" fill="#f6f9fb"/>
  <text x="90" y="28" font-size="17" font-weight="900" fill="#15212b">Zerfall eines radioaktiven Stoffes</text>
  <!-- Gitter -->
  <g stroke="#d5dde5" stroke-width="1">
    <path d="M90 295H602M90 260H602M90 225H602M90 190H602M90 155H602M90 120H602M90 85H602M90 50H602"/>
    <path d="M154 50V330M218 50V330M282 50V330M346 50V330M410 50V330M474 50V330M538 50V330M602 50V330"/>
  </g>
  <!-- Achsen -->
  <path d="M90 42V330H612" fill="none" stroke="#15212b" stroke-width="2.5"/>
  <g font-size="13" fill="#15212b" text-anchor="end">
    <text x="82" y="335">0</text><text x="82" y="300">1.000</text><text x="82" y="265">2.000</text><text x="82" y="230">3.000</text><text x="82" y="195">4.000</text><text x="82" y="160">5.000</text><text x="82" y="125">6.000</text><text x="82" y="90">7.000</text><text x="82" y="55">8.000</text>
  </g>
  <g font-size="13" fill="#15212b" text-anchor="middle">
    <text x="90" y="350">0</text><text x="154" y="350">4</text><text x="218" y="350">8</text><text x="282" y="350">12</text><text x="346" y="350">16</text><text x="410" y="350">20</text><text x="474" y="350">24</text><text x="538" y="350">28</text><text x="602" y="350">32</text>
  </g>
  <text x="346" y="382" text-anchor="middle" font-size="15" font-weight="800" fill="#15212b">Zeit in Tagen</text>
  <text transform="translate(22 190) rotate(-90)" text-anchor="middle" font-size="15" font-weight="800" fill="#15212b">Anzahl der Atome</text>
  <!-- Kurve -->
  <path class="kurve" fill="none" stroke="#d7263d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" d="M90 50.0 L106 73.2 L122 94.5 L138 114.1 L154 132.0 L170 148.4 L186 163.5 L202 177.3 L218 190.0 L234 201.6 L250 212.3 L266 222.0 L282 231.0 L298 239.2 L314 246.8 L330 253.7 L346 260.0 L362 265.8 L378 271.1 L394 276.0 L410 280.5 L426 284.6 L442 288.4 L458 291.8 L474 295.0 L490 297.9 L506 300.6 L522 303.0 L538 305.3 L554 307.3 L570 309.2 L586 310.9 L602 312.5"/>
  <g fill="#1f5f99" stroke="#fff" stroke-width="2">
    <circle class="punkt p1" cx="90" cy="50" r="7"/><circle class="punkt p2" cx="218" cy="190" r="7"/><circle class="punkt p3" cx="346" cy="260" r="7"/><circle class="punkt p4" cx="474" cy="295" r="7"/><circle class="punkt p5" cx="602" cy="312.5" r="7"/>
  </g>
</svg>
