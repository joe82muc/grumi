<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .vok{transform:translate(448px,80px);animation:vok 16s infinite}
    @keyframes vok{0%,8%{transform:none;opacity:1}16%{transform:translate(139px,8px)}32%{transform:translate(139px,8px)}42%,74%{transform:translate(293px,8px)}82%,95%{transform:translate(448px,80px);opacity:1}100%{transform:translate(448px,80px);opacity:0}}
    .vog{opacity:0;transform:translate(139px,8px);animation:vog 16s infinite}
    @keyframes vog{0%,8%{transform:none;opacity:1}16%,24%{transform:translate(139px,8px);opacity:1}30%,100%{transform:translate(139px,8px);opacity:0}}
    .han{opacity:0;transform:translate(293px,120px);animation:han 16s infinite}
    @keyframes han{0%,8%{transform:none;opacity:1}16%,32%{transform:translate(139px,8px);opacity:1}42%,50%{transform:translate(293px,-28px);opacity:1}58%,100%{transform:translate(293px,120px);opacity:0}}
    .wit{transform:translate(293px,-28px);animation:wit 16s infinite}
