    .kp{opacity:0;animation:kp 16s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes kp{0%,58%{opacity:0;transform:none}61%{opacity:1;transform:rotate(0deg)}64%{opacity:1;transform:rotate(360deg)}66%{opacity:.2}68%{opacity:1;transform:rotate(360deg)}71%{opacity:1;transform:rotate(720deg)}73%,100%{opacity:0;transform:rotate(720deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
