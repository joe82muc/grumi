    @keyframes bru{0%,6%{transform:none;opacity:1}12%,15%{transform:translate(10px,0);opacity:1}20%,100%{transform:translate(10px,0);opacity:0}}
    .hau{transform:translate(293px,44px);animation:hau 16s infinite}
