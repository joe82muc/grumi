<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flackern .45s ease-in-out infinite alternate}
    @keyframes flackern{from{transform:scaleY(1)}to{transform:scaleY(1.14)}}
    .zucker{fill:#1b1410;animation:zucker 10s ease-in infinite}
    @keyframes zucker{0%,8%{fill:#f7f3e8}35%{fill:#d9a441}58%{fill:#5a3412}78%,100%{fill:#1b1410}}
    .holz{fill:#1b1410;animation:holz 10s ease-in infinite}
    @keyframes holz{0%,8%{fill:#d8b27a}45%{fill:#7a4a20}78%,100%{fill:#1b1410}}
    .rauch{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:rauch 10s linear infinite}
    @keyframes rauch{0%,30%{opacity:0;transform:translateY(0)}40%{opacity:.55}62%{opacity:0;transform:translateY(-46px)}63%,100%{opacity:0;transform:translateY(0)}}
    .r2{animation-delay:1.2s}.r3{animation-delay:2.4s}
    @media (prefers-reduced-motion: reduce){.flamme,.zucker,.holz,.rauch{animation:none}}
  </style>
  <rect width="460" height="300" fill="#f7f9fc"/>
  <text x="14" y="24" font-size="15" font-weight="900" fill="#1f5f99">Versuch: Stoffe stark erhitzen</text>

  <!-- Beschriftung der Gläser -->
  <g font-size="14" font-weight="800" text-anchor="middle">
    <rect x="58" y="36" width="104" height="28" rx="14" fill="#1f5f99"/><text x="110" y="55" fill="#fff">A · Zucker</text>
    <rect x="172" y="36" width="116" height="28" rx="14" fill="#1f5f99"/><text x="230" y="55" fill="#fff">B · Kochsalz</text>
    <rect x="292" y="36" width="116" height="28" rx="14" fill="#1f5f99"/><text x="350" y="55" fill="#fff">C · Holzspäne</text>
  </g>

  <!-- Reagenzgläser mit Inhalt -->
  <g stroke="#4b6584" stroke-width="3">
    <path d="M92 76 V185 a18 18 0 0 0 36 0 V76" fill="#e6f0f7"/>
    <path d="M212 76 V185 a18 18 0 0 0 36 0 V76" fill="#e6f0f7"/>
    <path d="M332 76 V185 a18 18 0 0 0 36 0 V76" fill="#e6f0f7"/>
  </g>
  <path class="zucker" d="M95 158 V185 a15 15 0 0 0 30 0 V158 Z"/>
  <path d="M215 158 V185 a15 15 0 0 0 30 0 V158 Z" fill="#ffffff" stroke="#c9d3de" stroke-width="1"/>
  <g fill="#c9d3de"><rect x="221" y="165" width="5" height="5"/><rect x="232" y="172" width="5" height="5"/><rect x="224" y="182" width="5" height="5"/><rect x="236" y="186" width="4" height="4"/></g>
  <path class="holz" d="M335 158 V185 a15 15 0 0 0 30 0 V158 Z"/>
  <!-- Rauch steigt in Glas A und C auf -->
  <g fill="#8a8f98">
    <circle class="rauch" cx="106" cy="146" r="6"/><circle class="rauch r2" cx="115" cy="150" r="5"/><circle class="rauch r3" cx="109" cy="148" r="4"/>
    <circle class="rauch" cx="346" cy="146" r="6"/><circle class="rauch r2" cx="355" cy="150" r="5"/><circle class="rauch r3" cx="349" cy="148" r="4"/>
  </g>
  <!-- Halteklammern -->
  <g fill="#7c8796"><rect x="86" y="84" width="48" height="8" rx="3"/><rect x="206" y="84" width="48" height="8" rx="3"/><rect x="326" y="84" width="48" height="8" rx="3"/></g>

  <!-- Brenner mit Flamme -->
  <g>
    <g transform="translate(110 0)">
      <path class="flamme" d="M0 210 C13 226 11 250 0 250 C-11 250 -13 226 0 210 Z" fill="#f28c28"/>
      <path class="flamme" d="M0 226 C6 236 5 250 0 250 C-5 250 -6 236 0 226 Z" fill="#4d8fe0"/>
      <rect x="-11" y="250" width="22" height="32" fill="#7c8796"/><rect x="-26" y="280" width="52" height="9" rx="3" fill="#5d6776"/>
    </g>
    <g transform="translate(230 0)">
      <path class="flamme" d="M0 210 C13 226 11 250 0 250 C-11 250 -13 226 0 210 Z" fill="#f28c28"/>
      <path class="flamme" d="M0 226 C6 236 5 250 0 250 C-5 250 -6 236 0 226 Z" fill="#4d8fe0"/>
      <rect x="-11" y="250" width="22" height="32" fill="#7c8796"/><rect x="-26" y="280" width="52" height="9" rx="3" fill="#5d6776"/>
    </g>
    <g transform="translate(350 0)">
      <path class="flamme" d="M0 210 C13 226 11 250 0 250 C-11 250 -13 226 0 210 Z" fill="#f28c28"/>
      <path class="flamme" d="M0 226 C6 236 5 250 0 250 C-5 250 -6 236 0 226 Z" fill="#4d8fe0"/>
      <rect x="-11" y="250" width="22" height="32" fill="#7c8796"/><rect x="-26" y="280" width="52" height="9" rx="3" fill="#5d6776"/>
    </g>
  </g>
</svg>
