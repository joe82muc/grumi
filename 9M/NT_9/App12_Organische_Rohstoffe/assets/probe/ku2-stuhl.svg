<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P1: Ein weißer Gartenstuhl aus Kunststoff steht viele Jahre in der Sonne. Er wird gelblich, bekommt Risse, ein Bein bricht ab, am Boden liegen viele kleine Krümel. -->
  <style>
    .strahl{stroke-dasharray:6 6;animation:fluss 1.2s linear infinite}
    @keyframes fluss{to{stroke-dashoffset:-12}}
    .st{fill:#e6d6ac;animation:farbe 14s infinite}
    @keyframes farbe{0%,12%{fill:#ffffff}20%,32%{fill:#f4ecd2}40%,95%{fill:#e6d6ac}100%{fill:#ffffff}}
    .j1{opacity:0;animation:j1 14s infinite}.j2{opacity:0;animation:j2 14s infinite}.j3{opacity:0;animation:j3 14s infinite}.j4{animation:j4 14s infinite}
    @keyframes j1{0%,13%{opacity:1}15%,100%{opacity:0}}
    @keyframes j2{0%,14%{opacity:0}17%,35%{opacity:1}38%,100%{opacity:0}} @keyframes j3{0%,38%{opacity:0}41%,57%{opacity:1}60%,100%{opacity:0}} @keyframes j4{0%,59%{opacity:0}63%,95%{opacity:1}100%{opacity:0}}
    .risse{animation:risse 14s infinite} @keyframes risse{0%,37%{opacity:0}41%,95%{opacity:1}100%{opacity:0}}
    .kruemel{animation:kruemel 14s infinite} @keyframes kruemel{0%,72%{opacity:0}76%,95%{opacity:1}100%{opacity:0}}
    .bein{transform-origin:325px 200px;transform:translate(16px,1px) rotate(84deg);animation:bein 14s infinite}
    @keyframes bein{0%,56%{transform:none}61%{transform:translate(3px,3px) rotate(8deg)}68%,95%{transform:translate(16px,1px) rotate(84deg)}100%{transform:none}}
    .kipp{transform-origin:195px 200px;transform:rotate(5deg);animation:kipp 14s infinite}
    @keyframes kipp{0%,58%{transform:none}66%,95%{transform:rotate(5deg)}100%{transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="520" height="260" fill="#eaf5fb"/>
  <rect y="196" width="520" height="64" fill="#9bc76a"/>
  <circle cx="70" cy="52" r="26" fill="#f6c343"/>
  <g stroke="#f6c343" stroke-width="4" stroke-linecap="round"><line x1="70" y1="12" x2="70" y2="2"/><line x1="70" y1="92" x2="70" y2="102"/><line x1="30" y1="52" x2="20" y2="52"/><line x1="110" y1="52" x2="120" y2="52"/><line x1="42" y1="24" x2="35" y2="17"/><line x1="98" y1="80" x2="105" y2="87"/><line x1="98" y1="24" x2="105" y2="17"/><line x1="42" y1="80" x2="35" y2="87"/></g>
