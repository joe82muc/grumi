  <g font-size="19" font-weight="700" fill="#0a5a66" text-anchor="middle">
    <text class="j1" x="430" y="40">neu</text><text class="j2" x="430" y="40">nach 2 Sommern</text>
    <text class="j3" x="430" y="40">nach einigen Jahren</text><text class="j4" x="430" y="40">noch später</text>
  </g>
