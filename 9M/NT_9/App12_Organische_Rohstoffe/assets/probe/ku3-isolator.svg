<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P1: A Ladekabel mit Hülle aus Kunststoff, eine Hand hält es, innen fließt Strom; B Bratpfanne aus Metall auf der heißen Herdplatte, der Kunststoffgriff bleibt kühl; C Regentonne aus Kunststoff im Regen über 10 Jahre unverändert. -->
  <style>
    .strom{stroke-dasharray:3 9;animation:strom .8s linear infinite}
    @keyframes strom{to{stroke-dashoffset:-12}}
    .ok{animation:ok 10s infinite} @keyframes ok{0%,26%{opacity:0}30%,95%{opacity:1}100%{opacity:0}}
    .akku{transform-box:fill-box;transform-origin:0 50%;animation:akku 10s infinite}
    @keyframes akku{0%{transform:scaleX(.2)}90%,100%{transform:scaleX(1)}}
    .platte{animation:platte 10s infinite}
    @keyframes platte{0%,5%{fill:#59636b}30%,95%{fill:#e74c3c}100%{fill:#59636b}}
    .pfanne{animation:pfanne 10s infinite}
    @keyframes pfanne{0%,10%{fill:#8e98a1}45%,95%{fill:#d9622b}100%{fill:#8e98a1}}
    .hitze{animation:hitze 10s infinite} @keyframes hitze{0%,26%{opacity:0}30%,95%{opacity:1}100%{opacity:0}}
    .dampf{animation:dampf 2.4s linear infinite}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    .qP{transform-box:fill-box;transform-origin:50% 100%;animation:qP 10s infinite}
    @keyframes qP{0%,10%{transform:scaleY(.15)}50%,95%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
    .qG{transform-box:fill-box;transform-origin:50% 100%;animation:qG 10s infinite}
    @keyframes qG{0%,10%{transform:scaleY(.15)}50%,95%{transform:scaleY(.24)}100%{transform:scaleY(.15)}}
    .regen{animation:regen 1.1s linear infinite}
    @keyframes regen{0%{transform:translateY(-20px);opacity:0}20%{opacity:.9}100%{transform:translateY(46px);opacity:0}}
    .j1{animation:j1 10s infinite}.j2{animation:j2 10s infinite}.j3{animation:j3 10s infinite}
    @keyframes j1{0%,0%{opacity:0}2%,30%{opacity:1}33%,100%{opacity:0}} @keyframes j2{0%,33%{opacity:0}36%,62%{opacity:1}65%,100%{opacity:0}} @keyframes j3{0%,64%{opacity:0}68%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#f6f9fb"/>
  <rect x="10" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="110" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">A</text>
  <rect x="220" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="320" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">B</text>
  <rect x="430" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="530" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">C</text>
  <rect x="22" y="70" width="40" height="56" rx="6" fill="#f4f6f8" stroke="#8e98a1" stroke-width="2"/>
  <circle cx="36" cy="98" r="3.2" fill="#59636b"/><circle cx="48" cy="98" r="3.2" fill="#59636b"/>
  <rect x="60" y="88" width="26" height="20" rx="3" fill="#1f6aa5"/>
  <path d="M84 98 H132 Q170 98 170 140 V198" fill="none" stroke="#c87533" stroke-width="5"/>
  <path class="strom" d="M84 98 H132 Q170 98 170 140 V198" fill="none" stroke="#ffd23f" stroke-width="4"/>
  <path d="M84 98 H132 Q170 98 170 140 V198" fill="none" stroke="#2f8fd8" stroke-width="16" stroke-opacity=".42" stroke-linecap="round"/>
  <rect x="148" y="198" width="44" height="74" rx="7" fill="#33414d"/><rect x="153" y="206" width="34" height="56" rx="3" fill="#9fd3f5"/>
  <rect x="160" y="226" width="18" height="10" rx="2" fill="none" stroke="#15212b" stroke-width="2"/><rect x="178" y="229" width="3" height="4" fill="#15212b"/>
  <rect class="akku" x="162" y="228" width="14" height="6" fill="#27ae60"/>
  <path d="M114 86 L106 44 H138 L142 86 Z" fill="#7aa6c9"/>
  <rect x="110" y="82" width="34" height="22" rx="8" fill="#f2c7a5" stroke="#b98a68" stroke-width="2"/>
  <rect x="111" y="98" width="8" height="15" rx="4" fill="#f2c7a5" stroke="#b98a68" stroke-width="1.6"/><rect x="119" y="98" width="8" height="15" rx="4" fill="#f2c7a5" stroke="#b98a68" stroke-width="1.6"/><rect x="127" y="98" width="8" height="15" rx="4" fill="#f2c7a5" stroke="#b98a68" stroke-width="1.6"/><rect x="135" y="98" width="8" height="15" rx="4" fill="#f2c7a5" stroke="#b98a68" stroke-width="1.6"/>
  <path d="M142 86 q9 4 4 14" fill="#f2c7a5" stroke="#b98a68" stroke-width="1.6"/>
  <g class="ok"><circle cx="160" cy="62" r="13" fill="#27ae60"/><path d="M153 62 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <line x1="54" y1="150" x2="102" y2="106" stroke="#566674" stroke-width="1.5"/>
  <text x="24" y="164" font-size="12" font-weight="700" fill="#1f6aa5">Hülle aus</text><text x="24" y="178" font-size="12" font-weight="700" fill="#1f6aa5">Kunststoff</text>
  <rect x="234" y="236" width="172" height="44" rx="4" fill="#4a545c"/>
  <rect class="platte" x="250" y="226" width="112" height="10" rx="3"/>
  <path class="pfanne" d="M246 194 H366 L360 224 H252 Z" stroke="#4a545c" stroke-width="2"/>
  <path d="M366 202 L412 186" stroke="#1f6aa5" stroke-width="13" stroke-linecap="round"/>
  <g class="hitze"><path class="dampf" style="animation-delay:0s" d="M276 188 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-0.8s" d="M306 188 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-1.6s" d="M336 188 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#b9a5a0" stroke-width="2.5" stroke-linecap="round"/></g>
  <text x="282" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#15212b">Pfanne</text><rect x="276" y="70" width="12" height="70" rx="6" fill="#ffffff" stroke="#6b7781" stroke-width="2"/>
  <rect class="qP" x="279" y="74" width="6" height="66" fill="#e74c3c"/><circle cx="282" cy="147" r="10" fill="#e74c3c" stroke="#6b7781" stroke-width="2"/>
  <line x1="282" y1="158" x2="290" y2="192" stroke="#566674" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="388" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#15212b">Griff</text><rect x="382" y="70" width="12" height="70" rx="6" fill="#ffffff" stroke="#6b7781" stroke-width="2"/>
  <rect class="qG" x="385" y="74" width="6" height="66" fill="#2f8fd8"/><circle cx="388" cy="147" r="10" fill="#2f8fd8" stroke="#6b7781" stroke-width="2"/>
  <line x1="388" y1="158" x2="394" y2="186" stroke="#566674" stroke-width="1.5" stroke-dasharray="3 3"/>
  <g font-size="17" font-weight="700" fill="#0a5a66" text-anchor="middle">
    <text class="j1" x="530" y="72">1 Jahr</text><text class="j2" x="530" y="72">5 Jahre</text><text class="j3" x="530" y="72">10 Jahre</text>
  </g>
  <line class="regen" style="animation-delay:0s" x1="460" y1="92" x2="456" y2="104" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.3s" x1="492" y1="104" x2="488" y2="116" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.7s" x1="524" y1="98" x2="520" y2="110" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.15s" x1="556" y1="92" x2="552" y2="104" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.5s" x1="588" y1="104" x2="584" y2="116" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.85s" x1="614" y1="98" x2="610" y2="110" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.6s" x1="476" y1="98" x2="472" y2="110" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.95s" x1="570" y1="104" x2="566" y2="116" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.4s" x1="540" y1="104" x2="536" y2="116" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/><line class="regen" style="animation-delay:-0.1s" x1="508" y1="92" x2="504" y2="104" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="530" cy="270" rx="70" ry="8" fill="#bfe0f5"/>
  <rect x="485" y="128" width="90" height="136" rx="8" fill="#2e8b57" stroke="#1e5e3a" stroke-width="2.5"/>
  <line x1="487" y1="170" x2="573" y2="170" stroke="#1e5e3a" stroke-width="3"/><line x1="487" y1="222" x2="573" y2="222" stroke="#1e5e3a" stroke-width="3"/>
  <ellipse cx="530" cy="128" rx="47" ry="9" fill="#3fa36b" stroke="#1e5e3a" stroke-width="2.5"/>
  <rect x="575" y="236" width="14" height="8" rx="2" fill="#1e5e3a"/>
  <path d="M494 140 V250" stroke="#ffffff" stroke-width="5" opacity=".25" stroke-linecap="round"/>
</svg>
