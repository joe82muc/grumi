<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe Kunststoffe (9M): Weg einer PET-Einwegflasche auf einem Ring mit vier Stellen.
       1 Fabrik (Erdöl → Granulat), 2 Rohling wird aufgeblasen und befüllt, 3 Pfandautomat presst die Flasche, 4 Zerkleinern zu Flakes.
       Eine kleine Flasche wandert im Uhrzeigersinn um den Ring; Rauch, Füllung, Einwurf und Schnipsel bewegen sich. -->
  <style>
    .ring{stroke-dasharray:12 10;animation:ring 1.4s linear infinite}
    @keyframes ring{to{stroke-dashoffset:-44}}
    .rauch{animation:rauch 2.4s ease-out infinite}
    @keyframes rauch{from{transform:translateY(0);opacity:.8}to{transform:translateY(-18px);opacity:0}}
    .fuell{transform-box:fill-box;transform-origin:50% 100%;animation:fuell 2.6s ease-in-out infinite}
    @keyframes fuell{0%{transform:scaleY(.05)}70%,100%{transform:scaleY(1)}}
    .luft{animation:luft 1s linear infinite}
    @keyframes luft{from{opacity:0;transform:translateY(6px)}50%{opacity:1}to{opacity:0;transform:translateY(-6px)}}
    .einwurf{animation:einwurf 2.4s ease-in-out infinite}
    @keyframes einwurf{0%{transform:translateX(-26px);opacity:1}60%{transform:translateX(0);opacity:1}80%,100%{transform:translateX(6px);opacity:0}}
    .flake{animation:flake 1.5s linear infinite}
    @keyframes flake{from{transform:translateY(-10px);opacity:0}25%{opacity:1}to{transform:translateY(22px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.ring,.rauch,.fuell,.luft,.einwurf,.flake{animation:none}}
  </style>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#127e8c"/></marker>
  </defs>
  <rect width="640" height="320" fill="#f6f9fb"/>
  <!-- Ring im Uhrzeigersinn -->
  <path id="weg" class="ring" d="M120 165 A200 105 0 1 1 520 165 A200 105 0 1 1 120 165" fill="none" stroke="#127e8c" stroke-width="5"/>
  <g fill="#127e8c"><path d="M314 56 l14 4 l-14 6z"/><path d="M326 274 l-14 -4 l14 -6z"/><path d="M518 150 l4 14 l5 -12z"/><path d="M122 180 l-4 -14 l-5 12z"/></g>
  <!-- wandernde Flasche -->
  <g>
    <path d="M-6 -12 h12 v4 q4 3 4 8 v12 q0 3 -3 3 h-14 q-3 0 -3 -3 v-12 q0 -5 4 -8z" fill="#8fd0f5" stroke="#1d5f8e" stroke-width="1.5"/>
    <animateMotion dur="12s" repeatCount="indefinite" path="M120 165 A200 105 0 1 1 520 165 A200 105 0 1 1 120 165"/>
  </g>

  <!-- Stelle 1: Fabrik, Erdöl wird zu Granulat -->
  <g transform="translate(80 30)">
    <rect width="150" height="88" rx="12" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/>
    <path d="M22 64 q-10 -14 0 -30 q10 16 0 30z" fill="#1f2a33"/>
    <rect x="44" y="40" width="44" height="34" fill="#9aa5ad" stroke="#566674" stroke-width="1.5"/>
    <rect x="78" y="18" width="10" height="24" fill="#566674"/>
    <circle class="rauch" cx="83" cy="12" r="6" fill="#c9d2d8"/><circle class="rauch" cx="88" cy="8" r="4" fill="#c9d2d8" style="animation-delay:1.2s"/>
    <rect x="52" y="52" width="10" height="10" fill="#fff6a8"/><rect x="70" y="52" width="10" height="10" fill="#fff6a8"/>
    <g fill="#ffffff" stroke="#8a97a3" stroke-width="1"><circle cx="106" cy="66" r="4"/><circle cx="116" cy="70" r="4"/><circle cx="126" cy="65" r="4"/><circle cx="111" cy="60" r="4"/><circle cx="121" cy="58" r="4"/><circle cx="131" cy="72" r="4"/></g>
    <path d="M92 66 h8" stroke="#566674" stroke-width="3" marker-end="url(#pf)"/>
  </g>
  <!-- Stelle 2: Rohling wird aufgeblasen und befüllt -->
  <g transform="translate(410 30)">
    <rect width="150" height="88" rx="12" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/>
    <rect x="22" y="32" width="14" height="38" rx="7" fill="#cfe8f7" stroke="#1d5f8e" stroke-width="1.5"/><rect x="20" y="28" width="18" height="6" rx="2" fill="#1d5f8e"/>
    <path d="M46 50 h16" stroke="#566674" stroke-width="3" marker-end="url(#pf)"/>
    <path d="M88 20 h14 v6 q12 6 12 18 v32 q0 4 -4 4 h-30 q-4 0 -4 -4 v-32 q0 -12 12 -18z" fill="#eaf6fd" stroke="#1d5f8e" stroke-width="2"/>
    <rect class="fuell" x="80" y="46" width="30" height="33" rx="3" fill="#7cc3ee"/>
    <g stroke="#9aa5ad" stroke-width="2.5" stroke-linecap="round"><line class="luft" x1="95" y1="14" x2="95" y2="6"/><line class="luft" x1="88" y1="14" x2="86" y2="7" style="animation-delay:.3s"/><line class="luft" x1="102" y1="14" x2="104" y2="7" style="animation-delay:.6s"/></g>
  </g>
  <!-- Stelle 3: Pfandautomat presst die Flasche -->
  <g transform="translate(410 214)">
    <rect width="150" height="88" rx="12" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/>
    <rect x="66" y="10" width="62" height="70" rx="6" fill="#9aa5ad" stroke="#566674" stroke-width="1.5"/>
    <circle cx="86" cy="36" r="12" fill="#33414d"/><rect x="104" y="24" width="16" height="10" rx="2" fill="#7bdc8f"/>
    <circle cx="112" cy="58" r="9" fill="#f2b632" stroke="#a87808" stroke-width="1.5"/><text x="112" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#5b4a2e">€</text>
    <g class="einwurf"><path d="M30 30 h26 q4 0 4 6 q0 6 -4 6 h-26 q-4 0 -6 -2 h-6 v-8 h6 q2 -2 6 -2z" fill="#8fd0f5" stroke="#1d5f8e" stroke-width="1.5"/></g>
    <path d="M18 70 q10 -6 22 -1 q10 4 20 0 l0 8 q-10 4 -20 0 q-12 -5 -22 1z" fill="#8fd0f5" stroke="#1d5f8e" stroke-width="1.5"/>
  </g>
  <!-- Stelle 4: Zerkleinern zu Flakes und Waschen -->
  <g transform="translate(80 214)">
    <rect width="150" height="88" rx="12" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/>
    <path d="M30 14 h70 l-8 24 h-54z" fill="#9aa5ad" stroke="#566674" stroke-width="1.5"/>
    <path d="M38 38 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8" fill="none" stroke="#33414d" stroke-width="2.5"/>
    <g><path class="flake" d="M46 56 l6 -2 l2 5 l-6 2z" fill="#8fd0f5"/><path class="flake" d="M62 58 l5 -3 l3 4 l-5 3z" fill="#7cc3ee" style="animation-delay:.4s"/><path class="flake" d="M76 55 l6 -1 l1 5 l-6 1z" fill="#8fd0f5" style="animation-delay:.8s"/><path class="flake" d="M88 57 l5 -2 l2 4 l-5 2z" fill="#b5e0f7" style="animation-delay:1.1s"/></g>
    <g fill="#2f6fdb"><path d="M120 30 q-6 9 0 13 q6 -4 0 -13z"/><path d="M132 44 q-5 8 0 11 q5 -3 0 -11z"/><path d="M118 56 q-5 8 0 11 q5 -3 0 -11z"/></g>
  </g>

  <!-- Nummern -->
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="80" cy="30" r="17" fill="#15212b"/><text x="80" y="37">1</text>
    <circle cx="560" cy="30" r="17" fill="#15212b"/><text x="560" y="37">2</text>
    <circle cx="560" cy="302" r="17" fill="#15212b"/><text x="560" y="309">3</text>
    <circle cx="80" cy="302" r="17" fill="#15212b"/><text x="80" y="309">4</text>
  </g>
</svg>
