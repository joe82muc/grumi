<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:9 8;animation:lauf 1.5s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-34}}
    .blitz{animation:blitz 1.6s ease-in-out infinite alternate}
    .b2{animation-delay:.5s}.b3{animation-delay:1s}
    @keyframes blitz{from{opacity:.45}to{opacity:1}}
    .neu{transform-box:fill-box;transform-origin:center;animation:neu 2.4s ease-out infinite}
    .n2{animation-delay:.8s}.n3{animation-delay:1.6s}
    @keyframes neu{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
    .weg{animation:weg 9s linear infinite}
    .w2{animation-delay:1.5s}.w3{animation-delay:3s}.w4{animation-delay:4.5s}.w5{animation-delay:6s}
    @keyframes weg{0%,12%{opacity:1}30%,88%{opacity:.08}100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.lauf,.blitz,.neu,.weg{animation:none}.w2,.w4{opacity:.5}.w3,.w5{opacity:.15}}
  </style>
  <defs>
    <marker id="po" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
  </defs>
  <!-- Himmel und Boden -->
  <rect width="640" height="420" fill="#cfe8fa"/>
  <rect width="640" height="46" fill="#0e1f38"/>
  <text x="628" y="70" text-anchor="end" font-size="13" font-weight="700" fill="#1d4f7a">Luft</text>
  <rect y="276" width="640" height="144" fill="#8a6b42"/>
  <rect y="276" width="640" height="14" fill="#6fae4f"/>
  <rect y="352" width="640" height="68" fill="#6f5433"/>
  <text x="628" y="408" text-anchor="end" font-size="13" font-weight="700" fill="#f1e3c8">Boden</text>
  <!-- 1: Strahlen von oben, in der Luft erscheinen Punkte -->
  <g fill="none" stroke="#ffd23f" stroke-width="5" stroke-linejoin="round">
    <path class="blitz" d="M96 0 L84 26 L100 30 L86 62 L102 66 L90 92"/>
    <path class="blitz b2" d="M136 0 L124 26 L140 30 L126 62 L142 66 L130 92"/>
    <path class="blitz b3" d="M176 0 L164 26 L180 30 L166 62 L182 66 L170 92"/>
  </g>
  <g fill="#f97316" stroke="#9a3412" stroke-width="1.5">
    <circle class="neu" cx="98" cy="116" r="7"/><circle class="neu n2" cx="134" cy="126" r="7"/><circle class="neu n3" cx="170" cy="114" r="7"/>
  </g>
  <!-- Weg der Punkte: Luft -> Baum -> Tier -> Boden -->
  <g fill="none" stroke="#c2410c" stroke-width="4">
    <path class="lauf" d="M190 126 Q250 150 292 176" marker-end="url(#po)"/>
    <path class="lauf" d="M398 206 L424 206" marker-end="url(#po)"/>
    <path class="lauf" d="M520 282 L520 318" marker-end="url(#po)"/>
  </g>
  <!-- 2: Baum -->
  <rect x="336" y="212" width="16" height="66" fill="#6b4a2b"/>
  <circle cx="344" cy="186" r="52" fill="#2f7d32"/>
  <circle cx="312" cy="206" r="26" fill="#2f7d32"/><circle cx="378" cy="204" r="26" fill="#2f7d32"/>
  <g fill="#f97316" stroke="#9a3412" stroke-width="1.5"><circle cx="330" cy="170" r="6"/><circle cx="358" cy="188" r="6"/><circle cx="336" cy="206" r="6"/></g>
  <!-- 3: Reh frisst am Baum -->
  <g fill="#b07a45" stroke="#6b4a2b" stroke-width="2" stroke-linejoin="round">
    <rect x="462" y="244" width="8" height="34"/><rect x="478" y="244" width="8" height="34"/><rect x="532" y="244" width="8" height="34"/><rect x="548" y="244" width="8" height="34"/>
    <path d="M466 222 L440 196 L452 190 L482 214z"/>
    <ellipse cx="508" cy="232" rx="54" ry="22"/>
    <ellipse cx="438" cy="196" rx="16" ry="10"/>
    <path d="M444 188 L450 172 L456 188z"/>
    <path d="M560 222 L574 214 L568 232z"/>
  </g>
  <circle cx="432" cy="194" r="2.2" fill="#222"/>
  <g fill="#f97316" stroke="#9a3412" stroke-width="1.5"><circle cx="490" cy="230" r="6"/><circle cx="516" cy="238" r="6"/><circle cx="536" cy="226" r="6"/></g>
  <!-- 4: Knochen im Boden, Punkte verblassen -->
  <g fill="#f2ead8" stroke="#8c7a5b" stroke-width="2">
    <rect x="452" y="358" width="136" height="18" rx="9"/>
    <circle cx="450" cy="356" r="11"/><circle cx="450" cy="378" r="11"/><circle cx="590" cy="356" r="11"/><circle cx="590" cy="378" r="11"/>
  </g>
  <rect x="452" y="360" width="136" height="14" fill="#f2ead8"/>
  <g fill="#f97316" stroke="#9a3412" stroke-width="1.5">
    <circle cx="474" cy="367" r="6"/><circle class="weg" cx="498" cy="367" r="6"/><circle class="weg w2" cx="522" cy="367" r="6"/><circle class="weg w3" cx="546" cy="367" r="6"/><circle class="weg w4" cx="568" cy="367" r="6"/><circle class="weg w5" cx="455" cy="367" r="6"/>
  </g>
  <!-- Legende -->
  <rect x="14" y="368" width="150" height="34" rx="8" fill="#fff" opacity=".92"/>
  <circle cx="34" cy="385" r="7" fill="#f97316" stroke="#9a3412" stroke-width="1.5"/>
  <text x="50" y="390" font-size="14" font-weight="700" fill="#15212b">= C-14-Atom</text>
  <!-- Nummern -->
  <g font-size="20" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="226" cy="84" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="226" y="91">1</text>
    <circle cx="270" cy="216" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="270" y="223">2</text>
    <circle cx="600" cy="214" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="600" y="221">3</text>
    <circle cx="412" cy="367" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="412" y="374">4</text>
  </g>
</svg>
