<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P5: Weg der PET-Einwegflasche als Kreis – Erdöl und Raffinerie führen zum PET-Granulat, dann Rohling, Abfüller, Geschäft, Pfandautomat, Schredder-Anlage; die Flakes gehen zurück zum Granulat. Ein Punkt läuft den Weg ab. -->
  <style>
    .lauf{animation:lauf 1.6s linear infinite}@keyframes lauf{to{stroke-dashoffset:-22}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="330" fill="#f6f9fb"/>
  <circle cx="330" cy="178" r="118" fill="none" stroke="#d6e0e8" stroke-width="12"/>
  <circle class="lauf" cx="330" cy="178" r="118" fill="none" stroke="#9fb6c6" stroke-width="3" stroke-dasharray="10 12"/>
  <circle cx="330" cy="60" r="27" fill="#ffffff" stroke="#3a7fa8" stroke-width="3"/><g transform="translate(330 60)"><circle cx="-8" cy="-2" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="0" cy="-7" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="8" cy="-2" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="-4" cy="5" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="4" cy="5" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="-11" cy="7" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="11" cy="7" r="4" fill="#3a8fd8" stroke="#1f6aa5"/><circle cx="0" cy="12" r="4" fill="#3a8fd8" stroke="#1f6aa5"/></g><text x="364" y="44" text-anchor="start" font-size="14" font-weight="700" fill="#15212b">PET-Granulat</text>
  <circle cx="432.2" cy="119" r="27" fill="#ffffff" stroke="#3a7fa8" stroke-width="3"/><g transform="translate(432.2 119)"><rect x="-6" y="-11" width="12" height="26" rx="6" fill="#bfe3f5" stroke="#3a7fa8" stroke-width="2"/><rect x="-8" y="-17" width="16" height="7" rx="1" fill="#3a7fa8"/></g><text x="468.2" y="124" text-anchor="start" font-size="14" font-weight="700" fill="#15212b">Rohling</text>
  <circle cx="432.2" cy="237" r="27" fill="#ffffff" stroke="#3a7fa8" stroke-width="3"/><g transform="translate(432.2 237)"><path d="M-8 16 V0 Q-8 -7 -3 -9 V-16 H3 V-9 Q8 -7 8 0 V16 Z" fill="#bfe3f5" stroke="#3a7fa8" stroke-width="2"/><rect x="-8" y="3" width="16" height="13" fill="#5aa9d6" opacity=".7"/></g><text x="468.2" y="242" text-anchor="start" font-size="14" font-weight="700" fill="#15212b">Abfüller</text>
  <circle cx="330" cy="296" r="27" fill="#ffffff" stroke="#3a7fa8" stroke-width="3"/><g transform="translate(330 296)"><path d="M-16 -3 L0 -15 L16 -3 Z" fill="#c0392b"/><rect x="-12" y="-3" width="24" height="17" fill="#ffffff" stroke="#6b7781" stroke-width="1.5"/><rect x="-4" y="4" width="8" height="10" fill="#6b7781"/></g><text x="366" y="301" text-anchor="start" font-size="14" font-weight="700" fill="#15212b">Geschäft</text>
  <circle cx="227.8" cy="237" r="27" fill="#ffffff" stroke="#3a7fa8" stroke-width="3"/><g transform="translate(227.8 237)"><rect x="-11" y="-16" width="22" height="31" rx="3" fill="#8e98a1" stroke="#59636b" stroke-width="1.5"/><rect x="-7" y="-12" width="14" height="7" fill="#d9efff"/><circle cx="0" cy="5" r="5" fill="#2b3640"/></g><text x="191.8" y="242" text-anchor="end" font-size="14" font-weight="700" fill="#15212b">Pfandautomat</text>
  <circle cx="227.8" cy="119" r="27" fill="#ffffff" stroke="#3a7fa8" stroke-width="3"/><g transform="translate(227.8 119)"><path d="M-15 -4 L-10 -11 L-5 -4 L0 -11 L5 -4 L10 -11 L15 -4 V9 H-15 Z" fill="#6b7781"/><rect x="-10" y="11" width="5" height="3" fill="#3a8fd8"/><rect x="-2" y="12" width="4" height="3" fill="#3a8fd8"/><rect x="5" y="11" width="5" height="3" fill="#3a8fd8"/></g><text x="191.8" y="124" text-anchor="end" font-size="14" font-weight="700" fill="#15212b">Schredder-Anlage</text>
  <text x="266.6" y="69.8" text-anchor="end" font-size="13" font-weight="700" fill="#0a5a66">Flakes</text>
  <circle cx="40" cy="44" r="19" fill="#ffffff" stroke="#6b7781" stroke-width="2"/><path d="M40 32 Q50 46 46 51 Q40 57 34 51 Q30 46 40 32 Z" fill="#2b2b2b"/><text x="40" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#15212b">Erdöl</text>
  <circle cx="136" cy="44" r="19" fill="#ffffff" stroke="#6b7781" stroke-width="2"/><g fill="#8e98a1" stroke="#59636b"><rect x="126" y="34" width="8" height="22"/><rect x="138" y="28" width="8" height="28"/></g><text x="136" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#15212b">Raffinerie</text>
  <g stroke="#6b7781" stroke-width="2.5" fill="none"><path d="M60 44 H112 m-7 -5 l7 5 l-7 5"/><path d="M156 44 H296 m-7 -5 l7 5 l-7 5"/></g>
  <g><circle r="9" fill="#e67e22" stroke="#a65412" stroke-width="2"/><animateMotion dur="14s" repeatCount="indefinite" path="M330 60 A118 118 0 1 1 329.99 60"/></g>
</svg>
