<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 2 Kunststoffe, P2: drei Bilder zur Herstellung von Polyethen – A: lange Kette mit Einfachbindungen, B: einzelne Ethen-Moleküle mit Doppelbindung, C: ein Katalysator spaltet die Doppelbindung auf. -->
  <style>
    .w1{transform-box:fill-box;transform-origin:center;animation:w 2.2s ease-in-out infinite alternate}
    .w2{transform-box:fill-box;transform-origin:center;animation:w 2.9s ease-in-out infinite alternate-reverse}
    .w3{transform-box:fill-box;transform-origin:center;animation:w 2.5s ease-in-out infinite alternate}
    @keyframes w{from{transform:translate(-3px,-2px) rotate(-5deg)}to{transform:translate(3px,2px) rotate(5deg)}}
    .kette{animation:kette 1.8s ease-in-out infinite alternate}
    @keyframes kette{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
    .kat{animation:kat 6s infinite}
    @keyframes kat{0%,5%{transform:translateY(-56px)}28%,84%{transform:none}96%,100%{transform:translateY(-56px)}}
    .oben{opacity:0;animation:oben 6s infinite}
    @keyframes oben{0%,34%{opacity:1}44%,88%{opacity:0}96%,100%{opacity:1}}
    .haken{animation:haken 6s infinite}
    @keyframes haken{0%,44%{opacity:0}54%,86%{opacity:1}94%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#f6f9fb"/>
  <rect x="10" y="40" width="200" height="252" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="110" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#15212b">A</text>
