<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Arial, Helvetica, sans-serif">
  <style>
    .p1{opacity:0;animation:p1 10s linear infinite}
    @keyframes p1{0%,1.5%{opacity:0;transform:translate(14px,160px)}2%{opacity:1;transform:translate(14px,160px)}22%{opacity:1;transform:translate(240px,160px)}28%{opacity:1;transform:translate(330px,160px)}29.5%,100%{opacity:0;transform:translate(330px,160px)}}
    .p2{opacity:0;animation:p2 10s linear infinite}
    @keyframes p2{0%,63.5%{opacity:0;transform:translate(430px,161px)}64%{opacity:1;transform:translate(430px,161px)}86%{opacity:1;transform:translate(630px,161px)}87.5%,100%{opacity:0;transform:translate(630px,161px)}}
    .v{animation:v 10s infinite}
    @keyframes v{0%,28%{opacity:1}36%,92%{opacity:0}100%{opacity:1}}
    .q0{transform:translateX(12px);animation:q 10s infinite;animation-delay:0.00s}
    .q1{transform:translateX(12px);animation:q 10s infinite;animation-delay:0.12s}
    .q2{transform:translateX(12px);animation:q 10s infinite;animation-delay:0.24s}
    .q3{transform:translateX(12px);animation:q 10s infinite;animation-delay:0.36s}
    .q4{transform:translateX(12px);animation:q 10s infinite;animation-delay:0.48s}
    .q5{transform:translateX(12px);animation:q 10s infinite;animation-delay:0.60s}
    @keyframes q{0%,32%{opacity:0;transform:none}36%{opacity:1;transform:none}52%{opacity:1;transform:translateX(26px)}62%,100%{opacity:0;transform:translateX(26px)}}
    .rz{animation:rz 10s infinite}
    @keyframes rz{0%,52%{fill:#2e8b57}56%,66%{fill:#f2b600}72%,100%{fill:#2e8b57}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
