<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe 3 Kunststoffe, P3: Zwei Kunststoffproben in der Brennerflamme – Probe X brennt mit kleiner, heller Flamme ohne Rauch und tropft ab (Kohlenstoffdioxid und Wasser), Probe Y brennt mit großer Flamme und dickem schwarzem, rußendem Rauch. -->
  <style>
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
    .an{animation:an 8s infinite} @keyframes an{0%,10%{opacity:0}14%,95%{opacity:1}100%{opacity:0}}
    .tropf{animation:tropf 1.5s linear infinite}
    @keyframes tropf{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(112px);opacity:.8}}
    .gas{animation:gas 2.4s linear infinite}
    @keyframes gas{0%{transform:translateY(10px);opacity:0}40%{opacity:.8}100%{transform:translateY(-16px);opacity:0}}
    .rauch{transform-box:fill-box;transform-origin:50% 50%;animation:rauch 2.6s linear infinite}
    @keyframes rauch{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.85}100%{transform:translateY(-110px) scale(1.5);opacity:0}}
    .russ{animation:russ 2s linear infinite}
    @keyframes russ{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="350" fill="#f6f9fb"/>
  <rect x="10" y="40" width="300" height="300" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="160" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Probe X</text>
  <rect x="330" y="40" width="300" height="300" rx="10" fill="#ffffff" stroke="#9aa9b5" stroke-width="2"/><text x="480" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#15212b">Probe Y</text>
  <defs><clipPath id="b0"><rect x="10" y="40" width="300" height="300" rx="10"/></clipPath><clipPath id="b1"><rect x="330" y="40" width="300" height="300" rx="10"/></clipPath></defs>
  <g clip-path="url(#b0)"><g transform="translate(0 50)">
    <rect x="110" y="270" width="60" height="14" rx="3" fill="#4a545c"/><rect x="133" y="196" width="14" height="76" fill="#8e98a1" stroke="#5f6870"/>
    <path class="flamme" d="M140 150 Q153 178 147 196 H133 Q127 178 140 150 Z" fill="#5dade2" opacity=".75"/>
    <path class="flamme" d="M140 168 Q146 184 144 196 H136 Q134 184 140 168 Z" fill="#d6eaf8"/>
    <path d="M290 84 L154 136 M290 96 L154 144" stroke="#59636b" stroke-width="4" stroke-linecap="round"/>
    <rect x="124" y="134" width="32" height="11" rx="2" fill="#f4f6f8" stroke="#8e98a1" stroke-width="1.5"/>
    <g class="an">
      <path class="flamme" d="M140 102 Q152 122 148 134 H132 Q128 122 140 102 Z" fill="#f6c343"/>
      <path class="flamme" d="M140 116 Q145 126 144 134 H136 Q135 126 140 116 Z" fill="#fff6d5"/>
      <circle class="tropf" cx="134" cy="150" r="3.6" fill="#f4f6f8" stroke="#8e98a1"/><circle class="tropf" style="animation-delay:-.75s" cx="145" cy="150" r="3.2" fill="#f4f6f8" stroke="#8e98a1"/>
      <g class="gas" fill="none" stroke="#3a7fa8" stroke-width="2.5" stroke-linecap="round"><path d="M120 94 v-16 m-5 5 l5 -5 l5 5"/><path d="M160 94 v-16 m-5 5 l5 -5 l5 5"/></g>
      <text x="150" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6aa5">Kohlenstoffdioxid und Wasser</text>
    </g>
  </g></g>
  <g clip-path="url(#b1)"><g transform="translate(0 50)">
    <rect x="430" y="270" width="60" height="14" rx="3" fill="#4a545c"/><rect x="453" y="196" width="14" height="76" fill="#8e98a1" stroke="#5f6870"/>
    <path class="flamme" d="M460 150 Q473 178 467 196 H453 Q447 178 460 150 Z" fill="#5dade2" opacity=".75"/>
    <path class="flamme" d="M460 168 Q466 184 464 196 H456 Q454 184 460 168 Z" fill="#d6eaf8"/>
    <path d="M610 84 L474 136 M610 96 L474 144" stroke="#59636b" stroke-width="4" stroke-linecap="round"/>
    <rect x="444" y="134" width="32" height="11" rx="2" fill="#fff3c4" stroke="#8e98a1" stroke-width="1.5"/>
    <g class="an">
      <circle class="rauch" style="animation-delay:0s" cx="448" cy="76" r="16" fill="#2b2b2b" opacity=".8"/><circle class="rauch" style="animation-delay:-0.5s" cx="470" cy="76" r="20" fill="#2b2b2b" opacity=".8"/><circle class="rauch" style="animation-delay:-1.1s" cx="456" cy="76" r="18" fill="#2b2b2b" opacity=".8"/><circle class="rauch" style="animation-delay:-1.6s" cx="474" cy="76" r="14" fill="#2b2b2b" opacity=".8"/><circle class="rauch" style="animation-delay:-2.1s" cx="446" cy="76" r="22" fill="#2b2b2b" opacity=".8"/><rect class="russ" style="animation-delay:0s" x="434" y="92" width="4" height="3" fill="#15212b"/><rect class="russ" style="animation-delay:-0.4s" x="482" y="92" width="4" height="3" fill="#15212b"/><rect class="russ" style="animation-delay:-0.8s" x="452" y="92" width="4" height="3" fill="#15212b"/><rect class="russ" style="animation-delay:-1.2s" x="490" y="92" width="4" height="3" fill="#15212b"/><rect class="russ" style="animation-delay:-1.6s" x="464" y="92" width="4" height="3" fill="#15212b"/><rect class="russ" style="animation-delay:-1s" x="426" y="92" width="4" height="3" fill="#15212b"/>
      <path class="flamme" d="M460 58 Q494 104 480 136 H440 Q426 104 460 58 Z" fill="#f39c12"/>
      <path class="flamme" style="animation-duration:.35s" d="M460 86 Q476 112 470 134 H450 Q444 112 460 86 Z" fill="#f6c343"/>
    </g>
  </g></g>
</svg>
