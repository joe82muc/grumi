<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <!-- Probe Kunststoffe (9M): Schnitt durch eine Schmelzpresse mit den Stellen 1 (Trichter), 2 (Heizung), 3 (Schnecke).
       Körnchen fallen, die Schnecke dreht sich (Gänge wandern nach rechts), die Heizbänder glühen, rechts kommt der Strang heraus. -->
  <style>
    .fall{animation:fall 1.6s linear infinite}
    @keyframes fall{from{transform:translateY(-34px);opacity:0}20%{opacity:1}to{transform:translateY(30px);opacity:0}}
    .gang{animation:gang .9s linear infinite}
    @keyframes gang{to{transform:translateX(28px)}}
    .gluehen{animation:gluehen 1.8s ease-in-out infinite alternate}
    @keyframes gluehen{from{opacity:.65}to{opacity:1}}
    .strang{animation:strang 2.4s linear infinite}
    @keyframes strang{to{stroke-dashoffset:-40}}
    @media (prefers-reduced-motion: reduce){.fall,.gang,.gluehen,.strang{animation:none}}
  </style>
  <defs>
    <linearGradient id="schmelze" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f3d9b5" stop-opacity="0"/><stop offset=".35" stop-color="#f1b46d"/><stop offset="1" stop-color="#e8873a"/>
    </linearGradient>
    <clipPath id="kanal"><rect x="132" y="160" width="398" height="50"/></clipPath>
  </defs>
  <rect width="640" height="320" fill="#f6f9fb"/>
  <!-- Antrieb -->
  <rect x="40" y="152" width="72" height="66" rx="8" fill="#566674"/>
  <circle cx="76" cy="185" r="18" fill="none" stroke="#c9d2d8" stroke-width="4" stroke-dasharray="80 34"/>
  <path d="M90 170 l6 -9 l3 11z" fill="#c9d2d8"/>
  <!-- Zylinder -->
  <rect x="112" y="148" width="430" height="74" rx="10" fill="#b7c3cc" stroke="#5f6c75" stroke-width="3"/>
  <rect x="132" y="160" width="398" height="50" fill="#eef3f6"/>
  <!-- Masse im Zylinder: links Körnchen, nach rechts geschmolzen -->
  <g clip-path="url(#kanal)">
    <rect x="132" y="160" width="398" height="50" fill="url(#schmelze)"/>
    <g fill="#ffffff" stroke="#8a97a3" stroke-width="1.2">
      <circle cx="150" cy="168" r="5"/><circle cx="166" cy="200" r="5"/><circle cx="184" cy="172" r="5"/><circle cx="200" cy="198" r="5"/>
      <circle cx="218" cy="170" r="5"/><circle cx="236" cy="200" r="4.5"/><circle cx="252" cy="172" r="4"/><circle cx="270" cy="199" r="3.5"/>
    </g>
    <!-- Schnecke: Welle und schräge Gänge, die nach rechts wandern -->
    <rect x="132" y="179" width="398" height="12" fill="#7d8a94"/>
    <g class="gang" fill="#5f6c75">
      <path d="M104 160 l10 0 l-14 50 l-10 0z"/><path d="M132 160 l10 0 l-14 50 l-10 0z"/><path d="M160 160 l10 0 l-14 50 l-10 0z"/><path d="M188 160 l10 0 l-14 50 l-10 0z"/>
      <path d="M216 160 l10 0 l-14 50 l-10 0z"/><path d="M244 160 l10 0 l-14 50 l-10 0z"/><path d="M272 160 l10 0 l-14 50 l-10 0z"/><path d="M300 160 l10 0 l-14 50 l-10 0z"/>
      <path d="M328 160 l10 0 l-14 50 l-10 0z"/><path d="M356 160 l10 0 l-14 50 l-10 0z"/><path d="M384 160 l10 0 l-14 50 l-10 0z"/><path d="M412 160 l10 0 l-14 50 l-10 0z"/>
      <path d="M440 160 l10 0 l-14 50 l-10 0z"/><path d="M468 160 l10 0 l-14 50 l-10 0z"/><path d="M496 160 l10 0 l-14 50 l-10 0z"/>
    </g>
  </g>
  <!-- Heizbänder -->
  <g class="gluehen" fill="#e0453a" stroke="#a52a23" stroke-width="1.5">
    <rect x="300" y="136" width="30" height="12" rx="3"/><rect x="340" y="136" width="30" height="12" rx="3"/><rect x="380" y="136" width="30" height="12" rx="3"/><rect x="420" y="136" width="30" height="12" rx="3"/>
    <rect x="300" y="222" width="30" height="12" rx="3"/><rect x="340" y="222" width="30" height="12" rx="3"/><rect x="380" y="222" width="30" height="12" rx="3"/><rect x="420" y="222" width="30" height="12" rx="3"/>
  </g>
  <!-- Düse und Strang -->
  <path d="M542 156 L578 172 L578 198 L542 214 Z" fill="#8d99a2" stroke="#5f6c75" stroke-width="3"/>
  <line class="strang" x1="578" y1="185" x2="636" y2="185" stroke="#e8873a" stroke-width="20" stroke-dasharray="30 10"/>
  <!-- Trichter mit Körnchen -->
  <path d="M150 52 L250 52 L212 136 L188 136 Z" fill="#dfe6ec" stroke="#5f6c75" stroke-width="3"/>
  <rect x="188" y="136" width="24" height="14" fill="#dfe6ec" stroke="#5f6c75" stroke-width="3"/>
  <g fill="#ffffff" stroke="#8a97a3" stroke-width="1.2">
    <circle cx="176" cy="68" r="5"/><circle cx="192" cy="64" r="5"/><circle cx="208" cy="68" r="5"/><circle cx="224" cy="64" r="5"/>
    <circle cx="184" cy="80" r="5"/><circle cx="200" cy="80" r="5"/><circle cx="216" cy="80" r="5"/><circle cx="194" cy="94" r="5"/><circle cx="208" cy="94" r="5"/>
  </g>
  <g fill="#ffffff" stroke="#8a97a3" stroke-width="1.2">
    <circle class="fall" cx="196" cy="124" r="4.5"/><circle class="fall" cx="204" cy="118" r="4.5" style="animation-delay:.5s"/><circle class="fall" cx="200" cy="128" r="4.5" style="animation-delay:1s"/>
  </g>
  <!-- Nummern -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <line x1="132" y1="64" x2="160" y2="70" stroke="#15212b" stroke-width="2"/>
    <circle cx="116" cy="60" r="18" fill="#15212b"/><text x="116" y="68" fill="#ffffff">1</text>
    <line x1="375" y1="104" x2="375" y2="134" stroke="#15212b" stroke-width="2"/>
    <circle cx="375" cy="88" r="18" fill="#15212b"/><text x="375" y="96" fill="#ffffff">2</text>
    <line x1="245" y1="264" x2="245" y2="192" stroke="#15212b" stroke-width="2"/>
    <circle cx="245" cy="280" r="18" fill="#15212b"/><text x="245" y="288" fill="#ffffff">3</text>
  </g>
</svg>
