<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Arial, Helvetica, sans-serif">
  <style>
    .lauf{stroke-dasharray:10 8;animation:lauf 1.4s linear infinite}
    @keyframes lauf{to{stroke-dashoffset:-36}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    .r2{animation-delay:1.2s}
    @keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.15);opacity:0}}
    .stern{animation:blink 2.2s ease-in-out infinite alternate}
    .s2{animation-delay:.7s}.s3{animation-delay:1.3s}
    @keyframes blink{from{opacity:.35}to{opacity:1}}
    .dampf{animation:dampf 3.6s linear infinite}
    .d2{animation-delay:1.8s}
    @keyframes dampf{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-46px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.lauf,.ring,.stern,.dampf{animation:none}.ring{opacity:.6}.dampf{opacity:.8}}
  </style>
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0a800"/></marker>
    <marker id="po" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker>
    <g id="zeichen">
      <circle r="10" fill="#ffd23f" stroke="#222" stroke-width="1.5"/>
      <g fill="#222"><path d="M0 0L6.9 -4A8 8 0 0 1 6.9 4z" transform="rotate(90)"/><path d="M0 0L6.9 -4A8 8 0 0 1 6.9 4z" transform="rotate(210)"/><path d="M0 0L6.9 -4A8 8 0 0 1 6.9 4z" transform="rotate(330)"/></g>
      <circle r="2.8" fill="#ffd23f"/><circle r="1.5" fill="#222"/>
    </g>
  </defs>
  <!-- Weltall, Lufthülle, Boden -->
  <rect width="640" height="380" fill="#cfe8fa"/>
  <rect width="640" height="62" fill="#0e1f38"/>
  <g fill="#fff"><circle class="stern" cx="210" cy="18" r="1.8"/><circle class="stern s2" cx="300" cy="40" r="1.5"/><circle class="stern s3" cx="390" cy="16" r="1.8"/><circle class="stern" cx="470" cy="44" r="1.5"/><circle class="stern s2" cx="540" cy="22" r="1.8"/><circle class="stern s3" cx="610" cy="46" r="1.5"/><circle class="stern s2" cx="22" cy="30" r="1.5"/></g>
  <text x="628" y="24" text-anchor="end" font-size="14" font-weight="700" fill="#cfe3ff">Weltall</text>
  <text x="628" y="84" text-anchor="end" font-size="13" font-weight="700" fill="#1d4f7a">Lufthülle der Erde</text>
  <rect y="250" width="640" height="130" fill="#8a6b42"/>
  <rect y="250" width="640" height="16" fill="#6fae4f"/>
  <!-- Gestein im Untergrund -->
  <path d="M196 380 L206 318 L236 290 L286 284 L330 296 L356 330 L362 380z" fill="#9aa3ad" stroke="#5b6570" stroke-width="2"/>
  <g stroke="#5b6570" stroke-width="2" fill="none"><path d="M236 290 L250 330 L210 350"/><path d="M286 284 L300 340 L356 330"/><path d="M250 330 L300 340 L290 380"/></g>
  <text x="279" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Gestein</text>
  <!-- A: von oben -->
  <g fill="none" stroke="#e0a800" stroke-width="5">
    <path class="lauf" d="M50 8 L50 236" marker-end="url(#pg)"/>
    <path class="lauf" d="M92 8 L92 236" marker-end="url(#pg)"/>
    <path class="lauf" d="M134 8 L134 236" marker-end="url(#pg)"/>
  </g>
  <!-- B: aus dem Gestein -->
  <g fill="none" stroke="#d9480f" stroke-width="5">
    <path class="lauf" d="M240 300 L240 206" marker-end="url(#po)"/>
    <path class="lauf" d="M279 296 L279 206" marker-end="url(#po)"/>
    <path class="lauf" d="M318 300 L318 206" marker-end="url(#po)"/>
  </g>
  <!-- C: Mensch -->
  <g fill="none" stroke="#7a4fc1" stroke-width="3">
    <ellipse class="ring" cx="420" cy="214" rx="34" ry="46"/>
    <ellipse class="ring r2" cx="420" cy="214" rx="34" ry="46"/>
  </g>
  <g fill="#2f4f6f" stroke="#2f4f6f" stroke-linecap="round">
    <circle cx="420" cy="186" r="10" stroke="none"/>
    <rect x="411" y="198" width="18" height="30" rx="6" stroke="none"/>
    <path d="M413 204 L402 222 M427 204 L438 222 M416 227 L414 250 M424 227 L426 250" stroke-width="5" fill="none"/>
  </g>
  <!-- D: Kraftwerk und Krankenhaus -->
  <g class="wolken" fill="#fff"><circle class="dampf" cx="508" cy="176" r="9"/><circle class="dampf d2" cx="520" cy="172" r="7"/></g>
  <path d="M488 250 Q500 210 496 178 L530 178 Q526 210 538 250z" fill="#d9dee4" stroke="#6b7785" stroke-width="2"/>
  <path d="M540 250 L540 222 A16 16 0 0 1 572 222 L572 250z" fill="#e9edf1" stroke="#6b7785" stroke-width="2"/>
  <use href="#zeichen" transform="translate(556 230) scale(.8)"/>
  <rect x="582" y="206" width="46" height="44" fill="#fff" stroke="#6b7785" stroke-width="2"/>
  <path d="M601 213 h8 v6 h6 v8 h-6 v6 h-8 v-6 h-6 v-8 h6z" fill="#d7263d"/>
  <use href="#zeichen" transform="translate(620 240) scale(.55)"/>
  <!-- Buchstaben -->
  <g font-size="20" font-weight="900" fill="#fff" text-anchor="middle">
    <circle cx="170" cy="130" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="170" y="137">A</text>
    <circle cx="279" cy="180" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="279" y="187">B</text>
    <circle cx="420" cy="140" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="420" y="147">C</text>
    <circle cx="556" cy="140" r="17" fill="#1f5f99" stroke="#fff" stroke-width="2"/><text x="556" y="147">D</text>
  </g>
</svg>
