<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <!-- Eigenes Schaubild: Strahlung zwischen Sonne, Erde und Atmosphäre ohne Beschriftung (Übung „Beschriften“ in modul-5.html) -->
  <defs>
    <linearGradient id="all" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b33"/><stop offset="1" stop-color="#1d3557"/></linearGradient>
    <linearGradient id="huelle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ecae6"/><stop offset="1" stop-color="#cfeaf6"/></linearGradient>
    <marker id="pr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#d62828"/></marker>
    <marker id="pg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e8a400"/></marker>
  </defs>
  <!-- Weltall -->
  <rect width="600" height="100" fill="url(#all)"/>
  <g fill="#fff"><circle cx="160" cy="22" r="1.6"/><circle cx="230" cy="60" r="1.2"/><circle cx="410" cy="18" r="1.4"/><circle cx="560" cy="70" r="1.6"/><circle cx="470" cy="80" r="1.1"/><circle cx="270" cy="14" r="1.1"/><circle cx="125" cy="78" r="1.2"/></g>
  <!-- Sonne -->
  <circle cx="52" cy="50" r="30" fill="#ffd166"/>
  <circle cx="52" cy="50" r="38" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="4 7"/>
  <!-- Lufthülle mit Treibhausgasen -->
  <rect y="100" width="600" height="120" fill="url(#huelle)"/>
  <g id="molekuele">
    <g transform="translate(470 128)"><circle r="6" fill="#e63946"/><circle cx="-11" r="5" fill="#457b9d"/><circle cx="11" r="5" fill="#457b9d"/></g>
    <g transform="translate(545 150)"><circle r="6" fill="#e63946"/><circle cx="-11" r="5" fill="#457b9d"/><circle cx="11" r="5" fill="#457b9d"/></g>
    <g transform="translate(250 140)"><circle r="6" fill="#e63946"/><circle cx="-11" r="5" fill="#457b9d"/><circle cx="11" r="5" fill="#457b9d"/></g>
    <g transform="translate(60 172)"><circle r="6" fill="#e63946"/><circle cx="-11" r="5" fill="#457b9d"/><circle cx="11" r="5" fill="#457b9d"/></g>
    <g transform="translate(360 196)"><circle r="6" fill="#e63946"/><circle cx="-11" r="5" fill="#457b9d"/><circle cx="11" r="5" fill="#457b9d"/></g>
    <g transform="translate(190 118)"><circle r="6" fill="#e63946"/><circle cx="-11" r="5" fill="#457b9d"/><circle cx="11" r="5" fill="#457b9d"/></g>
  </g>
  <!-- Luft über dem Boden -->
  <rect y="220" width="600" height="112" fill="#eef8fc"/>
  <!-- Boden -->
  <rect y="330" width="600" height="90" fill="#8d6a4a"/>
  <rect y="326" width="600" height="12" fill="#6aa84f"/>
  <!-- Bäume und Häuser (nur dort, wo keine Kästchen liegen) -->
  <g><rect x="168" y="300" width="7" height="28" fill="#6b4a2b"/><circle cx="171" cy="294" r="17" fill="#4f9a3a"/></g>
  <g><rect x="98" y="296" width="44" height="32" fill="#f4e3c8" stroke="#8a6d4a" stroke-width="2"/><path d="M92 298 L120 274 L148 298Z" fill="#c0503a"/><rect x="114" y="310" width="10" height="18" fill="#8a6d4a"/></g>
  <!-- Sonnenlicht: gelbe Welle von der Sonne zum Boden -->
  <path d="M86 78 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12 q10 2 8 12 q-2 10 8 12" fill="none" stroke="#e8a400" stroke-width="4" marker-end="url(#pg)"/>
  <!-- Wärme entweicht ins All -->
  <line x1="270" y1="326" x2="334" y2="22" stroke="#d62828" stroke-width="5" marker-end="url(#pr)"/>
  <!-- Wärme wird von den Treibhausgasen zurückgestrahlt -->
  <line x1="365" y1="326" x2="402" y2="168" stroke="#d62828" stroke-width="5"/>
  <line x1="402" y1="168" x2="440" y2="318" stroke="#d62828" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#pr)"/>
  <circle cx="402" cy="168" r="7" fill="#fff" stroke="#d62828" stroke-width="3"/>
</svg>
