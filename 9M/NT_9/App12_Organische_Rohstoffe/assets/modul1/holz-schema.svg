<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <!-- Schaubild wie Buch S. 14, Abb. 2: Vom Holz zu Papier und chemischen Produkten.
       Die Stellen für die Beschriftung (Zerkleinerung, Kochen in Lauge, Zellstoff, Lignin,
       Papierindustrie, Chemische Industrie) bleiben leer, dort liegen in modul-1.html die Kästchen. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="600" height="700" fill="#fbfdff"/>

  <!-- Holz -->
  <rect x="220" y="20" width="160" height="48" rx="12" fill="#8d5a3b"/>
  <text x="300" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Holz</text>
  <g transform="translate(418 30)">
    <rect x="0" y="6" width="70" height="22" rx="11" fill="#c9955c" stroke="#7a4e2d" stroke-width="3"/>
    <ellipse cx="70" cy="17" rx="7" ry="11" fill="#e2b98a" stroke="#7a4e2d" stroke-width="3"/>
  </g>

  <!-- Pfeile nach unten -->
  <g stroke="#c62828" stroke-width="5" fill="none" marker-end="url(#a)">
    <line x1="300" y1="70" x2="300" y2="100"/>
    <line x1="300" y1="148" x2="300" y2="178"/>
    <line x1="262" y1="226" x2="200" y2="268"/>
    <line x1="338" y1="226" x2="418" y2="268"/>
    <line x1="160" y1="320" x2="140" y2="364"/>
    <line x1="228" y1="320" x2="400" y2="364"/>
  </g>

  <!-- Hackschnitzel neben „Zerkleinerung" -->
  <g fill="#e2b98a" stroke="#a8763f" stroke-width="2">
    <rect x="428" y="112" width="18" height="12" rx="2" transform="rotate(-14 437 118)"/>
    <rect x="452" y="118" width="20" height="13" rx="2"/>
    <rect x="478" y="110" width="16" height="12" rx="2" transform="rotate(18 486 116)"/>
    <rect x="444" y="132" width="16" height="11" rx="2" transform="rotate(8 452 137)"/>
    <rect x="468" y="134" width="18" height="11" rx="2"/>
  </g>

  <!-- Kochtopf neben „Kochen in Lauge" -->
  <g transform="translate(124 186)">
    <path d="M0 10 H56 V44 Q56 52 48 52 H8 Q0 52 0 44Z" fill="#b9c6d0" stroke="#6b7a86" stroke-width="3"/>
    <rect x="-6" y="4" width="68" height="8" rx="4" fill="#6b7a86"/>
    <g fill="none" stroke="#9aa5ad" stroke-width="3" stroke-linecap="round">
      <path d="M16 -2 q5 -7 0 -14"/><path d="M30 -2 q5 -7 0 -14"/><path d="M44 -2 q5 -7 0 -14"/>
    </g>
  </g>

  <!-- Zellstoff- und Ligninhäufchen -->
  <path d="M28 318 Q44 286 62 318Z" fill="#fbfaf5" stroke="#cfc6ad" stroke-width="2"/>
  <path d="M540 318 Q556 288 574 318Z" fill="#7a4e2d" stroke="#553620" stroke-width="2"/>

  <!-- Klammern unter den beiden Industrien -->
  <g stroke="#9aa5ad" stroke-width="3" fill="none">
    <path d="M40 420 V650"/>
    <path d="M330 420 V650"/>
  </g>

  <!-- Papierindustrie: Produkte -->
  <g font-size="16" font-weight="600" fill="#15212b">
    <rect x="52" y="436" width="252" height="38" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="68" y="461">Haushaltspapiere</text>
    <rect x="52" y="488" width="252" height="38" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="64" y="513" font-size="15">Toiletten- und Hygienepapiere</text>
    <rect x="52" y="540" width="252" height="38" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="68" y="565">Zeitungen und Bücher</text>
    <rect x="52" y="592" width="252" height="38" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="68" y="617">Verpackungen</text>
  </g>

  <!-- Chemische Industrie: Produkte -->
  <g font-size="16" font-weight="600" fill="#15212b">
    <rect x="342" y="436" width="220" height="34" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="358" y="459">Brillengestelle</text>
    <rect x="342" y="480" width="220" height="34" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="358" y="503">Kämme</text>
    <rect x="342" y="524" width="220" height="34" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="358" y="547">Textilien</text>
    <rect x="342" y="568" width="220" height="34" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="358" y="591">Tischtennisbälle</text>
    <rect x="342" y="612" width="220" height="34" rx="10" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
    <text x="358" y="635">Klebstoffe</text>
  </g>
  <text x="300" y="684" text-anchor="middle" font-size="14" fill="#566674">Aus Holz lassen sich vielfältige Produkte herstellen (nach Buch S. 14).</text>
</svg>
