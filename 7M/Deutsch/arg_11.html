<link rel="stylesheet" href="../NT/modul-basis.css">

<style>
  /* Aufgabe wie in der Probe, Waage (eigene Zeichnung), Lösungstabellen, Musteraufruf mit Bausteinen, Bens Entwurf */
  .mu-aufgabe{margin:10px 0;padding:14px 16px;border:2px solid #8a2434;border-radius:14px;background:#fff8f6;box-shadow:0 3px 10px rgba(138,36,52,.08)}
  .mu-aufgabe b.kopf{display:block;margin-bottom:6px;color:#8a2434;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
  .mu-aufgabe p{margin:0}
  .mu-bild{display:flex;gap:14px;align-items:center;margin:12px 0;padding:10px 14px;border-radius:14px;background:#f2f7f1}
  .mu-bild svg{flex:none;width:340px;max-width:100%;height:auto}
  .mu-bild p{margin:0;font-weight:600;color:#2f4a2a}
  .mu-tab{width:100%;border-collapse:collapse;margin:8px 0 4px;background:#fff;font-size:.95rem}
  .mu-tab th,.mu-tab td{border:1.5px solid #c9a3a9;padding:6px 9px;text-align:left;vertical-align:top}
  .mu-tab th{background:#f7e9eb;color:#6d1c29}
  .mu-muster{margin:6px 0 0;border:1.5px solid #e2c27a;border-radius:14px;background:#fffaf0}
  .mu-muster summary{cursor:pointer;padding:10px 14px;font-weight:700;color:#7a4f00}
  .mu-muster[open] summary{border-bottom:1px dashed #e2c27a}
  .mu-teil{display:flex;gap:12px;padding:8px 14px;border-bottom:1px dotted #ecd9ae}
  .mu-teil:last-child{border-bottom:0}
  .mu-chip{flex:0 0 150px;align-self:flex-start;padding:3px 8px;border-radius:999px;font-size:.78rem;font-weight:700;text-align:center}
  .mu-teil p{margin:0}
  .mu-teil h4{margin:0;font-size:1.15rem}
  .c-ueber{background:#e6eefc;color:#24408e}.c-einl{background:#e5f4ea;color:#1d6b3a}.c-info{background:#fff0d9;color:#8a5a00}
  .c-arg{background:#fde8e4;color:#a12a1e}.c-auff{background:#efe6fb;color:#5b2b99}.c-schluss{background:#e9eef2;color:#34495e}
  .mu-ben{margin:10px 0;padding:12px 16px;border:1.5px solid #bcd7ee;border-radius:14px;background:#f4f9fe;font-family:"Comic Sans MS","Segoe Print",cursive}
  .mu-ben h4{margin:0 0 6px}
  .mu-ben p{margin:0 0 6px}
  @media (max-width:560px){.mu-bild{flex-direction:column}.mu-teil{flex-direction:column;gap:4px}.mu-chip{flex:none}}
