<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b23a48">
  <title>Wortarten und Pronomen | Deutsch 7 Grammatik</title>
  <meta name="description" content="Deutsch 7 Grammatik: Wortarten wiederholen, Demonstrativ- und Relativpronomen erkennen und Relativsätze bilden. Mit Basis- und Plus-Aufgaben.">
  <link rel="stylesheet" href="../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../css/grammatik.css">
</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script src="themen.js"></script>
  <script>
  Grammatik.seite({
    nr: 1,
    titel: "Wortarten und Pronomen",
    lead: "Erst frischst du die Wortarten auf. Dann lernst du zwei besondere Pronomen kennen: Demonstrativpronomen zeigen auf etwas, Relativpronomen verbinden zwei Sätze.",
    ziele: ["Du bestimmst die wichtigsten Wortarten.", "Du erkennst Demonstrativ- und Relativpronomen.", "Du verbindest Sätze mit einem Relativpronomen."],
    merk: [
      { t: "Die Wortarten im Überblick", html: `
        <table><tr><th>veränderbar</th><th>Beispiele</th><th>unveränderbar</th><th>Beispiele</th></tr>
        <tr><td><b>Nomen</b></td><td>der Hund, die Freude</td><td><b>Präposition</b></td><td>auf, mit, wegen</td></tr>
        <tr><td><b>Verb</b></td><td>springen, sie lacht</td><td><b>Konjunktion</b></td><td>und, weil, dass</td></tr>
        <tr><td><b>Adjektiv</b></td><td>bunt, leiser</td><td><b>Adverb</b></td><td>gestern, dort, gern</td></tr>
        <tr><td><b>Artikel</b></td><td>der, eine</td><td></td><td></td></tr>
        <tr><td><b>Pronomen</b></td><td>sie, unser, dieser</td><td></td><td></td></tr></table>` },
      { t: "Demonstrativpronomen – zeigen", html: `
        <p><b>dieser, diese, dieses, jener, derselbe</b> – und betontes <b>der, die, das</b>. Sie zeigen auf etwas Bestimmtes.</p>
        <div class="bsp"><span class="hl-o">Dieses</span> Fahrrad gehört mir, <span class="hl-o">jenes</span> dort meiner Schwester.</div>
        <div class="bsp">Kennst du den Film? – <span class="hl-o">Den</span> habe ich schon zweimal gesehen.</div>` },
      { t: "Relativpronomen – verbinden", html: `
        <p><b>der, die, das</b> (auch <b>dem, den, deren, dessen, denen</b>) leiten einen <b>Relativsatz</b> ein. Er beschreibt ein Nomen genauer und wird mit Komma abgetrennt.</p>
        <div class="bsp">Der Junge, <span class="hl-v">der neben mir sitzt</span>, heißt Luca.</div>
        <div class="bsp">Das Buch, <span class="hl-v">das du mir geliehen hast</span>, ist spannend.</div>
        <p class="merksatz">Das Relativpronomen richtet sich nach dem Nomen: der Junge → der, das Buch → das.</p>` },
      { t: "Plus: Reflexivpronomen", html: `
        <p><b>mich, dich, sich, uns, euch</b> beziehen sich auf das Subjekt zurück.</p>
        <div class="bsp">Ich freue <span class="hl-g">mich</span>. · Paul wäscht <span class="hl-g">sich</span>. · Wir treffen <span class="hl-g">uns</span> am Bahnhof.</div>` }
    ],
    fallen: [
      "**das** als Relativpronomen (das Buch, **das** …) und **dass** als Konjunktion (Ich hoffe, **dass** …) nicht verwechseln.",
      "„der, die, das“ können drei Wortarten sein: Artikel (**der** Film), Demonstrativpronomen (**Den** kenne ich!) oder Relativpronomen (der Film, **den** wir sahen).",
      "Vor dem Relativpronomen steht immer ein Komma."
    ],
    basis: [
      { typ: "zuordnen", t: "Sortiere die Wörter nach ihrer Wortart.", tipp: "Artikel davor möglich? Konjugierbar? Steigerbar? Verbindet es etwas?",
        gruppen: ["Nomen", "Verb", "Adjektiv", "Pronomen", "Präposition", "Konjunktion"],
        karten: [["Hund", 0], ["Freude", 0], ["springen", 1], ["lacht", 1], ["bunt", 2], ["leise", 2],
                 ["sie", 3], ["unser", 3], ["auf", 4], ["mit", 4], ["und", 5], ["weil", 5]] },
      { typ: "wahl", t: "Welche Wortart ist unterstrichen?", tipp: "Frag dich zuerst: Lässt sich das Wort verändern?",
        items: [
          { s: "__Gestern__ war unser Sportfest.", o: ["Adverb", "Adjektiv", "Nomen", "Präposition"], a: 0, e: "„gestern“ sagt, wann – und es ändert sich nie." },
          { s: "Das Buch liegt __unter__ dem Tisch.", o: ["Konjunktion", "Präposition", "Adverb", "Verb"], a: 1 },
          { s: "Finn lacht, __weil__ der Clown stolpert.", o: ["Präposition", "Adverb", "Konjunktion", "Pronomen"], a: 2 },
          { s: "Die __alte__ Brücke ist gesperrt.", o: ["Adjektiv", "Nomen", "Adverb", "Artikel"], a: 0 },
          { s: "__Wir__ fahren morgen ans Meer.", o: ["Artikel", "Pronomen", "Nomen", "Adverb"], a: 1 },
          { s: "Die Katze __schläft__ auf dem Sofa.", o: ["Nomen", "Adjektiv", "Verb", "Konjunktion"], a: 2 }
        ] },
      { typ: "wahl", t: "Welches Pronomen ist das?", tipp: "Zeigt es auf etwas? Gehört etwas jemandem? Leitet es einen Nebensatz ein?",
        items: [
          { s: "__Dieses__ Fahrrad gehört mir.", o: ["Personalpronomen", "Possessivpronomen", "Demonstrativpronomen", "Relativpronomen"], a: 2 },
          { s: "Das ist der Hund, __der__ immer bellt.", o: ["Personalpronomen", "Possessivpronomen", "Demonstrativpronomen", "Relativpronomen"], a: 3 },
          { s: "Ich habe __meinen__ Schlüssel verloren.", o: ["Personalpronomen", "Possessivpronomen", "Demonstrativpronomen", "Relativpronomen"], a: 1 },
          { s: "__Sie__ spielt seit zwei Jahren Handball.", o: ["Personalpronomen", "Possessivpronomen", "Demonstrativpronomen", "Relativpronomen"], a: 0 },
          { s: "Die Schuhe, __die__ ich gekauft habe, sind bequem.", o: ["Personalpronomen", "Possessivpronomen", "Demonstrativpronomen", "Relativpronomen"], a: 3 },
          { s: "__Jene__ Bank dort ist frisch gestrichen.", o: ["Personalpronomen", "Possessivpronomen", "Demonstrativpronomen", "Relativpronomen"], a: 2 }
        ] },
      { typ: "markieren", t: "Markiere die Relativpronomen.", tipp: "Das Relativpronomen steht direkt nach dem Komma und leitet den Relativsatz ein.",
        items: ["Der Junge, [der] neben mir sitzt, heißt Luca.",
                "Das Buch, [das] du mir geliehen hast, ist spannend.",
                "Hier ist der Ball, [den] wir so lange gesucht haben.",
                "Die Lehrerin, [die] uns Mathe gibt, fährt mit dem Rad."] },
      { typ: "luecke", t: "Wähle das passende Relativpronomen.", tipp: "Schau auf das Nomen davor: der Mann → der/den, die Frau → die, das Heft → das.",
        items: ["Das ist meine Freundin, {{die|der|das}} mich besucht hat.",
                "Wo ist das Heft, {{das|dass|die}} auf dem Tisch lag?",
                "Kennst du den Mann, {{den|der|das}} wir gestern gesehen haben?",
                "Der Bus, {{der|die|das}} zur Schule fährt, ist heute zu spät."] },
      { typ: "umformen", t: "Verbinde die beiden Sätze mit einem Relativpronomen.", tipp: "Das zweite „sie/er/es“ wird zum Relativpronomen. Das Verb rutscht ans Ende.",
        items: [
          { s: "Ich habe eine Katze. Sie heißt Minka.", l: ["Ich habe eine Katze, die Minka heißt."] },
          { s: "Das ist der Bus. Er fährt zur Schule.", l: ["Das ist der Bus, der zur Schule fährt."] },
          { s: "Wir besuchen das Schwimmbad. Es wurde neu gebaut.", l: ["Wir besuchen das Schwimmbad, das neu gebaut wurde."] }
        ] }
    ],
    plus: [
      { typ: "luecke", t: "Schwierigere Relativpronomen: dem, denen, dessen, deren", tipp: "Wem? → dem/denen · Wessen? → dessen (der/das) / deren (die, Mehrzahl)",
        items: ["Das ist der Trainer, {{dem|den|der}} ich vertraue.",
                "Die Kinder, {{denen|die|deren}} ich helfe, sind noch klein.",
                "Der Hund, {{dessen|deren|den}} Besitzer im Urlaub ist, wohnt bei uns.",
                "Die Nachbarin, {{deren|dessen|die}} Garten so schön ist, gibt uns Tipps."] },
      { typ: "markieren", t: "Markiere die Reflexivpronomen.", tipp: "Reflexivpronomen beziehen sich auf das Subjekt: ich → mich, er → sich, wir → uns.",
        items: ["Ich freue [mich] auf die Ferien.", "Paul wäscht [sich] die Hände.", "Habt ihr [euch] schon angemeldet?", "Wir treffen [uns] am Bahnhof."] },
      { typ: "wahl", t: "Artikel, Demonstrativpronomen oder Relativpronomen?", tipp: "Begleitet es ein Nomen → Artikel. Steht es allein und zeigt → Demonstrativ. Leitet es einen Nebensatz ein → Relativ.",
        items: [
          { s: "__Der__ Film war ziemlich lang.", o: ["Artikel", "Demonstrativpronomen", "Relativpronomen"], a: 0 },
          { s: "Der Film, __den__ wir sahen, war lang.", o: ["Artikel", "Demonstrativpronomen", "Relativpronomen"], a: 2 },
          { s: "Diesen Film? __Den__ kenne ich schon!", o: ["Artikel", "Demonstrativpronomen", "Relativpronomen"], a: 1 },
          { s: "Das Spiel, __das__ wir gewonnen haben, war spannend.", o: ["Artikel", "Demonstrativpronomen", "Relativpronomen"], a: 2 },
          { s: "__Das__ glaube ich dir nicht!", o: ["Artikel", "Demonstrativpronomen", "Relativpronomen"], a: 1 }
        ] },
      { typ: "frei", t: "Schreibe selbst einen Satz mit Relativsatz.",
        items: [
          { f: "Beschreibe dein Lieblingstier mit einem Relativsatz.", kriterien: ["enthält einen Relativsatz mit der, die, das (oder dem, den …)", "der Relativsatz ist mit Komma abgetrennt"],
            muster: ",\\s*(der|die|das|dem|den|denen|dessen|deren)\\s+\\S+",
            bsp: "Mein Lieblingstier ist der Fuchs, der sehr schlau ist." }
        ] }
    ]
  });
  </script>
</body>
</html>
