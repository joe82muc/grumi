  <title>Aktiv und Passiv | Deutsch 7 Grammatik</title>
  <meta name="description" content="Deutsch 7 Grammatik: Aktiv und Passiv unterscheiden, das Passiv bilden und Sätze umformen. Mit Basis- und Plus-Aufgaben.">
  <link rel="stylesheet" href="../../../css/deutsch.css">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script src="../themen.js"></script>
  <script src="themen.js"></script>
  <script>
  Grammatik.seite({
    nr: 3,
    titel: "Aktiv und Passiv",
    lead: "„Der Koch schneidet die Zwiebeln“ oder „Die Zwiebeln werden geschnitten“? Im Aktiv steht im Mittelpunkt, wer etwas tut – im Passiv, was mit etwas passiert. Rezepte und Anleitungen nutzen oft das Passiv.",
    ziele: ["Du unterscheidest Aktiv und Passiv.", "Du bildest das Passiv mit werden + Partizip II.", "Du formst Sätze vom Aktiv ins Passiv um."],
    merk: [
      { t: "Aktiv: Wer tut etwas?", html: `
        <div class="bsp"><span class="hl-b">Der Koch</span> schneidet die Zwiebeln.</div>
        <p>Der Handelnde ist das Subjekt und steht im Mittelpunkt.</p>` },
      { t: "Passiv: Was passiert?", html: `
        <p>Passiv = <b>werden + Partizip II</b>. Wer es tut, kann mit <b>von</b> dazukommen – oder ganz fehlen.</p>
        <div class="bsp">Die Zwiebeln <span class="hl-r">werden</span> (vom Koch) <span class="hl-r">geschnitten</span>.</div>
        <p class="merksatz">Das Passiv passt, wenn unwichtig oder unbekannt ist, wer handelt: Mein Rad wurde gestohlen.</p>` },
      { t: "Passiv in drei Zeitformen", html: `
        <table><tr><th>Zeitform</th><th>Passiv</th></tr>
        <tr><td>Präsens</td><td>Der Kuchen <b>wird</b> gebacken.</td></tr>
        <tr><td>Präteritum</td><td>Der Kuchen <b>wurde</b> gebacken.</td></tr>
        <tr><td>Perfekt</td><td>Der Kuchen <b>ist</b> gebacken <b>worden</b>.</td></tr></table>
        <p>Plus: Plusquamperfekt <i>war … worden</i>, Futur I <i>wird … werden</i>.</p>` },
      { t: "So formst du um", html: `
        <ol><li>Das <b>Akkusativobjekt</b> wird das neue Subjekt.</li><li>Das alte Subjekt wird zu <b>von …</b> – oder fällt weg.</li>
        <li>Das Verb wird <b>werden + Partizip II</b>, in derselben Zeitform.</li></ol>
        <div class="bsp">Mama backt den Kuchen. → <b>Der Kuchen wird von Mama gebacken.</b></div>` }
    ],
    fallen: [
      "„werden“ allein ist kein Passiv: Er **wird** Lehrer. · Es **wird** regnen. Erst mit Partizip II: Er **wird** gefragt.",
      "Im Passiv Perfekt heißt es **worden**, nicht „geworden“: Das Rad ist repariert **worden**.",
      "Die Zeitform bleibt beim Umformen gleich."
    ],
    basis: [
      { typ: "wahl", t: "Aktiv oder Passiv?", tipp: "Passiv braucht werden + Partizip II (gebacken, gemalt …).",
        items: [
          { s: "Die Klasse schmückt den Raum.", o: ["Aktiv", "Passiv"], a: 0 },
          { s: "Der Raum wird geschmückt.", o: ["Aktiv", "Passiv"], a: 1 },
          { s: "Die Äpfel wurden im Herbst geerntet.", o: ["Aktiv", "Passiv"], a: 1 },
          { s: "Morgen wird es schneien.", o: ["Aktiv", "Passiv"], a: 0, e: "werden + Infinitiv (schneien) ist Futur, kein Passiv." },
          { s: "Der Hund wird jeden Tag gebürstet.", o: ["Aktiv", "Passiv"], a: 1 },
          { s: "Meine Schwester wird Ärztin.", o: ["Aktiv", "Passiv"], a: 0, e: "Hier fehlt das Partizip II – „wird“ ist ein Vollverb." }
        ] },
      { typ: "luecke", t: "Setze das Passiv im Präsens ein.", tipp: "wird (Einzahl) oder werden (Mehrzahl) + Partizip II",
        items: ["Die Pizza [[wird]] in den Ofen [[geschoben]]. (schieben)", "Die Fenster [[werden]] [[geputzt]]. (putzen)",
                "Der Brief [[wird]] heute [[abgeschickt]]. (abschicken)"] },
      { typ: "luecke", t: "Setze das Passiv im Präteritum ein.", tipp: "wurde (Einzahl) oder wurden (Mehrzahl) + Partizip II",
        items: ["Das Tor [[wurde]] in letzter Sekunde [[geschossen]]. (schießen)", "Die Äpfel [[wurden]] im Herbst [[geerntet]]. (ernten)",
                "Der Dieb [[wurde]] schnell [[gefasst]]. (fassen)"] },
      { typ: "umformen", t: "Forme ins Passiv um.", tipp: "Was wird gemacht? Das kommt nach vorn. Danach: wird/werden … Partizip II.",
        items: [
          { s: "Der Koch schneidet die Zwiebeln.", l: ["Die Zwiebeln werden vom Koch geschnitten.", "Die Zwiebeln werden von dem Koch geschnitten.", "Die Zwiebeln werden geschnitten."] },
          { s: "Die Lehrerin verteilt die Hefte.", l: ["Die Hefte werden von der Lehrerin verteilt.", "Die Hefte werden verteilt."] },
          { s: "Mama backt einen Kuchen.", l: ["Ein Kuchen wird von Mama gebacken.", "Ein Kuchen wird gebacken."] }
        ] },
      { typ: "markieren", t: "Ein Rezept im Passiv: Markiere beide Teile jeder Passivform.", tipp: "Zum Passiv gehören die Form von „werden“ und das Partizip II. Ein Satz hat kein Passiv.",
        items: ["Zuerst [werden] die Kartoffeln [geschält].", "Dann [werden] sie in Stücke [geschnitten].",
                "Danach kocht man sie zwanzig Minuten.", "Zum Schluss [wird] etwas Salz [dazugegeben]."] },
      { typ: "bauen", t: "Baue Passivsätze.", tipp: "Die Form von „werden“ steht an zweiter Stelle, das Partizip II am Ende.",
        items: [
          { teile: ["Das Klassenzimmer", "wird", "von den Kindern", "geschmückt"], l: ["Von den Kindern wird das Klassenzimmer geschmückt"] },
          { teile: ["Die Straße", "wurde", "wegen Bauarbeiten", "gesperrt"], l: ["Wegen Bauarbeiten wurde die Straße gesperrt"] }
        ] }
    ],
    plus: [
      { typ: "wahl", t: "In welcher Zeitform steht das Passiv?", tipp: "wird → Präsens · wurde → Präteritum · ist … worden → Perfekt · war … worden → Plusquamperfekt · wird … werden → Futur I",
        items: [
          { s: "Das Auto wird gewaschen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 0 },
          { s: "Das Auto wurde gewaschen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 1 },
          { s: "Das Auto ist gewaschen worden.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 2 },
          { s: "Das Auto war gewaschen worden.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 3 },
          { s: "Das Auto wird gewaschen werden.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I"], a: 4 }
        ] },
      { typ: "umformen", t: "Forme ins Passiv Perfekt um.", tipp: "ist … worden",
        items: [
          { s: "Die Feuerwehr hat die Katze gerettet.", l: ["Die Katze ist von der Feuerwehr gerettet worden.", "Die Katze ist gerettet worden."] },
          { s: "Jemand hat mein Fahrrad gestohlen.", l: ["Mein Fahrrad ist gestohlen worden."] }
        ] },
      { typ: "umformen", t: "Forme ins Aktiv um.", tipp: "Wer handelt? Das wird das Subjekt. Die Zeitform bleibt gleich.",
        items: [
          { s: "Das Spiel wurde vom Schiedsrichter abgebrochen.", l: ["Der Schiedsrichter brach das Spiel ab."] },
          { s: "Die Pakete werden vom Postboten gebracht.", l: ["Der Postbote bringt die Pakete."] }
        ] },
      { typ: "frei", t: "Schreibe einen Satz für eine Anleitung im Passiv.",
        items: [
          { f: "Thema: eine Pflanze umtopfen.", kriterien: ["Passiv: wird/werden + Partizip II", "passt zu einer Anleitung"],
            muster: "\\b(wird|werden)\\b.*\\b(ge\\w+(t|en)|\\w+iert|ver\\w+(t|en)|be\\w+(t|en)|\\w+ge\\w+(t|en))\\b",
            bsp: "Zuerst wird die Pflanze vorsichtig aus dem alten Topf genommen." }
        ] }
    ]
  });
  </script>
