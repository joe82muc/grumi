<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b23a48">
  <title>Zeitformen bis Futur II | Deutsch 7 Grammatik</title>
  <meta name="description" content="Deutsch 7 Grammatik: alle sechs Zeitformen bilden und bestimmen – neu dazu das Futur II. Mit Basis- und Plus-Aufgaben.">
  <link rel="stylesheet" href="../../../css/deutsch.css">
  <link rel="stylesheet" href="../../../css/grammatik.css">
</head>
<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script src="../themen.js"></script>
  <script src="themen.js"></script>
  <script>
  Grammatik.seite({
    nr: 2,
    titel: "Zeitformen bis Futur II",
    lead: "Mit der Zeitform sagst du, wann etwas passiert. Fünf Zeitformen kennst du schon – neu ist das Futur II: Damit sagst du, was bis zu einem Zeitpunkt in der Zukunft erledigt sein wird.",
    ziele: ["Du bildest alle sechs Zeitformen.", "Du kennst die Formen wichtiger unregelmäßiger Verben.", "Du verwendest das Futur II richtig."],
    merk: [
      { t: "Die sechs Zeitformen", html: `
        <table><tr><th>Zeitform</th><th>spielen</th><th>laufen</th></tr>
        <tr><td><b>Präsens</b></td><td>ich spiele</td><td>ich laufe</td></tr>
        <tr><td><b>Präteritum</b></td><td>ich spielte</td><td>ich lief</td></tr>
        <tr><td><b>Perfekt</b></td><td>ich habe gespielt</td><td>ich bin gelaufen</td></tr>
        <tr><td><b>Plusquamperfekt</b></td><td>ich hatte gespielt</td><td>ich war gelaufen</td></tr>
        <tr><td><b>Futur I</b></td><td>ich werde spielen</td><td>ich werde laufen</td></tr>
        <tr><td><b>Futur II</b></td><td>ich werde gespielt haben</td><td>ich werde gelaufen sein</td></tr></table>` },
      { t: "So baust du die Zeitformen", html: `
        <ul><li><b>Perfekt:</b> haben/sein + Partizip II – <i>sie hat gemalt, er ist gerannt</i></li>
        <li><b>Plusquamperfekt:</b> hatte/war + Partizip II – <i>sie hatte gemalt</i></li>
        <li><b>Futur I:</b> werden + Infinitiv – <i>sie wird malen</i></li>
        <li><b>Futur II:</b> werden + Partizip II + haben/sein – <i>sie wird gemalt haben</i></li></ul>` },
      { t: "Wofür das Futur II?", html: `
        <p>Etwas ist zu einem Zeitpunkt in der Zukunft <b>schon fertig</b>:</p>
        <div class="bsp">Bis Freitag <span class="hl-r">werde</span> ich das Buch <span class="hl-r">gelesen haben</span>.</div>
        <p>Oder du <b>vermutest</b>, was passiert ist:</p>
        <div class="bsp">Ben ist nicht da. Er <span class="hl-r">wird</span> den Bus <span class="hl-r">verpasst haben</span>.</div>` },
      { t: "Unregelmäßige Verben", html: `
        <table><tr><th>Infinitiv</th><th>Präteritum</th><th>Partizip II</th></tr>
        <tr><td>gehen</td><td>ging</td><td>gegangen</td></tr><tr><td>schwimmen</td><td>schwamm</td><td>geschwommen</td></tr>
        <tr><td>bringen</td><td>brachte</td><td>gebracht</td></tr><tr><td>lesen</td><td>las</td><td>gelesen</td></tr>
        <tr><td>finden</td><td>fand</td><td>gefunden</td></tr><tr><td>schließen</td><td>schloss</td><td>geschlossen</td></tr></table>` }
    ],
    fallen: [
      "Perfekt mit **sein** bei Bewegung und Veränderung: Ich **bin** gerannt. Sonst meistens mit **haben**: Ich **habe** gelesen.",
      "Futur I und Futur II nicht verwechseln: Ich **werde lesen** (Futur I) – ich **werde gelesen haben** (Futur II).",
      "Erzählst du schriftlich, bleib im **Präteritum** – wechsle nicht mitten in der Geschichte ins Präsens."
    ],
    basis: [
      { typ: "wahl", t: "Bestimme die Zeitform.", tipp: "Achte auf die Hilfsverben: hat/ist → Perfekt, hatte/war → Plusquamperfekt, wird → Futur.",
        items: [
          { s: "Emma liest ein Buch.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 0 },
          { s: "Emma las ein Buch.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 1 },
          { s: "Emma hat ein Buch gelesen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 2 },
          { s: "Emma hatte ein Buch gelesen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 3 },
          { s: "Emma wird ein Buch lesen.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 4 },
          { s: "Emma wird das Buch gelesen haben.", o: ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"], a: 5 }
        ] },
      { typ: "luecke", t: "Setze das Verb ins Präteritum.", tipp: "Diese Verben sind unregelmäßig: Der Vokal ändert sich (schwimmen – schwamm).",
        items: ["Wir [[schwammen]] im See. (schwimmen)", "Der Ball [[flog]] über den Zaun. (fliegen)", "Ich [[dachte]] lange an dich. (denken)",
                "Die Kinder [[sangen]] ein Lied. (singen)", "Opa [[trank]] einen Tee. (trinken)"] },
      { typ: "zuordnen", t: "Perfekt mit „haben“ oder mit „sein“?", tipp: "Bewegung von A nach B oder Veränderung → sein.",
        gruppen: ["Perfekt mit „sein“", "Perfekt mit „haben“"],
        karten: [["gehen", 0], ["rennen", 0], ["wachsen", 0], ["fallen", 0], ["aufstehen", 0], ["ankommen", 0],
                 ["spielen", 1], ["lesen", 1], ["essen", 1], ["malen", 1], ["kaufen", 1], ["schreiben", 1]] },
      { typ: "luecke", t: "Bilde das Futur II.", tipp: "werden + Partizip II + haben oder sein. Bewegung → sein.",
        items: ["Bis Freitag [[werde]] ich das Referat [[geschrieben]] [[haben]]. (schreiben)",
                "Um acht Uhr [[wird]] der Zug schon [[abgefahren]] [[sein]]. (abfahren)",
                "Bis zum Sommer [[werden]] wir das Haus [[gestrichen]] [[haben]]. (streichen)"] },
      { typ: "umformen", t: "Setze den Satz in die angegebene Zeitform.", tipp: "Perfekt: hat/ist + Partizip II · Präteritum: eine Verbform · Futur I: wird + Infinitiv",
        items: [
          { f: "ins Perfekt", s: "Lina malt ein Bild.", l: ["Lina hat ein Bild gemalt."] },
          { f: "ins Präteritum", s: "Wir gehen ins Kino.", l: ["Wir gingen ins Kino."] },
          { f: "ins Futur I", s: "Es regnet.", l: ["Es wird regnen."] },
          { f: "ins Plusquamperfekt", s: "Der Hund bellt.", l: ["Der Hund hatte gebellt."] }
        ] },
      { typ: "wahl", t: "Was bedeuten die Sätze?", mischen: true,
        items: [
          { f: "„Bis morgen werde ich die Hausaufgaben erledigt haben.“", o: ["Morgen sind die Hausaufgaben fertig.", "Ich mache die Hausaufgaben gerade.", "Ich habe die Hausaufgaben gestern gemacht."], a: 0 },
          { f: "„Er wird wohl den Bus verpasst haben.“", o: ["eine Vermutung über etwas Vergangenes", "ein Befehl", "etwas, das gerade passiert"], a: 0 },
          { f: "„Nachdem wir gegessen hatten, spielten wir.“ – Was passierte zuerst?", o: ["das Essen", "das Spielen", "beides gleichzeitig"], a: 0 },
          { f: "In welcher Zeitform erzählt man eine Geschichte meistens schriftlich?", o: ["im Präteritum", "im Futur I", "im Futur II"], a: 0 }
        ] }
    ],
    plus: [
      { typ: "umformen", t: "Schreibe die Sätze im Futur II.", tipp: "Die Zeitangabe zeigt, bis wann etwas fertig ist.",
        items: [
          { s: "Ich lese das Buch. (bis Montag)", l: ["Bis Montag werde ich das Buch gelesen haben.", "Ich werde das Buch bis Montag gelesen haben."] },
          { s: "Der Schnee schmilzt. (bis März)", l: ["Bis März wird der Schnee geschmolzen sein.", "Der Schnee wird bis März geschmolzen sein."] }
        ] },
      { typ: "wahl", t: "Welche Form des Partizips II ist richtig?", mischen: true, tipp: "Unregelmäßige Verben enden im Partizip II meist auf -en.",
        items: [
          { s: "Er hat das Fenster ___ . (schließen)", o: ["geschlossen", "geschließt", "geschlossten"], a: 0 },
          { s: "Sie ist nach Hause ___ . (rennen)", o: ["gerannt", "gerennt", "gerannen"], a: 0 },
          { s: "Wir haben den Fehler ___ . (finden)", o: ["gefunden", "gefindet", "gefanden"], a: 0 },
          { s: "Der Luftballon ist ___ . (platzen)", o: ["geplatzt", "geplatzen", "geplotzt"], a: 0 }
        ] },
      { typ: "luecke", t: "Vorher – nachher: Wähle die passenden Formen.", tipp: "Was zuerst passiert ist, steht nach „nachdem“ im Plusquamperfekt.",
        items: ["Nachdem wir den Tisch {{gedeckt hatten|deckten|decken}}, {{kamen|waren gekommen|kommen}} die Gäste.",
                "Nachdem Tim die Hausaufgaben {{gemacht hatte|machte|macht}}, {{ging|war gegangen|geht}} er raus."] },
      { typ: "frei", t: "Schreibe einen Satz im Futur II.",
        items: [
          { f: "Was wirst du am Ende des Schuljahres geschafft haben?", kriterien: ["Futur II: werde + Partizip II + haben oder sein", "passt zum Thema Schuljahr"],
            muster: "\\b(werde|wirst|wird|werden|werdet)\\b.*\\b(haben|sein)\\b",
            bsp: "Am Ende des Schuljahres werde ich zehn Bücher gelesen haben." }
        ] }
    ]
  });

  // Extra-Module „Zeitformen wiederholen“ (../themen.js, extra: "gr-02"): Hat die Lehrkraft für die Klasse welche
  // freigeschaltet, steht über dem Merkwissen ein Kasten mit den Verweisen. In der Vorschau zeigt er alle.
  (function () {
    var D7 = window.D7, extras = D7 && D7.extrasVon ? D7.extrasVon("gr-02") : [];
    if (!extras.length) return;
    var reg = D7.modulVon("gr-02");
    function zeig(stand) {
      var offen = extras.filter(function (m) { return D7.offen(m, reg.thema, stand); }), alt = document.getElementById("zf-extras");
      if (alt) alt.remove();
      var anker = document.querySelector("#verstehen .merk-grid");
      if (!offen.length || !anker) return;
      var box = document.createElement("div");
      box.id = "zf-extras";
      box.style.cssText = "margin:0 0 16px;padding:14px 16px;border:1.5px dashed #e3b9bf;border-radius:14px;background:#fff9f4";
      box.innerHTML = '<b style="display:block;font-size:1.05rem">🔁 ' + reg.modul.extraFrage + '</b>' +
        '<span style="display:block;margin:2px 0 10px;color:#5f5257">' + reg.modul.extraText + '</span>' +
        offen.map(function (m) {
          return '<a href="' + m.href.replace(/^Grammatik\//, "") + (D7.VORSCHAU ? "?vorschau=1" : "") + '" data-extra="' + m.id +
            '" style="display:inline-block;margin:0 8px 8px 0;padding:8px 14px;border:1.5px solid #ecc7cc;border-radius:999px;background:#fff;color:#8e2a37;font-weight:700;text-decoration:none">' + m.titel + "</a>";
        }).join("");
      anker.parentNode.insertBefore(box, anker);
    }
    if (D7.VORSCHAU) { zeig(null); return; }
    var kind = window.Lernstand && window.Lernstand.schueler;
    if (kind && kind.code) D7.freigabe(kind, function (stand) { zeig(stand); });
  })();
  </script>
</body>
</html>
