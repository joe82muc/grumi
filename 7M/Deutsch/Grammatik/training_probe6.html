  <script>
  /* Training zur Probe 6 (M7): genau die elf Aufgaben der Probe „Grammatik I“ (Wortfeld Fahrradwerkstatt), in derselben
     Reihenfolge und mit denselben Sätzen – dazu bei jeder Aufgabe Tipps in drei Stufen, ein Hinweis an jedem Satz, der noch
     nicht stimmt, und nach dem Lösen eine kurze Erklärung. Etwa 60 Minuten.
     Extra-Modul zu „Aktiv und Passiv“ (../themen.js: gr-16): Die Lehrkraft schaltet es einzeln frei. Die Kennung
     d7-gr-16 hat zwei Ziffern, damit die KI-Prüfung der Grammatikseiten (Umformen, Aufgabe 11) sie annimmt.
     Wer die Probe auf dem Server ändert (d7-proben/p6.js, M_A), gleicht diese Seite an. */
  var WORTARTEN = ["Adverb", "Präposition", "Konjunktion", "Demonstrativpronomen", "Relativpronomen", "Reflexivpronomen"];
  var ZEITFORMEN = ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"];
  var AKTIV_PASSIV = ["Aktiv im Perfekt", "Aktiv im Futur I", "Passiv im Präsens", "Passiv im Präteritum", "Passiv im Perfekt", "Passiv im Futur I"];

  Grammatik.seite({
    extra: true, modul: "d7-gr-16", lsNr: 16, kurz: "Training Probe 6",
    basisName: "Training", basisEyebrow: "Die elf Aufgaben der Probe – mit Tipps",
    titel: "Training zur Probe 6: Grammatik I",
    lead: "Hier trainierst du die **elf Aufgaben der Probe 6** – in Ruhe und mit Tipps bei jeder Aufgabe. Es geht um Wortarten und Pronomen, um die Zeitformen und um Aktiv und Passiv. Plane etwa 60 Minuten ein.",
    ziele: ["Du erkennst Wortarten und setzt das Relativpronomen im richtigen Fall ein.", "Du bestimmst und bildest alle sechs Zeitformen.", "Du erkennst Aktiv und Passiv und formst Sätze um."],
    basisHinweis: "🎯 <b>So trainierst du:</b> Löse die Aufgabe und tippe auf <b>Prüfen</b>. Stimmt ein Satz noch nicht, steht darunter ein Hinweis. " +
      "Der Knopf <b>💡 Tipp</b> gibt dir bis zu drei Tipps – erst einen kleinen, dann einen genaueren. " +
      "<b>Lösung zeigen</b> ist nur für den Notfall: Mit der Lösung zählt die Aufgabe nicht.",
    merk: [
      { t: "Wortarten: Was tut das Wort im Satz?", html: `
        <table><tr><th>Wortart</th><th>Daran erkennst du sie</th><th>Beispiele</th></tr>
        <tr><td><b>Adverb</b></td><td>sagt wann, wo oder wie – das Wort bleibt immer gleich</td><td>heute, abends, dort, gern</td></tr>
        <tr><td><b>Prä&shy;po&shy;si&shy;tion</b></td><td>steht vor einem Nomen und sagt, wo oder wann</td><td><b>auf</b> dem Tisch, <b>nach</b> dem Essen</td></tr>
        <tr><td><b>Kon&shy;junk&shy;tion</b></td><td>verbindet Sätze oder Wörter</td><td>und, weil, dass, wenn</td></tr>
        <tr><td><b>De&shy;mons&shy;tra&shy;tiv&shy;pro&shy;no&shy;men</b></td><td>zeigt betont auf etwas Bestimmtes</td><td>dieser, jene – Der Hund? <b>Den</b> kenne ich!</td></tr>
        <tr><td><b>Re&shy;la&shy;tiv&shy;pro&shy;no&shy;men</b></td><td>steht nach dem Komma und meint das Nomen davor</td><td>der Hund, <b>der</b> bellt</td></tr>
        <tr><td><b>Re&shy;fle&shy;xiv&shy;pro&shy;no&shy;men</b></td><td>meint dieselbe Person wie das Subjekt</td><td>Ich freue <b>mich</b>. Er wäscht <b>sich</b>.</td></tr></table>` },
      { t: "Relativpronomen: der richtige Fall", html: `
        <p>Schritt 1: Welches Nomen steht <b>vor dem Komma</b>? Schritt 2: Stelle im Relativsatz eine <b>Frage</b>.</p>
        <table><tr><th>Frage</th><th>männ&shy;lich</th><th>weib&shy;lich</th><th>säch&shy;lich</th><th>Mehr&shy;zahl</th></tr>
        <tr><td>Wer?</td><td>der</td><td>die</td><td>das</td><td>die</td></tr>
        <tr><td>Wen?</td><td>den</td><td>die</td><td>das</td><td>die</td></tr>
        <tr><td>Wem?</td><td>dem</td><td>der</td><td>dem</td><td>denen</td></tr>
        <tr><td>Wes&shy;sen?</td><td>dessen</td><td>deren</td><td>dessen</td><td>deren</td></tr></table>
        <div class="bsp">Die Nachbarin, <b>der</b> der Hund gehört, winkt. – Wem gehört der Hund? → der</div>` },
      { t: "Die sechs Zeitformen", html: `
        <table><tr><th>Zeit&shy;form</th><th>So wird sie gebildet</th><th>Beispiel</th></tr>
        <tr><td>Prä&shy;sens</td><td>ein Wort, jetzt</td><td>sie lacht · er geht</td></tr>
        <tr><td>Prä&shy;te&shy;ri&shy;tum</td><td>ein Wort, früher</td><td>sie lachte · er ging</td></tr>
        <tr><td>Per&shy;fekt</td><td><b>hat</b> oder <b>ist</b> + Partizip II</td><td>sie hat gelacht · er ist gegangen</td></tr>
        <tr><td>Plus&shy;quam&shy;per&shy;fekt</td><td><b>hatte</b> oder <b>war</b> + Partizip II</td><td>sie hatte gelacht · er war gegangen</td></tr>
        <tr><td>Futur I</td><td><b>wird</b> + Grundform</td><td>sie wird lachen · er wird gehen</td></tr>
        <tr><td>Futur II</td><td><b>wird</b> + Partizip II + <b>haben</b> oder <b>sein</b></td><td>sie wird gelacht haben · er wird gegangen sein</td></tr></table>
        <p class="merksatz">„sein“ steht bei Bewegung von einem Ort zum anderen (gehen, fahren) und bei Veränderung (einschlafen, zerbrechen).</p>` },
      { t: "Aktiv und Passiv", html: `
        <p><b>Aktiv:</b> Wer tut etwas? <b>Passiv:</b> Was wird gemacht? Das Passiv bildest du mit <b>werden + Partizip II</b>.</p>
        <div class="bsp">Mama backt den Kuchen. → Der Kuchen <span class="hl-r">wird</span> (von Mama) <span class="hl-r">gebacken</span>.</div>
        <table><tr><th>Zeit&shy;form</th><th>Passiv</th></tr>
        <tr><td>Prä&shy;sens</td><td>Der Kuchen <b>wird</b> gebacken.</td></tr>
        <tr><td>Prä&shy;te&shy;ri&shy;tum</td><td>Der Kuchen <b>wurde</b> gebacken.</td></tr>
        <tr><td>Per&shy;fekt</td><td>Der Kuchen <b>ist</b> gebacken <b>worden</b>.</td></tr>
        <tr><td>Futur I</td><td>Der Kuchen <b>wird</b> gebacken <b>werden</b>.</td></tr></table>` },
      { t: "So formst du um", html: `
        <p><b>Vom Aktiv ins Passiv</b></p>
        <ol><li>Frage „Wen oder was?“ – die Antwort wird das neue Subjekt.</li>
        <li>Das Verb wird zu <b>werden + Partizip II</b>, in derselben Zeitform.</li>
        <li>Wer es tut, kommt mit <b>von</b> dazu – oder fällt weg. Bei „man“ fällt er immer weg.</li></ol>
        <p><b>Vom Passiv ins Aktiv</b></p>
        <ol><li>Wer tut es? Die Person hinter „von“ wird das Subjekt.</li>
        <li>Das Verb steht <b>ohne werden</b>, in derselben Zeitform.</li></ol>` },
      { t: "Kleines Wörterbuch", html: `
        <ul><li><b>Subjekt:</b> Wer oder was tut etwas? <i><u>Der Hund</u> bellt.</i></li>
        <li><b>Akkusativobjekt:</b> Wen oder was? <i>Ich sehe <u>den Hund</u>.</i></li>
        <li><b>Hilfsverb:</b> haben, sein oder werden – es hilft, eine Zeitform oder das Passiv zu bilden.</li>
        <li><b>Partizip II:</b> die Verbform mit ge-: <i>gelacht, gegangen, abgeholt</i>. Bei be-, ver-, er- ohne ge-: <i>besucht</i>.</li>
        <li><b>Grundform (Infinitiv):</b> so steht das Verb im Wörterbuch: <i>lachen, gehen</i>.</li>
        <li><b>Trennbares Verb:</b> Ein Teil rückt ans Satzende: <i>aufräumen → Ich räume auf.</i></li></ul>` }
    ],
    fallen: [
      "„wird“ allein ist noch kein Passiv: **wird** + Partizip II (wird gebacken) = Passiv · **wird** + Grundform (wird backen) = Futur I im Aktiv.",
      "Im Passiv Perfekt heißt es **worden**, nicht „geworden“: Der Kuchen ist gebacken **worden**.",
      "Beim Umformen bleibt die Zeitform immer gleich.",
      "Ein trennbares Verb ist kein Hilfsverb: „Sie **räumt** das Zimmer **auf**“ ist ein Wort (aufräumen) im Präsens."
    ],
    basis: [
      /* ---------- Teil 1: Wortarten und Pronomen ---------- */
      { typ: "luecke", davor: "Teil 1 · Wortarten und Pronomen (Aufgaben 1 bis 3)", tag: "Aufgabe 1 · in der Probe 3 Punkte",
        t: "Welche Wortart hat das Wort in GROSSBUCHSTABEN? Ordne zu.", auswahl: WORTARTEN,
        tipp: [
          "Frage bei jedem Wort: Was tut es im Satz? Sagt es wann oder wo, verbindet es zwei Sätze, zeigt es auf etwas – oder meint es dieselbe Person wie das Subjekt?",
          "Drei Wörter stehen direkt nach einem Satzzeichen. Nach dem **Komma**: Meint das Wort das Nomen davor (Relativpronomen) – oder verbindet es nur zwei Sätze (Konjunktion)? Nach dem **Punkt**: Das Wort zeigt betont auf etwas (Demonstrativpronomen).",
          "Drei Proben: Antwortet das Wort auf „Wann?“ und bleibt immer gleich? → Adverb. Steht direkt danach ein Nomen mit Artikel? → Präposition. Kannst du „sich selbst“ sagen? → Reflexivpronomen."
        ],
        richtig: "Alles richtig! MORGENS sagt wann (Adverb) · AN steht vor „der Wand“ (Präposition) · DASS verbindet zwei Sätze (Konjunktion) · DEN zeigt auf den Ständer (Demonstrativpronomen) · DIE meint „die Zange“ (Relativpronomen) · SICH meint Tarik selbst (Reflexivpronomen).",
        items: [
          { s: "Die Werkstatt öffnet MORGENS um acht Uhr. →\u00a0{{Adverb}}", e: "Frage: Wann öffnet die Werkstatt? Das Wort gibt eine Zeit an und bleibt immer gleich." },
          { s: "Das Werkzeug hängt AN der Wand. →\u00a0{{Präposition}}", e: "Das Wort steht vor einem Nomen mit Artikel („der Wand“) und sagt, wo etwas ist." },
          { s: "Frau Okafor sagt, DASS die Klingel fehlt. →\u00a0{{Konjunktion}}", e: "Das Wort steht nach dem Komma und verbindet zwei Sätze. Es meint kein Nomen aus dem ersten Satz." },
          { s: "Der Ständer wackelt. DEN müssen wir festschrauben. →\u00a0{{Demonstrativpronomen}}", e: "Vor dem Wort steht ein Punkt, kein Komma – ein neuer Satz beginnt. Das Wort zeigt betont auf den Ständer: „Den da!“" },
          { s: "Die Zange, DIE auf der Werkbank liegt, ist neu. →\u00a0{{Relativpronomen}}", e: "Das Wort steht nach dem Komma und meint das Nomen davor („die Zange“). Es beginnt einen Nebensatz." },
          { s: "Tarik ärgert SICH über den platten Reifen. →\u00a0{{Reflexivpronomen}}", e: "Wer ärgert wen? Tarik ärgert … Tarik. Das Wort meint dieselbe Person wie das Subjekt." }
        ] },
      { typ: "luecke", tag: "Aufgabe 2 · in der Probe 4 Punkte",
        t: "Setze das passende Relativpronomen ein. Schreibe nur das fehlende Wort in das Feld.",
        tipp: [
          "Geh immer in zwei Schritten vor. Schritt 1: Welches Nomen steht vor dem Komma? Ist es männlich, weiblich, sächlich – oder Mehrzahl?",
          "Schritt 2: Stelle im Relativsatz eine Frage. **Wen** haben wir bestellt? · **Wem** gehört das Rennrad? · **Wem** macht die Arbeit Spaß? · **Wessen** Lenker ist verbogen?",
          "Sieh jetzt in der Tabelle oben nach: Wen? → den, die, das · Wem? → dem, der, dem – in der Mehrzahl mit -en am Ende · Wessen? → dessen oder deren."
        ],
        richtig: "Alles richtig! Wen? → **den** Helm · Wem? → **dem** Kunden · Wem? in der Mehrzahl → **denen** · Wessen? → **dessen** Lenker.",
        items: [
          { s: "Der Helm, [[den|welchen]] wir gestern bestellt haben, ist schon da.", e: "Das Nomen vor dem Komma: der Helm (männlich). Frage im Relativsatz: Wen oder was haben wir bestellt?" },
          { s: "Dort wartet der Kunde, [[dem|welchem]] das rote Rennrad gehört.", e: "Das Nomen vor dem Komma: der Kunde (männlich). Frage im Relativsatz: Wem gehört das Rennrad?" },
          { s: "Die Lehrlinge, [[denen|welchen]] die Arbeit Spaß macht, bleiben oft länger.", e: "Das Nomen vor dem Komma: die Lehrlinge (Mehrzahl). Frage: Wem macht die Arbeit Spaß? In der Mehrzahl endet das Wort auf -en." },
          { s: "Das Rad, [[dessen]] Lenker verbogen ist, steht in der Ecke.", e: "Das Nomen vor dem Komma: das Rad (sächlich). Frage im Relativsatz: Wessen Lenker ist verbogen?" }
        ] },
      { typ: "wahl", tag: "Aufgabe 3 · in der Probe 1 Punkt",
        t: "In welchem Satz ist UNS ein Reflexivpronomen?",
        tipp: [
          "Ein Reflexivpronomen bezieht sich auf das Subjekt zurück: Subjekt und Pronomen meinen dieselben Personen.",
          "Suche in jedem Satz das Subjekt: Wer zeigt etwas? Wer ruft an? Was gehört uns? Wer beeilt sich?",
          "Nur wenn das Subjekt „wir“ heißt, kann UNS ein Reflexivpronomen sein: wir … uns (selbst)."
        ],
        richtig: "Richtig! In „Wir beeilen uns“ meinen Subjekt (wir) und Pronomen (uns) dieselben Personen. In den anderen Sätzen ist jemand anderes das Subjekt: die Meisterin, der Kunde, das Werkzeug.",
        items: [
          { o: ["Wir beeilen UNS mit der Reparatur.", "Die Meisterin zeigt UNS die neue Bremse.", "Der Kunde ruft UNS morgen an.", "Dieses Werkzeug gehört UNS."], a: 0, mischen: true,
            e: "Suche das Subjekt: Wer tut hier etwas? In diesem Satz sind es nicht „wir“ – UNS meint also andere Personen als das Subjekt." }
        ] },

      /* ---------- Teil 2: Zeitformen ---------- */
      { typ: "luecke", davor: "Teil 2 · Zeitformen (Aufgaben 4 bis 6)", tag: "Aufgabe 4 · in der Probe 3 Punkte",
        t: "In welcher Zeitform steht der Satz? Ordne zu.", auswahl: ZEITFORMEN,
        tipp: [
          "Suche zuerst alle Teile des Verbs. Gibt es ein Hilfsverb (hat, ist, hatte, war, wird)? Und was steht am Satzende?",
          "Kein Hilfsverb: Präsens (jetzt) oder Präteritum (früher). · hat oder ist + Partizip II: Perfekt. · hatte oder war + Partizip II: Plusquamperfekt.",
          "Zweimal steht „wird“: wird + Grundform = Futur I · wird + Partizip II + haben = Futur II. Achtung bei „rief … an“ und „zieht … fest“: Das sind trennbare Verben (anrufen, festziehen) – hier ist kein Hilfsverb dabei."
        ],
        richtig: "Alles richtig! ist angekommen = Perfekt · wird anbieten = Futur I · rief an = Präteritum · wird gespannt haben = Futur II · zieht fest = Präsens · hatte geprüft = Plusquamperfekt.",
        items: [
          { s: "Die Lieferung ist am Vormittag angekommen. →\u00a0{{Perfekt}}", e: "Das Verb hat zwei Teile: „ist“ + Partizip II („angekommen“). „ist“ steht in der Gegenwart." },
          { s: "Nächste Woche wird die Werkstatt neue Helme anbieten. →\u00a0{{Futur I}}", e: "„wird“ + Grundform am Satzende („anbieten“): Das passiert erst noch." },
          { s: "Gestern rief ein Kunde wegen seiner Bremse an. →\u00a0{{Präteritum}}", e: "Das Verb heißt „anrufen“. Hier steht kein Hilfsverb – nur eine Vergangenheitsform aus einem Wort: „rief … an“." },
          { s: "Bis Freitag wird der Lehrling alle Speichen gespannt haben. →\u00a0{{Futur II}}", e: "Zähle die Teile des Verbs: „wird“ + Partizip II („gespannt“) + „haben“ – das sind drei." },
          { s: "Tarik zieht die Schrauben am Sattel fest. →\u00a0{{Präsens}}", e: "Das Verb heißt „festziehen“. Es passiert jetzt, und es steht kein Hilfsverb dabei." },
          { s: "Vor der Probefahrt hatte Mira das Licht geprüft. →\u00a0{{Plusquamperfekt}}", e: "„hatte“ + Partizip II („geprüft“): Das war schon vorher passiert. „hatte“ ist die Vergangenheit von „hat“." }
        ] },
      { typ: "luecke", tag: "Aufgabe 5 · in der Probe 4 Punkte",
        t: "Bilde die Verbform in der angegebenen Zeitform. Beispiel: ich (schrauben) – Präsens → ich schraube",
        tipp: [
          "Überlege bei jeder Form zuerst: Braucht die Zeitform ein Hilfsverb? Präteritum: keins. · Perfekt: haben oder sein. · Plusquamperfekt: hatte oder war. · Futur II: werden … haben.",
          "haben oder sein? „sein“ steht bei Bewegung von einem Ort zum anderen (absteigen) und bei Veränderung (reißen: Danach ist die Kette kaputt).",
          "Die Partizipien: reißen → gerissen · absteigen → abgestiegen · bremsen → gebremst. Im Präteritum ändert „schieben“ seinen Vokal: aus ie wird o."
        ],
        richtig: "Alles richtig! er schob · die Kette ist gerissen · wir waren abgestiegen · ihr werdet gebremst haben.",
        items: [
          { s: "er (schieben) – Präteritum →\u00a0[[er schob|schob]]", e: "Präteritum ist ein Wort, ohne Hilfsverb. „schieben“ ist unregelmäßig: Der Vokal ändert sich (ie wird zu o)." },
          { s: "die Kette (reißen) – Perfekt →\u00a0[[die Kette ist gerissen|ist gerissen|sie ist gerissen]]", e: "Perfekt = haben oder sein + Partizip II. Die Kette verändert sich (heil → kaputt), deshalb „sein“. Das Partizip II beginnt mit ge-." },
          { s: "wir (absteigen) – Plusquamperfekt →\u00a0[[wir waren abgestiegen|waren abgestiegen]]", e: "Plusquamperfekt = hatte oder war + Partizip II. Absteigen ist eine Bewegung, deshalb „sein“. Beim Partizip II steht „ge“ in der Mitte: ab-ge-…" },
          { s: "ihr (bremsen) – Futur II →\u00a0[[ihr werdet gebremst haben|werdet gebremst haben]]", e: "Futur II = Form von „werden“ + Partizip II + haben. Zu „ihr“ gehört „werdet“." }
        ] },
      { typ: "umformen", tag: "Aufgabe 6 · in der Probe 2 Punkte",
        t: "Setze den Satz ins Futur II.",
        tipp: [
          "Das Futur II sagt: Bis zu einem Zeitpunkt in der Zukunft ist etwas schon erledigt. Hier: Am Samstag ist Tarik mit allen Reifen fertig.",
          "Das Futur II hat drei Teile: die Form von „werden“ an zweiter Stelle – und am Satzende das Partizip II und „haben“ oder „sein“.",
          "Das Partizip II von „flicken“ heißt „geflickt“. Baue so: Bis Samstag **wird** Tarik alle Reifen … …"
        ],
        richtig: "Richtig! **wird** + Partizip II (**geflickt**) + **haben** = Futur II: Am Samstag ist die Arbeit schon erledigt.",
        items: [
          { s: "Bis Samstag flickt Tarik alle Reifen.",
            l: ["Bis Samstag wird Tarik alle Reifen geflickt haben.", "Tarik wird bis Samstag alle Reifen geflickt haben.", "Tarik wird alle Reifen bis Samstag geflickt haben.", "Alle Reifen wird Tarik bis Samstag geflickt haben."],
            kriterien: ["Futur II: wird + geflickt + haben"],
            e: "Im Futur II hat das Verb drei Teile: „wird“ an zweiter Stelle, am Satzende das Partizip II und „haben“." }
        ] },

      /* ---------- Teil 3: Aktiv und Passiv ---------- */
      { typ: "luecke", davor: "Teil 3 · Aktiv und Passiv (Aufgaben 7 bis 11)", tag: "Aufgabe 7 · in der Probe 3 Punkte",
        t: "Aktiv oder Passiv – und in welcher Zeitform? Ordne zu.", auswahl: AKTIV_PASSIV,
        tipp: [
          "Erste Frage bei jedem Satz: Tut das Subjekt selbst etwas (Aktiv) – oder wird etwas mit ihm gemacht (Passiv)?",
          "Das Passiv erkennst du an „werden“ + Partizip II. Steht nach „wird“ nur die Grundform, ist es Futur I im Aktiv. Und „ist“ + Partizip II ohne „worden“ ist Perfekt im Aktiv.",

        richtig: "Alles richtig! wird geölt = Passiv im Präsens · ist weggefahren = Aktiv im Perfekt · wird abgeholt werden = Passiv im Futur I · wurde gestaltet = Passiv im Präteritum · wird anschrauben = Aktiv im Futur I · ist gestellt worden = Passiv im Perfekt.",
        items: [
          { s: "Die Kette wird regelmäßig geölt. →\u00a0{{Passiv im Präsens}}", e: "„wird“ + Partizip II („geölt“): Mit der Kette wird etwas gemacht. „wird“ steht in der Gegenwart." },
          { s: "Der Paketbote ist schon weggefahren. →\u00a0{{Aktiv im Perfekt}}", e: "Der Paketbote tut selbst etwas: Er fährt weg. Im Satz steht kein „worden“ – „ist“ + Partizip II ist hier eine Zeitform." },
          { s: "Das Rad wird morgen abgeholt werden. →\u00a0{{Passiv im Futur I}}", e: "Mit dem Rad wird etwas gemacht (Partizip II „abgeholt“). Am Satzende steht noch einmal „werden“ – das zeigt die Zukunft." },
          { s: "Das Schaufenster wurde neu gestaltet. →\u00a0{{Passiv im Präteritum}}", e: "„wurde“ + Partizip II („gestaltet“). „wurde“ ist die Vergangenheit von „wird“." },
