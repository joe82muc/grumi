  <script>
  Grammatik.seite({
    nr: 4,
    titel: "Konjunktiv",
    lead: "Wenn du wiedergibst, was jemand gesagt hat, nimmst du den Konjunktiv I: „Mia sagt, sie sei krank.“ So zeigst du: Das hat jemand anderes behauptet.",
    ziele: ["Du erkennst den Konjunktiv I.", "Du bildest den Konjunktiv I.", "Du gibst Aussagen in der indirekten Rede wieder."],
    merk: [
      { t: "Wozu der Konjunktiv I?", html: `
        <p>Du gibst wieder, was jemand gesagt hat – ohne Anführungszeichen. Das nennt man <b>indirekte Rede</b>. Zeitungen und Berichte nutzen sie ständig.</p>
        <div class="bsp">Mia sagt: „Ich bin krank.“ → Mia sagt, sie <span class="hl-v">sei</span> krank.</div>` },
      { t: "So bildest du den Konjunktiv I", html: `
        <p>Stamm des Verbs + <b>-e</b> (bei er, sie, es):</p>
        <table><tr><th>Indikativ</th><th>Konjunktiv I</th></tr>
        <tr><td>er kommt</td><td>er <b>komme</b></td></tr><tr><td>sie hat</td><td>sie <b>habe</b></td></tr>
        <tr><td>es gibt</td><td>es <b>gebe</b></td></tr><tr><td>er kann</td><td>er <b>könne</b></td></tr>
        <tr><td>sie ist</td><td>sie <b>sei</b> (Ausnahme!)</td></tr></table>` },
      { t: "Von der direkten zur indirekten Rede", html: `
        <ol><li>Doppelpunkt und Anführungszeichen fallen weg, dafür ein Komma.</li>
        <li>Die Pronomen ändern sich: ich → er/sie, mein → sein/ihr.</li>
        <li>Das Verb kommt in den Konjunktiv I.</li></ol>
        <div class="bsp">Paul sagt: „Ich habe meinen Schlüssel verloren.“ → Paul sagt, er <b>habe</b> seinen Schlüssel verloren.</div>` },
      { t: "Plus: Konjunktiv II – Wünsche und Träume", html: `
        <p>Für Wünsche, Unwirkliches und höfliche Bitten: <b>wäre, hätte, könnte, würde …</b></p>
        <div class="bsp">Wenn ich Ferien <b>hätte</b>, <b>würde</b> ich ausschlafen. · <b>Könntest</b> du mir helfen?</div>` }
    ],
    fallen: [
      "„Sie sagt, sie **ist** krank“ ist Alltagssprache. In Berichten heißt es: „Sie sagt, sie **sei** krank.“",
      "In der indirekten Rede gibt es keine Anführungszeichen und keinen Doppelpunkt.",
      "Vergiss nicht, die Pronomen anzupassen: aus „ich“ wird „er“ oder „sie“."
    ],
    basis: [
      { typ: "zuordnen", t: "Wirklichkeitsform (Indikativ) oder Konjunktiv I?", tipp: "Konjunktiv I endet bei er/sie/es auf -e (Ausnahme: sei).",
        gruppen: ["Indikativ", "Konjunktiv I"],
        karten: [["er geht", 0], ["er gehe", 1], ["sie bleibt", 0], ["sie bleibe", 1], ["es ist", 0], ["es sei", 1],
                 ["er hat", 0], ["er habe", 1], ["sie darf", 0], ["sie dürfe", 1]] },
      { typ: "luecke", t: "Setze das Verb im Konjunktiv I ein.", tipp: "Stamm + e: komm-e, hab-e, geb-e. Bei „sein“: sei.",
        items: ["Mia sagt, sie [[sei]] krank. (sein)", "Der Trainer meint, das Spiel [[beginne]] gleich. (beginnen)",
                "Paul erzählt, er [[habe]] einen neuen Hund. (haben)", "Die Zeitung schreibt, es [[gebe]] bald Schnee. (geben)",
                "Oma sagt, sie [[komme]] am Sonntag. (kommen)"] },
      { typ: "wahl", t: "Direkte oder indirekte Rede?",
        items: [
          { s: "Luca sagt: „Ich habe Hunger.“", o: ["direkte Rede", "indirekte Rede"], a: 0 },
          { s: "Luca sagt, er habe Hunger.", o: ["direkte Rede", "indirekte Rede"], a: 1 },
          { s: "Die Lehrerin erklärt, die Probe sei am Freitag.", o: ["direkte Rede", "indirekte Rede"], a: 1 },
          { s: "„Die Probe ist am Freitag“, erklärt die Lehrerin.", o: ["direkte Rede", "indirekte Rede"], a: 0 }
        ] },
      { typ: "wahl", t: "Welche Form passt in die indirekte Rede?", mischen: true,
        items: [
          { s: "Er sagt, er ___ müde.", o: ["sei", "ist", "war"], a: 0 },
          { s: "Sie meint, sie ___ keine Zeit.", o: ["habe", "hat", "hatte"], a: 0 },
          { s: "Der Fahrer sagt, der Bus ___ gleich los.", o: ["fahre", "fährt", "fuhr"], a: 0 },
          { s: "Tim erzählt, er ___ gut schwimmen.", o: ["könne", "kann", "konnte"], a: 0 }
        ] },
      { typ: "umformen", t: "Schreibe in der indirekten Rede.", tipp: "Komma statt Doppelpunkt, keine Anführungszeichen, Pronomen anpassen, Konjunktiv I.",
        items: [
          { s: "Elif sagt: „Ich bin müde.“", l: ["Elif sagt, sie sei müde.", "Elif sagt, dass sie müde sei."] },
          { s: "Jonas sagt: „Ich habe mein Heft vergessen.“", l: ["Jonas sagt, er habe sein Heft vergessen.", "Jonas sagt, dass er sein Heft vergessen habe."] },
          { s: "Die Trainerin sagt: „Das Training fällt aus.“", l: ["Die Trainerin sagt, das Training falle aus.", "Die Trainerin sagt, dass das Training ausfalle."] }
        ] },
      { typ: "markieren", t: "Markiere die Verben im Konjunktiv I.", tipp: "Sie enden auf -e oder heißen „sei“.",
        items: ["Der Reporter berichtet, der Sturm [sei] vorbei.", "Die Polizei meldet, es [gebe] keine Verletzten.",
                "Der Bürgermeister sagt, die Straße [werde] morgen geräumt."] }
    ],
    plus: [
      { typ: "luecke", t: "Konjunktiv II: Setze die richtige Form ein.", tipp: "hätte, wäre, könnte – oft mit Umlaut.",
        items: ["Wenn ich Zeit [[hätte]], käme ich mit. (haben)", "Wenn es wärmer [[wäre]], gingen wir baden. (sein)",
                "[[Könntest]] du mir bitte helfen? (können)", "Ich [[würde]] gern ein Pferd reiten. (werden)"] },
      { typ: "wahl", t: "Wozu steht hier der Konjunktiv II?", tipp: "Wunsch, etwas Unwirkliches oder eine höfliche Bitte?",
        items: [
          { s: "Hätte ich doch einen Hund!", o: ["Wunsch", "Unwirkliches", "höfliche Bitte"], a: 0 },
          { s: "Wenn ich fliegen könnte, wäre ich schon dort.", o: ["Wunsch", "Unwirkliches", "höfliche Bitte"], a: 1 },
          { s: "Würden Sie bitte das Fenster schließen?", o: ["Wunsch", "Unwirkliches", "höfliche Bitte"], a: 2 }
        ] },
      { typ: "zuordnen", t: "Konjunktiv I oder Konjunktiv II?", tipp: "Konjunktiv II hat oft einen Umlaut oder „würde“.",
        gruppen: ["Konjunktiv I", "Konjunktiv II"],
        karten: [["er habe", 0], ["er hätte", 1], ["sie sei", 0], ["sie wäre", 1], ["es komme", 0], ["es käme", 1], ["sie könne", 0], ["sie könnte", 1]] },
      { typ: "frei", t: "Schreibe einen Wunschsatz im Konjunktiv II.",
        items: [
          { f: "Was würdest du tun, wenn du einen Tag lang unsichtbar wärst?", kriterien: ["Konjunktiv II (z. B. wäre, hätte, würde, könnte)", "ganzer Satz zum Thema"],
            muster: "\\b(wäre|wären|wärst|hätte|hätten|hättest|würde|würden|würdest|könnte|könnten|könntest)\\b",
            bsp: "Wenn ich unsichtbar wäre, würde ich mich ins Lehrerzimmer schleichen." }
        ] }
    ]
  });
