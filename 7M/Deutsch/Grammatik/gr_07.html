  <title>Gliedsätze | Deutsch 7 Grammatik</title>
  <meta name="description" content="Deutsch 7 Grammatik: Gliedsätze erkennen – Subjektsatz und Objektsatz, im M-Zug auch Adverbialsätze. Mit Basis- und Plus-Aufgaben.">

<body>
  <div id="app"><noscript><p style="padding:20px">Diese Übungsseite braucht JavaScript.</p></noscript></div>
  <script src="../../../js/lernstand.js"></script>
  <script src="../../../js/grammatik.js"></script>
  <script src="themen.js"></script>
  <script>
  Grammatik.seite({
    nr: 7,
    titel: "Gliedsätze",
    lead: "Ein Satzglied kann auch ein ganzer Nebensatz sein. „Dein Besuch freut mich“ und „Dass du kommst, freut mich“ sagen dasselbe – im zweiten Satz ist das Subjekt ein Nebensatz.",
    ziele: ["Du erkennst Gliedsätze.", "Du unterscheidest Subjektsatz und Objektsatz.", "Du formst Satzglieder in Gliedsätze um."],
    merk: [
      { t: "Was ist ein Gliedsatz?", html: `
        <p>Ein <b>Nebensatz</b>, der die Aufgabe eines <b>Satzglieds</b> übernimmt.</p>
        <div class="bsp"><span class="hl-b">Dein Besuch</span> freut mich. → <span class="hl-b">Dass du mich besuchst</span>, freut mich.</div>
        <p>Beide Male ist der markierte Teil das Subjekt.</p>` },
      { t: "Subjektsatz – Wer oder was?", html: `
        <div class="bsp"><span class="hl-b">Wer zu spät kommt</span>, muss sich beim Sekretariat melden.</div>
        <div class="bsp"><span class="hl-b">Dass es schneit</span>, freut die Kinder.</div>
        <p><b>Ersatzprobe:</b> Ersetze den Nebensatz durch „das“: <i>Das freut die Kinder.</i> → Wer oder was freut die Kinder? → Subjekt.</p>` },
      { t: "Objektsatz – Wen oder was?", html: `
        <div class="bsp">Ich weiß, <span class="hl-g">dass du recht hast</span>.</div>
        <div class="bsp">Sie fragt, <span class="hl-g">ob du mitkommst</span>.</div>
        <p><b>Ersatzprobe:</b> <i>Ich weiß es.</i> → Wen oder was weiß ich? → Akkusativobjekt.</p>
        <p class="merksatz">Gliedsätze beginnen oft mit dass, ob, wer, was, wo, wie – und werden mit Komma abgetrennt.</p>` },
      { t: "Plus: Adverbialsätze", html: `
        <p>Auch Adverbiale können Nebensätze sein:</p>
        <ul><li><b>Kausalsatz</b> (Grund): <i>Weil es regnet, bleiben wir drinnen.</i></li>
        <li><b>Temporalsatz</b> (Zeit): <i>Als der Film begann, wurde es still.</i></li>
        <li><b>Konditionalsatz</b> (Bedingung): <i>Wenn du Zeit hast, hilf mir.</i></li></ul>` }
    ],
    fallen: [
      "Ob Subjekt- oder Objektsatz, zeigt dir die Frage mit dem Prädikat: „**Was** freut mich?“ (Subjekt) – „**Was** weiß ich?“ (Objekt).",
      "Auch ein Gliedsatz am Satzanfang wird mit Komma abgetrennt: „Wer Hunger hat**,** darf essen.“",
      "„dass“ (Konjunktion) schreibt man mit ss – „das“ ist Artikel oder Pronomen."
    ],
    basis: [
      { typ: "markieren", t: "Markiere die Gliedsätze – ohne Komma.", tipp: "Gliedsätze beginnen mit dass, ob, wer, was, wo, wie … und enden mit dem Verb.",
        items: ["[Wer viel liest], schreibt meistens besser.", "Ich hoffe, [dass es morgen sonnig ist].",
                "[Was du da erzählst], stimmt nicht.", "Lina fragt, [ob wir mitkommen]."] },
      { typ: "wahl", t: "Subjektsatz oder Objektsatz?", tipp: "Ersetze den Nebensatz durch „das“ oder „es“ und frag: Wer/was … (Subjekt) oder wen/was … (Objekt)?",
        items: [
          { s: "**Wer viel liest**, schreibt besser.", o: ["Subjektsatz", "Objektsatz"], a: 0, e: "Wer schreibt besser? → Subjekt." },
          { s: "Ich hoffe, **dass es morgen sonnig ist**.", o: ["Subjektsatz", "Objektsatz"], a: 1, e: "Was hoffe ich? → Objekt." },
          { s: "**Dass du gewonnen hast**, freut mich sehr.", o: ["Subjektsatz", "Objektsatz"], a: 0, e: "Was freut mich? → Subjekt." },
          { s: "Mia fragt, **ob wir mitkommen**.", o: ["Subjektsatz", "Objektsatz"], a: 1 },
          { s: "**Was du da erzählst**, stimmt nicht.", o: ["Subjektsatz", "Objektsatz"], a: 0 },
          { s: "Ich weiß nicht, **wo mein Schlüssel ist**.", o: ["Subjektsatz", "Objektsatz"], a: 1 }
        ] },
      { typ: "luecke", t: "Wähle das Einleitewort.", tipp: "Frage (ja/nein) → ob · Person → wer · Sache → was · Aussage → dass",
        items: ["Ich weiß nicht, {{ob|dass|wer}} er heute kommt.", "{{Wer|Was|Ob}} Hunger hat, darf sich etwas nehmen.",
                "Mama ruft, {{dass|ob|was}} das Essen fertig ist.", "{{Was|Wer|Dass}} du da sagst, ist lustig."] },
      { typ: "zuordnen", t: "Sortiere: Subjektsatz oder Objektsatz?", tipp: "Mach die Ersatzprobe mit „das“.",
        gruppen: ["Subjektsatz", "Objektsatz"],
        karten: [["Wer lacht, hat mehr Spaß.", 0], ["Dass es schneit, freut die Kinder.", 0], ["Was du sagst, stimmt.", 0],
                 ["Ich glaube, dass du recht hast.", 1], ["Sie fragt, ob du kommst.", 1], ["Er erzählt, was passiert ist.", 1]] },
      { typ: "umformen", t: "Mach aus dem markierten Satzglied einen Gliedsatz.", tipp: "Nimm „dass“ oder ein Fragewort. Das Verb steht am Ende des Nebensatzes.",
        items: [
          { s: "Ich hoffe auf **deinen Besuch**.", l: ["Ich hoffe, dass du mich besuchst.", "Ich hoffe, dass du kommst.", "Ich hoffe, dass du mich besuchen kommst."] },
          { s: "**Dein Sieg** freut mich.", l: ["Dass du gewonnen hast, freut mich.", "Es freut mich, dass du gewonnen hast.", "Dass du gesiegt hast, freut mich."] }
        ] },
      { typ: "komma", t: "Setze die Kommas.", tipp: "Der Gliedsatz wird abgetrennt – egal ob er vorn oder hinten steht.",
        items: ["Wer Hunger hat, darf sich etwas nehmen.", "Ich weiß nicht, ob du recht hast.", "Dass du da bist, freut mich."] }
    ],
    plus: [
      { typ: "wahl", t: "Welcher Adverbialsatz ist markiert?", tipp: "weil → Grund · als/nachdem → Zeit · wenn/falls → Bedingung",
        items: [
          { s: "**Weil die Halle gesperrt ist**, fällt Sport aus.", o: ["Kausalsatz (Grund)", "Temporalsatz (Zeit)", "Konditionalsatz (Bedingung)"], a: 0 },
          { s: "**Als der Film begann**, wurde es still.", o: ["Kausalsatz (Grund)", "Temporalsatz (Zeit)", "Konditionalsatz (Bedingung)"], a: 1 },
          { s: "**Wenn du Zeit hast**, hilf mir bitte.", o: ["Kausalsatz (Grund)", "Temporalsatz (Zeit)", "Konditionalsatz (Bedingung)"], a: 2 },
          { s: "**Nachdem wir gegessen hatten**, spielten wir.", o: ["Kausalsatz (Grund)", "Temporalsatz (Zeit)", "Konditionalsatz (Bedingung)"], a: 1 }
        ] },
      { typ: "umformen", t: "Mach aus der Adverbiale einen Adverbialsatz.", tipp: "nach dem … → nachdem … · bei Regen → wenn es regnet",
        items: [
          { s: "Nach dem Essen spielen wir Karten.", l: ["Nachdem wir gegessen haben, spielen wir Karten.", "Wenn wir gegessen haben, spielen wir Karten."] },
          { s: "Bei Regen fällt das Spiel aus.", l: ["Wenn es regnet, fällt das Spiel aus.", "Falls es regnet, fällt das Spiel aus.", "Das Spiel fällt aus, wenn es regnet."] }
        ] },
      { typ: "frei", t: "Schreibe einen Satz, der mit einem Subjektsatz beginnt.",
        items: [
          { f: "Beginne mit „Wer …“ – zum Beispiel ein Tipp für die Schule.", kriterien: ["beginnt mit einem Subjektsatz („Wer …“, Verb am Ende)", "danach folgt der Hauptsatz nach einem Komma"],
            muster: "^\\s*wer\\b[^,]+,\\s*\\S+",
            bsp: "Wer früh mit dem Lernen anfängt, hat vor der Probe weniger Stress." }
        ] }
    ]
  });
  </script>
