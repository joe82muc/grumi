    ziele: ["Du bildest das Perfekt mit haben oder sein.", "Du kennst das Partizip II wichtiger Verben."],
    merk: [
      { t: "Wann benutzt du das Perfekt?", html: `
        <p>Wenn du jemandem <b>erzählst</b>, was passiert ist – im Gespräch, in einer Nachricht, in einem Brief:</p>
        <div class="bsp">Gestern <span class="hl-r">habe</span> ich Oma <span class="hl-r">besucht</span>. Wir <span class="hl-r">sind</span> zusammen spazieren <span class="hl-r">gegangen</span>.</div>` },
      { t: "So bildest du das Perfekt", html: `
        <p><b>haben</b> oder <b>sein</b> + <b>Partizip II</b></p>
        <table><tr><th>Person</th><th>spielen</th><th>laufen</th></tr>
        <tr><td>ich</td><td>habe gespielt</td><td>bin gelaufen</td></tr>
        <tr><td>du</td><td>hast gespielt</td><td>bist gelaufen</td></tr>
        <tr><td>er, sie, es</td><td>hat gespielt</td><td>ist gelaufen</td></tr>
        <tr><td>wir</td><td>haben gespielt</td><td>sind gelaufen</td></tr>
        <tr><td>ihr</td><td>habt gespielt</td><td>seid gelaufen</td></tr>
        <tr><td>sie</td><td>haben gespielt</td><td>sind gelaufen</td></tr></table>` },
      { t: "Das Partizip II", html: `
        <ul><li><b>regelmäßig:</b> ge + Stamm + t – <i>spielen → <b>ge</b>spiel<b>t</b>, kaufen → <b>ge</b>kauf<b>t</b></i></li>
        <li><b>unregelmäßig:</b> ge + … + en, oft mit anderem Vokal – <i>gehen → <b>ge</b>gang<b>en</b>, trinken → <b>ge</b>trunk<b>en</b></i></li>
        <li><b>ohne ge-</b> bei Verben mit be-, er-, ver- und auf -ieren – <i>besuchen → besucht, erzählen → erzählt, verlieren → verloren, telefonieren → telefoniert</i></li></ul>` },

        <p><b>sein</b> steht bei Verben, die eine <b>Bewegung</b> von einem Ort zum anderen ausdrücken, und bei einer <b>Veränderung</b>:</p>
        <div class="bsp">Ich <span class="hl-r">bin</span> gefahren. · Er <span class="hl-r">ist</span> gekommen. · Sie <span class="hl-r">ist</span> eingeschlafen.</div>

    ],
    fallen: [
      "Ich **bin** gegangen – nicht „ich habe gegangen“. Bewegung von einem Ort zum anderen → sein.",

          { s: "Die Katze schläft auf dem Sofa.", l: ["Die Katze hat auf dem Sofa geschlafen."] }
        ] }
