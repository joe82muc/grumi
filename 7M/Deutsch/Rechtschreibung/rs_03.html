  <script>
  Grammatik.seite({
    nr: 3,
    titel: "Getrennt oder zusammen?",
    lead: "Rad fahren oder radfahren? mitnehmen oder mit nehmen? Sprich das Wort laut – die Betonung verrät dir, ob du getrennt oder zusammen schreibst.",
    ziele: ["Du wendest die Betonungsprobe an.", "Du schreibst Wortgruppen getrennt und Zusammensetzungen zusammen.", "Du nutzt die Bedeutungsprobe."],
    merk: [
      { t: "Die Betonungsprobe", html: `
        <p>Sprich die Wörter laut:</p>
        <ul><li><b>Eine</b> Hauptbetonung → <b>zusammen</b>: <i><b>weg</b>laufen, <b>mit</b>nehmen, <b>vor</b>lesen</i></li>
        <li><b>Zwei</b> Betonungen → <b>getrennt</b>: <i><b>Rad</b> <b>fah</b>ren, <b>spa</b>zieren <b>ge</b>hen</i></li></ul>` },
      { t: "Meist getrennt", html: `
        <ul><li><b>Verb + Verb:</b> spazieren gehen, schwimmen lernen, lesen üben</li>
        <li><b>Nomen + Verb:</b> Rad fahren, Fußball spielen, Auto fahren</li>
        <li><b>Adjektiv + Verb</b> in wörtlicher Bedeutung: laut lesen, schnell rennen</li></ul>` },
      { t: "Meist zusammen", html: `
        <ul><li><b>weg, mit, vor, zurück, vorbei, heraus …</b> + Verb: weglaufen, mitkommen, zurückgeben</li>
        <li><b>Nomen + Nomen:</b> Schulhof, Fahrradhelm, Apfelbaum</li>
        <li><b>irgend-</b>: irgendwo, irgendwann, irgendetwas</li></ul>
        <p>Im Satz trennen sich diese Verben: <i>Ich lese vor. · Kommst du mit?</i></p>` },
      { t: "Plus: Die Bedeutungsprobe", html: `
        <p>Entsteht eine <b>neue Bedeutung</b>, schreibst du zusammen:</p>
        <div class="bsp">Der Richter will den Mann <b>freisprechen</b> (für unschuldig erklären).</div>
        <div class="bsp">Beim Referat sollst du <b>frei sprechen</b> (ohne abzulesen).</div>` }
    ],
    fallen: [
      "**Rad fahren** und **Fußball spielen** schreibst du getrennt – als Nomen aber zusammen und groß: **das Radfahren**.",
      "Wörter mit **irgend-** schreibst du immer zusammen: irgendwo, irgendwer.",
      "Im Infinitiv zusammen (mitkommen), im Satz getrennt (Kommst du mit?)."
    ],
    basis: [
      { typ: "wahl", t: "Getrennt oder zusammen?", mischen: true, tipp: "Mach die Betonungsprobe: eine Hauptbetonung → zusammen.",
        items: [
          { s: "Wir wollen heute ___ .", o: ["Rad fahren", "radfahren"], a: 0 },
          { s: "Kannst du mich ___ ?", o: ["mitnehmen", "mit nehmen"], a: 0 },
          { s: "Wollen wir ___ ?", o: ["spazieren gehen", "spazierengehen"], a: 0 },
          { s: "Der Hund ist ___ .", o: ["weggelaufen", "weg gelaufen"], a: 0 },
          { s: "Wir treffen uns ___ in der Stadt.", o: ["irgendwo", "irgend wo"], a: 0 },
          { s: "Ich will ___ lernen.", o: ["Gitarre spielen", "gitarrespielen"], a: 0 }
        ] },
      { typ: "zuordnen", t: "Wortgruppe (getrennt) oder Zusammensetzung (zusammen)?", tipp: "Sprich laut: eine oder zwei Betonungen?",
        gruppen: ["getrennt", "zusammen"],
        karten: [["Auto fahren", 0], ["Fußball spielen", 0], ["schwimmen lernen", 0], ["laut lesen", 0],
                 ["vorlesen", 1], ["zurückgeben", 1], ["mitkommen", 1], ["Schulhof", 1]] },
      { typ: "luecke", t: "Wähle die richtige Schreibweise.", tipp: "Partikel wie zurück, vorbei, weg gehören fest zum Verb.",
        items: ["Ich muss das Buch morgen {{zurückgeben|zurück geben}}.", "Wir wollen am Wochenende {{Ski fahren|skifahren}}.",
                "Kannst du heute {{vorbeikommen|vorbei kommen}}?", "Die Kinder dürfen noch {{draußen spielen|draußenspielen}}.",
                "Er möchte {{Klavier spielen|klavierspielen}} lernen."] },
      { typ: "wahl", t: "Betonungsprobe: Eine oder zwei Betonungen?", tipp: "Sprich die Wörter halblaut vor dich hin.",
        items: [
          { s: "weglaufen", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 0 },
          { s: "Rad fahren", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 1 },
          { s: "mitbringen", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 0 },
          { s: "Fußball spielen", o: ["eine Hauptbetonung → zusammen", "zwei Betonungen → getrennt"], a: 1 }
        ] },
      { typ: "luecke", t: "Nomen + Nomen: Wähle die richtige Schreibweise.", tipp: "Zusammengesetzte Nomen schreibst du in einem Wort.",
        items: ["Ich trage einen {{Fahrradhelm|Fahrrad Helm|Fahrrad-helm}}.", "Im Garten steht ein {{Apfelbaum|Apfel Baum}}.", "Meine {{Schultasche|Schul Tasche}} ist schwer."] }
    ],
    plus: [
      { typ: "wahl", t: "Bedeutungsprobe: Welche Schreibweise passt?", tipp: "Neue, übertragene Bedeutung → zusammen. Wörtliche Bedeutung → getrennt.",
        items: [
          { s: "Der Richter wird den Angeklagten ___ . (= für unschuldig erklären)", o: ["freisprechen", "frei sprechen"], a: 0 },
          { s: "Beim Referat solltest du ___ . (= ohne abzulesen)", o: ["frei sprechen", "freisprechen"], a: 0 },
          { s: "Am Abend wollen wir ___ . (= Fernsehen schauen)", o: ["fernsehen", "fern sehen"], a: 0 },
          { s: "Der Arzt hat mich drei Tage ___ .", o: ["krankgeschrieben", "krank geschrieben"], a: 0 }
        ] },
      { typ: "luecke", t: "Gleiche Wörter, andere Bedeutung: Wähle richtig.", tipp: "„wiederholen“ = noch einmal machen · „wieder holen“ = noch einmal herbeiholen",
        items: ["Wir müssen die Vokabeln {{wiederholen|wieder holen}}.", "Der Hund bringt den Stock und will ihn gleich {{wieder holen|wiederholen}}."] }
    ]
  });
  </script>
