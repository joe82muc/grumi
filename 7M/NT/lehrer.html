<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Lehrkraft | NT 7M</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">GRUMI <span>7M / NT</span></a><span class="top-tag">Lehrkraft</span></header>
  <main class="narrow">
    <div class="eyebrow">Lehrkraft · Natur und Technik 7M</div><h1>Proben verwalten</h1>
    <p class="intro">Proben einzeln freischalten, Abgaben ansehen und freie Antworten bei Bedarf nachkorrigieren.</p>
    <form id="login" class="login-row"><label class="field">Lehrkraft-Passwort<input type="password" id="password" required autocomplete="current-password"></label><button class="btn" type="submit">Ergebnisse laden</button></form>
    <p id="teacher-status" class="notice" role="status">Das Passwort bleibt nur während dieser geöffneten Seite im Speicher.</p>
    <section id="teacher-content" hidden><div id="unlock-list"></div><div class="teacher-toolbar"><h2>Abgaben</h2><div><select id="filter-test" aria-label="Probe filtern"><option value="">Alle Proben</option></select> <button class="btn secondary" id="export" type="button">CSV herunterladen</button></div></div><div id="results"></div></section>
  </main>
  <script src="lehrer.js"></script>
</body></html>
