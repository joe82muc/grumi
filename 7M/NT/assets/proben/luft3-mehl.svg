  <style>
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
    .braun{animation:braun 10s infinite}
    @keyframes braun{0%,20%{fill:#f7f3ea}60%,95%{fill:#c9a873}100%{fill:#f7f3ea}}
    .ball{transform-box:fill-box;transform-origin:50% 50%;animation:ball 10s infinite}
    @keyframes ball{0%,26%{transform:none}30%{transform:scale(.6,.8)}34%,100%{transform:none}}
    .wolke{animation:wolke 10s infinite}
    @keyframes wolke{0%,30%{opacity:0;transform:translateY(30px)}36%{opacity:1;transform:none}44%{opacity:1}47%,100%{opacity:0}}
    .boom{transform-box:fill-box;transform-origin:50% 60%;animation:boom 10s infinite}
    @keyframes boom{0%,42%{transform:scale(.1);opacity:0}46%{transform:scale(1);opacity:1}60%{transform:scale(1.1);opacity:.9}68%,100%{transform:scale(1.1);opacity:0}}
    .deckel{transform-box:fill-box;transform-origin:50% 50%;animation:deckel 10s infinite}
    @keyframes deckel{0%,44%{transform:none}52%,92%{transform:translate(70px,-150px) rotate(40deg)}100%{transform:none}}
    .kflamme{animation:kflamme 10s infinite}
    @keyframes kflamme{0%,42%{opacity:1}44%,92%{opacity:0}100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
