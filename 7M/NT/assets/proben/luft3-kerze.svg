<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" font-family="Arial, Helvetica, sans-serif">
  <style>
    .k1{animation:k1 11s infinite}
    @keyframes k1{0%,14%{opacity:1}17%,52%{opacity:0}55%,100%{opacity:1}}
    .rauch{animation:rauch 11s infinite} @keyframes rauch{0%,15%{opacity:0}18%,50%{opacity:1}53%,100%{opacity:0}}
    .faden{stroke-dasharray:8 6;animation:faden .8s linear infinite}
    @keyframes faden{to{stroke-dashoffset:14}}
    .holz{animation:holz 11s infinite}
    @keyframes holz{0%,30%{transform:translate(160px,-20px);opacity:0}34%{opacity:1}40%,56%{transform:none;opacity:1}64%,100%{transform:translate(160px,-20px);opacity:0}}
    .spring{animation:spring 11s infinite}
    @keyframes spring{0%,44%{transform:none;opacity:0}45%{transform:none;opacity:1}52%{transform:translate(-8px,56px);opacity:1}54%,100%{transform:translate(-8px,56px);opacity:0}}
    .t1{animation:t1 11s infinite} @keyframes t1{0%,12%{opacity:0}15%,30%{opacity:1}33%,100%{opacity:0}}
    .t2{animation:t2 11s infinite} @keyframes t2{0%,31%{opacity:0}34%,52%{opacity:1}55%,100%{opacity:0}}
    .t3{animation:t3 11s infinite} @keyframes t3{0%,55%{opacity:0}58%,95%{opacity:1}98%,100%{opacity:0}}
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="316" fill="#f6f9fb"/>

  <rect y="282" width="640" height="34" fill="#d9c3a0"/>
  <rect x="290" y="178" width="60" height="104" rx="4" fill="#f4f1e8" stroke="#b5ab95" stroke-width="2"/>
  <path d="M290 182 Q320 192 350 182" fill="none" stroke="#d8cfba" stroke-width="2"/>
  <line x1="320" y1="178" x2="320" y2="164" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
  <g class="k1"><path class="flamme" d="M320 116 Q337.28 142.4 330.56 164 H309.44 Q302.72 142.4 320 116 Z" fill="#f39c12"/><path class="flamme" d="M320 135.2 Q327.68 150.56 324.8 164 H315.2 Q312.32 150.56 320 135.2 Z" fill="#f6c343"/></g>
  <g class="rauch"><path class="faden" d="M320 164 Q312 146 322 130 Q332 112 320 94 Q308 76 318 56" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M320 164 Q312 146 322 130 Q332 112 320 94 Q308 76 318 56" fill="none" stroke="#c9d3db" stroke-width="1.5" opacity=".7"/></g>
  <g class="holz"><line x1="336" y1="104" x2="470" y2="64" stroke="#d9a066" stroke-width="7" stroke-linecap="round"/><circle cx="336" cy="104" r="7" fill="#7b241c"/>
    <path class="flamme" d="M334 72 Q344.8 88.5 340.6 102 H327.4 Q323.2 88.5 334 72 Z" fill="#f39c12"/><path class="flamme" d="M334 84 Q338.8 93.6 337 102 H331 Q329.2 93.6 334 84 Z" fill="#f6c343"/></g>
  <g class="spring"><path class="flamme" d="M326 96 Q335.36 110.3 331.72 122 H320.28 Q316.64 110.3 326 96 Z" fill="#f39c12"/><path class="flamme" d="M326 106.4 Q330.16 114.72 328.6 122 H323.4 Q321.84 114.72 326 106.4 Z" fill="#f6c343"/></g>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#0a5a66" class="t1">ausblasen …</text>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#0a5a66" class="t2">brennendes Streichholz in den weißen Faden halten …</text>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#0a5a66" class="t3">Die Kerze brennt wieder.</text>
</svg>
