<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animation zum Gasaustausch: Runde Teilchen wandern aus der Luft im Lungenbläschen ins Blut, eckige Teilchen aus dem Blut in die Luft, dreieckige Teilchen bleiben in der Luft">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <!-- Lungenbläschen mit Luft -->
  <path d="M24 196C24 110 74 60 150 60H300V332H150C74 332 24 282 24 196Z" fill="#e8f5fb" stroke="#a9d3e8" stroke-width="3"/>
  <!-- Kapillare mit Blut -->
  <rect x="320" y="0" width="150" height="360" fill="#b0566e"/>
  <path d="M320 0V360M470 0V360" stroke="#d98a96" stroke-width="3"/>
  <!-- hauchdünne Wand -->
  <rect x="300" y="60" width="20" height="272" fill="#f0b7bf" stroke="#d98a96" stroke-width="2"/>
  <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M440 116l9 9 9-9"/><path d="M440 206l9 9 9-9"/><path d="M440 296l9 9 9-9"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="800">
    <text x="150" y="88" text-anchor="middle" font-size="18" fill="#0d5b86">Lungenbläschen (Luft)</text>
    <text x="150" y="36" text-anchor="middle" font-size="17" fill="#8f2a3c">hauchdünne Wand</text>
    <text x="482" y="26" font-size="16" font-weight="700" fill="#8f2a3c">Blut aus dem Körper</text>
    <text x="482" y="348" font-size="16" font-weight="700" fill="#8f2a3c">Blut zum Herzen</text>
  </g>
  <path d="M232 40L302 64" stroke="#8f2a3c" stroke-width="1.8"/>
  <!-- Teilchen 3: bleiben in der Luft -->
  <g fill="#2e9b5b" stroke="#fff" stroke-width="2" stroke-linejoin="round">
    <g transform="translate(86 160)"><path d="M0-10L10 8H-10Z"><animateTransform attributeName="transform" type="translate" values="0 0;9 -7;-5 6;0 0" dur="5s" repeatCount="indefinite"/></path></g>
    <g transform="translate(236 124)"><path d="M0-10L10 8H-10Z"><animateTransform attributeName="transform" type="translate" values="0 0;-8 6;6 8;0 0" dur="6s" repeatCount="indefinite"/></path></g>
    <g transform="translate(96 262)"><path d="M0-10L10 8H-10Z"><animateTransform attributeName="transform" type="translate" values="0 0;8 6;-6 -6;0 0" dur="5.5s" repeatCount="indefinite"/></path></g>
    <g transform="translate(250 300)"><path d="M0-10L10 8H-10Z"><animateTransform attributeName="transform" type="translate" values="0 0;-9 -5;5 -8;0 0" dur="6.5s" repeatCount="indefinite"/></path></g>
    <g transform="translate(176 214)"><path d="M0-10L10 8H-10Z"><animateTransform attributeName="transform" type="translate" values="0 0;7 8;-8 3;0 0" dur="4.8s" repeatCount="indefinite"/></path></g>
  </g>
  <!-- Teilchen 1: aus der Luft ins Blut -->
  <g fill="#f29a1e" stroke="#fff" stroke-width="2">
    <circle r="9" cx="0" cy="0"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M130 136H290C330 136 366 148 380 186V380"/><animate attributeName="opacity" dur="9s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/></circle>
    <circle r="9" cx="0" cy="0"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M180 250H290C326 250 346 262 352 296V380"/><animate attributeName="opacity" dur="9s" begin="-3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/></circle>
    <circle r="9" cx="0" cy="0"><animateMotion dur="9s" begin="-6s" repeatCount="indefinite" path="M90 200H290C336 200 396 214 410 252V380"/><animate attributeName="opacity" dur="9s" begin="-6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/></circle>
  </g>
  <!-- Teilchen 2: aus dem Blut in die Luft -->
  <g fill="#34414e" stroke="#fff" stroke-width="2">
    <rect x="-8" y="-8" width="16" height="16"><animateMotion dur="9s" begin="-1.5s" repeatCount="indefinite" path="M400 -14V128C400 160 344 170 300 170H110"/><animate attributeName="opacity" dur="9s" begin="-1.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/></rect>
    <rect x="-8" y="-8" width="16" height="16"><animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M356 -14V230C356 262 334 276 300 276H150"/><animate attributeName="opacity" dur="9s" begin="-4.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/></rect>
    <rect x="-8" y="-8" width="16" height="16"><animateMotion dur="9s" begin="-7.5s" repeatCount="indefinite" path="M428 -14V74C428 104 344 110 300 110H190"/><animate attributeName="opacity" dur="9s" begin="-7.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/></rect>
  </g>
  <!-- Beschriftung der Kapillare: liegt über den Teilchen -->
  <text font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="800" font-size="18" fill="#fff" stroke="#6a1f30" stroke-width="3.500" stroke-linejoin="round" paint-order="stroke" text-anchor="middle"><tspan x="395" y="40">Kapillare</tspan><tspan x="395" y="62">(Blut)</tspan></text>
  <!-- Legende -->
  <rect x="482" y="120" width="150" height="124" rx="10" fill="#fff" stroke="#d8e2ea" stroke-width="2"/>
  <circle cx="504" cy="148" r="9" fill="#f29a1e"/>
  <rect x="496" y="174" width="16" height="16" fill="#34414e"/>
  <path d="M504 206L514 224H494Z" fill="#2e9b5b"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15212b">
    <text x="524" y="154">Teilchen 1</text><text x="524" y="188">Teilchen 2</text><text x="524" y="222">Teilchen 3</text>
  </g>
</svg>
