<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Säulendiagramm: Brenndauer einer Kerze unter Gläsern mit 250 ml, 500 ml und 1000 ml">
  <rect width="520" height="340" fill="#fff"/>
  <text x="260" y="26" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b">Wie lange brennt die Kerze unter dem Glas?</text>
  <g stroke="#d8e2ea" stroke-width="1">
    <line x1="80" y1="250" x2="490" y2="250"/><line x1="80" y1="190" x2="490" y2="190"/><line x1="80" y1="130" x2="490" y2="130"/><line x1="80" y1="70" x2="490" y2="70"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#566674" text-anchor="end">
    <text x="72" y="254">0</text><text x="72" y="194">10</text><text x="72" y="134">20</text><text x="72" y="74">30</text>
  </g>
  <line x1="80" y1="50" x2="80" y2="250" stroke="#15212b" stroke-width="2"/>
  <line x1="80" y1="250" x2="490" y2="250" stroke="#15212b" stroke-width="2"/>
  <text transform="translate(28 150) rotate(-90)" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15212b">Brenndauer in Sekunden</text>
  <g fill="#f2992e">
    <rect x="130" y="202" width="70" height="48"/><rect x="250" y="160" width="70" height="90"/><rect x="370" y="64" width="70" height="186"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="165" y="196">8 s</text><text x="285" y="154">15 s</text><text x="405" y="58">31 s</text>
    <text x="165" y="272">250 ml</text><text x="285" y="272">500 ml</text><text x="405" y="272">1000 ml</text>
  </g>
  <text x="285" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15212b">Größe des Glases</text>
  <text x="285" y="326" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="11" fill="#566674">Beispielwerte aus einem Versuch mit immer derselben Kerze</text>
</svg>
