<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Säulendiagramm: Was wird aus 100 Teilen elektrischer Energie? Lampe 1: 5 Teile Licht, 95 Teile Wärme. Lampe 2: 35 Teile Licht, 65 Teile Wärme">
  <rect width="640" height="360" fill="#fff"/>
  <text x="330" y="26" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#15212b">Was wird aus 100 Teilen elektrischer Energie?</text>
  <g stroke="#d8e2ea" stroke-width="1">
    <line x1="90" y1="252" x2="520" y2="252"/><line x1="90" y1="208" x2="520" y2="208"/><line x1="90" y1="164" x2="520" y2="164"/><line x1="90" y1="120" x2="520" y2="120"/><line x1="90" y1="76" x2="520" y2="76"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#566674" text-anchor="end">
    <text x="82" y="301">0</text><text x="82" y="257">20</text><text x="82" y="213">40</text><text x="82" y="169">60</text><text x="82" y="125">80</text><text x="82" y="81">100</text>
  </g>
  <line x1="90" y1="60" x2="90" y2="296" stroke="#15212b" stroke-width="2"/>
  <line x1="90" y1="296" x2="524" y2="296" stroke="#15212b" stroke-width="2"/>
  <text transform="translate(30 180) rotate(-90)" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#15212b">Teile von 100</text>
  <!-- Lampe 1: 5 Licht, 95 Wärme -->
  <rect x="140" y="285" width="60" height="11" fill="#f2b632" stroke="#b77a06" stroke-width="1.5"/>
  <rect x="206" y="87" width="60" height="209" fill="#e0453a"/>
  <!-- Lampe 2: 35 Licht, 65 Wärme -->
  <rect x="350" y="219" width="60" height="77" fill="#f2b632" stroke="#b77a06" stroke-width="1.5"/>
  <rect x="416" y="153" width="60" height="143" fill="#e0453a"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700" fill="#15212b" text-anchor="middle">
    <g font-size="17"><text x="170" y="278">5</text><text x="236" y="80">95</text><text x="380" y="212">35</text><text x="446" y="146">65</text></g>
    <g font-size="19" font-weight="800"><text x="203" y="326">Lampe 1</text><text x="413" y="326">Lampe 2</text></g>
  </g>
  <!-- Legende -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15212b">
    <rect x="540" y="120" width="20" height="20" fill="#f2b632" stroke="#b77a06" stroke-width="1.5"/><text x="568" y="136">Licht</text>
    <rect x="540" y="156" width="20" height="20" fill="#e0453a"/><text x="568" y="172">Wärme</text>
  </g>
</svg>
