<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <style>
    .hoch{animation:hoch 12s infinite}
    @keyframes hoch{0%,12%{transform:none}46%,56%{transform:translateY(-50px)}92%,100%{transform:none}}
    .feuer{animation:feuer 12s infinite} @keyframes feuer{0%,5%{opacity:0}8%,55%{opacity:1}58%,100%{opacity:0}}
    .warm{animation:warm 12s infinite} @keyframes warm{0%,15%{opacity:0}18%,58%{opacity:1}61%,100%{opacity:0}}
    .kalt{animation:kalt 12s infinite}
    @keyframes kalt{0%,14%{opacity:1}20%,60%{opacity:0}68%,100%{opacity:1}}
    .zit{animation:zit .35s ease-in-out infinite alternate}
    @keyframes zit{from{transform:translate(-3px,2px)}to{transform:translate(3px,-2px)}}
    .t1{animation:t1 12s infinite} @keyframes t1{0%,5%{opacity:0}8%,55%{opacity:1}58%,100%{opacity:0}}
    .t2{animation:t2 12s infinite} @keyframes t2{0%,57%{opacity:0}60%,95%{opacity:1}98%,100%{opacity:0}}
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="320" fill="#eaf5fb"/>

