<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animation zum Blutkreislauf: Ein rotes Blutkörperchen wandert vom Herzen durch Gefäß A zur Lunge, durch Gefäß B zurück zum Herzen, durch Gefäß C in den Körper und durch Gefäß D zurück zum Herzen">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <!-- Lunge -->
  <rect x="300" y="14" width="170" height="58" rx="16" fill="#eaf4fb" stroke="#9ec3dc" stroke-width="2"/>
  <path d="M316 52q11.5-16 23 0t23 0t23 0t23 0t23 0t23 0" fill="none" stroke="#7d8791" stroke-width="5" stroke-linecap="round"/>
  <!-- Körper -->
  <rect x="190" y="292" width="260" height="58" rx="16" fill="#fdf0e8" stroke="#e1b79f" stroke-width="2"/>
  <path d="M434 336q-9.5-14-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0" fill="none" stroke="#7d8791" stroke-width="5" stroke-linecap="round"/>
  <!-- Gefäße B, C und D -->
  <g fill="none" stroke="#7d8791" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 43H520V149H388"/>
    <path d="M388 215H480V321H450"/>
    <path d="M190 321H140V149H252"/>
  </g>
  <!-- Herz mit vier Räumen -->
  <rect x="242" y="116" width="156" height="140" rx="24" fill="#e9b4b9" stroke="#c4616a" stroke-width="3"/>
  <g fill="#b0566e" stroke="#fff" stroke-width="2">
    <rect x="250" y="124" width="52" height="50" rx="10"/><rect x="334" y="124" width="56" height="50" rx="10"/>
    <rect x="250" y="184" width="76" height="62" rx="12"/><rect x="334" y="184" width="56" height="62" rx="12"/>
  </g>
  <!-- Gefäß A: aus der unteren Kammer nach oben zur Lunge -->
  <path d="M315 192V72" fill="none" stroke="#7d8791" stroke-width="11" stroke-linecap="round"/>
  <g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 100l5-7 5 7"/><path d="M515 92l5 7 5-7"/><path d="M475 264l5 7 5-7"/><path d="M135 240l5-7 5 7"/>
    <path d="M440 144l-7 5 7 5"/><path d="M196 144l7 5-7 5"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <g font-size="17" font-weight="800" fill="#15212b" text-anchor="middle"><text x="385" y="36">Lunge</text><text x="320" y="316">Körper (alle Organe)</text></g>
    <g font-size="15" font-weight="700" fill="#566674">
      <text text-anchor="end"><tspan x="232" y="196">rechte</tspan><tspan x="232" y="214">Herzhälfte</tspan></text>
      <text><tspan x="408" y="178">linke</tspan><tspan x="408" y="196">Herzhälfte</tspan></text>
    </g>
    <g font-size="16" font-weight="700" fill="#15212b"><ellipse cx="24" cy="26" rx="10" ry="8" fill="#c9302c" stroke="#15212b" stroke-width="2.5"/><text x="42" y="32">= rotes Blutkörperchen</text></g>  </g>
  <!-- Buchstaben -->
  <g fill="#15212b"><circle cx="284" cy="94" r="15"/><circle cx="550" cy="96" r="15"/><circle cx="510" cy="268" r="15"/><circle cx="110" cy="236" r="15"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">
    <text x="284" y="101">A</text><text x="550" y="103">B</text><text x="510" y="275">C</text><text x="110" y="243">D</text>
  </g>
  <!-- wanderndes Blutkörperchen -->
  <g>
    <ellipse rx="10" ry="8" fill="#c9302c" stroke="#15212b" stroke-width="2.5"/>
    <animateMotion dur="20s" repeatCount="indefinite" path="M276 149L288 222L315 200V72L316 52q11.5-16 23 0t23 0t23 0t23 0t23 0t23 0L470 43H520V149H390L362 149L362 215L390 215H480V321H450L434 336q-9.5-14-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0t-19 0L190 321H140V149H250Z"/>
  </g>
</svg>
