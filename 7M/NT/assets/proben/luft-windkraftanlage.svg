<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Schnitt durch eine Windkraftanlage. Vier Bauteile tragen die Buchstaben A, B, C und D.">
  <defs>
    <linearGradient id="wkHimmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd6f7"/><stop offset="1" stop-color="#eef8fe"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#wkHimmel)"/>
  <rect y="356" width="640" height="44" fill="#9ccc65"/>

  <!-- Wind -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="24 20" fill="none">
    <path d="M-10 196H66"><animate attributeName="stroke-dashoffset" values="44;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M-10 226H58"><animate attributeName="stroke-dashoffset" values="44;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M-10 256H66"><animate attributeName="stroke-dashoffset" values="44;0" dur="1.4s" repeatCount="indefinite"/></path>
  </g>
  <text x="10" y="182" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f5d7c">Wind</text>

  <!-- Turm -->
  <path d="M236 356L246 170H286L296 356Z" fill="#eef2f5" stroke="#b8c4cd" stroke-width="2"/>

  <!-- Maschinenhaus (aufgeschnitten) -->
  <rect x="128" y="96" width="290" height="76" rx="26" fill="#f7f9fb" stroke="#8fa1ae" stroke-width="3"/>

  <!-- Kabel vom Maschinenhaus zum Transformator -->
  <path d="M357 162V167H266V344H452" fill="none" stroke="#c9d3db" stroke-width="5"/>
  <path d="M357 162V167H266V344H452" fill="none" stroke="#f2b632" stroke-width="5" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite"/>
  </path>


  <!-- langsame Welle -->
  <rect x="104" y="128" width="88" height="12" fill="#9aa5ad"/>

  <!-- Bauteil D: Kasten mit Zahnrädern -->
  <rect x="190" y="108" width="70" height="52" rx="6" fill="#dff1e1" stroke="#43a047" stroke-width="2.5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 214 134" to="360 214 134" dur="6s" repeatCount="indefinite"/>
    <circle cx="214" cy="134" r="17" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round">
      <line x1="214" y1="113" x2="214" y2="155"/><line x1="193" y1="134" x2="235" y2="134"/>
      <line x1="199" y1="119" x2="229" y2="149"/><line x1="199" y1="149" x2="229" y2="119"/>
    </g>
    <circle cx="214" cy="134" r="5" fill="#2e7d32"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 243 134" to="0 243 134" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="243" cy="134" r="9" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="3" stroke-linecap="round">
      <line x1="243" y1="122" x2="243" y2="146"/><line x1="231" y1="134" x2="255" y2="134"/>
    </g>
  </g>

  <!-- schnelle Welle -->
  <rect x="260" y="130" width="60" height="8" fill="#9aa5ad"/>

  <!-- Bauteil C: Scheibe mit roten Klötzen -->
  <rect x="284" y="112" width="10" height="44" rx="2" fill="#c7ccd1" stroke="#7d868d" stroke-width="1.5"/>
  <rect x="277" y="105" width="24" height="10" rx="2" fill="#e0453a"/>
  <rect x="277" y="153" width="24" height="10" rx="2" fill="#e0453a"/>

  <!-- Bauteil A: Kasten mit Drahtspulen und Magnet -->
  <rect x="318" y="106" width="78" height="56" rx="8" fill="#e3edfb" stroke="#2f6fdb" stroke-width="2.5"/>
  <g fill="none" stroke="#f2992e" stroke-width="3">
    <path d="M328 116h58M328 121h58"/><path d="M328 147h58M328 152h58"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 357 134" to="360 357 134" dur="1.5s" repeatCount="indefinite"/>
    <rect x="341" y="129" width="16" height="10" fill="#e0453a"/><rect x="357" y="129" width="16" height="10" fill="#2f6fdb"/>
  </g>

  <!-- Windmessung -->
  <line x1="402" y1="96" x2="402" y2="74" stroke="#7d868d" stroke-width="2.5"/>
  <g>
    <line x1="392" y1="72" x2="412" y2="72" stroke="#7d868d" stroke-width="2"/>
    <circle cx="392" cy="72" r="4" fill="#7d868d"><animate attributeName="cx" values="392;412;392" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="412" cy="72" r="4" fill="#7d868d"><animate attributeName="cx" values="412;392;412" dur="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Rotor von der Seite: drei Blätter, die sich drehen -->
  <g transform="translate(100 134)" fill="#fbfdff" stroke="#8fa1ae" stroke-width="2" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 0.5;1 -0.5;1 -1;1 -0.5;1 0.5;1 1" dur="6s" repeatCount="indefinite"/>
      <path d="M-7 -10L-9 -116Q-3 -126 3 -116L7 -10Z"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 0.5;1 -0.5;1 -1;1 -0.5;1 0.5;1 1" dur="6s" begin="-2s" repeatCount="indefinite"/>
      <path d="M-7 -10L-9 -116Q-3 -126 3 -116L7 -10Z"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 0.5;1 -0.5;1 -1;1 -0.5;1 0.5;1 1" dur="6s" begin="-4s" repeatCount="indefinite"/>
      <path d="M-7 -10L-9 -116Q-3 -126 3 -116L7 -10Z"/>
    </g>
  </g>
  <ellipse cx="100" cy="134" rx="15" ry="20" fill="#dfe6eb" stroke="#8fa1ae" stroke-width="2.5"/>

  <!-- Transformator und Stromnetz -->
  <rect x="452" y="306" width="54" height="50" rx="4" fill="#dfe6eb" stroke="#8fa1ae" stroke-width="2"/>
  <path d="M482 314L472 332H484L474 350" fill="none" stroke="#f2b632" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g stroke="#566674" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="586" y1="356" x2="586" y2="262"/><line x1="566" y1="274" x2="606" y2="274"/><line x1="572" y1="290" x2="600" y2="290"/>
    <path d="M506 322Q542 306 566 274" stroke-width="2"/><path d="M606 274Q624 284 644 278" stroke-width="2"/>
  </g>

  <!-- feste Beschriftungen -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#15212b">
    <text x="124" y="204">Nabe</text>
    <text x="304" y="290">Turm</text>
    <text x="479" y="298" text-anchor="middle">Transformator</text>
    <text x="586" y="252" text-anchor="middle">Stromnetz</text>
    <text x="424" y="70">Windmessung</text>
  </g>
  <line x1="128" y1="192" x2="108" y2="150" stroke="#566674" stroke-width="1.5"/>

  <!-- Buchstaben -->
  <g stroke="#15212b" stroke-width="2">
    <line x1="52" y1="58" x2="97" y2="88"/>
    <line x1="225" y1="66" x2="225" y2="108"/>
    <line x1="289" y1="66" x2="289" y2="105"/>
    <line x1="357" y1="66" x2="357" y2="106"/>
  </g>
  <g fill="#0d77c2" stroke="#ffffff" stroke-width="2">
    <circle cx="40" cy="48" r="17"/><circle cx="225" cy="48" r="17"/><circle cx="289" cy="48" r="17"/><circle cx="357" cy="48" r="17"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="40" y="55">B</text><text x="225" y="55">D</text><text x="289" y="55">C</text><text x="357" y="55">A</text>
  </g>
</svg>
