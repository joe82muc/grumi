<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animation: Eine Bleistiftmine ist mit zwei Klemmen in einen Stromkreis mit Batterie und Lampe eingebaut. Eine Klemme wird verschoben. Je länger das Stück Mine zwischen den Klemmen ist, desto schwächer leuchtet die Lampe">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <!-- feste Leitungen -->
  <g fill="none" stroke="#33414d" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 250V180H150V106"/>
    <path d="M330 196V284H468"/>
    <path d="M512 284H600V332H210V272H180"/>
  </g>
  <!-- bewegliche Leitung von der zweiten Klemme -->
  <line x1="250" y1="106" x2="330" y2="196" stroke="#33414d" stroke-width="3.500" stroke-linecap="round">
    <animate attributeName="x1" values="250;540;540;250;250" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <circle cx="330" cy="196" r="6" fill="#33414d"/>
  <!-- Bleistiftmine -->
  <rect x="130" y="88" width="440" height="12" rx="3" fill="#5a6470"/>
  <rect x="150" y="88" width="100" height="12" fill="#e0453a">
    <animate attributeName="width" values="100;390;390;100;100" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- Klemmen -->
  <rect x="142" y="80" width="16" height="30" rx="3" fill="#15212b"/>
  <rect x="242" y="80" width="16" height="30" rx="3" fill="#15212b">
    <animate attributeName="x" values="242;532;532;242;242" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- Batterie -->
  <rect x="104" y="240" width="12" height="14" rx="2" fill="#8a97a3"/>
  <rect x="80" y="250" width="100" height="44" rx="8" fill="#2b3a4a"/>
  <rect x="178" y="264" width="10" height="16" rx="2" fill="#8a97a3"/>
  <!-- Lampe -->
  <circle cx="490" cy="232" r="52" fill="#ffd84d" opacity=".85">
    <animate attributeName="opacity" values=".85;.1;.1;.85;.85" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="468" y="268" width="44" height="30" rx="5" fill="#8a97a3"/><rect x="480" y="258" width="20" height="12" fill="#b9c2ca"/>
  <circle cx="490" cy="236" r="26" fill="#fff8d6" stroke="#b9a25a" stroke-width="2.500"/>
  <circle cx="490" cy="236" r="24.500" fill="#ffd23a" opacity=".95">
    <animate attributeName="opacity" values=".95;.08;.08;.95;.95" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <path d="M477 244q6.500-16 13 0t13 0" fill="none" stroke="#8a5a2b" stroke-width="2.500"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">
    <text x="350" y="68" text-anchor="middle" fill="#15212b">Bleistiftmine aus Graphit</text>
    <text x="130" y="278" text-anchor="middle" fill="#fff">Batterie</text>
    <text x="490" y="322" text-anchor="middle" fill="#566674">Lampe</text>
    <rect x="24" y="18" width="24" height="11" fill="#e0453a"/><text x="56" y="30" fill="#15212b" font-size="16">Hier fließt der Strom durch die Mine.</text>
  </g>
</svg>
