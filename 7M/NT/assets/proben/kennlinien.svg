<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Diagramm: Stromstärke in Abhängigkeit von der Spannung für zwei Drähte A und B">
  <rect width="520" height="360" fill="#fff"/>
  <text x="270" y="24" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b">Spannung und Stromstärke bei zwei Drähten</text>
  <g stroke="#d8e2ea" stroke-width="1">
    <line x1="140" y1="40" x2="140" y2="300"/><line x1="200" y1="40" x2="200" y2="300"/><line x1="260" y1="40" x2="260" y2="300"/><line x1="320" y1="40" x2="320" y2="300"/><line x1="380" y1="40" x2="380" y2="300"/><line x1="440" y1="40" x2="440" y2="300"/>
    <line x1="80" y1="260" x2="470" y2="260"/><line x1="80" y1="220" x2="470" y2="220"/><line x1="80" y1="180" x2="470" y2="180"/><line x1="80" y1="140" x2="470" y2="140"/><line x1="80" y1="100" x2="470" y2="100"/><line x1="80" y1="60" x2="470" y2="60"/>
  </g>
  <line x1="80" y1="36" x2="80" y2="300" stroke="#15212b" stroke-width="2"/>
  <line x1="80" y1="300" x2="474" y2="300" stroke="#15212b" stroke-width="2"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#566674" text-anchor="middle">
    <text x="80" y="318">0</text><text x="140" y="318">1</text><text x="200" y="318">2</text><text x="260" y="318">3</text><text x="320" y="318">4</text><text x="380" y="318">5</text><text x="440" y="318">6</text>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#566674" text-anchor="end">
    <text x="72" y="264">0,2</text><text x="72" y="224">0,4</text><text x="72" y="184">0,6</text><text x="72" y="144">0,8</text><text x="72" y="104">1,0</text><text x="72" y="64">1,2</text>
  </g>
  <text x="275" y="344" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15212b">Spannung U in Volt</text>
  <text transform="translate(26 170) rotate(-90)" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15212b">Stromstärke I in Ampere</text>
  <line x1="80" y1="300" x2="440" y2="60" stroke="#0d77c2" stroke-width="3"/>
  <g fill="#0d77c2"><circle cx="200" cy="220" r="5"/><circle cx="320" cy="140" r="5"/><circle cx="440" cy="60" r="5"/></g>
  <text x="452" y="56" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0d77c2">Draht A</text>
  <line x1="80" y1="300" x2="440" y2="240" stroke="#e0453a" stroke-width="3"/>
  <g fill="#e0453a"><circle cx="200" cy="280" r="5"/><circle cx="320" cy="260" r="5"/><circle cx="440" cy="240" r="5"/></g>
  <text x="452" y="236" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#e0453a">Draht B</text>
</svg>
