<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="Zwei Atomkerne aus Kugeln. Kern 1: drei rote Kugeln mit Pluszeichen und drei graue Kugeln. Kern 2: drei rote Kugeln mit Pluszeichen und vier graue Kugeln. Legende: rot mit Plus ist ein Proton, grau ist ein Neutron." font-family="system-ui,Segoe UI,Arial,sans-serif">
<rect width="640" height="310" fill="#fff"/>
<rect x="8" y="8" width="304" height="238" rx="12" fill="#f7fbfe" stroke="#d8e2ea" stroke-width="2"/>
<rect x="328" y="8" width="304" height="238" rx="12" fill="#f7fbfe" stroke="#d8e2ea" stroke-width="2"/>
<circle cx="160" cy="66" r="24" fill="#e0453a" stroke="#a52a22" stroke-width="2"/><text x="160" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">+</text><circle cx="136" cy="108" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/><circle cx="184" cy="108" r="24" fill="#e0453a" stroke="#a52a22" stroke-width="2"/><text x="184" y="118" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">+</text><circle cx="112" cy="150" r="24" fill="#e0453a" stroke="#a52a22" stroke-width="2"/><text x="112" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">+</text><circle cx="160" cy="150" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/><circle cx="208" cy="150" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/>
<circle cx="480" cy="60" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/><circle cx="521.6" cy="84" r="24" fill="#e0453a" stroke="#a52a22" stroke-width="2"/><text x="521.6" y="94" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">+</text><circle cx="521.6" cy="132" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/><circle cx="480" cy="156" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/><circle cx="438.4" cy="132" r="24" fill="#e0453a" stroke="#a52a22" stroke-width="2"/><text x="438.4" y="142" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">+</text><circle cx="438.4" cy="84" r="24" fill="#aab5be" stroke="#6d7a85" stroke-width="2"/><circle cx="480" cy="108" r="24" fill="#e0453a" stroke="#a52a22" stroke-width="2"/><text x="480" y="118" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">+</text>
<g font-size="19" font-weight="700" fill="#15212b" text-anchor="middle"><text x="160" y="232">Kern von Atom 1</text><text x="480" y="232">Kern von Atom 2</text></g>
<g font-size="17" fill="#15212b"><circle cx="196" cy="280" r="13" fill="#e0453a" stroke="#a52a22" stroke-width="1.5"/><text x="196" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">+</text><text x="216" y="286">Proton</text><circle cx="356" cy="280" r="13" fill="#aab5be" stroke="#6d7a85" stroke-width="1.5"/><text x="376" y="286">Neutron</text></g>
</svg>
