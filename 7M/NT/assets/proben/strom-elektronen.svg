<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animation: Stromkreis aus Batterie mit den Anschlüssen X und Y, Schalter und Lampe. Blaue Punkte wandern vom Anschluss X durch Schalter und Lampe zum Anschluss Y">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <!-- Kabel: außen Kupfer, innen hell -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 280H80V70H560V280H390" stroke="#b87333" stroke-width="15"/>
    <path d="M250 280H80V70H560V280H390" stroke="#f6e3c5" stroke-width="10"/>
    <!-- Elektronen -->
    <path d="M250 280H80V70H560V280H390" stroke="#2f6fdb" stroke-width="8" stroke-dasharray="0.1 47.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Schalter (geschlossen) -->
  <rect x="150" y="78" width="12" height="12" fill="#8a97a3"/><rect x="218" y="78" width="12" height="12" fill="#8a97a3"/>
  <rect x="176" y="50" width="28" height="13" rx="4" fill="#c0392b"/>
  <!-- Lampe -->
  <circle cx="420" cy="34" r="46" fill="#ffd84d" opacity=".5">
    <animate attributeName="opacity" values=".35;.6;.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect x="400" y="58" width="40" height="24" rx="5" fill="#8a97a3"/><rect x="411" y="49" width="18" height="11" fill="#b9c2ca"/>
  <circle cx="420" cy="32" r="21" fill="#fff3a8" stroke="#b9a25a" stroke-width="2"/>
  <path d="M409 39q5.5-14 11 0t11 0" fill="none" stroke="#c0692b" stroke-width="2.5"/>
  <!-- Batterie -->
  <rect x="238" y="271" width="14" height="18" rx="2" fill="#8a97a3"/><rect x="388" y="271" width="14" height="18" rx="2" fill="#8a97a3"/>
  <rect x="250" y="256" width="140" height="48" rx="9" fill="#2b3a4a"/>
  <!-- Richtung der Elektronen -->
  <g fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 200V156M102 167l8-11 8 11"/><path d="M286 98H330M319 90l11 8-11 8"/><path d="M530 156V200M522 189l8 11 8-11"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <text x="320" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Batterie</text>
    <g font-size="17" font-weight="700" fill="#566674" text-anchor="middle"><text x="190" y="112">Schalter</text><text x="420" y="112">Lampe</text></g>
    <circle cx="196" cy="178" r="5" fill="#2f6fdb"/><text x="210" y="184" font-size="17" font-weight="700" fill="#15212b">= Elektron (stark vergrößert)</text>
    <g fill="#fff" stroke="#15212b" stroke-width="2.5"><circle cx="226" cy="240" r="16"/><circle cx="414" cy="240" r="16"/></g>
    <g font-size="20" font-weight="800" fill="#15212b" text-anchor="middle"><text x="226" y="247">X</text><text x="414" y="247">Y</text></g>
  </g>
</svg>
