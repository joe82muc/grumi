<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Feuerdreieck mit einer Flamme in der Mitte. An den drei Seiten stehen die Buchstaben A, B und C.">
  <defs>
    <linearGradient id="fdFlamme" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f2762e"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="#f7fbfe"/>
  <!-- drei Seiten -->
  <g stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="320" y1="46" x2="140" y2="340" stroke="#e0453a"/>
    <line x1="320" y1="46" x2="500" y2="340" stroke="#2f6fdb"/>
    <line x1="140" y1="340" x2="500" y2="340" stroke="#43a047"/>
  </g>
  <!-- Flamme -->
  <g transform="translate(320 308)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.05 0.93;0.96 1.06;1.03 0.97;1 1" dur="1.1s" repeatCount="indefinite"/>
      <path d="M0 0C-52 -16 -52 -74 -18 -112C-16 -92 -6 -86 0 -150C8 -100 34 -96 36 -58C40 -24 26 -6 0 0Z" fill="url(#fdFlamme)"/>
      <path d="M0 -4C-24 -12 -24 -44 -6 -66C-4 -52 6 -52 8 -80C18 -52 22 -18 0 -4Z" fill="#fff3b0" opacity=".85"/>
    </g>
  </g>
  <!-- Buchstaben -->
  <g fill="#ffffff" stroke="#15212b" stroke-width="2.5">
    <circle cx="200" cy="193" r="24"/><circle cx="440" cy="193" r="24"/><circle cx="320" cy="340" r="24"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" fill="#15212b" text-anchor="middle">
    <text x="200" y="203">A</text><text x="440" y="203">B</text><text x="320" y="350">C</text>
  </g>
  <text x="320" y="390" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#566674">Nur wenn alle drei Seiten da sind, brennt das Feuer.</text>
</svg>
