<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Diagramm: Stromstärke in Abhängigkeit von der Spannung bei einem Draht. Die Messpunkte liegen auf einer Geraden durch den Nullpunkt">
  <rect width="640" height="360" fill="#fff"/>
  <text x="330" y="26" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#15212b">Messreihe an einem Draht</text>
  <g stroke="#d8e2ea" stroke-width="1.2">
    <line x1="170" y1="50" x2="170" y2="296"/><line x1="250" y1="50" x2="250" y2="296"/><line x1="330" y1="50" x2="330" y2="296"/><line x1="410" y1="50" x2="410" y2="296"/><line x1="490" y1="50" x2="490" y2="296"/><line x1="570" y1="50" x2="570" y2="296"/>
    <line x1="90" y1="236" x2="590" y2="236"/><line x1="90" y1="176" x2="590" y2="176"/><line x1="90" y1="116" x2="590" y2="116"/><line x1="90" y1="56" x2="590" y2="56"/>
  </g>
  <line x1="90" y1="44" x2="90" y2="296" stroke="#15212b" stroke-width="2"/>
  <line x1="90" y1="296" x2="596" y2="296" stroke="#15212b" stroke-width="2"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#566674" text-anchor="middle">
    <text x="90" y="315">0</text><text x="170" y="315">1</text><text x="250" y="315">2</text><text x="330" y="315">3</text><text x="410" y="315">4</text><text x="490" y="315">5</text><text x="570" y="315">6</text>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#566674" text-anchor="end">
    <text x="82" y="241">0,1</text><text x="82" y="181">0,2</text><text x="82" y="121">0,3</text><text x="82" y="61">0,4</text>
  </g>
  <text x="340" y="346" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b">Spannung U in Volt</text>
  <text transform="translate(28 172) rotate(-90)" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b">Stromstärke I in Ampere</text>
  <line x1="90" y1="296" x2="570" y2="116" stroke="#0d77c2" stroke-width="3.5"/>
  <g fill="#0d77c2" stroke="#fff" stroke-width="2"><circle cx="250" cy="236" r="7"/><circle cx="410" cy="176" r="7"/><circle cx="570" cy="116" r="7"/></g>
</svg>
