<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif">
  <style>
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flacker .5s ease-in-out infinite alternate}
    @keyframes flacker{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}} .dampf{animation:dampf 2.4s linear infinite}
    @keyframes dampf{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
    .feuer{transform-box:fill-box;transform-origin:50% 100%;animation:feuer 12s infinite}
    @keyframes feuer{0%,3%{transform:scale(.2)}20%,60%{transform:none}78%,100%{transform:scale(0)}}
    .heiss{animation:heiss 12s infinite} @keyframes heiss{0%,7%{opacity:0}10%,55%{opacity:1}58%,100%{opacity:0}}
    .quecks{transform-box:fill-box;transform-origin:50% 100%;animation:quecks 12s infinite}
    @keyframes quecks{0%,8%{transform:scaleY(.25)}44%,92%{transform:none}100%{transform:scaleY(.25)}}
    .grad{animation:grad 12s infinite} @keyframes grad{0%,40%{opacity:0}44%,95%{opacity:1}100%{opacity:0}}
    .roehrchen{animation:roehrchen 12s infinite}
    @keyframes roehrchen{0%,44%{opacity:1}46%,96%{opacity:0}100%{opacity:1}}
    .splitter{animation:splitter 12s infinite} @keyframes splitter{0%,43%{opacity:0}46%,52%{opacity:1}55%,100%{opacity:0}}
    .spruehen{animation:spruehen 12s infinite} @keyframes spruehen{0%,45%{opacity:0}48%,88%{opacity:1}91%,100%{opacity:0}}
    .tropfen{stroke-dasharray:4 10;animation:tropfen .5s linear infinite}
    @keyframes tropfen{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="320" fill="#f6f9fb"/>

  <rect y="0" width="640" height="46" fill="#dfe6ec"/>
  <rect x="30" y="34" width="560" height="10" rx="3" fill="#2f8fd8"/>
  <rect y="300" width="640" height="20" fill="#c9b8a0"/>
  <rect x="154" y="44" width="12" height="12" fill="#8e98a1"/><path d="M146 70 H174 L170 64 H150 Z" fill="#8e98a1"/>
  <g class=""><rect x="156" y="54" width="8" height="12" rx="3" fill="#e74c3c" stroke="#7b241c" stroke-width="1"/></g>
  <rect x="314" y="44" width="12" height="12" fill="#8e98a1"/><path d="M306 70 H334 L330 64 H310 Z" fill="#8e98a1"/>
  <g class="roehrchen"><rect x="316" y="54" width="8" height="12" rx="3" fill="#e74c3c" stroke="#7b241c" stroke-width="1"/></g>
  <rect x="474" y="44" width="12" height="12" fill="#8e98a1"/><path d="M466 70 H494 L490 64 H470 Z" fill="#8e98a1"/>
  <g class=""><rect x="476" y="54" width="8" height="12" rx="3" fill="#e74c3c" stroke="#7b241c" stroke-width="1"/></g>
  <g class="splitter" fill="#e74c3c"><rect x="304" y="78" width="4" height="4"/><rect x="334" y="84" width="4" height="4" transform="rotate(30 336 86)"/><rect x="318" y="94" width="3" height="5"/></g>
  <g class="spruehen" stroke="#2f8fd8" stroke-width="3" stroke-linecap="round"><line class="tropfen" x1="320" y1="72" x2="260" y2="250"/><line class="tropfen" x1="320" y1="72" x2="284" y2="250"/><line class="tropfen" x1="320" y1="72" x2="308" y2="250"/><line class="tropfen" x1="320" y1="72" x2="332" y2="250"/><line class="tropfen" x1="320" y1="72" x2="356" y2="250"/><line class="tropfen" x1="320" y1="72" x2="380" y2="250"/></g>
  <path d="M296 300 L290 254 H350 L344 300 Z" fill="#8e98a1" stroke="#59636b" stroke-width="2"/>
  <g class="feuer"><path class="flamme" d="M320 196 Q341.6 229 333.2 256 H306.8 Q298.4 229 320 196 Z" fill="#f39c12"/><path class="flamme" d="M320 220 Q329.6 239.2 326 256 H314 Q310.4 239.2 320 220 Z" fill="#f6c343"/></g>
  <g class="heiss"><path class="dampf" style="animation-delay:0s" d="M300 186 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-0.8s" d="M320 170 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-1.6s" d="M340 186 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-0.4s" d="M320 130 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#9aa3aa" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-1.2s" d="M304 110 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#9aa3aa" stroke-width="2.5" stroke-linecap="round"/><path class="dampf" style="animation-delay:-2s" d="M336 104 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#9aa3aa" stroke-width="2.5" stroke-linecap="round"/></g>
  <rect x="568" y="60" width="14" height="110" rx="7" fill="#ffffff" stroke="#6b7781" stroke-width="2"/>
  <rect class="quecks" x="572" y="66" width="6" height="104" fill="#e74c3c"/><circle cx="575" cy="178" r="11" fill="#e74c3c" stroke="#6b7781" stroke-width="2"/>
  <text x="560" y="110" text-anchor="end" font-size="15" font-weight="700" fill="#c0392b" class="grad">68 °C</text>
</svg>
