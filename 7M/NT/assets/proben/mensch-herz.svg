<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Schnitt durch das Herz von vorn mit vier nummerierten Räumen">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <!-- Herzmuskel -->
  <path d="M320 92C300 84 212 80 190 104C174 122 176 170 186 196C196 236 236 284 322 334C400 296 448 250 462 204C472 172 470 122 450 104C428 80 340 84 320 92Z" fill="#e9b4b9" stroke="#c4616a" stroke-width="3" stroke-linejoin="round"/>
  <!-- große Gefäße (ohne Farbe für den Sauerstoffgehalt) -->
  <g fill="none" stroke-linejoin="round">
    <path d="M110 135H210" stroke="#5f6b77" stroke-width="28"/><path d="M108 135H212" stroke="#8a97a3" stroke-width="22"/>
    <path d="M530 135H430" stroke="#5f6b77" stroke-width="28"/><path d="M532 135H428" stroke="#8a97a3" stroke-width="22"/>
    <path d="M296 204V70Q296 40 266 40H130" stroke="#5f6b77" stroke-width="26"/><path d="M296 206V70Q296 40 266 40H128" stroke="#8a97a3" stroke-width="20"/>
    <path d="M344 208V70Q344 40 374 40H510" stroke="#5f6b77" stroke-width="26"/><path d="M344 210V70Q344 40 374 40H512" stroke="#8a97a3" stroke-width="20"/>
  </g>
  <!-- vier Räume -->
  <g fill="#b0566e" stroke="#fff" stroke-width="2.500" stroke-linejoin="round">
    <rect x="198" y="104" width="84" height="62" rx="22"/>
    <rect x="358" y="104" width="84" height="62" rx="22"/>
    <path d="M204 190H312V300Q262 276 228 236Q208 212 204 190Z"/>
    <path d="M330 196H416Q414 220 398 244Q372 280 330 306Z"/>
  </g>
  <!-- Herzklappen -->
  <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round"><path d="M214 178H274"/><path d="M368 181H412"/><path d="M286 193H306"/><path d="M334 198H354"/></g>
  <!-- Fließrichtung -->
  <g fill="none" stroke="#fff" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 127l8 8-8 8"/><path d="M500 127l-8 8 8 8"/>
    <path d="M288 118l8-8 8 8"/><path d="M336 118l8-8 8 8"/>
    <path d="M196 32l-8 8 8 8"/><path d="M444 32l8 8-8 8"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <g font-size="16" font-weight="700" fill="#15212b">
      <text x="10" y="116">vom Körper</text><text x="630" y="116" text-anchor="end">von der Lunge</text>
      <text x="130" y="22">zur Lunge</text><text x="510" y="22" text-anchor="end">in den Körper</text>
    </g>
    <g font-size="16" font-style="italic" fill="#566674">
      <text x="10" y="348">rechte Seite des Menschen</text><text x="630" y="348" text-anchor="end">linke Seite des Menschen</text>
    </g>
  </g>
  <!-- Zahlen -->
  <g fill="#fff" stroke="#15212b" stroke-width="2.500"><circle cx="240" cy="135" r="15"/><circle cx="252" cy="238" r="15"/><circle cx="400" cy="135" r="15"/><circle cx="366" cy="240" r="15"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#15212b" text-anchor="middle">
    <text x="240" y="142">1</text><text x="252" y="245">2</text><text x="400" y="142">3</text><text x="366" y="247">4</text>
  </g>
</svg>
