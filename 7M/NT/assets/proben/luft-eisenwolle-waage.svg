<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Balkenwaage mit zwei Büscheln Eisenwolle. Das rechte Büschel wird entzündet und glüht durch. Danach sinkt die rechte Seite der Waage.">
  <rect width="640" height="400" fill="#f7fbfe"/>
  <rect x="0" y="352" width="640" height="48" fill="#d9c9a8"/>

  <!-- Ständer -->
  <rect x="284" y="342" width="72" height="12" rx="3" fill="#566674"/>
  <rect x="316" y="88" width="8" height="256" fill="#8a97a3"/>
  <path d="M296 168q24 10 48 0" fill="none" stroke="#566674" stroke-width="3"/>
  <line x1="320" y1="162" x2="320" y2="178" stroke="#566674" stroke-width="3"/>

  <!-- Brenner unter dem rechten Büschel -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.26;0.42;0.45;1" dur="12s" repeatCount="indefinite"/>
    <rect x="486" y="342" width="40" height="10" rx="2" fill="#566674"/>
    <rect x="499" y="286" width="14" height="58" fill="#8a97a3" stroke="#6b7782" stroke-width="1.5"/>
    <path d="M492 286Q506 196 520 286Z" fill="#6ab7ee"/>
    <path d="M500 286Q506 236 512 286Z" fill="#cfe9fb"/>
  </g>

  <!-- Balken mit Zeiger -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 320 90;0 320 90;7 320 90;7 320 90" keyTimes="0;0.40;0.68;1" dur="12s" repeatCount="indefinite"/>
    <line x1="320" y1="90" x2="320" y2="158" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="90" x2="510" y2="90" stroke="#3a444d" stroke-width="9" stroke-linecap="round"/>
  </g>
  <circle cx="320" cy="90" r="9" fill="#15212b"/>

  <!-- linkes Büschel -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -23;0 -23" keyTimes="0;0.40;0.68;1" dur="12s" repeatCount="indefinite"/>
    <line x1="134" y1="90" x2="134" y2="172" stroke="#566674" stroke-width="2.5"/>
    <ellipse cx="134" cy="200" rx="36" ry="30" fill="#b4bcc3"/>
    <path d="M106 192q12 -18 26 -4t26 -8M104 206q14 -16 28 0t28 -4M112 220q12 -12 24 0t20 -2M118 180q10 -8 18 2t16 -4M100 188q-8 -4 -6 -12M114 174q-4 -8 4 -12M142 170q4 -8 12 -4M164 182q8 -4 10 4M170 204q8 2 4 10M158 222q6 6 2 12M134 230q-2 8 -10 4M108 218q-8 4 -12 -4" fill="none" stroke="#6f7a83" stroke-width="2.2" stroke-linecap="round"/>
    <text x="143" y="150" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#15212b">Eisenwolle</text>
  </g>

  <!-- rechtes Büschel: frisch, glühend, durchgeglüht -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 23;0 23" keyTimes="0;0.40;0.68;1" dur="12s" repeatCount="indefinite"/>
    <line x1="506" y1="90" x2="506" y2="172" stroke="#566674" stroke-width="2.5"/>
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.27;0.31;1" dur="12s" repeatCount="indefinite"/>
      <ellipse cx="506" cy="200" rx="36" ry="30" fill="#b4bcc3"/>
      <path d="M478 192q12 -18 26 -4t26 -8M476 206q14 -16 28 0t28 -4M484 220q12 -12 24 0t20 -2M490 180q10 -8 18 2t16 -4M472 188q-8 -4 -6 -12M486 174q-4 -8 4 -12M514 170q4 -8 12 -4M536 182q8 -4 10 4M542 204q8 2 4 10M530 222q6 6 2 12M506 230q-2 8 -10 4M480 218q-8 4 -12 -4" fill="none" stroke="#6f7a83" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.31;0.58;0.68;1" dur="12s" repeatCount="indefinite"/>
      <ellipse cx="506" cy="200" rx="36" ry="30" fill="#f2992e"/>
      <ellipse cx="506" cy="200" rx="22" ry="17" fill="#ffd34d"><animate attributeName="rx" values="22;27;20;25;22" dur="1.2s" repeatCount="indefinite"/></ellipse>
      <path d="M478 192q12 -18 26 -4t26 -8M476 206q14 -16 28 0t28 -4M484 220q12 -12 24 0t20 -2M490 180q10 -8 18 2t16 -4M472 188q-8 -4 -6 -12M486 174q-4 -8 4 -12M514 170q4 -8 12 -4M536 182q8 -4 10 4M542 204q8 2 4 10M530 222q6 6 2 12M506 230q-2 8 -10 4M480 218q-8 4 -12 -4" fill="none" stroke="#c2401c" stroke-width="2.2" stroke-linecap="round"/>
      <g fill="#f2992e"><circle cx="460" cy="186" r="2.6"/><circle cx="550" cy="176" r="2.4"/><circle cx="468" cy="232" r="2.2"/><circle cx="552" cy="222" r="2.8"/></g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.68;1" dur="12s" repeatCount="indefinite"/>
      <ellipse cx="506" cy="200" rx="36" ry="30" fill="#3d4650"/>
      <path d="M478 192q12 -18 26 -4t26 -8M476 206q14 -16 28 0t28 -4M484 220q12 -12 24 0t20 -2M490 180q10 -8 18 2t16 -4M472 188q-8 -4 -6 -12M486 174q-4 -8 4 -12M514 170q4 -8 12 -4M536 182q8 -4 10 4M542 204q8 2 4 10M530 222q6 6 2 12M506 230q-2 8 -10 4M480 218q-8 4 -12 -4" fill="none" stroke="#1b2229" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="515" y="150" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#15212b">Eisenwolle</text>
  </g>

  <!-- Texte zu den drei Schritten -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="320" y="382">1 · Links und rechts hängt gleich viel Eisenwolle.
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.26;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="382" opacity="0">2 · Das rechte Büschel wird entzündet und glüht durch.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.26;0.64;0.68;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="382" opacity="0">3 · Nach dem Glühen: Die rechte Seite ist gesunken.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
