<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Säulendiagramm: Puls in Ruhe, direkt nach dem Sprint und nach drei Minuten Pause">
  <rect width="520" height="340" fill="#fff"/>
  <text x="260" y="26" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b">Puls eines Schülers vor und nach einem Sprint</text>
  <g stroke="#d8e2ea" stroke-width="1">
    <line x1="80" y1="250" x2="490" y2="250"/><line x1="80" y1="200" x2="490" y2="200"/><line x1="80" y1="150" x2="490" y2="150"/><line x1="80" y1="100" x2="490" y2="100"/><line x1="80" y1="50" x2="490" y2="50"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#566674" text-anchor="end">
    <text x="72" y="254">0</text><text x="72" y="204">40</text><text x="72" y="154">80</text><text x="72" y="104">120</text><text x="72" y="54">160</text>
  </g>
  <line x1="80" y1="40" x2="80" y2="250" stroke="#15212b" stroke-width="2"/>
  <line x1="80" y1="250" x2="490" y2="250" stroke="#15212b" stroke-width="2"/>
  <text transform="translate(28 150) rotate(-90)" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15212b">Schläge pro Minute</text>
  <g fill="#e0453a">
    <rect x="125" y="160" width="80" height="90"/><rect x="245" y="65" width="80" height="185"/><rect x="365" y="140" width="80" height="110"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="165" y="154">72</text><text x="285" y="59">148</text><text x="405" y="134">88</text>
    <text x="165" y="272">in Ruhe</text><text x="285" y="272">direkt nach</text><text x="285" y="290">dem Sprint</text><text x="405" y="272">nach 3 Minuten</text><text x="405" y="290">Pause</text>
  </g>
</svg>
