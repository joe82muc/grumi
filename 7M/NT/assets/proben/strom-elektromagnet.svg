<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animation: Ein Eisennagel steckt in einer Spule, die mit Batterie und Schalter verbunden ist. Bei geschlossenem Schalter hängen Büroklammern am Nagel, bei offenem Schalter fallen sie ab">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <rect x="0" y="328" width="640" height="32" fill="#d9c9a8"/>
  <!-- Leitungen -->
  <g fill="none" stroke="#33414d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 152V230H190"/><path d="M410 116V50H180"/><path d="M120 50H60V230H90"/>
  </g>
  <!-- Batterie -->
  <rect x="82" y="222" width="10" height="16" rx="2" fill="#8a97a3"/><rect x="188" y="222" width="10" height="16" rx="2" fill="#8a97a3"/>
  <rect x="90" y="208" width="100" height="44" rx="8" fill="#2b3a4a"/>
  <!-- Eisennagel -->
  <rect x="206" y="118" width="10" height="32" rx="2" fill="#7d8791"/>
  <rect x="216" y="128" width="250" height="12" fill="#9aa5ad"/>
  <polygon points="466,128 486,134 466,140" fill="#9aa5ad"/>
  <!-- Spule -->
  <g fill="none" stroke="#c0692b" stroke-width="4.5">
    <ellipse cx="250" cy="134" rx="8" ry="19"/><ellipse cx="270" cy="134" rx="8" ry="19"/><ellipse cx="290" cy="134" rx="8" ry="19"/><ellipse cx="310" cy="134" rx="8" ry="19"/><ellipse cx="330" cy="134" rx="8" ry="19"/><ellipse cx="350" cy="134" rx="8" ry="19"/><ellipse cx="370" cy="134" rx="8" ry="19"/><ellipse cx="390" cy="134" rx="8" ry="19"/><ellipse cx="410" cy="134" rx="8" ry="19"/>
  </g>
  <!-- Schalter -->
  <g fill="#33414d"><circle cx="120" cy="50" r="5.5"/><circle cx="180" cy="50" r="5.5"/></g>
  <line x1="120" y1="50" x2="180" y2="50" stroke="#33414d" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 120 50;0 120 50;-32 120 50;-32 120 50;0 120 50;0 120 50" keyTimes="0;0.45;0.5;0.92;0.95;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle">
    <text x="310" y="32" fill="#1b8a4b">Schalter geschlossen<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.47;0.94" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="310" y="32" fill="#c93b3b" opacity="0">Schalter offen<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.47;0.94" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <!-- Büroklammern -->
  <g fill="none" stroke="#4d5a66" stroke-width="2.4" stroke-linecap="round">
    <g transform="translate(490 148)">
      <animateTransform attributeName="transform" type="translate" values="490 148;490 148;462 322;462 322;490 148;490 148" keyTimes="0;0.5;0.57;0.95;0.985;1" dur="8s" repeatCount="indefinite"/>
      <path d="M-4-11V7a4 4 0 0 0 8 0V-8a2.6 2.6 0 0 0-5.2 0V5"><animateTransform attributeName="transform" type="rotate" values="0;0;90;90;0;0" keyTimes="0;0.5;0.57;0.95;0.985;1" dur="8s" repeatCount="indefinite"/></path>
    </g>
    <g transform="translate(490 174)">
      <animateTransform attributeName="transform" type="translate" values="490 174;490 174;496 322;496 322;490 174;490 174" keyTimes="0;0.5;0.56;0.95;0.985;1" dur="8s" repeatCount="indefinite"/>
      <path d="M-4-11V7a4 4 0 0 0 8 0V-8a2.6 2.6 0 0 0-5.2 0V5"><animateTransform attributeName="transform" type="rotate" values="0;0;-90;-90;0;0" keyTimes="0;0.5;0.56;0.95;0.985;1" dur="8s" repeatCount="indefinite"/></path>
    </g>
    <g transform="translate(490 200)">
      <animateTransform attributeName="transform" type="translate" values="490 200;490 200;530 322;530 322;490 200;490 200" keyTimes="0;0.5;0.55;0.95;0.985;1" dur="8s" repeatCount="indefinite"/>
      <path d="M-4-11V7a4 4 0 0 0 8 0V-8a2.6 2.6 0 0 0-5.2 0V5"><animateTransform attributeName="transform" type="rotate" values="0;0;90;90;0;0" keyTimes="0;0.5;0.55;0.95;0.985;1" dur="8s" repeatCount="indefinite"/></path>
    </g>
    <g transform="translate(490 226)">
      <animateTransform attributeName="transform" type="translate" values="490 226;490 226;562 322;562 322;490 226;490 226" keyTimes="0;0.5;0.54;0.95;0.985;1" dur="8s" repeatCount="indefinite"/>
      <path d="M-4-11V7a4 4 0 0 0 8 0V-8a2.6 2.6 0 0 0-5.2 0V5"><animateTransform attributeName="transform" type="rotate" values="0;0;-90;-90;0;0" keyTimes="0;0.5;0.54;0.95;0.985;1" dur="8s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#566674">
    <text x="140" y="236" text-anchor="middle" fill="#fff">Batterie</text>
    <text x="198" y="140" text-anchor="end">Eisennagel</text>
    <text x="330" y="100" text-anchor="middle">Spule</text>
    <text x="150" y="80" text-anchor="middle">Schalter</text>
    <text x="512" y="196">Büroklammern</text>
  </g>
</svg>
