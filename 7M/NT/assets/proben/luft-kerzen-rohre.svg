<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="Vier brennende Kerzen in Glasrohren A bis D. Zwei Rohre stehen auf Bleistiften, zwei sind oben mit einer Glasplatte verschlossen.">
  <defs>
    <linearGradient id="krFlamme" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f2862e"/></linearGradient>
  </defs>
  <rect width="640" height="390" fill="#f7fbfe"/>
  <text x="320" y="24" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15212b">Start des Versuchs: Alle vier Kerzen brennen.</text>
  <!-- Tisch -->
  <rect x="14" y="300" width="612" height="16" rx="3" fill="#6b7680"/>

  <!-- Rohr A: auf dem Tisch, oben offen -->
  <g transform="translate(92 300)">
    <rect x="-10" y="-64" width="20" height="64" rx="3" fill="#f4efe2" stroke="#b9ae93" stroke-width="2"/>
    <line x1="0" y1="-64" x2="0" y2="-72" stroke="#3a444d" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(0 -70)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.94 1.07;1.04 0.96;1 1" dur="0.9s" repeatCount="indefinite"/>
      <path d="M0 0C-12 -6 -11 -22 0 -40C11 -22 12 -6 0 0Z" fill="url(#krFlamme)"/><path d="M0 -2C-5 -6 -5 -14 0 -22C5 -14 5 -6 0 -2Z" fill="#fff3b0"/>
    </g></g>
  </g>
  <g stroke="#8fb4cf" stroke-width="5" stroke-linecap="round"><line x1="54" y1="112" x2="54" y2="298"/><line x1="130" y1="112" x2="130" y2="298"/></g>
  <rect x="56" y="112" width="72" height="186" fill="#cfe9fb" opacity=".28"/>

  <!-- Rohr B: auf dem Tisch, oben Glasplatte -->
  <g transform="translate(244 300)">
    <rect x="-10" y="-64" width="20" height="64" rx="3" fill="#f4efe2" stroke="#b9ae93" stroke-width="2"/>
    <line x1="0" y1="-64" x2="0" y2="-72" stroke="#3a444d" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(0 -70)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.94 1.07;1.04 0.96;1 1" dur="0.9s" repeatCount="indefinite"/>
      <path d="M0 0C-12 -6 -11 -22 0 -40C11 -22 12 -6 0 0Z" fill="url(#krFlamme)"/><path d="M0 -2C-5 -6 -5 -14 0 -22C5 -14 5 -6 0 -2Z" fill="#fff3b0"/>
    </g></g>
  </g>
  <g stroke="#8fb4cf" stroke-width="5" stroke-linecap="round"><line x1="206" y1="112" x2="206" y2="298"/><line x1="282" y1="112" x2="282" y2="298"/></g>
  <rect x="208" y="112" width="72" height="186" fill="#cfe9fb" opacity=".28"/>
  <rect x="192" y="100" width="104" height="10" rx="2" fill="#a9d3ee" stroke="#5f8fb0" stroke-width="2"/>

  <!-- Rohr C: auf zwei Bleistiften, oben offen -->
  <g transform="translate(396 300)">
    <rect x="-10" y="-64" width="20" height="64" rx="3" fill="#f4efe2" stroke="#b9ae93" stroke-width="2"/>
    <line x1="0" y1="-64" x2="0" y2="-72" stroke="#3a444d" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(0 -70)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.94 1.07;1.04 0.96;1 1" dur="0.9s" repeatCount="indefinite"/>
      <path d="M0 0C-12 -6 -11 -22 0 -40C11 -22 12 -6 0 0Z" fill="url(#krFlamme)"/><path d="M0 -2C-5 -6 -5 -14 0 -22C5 -14 5 -6 0 -2Z" fill="#fff3b0"/>
    </g></g>
  </g>
  <g><circle cx="358" cy="291" r="8" fill="#f2c94c" stroke="#a8862a" stroke-width="2"/><circle cx="358" cy="291" r="2.6" fill="#3a444d"/><circle cx="434" cy="291" r="8" fill="#f2c94c" stroke="#a8862a" stroke-width="2"/><circle cx="434" cy="291" r="2.6" fill="#3a444d"/></g>
  <g stroke="#8fb4cf" stroke-width="5" stroke-linecap="round"><line x1="358" y1="96" x2="358" y2="280"/><line x1="434" y1="96" x2="434" y2="280"/></g>
  <rect x="360" y="96" width="72" height="186" fill="#cfe9fb" opacity=".28"/>

  <!-- Rohr D: auf zwei Bleistiften, oben Glasplatte -->
  <g transform="translate(548 300)">
    <rect x="-10" y="-64" width="20" height="64" rx="3" fill="#f4efe2" stroke="#b9ae93" stroke-width="2"/>
    <line x1="0" y1="-64" x2="0" y2="-72" stroke="#3a444d" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(0 -70)"><g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.94 1.07;1.04 0.96;1 1" dur="0.9s" repeatCount="indefinite"/>
      <path d="M0 0C-12 -6 -11 -22 0 -40C11 -22 12 -6 0 0Z" fill="url(#krFlamme)"/><path d="M0 -2C-5 -6 -5 -14 0 -22C5 -14 5 -6 0 -2Z" fill="#fff3b0"/>
    </g></g>
  </g>
  <g><circle cx="510" cy="291" r="8" fill="#f2c94c" stroke="#a8862a" stroke-width="2"/><circle cx="510" cy="291" r="2.6" fill="#3a444d"/><circle cx="586" cy="291" r="8" fill="#f2c94c" stroke="#a8862a" stroke-width="2"/><circle cx="586" cy="291" r="2.6" fill="#3a444d"/></g>
  <g stroke="#8fb4cf" stroke-width="5" stroke-linecap="round"><line x1="510" y1="96" x2="510" y2="280"/><line x1="586" y1="96" x2="586" y2="280"/></g>
  <rect x="512" y="96" width="72" height="186" fill="#cfe9fb" opacity=".28"/>
  <rect x="496" y="84" width="104" height="10" rx="2" fill="#a9d3ee" stroke="#5f8fb0" stroke-width="2"/>

  <!-- Buchstaben -->
  <g fill="#0d77c2"><circle cx="92" cy="56" r="16"/><circle cx="244" cy="56" r="16"/><circle cx="396" cy="56" r="16"/><circle cx="548" cy="56" r="16"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="92" y="63">A</text><text x="244" y="63">B</text><text x="396" y="63">C</text><text x="548" y="63">D</text>
  </g>
  <!-- Beschreibung -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="92" y="340">auf dem Tisch</text><text x="244" y="340">auf dem Tisch</text><text x="396" y="340">auf zwei Bleistiften</text><text x="548" y="340">auf zwei Bleistiften</text>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#566674" text-anchor="middle">
    <text x="92" y="360">oben offen</text><text x="244" y="360">oben: Glasplatte</text><text x="396" y="360">oben offen</text><text x="548" y="360">oben: Glasplatte</text>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#566674" text-anchor="middle">
    <text x="396" y="379">(unten bleibt ein Spalt)</text><text x="548" y="379">(unten bleibt ein Spalt)</text>
  </g>
</svg>
