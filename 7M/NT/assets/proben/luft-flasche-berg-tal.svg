<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-label="Links eine zugeschraubte Plastikflasche auf einem Berggipfel. Rechts dieselbe Flasche im Tal: Sie wird an den Seiten eingedrückt.">
  <rect width="640" height="372" fill="#eaf5fd"/>

  <!-- links: Gipfel -->
  <path d="M0 293L40 252L82 276L132 238L190 280L242 248L320 293Z" fill="#c5d2dc"/>
  <rect x="0" y="293" width="320" height="27" fill="#9aa7b4"/>
  <g fill="#ffffff"><ellipse cx="60" cy="296" rx="34" ry="5"/><ellipse cx="250" cy="297" rx="44" ry="6"/></g>
  <g stroke="#7a4e2a" stroke-width="7" stroke-linecap="round"><line x1="56" y1="196" x2="56" y2="292"/><line x1="36" y1="222" x2="76" y2="222"/></g>

  <!-- rechts: Tal -->
  <path d="M478 293L578 104L640 196V293Z" fill="#c5d2dc"/>
  <path d="M578 104L556 146L572 138L582 152L594 136L606 146Z" fill="#ffffff"/>
  <rect x="320" y="293" width="320" height="27" fill="#9ccc65"/>
  <g>
    <rect x="500" y="254" width="52" height="40" fill="#f4e3c8" stroke="#c9ad85" stroke-width="2"/>
    <path d="M494 256L526 230L558 256Z" fill="#c9503f"/>
    <rect x="510" y="266" width="12" height="12" fill="#6b7a86"/><rect x="532" y="270" width="12" height="24" fill="#8d5a31"/>
  </g>
  <g><rect x="603" y="270" width="6" height="24" fill="#8d5a31"/><circle cx="606" cy="258" r="18" fill="#5fa64a"/></g>

  <!-- Überschriften -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#15212b" text-anchor="middle">
    <text x="150" y="34">Auf dem Gipfel</text><text x="425" y="34">Im Tal</text>
  </g>

  <!-- Pfeil -->
  <g stroke="#566674" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 204H364"/><path d="M350 192L364 204L350 216"/>
  </g>
  <text x="288" y="190" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#566674">hinunter ins Tal</text>

  <!-- Flasche auf dem Gipfel -->
  <g transform="translate(117 128) scale(1.5)">
    <path d="M14 0H30V14C30 22 42 26 42 38C42 56 42 74 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C2 74 2 56 2 38C2 26 14 22 14 14Z" fill="#dff1fc" stroke="#4f86ad" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M9 44V90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <rect x="11" y="-9" width="22" height="11" rx="2" fill="#2f6fdb"/>
  </g>

  <!-- Flasche im Tal: wird eingedrückt -->
  <g transform="translate(392 128) scale(1.5)">
    <path d="M14 0H30V14C30 22 42 26 42 38C27 54 27 76 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C17 76 17 54 2 38C2 26 14 22 14 14Z" fill="#dff1fc" stroke="#4f86ad" stroke-width="1.8" stroke-linejoin="round">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.45;0.95;1"
        values="M14 0H30V14C30 22 42 26 42 38C42 56 42 74 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C2 74 2 56 2 38C2 26 14 22 14 14Z;M14 0H30V14C30 22 42 26 42 38C42 56 42 74 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C2 74 2 56 2 38C2 26 14 22 14 14Z;M14 0H30V14C30 22 42 26 42 38C27 54 27 76 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C17 76 17 54 2 38C2 26 14 22 14 14Z;M14 0H30V14C30 22 42 26 42 38C27 54 27 76 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C17 76 17 54 2 38C2 26 14 22 14 14Z;M14 0H30V14C30 22 42 26 42 38C42 56 42 74 42 92C42 104 38 110 30 110H14C6 110 2 104 2 92C2 74 2 56 2 38C2 26 14 22 14 14Z"/>
    </path>
    <g stroke="#4f86ad" stroke-width="1.4" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.45;0.95;1" values="0;0;1;1;0"/>
      <path d="M16 50L24 62L15 74"/><path d="M29 52L22 66L28 80"/>
    </g>
    <rect x="11" y="-9" width="22" height="11" rx="2" fill="#2f6fdb"/>
  </g>

  <!-- Beschreibung -->
  <rect x="0" y="320" width="640" height="52" fill="#ffffff"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="150" y="344">leere Flasche,</text><text x="150" y="363">fest zugeschraubt</text>
    <text x="470" y="344">dieselbe Flasche,</text><text x="470" y="363">immer noch zugeschraubt</text>
  </g>
</svg>
