<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Animation zum Glasglocken-Modell: Die Gummihaut wird nach unten gezogen und losgelassen, der Luftballon wird größer und kleiner">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <rect x="0" y="332" width="640" height="28" fill="#d9c9a8"/>
  <!-- Gestell -->
  <rect x="210" y="250" width="10" height="82" fill="#8a97a3"/><rect x="420" y="250" width="10" height="82" fill="#8a97a3"/>
  <!-- Glasglocke -->
  <path d="M220 250V100Q220 50 270 50H370Q420 50 420 100V250" fill="rgba(190,225,245,.35)" stroke="#7fb3d6" stroke-width="5" stroke-linejoin="round"/>
  <!-- Glasrohr und Stopfen -->
  <rect x="311" y="6" width="18" height="118" fill="#d6ecf8" stroke="#7fb3d6" stroke-width="2"/>
  <rect x="290" y="42" width="60" height="18" rx="4" fill="#8a5a2b"/>
  <!-- Luftballon -->
  <rect x="311" y="116" width="18" height="12" fill="#f4a6b5"/>
  <ellipse cx="320" cy="152" rx="24" ry="30" fill="#f4a6b5" stroke="#d9768f" stroke-width="3">
    <animate attributeName="rx" values="24;50;50;24;24" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="30;56;56;30;30" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="152;178;178;152;152" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Gummihaut -->
  <path d="M220 250Q320 250 420 250" fill="none" stroke="#e0993a" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M220 250Q320 250 420 250;M220 250Q320 340 420 250;M220 250Q320 340 420 250;M220 250Q320 250 420 250;M220 250Q320 250 420 250" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 45;0 45;0 0;0 0" keyTimes="0;0.35;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    <line x1="320" y1="250" x2="320" y2="266" stroke="#8a5a2b" stroke-width="5"/>
    <circle cx="320" cy="274" r="10" fill="#8a5a2b"/>
  </g>
  <!-- Luft strömt ein und aus -->
  <g fill="none" stroke="#1d8fd6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 8V32M341 24l9 10 9-10" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.32;0.37;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M350 36V12M341 20l9-10 9 10" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.82;0.87;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="368" y="29" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#1d8fd6">Luft</text>
  <!-- Hinweis zum Ziehen -->
  <g fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M452 270V312M444 280l8-10 8 10M444 302l8 10 8-10"/></g>
  <text font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#c0392b"><tspan x="470" y="286">ziehen und</tspan><tspan x="470" y="307">loslassen</tspan></text>
  <!-- Buchstaben -->
  <g stroke="#15212b" stroke-width="1.6"><line x1="150" y1="130" x2="218" y2="130"/><line x1="490" y1="150" x2="348" y2="152"/><line x1="150" y1="282" x2="230" y2="254"/></g>
  <g fill="#15212b"><circle cx="138" cy="130" r="15"/><circle cx="502" cy="150" r="15"/><circle cx="138" cy="286" r="15"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">
    <text x="138" y="137">A</text><text x="502" y="157">B</text><text x="138" y="293">C</text>
  </g>
</svg>
