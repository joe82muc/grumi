<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" role="img" aria-label="Vier Gläser A bis D mit je einem blanken Eisennagel: trockene Luft, Leitungswasser, abgekochtes Wasser unter Öl, Salzwasser.">
  <rect width="640" height="326" fill="#f7fbfe"/>
  <text x="320" y="26" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15212b">Tag 0: In jedem Glas steht ein blanker Eisennagel.</text>
  <rect x="0" y="264" width="640" height="7" fill="#d9c9a8"/>

  <!-- Glas A: trockene Luft mit Trockenmittel, Deckel -->
  <rect x="34" y="76" width="108" height="16" rx="5" fill="#c9a26b" stroke="#9a7a48" stroke-width="1.5"/>
  <g fill="#e8f1f8" stroke="#9fb2c1" stroke-width="1.5">
    <circle cx="50" cy="254" r="5"/><circle cx="62" cy="255" r="5"/><circle cx="74" cy="254" r="5"/><circle cx="86" cy="255" r="5"/><circle cx="98" cy="254" r="5"/><circle cx="110" cy="255" r="5"/><circle cx="122" cy="254" r="5"/>
    <circle cx="56" cy="246" r="5"/><circle cx="80" cy="246" r="5"/><circle cx="104" cy="246" r="5"/>
  </g>
  <g stroke="#7d8791" stroke-linecap="round"><line x1="66" y1="240" x2="112" y2="116" stroke-width="7"/><line x1="103.5" y1="113" x2="120.5" y2="119" stroke-width="6"/></g>

  <!-- Glas B: Leitungswasser, offen -->
  <path d="M193 170V250q0 12 12 12h76q12 0 12-12V170z" fill="#a9d8f5"/>
  <g stroke="#7d8791" stroke-linecap="round"><line x1="221" y1="250" x2="267" y2="112" stroke-width="7"/><line x1="258.5" y1="109" x2="275.5" y2="115" stroke-width="6"/></g>

  <!-- Glas C: abgekochtes Wasser unter Öl -->
  <path d="M348 140V250q0 12 12 12h76q12 0 12-12V140z" fill="#a9d8f5"/>
  <rect x="348" y="124" width="100" height="16" fill="#f2c94c"/>
  <g stroke="#7d8791" stroke-linecap="round"><line x1="372" y1="250" x2="424" y2="160" stroke-width="7"/><line x1="416.2" y1="155.5" x2="431.8" y2="164.5" stroke-width="6"/></g>
  <text x="456" y="137" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#8a6d0a">Öl</text>

  <!-- Glas D: Salzwasser, offen -->
  <path d="M503 170V250q0 12 12 12h76q12 0 12-12V170z" fill="#a9d8f5"/>
  <g fill="#ffffff" stroke="#9fb2c1" stroke-width="1.5"><rect x="514" y="251" width="8" height="8"/><rect x="530" y="252" width="8" height="8"/><rect x="566" y="252" width="8" height="8"/><rect x="582" y="251" width="8" height="8"/><rect x="549" y="253" width="7" height="7"/></g>
  <g stroke="#7d8791" stroke-linecap="round"><line x1="531" y1="250" x2="577" y2="112" stroke-width="7"/><line x1="568.5" y1="109" x2="585.5" y2="115" stroke-width="6"/></g>

  <!-- Glaswände -->
  <g fill="none" stroke="#8a97a3" stroke-width="4" stroke-linecap="round">
    <path d="M38 88V250q0 14 14 14h72q14 0 14-14V88"/>
    <path d="M193 88V250q0 14 14 14h72q14 0 14-14V88"/>
    <path d="M348 88V250q0 14 14 14h72q14 0 14-14V88"/>
    <path d="M503 88V250q0 14 14 14h72q14 0 14-14V88"/>
  </g>

  <!-- Buchstaben -->
  <g fill="#0d77c2"><circle cx="88" cy="54" r="16"/><circle cx="243" cy="54" r="16"/><circle cx="398" cy="54" r="16"/><circle cx="553" cy="54" r="16"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="88" y="61">A</text><text x="243" y="61">B</text><text x="398" y="61">C</text><text x="553" y="61">D</text>
  </g>
  <!-- Beschreibung -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="88" y="292">trockene Luft</text><text x="243" y="292">Leitungswasser</text><text x="398" y="292">abgekochtes Wasser</text><text x="553" y="292">Salzwasser</text>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#566674" text-anchor="middle">
    <text x="88" y="311">Trockenmittel, Deckel zu</text><text x="243" y="311">Glas offen</text><text x="398" y="311">unter einer Ölschicht</text><text x="553" y="311">Glas offen</text>
  </g>
</svg>
