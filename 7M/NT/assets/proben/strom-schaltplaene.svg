      <text x="86" y="153">+</text><text x="87" y="178">–</text>
      <text x="294" y="153">+</text><text x="295" y="178">–</text>
      <text x="502" y="153">+</text><text x="503" y="178">–</text>
    </g>
    <g font-size="20" font-weight="800" text-anchor="middle">
      <text x="117" y="296">Schaltplan A</text><text x="325" y="296">Schaltplan B</text><text x="533" y="296">Schaltplan C</text>
    </g>
  </g>
</svg>
