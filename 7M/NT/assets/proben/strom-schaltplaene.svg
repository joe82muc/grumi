<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Drei Schaltpläne A, B und C mit Spannungsquelle, Schalter und Glühlampe">
  <rect width="640" height="360" fill="#fff"/>
  <g stroke="#15212b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
