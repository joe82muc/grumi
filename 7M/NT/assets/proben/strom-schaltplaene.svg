    <circle cx="596" cy="155" r="19"/><path d="M582.600 141.600L609.400 168.400M609.400 141.600L582.600 168.400"/>
  </g>
  <g fill="#15212b">
    <circle cx="84" cy="70" r="4.500"/><circle cx="124" cy="70" r="4.500"/>
    <circle cx="292" cy="70" r="4.500"/><circle cx="332" cy="70" r="4.500"/>
    <circle cx="500" cy="70" r="4.500"/><circle cx="540" cy="70" r="4.500"/>
    <circle cx="562" cy="70" r="5.500"/><circle cx="562" cy="240" r="5.500"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#15212b">
