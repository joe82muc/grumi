    <line x1="238" y1="148" x2="286" y2="148"/><line x1="250" y1="166" x2="274" y2="166" stroke-width="8"/>
    <circle cx="388" cy="155" r="19"/><path d="M374.600 141.600L401.400 168.400M401.400 141.600L374.600 168.400"/>
    <!-- Schaltplan C: Schalter geschlossen, zusätzliche Leitung -->
    <path d="M470 148V70H500"/><path d="M500 70H540"/><path d="M540 70H596V136"/><path d="M596 174V240H470V166"/>
    <path d="M562 70V240"/>
