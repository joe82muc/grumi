    <path d="M54 148V70H84"/><path d="M84 70H124"/><path d="M124 70H180V136"/><path d="M180 174V240H54V166"/>
    <line x1="30" y1="148" x2="78" y2="148"/><line x1="42" y1="166" x2="66" y2="166" stroke-width="8"/>
    <circle cx="180" cy="155" r="19"/><path d="M166.600 141.600L193.400 168.400M193.400 141.600L166.600 168.400"/>
