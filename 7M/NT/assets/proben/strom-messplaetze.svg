<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Schaltplan mit Batterie und Lampe. Drei mögliche Plätze für ein Messgerät: Platz 1 neben der Batterie, Platz 2 in der Leitung, Platz 3 neben der Lampe">
  <rect width="640" height="360" fill="#fff"/>
  <!-- Stromkreis -->
  <g fill="none" stroke="#15212b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M200 164V70H440V142"/><path d="M440 186V270H200V182"/>
    <line x1="174" y1="164" x2="226" y2="164"/><line x1="187" y1="182" x2="213" y2="182" stroke-width="8"/>
  </g>
  <!-- gestrichelte Leitungen zu Platz 1 und Platz 3 -->
  <g fill="none" stroke="#8a97a3" stroke-width="2.5" stroke-dasharray="7 5">
    <path d="M200 110H96V148"/><path d="M96 198V236H200"/>
    <path d="M440 110H544V142"/><path d="M544 186V236H440"/>
  </g>
  <g fill="#15212b"><circle cx="200" cy="110" r="4.5"/><circle cx="200" cy="236" r="4.5"/><circle cx="440" cy="110" r="4.5"/><circle cx="440" cy="236" r="4.5"/></g>
  <!-- Lampe -->
  <circle cx="440" cy="164" r="22" fill="#ffe066" stroke="#15212b" stroke-width="3"/>
  <path d="M424.4 148.4L455.6 179.6M455.6 148.4L424.4 179.6" stroke="#15212b" stroke-width="3" stroke-linecap="round"/>
  <!-- drei Plätze -->
  <g fill="#fff6dd" stroke="#b77a06" stroke-width="3" stroke-dasharray="6 4">
    <circle cx="96" cy="173" r="25"/><circle cx="320" cy="70" r="25"/><circle cx="544" cy="164" r="25"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <g font-size="24" font-weight="800" fill="#8a5a00" text-anchor="middle"><text x="96" y="181.500">1</text><text x="320" y="78.500">2</text><text x="544" y="172.500">3</text></g>
    <g font-size="19" font-weight="800"><text x="236" y="166" fill="#c93b3b">+</text><text x="237" y="192" fill="#2f6fdb">–</text></g>
    <g font-size="17" font-weight="700" fill="#566674"><text x="262" y="180">Batterie</text><text x="408" y="170" text-anchor="end">Lampe</text></g>
    <text x="320" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#15212b">1, 2 und 3: mögliche Plätze für ein Messgerät</text>
  </g>
</svg>
