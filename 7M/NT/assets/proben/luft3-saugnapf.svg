<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .napf{transform-box:fill-box;transform-origin:50% 100%;animation:napf 10s infinite}
    @keyframes napf{0%,18%{transform:translateY(-14px)}32%,95%{transform:scaleY(.62)}100%{transform:translateY(-14px)}}
    .hand{animation:hand 10s infinite}
    @keyframes hand{0%,14%{transform:translateY(-40px);opacity:0}18%{opacity:1;transform:translateY(-20px)}32%{transform:translateY(8px);opacity:1}40%,100%{transform:translateY(-60px);opacity:0}}
    .rausL{animation:rausL 10s infinite}.rausR{animation:rausR 10s infinite}
    @keyframes rausL{0%,20%{transform:none}32%,95%{transform:translateX(-120px)}100%{transform:none}}
    @keyframes rausR{0%,20%{transform:none}32%,95%{transform:translateX(120px)}100%{transform:none}}
    .druck{animation:druck 10s infinite} @keyframes druck{0%,40%{opacity:0}44%,95%{opacity:1}100%{opacity:0}}
    .zit{animation:zit .45s ease-in-out infinite alternate}
    @keyframes zit{from{transform:translate(-2px,2px)}to{transform:translate(2px,-2px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="640" height="300" fill="#f6f9fb"/>

  <rect y="246" width="640" height="54" fill="#cfd8de"/>
  <line x1="0" y1="246" x2="0" y2="300" stroke="#ffffff" stroke-width="3"/><line x1="160" y1="246" x2="160" y2="300" stroke="#ffffff" stroke-width="3"/><line x1="320" y1="246" x2="320" y2="300" stroke="#ffffff" stroke-width="3"/><line x1="480" y1="246" x2="480" y2="300" stroke="#ffffff" stroke-width="3"/><line x1="640" y1="246" x2="640" y2="300" stroke="#ffffff" stroke-width="3"/>
  <line x1="0" y1="246" x2="640" y2="246" stroke="#9aa9b5" stroke-width="2"/>
  <circle class="zit" style="animation-delay:0s" cx="60" cy="120" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.06s" cx="110" cy="80" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.12s" cx="160" cy="140" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.18s" cx="90" cy="190" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.24s" cx="200" cy="60" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.3s" cx="240" cy="110" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.36s" cx="400" cy="60" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.42s" cx="440" cy="120" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.48s" cx="500" cy="80" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.54s" cx="560" cy="140" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.6s" cx="520" cy="190" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.6599999999999999s" cx="590" cy="100" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.72s" cx="140" cy="220" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.78s" cx="480" cy="220" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.84s" cx="300" cy="40" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.8999999999999999s" cx="350" cy="70" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-0.96s" cx="60" cy="230" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-1.02s" cx="580" cy="230" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-1.08s" cx="210" cy="190" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" style="animation-delay:-1.14s" cx="430" cy="180" r="4.5" fill="#2f8fd8" opacity=".8"/>
  <g class="rausL"><circle class="zit" cx="296" cy="230" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" cx="306" cy="214" r="4.5" fill="#2f8fd8" opacity=".8"/></g>
  <g class="rausR"><circle class="zit" cx="344" cy="230" r="4.5" fill="#2f8fd8" opacity=".8"/><circle class="zit" cx="332" cy="212" r="4.5" fill="#2f8fd8" opacity=".8"/></g>
  <circle class="zit" cx="320" cy="236" r="4.5" fill="#2f8fd8" opacity=".8"/>
  <g class="napf"><path d="M250 246 Q256 196 300 188 V160 H340 V188 Q384 196 390 246 Z" fill="#e74c3c" fill-opacity=".55" stroke="#a52a23" stroke-width="3"/></g>
  <g class="hand"><path d="M300 150 Q300 120 320 118 Q340 120 340 150 Z" fill="#f2c7a5" stroke="#b98a68" stroke-width="2"/><rect x="306" y="60" width="28" height="62" fill="#7aa6c9"/></g>
  <g class="druck"><g transform="rotate(0 230 186)"><path d="M204 186 H224 M217 180 L224 186 L217 192" fill="none" stroke="#e8731c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(180 410 186)"><path d="M384 186 H404 M397 180 L404 186 L397 192" fill="none" stroke="#e8731c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(90 320 104)"><path d="M294 104 H314 M307 98 L314 104 L307 110" fill="none" stroke="#e8731c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(45 262 132)"><path d="M236 132 H256 M249 126 L256 132 L249 138" fill="none" stroke="#e8731c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="rotate(135 378 132)"><path d="M352 132 H372 M365 126 L372 132 L365 138" fill="none" stroke="#e8731c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
