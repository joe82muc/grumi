<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Mehrfachsteckdose an einer Leitung mit 16-Ampere-Sicherung. Angeschlossen sind ein Waffeleisen mit etwa 5 Ampere, eine Kaffeemaschine mit etwa 4 Ampere und ein Wasserkocher mit etwa 9 Ampere">
  <rect width="640" height="360" fill="#f7fbfe"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#15212b">Mehrfachsteckdose beim Schulfest</text>
  <!-- Sicherungskasten -->
  <rect x="14" y="64" width="150" height="128" rx="10" fill="#cfd8df" stroke="#8a97a3" stroke-width="3"/>
  <rect x="62" y="98" width="54" height="52" rx="6" fill="#fff" stroke="#566674" stroke-width="2"/>
  <rect x="78" y="104" width="22" height="26" rx="4" fill="#1b8a4b"/>
  <!-- Zuleitung -->
  <path d="M164 122H236" fill="none" stroke="#7d8791" stroke-width="9"/>
  <!-- Mehrfachsteckdose -->
  <rect x="236" y="92" width="388" height="60" rx="12" fill="#fff" stroke="#566674" stroke-width="3"/>
  <g fill="#eef2f5" stroke="#566674" stroke-width="2.5"><circle cx="300" cy="122" r="19"/><circle cx="430" cy="122" r="19"/><circle cx="560" cy="122" r="19"/></g>
  <g fill="#15212b"><circle cx="293" cy="122" r="3"/><circle cx="307" cy="122" r="3"/><circle cx="423" cy="122" r="3"/><circle cx="437" cy="122" r="3"/><circle cx="553" cy="122" r="3"/><circle cx="567" cy="122" r="3"/></g>
  <!-- Kabel zu den Geräten -->
  <g fill="none" stroke="#33414d" stroke-width="4" stroke-linecap="round"><path d="M300 141V226"/><path d="M430 141V226"/><path d="M560 141V226"/></g>
  <g fill="#33414d"><rect x="290" y="138" width="20" height="16" rx="3"/><rect x="420" y="138" width="20" height="16" rx="3"/><rect x="550" y="138" width="20" height="16" rx="3"/></g>
  <!-- Geräte -->
  <g fill="#fff" stroke="#566674" stroke-width="2.5">
    <rect x="238" y="226" width="124" height="92" rx="10"/><rect x="368" y="226" width="124" height="92" rx="10"/><rect x="498" y="226" width="124" height="92" rx="10"/>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#15212b">
      <text x="89" y="86">Sicherungskasten</text>
      <text x="300" y="258">Waffeleisen</text><text x="430" y="258">Kaffeemaschine</text><text x="560" y="258">Wasserkocher</text>
    </g>
    <g font-size="20" font-weight="800" fill="#0d5b86"><text x="300" y="296">etwa 5 A</text><text x="430" y="296">etwa 4 A</text><text x="560" y="296">etwa 9 A</text></g>
    <text x="89" y="176" font-size="18" font-weight="800" fill="#15212b">Sicherung 16 A</text>
    <text x="200" y="110" font-size="13" font-weight="700" fill="#566674">Zuleitung</text>
  </g>
</svg>
