<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Zwei Gasbrenner. Brenner A hat eine große gelbe Flamme, die Luftzufuhr ist geschlossen. Brenner B hat eine kleinere blaue Flamme, die Luftzufuhr ist offen.">
  <defs>
    <linearGradient id="gbGelb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f2992e"/></linearGradient>
  </defs>
  <rect width="640" height="380" fill="#f7fbfe"/>
  <rect x="0" y="330" width="640" height="12" fill="#d9c9a8"/>

  <!-- Brenner A: Luftzufuhr geschlossen, gelbe Flamme -->
  <g transform="translate(180 164)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.07 0.93;0.95 1.05;1.04 0.97;1 1" dur="1s" repeatCount="indefinite"/>
      <path d="M0 0C-32 -18 -28 -68 0 -122C28 -68 32 -18 0 0Z" fill="url(#gbGelb)"/>
      <path d="M0 -2C-13 -12 -11 -36 0 -64C11 -36 13 -12 0 -2Z" fill="#fff3b0" opacity=".8"/>
    </g>
  </g>
  <g fill="#5b6168">
    <circle cx="176" cy="34" r="4" opacity=".5"><animate attributeName="cy" values="40;14" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="187" cy="30" r="3" opacity=".5"><animate attributeName="cy" values="38;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M126 330h108l-12-22H138z" fill="#4a5560"/>
  <rect x="164" y="170" width="32" height="140" rx="3" fill="#aab4bd" stroke="#6b7782" stroke-width="2"/>
  <rect x="160" y="164" width="40" height="10" rx="3" fill="#8a97a3" stroke="#6b7782" stroke-width="2"/>
  <rect x="158" y="278" width="44" height="26" rx="4" fill="#566674"/>
  <ellipse cx="171" cy="291" rx="1.6" ry="8" fill="#15212b"/><ellipse cx="189" cy="291" rx="1.6" ry="8" fill="#15212b"/>
  <path d="M234 320H296" fill="none" stroke="#3d8f6c" stroke-width="9" stroke-linecap="round"/>

  <!-- Brenner B: Luftzufuhr offen, blaue Flamme -->
  <g transform="translate(460 164)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.03 0.97;0.98 1.02;1 1" dur="0.5s" repeatCount="indefinite"/>
      <path d="M0 0C-16 -14 -14 -44 0 -84C14 -44 16 -14 0 0Z" fill="#7fbdff"/>
      <path d="M0 0C-7 -8 -6 -24 0 -42C6 -24 7 -8 0 0Z" fill="#2f6fdb"/>
    </g>
  </g>
  <g stroke="#2f6fdb" fill="none" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.25;1" dur="0.6s" repeatCount="indefinite"/>
    <path d="M426 110q-8 16 0 32"/><path d="M414 102q-12 24 0 48"/><path d="M494 110q8 16 0 32"/><path d="M506 102q12 24 0 48"/>
  </g>
  <path d="M406 330h108l-12-22H418z" fill="#4a5560"/>
  <rect x="444" y="170" width="32" height="140" rx="3" fill="#aab4bd" stroke="#6b7782" stroke-width="2"/>
  <rect x="440" y="164" width="40" height="10" rx="3" fill="#8a97a3" stroke="#6b7782" stroke-width="2"/>
  <rect x="438" y="278" width="44" height="26" rx="4" fill="#566674"/>
  <ellipse cx="451" cy="291" rx="6" ry="8" fill="#15212b"/><ellipse cx="469" cy="291" rx="6" ry="8" fill="#15212b"/>
  <path d="M514 320H576" fill="none" stroke="#3d8f6c" stroke-width="9" stroke-linecap="round"/>

  <!-- Buchstaben und Beschriftung -->
  <g fill="#0d77c2"><circle cx="92" cy="70" r="20"/><circle cx="372" cy="70" r="20"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="92" y="78">A</text><text x="372" y="78">B</text>
  </g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15212b">
    <text x="60" y="287">Luftzufuhr</text><text x="340" y="287">Luftzufuhr</text>
    <text x="266" y="308" fill="#2c6e53">Gas</text><text x="546" y="308" fill="#2c6e53">Gas</text>
  </g>
  <g stroke="#566674" stroke-width="1.5"><line x1="126" y1="291" x2="156" y2="291"/><line x1="406" y1="291" x2="436" y2="291"/></g>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15212b" text-anchor="middle">
    <text x="180" y="366">Luftzufuhr geschlossen</text><text x="460" y="366">Luftzufuhr offen</text>
  </g>
</svg>
